:root{
 --vase:#1C211B;      
 --vase2:#283026;
 --jonc:#5E6B4F;      
 --mur:#E7E3D8;       
 --mur2:#D9D3C3;
 --brume:#F5F4EF;     
 --bouchon:#C9362B;   
 --bouchon-f:#A12820;
 --lentille:#B9C46A;  
 --encre:#1C211B;
 --gris:#4C5348;
 --clair:#EDEBE3;
 --r:6px;
 --titre:"Anybody","Rethink Sans",system-ui,sans-serif;
 --texte:"Rethink Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
 --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-color:var(--jonc) var(--mur)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--brume);color:var(--encre);font:400 17px/1.6 var(--texte);font-feature-settings:"tnum" 0}
::selection{background:var(--bouchon);color:#fff}
::-webkit-scrollbar{width:11px;height:8px}::-webkit-scrollbar-track{background:var(--mur)}::-webkit-scrollbar-thumb{background:var(--jonc);border-radius:8px;border:2px solid var(--mur)}
:focus-visible{outline:3px solid var(--bouchon);outline-offset:3px;border-radius:3px}
a{color:inherit;text-decoration-color:var(--bouchon);text-decoration-thickness:2px;text-underline-offset:4px}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--titre);font-stretch:116%;font-weight:760;letter-spacing:-.015em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,6.4vw,5rem)}
h2{font-size:clamp(1.9rem,4.2vw,3.3rem);margin-bottom:.45em}
h3{font-size:clamp(1.2rem,1.9vw,1.55rem);font-stretch:110%;font-weight:700;line-height:1.12}
p{margin:0 0 1em;max-width:66ch}
.lead{font-size:clamp(1.08rem,1.5vw,1.25rem);line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.w{width:min(1240px,100% - 2*clamp(16px,4vw,48px));margin-inline:auto}
.sec{padding:clamp(64px,9vw,128px) 0}
.sec-s{padding:clamp(44px,6vw,80px) 0}
.sombre{background:var(--vase);color:var(--clair)}
.sombre p{color:#D6D8CC}
.pierre{background:var(--mur)}
.cache{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


.btn{display:inline-flex;align-items:center;gap:.6em;min-height:48px;padding:.75em 1.35em;border-radius:999px;border:2px solid transparent;font:600 1rem/1.1 var(--texte);text-decoration:none;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease)}
.btn-r{background:var(--bouchon);color:#fff}
.btn-r:hover{background:var(--bouchon-f)}
.btn-c{border-color:currentColor;background:transparent;color:inherit}
.btn-c:hover{background:var(--encre);color:var(--brume);border-color:var(--encre)}
.sombre .btn-c:hover,.heros .btn-c:hover{background:var(--brume);color:var(--encre);border-color:var(--brume)}
.btn svg{width:18px;height:18px;flex:none}
.lien{font-weight:600;text-decoration:underline;text-decoration-color:var(--bouchon);display:inline-flex;gap:.4em;align-items:center}
.lien:hover{color:var(--bouchon-f)}
.sombre .lien:hover{color:var(--lentille)}


.ent{position:sticky;top:0;z-index:50;background:rgba(245,244,239,.96);border-bottom:1px solid var(--mur2);backdrop-filter:saturate(1.2) blur(6px)}
.ent-l{display:flex;align-items:center;gap:16px;min-height:68px}
.marque{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--encre);margin-right:auto;min-width:0}
.marque svg{width:26px;height:40px;flex:none}
.marque b{font-family:var(--titre);font-stretch:125%;font-weight:800;font-size:1.06rem;letter-spacing:-.01em;line-height:1;display:block;white-space:nowrap}
.marque small{display:block;font-size:.74rem;color:var(--gris);letter-spacing:.02em;white-space:nowrap}
.langue{position:relative}
.langue select{appearance:none;font:600 .92rem var(--texte);color:var(--encre);background:var(--brume);border:2px solid var(--encre);border-radius:999px;min-height:42px;padding:.45em 2.2em .45em 1em;cursor:pointer}
.langue::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--encre);border-bottom:2px solid var(--encre);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ent .btn{min-height:42px;padding:.55em 1.1em}
.nav{border-top:1px solid var(--mur2);position:relative}
.nav ul{list-style:none;margin:0 auto;padding:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:12px 9px;font-weight:500;font-size:.92rem;text-decoration:none;color:var(--gris);border-bottom:3px solid transparent}
.nav a:hover{color:var(--encre)}
.nav a[aria-current="page"]{color:var(--encre);border-bottom-color:var(--bouchon)}
.nav a.cons{color:var(--bouchon-f);font-weight:700}
.nav::after{content:"";position:absolute;right:0;top:0;bottom:0;width:44px;background:linear-gradient(90deg,rgba(245,244,239,0),var(--brume));pointer-events:none}
@media (max-width:820px){.ent .btn-txt{display:none}.ent .btn{padding:.55em .8em}.marque small{display:none}}
@media (max-width:440px){.marque b{font-size:.86rem;white-space:normal;line-height:1.05}.marque svg{width:20px;height:34px}.langue select{padding:.45em 1.9em .45em .7em;font-size:.86rem;max-width:118px}}


.heros{position:relative;min-height:min(88vh,860px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--vase)}
.heros>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.heros::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,33,27,.05) 30%,rgba(28,33,27,.55) 62%,rgba(28,33,27,.92) 100%);z-index:1}
.heros-c{position:relative;z-index:2;padding-bottom:clamp(28px,5vw,56px);padding-top:120px}
.heros h1{max-width:13ch;color:#fff}
.heros .lead{max-width:44ch;margin:.8em 0 1.4em;color:#EEF0E6}
.faits{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 26px;padding:0;list-style:none;font-size:.95rem;color:#E4E7DA}
.faits li{display:flex;gap:8px;align-items:center}
.faits li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lentille)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.eau{position:relative;z-index:2;height:120px;margin-top:10px}
.eau .ligne{position:absolute;left:0;right:0;top:70px;height:1px;background:rgba(255,255,255,.55)}
.bouchon{position:absolute;left:clamp(24px,62%,calc(100% - 90px));top:0;width:44px;height:114px;transform-origin:50% 70%;animation:flotte 4.2s ease-in-out infinite}
.bouchon svg{width:100%;height:100%;overflow:visible;transition:transform .7s var(--ease)}
.ronds{position:absolute;left:calc(clamp(24px,62%,calc(100% - 90px)) - 98px);top:52px;width:240px;height:40px;pointer-events:none}
.ronds ellipse{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.2;transform-origin:80px 14px;transform:scale(.1);opacity:0}
.mord .bouchon svg{transform:translateY(28px)}
.mord .ronds ellipse{animation:rond 1.6s var(--ease) forwards}
.mord .ronds ellipse:nth-child(2){animation-delay:.18s}.mord .ronds ellipse:nth-child(3){animation-delay:.36s}
.mot{position:absolute;top:10px;font:780 1.6rem/1 var(--titre);font-stretch:120%;color:var(--bouchon);background:var(--brume);padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .5s var(--ease);left:calc(clamp(24px,62%,calc(100% - 90px)) + 58px);white-space:nowrap}
.mord .mot{opacity:1;transform:none}
@keyframes flotte{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2.5deg)}}
@keyframes rond{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1);opacity:0}}
@media (max-width:620px){.bouchon{left:18%}.ronds{left:calc(18% - 98px)}.mot{left:calc(18% + 56px);font-size:1.3rem}}


.apparait{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .9s var(--ease)}
.apparait.vu{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.apparait{opacity:1;transform:none}}


.rives{display:grid;gap:clamp(40px,6vw,88px)}
.rive{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(22px,4vw,64px);align-items:center}
.rive:nth-child(even){grid-template-columns:1fr 1.15fr}
.rive:nth-child(even) .rive-img{order:2}
.rive-img{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:var(--r)}
.rive-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.rive:hover .rive-img img{transform:scale(1.03)}
.rive .info{font-size:.95rem;color:var(--gris);margin:-.3em 0 1.1em;display:flex;flex-wrap:wrap;gap:4px 16px}
@media (max-width:760px){.rive,.rive:nth-child(even){grid-template-columns:1fr}.rive:nth-child(even) .rive-img{order:0}}


.gammes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:var(--mur2);border:2px solid var(--mur2);border-radius:var(--r);overflow:hidden}
.gamme{background:var(--brume);text-decoration:none;display:flex;flex-direction:column;min-width:0}
.gamme img{aspect-ratio:1/1;object-fit:cover;width:100%;filter:saturate(.95)}
.gamme div{padding:14px 14px 18px}
.gamme b{display:block;font-family:var(--titre);font-stretch:112%;font-size:1.12rem;line-height:1.1;margin-bottom:4px}
.gamme span{font-size:.9rem;color:var(--gris)}
.gamme em{font-style:normal;display:block;margin-top:8px;font-weight:700;color:var(--bouchon-f)}
.gamme:hover b{text-decoration:underline;text-decoration-color:var(--bouchon)}
@media (max-width:1000px){.gammes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.gammes{grid-template-columns:repeat(2,minmax(0,1fr))}}


.hist{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch}
.hist img{width:100%;height:100%;object-fit:cover;min-height:340px}
.hist .t{padding:clamp(28px,6vw,80px)}
.hist .chiffre{font-family:var(--titre);font-stretch:140%;font-weight:800;font-size:clamp(3rem,8vw,6rem);line-height:.9;color:var(--bouchon);letter-spacing:-.03em;display:block;margin-bottom:.15em}
@media (max-width:760px){.hist{grid-template-columns:1fr}}
.losanges{height:14px;background:repeating-linear-gradient(90deg,transparent 0 0);--l:14px;background-image:conic-gradient(from -45deg at 50% 50%,var(--bouchon) 0 90deg,transparent 0 360deg);background-size:var(--l) var(--l);opacity:.9}


.ligne-dist{list-style:none;margin:0;padding:0;border-top:1px solid rgba(237,235,227,.25)}
.ligne-dist li{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid rgba(237,235,227,.18)}
.ligne-dist .km{font-family:var(--titre);font-stretch:125%;font-weight:700;font-size:1.25rem;color:var(--lentille);font-variant-numeric:tabular-nums}
.ligne-dist b{font-weight:600;font-size:1.06rem}
.ligne-dist small{display:block;color:#C3C7B8;font-size:.92rem;margin-top:2px}
.ligne-dist .cat{font-size:.8rem;color:#C3C7B8;border:1px solid rgba(237,235,227,.35);border-radius:999px;padding:2px 10px;white-space:nowrap}
@media (max-width:560px){.ligne-dist li{grid-template-columns:78px 1fr}.ligne-dist .cat{display:none}}


.deux{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:start}
.trois{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,3vw,36px)}
@media (max-width:860px){.deux,.trois{grid-template-columns:1fr}}
.photo{border-radius:var(--r);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.mosaique{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:180px;gap:8px}
.mosaique figure{margin:0;overflow:hidden;border-radius:4px;background:var(--mur)}
.mosaique figure.g{grid-column:span 2;grid-row:span 2}
.mosaique figure.h{grid-row:span 2}
.mosaique img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.mosaique figure:hover img{transform:scale(1.04)}
@media (max-width:760px){.mosaique{grid-template-columns:repeat(2,1fr);grid-auto-rows:140px}}


.tarifs{width:100%;border-collapse:collapse;font-size:.98rem}
.tarifs th,.tarifs td{padding:13px 10px;border-bottom:1px solid var(--mur2);text-align:left;vertical-align:top}
.tarifs td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.tarifs th{font-weight:600}
.puces{list-style:none;padding:0;margin:0 0 1em}
.puces li{padding:9px 0 9px 26px;position:relative;border-bottom:1px solid var(--mur2)}
.puces li::before{content:"";position:absolute;left:4px;top:18px;width:8px;height:8px;transform:rotate(45deg);background:var(--bouchon)}
.sombre .puces li{border-color:rgba(237,235,227,.18)}
.encadre{background:var(--mur);border-radius:var(--r);padding:clamp(20px,3vw,32px)}
.sombre .encadre{background:var(--vase2)}


.tete{padding:clamp(40px,7vw,96px) 0 clamp(24px,4vw,48px)}
.tete .fil{font-size:.88rem;color:var(--gris);margin-bottom:18px}
.tete .fil a{color:var(--gris)}
.tete h1{font-size:clamp(2.2rem,6vw,4.6rem);max-width:16ch}
.tete .lead{margin-top:.8em;color:var(--gris);max-width:58ch}
.bandeau{aspect-ratio:21/8;border-radius:var(--r);overflow:hidden}
.bandeau img{width:100%;height:100%;object-fit:cover}
@media (max-width:620px){.bandeau{aspect-ratio:4/3}}
.suite{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}


.filtres{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.filtres button{font:600 .95rem var(--texte);min-height:42px;padding:.5em 1.05em;border-radius:999px;border:2px solid var(--encre);background:transparent;color:var(--encre);cursor:pointer}
.filtres button[aria-pressed="true"]{background:var(--encre);color:var(--brume)}
.filtres button:hover{border-color:var(--bouchon)}
.hebs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,2.6vw,32px)}
@media (max-width:960px){.hebs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.hebs{grid-template-columns:1fr}}
.heb{text-decoration:none;display:flex;flex-direction:column;border-top:3px solid var(--encre);padding-top:14px}
.heb .im{aspect-ratio:3/2;overflow:hidden;border-radius:4px;margin-bottom:14px;background:var(--mur)}
.heb .im img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.heb:hover .im img{transform:scale(1.04)}
.heb .g{font-size:.82rem;font-weight:700;letter-spacing:.03em;color:var(--jonc);margin-bottom:4px}
.heb h3{margin-bottom:8px}
.heb .car{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem;color:var(--gris);margin-bottom:10px}
.heb .prix{margin-top:auto;font-weight:700;font-size:1.02rem}
.heb .prix span{color:var(--bouchon-f)}
.heb:hover h3{text-decoration:underline;text-decoration-color:var(--bouchon);text-underline-offset:5px}
.fiche{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
@media (max-width:900px){.fiche{grid-template-columns:1fr}}
.fiche .gal{display:grid;gap:8px}
.fiche .gal img{border-radius:4px;width:100%;aspect-ratio:3/2;object-fit:cover}
.fiche .gal .pt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fiche .gal .pt img{aspect-ratio:4/3}
.fiche aside{position:sticky;top:130px}
.car-l{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--mur2);border:2px solid var(--mur2);border-radius:var(--r);overflow:hidden;margin:18px 0}
.car-l div{background:var(--brume);padding:12px 10px;text-align:center}
.car-l b{display:block;font-family:var(--titre);font-stretch:120%;font-size:1.25rem}
.car-l span{font-size:.82rem;color:var(--gris)}
.illu{font-size:.8rem;color:var(--gris);margin-top:4px}


form .champ{display:grid;gap:6px;margin-bottom:14px}
label{font-weight:600;font-size:.95rem}
input,textarea,select.f{font:400 1rem var(--texte);color:var(--encre);background:#fff;border:2px solid var(--mur2);border-radius:8px;padding:.75em .9em;min-height:48px;width:100%}
input:focus,textarea:focus{border-color:var(--encre);outline:none;box-shadow:0 0 0 3px rgba(201,54,43,.25)}
.erreur{color:var(--bouchon-f);font-size:.88rem;min-height:1em}
.ok{background:var(--vase);color:var(--clair);padding:16px 18px;border-radius:8px}
textarea{min-height:130px;resize:vertical}


.pied{background:var(--vase);color:#D6D8CC;padding:clamp(48px,7vw,88px) 0 28px;font-size:.95rem}

lac:{t:"El lago y la pesca",l:"El camping linda con el lago de Torigny, en el antiguo parque del castillo de los Matignon.",

 artT:"Unsere Ausflugsideen",art:["Normandie zu zweit: Ideen für ein romantisches Wochenende","Normandie mit der Familie: Aktivitäten, Besichtigungen und Ausflüge mit Kindern","Normandie bei Regen: Ideen für Familien und Paare","Normandie: die schönsten Orte für 2026","Die Manche: Aktivitäten, Besichtigungen und Ausflüge für Familien und Naturfreunde","Die Manche bei Regen: Aktivitäten und Besichtigungen bei schlechtem Wetter","Bester Campingplatz der Normandie: 5 gute Gründe, im Camping du Lac des Charmilles zu buchen"],
 futT:"Und für Ihren nächsten Urlaub",fut:"Lorient und das Morbihan, die Küste bei Royan, Longeville-sur-Mer in der Vendée: unsere Reiseideen für andere Regionen Frankreichs."},
histoire:{t:"Seit über 60 Jahren am Weiher",l:"Der Campingplatz liegt neben dem Schloss, in dem der Graf von Matignon Louise de Grimaldi empfing.",
 a:"1715 heiratet Graf Jacques IV. de Matignon, Herr von Torigni, Louise de Grimaldi, die einzige Tochter des Fürsten von Monaco. Bis 1841, unter Honoré V., kehren die Matignon oft ins Schloss zurück, auch nachdem sie Namen und Wappen der Grimaldi angenommen haben.",
 murT:"Die „Grimaldi-Mauer“",mur:"Um seine Frau vor den Winterwinden zu schützen, ließ Jacques de Matignon eine Mauer von 300 Metern Länge und 12 Metern Höhe errichten. Auch die Spuren der alten Schlossgräben sind an den Weihern noch zu sehen.",
 chT:"Ein Schloss, das noch steht",ch:"In der Revolution beschlagnahmt und 1817 von der Stadt zurückgekauft, wurde das Schloss bei den Bombardierungen 1944 teilweise zerstört. Sein vollständig restaurierter Südflügel beherbergt heute das Rathaus.",
 cpT:"Der Campingplatz",cp:"Er entstand vor gut 60 Jahren als Gemeindecampingplatz am Ortseingang, keine 10 Gehminuten von den Geschäften. Verpachtet, wurde er von den Vorgängern der heutigen Besitzer ausgebaut, die seit 2018 hier sind und ihn mit neuen Mietunterkünften, klassisch oder besonders, weiterentwickeln.",
 ecoT:"Mit Blick auf Nachhaltigkeit",eco:"Ohne seine Geschichte zu vergessen, setzt der Platz auf naturnahe Unterkünfte wie die Coco Sweet: bequem, eingerichtet wie ein kleines Ferienhaus, ohne eigenes Bad."},
galerie:{t:"Der Campingplatz in Bildern",l:"Der Weiher, das Schwimmbad, die Unterkünfte, die Abende."},

lac:{t:"Lo stagno e la pesca",l:"Il campeggio confina con lo stagno di Torigny, nell'antico parco del castello dei Matignon.",
 a:"Dalla vostra casa mobile, dallo chalet o dalla tenda, siete in riva all'acqua. Il giro dello stagno passa sotto i tigli, tra le anatre e i resti di una fortezza che non ha ancora svelato tutti i suoi segreti. Area picnic, giochi per bambini e pedalò per i pomeriggi tranquilli.",
 pT:"Pescare senza prendere l'auto",p:"Stagno di 2ª categoria. Permessi di pesca giornalieri o settimanali in vendita alla reception.",
 gT:"Cosa garantisce il marchio Alloggio pesca",g:["Un sito di pesca di buona qualità ambientale","Un locale per riporre l'attrezzatura","Un punto acqua per sciacquare l'attrezzatura","Vasche per esche vive","Informazioni e documentazione: guide, corsi di avviamento, regolamenti"],
 aaT:"La Gaule Torignaise (associazione di pesca)",aa:"In 1ª categoria, 40 km di ruscelli intorno al campeggio: l'Hamel, il Balençon, la Jacre, i Nonains, il Lonel, il Lamberville e il Brectouville. L'associazione pubblica il suo piano di gestione ittica. Le associazioni di pesca fanno capo alla Federazione nazionale della pesca in Francia (FNPF).",
 auT:"E intorno allo stagno",au:"Escursioni a piedi, in bici o a cavallo, canoa sulla Vire, ferrocicli su vecchie linee ferroviarie, arrampicata sulle falesie di scisto delle Roches de Ham, bungee jumping, zipline, percorso avventura sugli alberi. E per la storia: i musei e le spiagge dello Sbarco, il Memoriale di Caen, il Mont-Saint-Michel, le isole Chausey e il maneggio nazionale di Saint-Lô."},
piscine:{t:"La piscina coperta e riscaldata",l:"12 × 6 m di acqua calda, un solarium e lettini.",
 a:"Coperta o scoperta secondo la stagione, fa la gioia di grandi e piccoli già da aprile. Dopo una giornata sulle strade della Normandia, è qui che tutti si ritrovano per qualche vasca prima di cena.",
 infos:["Aperta dal 18 aprile al 30 settembre","Riscaldata dal 1° maggio al 15 settembre","Tutti i giorni dalle 10:00 alle 21:00"]},
anim:{t:"Animazione e tempo libero",l:"Giochi semplici, serate che uniscono e sei alpaca.",
 b:[["Per i più piccoli","Parco giochi con gonfiabile e trampolino, campo polivalente. E un piccolo branco di sei alpaca, da osservare senza contatto diretto."],["Sport","Tornei di calcio, basket, pallamano o pallavolo sul campo polivalente, ping-pong, bocce e la piscina coperta."],["Momenti tranquilli","Angolo lettura, scacchi e dama giganti per grandi e piccoli."],["A luglio e agosto","Di giorno, le strutture sono vostre. La sera, due appuntamenti a settimana: una cena a base di cozze e patatine e una cena spettacolo. Cozze ogni venerdì sera, su prenotazione."]],
 auT:"Nei dintorni",au:"Escursioni, canoa sulla Vire, pedalò e pesca sugli stagni, ferrocicli a Condé-sur-Vire, arrampicata alle Roches de Ham, bungee jumping al viadotto della Souleuvre, percorso avventura sullo stagno Mayya."},
resto:{t:"Il bar, snack e ristorante",l:"Un po' di fame, tanta sete: è a pochi metri dal vostro alloggio.",
 barT:"Il bar",bar:"Il punto d'incontro del campeggio, dopo la piscina o una giornata di visite. Al banco o sulla grande terrazza al sole: bibite fresche, con o senza alcol, e gelati. Aperto dalla primavera all'autunno.",
 restT:"Il ristorante",rest:"Da inizio giugno a metà settembre, la sera dalle 18:00 alle 22:30, sul posto o da asporto: prosciutto alla griglia, salsiccia, camembert al forno, trippa, taglio del macellaio, croque-monsieur, pizze. E serate a tema."},
