<style>
@font-face{font-family:"Young Serif";font-weight:400;font-display:swap;src:url(fonts/young-serif-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Young Serif";font-weight:400;font-display:swap;src:url(fonts/young-serif-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}

@font-face{font-family:"Figtree";font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}

:root{
 --granit:#ECEBE6;--granit2:#DAD8D0;--pierre:#C9C6BB;--encre:#1D211F;--gris:#4C524E;
 --genet:#E8B12C;--genet-f:#9A6B00;--paturage:#34402A;--paturage2:#4A5A3B;--aligot:#F5ECD4;--blanc:#fff;
 --titre:"Young Serif",Georgia,serif;--texte:"Figtree",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-color:var(--paturage2) var(--granit2)}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-track{background:var(--granit2)}::-webkit-scrollbar-thumb{background:var(--paturage2);border-radius:6px}
body{margin:0;background:var(--granit);color:var(--encre);font:400 1.0625rem/1.6 var(--texte);font-variant-numeric:lining-nums}
img{max-width:100%;display:block}
a{color:var(--paturage);text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{color:var(--genet-f)}
::selection{background:var(--genet);color:var(--encre)}
:focus-visible{outline:3px solid var(--genet);outline-offset:2px;border-radius:2px}
h1,h2,h3{font-family:var(--titre);font-weight:400;line-height:1.05;letter-spacing:-.01em;margin:0 0 .45em;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
h2{font-size:clamp(2rem,4.4vw,3.5rem)}
h3{font-size:clamp(1.3rem,2vw,1.6rem)}
p{margin:0 0 1em;max-width:64ch;text-wrap:pretty}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:700 .95rem/1 var(--texte);padding:1em 1.4em;border-radius:999px;border:2px solid var(--encre);background:var(--encre);color:#fff;text-decoration:none;cursor:pointer;transition:background .25s,color .25s,transform .25s var(--ease)}
.btn:hover{background:var(--paturage);border-color:var(--paturage);color:#fff;transform:translateY(-1px)}
.btn.jaune{background:var(--genet);border-color:var(--genet);color:var(--encre)}
.btn.jaune:hover{background:#F3C350;border-color:#F3C350;color:var(--encre)}
.btn.ligne{background:transparent;color:var(--encre)}
.btn.ligne:hover{background:var(--encre);color:#fff}
.suite{font-weight:700;text-decoration:none;color:var(--encre);background-image:linear-gradient(var(--genet),var(--genet));background-size:100% 3px;background-repeat:no-repeat;background-position:0 100%;padding-bottom:3px;transition:background-size .3s}
.suite:hover{background-size:100% 100%;color:var(--encre)}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

header.top{position:sticky;top:0;z-index:40;background:rgba(236,235,230,.96);border-bottom:1px solid var(--pierre)}
.bar1{display:flex;align-items:center;gap:16px;padding:12px 24px;max-width:1400px;margin:0 auto}
.logo{text-decoration:none;color:var(--encre);line-height:1}
.logo b{font:400 1.55rem/1 var(--titre);display:block}
.logo small{font:600 .72rem/1.4 var(--texte);letter-spacing:.05em;color:var(--gris)}
.sp{flex:1}
.ouvert{font-size:.9rem;color:var(--gris);white-space:nowrap}
.tel{font-weight:700;text-decoration:none;color:var(--encre);display:flex;gap:.4em;align-items:center;white-space:nowrap}
.langue{display:flex;align-items:center;gap:6px;border:2px solid var(--encre);border-radius:999px;padding:0 6px 0 12px;background:#fff}
.langue select{border:0;background:transparent;font:600 .9rem var(--texte);color:var(--encre);padding:8px 4px;cursor:pointer}
nav.menu{border-top:1px solid var(--pierre);position:relative}
nav.menu ul{list-style:none;margin:0 auto;padding:0 24px;display:flex;gap:2px;max-width:1400px;overflow-x:auto;scrollbar-width:none}
nav.menu ul::-webkit-scrollbar{display:none}
nav.menu a{display:block;padding:11px 12px;white-space:nowrap;text-decoration:none;color:var(--encre);font:600 .95rem var(--texte);position:relative}
nav.menu a::after{content:"";position:absolute;left:12px;right:12px;bottom:6px;height:3px;background:var(--genet);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
nav.menu a:hover::after,nav.menu a[aria-current=page]::after{transform:none}
nav.menu a.conseil{color:var(--paturage2)}
nav.menu::after{content:"";position:absolute;right:0;top:0;bottom:0;width:40px;background:linear-gradient(90deg,rgba(236,235,230,0),var(--granit));pointer-events:none}

/* Ouverture + fil d'aligot */
.ouverture{position:relative;color:#fff;background:var(--paturage)}
.ouverture .ph{position:relative;height:min(74vh,700px);min-height:420px;overflow:hidden}
.ouverture .ph img{width:100%;height:100%;object-fit:cover;object-position:60% 55%}
.ouverture .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,20,12,.15) 0%,rgba(15,20,12,0) 35%,rgba(15,20,12,.72) 100%)}
.ouverture .txt{position:absolute;left:0;right:0;bottom:0;z-index:2;padding-bottom:44px}
.ouverture h1{font-size:clamp(3.4rem,12vw,8rem);line-height:.9;margin:0 0 .12em;letter-spacing:-.02em}
.ouverture p.lead{font-size:clamp(1.1rem,1.6vw,1.3rem);max-width:40ch;color:#F1EEE4}
.ouverture .act{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.ouverture .btn.ligne{color:#fff;border-color:rgba(255,255,255,.85)}
.ouverture .btn.ligne:hover{background:#fff;color:var(--encre)}
.fil{position:absolute;left:0;right:0;top:0;bottom:0;z-index:1;pointer-events:none}
.fil path{fill:none;stroke-linecap:round}
.fil .f1{stroke:var(--aligot);stroke-width:9}
.fil .f0{stroke:rgba(80,62,20,.35);stroke-width:13}
.repere{background:var(--paturage);color:#E7EBDD;font-size:.98rem}
.repere ul{list-style:none;margin:0;padding:16px 0;display:flex;flex-wrap:wrap;gap:8px 28px}
.repere li{display:flex;gap:.5em;align-items:center}
.repere svg{color:var(--genet)}

section{padding:88px 0}
.deux{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.deux.inv>:first-child{order:2}
.photo{border-radius:14px;overflow:hidden}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover}
.bande{background:var(--genet);color:var(--encre)}
.bande .suite{background-image:linear-gradient(var(--encre),var(--encre))}
.bande .suite:hover{color:var(--genet)}
.specs{list-style:none;padding:0;margin:20px 0 26px;display:flex;flex-wrap:wrap;gap:10px}
.specs li{font:400 1.25rem/1 var(--titre);background:rgba(255,255,255,.55);border:2px solid var(--encre);border-radius:999px;padding:.55em .95em}
.ardoise{background:var(--paturage);color:#EEF0E6}
.ardoise h2,.ardoise h3{color:#fff}
.ardoise .suite{color:#fff}
.ligne-prix{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.ligne-prix b{font:400 1.12rem/1.25 var(--titre)}
.ligne-prix i{flex:1;border-bottom:2px dotted rgba(255,255,255,.3);transform:translateY(-4px);min-width:18px}
.ligne-prix span{font:600 1.05rem var(--texte);color:var(--genet);white-space:nowrap;font-variant-numeric:tabular-nums}
.ligne-prix small{display:block;font:400 .9rem var(--texte);color:#C9CFBE}
.lp-wrap{min-width:0}
.cartes3{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.paysage{position:relative}
.paysage img{width:100%;height:min(62vh,560px);object-fit:cover}
.paysage .leg{position:absolute;left:24px;bottom:24px;background:rgba(29,33,31,.78);color:#fff;padding:14px 18px;border-radius:10px;max-width:420px}
.paysage .leg p{margin:0}
.presse{border-top:1px solid var(--pierre);border-bottom:1px solid var(--pierre);padding:28px 0;text-align:center}
.presse p{margin:0 auto;font:400 1.3rem/1.4 var(--titre);max-width:none}
.coord{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.coord div{background:#fff;border-radius:12px;padding:20px}
.coord h3{font:700 .8rem var(--texte);letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin-bottom:.5em}
.coord p{margin:0;font-weight:600;overflow-wrap:anywhere}

.tete{padding:72px 0 40px;background:var(--paturage);color:#fff;position:relative;overflow:hidden}
.tete h1{font-size:clamp(2.6rem,6.5vw,5rem);margin-bottom:.2em}
.tete p{font-size:1.15rem;color:#E3E8D8}
.tete .act{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.tete .btn.ligne{color:#fff;border-color:rgba(255,255,255,.85)}
.tete .btn.ligne:hover{background:#fff;color:var(--encre)}
.tete .fil{opacity:.9}
.tarifs{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:#fff;border-radius:12px;overflow:hidden}
.tarifs th,.tarifs td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--granit2)}
.tarifs th{font:700 .78rem var(--texte);letter-spacing:.07em;text-transform:uppercase;color:var(--gris);background:var(--granit2)}
.tarifs td:last-child,.tarifs th:last-child{text-align:right;white-space:nowrap}
.tarifs td:last-child{font:400 1.2rem var(--titre);color:var(--paturage)}
.equip{columns:2;column-gap:28px;padding:0;list-style:none;margin:0}
.equip li{padding:6px 0 6px 26px;position:relative;break-inside:avoid}
.equip li::before{content:"";position:absolute;left:0;top:.75em;width:12px;height:12px;border-radius:50%;background:var(--genet)}
.chambres{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.chambres div{background:#fff;border-radius:12px;padding:20px;border:2px solid transparent}
.chambres b{font:400 2rem/1 var(--titre);display:block;color:var(--paturage)}
.chambres span{font-weight:600}
.menus{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.formule{background:var(--aligot);color:var(--encre);border-radius:14px;padding:26px;position:relative}
.formule h3{font-size:2rem;margin-bottom:.2em}
.formule ol{list-style:none;padding:0;margin:14px 0 0}
.formule li{padding:7px 0;border-top:1px dashed #C7B98F}
.formule li em{font-style:normal;color:var(--gris);font-size:.92rem}
.formule .sup{font-size:.9rem;color:var(--genet-f);font-weight:600;margin-top:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:780px}
.form .plein{grid-column:1/-1}
label.ch{display:flex;flex-direction:column;gap:5px;font:600 .82rem var(--texte);color:var(--gris)}
input,select,textarea{min-width:0;width:100%;font:400 1rem var(--texte);color:var(--encre);background:#fff;border:2px solid var(--pierre);border-radius:10px;padding:11px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--paturage2)}
.err{color:#9B2C1C;font-size:.9rem;min-height:1.2em;margin:.5em 0 0}
.ok{color:var(--paturage);font-weight:600}
.carte-lieu{display:flex;gap:10px;flex-wrap:wrap}

footer{background:var(--encre);color:#C7CBC4;padding:64px 0 120px}
footer a{color:#fff}
footer .g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px}
footer h4{font:700 .78rem var(--texte);letter-spacing:.08em;text-transform:uppercase;color:#fff;margin:0 0 12px}
footer ul{list-style:none;padding:0;margin:0}footer li{margin:6px 0}
footer .logo b{color:#fff}
.signature{border-top:1px solid #353a37;margin-top:40px;padding-top:20px;font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.barre{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(236,235,230,.97);border-top:1px solid var(--pierre)}
.barre .btn{flex:1;padding:.85em .5em;font-size:.88rem}

.cons-btn{position:fixed;right:20px;top:134px;z-index:50;display:flex;align-items:center;gap:10px;background:var(--genet);color:var(--encre);border:2px solid var(--encre);border-radius:999px;padding:8px 18px 8px 8px;cursor:pointer;font:inherit;text-align:left;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.cons-btn .av{width:38px;height:38px;border-radius:50%;background:var(--encre);color:var(--genet);display:grid;place-items:center;font:400 1.15rem var(--titre)}
.cons-btn b{display:block;font-size:.95rem}
.cons-btn small{font-size:.8rem}
.cons-bulle{position:fixed;right:20px;top:198px;z-index:50;max-width:300px;background:#fff;border:2px solid var(--encre);border-radius:14px;padding:14px 40px 14px 16px;font-size:.93rem;display:none;box-shadow:0 14px 30px -16px rgba(0,0,0,.4)}
.cons-bulle.on{display:block;animation:monte .5s var(--ease)}
.cons-bulle button{position:absolute;top:6px;right:6px;border:0;background:none;cursor:pointer;width:32px;height:32px;display:grid;place-items:center}
@keyframes monte{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cons{position:fixed;right:20px;top:134px;z-index:60;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 154px));background:var(--granit);border:2px solid var(--encre);border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden}
.cons.on{display:flex;animation:monte .45s var(--ease)}
.cons header{background:var(--paturage);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px}
.cons header b{display:block;font:400 1.15rem var(--titre)}
.cons header small{color:#DDE3D1;font-size:.8rem}
.cons header button{margin-left:auto;background:none;border:0;color:#fff;cursor:pointer;width:36px;height:36px;display:grid;place-items:center}
.fil-c{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:.95rem;line-height:1.5}
.msg.b{background:#fff;align-self:flex-start}
.msg.u{background:var(--paturage);color:#fff;align-self:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chips button{border:2px solid var(--encre);background:#fff;border-radius:999px;padding:6px 11px;font:600 .84rem var(--texte);cursor:pointer}
.chips button:hover{background:var(--genet)}
.cons form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--pierre);background:#fff}
.cons form button{flex:none;padding:0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.apparait{opacity:1}
.js .apparait{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.js .apparait.vu{opacity:1;transform:none}

@media (max-width:1024px){
 .deux,.deux.inv{grid-template-columns:minmax(0,1fr);gap:32px}.deux.inv>:first-child{order:0}
 .cartes3,.menus{grid-template-columns:minmax(0,1fr)}
 .chambres,.coord{grid-template-columns:repeat(2,minmax(0,1fr))}
 footer .g{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .ouvert{display:none}
}
@media (max-width:820px){
 .bar1{padding:10px 16px;gap:10px}.bar1>.btn{display:none}.tel span{display:none}
 nav.menu ul{padding:0 16px}.wrap{padding:0 16px}
 section{padding:60px 0}
 .barre{display:flex}
 .ouverture .act{display:none}
 .cons-btn{top:auto;right:auto;left:12px;bottom:78px;padding:6px 14px 6px 6px}
 .cons-btn .av{width:34px;height:34px}
 .cons-bulle{top:auto;right:auto;left:12px;bottom:140px}
 .cons{top:auto;right:auto;left:12px;bottom:12px;height:min(600px,calc(100vh - 24px))}
 footer .g,.form{grid-template-columns:minmax(0,1fr)}
 .equip{columns:1}
 .paysage .leg{position:static;border-radius:0;max-width:none}
}
@media (max-width:480px){
 .logo b{font-size:1.3rem}.logo small{font-size:.62rem}
 .chambres,.coord{grid-template-columns:minmax(0,1fr)}
 .cons-btn small{display:none}
 .ouverture .ph{height:64vh}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .apparait{opacity:1;transform:none}}
</style>

 aubrac:{fr:`Vous êtes aux portes du plateau de l'Aubrac et de ses grands paysages. Pour des idées de balades précises, l'hôtel vous conseillera sur place ou au ${TELH}.`,en:`You're at the gateway to the Aubrac plateau and its wide landscapes. For specific walk ideas, the hotel will advise you on site or on ${TELH}.`,es:`Está a las puertas de la meseta del Aubrac y sus grandes paisajes. Para ideas de paseos concretas, el hotel le aconsejará allí o en el ${TELH}.`,de:`Sie sind am Tor zur Hochebene des Aubrac und ihren weiten Landschaften. Für konkrete Wandertipps berät Sie das Hotel vor Ort oder unter ${TELH}.`,it:`Siete alle porte dell'altopiano dell'Aubrac e dei suoi grandi paesaggi. Per idee di passeggiate precise, l'hotel vi consiglierà sul posto o al ${TELH}.`,nl:`U staat aan de poort van het Aubrac-plateau en zijn weidse landschappen. Voor concrete wandeltips helpt het hotel u ter plaatse of via ${TELH}.`},
 horaires:{fr:`Petit-déjeuner de 7 h à 9 h 30, déjeuner de 12 h à 13 h 15, dîner de 19 h 30 à 20 h 15. L'établissement est ouvert de 7 h à 21 h.`,en:`Breakfast 7:00–9:30, lunch 12:00–13:15, dinner 19:30–20:15. The hotel is open from 7 am to 9 pm.`,es:`Desayuno de 7:00 a 9:30, comida de 12:00 a 13:15, cena de 19:30 a 20:15. Abierto de 7:00 a 21:00.`,de:`Frühstück 7:00–9:30, Mittagessen 12:00–13:15, Abendessen 19:30–20:15 Uhr. Geöffnet von 7 bis 21 Uhr.`,it:`Colazione 7:00–9:30, pranzo 12:00–13:15, cena 19:30–20:15. Aperto dalle 7 alle 21.`,nl:`Ontbijt 7.00–9.30, lunch 12.00–13.15, diner 19.30–20.15 uur. Open van 7 tot 21 uur.`},
 table:{fr:`Pour réserver une table, appelez le ${TELH} ou envoyez une ${G('contact','demande en ligne')} en choisissant « Table au restaurant ».`,en:`To book a table, call ${TELH} or send an ${G('contact','online request')} choosing “Table at the restaurant”.`,es:`Para reservar mesa, llame al ${TELH} o envíe una ${G('contact','solicitud en línea')} eligiendo «Mesa en el restaurante».`,de:`Tisch reservieren: rufen Sie ${TELH} an oder senden Sie eine ${G('contact','Online-Anfrage')} mit „Tisch im Restaurant“.`,it:`Per prenotare un tavolo chiamate il ${TELH} o inviate una ${G('contact','richiesta online')} scegliendo «Tavolo al ristorante».`,nl:`Een tafel reserveren: bel ${TELH} of stuur een ${G('contact','online aanvraag')} met ‘Tafel in het restaurant’.`},
 menu:{fr:`Trois menus à 18, 28 et 34 €, un menu du jour dès 16 € et une carte lozérienne : manouls, grenouilles persillées, truite au lard, côte de bœuf… ${G('restaurant','Voir la carte')}`,en:`Three set menus at €18, €28 and €34, a menu of the day from €16 and a Lozère à la carte: manouls, frogs' legs, trout with bacon, rib of beef… ${G('restaurant','See the menu')}`,es:`Tres menús de 18, 28 y 34 €, un menú del día desde 16 € y una carta de Lozère: manouls, ancas de rana, trucha con tocino, chuletón… ${G('restaurant','Ver la carta')}`,de:`Drei Menüs zu 18, 28 und 34 €, ein Tagesmenü ab 16 € und eine Karte der Lozère: Manouls, Froschschenkel, Forelle mit Speck, Rinderkotelett… ${G('restaurant','Zur Karte')}`,it:`Tre menù da 18, 28 e 34 €, un menù del giorno da 16 € e una carta della Lozère: manouls, rane, trota al lardo, costata… ${G('restaurant','Vedi la carta')}`,nl:`Drie menu's van € 18, € 28 en € 34, een dagmenu vanaf € 16 en een kaart uit de Lozère: manouls, kikkerbilletjes, forel met spek, côte de bœuf… ${G('restaurant','Bekijk de kaart')}`},
 wifi:{fr:`Chaque chambre a douche ou baignoire avec toilettes séparées, télévision, téléphone et wifi.`,en:`Every room has a shower or bath with separate toilet, TV, telephone and wifi.`,es:`Cada habitación tiene ducha o bañera con aseo separado, televisión, teléfono y wifi.`,de:`Jedes Zimmer hat Dusche oder Badewanne mit separatem WC, Fernseher, Telefon und WLAN.`,it:`Ogni camera ha doccia o vasca con WC separato, televisione, telefono e wifi.`,nl:`Elke kamer heeft douche of bad met apart toilet, tv, telefoon en wifi.`},
 contact:{fr:`Téléphone ${TELH}, e-mail ${MAILH}. Village, 48130 Fau-de-Peyre.`,en:`Phone ${TELH}, email ${MAILH}. Village, 48130 Fau-de-Peyre, France.`,es:`Teléfono ${TELH}, correo ${MAILH}. Village, 48130 Fau-de-Peyre, Francia.`,de:`Telefon ${TELH}, E-Mail ${MAILH}. Village, 48130 Fau-de-Peyre, Frankreich.`,it:`Telefono ${TELH}, e-mail ${MAILH}. Village, 48130 Fau-de-Peyre, Francia.`,nl:`Telefoon ${TELH}, e-mail ${MAILH}. Village, 48130 Fau-de-Peyre, Frankrijk.`},
 prix:{fr:`Chambre pour 2 : 67 €, pour 3 : 76 €, pour 4 : 85 €. Petit-déjeuner 10 €. Demi-pension 66 € et pension complète 76 € par jour et par personne. ${G('chambres','Tous les prix')}`,en:`Room for 2: €67, for 3: €76, for 4: €85. Breakfast €10. Half board €66 and full board €76 per day per person. ${G('chambres','All prices')}`,es:`Habitación para 2: 67 €, para 3: 76 €, para 4: 85 €. Desayuno 10 €. Media pensión 66 € y pensión completa 76 € por día y persona. ${G('chambres','Todos los precios')}`,de:`Zimmer für 2: 67 €, für 3: 76 €, für 4: 85 €. Frühstück 10 €. Halbpension 66 € und Vollpension 76 € pro Tag und Person. ${G('chambres','Alle Preise')}`,it:`Camera per 2: 67 €, per 3: 76 €, per 4: 85 €. Colazione 10 €. Mezza pensione 66 € e pensione completa 76 € al giorno a persona. ${G('chambres','Tutti i prezzi')}`,nl:`Kamer voor 2: € 67, voor 3: € 76, voor 4: € 85. Ontbijt € 10. Halfpension € 66 en volpension € 76 per dag per persoon. ${G('chambres','Alle prijzen')}`},
 ch2:{fr:`À deux, une chambre double à 67 € la nuit. ${G('contact','Faire une demande de réservation')}`,en:`For two, a double room at €67 a night. ${G('contact','Send a booking request')}`,es:`Para dos, una habitación doble a 67 € la noche. ${G('contact','Enviar una solicitud')}`,de:`Zu zweit: ein Doppelzimmer für 67 € pro Nacht. ${G('contact','Buchungsanfrage senden')}`,it:`In due, una camera doppia a 67 € a notte. ${G('contact','Invia una richiesta')}`,nl:`Met z'n tweeën: een tweepersoonskamer voor € 67 per nacht. ${G('contact','Reserveringsaanvraag sturen')}`},
 ch3:{fr:`À trois, l'une des 2 chambres pour 3 personnes, à 76 € la nuit. ${G('contact','Faire une demande de réservation')}`,en:`For three, one of the 2 triple rooms, at €76 a night. ${G('contact','Send a booking request')}`,es:`Para tres, una de las 2 habitaciones triples, a 76 € la noche. ${G('contact','Enviar una solicitud')}`,de:`Zu dritt: eines der 2 Dreibettzimmer, 76 € pro Nacht. ${G('contact','Buchungsanfrage senden')}`,it:`In tre, una delle 2 camere triple, a 76 € a notte. ${G('contact','Invia una richiesta')}`,nl:`Met z'n drieën: een van de 2 driepersoonskamers, € 76 per nacht. ${G('contact','Reserveringsaanvraag sturen')}`},
 ch4:{fr:`À quatre, la chambre est à 85 € la nuit ; il y a aussi une chambre pour 5 (prix sur demande au ${TELH}). ${G('contact','Faire une demande de réservation')}`,en:`For four, the room is €85 a night; there is also a room for 5 (price on request on ${TELH}). ${G('contact','Send a booking request')}`,es:`Para cuatro, la habitación cuesta 85 € la noche; también hay una para 5 (precio a consultar en el ${TELH}). ${G('contact','Enviar una solicitud')}`,de:`Zu viert kostet das Zimmer 85 € pro Nacht; es gibt auch ein Zimmer für 5 (Preis auf Anfrage unter ${TELH}). ${G('contact','Buchungsanfrage senden')}`,it:`In quattro, la camera costa 85 € a notte; c'è anche una camera per 5 (prezzo su richiesta al ${TELH}). ${G('contact','Invia una richiesta')}`,nl:`Met z'n vieren kost de kamer € 85 per nacht; er is ook een kamer voor 5 (prijs op aanvraag via ${TELH}). ${G('contact','Reserveringsaanvraag sturen')}`},
 ch6:{fr:`Au-delà de 5 personnes, plusieurs chambres seront nécessaires : l'hôtel vous fera une proposition au ${TELH}.`,en:`Beyond 5 people, you'll need several rooms: the hotel will make you an offer on ${TELH}.`,es:`Más de 5 personas necesitarán varias habitaciones: el hotel le hará una propuesta en el ${TELH}.`,de:`Ab 6 Personen brauchen Sie mehrere Zimmer: Das Hotel macht Ihnen unter ${TELH} ein Angebot.`,it:`Oltre 5 persone serviranno più camere: l'hotel vi farà una proposta al ${TELH}.`,nl:`Boven 5 personen zijn meerdere kamers nodig: het hotel doet u een voorstel via ${TELH}.`},
 chambre:{fr:`18 chambres : 15 pour 2 personnes (67 €), 2 pour 3 (76 €) et une pour 5. Combien serez-vous ? ${G('chambres','Voir les chambres')}`,en:`18 rooms: 15 for 2 people (€67), 2 for 3 (€76) and one for 5. How many of you will there be? ${G('chambres','See the rooms')}`,es:`18 habitaciones: 15 para 2 personas (67 €), 2 para 3 (76 €) y una para 5. ¿Cuántos serán? ${G('chambres','Ver las habitaciones')}`,de:`18 Zimmer: 15 für 2 Personen (67 €), 2 für 3 (76 €) und eines für 5. Wie viele sind Sie? ${G('chambres','Zimmer ansehen')}`,it:`18 camere: 15 per 2 persone (67 €), 2 per 3 (76 €) e una per 5. In quanti sarete? ${G('chambres','Vedi le camere')}`,nl:`18 kamers: 15 voor 2 personen (€ 67), 2 voor 3 (€ 76) en één voor 5. Met hoeveel bent u? ${G('chambres','Bekijk de kamers')}`},
 defaut:{fr:`Je ne sais pas répondre précisément à cela. Je peux vous parler des chambres, des prix, du restaurant, des groupes ou de l'accès. Sinon, l'hôtel vous répond au ${TELH}.`,en:`I can't answer that precisely. I can tell you about rooms, prices, the restaurant, groups or getting here. Otherwise, the hotel will answer on ${TELH}.`,es:`No sé responder con precisión a eso. Puedo hablarle de habitaciones, precios, restaurante, grupos o cómo llegar. Si no, el hotel le responde en el ${TELH}.`,de:`Darauf kann ich nicht genau antworten. Ich kann Ihnen etwas zu Zimmern, Preisen, Restaurant, Gruppen oder Anfahrt sagen. Sonst hilft das Hotel unter ${TELH}.`,it:`Non so rispondere con precisione. Posso parlarvi di camere, prezzi, ristorante, gruppi o come arrivare. Altrimenti l'hotel vi risponde al ${TELH}.`,nl:`Daar kan ik geen precies antwoord op geven. Ik vertel u graag over kamers, prijzen, het restaurant, groepen of de route. Anders helpt het hotel via ${TELH}.`}
};
function repondre(q,lang){
 const s=q.toLowerCase();
 const nb=(()=>{const m=s.match(/\b(\d{1,2})\b/);if(m)return +m[1];if(/\b(deux|two|dos|zwei|due|twee|couple|pareja|paar|coppia|stel)\b/.test(s))return 2;if(/\b(trois|three|tres|drei|tre|drie)\b/.test(s))return 3;if(/\b(quatre|four|cuatro|vier|quattro)\b/.test(s))return 4;if(/\b(cinq|five|cinco|f[üu]nf|cinque|vijf)\b/.test(s))return 5;return 0})();
 const isRoom=/chambre|room|habitaci|zimmer|\bcamera|kamer|dormir|nuit|night|noche|nacht|notte|sleep|slapen|schlafen|pers|people|personas|personen|persone|guests/.test(s);
 if(isRoom&&nb&&!/demi|pension|half|board|media|halb|mezza|banquet|bankett|s[ée]minaire|seminar|groupe|group/.test(s)){if(nb>=6)return A.ch6[lang];if(nb>=4)return A.ch4[lang];if(nb===3)return A.ch3[lang];return A.ch2[lang]}
 for(const [k,re] of INT){if(re.test(s))return A[k][lang]}
 return A.defaut[lang];
}

/* Geste signature : le fil d'aligot s'étire à travers l'ouverture, puis ondule doucement */
function aligot(){
 cancelAnimationFrame(raf);
 const svg=document.querySelector('.fil'); if(!svg)return;
 const ps=[...svg.querySelectorAll('path')], base=ps[0].getAttribute('d');
 const calme=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(calme)return;
 const len=1400; ps.forEach(p=>{p.style.strokeDasharray=len;p.style.strokeDashoffset=len});
 const t0=performance.now(), dur=2200, ease=x=>1-Math.pow(1-x,4);
 const pas=n=>{raf=requestAnimationFrame(pas);const s=(n-t0);
  const k=Math.min(1,s/dur), off=len*(1-ease(k)); ps.forEach(p=>p.style.strokeDashoffset=off);
  const w=Math.sin(s/1500)*14, w2=Math.cos(s/1900)*10;
  const d=`M-20 250 C 150 240 260 ${170+w2} 380 ${150+w} S 640 ${60-w} 780 ${90+w2} S 940 ${60-w2} 1030 20`;
  ps.forEach(p=>p.setAttribute('d',d));
  if(document.hidden)return};
 raf=requestAnimationFrame(pas);
}
