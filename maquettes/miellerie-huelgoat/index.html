:root{--granit:#22201c;--granit2:#2f2c27;--bruyere:#5a2a57;--bruyere-c:#c9a3c4;--ambre:#d6992a;--ambre-f:#8a5a0e;--lande:#ecebe6;--blanc:#fbfaf7;--encre:#201e1a;--gris:#5c5850;--trait:#d6d2c9;--miel:#dca54c;--ease:cubic-bezier(.16,1,.3,1);--titre:'Young Serif',Georgia,serif;--texte:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-color:var(--bruyere) var(--lande)}
body{background:var(--lande);color:var(--encre);font:400 17px/1.6 var(--texte);overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--ambre);color:var(--granit)}
:focus-visible{outline:2px solid var(--bruyere);outline-offset:3px;border-radius:2px}
.nuit :focus-visible{outline-color:var(--ambre)}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-track{background:var(--lande)}::-webkit-scrollbar-thumb{background:var(--bruyere);border-radius:6px;border:2px solid var(--lande)}
h1,h2,h3{font-family:var(--titre);font-weight:400;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:clamp(1.9rem,4.2vw,3.2rem)}
h3{font-size:clamp(1.25rem,2vw,1.55rem)}
p{max-width:64ch;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
.env{width:min(1220px,100% - 32px);margin-inline:auto}
section{padding:clamp(60px,9vw,120px) 0}
.nuit{background:var(--granit);color:#efebe3}
.nuit .doux{color:#bdb6a8}
.doux{color:var(--gris)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:48px;padding:.75em 1.5em;border-radius:12px;font-weight:600;text-decoration:none;transition:background .25s,transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-1px)}
.btn-ambre{background:var(--ambre);color:var(--granit);box-shadow:0 6px 18px -10px rgba(214,153,42,.9)}
.btn-ambre:hover{background:#e3a83b}
.btn-bruyere{background:var(--bruyere);color:#fff}
.btn-bruyere:hover{background:#6c3468}
.btn-trait{border:1.5px solid currentColor}
.btn-trait:hover{background:rgba(127,120,110,.12)}
.lien{font-weight:600;color:var(--bruyere);text-decoration:underline}
.nuit .lien{color:var(--ambre)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bandeau{background:var(--bruyere);color:#f3e6f1;font-size:.82rem;text-align:center;padding:6px 16px}
header.tete{position:sticky;top:0;z-index:50;background:var(--granit);color:#efebe3;border-bottom:3px solid var(--bruyere)}
.tete-l1{display:flex;align-items:center;gap:14px;min-height:64px}
.marque{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto}
.marque .couv{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a4d86,var(--bruyere) 60%,#3e1c3c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.marque b{display:block;font:400 1.22rem/1 var(--titre)}
.marque small{display:block;font-size:.72rem;color:#c9c1b3;margin-top:4px;letter-spacing:.02em}
.langue{position:relative}
.langue select{appearance:none;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:10px;padding:.45em 2em .45em .9em;font:500 .86rem var(--texte);min-height:40px;cursor:pointer}
.langue select option{color:#111}
.langue::after{content:"";position:absolute;right:.8em;top:50%;width:6px;height:6px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.panier-btn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3)}
.pastille{min-width:20px;height:20px;border-radius:10px;background:var(--ambre);color:var(--granit);font-size:.75rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.tete-l2{border-top:1px solid rgba(255,255,255,.08)}
nav.menu{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{flex:none;padding:11px 13px;font-size:.92rem;text-decoration:none;color:#d8d2c6;border-radius:8px;white-space:nowrap}
nav.menu a:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.menu a[aria-current]{color:#fff;box-shadow:inset 0 -2px 0 var(--ambre)}
nav.menu a.cons{color:var(--ambre)}
@media (min-width:1000px){nav.menu{justify-content:center;-webkit-mask-image:none;mask-image:none}}
@media (max-width:560px){.marque b{font-size:1.02rem}.marque small{font-size:.66rem}.panier-btn .lbl{display:none}.langue select{font-size:.8rem;padding:.4em 1.8em .4em .7em}.marque .couv{width:30px;height:30px}}

/* nuancier : geste signature */
.accueil .lien{color:var(--ambre)}
.grille.q4{grid-template-columns:repeat(4,1fr)}@media (max-width:900px){.grille.q4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.filtres{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.filtres>*{flex:none}}
.accueil{background:radial-gradient(70% 60% at 72% 70%,color-mix(in srgb,var(--miel) 32%,transparent),transparent 70%),var(--granit);color:#efebe3;transition:background .9s var(--ease);padding:clamp(24px,3vw,40px) 0 clamp(40px,6vw,72px)}
.acc-g{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(24px,4vw,64px);align-items:center}
.accueil h1{font-size:clamp(2.3rem,5.4vw,4.4rem)}
.accueil .chapo{margin:18px 0 26px;color:#d8d1c3;font-size:1.08rem}
.accueil .actions{display:flex;flex-wrap:wrap;gap:12px}
.eventail{position:relative;height:clamp(300px,40vw,440px);margin-top:10px}
.lame{position:absolute;left:50%;bottom:0;width:clamp(30px,3.6vw,46px);height:clamp(220px,30vw,330px);margin-left:calc(clamp(30px,3.6vw,46px) / -2);border-radius:999px 999px 10px 10px;transform-origin:50% 100%;transform:rotate(var(--r,0deg)) translateY(var(--y,0px));transition:transform 1.1s var(--ease),box-shadow .3s;box-shadow:0 10px 24px -14px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 30%),var(--c);cursor:pointer}
.lame span{position:absolute;left:50%;top:22px;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;font:600 .72rem var(--texte);letter-spacing:.04em;white-space:nowrap;color:var(--t,#201e1a);opacity:.85}
.lame[aria-pressed=true]{--y:-26px;box-shadow:0 18px 30px -12px rgba(0,0,0,.9),0 0 0 2px var(--ambre)}
.lame:focus-visible{outline:2px solid var(--ambre);outline-offset:3px}
.ev-legende{display:flex;justify-content:space-between;font-size:.8rem;color:#bdb6a8;margin-top:10px}
.choix{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;margin-top:24px}
.choix img{width:120px;height:120px;object-fit:contain;background:#fff;border-radius:12px}

veur très douce. Nous le récoltons au mois de juillet dans les Monts d'Arrée.", "desc": "AIRE DE RÉCOLTE Nous le récoltons dans les Monts d' Arrée, dans le parc naturel d'Armorique. FLORAISON Fin juin-fin juillet. Echelonnée selon l'altitude et l'exposition, elle peut durer près d'un mois. RÉCOLTE Dès l'éclosion des dernières fleurs. COULEUR Roussâtre, il s'assombrit ou s'éclaircit parfois, selon les fleurs butinées en même temps que la ronce. PARFUM ET SAVEUR Son odeur rappelle celle des sous-bois chauds et humides. Son parfum soutenu se prolonge en bouche."}, {"id": "miel-de-bruyere-844", "cat": "miels", "n": "Miel de Bruyère", "v": [["250 gr", 8.9], ["500 gr", 13.9], ["1 kg", 21.9]], "avis": 16, "av": [["dimanche 25 décembre 2022", "françoise M", "Juste une petite préférence pour un miel de bruyère plus cristallisé"], ["samedi 08 octobre 2022", "MANUELA B", "un peu acidulé parfumé pour ceux qui aime les miels de caractère"], ["vendredi 23 septembre 2022", "Laurence C", "miel connu il y a de nombreuses années : correspond toujours au goût recherché !  -"]], "courte": "Le miel de bruyère \"Érica\" est un miel liquide coloré et très parfumé. Nous le récoltons dans les Monts d'Arrée.", "desc": "AIRE DE RÉCOLTE Le miel de Bruyère est récolté dans les Monts d'Arrée. FLORAISON Juillet, Aout. Eclatant en milliers de grappes de fleurs blanches, elle s'étale sur une quinzaine de jours. RÉCOLTE Mi-juin à mi-août. Les semaines précédant la floraison doivent être favorables au développement des colonies. Très sensible à la pluie aussi bien qu'aux longues périodes de sécheresse. COULEUR Un ambré sombre à l'état liquide qui s'éclaircit en cristallisant. PARFUM ET SAVEUR Exprime des saveurs boisées, fortes et acidulées, où se mêle parfois une pointe de caramel ou d'amande. CARACTÉRISTIQUES Le miel de Bruyère contient du silicium, du bore et du baryum."}, {"id": "miel-de-chataignier-845", "cat": "miels", "n": "Miel de Châtaignier", "v": [["250 gr", 7.9], ["500 gr", 12.9], ["1 kg", 19.9]], "avis": 16, "av": [["vendredi 08 juillet 2022", "Muriel T", "Classique, mais très bon donc à essayer"], ["jeudi 26 mai 2022", "Jean Jacques L", "commande confort a ma demande"], ["mardi 17 mai 2022", "Jean-Marc R", "comme la derniere fois que j'en ai achete sur place : excellent"]], "courte": "Le miel de Châtaignier est un miel liquide plus ou moins foncé, d'un goût très prononcé et nettement amer. Nous le récoltons en Dordogne.", "desc": "AIRE DE RÉCOLTE En Dordogne. FLORAISON Fin juin-début juillet. Généreuse, sécrétant des effluves entêtants, elle s'échelonne sur trois semaines. RÉCOLTE Courant juillet. Régulière mais amoindrie par les grosses chaleurs et au contraire favorisée par les rosées matinales. COULEUR Ambre sombre. PARFUM ET SAVEUR Une odeur forte et suave, des saveurs boisées et une certaine amertume caractérisent ce miel corsé. CARACTÉRISTIQUES Il est riche en oligoéléments : potassium, magnésium, manganèse et baryum. Ce miel est riche en fructose, d'où un apport glycémique plus faible."}, {"id": "miel-cremeux-847", "cat": "miels", "n": "Miel Crémeux", "v": [["250 gr", 5.9], ["500 gr", 8.9], ["1 kg", 13.9]], "avis": 15, "av": [["mercredi 02 novembre 2022", "Frédéric P", "Une texture onctueuse tellement agréable à étaler sur le pain au petit déjeuner… Et un vrai r�... (Lire la suite)�gal, comme tous les miels des abeilles de la Miellerie de Huelgoat!"], ["samedi 08 octobre 2022", "MANUELA B", "très doux agréable en bouche car très onctueux"], ["dimanche 14 novembre 2021", "Françoise LR", "Miel très bon , très crémeux. Adopter à l'unanimité."]], "courte": "Le miel Crémeux (Colza) est un miel onctueux, au goût très fin. Il est idéal pour tartiner et particulièrement apprécié des enfants.", "desc": "AIRE DE RÉCOLTE Nous le récoltons dans les Monts d'Arrée et dans le Limousin suivant la saison. FLORAISON Avril-début Mai. Intense, elle peut perdurer trois semaines. RÉCOLTE Courant mai. Plutôt régulière, elle peut être très importante mais dépend le plus souvent des conditions atmosphériques, de la nature des sols et des variétés cultivées. COULEUR Clair à l'état liquide, le miel de colza devient gris clair à presque blanc une fois solidifié. PARFUM ET SAVEUR Miel très doux en bouche, sa texture agréable est des plus fines. CARACTÉRISTIQUES Le miel de colza contient des oligoéléments, notamment calcium et bore."}, {"id": "miel-de-sarrasin-849", "cat": "miels", "n": "Miel de Sarrasin", "v": [["250 gr", 9.9], ["500 gr", 14.9], ["1 kg", 23.9]], "avis": 23, "av": [["samedi 21 janvier 2023", "didier L", "bien reçu et bien protéger"], ["dimanche 25 décembre 2022", "françoise M", "Parfait comme d'habitude. Texture et gout"], ["dimanche 04 décembre 2022", "Erwan R", "Cadeau fait à mon beau père qui à adoré,il a retrouvé le goût du miel de son enfance."]], "courte": "Le miel de Sarrasin est un miel liquide et foncé. Très typé, il présente des saveurs puissantes. Nous le récoltons dans le sud du Finistère.", "desc": "AIRE DE RECOLTE Principalement en Bretagne et région Centre. FLORAISON Exceptionnellement longue, elle peut se poursuivre plusieurs semaines au cours de l'été. RECOLTE De juillet à fin août. Plutôt régulière, mais sensible à la sécheresse, à la pluie et au vent du nord. COULEUR D'un brun dense, presque noir. PARFUM ET SAVEUR Un arôme surprenant et des saveurs puissantes où se mélangent odeurs de bois et de terre. CARACTÉRISTIQUES Le miel de Sarrasin a bien failli disparaître, victime des mutations rapides de l'agriculture moderne qui privilégie les grandes cultures. Aujourd'hui, il réapparaît sur les étals, très recherché en tant que miel de cru."}, {"id": "miel-des-monts-darree-850", "cat": "miels", "n": "Miel des Monts d'Arrée", "v": [["250 gr", 7.9], ["500 gr", 12.9], ["1 kg", 19.9]], "avis": 25, "av": [["lundi 16 janvier 2023", "AGNES L", "Parfait on en redemande. à bientôt."], ["mercredi 19 octobre 2022", "Christian L", "c'est pour moi le meilleur miel de tous ceux que j'ai gouté avec le miel de ronce ."], ["samedi 08 octobre 2022", "MANUELA B", "un peu corsé qui rappelle les bois"]], "courte": "Le miel des Monts d'Arrée est un miel liquide et parfumé, issu des fleurs sauvages estivales des landes des Monts d'Arrée.", "desc": "AIRE DE RÉCOLTE Le miel des Monts d'Arrée traduit la richesse botanique d'un environnement encore préservé dans le parc naturel d'Armorique dans le Finistère. FLORAISON La floraison du miel des Monts d'Arrée se fait en Juillet Août. RÉCOLTE Il se récolte à la fin de la saison c'est-à-dire fin Août. COULEUR Sombre à l'état liquide. Sa couleur légèrement est ambrée à rougeâtre. PARFUM ET SAVEURS C'est un mélange de fleurs sauvages des Monts d'Arrée à prédominance de ronces et bruyères. Un arôme prononcé, une saveur et un parfum boisée."}, {"id": "miel-fruitiers-aubepine-851", "cat": "miels", "n": "Miel Fruitiers Aubépine", "v": [["250 gr", 8.9], ["500 gr", 13.9], ["1 kg", 21.9]], "avis": 19, "av": [["mercredi 11 janvier 2023", "Bérengère M", "Délicieux, j'en recommanderai !"], ["samedi 12 novembre 2022", "Bruno L", "Très bon miel agréable en bouche ma petite fille de 9 ans l'adore la vérité sort de la bouche de... (Lire la suite)s enfants ❤️"], ["mercredi 19 octobre 2022", "Christian L", "c'est pour moi un tres bon miel parmi  tous ceux que j'ai gouté avec le miel de ronce ."]], "courte": "Le miel Fruitiers Aubépine est un miel rare, onctueux et aux saveurs très douces. Nous le récoltons dans les Monts d'Arrée.", "desc": "AIRE DE RÉCOLTE Les terroirs sont disséminés dans le Nord et l'Ouest de la France. FLORAISON Avril-Mai. Brève, mais très intense, en une myriade de bouquets de fleurs blanches odorantes. RÉCOLTE Capricieuse. Cependant, par temps chaud et sec, la sécrétion de nectar peut devenir abondante. COULEUR Jaune pâle, ivoire. PARFUM ET SAVEUR Arôme discret mais prenant. Le goût suave et fruité perdure en bouche."}, {"id": "miel-de-bourdaine-852", "cat": "miels", "n": "Miel de Bourdaine", "v": [["250 gr", 9.9], ["500 gr", 15.9], ["1 kg", 25.9]], "avis": 8, "av": [["samedi 23 avril 2022", "Lydie G", "Excellent miel, très riche au goût , merci les abeilles"], ["vendredi 11 février 2022", "Valerie T", "Différent des précédentes commandes :"], ["samedi 21 août 2021", "PIERRE-JEAN K", "Trés bon miel le Bourdaine ."]], "courte": "Le miel de Bourdaine est un miel agréable et méconnu. Liquide, d'une saveur de \"bonbon au miel\" en première bouche, suivie de notes plus intenses. Nous le récoltons dans le département des Landes.", "desc": "AIRE DE RÉCOLTE Aquitaine et Massif Central principalement. FLORAISON Fin mai-début juillet. RÉCOLTE Courant juillet. Plutôt régulière. COULEUR Plutôt foncé au départ, ce miel devient brun roussâtre au terme de sa cristalisation. PARFUM ET SAVEUR Le miel de Bourdaine exhale des effluves délicats et son goût se révèle fruité, balsamique et très légèrement aromatisé."}, {"id": "miel-de-callune-853", "cat": "miels", "n": "Miel de Callune", "v": [["250 gr", 9.9], ["500 gr", 16.9], ["1 kg", 25.9]], "avis": 9, "av": [["samedi 23 avril 2022", "Lydie G", "Miel de très bon goût, agréable en bouche , et je suis très satisfaite de ma commande,le colis �... (Lire la suite)�tait soigneusement emballé merci beaucoup"], ["dimanche 25 avril 2021", "SYLVIE B", "première commande via le site, déjà acheté directement sur place et bien apprécié."], ["mardi 09 mars 2021", "Bernadette D", "Encore une belle découverte, je ne connaissais pas. Un parfum doux avec une pointe d'acidité. Trè... (Lire la suite)s bon miel."]], "courte": "Le miel de Callune (Bruyère) est un miel plus ou moins épais, d'une texture gélatineuse avec des cristaux fins en bouche.", "desc": "AIRE DE RÉCOLTE La callune est une plante qui pousse sur les terres du département des Landes. FLORAISON Elle débute en montagne fin juillet et s'achève en basse altitude à la fin septembre. Régulière, elle perdure plus de trois semaines. RÉCOLTE Très irrégulière. Une belle floraison ne suffit pas. Les gelées, la sechesse et le vent annihilent tout espoir de miellée. Cependant, le moindre orage peut s'avérer salutaire. COULEUR Ambré avec des teintes rougeâtres. PARFUM ET SAVEUR Son arôme puissant sécrète des saveurs fruitées intenses qui envahissent le palais. Il prend une texture gélatineuse avec des cristaux fins en bouche. CARACTÉRISTIQUES Il s'avère très riche en oligoéléments et en particulier en potassium, fer, soufre, manganèse, bore et baryum."}, {"id": "miel-de-tilleul-855", "cat": "miels", "n": "Miel de Tilleul", "v": [["250 gr", 7.9], ["500 gr", 12.9], ["1 kg", 19.9]], "avis": 14, "av": [["mercredi 19 octobre 2022", "Christian L", "c'est pour moi un tres bon miel parmi  tous ceux que j'ai gouté avec le miel de ronce ."], ["vendredi 08 juillet 2022", "Muriel T", "Toujours aussi bon, je recommande"], ["dimanche 10 avril 2022", "isabelle A", "Miel liquide, idéal pour mélanger dans son yaourt! Plus fort en goût que les fruitiers"]], "courte": "Le miel de Tilleul a un arôme mentholé très caractéristique, balsamique et persistant. Miel de couleur ambré clair. Nous le récoltons dans le Limousin.", "desc": "AIRE DE RÉCOLTE Le miel de Tilleul, nous le récoltons dans le limousin. FLORAISON Courant Juin-début Juillet. Intense et très rapide, elle s'achève en quelques jours. RÉCOLTE Début jullet. La brièveté de la floraison rend la récolte totalement dépendante des conditions météorologiques. COULEUR Variable. Ambré clair, il prend, à l'état solide, différentes teintes de jaune plus ou moins sombres. PARFUM ET SAVEUR Arôme mentholé très caractéristique, balsamique et persistant. Sa saveur puissante et intense, rappelle les effluves entêtants des sous-bois de tilleuls en fleur. CARACTÉRISTIQUE Il contient des oligoéléments (potassium, calcium et manganèse)."}, {"id": "miel-de-pissenlit-860", "cat": "miels", "n": "Miel de Pissenlit", "v": [["250 gr", 9.9], ["500 gr", 14.9], ["1 kg", 23.9]], "avis": 10, "av": [["vendredi 27 mai 2022", "Rachel S", "Nous connaissons les miels de votre boutique et n'avons jamais été déçus."], ["jeudi 31 mars 2022", "Nathalie D", "Colis reçu une semaine après ma commande en point relais , rien à redire , très bien emballé , ... (Lire la suite)miel conforme à ma commande ,"], ["vendredi 04 mars 2022", "Christian L", "super produit"]], "courte": "Le miel de pissenlit est un miel de consistance crémeuse avec une saveur discrète et appréciée des amateurs de miel doux. Il est récolté dans les Monts d'Arrée au cœur du parc d'Armorique.", "desc": "AIRE ET RÉCOLTE Nous le récoltons dans le Finistère dans le parc naturel d'Armorique (Monts d'Arrée). FLORAISON Au printemps, variable selon l'altitude. Très intense dans les pâturages des Monts d'Arrée. RÉCOLTE Courant mai, très aléatoire. Les colonies doivent être bien développées pour profiter de la floraison, qui doit, elle, bénéficier d'un temps chaud, humide, et de l'absence de vent. La récolte peut se dérouler en moins d'une semaine. COULEUR Jaune éclatant comme la fleur. PARFUM ET SAVEUR Le miel de pissenlit se reconnaît à sa légère odeur ammoniaquée. En bouche, sa saveur discrète est appréciée des amateurs de miels doux."}, {"id": "miel-de-trefle-861", "cat": "miels", "n": "Miel de Trèfle", "v": [["250 gr", 9.9], ["500 gr", 13.9], ["1 kg", 22.9]], "avis": 0, "av": [], "courte": "Le Miel de Trèfle est un miel crémeux, blanc presque gris pâle. Nous le récoltons fin Juin à fin Juillet dans les Monts d'Arrée.", "desc": "AIRE DE RÉCOLTE En plaine, où il est cultivé, et en montagne, où il pousse de manière spontanée. FLORAISON Mai, juin, parfois juillet selon l'altitude. Intense et régulière. Sensible à la sécheresse. RÉCOLTE Fin Juin-fin Juillet. Équilibrée. COULEUR Très limpide, ce miel devient presque blanc à gris pâle en se solidifiant. PARFUM ET SAVEUR Effluves floraux discrets. Très agréable, son goût délicat perdure en bouche."}, {"id": "miel-de-lierre-862", "cat": "miels", "n": "Miel de Lierre", "v": [["250 gr", 10.9], ["500 gr", 19.9], ["1 kg", 29.9]], "avis": 3, "av": [["mercredi 20 juillet 2022", "Severine P", "Un délice Mon préféré"], ["samedi 26 février 2022", "Faustine R", "Incroyable miel ! Une vraie découverte. Un goût très profond."], ["dimanche 10 mai 2020", "laurent M", "Excellent. Un plaisir renouvelé chaque année."]], "courte": "Le miel de Lierre est un miel de texture crémeuse voire solide avec une couleur ambrée. Nous le récoltons fin octobre dans notre belle région des Monts d'Arrée.", "desc": "AIRE DE RÉCOLTE Microterrains disséminés sur l'ensemble du territoire. En priorité les zones humides des bords de rivières et des forêts. FLORAISON Septembre-Octobre. Longue et continue, la floraison du Lierre représente à cette période la principale source de pollen et de nectar. RÉCOLTE Exceptionnelle. Souvent inattendue, à la merci des fluctuations climatiques défavorables. Il est vivement conseillé de récolter très rapidement. COULEUR Ambré, sombre à foncé, brun lorsqu'il se solidifie. PARFUM ET SAVEUR Son goût est frais en bouche et parfumé. Il dégage une certaine amertume."}, {"id": "miel-de-lavande-922", "cat": "miels", "n": "Miel de Lavande", "v": [["250 gr", 9.9], ["500 gr", 13.9], ["1 kg", 22.9]], "avis": 0, "av": [], "courte": "Le miel de Lavande est un miel crémeux, onctueux et parfumé. Nous le récoltons entre Chartres et Orléans", "desc": "AIRE DE RÉCOLTE Nous le récoltons entre Chartre et Orléans FLORAISON De fin juin à fin juillet, elle est intense et peut perdurer 3 à 4 semaines RÉCOLTE Courant juillet, plutôt régulière, elle peut être très importante mais dépend beaucoup et le plus souvent des conditions météorologiques du secteur et du moment, de la nature des sols et des variétés cultivées. COULEUR Clair à l'état liquide, le miel de lavande devuent jaune pale à transparent une fois solidifié. PARFUM ET SAVEUR Miel parfumé en bouche, texture très agréable en bouche. CARACTÉRISTIQUES Le miel de lavande contient beaucoup d'énergie."}, {"id": "miel-de-luzerne-923", "cat": "miels", "n": "Miel de Luzerne", "v": [["250 gr", 6.9], ["500 gr", 9.9], ["1 kg", 14.9]], "avis": 0, "av": [], "courte": "Le miel de luzerne est un miel clair et liquide de saveur très douce. Nous la récoltons dans la Marne.", "desc": "AIRE DE RÉCOLTE Nous la récoltons dans la Marne FLORAISON De fin juin à début septembre, floraison très longue. RÉCOLTE Fin août, lorsque l'exposition au soleil est normalement idéale depuis quelques semaines. COULEUR Roussâtre, il s'assombrit ou s'éclaircit parfois. PARFUM ET SAVEUR Saveur très douce et onctueuse en bouche, parfum soutenu se prolongeant en bouche"}, {"id": "ampoules-gelee-royale-bio-926", "cat": "ruche", "n": "Ampoules Gelée Royale BIO", "v": [["", 14.1]], "avis": 0, "av": [], "courte": "Ampoule Gelée Royale BIO", "desc": "Une formule concentrée associant la gelée royale biologique, le miel, la mangue et l’ananas pour une prise agréable au quotidien. Présentée en ampoules, elle allie les bienfaits naturels des produits de la ruche à des notes fruitées douces et rafraîchissantes. Idéale pour accompagner les périodes de fatigue passagère et soutenir la vitalité."}, {"id": "extrait-de-propolis-878", "cat": "ruche", "n": "Extrait de propolis", "v": [["", 11.9]], "avis": 1, "av": [["mardi 07 avril 2020", "DOMINIQUE C", "Très bon produit déjà testé"]], "courte": "Extrait de propolis, pureté et qualité.", "desc": "C'est un complément alimentaire à base de propolis dépurée sans résine ni résides inactifs de la ruche. L'extrait de propolis à 16,7% de contrentration sans alcool. Les abeilles utilisent la propolis comme agent de protection et d'hygiène de la ruche. Ingrédients actifs: Extrait glycolique de Propolis contenant : 10 mg/ml de Flavonoïdes Concentré à 16.7% de Propolis"}, {"id": "gelee-royale-pure-893", "cat": "ruche", "n": "Gelée royale pure", "v": [["", 27.0]], "avis": 4, "av": [["jeudi 22 décembre 2022", "jean louis L", "j'ai commandé avant du miel de bruyere que beaucoup ne trouvent pas bon c'est le seul; il laisse un... (Lire la suite) mauvais gout"], ["vendredi 28 octobre 2022", "Daniel M", "Comme d'habitude c'est parfait pour tous les produits."], ["samedi 22 janvier 2022", "THIERRY D", "Nickel, fidèle à la commande-petit pot pratique"]], "courte": "Gelée royale pure.", "desc": "Les abeilles butinent uniquement des fleurs issues de zones de butinage préservées, très riches et séculaires. La Gelée Royale est récoltée dans le Sud-Ouest en période de miellée, à raison de quelques grammes seulement par ruche, du mois de mai au mois d’août. De part son innocuité, sa douceur d’action, la gelée royale est adaptée à tous, aux personnes actives mais aussi sensibles ou fragiles, convalescents, seniors, enfants. Elle convient aussi aux femmes enceintes pendant la grossesse, et aux jeunes mamans débordées. Mode d'emploi: Produit concentré, pour un usage économique. Un flacon de 10 g apporte une période de 25 jours. Prendre chaque matin à jeun une dosette de 400mg (la cuillère-dose est fournie). Laisser fondre sous la langue en se relaxant pour un effet énergétique optimal. Attendre 15 minutes avant de manger. Cette période de 25 jours est bénéfique à tout moment, en particulier lors de chaque changement de saison pour revitaliser l’organisme. Cette période est renouvelable plusieurs fois de suite, sans contre-indication ! Conservez votre gelée royale au réfrigérateur avant et après ouverture."}, {"id": "gomme-de-propolis-867", "cat": "ruche", "n": "Gomme de propolis", "v": [["", 5.9]], "avis": 0, "av": [], "courte": "Gomme de propolis, Miel & Eucalyptus", "desc": "Les gommes de propolis, c'est le plaisir d'un produit gouramand recommandé pour la sphère buccale ou bien mauvaise haleine... un petit plaisir qui nous rapelle les douceur que nous offraient nos aïeux. Une saveur particulièrement appréciées des petits et des grands !"}, {"id": "infusion-du-soir-au-tilleul-875", "cat": "ruche", "n": "Infusion du soir au tilleul", "v": [["", 7.9]], "avis": 1, "av": [["jeudi 08 juillet 2021", "Eve H", "Goût agréable pour l'effet sommeil pas encore de résultat"]], "courte": "Infusion du soir au tilleul, une infusion et au dodo !", "desc": "Un mélange unique ! Retrouvez le plaisir d'une infusion du soir avec le Tilleul, la Guimauve et l'Oranger pour une saveur douce et légère, délivrant les volutes de notre extrait de Propolis afin que vous puissiez profiter de ses qualités naturelles dans cette simple boisson du soir. Principaux ingrédients: Propolis, Guimauve, Tilleul, Oranger doux, Romarin."}, {"id": "pollen-de-fleurs-898", "cat": "ruche", "n": "Pollen de fleurs", "v": [["250 gr", 14.9], ["500 gr", 24.9]], "avis": 4, "av": [["mardi 29 novembre 2022", "PASCAL M", "Efficace en cure hivernale."], ["mardi 05 octobre 2021", "Sylvia L", "Le matin je le dissous dans mon thé avec le miél.  Trés agréable."], ["lundi 22 mars 2021", "brigitte O", "Vos colis sont très bien faits et les produits arrivent en bon état. Vos miels sont délicieux ave... (Lire la suite)c pour nous une préférence pour les liquides. Quand au pollen,, je m'en sert en cure pour l'arrivée des allergies (je suis allergique au pollen de graminées) et cela a contribué fortement à diminuer les symptômes."]], "courte": "Pollen de fleurs", "desc": ""}, {"id": "preparation-base-de-miel-et-de-gelee-royale-887", "cat": "ruche", "n": "Préparation à base de miel et de gelée royale", "v": [["", 9.9]], "avis": 1, "av": [["vendredi 02 octobre 2020", "Eve HHH", "Très bien en cure"]], "courte": "Préparation à base de miel et de gelée royale", "desc": "Le miel d'Acacia et de la gelée royale réunit les plaisirs du miel à travers un necter aux notes florales et gourmandes. Pour tonifiez votre organisme grâce au vertus du miel et à la gelée royale, une préparation savoureuse alliant les bienfaits de deux trésors de la ruche. À consommer de préférence la matin à jeun l'équivalent d'une demi cuillère à café. Composition: Miel d'Acacia 97.5%, gelée royale (2.5%)."}, {"id": "preparation-base-de-miel-et-de-gelee-royale-889", "cat": "ruche", "n": "Préparation à base de vraiment  sec"]], "courte": "Pain d'épices \"maison\"", "desc": "Pain d'épices moêlleux et savoureux à déguster à tout moment de la journée."}, {"id": "gommage-visage-bio-856", "cat": "cosmetiques", "n": "Gommage visage bio", "v": [["", 16.9]], "avis": 1, "av": [["jeudi 23 décembre 2021", "Marie claire P", "Très bon produit, bon gommage mais non agressif, affine le grain de peau. Vraiment je recommande"]], "courte": "Gomme visage, Grains de rêves.", "desc": "Offrez à votre visage la douceur qu'il mérite ! Les particules exfoliantes de différentes tailles de ce gommage certifié Bio permettent de désincruster la peau en douceur et en profondeur, éliminant les cellules mortes et les impuretés. Véritable révélateur d'éclat, notre Gommage vous laisse la sensation d'une peau lisse et douce grâce à l'association de l'Aloe vera et de la Propolis. Avec son odeur fruitée d'Abricot, il est vraiment gourmand ! Principaux actifs: Aloe vera, glycérine végétale, poudre de noyaux d'abricot, propolis. Conservation: 12 mois après ouverture."}, {"id": "creme-mains-bio-858", "cat": "cosmetiques", "n": "Crème mains bio", "v": [["", 12.9]], "avis": 0, "av": [], "courte": "Crème protectrice mains, la douceur assurée", "desc": "L'hiver est rude, ou vos travaux manuels laissent sur vos mains une peau sèche? La Crème Protectrice pour les mains de Propolia, élaborée à base d'ingrédients biologiques, vous fera enfin retrouver des mains douces et hydratées grâce au Miel et au Calendula. Laissez son odeur fraîche et citronnée ravir vos narines ! Principaux actifs : Cire d'abeille, miel, calendula, citronnelle. Conservation: 12 mois après ouverture."}, {"id": "deodorant-bio-863", "cat": "cosmetiques", "n": "Déodorant bio", "v": [["", 9.9]], "avis": 0, "av": [], "courte": "Déodorant, le fraîcheur au naturel", "desc": "Le plaisir des odeurs acidulées apportées par les huiles essentielles d'agrumes et les eaux florales d'Hamamélis et de Sauge se marie à l'éfficacité indéniable de la Pierre d'Alun na
