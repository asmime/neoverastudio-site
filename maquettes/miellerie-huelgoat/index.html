:root{
--granit:#E8E7E2;--granit2:#DAD9D3;--granit3:#C9C8C1;--pierre:#6E6C66;--ink:#221A26;--ink2:#4A4250;
--bruyere:#3A1E46;--bruyere2:#2A1533;--lande:#7A4A8B;--rose:#E7BCD8;--lichen:#9BA685;--miel:#C9780C;--blanc:#FBFAF7;
--serif:'Young Serif',Georgia,serif;--sans:'Figtree Variable','Figtree',system-ui,sans-serif;
--r:14px;--ease:cubic-bezier(.16,1,.3,1);--max:1240px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--granit);color:var(--ink);font:400 17px/1.55 var(--sans);font-feature-settings:"tnum" 0}
::selection{background:var(--lande);color:#fff}
html{scrollbar-color:var(--lande) var(--granit2)}
::-webkit-scrollbar{width:11px;height:8px}::-webkit-scrollbar-track{background:var(--granit2)}::-webkit-scrollbar-thumb{background:var(--lande);border-radius:8px;border:2px solid var(--granit2)}
:focus-visible{outline:3px solid var(--miel);outline-offset:3px;border-radius:6px}
a{color:inherit;text-decoration-color:var(--lande);text-underline-offset:.22em;text-decoration-thickness:1.5px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.btn{display:inline-flex;align-items:center;gap:.55em;border:0;border-radius:999px;padding:.85em 1.45em;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;transition:background .25s,transform .25s var(--ease),color .25s;min-height:48px}
.btn-p{background:var(--bruyere);color:var(--blanc)}.btn-p:hover{background:var(--lande)}
.btn-s{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}.btn-s:hover{background:var(--ink);color:var(--granit)}
.btn-l{background:var(--rose);color:var(--bruyere2)}.btn-l:hover{background:#f2d3e7}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* header */
.bandeau{background:var(--bruyere2);color:#EADCEF;font-size:14px}
.bandeau .wrap{display:flex;justify-content:space-between;gap:16px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.bandeau b{color:#fff;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lichen);margin-right:8px;vertical-align:1px}
.dot.off{background:#c97a7a}
header.tete{position:sticky;top:0;z-index:40;background:rgba(232,231,226,.94);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--granit3)}
.tete .l1{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:8px}
.marque{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto;min-width:0}
.marque img{width:50px;height:48px;object-fit:cover;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(34,26,38,.15)}
.marque span{font-family:var(--serif);font-size:21px;line-height:1.05;white-space:nowrap}
.marque small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--pierre);letter-spacing:.02em}
.langue{position:relative}
.langue select{appearance:none;border:1.5px solid var(--ink);border-radius:999px;background:var(--blanc);padding:.5em 2.1em .5em 1em;font-weight:600;font-size:15px;cursor:pointer;min-height:42px}
.langue::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.icobtn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--bruyere);color:#fff;border-radius:999px;padding:.55em 1em;font-weight:600;font-size:15px;cursor:pointer;min-height:42px}
.icobtn:hover{background:var(--lande)}
.icobtn svg{width:19px;height:19px}
.compte{background:var(--miel);color:#fff;border-radius:999px;font-size:12.5px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
nav.menu{position:relative}
nav.menu ul{list-style:none;margin:0;padding:0 clamp(16px,4vw,40px) 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:var(--max);margin:0 auto}
nav.menu ul::-webkit-scrollbar{display:none}
nav.menu a{display:block;white-space:nowrap;text-decoration:none;padding:.45em .85em;border-radius:999px;font-weight:500;font-size:15.5px;color:var(--ink2)}
nav.menu a:hover{background:var(--granit2);color:var(--ink)}
nav.menu a[aria-current="page"]{background:var(--ink);color:var(--granit)}
nav.menu a.cons{color:var(--lande);font-weight:650}
nav.menu::after{content:"";position:absolute;right:0;top:0;bottom:10px;width:46px;background:linear-gradient(90deg,rgba(232,231,226,0),var(--granit));pointer-events:none}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;min-height:min(86vh,760px)}
.hero .txt{padding:clamp(40px,7vw,96px) clamp(16px,4vw,56px) 48px max(clamp(16px,4vw,40px),calc((100vw - var(--max))/2 + 40px));display:flex;flex-direction:column;justify-content:center;gap:26px}
.hero h1{font-size:clamp(38px,4.6vw,66px);max-width:15ch}
.hero p.lead{font-size:clamp(18px,1.6vw,21px);max-width:34ch;color:var(--ink2)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .note{font-size:14.5px;color:var(--pierre)}
.etal{position:relative;background:var(--bruyere);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:40px 20px 0}
.etal .fleurs{position:absolute;width:130%;left:-15%;top:-30%;opacity:.5}
.miniban{display:flex;gap:3px;width:min(100%,420px);height:14px;border-radius:999px;overflow:hidden}.miniban i{flex:1}
.teinte.g{display:inline-block;width:.55em;height:.55em;vertical-align:.12em;margin-right:.3em}
.etal .pots{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:0;width:100%;max-width:560px;z-index:2;margin-bottom:64px}
.etal .pots a{display:block;transition:transform .5s var(--ease)}
.etal .pots a:hover{transform:translateY(-8px)}
.etal .pots img{filter:drop-shadow(0 18px 18px rgba(0,0,0,.4))}
.etal .pots a:nth-child(1){width:36%;margin-right:-6%}
.etal .pots a:nth-child(2){width:44%;z-index:2}
.etal .pots a:nth-child(3){width:36%;margin-left:-6%}
.etal .rebord{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(180deg,#CFCEC7,#B8B7B0);box-shadow:0 -1px 0 rgba(255,255,255,.4) inset}
.etal .prix{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:8%;font-size:14px;color:var(--ink);z-index:3}
.etal .prix a{text-decoration:none}.etal .prix span{background:var(--blanc);padding:4px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
/* comptoir (geste) */
.comptoir{position:relative;height:250vh;background:var(--granit2)}
.comptoir .scene{position:sticky;top:0;height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:clamp(20px,4vw,60px);max-width:var(--max);margin:0 auto;padding:110px clamp(16px,4vw,40px) 30px}
.bocal{position:relative;width:min(40vw,470px);aspect-ratio:1;justify-self:center}
.bocal svg{width:100%;height:100%;overflow:visible}
#couv{transform-box:fill-box;transform-origin:50% 50%;will-change:transform,opacity}
.fiche-miel{display:flex;flex-direction:column;gap:18px}
.fiche-miel h2{font-size:clamp(32px,3.6vw,52px)}
.fiche-miel .intro{color:var(--ink2);max-width:40ch}
.revele{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.revele.on{opacity:1;transform:none}
.carnet{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15.5px;margin:0}
.carnet dt{color:var(--pierre);font-weight:500}
.carnet dd{margin:0}
.nom-miel{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.nom-miel h3{font-size:clamp(26px,2.6vw,36px)}
.nom-miel .px{font-weight:650;color:var(--miel);font-size:19px}
.achat{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.achat select{border:1.5px solid var(--ink);border-radius:999px;background:var(--blanc);padding:.6em 1em;min-height:48px;font-weight:600}
.nuancier{display:flex;flex-direction:column;gap:8px}
.nuancier .lbl{display:flex;justify-content:space-between;font-size:13.5px;color:var(--pierre)}
.nuancier .rang{display:flex;gap:6px;flex-wrap:wrap}
.pastille{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.pastille:hover{transform:scale(1.12)}
.pastille[aria-pressed="true"]{box-shadow:inset 0 0 0 3px #fff,0 0 0 2.5px var(--ink)}
/* sections */
section.bloc{padding:clamp(64px,9vw,120px) 0}
.lande{background:var(--bruyere);color:#EFE4F2}
.lande .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,72px);align-items:center}
.lande h2{font-size:clamp(34px,4.2vw,60px);color:#fff}
.lande p{font-size:18.5px;max-width:44ch;margin-top:18px;color:#E3D6E8}
.lande .ph{position:relative}
.lande .ph img{border-radius:var(--r);aspect-ratio:3/4;object-fit:cover;width:100%;max-height:640px}
.lande .ph figcaption,.legende{font-size:13px;color:inherit;opacity:.75;margin-top:8px}
.lande .ph .vignette{position:absolute;left:-12%;bottom:8%;width:46%;border:6px solid var(--bruyere);border-radius:var(--r);aspect-ratio:auto}
.lande a.lien{color:var(--rose);font-weight:600;display:inline-block;margin-top:26px}
.titre-sec{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.titre-sec h2{font-size:clamp(32px,3.8vw,54px)}
.titre-sec p{color:var(--pierre);max-width:40ch}
.rayons{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.rayon{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:18px;background:var(--blanc);border-radius:var(--r);padding:26px;text-decoration:none;min-height:300px;overflow:hidden;transition:background .3s}
.rayon:hover{background:#fff}
.rayon h3{font-size:clamp(24px,2.2vw,32px)}
.rayon p{color:var(--ink2);max-width:30ch;font-size:16px}
.rayon .n{font-size:14px;color:var(--lande);font-weight:650}
.rayon .imgs{display:flex;align-items:flex-end;justify-content:flex-end;gap:0;margin-top:auto}
.rayon .imgs img{width:34%;margin-left:-6%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.16));transition:transform .5s var(--ease)}
.rayon:hover .imgs img:nth-child(2){transform:translateY(-6px)}
.r1{grid-column:span 7}.r2{grid-column:span 5}.r3{grid-column:span 4}.r4{grid-column:span 4}.r5{grid-column:span 4}
.r1{background:var(--rose)}.r1:hover{background:#f0cde3}
.etagere{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.etagere .carte{flex:0 0 220px;scroll-snap-align:start}
/* cartes produit */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.carte{background:var(--blanc);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .3s}
.carte:hover{box-shadow:0 10px 30px -12px rgba(34,26,38,.28)}
.carte a.vis{display:block;background:linear-gradient(180deg,#F3F2EE,#E2E1DB);aspect-ratio:1;padding:14px}
.carte a.vis img{width:100%;height:100%;object-fit:contain;transition:transform .5s var(--ease)}
.carte:hover a.vis img{transform:scale(1.04)}
.carte .corps{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.carte h3{font-size:19px;line-height:1.15}
.carte h3 a{text-decoration:none}
.carte .acc{font-size:14.5px;color:var(--ink2);line-height:1.45}
.carte .bas{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:8px}
.carte .p{font-weight:650}
.carte .p small{font-weight:400;color:var(--pierre)}
.carte .ajout{border:0;background:var(--bruyere);color:#fff;border-radius:999px;padding:.5em .95em;font-weight:600;font-size:14.5px;cursor:pointer;min-height:40px}
.carte .ajout:hover{background:var(--lande)}
.carte .ajout.ok{background:var(--lichen);color:var(--ink)}
.carte .meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--pierre)}
.teinte{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);flex:none}
/* magasin */
.magasin{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:center}
.magasin img{border-radius:var(--r);width:100%;aspect-ratio:4/3;object-fit:cover}
.magasin h2{font-size:clamp(30px,3.4vw,48px)}
.magasin .infos{display:flex;flex-direction:column;gap:18px}
.horaires{display:flex;gap:10px;align-items:center;font-weight:600}
.tel{display:flex;gap:10px;flex-wrap:wrap}
.adresse{font-style:normal;color:var(--ink2)}
/* video + avis */
.duo{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,4vw,56px);align-items:start}
.video{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--bruyere2)}
.video img{width:100%;height:100%;object-fit:cover;opacity:.75}
.video button{position:absolute;inset:auto auto 22px 22px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.avis{display:flex;flex-direction:column;gap:16px}
.avis blockquote{margin:0;padding:18px 20px;background:var(--blanc);border-radius:var(--r);font-size:17px}
.avis cite{display:block;font-style:normal;font-size:13.5px;color:var(--pierre);margin-top:8px}
/* livraison */
.livr{list-style:none;padding:0;margin:0;max-width:760px;border-top:1.5px solid var(--ink)}
.livr li{padding:14px 0;border-bottom:1px solid var(--granit3);font-size:17px}
/* footer */
footer{background:var(--bruyere2);color:#DCCDE2;padding:64px 0 28px;margin-top:0}
footer a{color:#fff}
footer .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px}
footer h3{font-size:22px;color:#fff;margin-bottom:12px}
footer p,footer li{font-size:15px}
footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
footer form{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
footer input[type=email]{flex:1;min-width:180px;border:1.5px solid #8b6c97;background:transparent;color:#fff;border-radius:999px;padding:.7em 1em;min-height:46px}
footer input::placeholder{color:#B9A6C1}
.sondage{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sondage button{border:1.5px solid #8b6c97;background:transparent;color:#EADCEF;border-radius:999px;padding:.35em .8em;cursor:pointer;font-size:14px}
.sondage button:hover{background:#4b2b58}
.reseaux{display:flex;gap:10px;margin-top:14px}
.reseaux a{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#4b2b58}
.reseaux a:hover{background:var(--lande)}
.reseaux svg{width:20px;height:20px;fill:#fff}
.basdepage{border-top:1px solid #4b2b58;margin-top:40px;padding-top:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13.5px}
.basdepage nav{display:flex;gap:16px;flex-wrap:wrap}
/* pages */
.page-t{padding:clamp(36px,6vw,72px) 0 28px}
.page-t h1{font-size:clamp(36px,5vw,68px)}
.page-t p{color:var(--ink2);margin-top:12px;max-width:52ch}
.outils{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 24px}
.chip{border:1.5px solid var(--granit3);background:var(--blanc);border-radius:999px;padding:.45em .95em;cursor:pointer;font-weight:500;font-size:15px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--granit);border-color:var(--ink)}
.recherche{flex:1;min-width:220px;border:1.5px solid var(--granit3);background:var(--blanc);border-radius:999px;padding:.6em 1.1em;min-height:44px}
.outils select{border:1.5px solid var(--granit3);background:var(--blanc);border-radius:999px;padding:.55em 1em;min-height:44px}
.vide{padding:40px;text-align:center;color:var(--pierre)}
.produit{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);padding:24px 0 72px;align-items:start}
.produit .vis{background:linear-gradient(180deg,#F3F2EE,#DCDBD5);border-radius:var(--r);aspect-ratio:1;display:grid;place-items:center;padding:8%;position:sticky;top:130px}
.produit .vis img{max-height:100%;object-fit:contain;filter:drop-shadow(0 16px 20px rgba(0,0,0,.2))}
.produit h1{font-size:clamp(34px,4vw,56px)}
.produit .acc{font-size:19px;color:var(--ink2);margin-top:12px}
.produit .prixg{font-size:28px;font-weight:650;margin:18px 0 4px}
.produit .opts{display:flex;flex-direction:column;gap:14px;margin:20px 0}
.produit label{font-weight:600;font-size:15px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.seg button{border:1.5px solid var(--granit3);background:var(--blanc);border-radius:999px;padding:.5em 1em;cursor:pointer;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--granit)}
.qte{display:inline-flex;align-items:center;border:1.5px solid var(--granit3);border-radius:999px;background:var(--blanc)}
.qte button{border:0;background:none;width:44px;height:44px;cursor:pointer;font-size:20px}
.qte span{min-width:28px;text-align:center;font-weight:650}
.rassure{list-style:none;padding:0;margin:24px 0 0;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--ink2)}
.rassure li{display:flex;gap:10px;align-items:center}
.rassure svg{width:18px;height:18px;flex:none;stroke:var(--lande)}
.carnet-p{margin-top:28px;background:var(--blanc);border-radius:var(--r);padding:22px 24px}
.carnet-p h2{font-size:24px;margin-bottom:14px}
.texte{max-width:72ch;padding-bottom:80px}
.texte p{margin-bottom:14px;white-space:pre-line}
.histoire{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;padding-bottom:80px}
.histoire figure{margin:0}
.histoire img{border-radius:var(--r);width:100%;height:100%;object-fit:cover}
.histoire .t{grid-column:1/8;font-size:18.5px;line-height:1.6;display:flex;flex-direction:column;gap:16px;max-width:60ch}.histoire .t p:first-child{font-family:var(--serif);font-size:clamp(22px,2.2vw,30px);line-height:1.3}
.histoire figcaption{margin-top:10px}
.form{display:grid;gap:14px;max-width:640px}
.form input,.form select,.form textarea{width:100%;border:1.5px solid var(--granit3);background:var(--blanc);border-radius:12px;padding:.75em 1em;min-height:48px}
.form textarea{min-height:150px;resize:vertical}
.form .err{color:#9b2c2c;font-weight:600}
.form .ok{color:#2f5d2f;font-weight:600}
.contact-g{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;padding-bottom:80px}
/* panier */
.voile{position:fixed;inset:0;background:rgba(34,26,38,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
.voile.on{opacity:1;pointer-events:auto}
.tiroir{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--granit);z-index:70;transform:translateX(102%);transition:transform .45s var(--ease);display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.tiroir.on{transform:none}
.tiroir header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--granit3)}
.tiroir h2{font-size:26px}
.ferme{border:0;background:var(--granit2);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1}
.lignes{flex:1;overflow:auto;padding:12px 20px;display:flex;flex-direction:column;gap:12px}
.ligne{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--blanc);border-radius:12px;padding:8px}
.ligne img{width:64px;height:64px;object-fit:contain}
.ligne .nm{font-weight:600;font-size:15px;line-height:1.25}
.ligne .sz{font-size:13px;color:var(--pierre)}
.ligne .qte button{width:34px;height:34px;font-size:17px}
.ligne .rm{border:0;background:none;color:var(--pierre);font-size:13px;cursor:pointer;text-decoration:underline}
.tiroir .pied{padding:16px 20px;border-top:1px solid var(--granit3);display:flex;flex-direction:column;gap:12px;background:var(--granit2)}
.tiroir .tot{display:flex;justify-content:space-between;font-weight:650;font-size:18px}
.tiroir select{width:100%;border:1.5px solid var(--granit3);border-radius:12px;padding:.6em .8em;background:var(--blanc);min-height:44px}
.tiroir .petit{font-size:13px;color:var(--pierre)}
/* conseiller */
.cons-btn{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;align-items:center;gap:10px;background:var(--bruyere);color:#fff;border:0;border-radius:999px;padding:8px 18px 8px 8px;cursor:pointer;box-shadow:0 12px 30px -10px rgba(34,26,38,.55);text-align:left}
.cons-btn .av{width:44px;height:44px;border-radius:50%;background:var(--rose);display:grid;place-items:center;flex:none}
.cons-btn .av svg{width:26px;height:26px}
.cons-btn b{display:block;font-size:15px}
.cons-btn small{display:block;font-size:12.5px;color:#E1CFE8}
.bulle-inv{position:fixed;right:18px;bottom:88px;z-index:50;background:var(--blanc);border-radius:16px;padding:14px 40px 14px 16px;max-width:280px;box-shadow:0 14px 34px -12px rgba(34,26,38,.4);font-size:15px;opacity:0;transform:translateY(10px);transition:all .5s var(--ease);pointer-events:none}
.bulle-inv.on{opacity:1;transform:none;pointer-events:auto}
.bulle-inv button{position:absolute;top:6px;right:6px;border:0;background:none;font-size:20px;cursor:pointer;width:32px;height:32px}
.chat{position:fixed;right:18px;bottom:18px;z-index:80;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 36px));background:var(--granit);border-radius:20px;box-shadow:0 30px 60px -20px rgba(34,26,38,.6);display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px) scale(.98);opacity:0;pointer-events:none;transition:all .4s var(--ease)}
.chat.on{transform:none;opacity:1;pointer-events:auto}
.chat header{background:var(--bruyere);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.chat header b{display:block;font-family:var(--serif);font-weight:400;font-size:19px}
.chat header small{color:#E1CFE8;font-size:12.5px}
.chat header .ferme{margin-left:auto;background:#4b2b58;color:#fff}
.fil{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45}
.msg.b{background:var(--blanc);border-bottom-left-radius:4px}
.msg.u{background:var(--bruyere);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .reco{display:flex;gap:10px;align-items:center;margin-top:8px;background:var(--granit2);border-radius:12px;padding:6px}
.msg .reco img{width:48px;height:48px;object-fit:contain}
.msg .reco button{margin-left:auto;border:0;background:var(--bruyere);color:#fff;border-radius:999px;padding:.4em .8em;cursor:pointer;font-weight:600;font-size:13.5px}
.puces{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.puces button{border:1.5px solid var(--granit3);background:var(--blanc);border-radius:999px;padding:.35em .8em;cursor:pointer;font-size:14px}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--granit3)}
.chat input{flex:1;border:1.5px solid var(--granit3);border-radius:999px;padding:.6em 1em;background:var(--blanc);min-height:44px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:999px;padding:.7em 1.2em;z-index:90;opacity:0;transition:all .35s var(--ease);font-weight:600;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.apparait{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.apparait.vu{opacity:1;transform:none}
@media (max-width:1000px){
 .hero{grid-template-columns:1fr}

 footer .cols{grid-template-columns:1fr 1fr}
 .produit .vis{position:relative;top:0}
 .histoire .t{grid-column:1/-1}
}
@media (max-width:640px){
 body{font-size:16px}

 .bocal{width:min(52vw,250px)}

 .r1,.r2,.r3,.r4,.r5{grid-column:1/-1}

 .comptoir .carnet,.comptoir .voirf{display:none}

 .fiche-miel h2{font-size:28px}

 .apparait,.revele{opacity:1;transform:none}

I.it={
831:["Miele di acacia","Chiaro, liquido, dolcissimo. Raccolto a fine maggio in Gironda.","Nuova Aquitania (Gironda)|Capricciosa: pochi giorni nelle annate buone|Fine maggio – inizio giugno, abbondante o nulla|Giallo pallidissimo, quasi trasparente|Profumo discreto del fiore, dolcissimo"],
843:["Miele di rovo","Chiaro e liquido, il più venduto. Raccolto a luglio sui Monts d'Arrée.","Monts d'Arrée, parco naturale d'Armorica|Fine giugno – fine luglio, quasi un mese|Appena sbocciano gli ultimi fiori|Rossiccio, secondo i fiori vicini|Sottobosco caldo e umido, gusto persistente"],
844:["Miele di erica","Liquido, colorato, molto profumato. L'erica dei Monts d'Arrée.","Monts d'Arrée|Luglio – agosto, una quindicina di giorni|Metà giugno – metà agosto, sensibile a pioggia e siccità|Ambra scura, più chiaro cristallizzando|Legnoso, forte, acidulo, una punta di caramello o mandorla"],
845:["Miele di castagno","Liquido, scuro, deciso e nettamente amaro. Raccolto in Dordogna.","Dordogna|Fine giugno – inizio luglio, tre settimane|A luglio, favorito dalla rugiada|Ambra scura|Profumo forte e suadente, legnoso, leggero amaro"],
847:["Miele cremoso","Colza vellutata dal gusto finissimo, ideale da spalmare. I bambini lo adorano.","Monts d'Arrée e Limosino, secondo la stagione|Aprile – inizio maggio, tre settimane|A maggio|Grigio chiaro quasi bianco quando si rapprende|Dolcissimo, fondente"],
849:["Miele di grano saraceno","Liquido, quasi nero, di grande carattere. Raccolto nel sud del Finistère.","Bretagna e Francia centrale|Lunga, diverse settimane d'estate|Luglio – fine agosto|Bruno denso, quasi nero|Legno e terra, sapori potenti"],
850:["Miele dei Monts d'Arrée","I fiori selvatici della brughiera, rovo ed erica in testa.","Parco naturale d'Armorica, Finistère|Luglio – agosto|Fine agosto|Ambrato o rossiccio|Aroma marcato di fiori selvatici"],
851:["Miele di fruttiferi e biancospino","Raro, vellutato, dolcissimo. Raccolto sui Monts d'Arrée.","Nord e ovest della Francia|Aprile – maggio, breve e intensa|Capricciosa, generosa con tempo caldo e secco|Giallo pallido, avorio|Fruttato, suadente, lungo in bocca"],
852:["Miele di frangola","Poco conosciuto: sa di caramella al miele, poi note più intense.","Aquitania e Massiccio Centrale|Fine maggio – inizio luglio|A luglio|Scuro, bruno rossiccio cristallizzato|Fruttato, balsamico, delicato"],
853:["Miele di brugo","Erica calluna, consistenza gelatinosa e cristalli fini.","Landes|Fine luglio – fine settembre|Molto irregolare, un temporale può salvarla|Ambra con riflessi rossi|Aroma potente"],
855:["Miele di tiglio","Mentolato, balsamico, persistente. Raccolto nel Limosino.","Limosino|Giugno – inizio luglio, in pochi giorni|Inizio luglio, in balia del meteo|Ambra chiara, giallo quando si rapprende|Mentolato, potente"],
860:["Miele di tarassaco","Cremoso, sapore discreto. I pascoli primaverili dei Monts d'Arrée.","Monts d'Arrée, parco naturale d'Armorica|Primavera, secondo l'altitudine|A maggio, a volte in meno di una settimana|Giallo vivo come il fiore|Dolce e discreto"],
861:["Miele di trifoglio","Cremoso, da bianco a grigio pallido. Raccolto da fine giugno a fine luglio.","Monts d'Arrée|Maggio – giugno, a volte luglio|Fine giugno – fine luglio|Quasi bianco o grigio pallido|Floreale discreto, delicato"],
862:["Miele di edera","Cremoso o sodo, ambrato. L'ultima raccolta, a fine ottobre.","Monts d'Arrée, rive dei fiumi e boschi|Settembre – ottobre|Fine ottobre, eccezionale|Ambra, bruno quando si rapprende|Carattere deciso"],

925:["Miele di avocado","Dal Messico, un miele scuro dal carattere particolarissimo.","Messico|—|—|—|Sorprendente, deciso"],

send('open');setInterval(function(){if(document.visibilityState==='visible')send('ping')},45000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')send('ping')});
window.__nvView=function(p){p=String(p||'');if(p&&p!==last){last=p;send('view',p)}};
addEventListener('scroll',function(){var h=document.documentElement,max=h.scrollHeight-innerHeight;if(max<200)return;var r=(scrollY/max)*100;[25,50,75,100].forEach(function(q){if(r>=q-2)once('defil'+q+'-'+last)})},{passive:true});
document.addEventListener('click',function(e){var el=e.target.closest('a,button,[data-add],[data-go],[role=button],summary');if(!el)return;var t=((el.getAttribute('aria-label')||'')+' '+(el.textContent||'')+' '+(el.className||'')+' '+(el.id||'')).toLowerCase(),h=el.getAttribute&&el.getAttribute('href')||'';
if(el.hasAttribute('data-add')||/ajouter|add to|añadir|hinzuf|aggiungi|加入/.test(t))once('panier-'+(el.getAttribute('data-add')||'ajout')),send('ev','panier');
else if(/conseil|advisor|assistant|chat/.test(t))once('conseiller');
else if(/instagram|facebook|youtube|pinterest|linkedin|tiktok/.test(h))once('reseau-'+(h.match(/instagram|facebook|youtube|pinterest|linkedin|tiktok/)||[''])[0]);
else if(/réserv|reserv|visite|book/.test(t))once('reservation');
else if(/coffret|gift|cadeau/.test(t))once('coffret')},true);
document.addEventListener('play',function(e){if(e.target&&e.target.tagName==='VIDEO'&&!e.target.muted)once('video-son')},true);
try{new MutationObserver(function(){var l=(document.documentElement.lang||'').slice(0,2);if(l&&l!=='fr')once('langue-'+l)}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']})}catch(x){}
addEventListener('load',function(){try{if(typeof window.go==='function'&&!window.go.__nv){var g=window.go;window.go=function(v){try{window.__nvView(v)}catch(x){}return g.apply(this,arguments)};window.go.__nv=1}}catch(x){}});})();</script>
