@font-face{font-family:"Young Serif";src:url(fonts/young-serif-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --feuille:#24401F;      /* vert profond de la feuille de tilleul */
  --feuille-2:#33562B;
  --bractee:#E8E3BE;      /* bractée pâle de la fleur de tilleul */
  --fleur:#F5F2DF;        /* papier fleur de tilleul */
  --blanc:#FCFBF5;
  --roulotte:#9E2A26;     /* rouge des portes : roulotte, cabane, tonneau */
  --roulotte-f:#7E1F1C;
  --ciel:#C9D5DC;         /* ciel du Nord, gris-bleu */
  --canche:#5E7F8C;
  --encre:#1C2619;
  --encre-2:#4A5546;
  --filet:rgba(28,38,25,.16);
  --serif:"Young Serif",Georgia,"Noto Serif JP",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:4px;--ombre:0 10px 30px -12px rgba(28,38,25,.28);
  --g:clamp(16px,4vw,48px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fleur);color:var(--encre);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--feuille);color:var(--bractee)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bractee)}::-webkit-scrollbar-thumb{background:var(--feuille-2);border-radius:10px;border:2px solid var(--bractee)}
html{scrollbar-color:var(--feuille-2) var(--bractee)}
:focus-visible{outline:2px solid var(--roulotte);outline-offset:3px;border-radius:2px}
img{max-width:100%;display:block}
a{color:inherit;text-decoration-color:var(--roulotte);text-underline-offset:3px;text-decoration-thickness:1.5px}
a:hover{color:var(--roulotte)}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(38px,6vw,78px)}
h2{font-size:clamp(30px,4.2vw,52px)}
h3{font-size:clamp(21px,2vw,26px)}
p{margin:0 0 1em;text-wrap:pretty}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--g)}
.lede{font-size:clamp(18px,1.6vw,21px);color:var(--encre-2);max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:999px;border:1.5px solid var(--feuille);background:var(--feuille);color:var(--bractee);font:600 16px/1.1 var(--sans);text-decoration:none;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.btn:hover{background:var(--roulotte);border-color:var(--roulotte);color:#fff}
.btn:active{transform:translateY(1px)}
.btn.clair{background:transparent;color:var(--feuille)}
.btn.clair:hover{background:var(--feuille);color:var(--bractee)}
.btn.rouge{background:var(--roulotte);border-color:var(--roulotte);color:#fff}
.btn.rouge:hover{background:var(--roulotte-f);border-color:var(--roulotte-f)}
.lien{font-weight:600;text-decoration:underline;color:var(--feuille)}
.lien::after{content:" →"}
section{padding:clamp(64px,9vw,120px) 0}
.sombre{background:var(--feuille);color:var(--bractee)}
.sombre .lede{color:#CFD3B4}
.sombre a:hover{color:#fff}
.sombre ::selection{background:var(--bractee);color:var(--feuille)}
/* ---------- en-tête ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--fleur);border-bottom:1px solid var(--filet)}
.top-l1{display:flex;align-items:center;gap:16px;padding:10px var(--g);max-width:1440px;margin:0 auto}
.marque{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--feuille);margin-right:auto;min-width:0}
.marque svg{width:34px;height:34px;flex:none}
.marque b{font:400 21px/1 var(--serif);white-space:nowrap}
.marque small{display:block;font:500 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--encre-2);margin-top:3px}
.langue{position:relative}
.langue select{appearance:none;-webkit-appearance:none;font:500 15px var(--sans);color:var(--encre);background:var(--blanc);border:1.5px solid var(--feuille);border-radius:999px;padding:9px 34px 9px 14px;min-height:42px;cursor:pointer}
.langue::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--feuille);border-bottom:2px solid var(--feuille);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.top .btn{min-height:42px;padding:9px 18px;font-size:15px}
.nav{max-width:1440px;margin:0 auto;padding:0 var(--g);position:relative}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0 0 8px;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;padding:8px 12px;border-radius:999px;text-decoration:none;font:500 15px/1.2 var(--sans);white-space:nowrap;color:var(--encre)}
.nav a:hover{background:var(--bractee);color:var(--feuille)}
.nav a[aria-current="page"]{background:var(--feuille);color:var(--bractee)}
.nav a.cs-lien{color:var(--roulotte)}
@media (max-width:1100px){.nav::after{content:"";position:absolute;right:0;top:0;bottom:8px;width:48px;background:linear-gradient(90deg,rgba(245,242,223,0),var(--fleur));pointer-events:none}}
@media (max-width:640px){.marque small{display:none}.marque b{font-size:17px;white-space:normal;line-height:1.05;display:block;max-width:9.5em}.top .btn{padding:9px 14px}.langue select{padding:9px 30px 9px 12px;font-size:14px}.top-l1{gap:10px}}
@media (max-width:420px){.top .btn span{display:none}}
/* ---------- vues ---------- */
.vue{display:none}.vue.on{display:block}
/* ---------- héros ---------- */
.heros{padding:clamp(28px,4vw,56px) 0 clamp(48px,6vw,80px)}
.heros-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);align-items:center}
.heros h1 .t-mot{display:inline-block}
.heros .lede{margin:10px 0 26px}
.offre{font:600 17px/1.4 var(--sans);color:var(--roulotte);margin:22px 0 0}
.cadre-video{position:relative;border-radius:180px 180px var(--r) var(--r);overflow:hidden;aspect-ratio:4/5;background:var(--bractee) url(img/camping.jpg) center/cover;box-shadow:var(--ombre)}
.cadre-video video{width:100%;height:100%;object-fit:cover}
.cadre-video figcaption{position:absolute;left:14px;bottom:14px;background:rgba(28,38,25,.72);color:var(--fleur);font-size:13px;padding:6px 12px;border-radius:999px}
@media (max-width:860px){.heros-g{grid-template-columns:1fr}.cadre-video{aspect-ratio:16/11;border-radius:120px 120px var(--r) var(--r);order:-1}}
@media (max-width:520px){.cadre-video{aspect-ratio:4/3;border-radius:90px 90px var(--r) var(--r)}}
.resa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;background:var(--blanc);border:1.5px solid var(--feuille);border-radius:14px;overflow:hidden;box-shadow:var(--ombre)}
.resa label{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-right:1px solid var(--filet);font:600 12px/1.2 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--encre-2);min-width:0}
.resa input,.resa select{border:0;background:transparent;font:500 16px var(--sans);color:var(--encre);padding:4px 0;min-width:0;width:100%}
.resa input:focus,.resa select:focus{outline:none}
.resa label:focus-within{background:var(--fleur)}
.resa .btn{border-radius:0;grid-column:1/-1;min-height:52px;padding:14px 22px}
.resa label:nth-child(3){border-right:0}
@media (max-width:720px){.resa{grid-template-columns:1fr 1fr}.resa label:nth-child(2){border-right:0}.resa label:nth-child(3){grid-column:1/-1;border-top:1px solid var(--filet);border-right:0}.resa .btn{grid-column:1/-1;min-height:52px}}
.rassure{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:14.5px;color:var(--encre-2);list-style:none;padding:0}
.rassure li{display:flex;align-items:center;gap:7px}
.rassure svg{width:16px;height:16px;color:var(--feuille-2);flex:none}
/* ---------- étiquettes d'herbier (hébergements) ---------- */
.tete{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.tete .lede{margin:14px 0 0}
.filtres{display:flex;flex-wrap:wrap;gap:8px}
.filtres button{font:500 15px var(--sans);min-height:42px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--feuille);background:transparent;color:var(--feuille);cursor:pointer}
.filtres button[aria-pressed="true"]{background:var(--feuille);color:var(--bractee)}
.filtres button:hover{border-color:var(--roulotte);color:var(--roulotte)}
.filtres button[aria-pressed="true"]:hover{color:var(--bractee)}
.herbier{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(18px,2.4vw,32px)}
.planche{grid-column:span 4;display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--blanc);border-radius:var(--r);box-shadow:0 1px 0 var(--filet);transition:transform .25s,box-shadow .25s}
.planche:nth-child(5n+1){grid-column:span 7}.planche:nth-child(5n+2){grid-column:span 5}
.planche:hover{transform:translateY(-3px);box-shadow:var(--ombre);color:inherit}
.planche .ph{aspect-ratio:16/10;overflow:hidden;border-radius:var(--r) var(--r) 0 0;background:var(--bractee)}
.planche:nth-child(5n+1) .ph{aspect-ratio:16/8.4}
.planche .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.planche:hover .ph img{transform:scale(1.035)}
.etiq{margin:-26px 16px 16px;position:relative;background:var(--fleur);border:1px solid var(--encre);padding:14px 16px 12px;border-radius:2px}
.etiq::before{content:"";position:absolute;inset:3px;border:1px solid var(--filet);pointer-events:none}
.planche .etiq{flex:1}
.etiq h3{font-size:22px;margin-bottom:6px}
.etiq dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:14.5px}
.etiq dt{color:var(--encre-2)}
.etiq dd{margin:0;font-weight:500}
.etiq .genre{font:italic 400 14px var(--sans);color:var(--roulotte);margin:0 0 4px}
@media (max-width:980px){.planche,.planche:nth-child(5n+1),.planche:nth-child(5n+2){grid-column:span 6}.planche:nth-child(5n+1) .ph{aspect-ratio:16/10}}
@media (max-width:620px){.planche,.planche:nth-child(5n+1),.planche:nth-child(5n+2){grid-column:1/-1}}
.planche[hidden]{display:none}
.planche.hesite{background:var(--feuille);color:var(--bractee);justify-content:center;padding:28px;min-height:220px}.planche.hesite h3{font-size:28px;margin-bottom:10px}.planche.hesite p{color:#CFD3B4}.planche.hesite .btn{margin-top:6px}.planche.hesite:hover{color:var(--bractee)}
/* ---------- geste signature : l'abri télescopique ---------- */
.abri{background:var(--encre);color:var(--bractee);padding:0}
.abri-scene{height:260vh;position:relative}
.abri-colle{position:sticky;top:0;height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:center;gap:clamp(20px,4vw,56px);padding:clamp(90px,10vh,120px) var(--g) 40px;max-width:1440px;margin:0 auto}
.abri-txt .lede{color:#C7CDB8}
.abri-txt h2{margin-bottom:18px}
.abri-vue{position:relative;aspect-ratio:4/3;max-height:72vh;width:100%;border-radius:var(--r);overflow:hidden;background:#0d130c}
.abri-vue img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.abri-segs{position:absolute;inset:0}
.seg{position:absolute;top:0;bottom:0;width:20.5%;will-change:transform;background:linear-gradient(180deg,rgba(225,232,236,.34),rgba(200,214,222,.22));border-left:6px solid var(--feuille);border-right:1px solid rgba(232,227,190,.35);box-shadow:-12px 0 26px -14px rgba(0,0,0,.65)}
.seg::after{content:"";position:absolute;left:-6px;right:-1px;top:0;height:16%;border-top:6px solid var(--feuille);border-radius:50% 50% 0 0/100% 100% 0 0}
.abri-vue::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(28,38,25,.0) 60%,rgba(28,38,25,.35))}
.abri-bascule{display:flex;gap:8px;margin:22px 0 8px}
.abri-bascule button{font:500 15px var(--sans);min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--bractee);background:transparent;color:var(--bractee);cursor:pointer}
.abri-bascule button[aria-pressed="true"]{background:var(--bractee);color:var(--encre)}
.abri-faits{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:6px;font-size:15.5px;color:#D9DCC6}
.abri-faits li{padding-left:18px;position:relative}
.abri-faits li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--roulotte)}
.abri-etat{font:italic 400 15px var(--sans);color:#AEB59C;min-height:1.4em}
@media (max-width:900px){.abri-scene{height:auto}.abri-colle{position:relative;height:auto;grid-template-columns:1fr;padding:72px var(--g)}.abri-vue{max-height:none}}
/* ---------- activités ---------- */
.act-g{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(120px,15vw);gap:12px}
.act-g figure{margin:0;position:relative;overflow:hidden;border-radius:var(--r);background:var(--bractee)}
.act-g img{width:100%;height:100%;object-fit:cover}
.act-g figcaption{position:absolute;left:10px;bottom:10px;background:var(--fleur);color:var(--encre);font:500 14px var(--sans);padding:4px 10px;border-radius:999px}
.act-g .a1{grid-column:span 3;grid-row:span 2}.act-g .a2{grid-column:span 3}.act-g .a3{grid-column:span 2}.act-g .a4{grid-column:span 1}.act-g .a5{grid-column:span 2}.act-g .a6{grid-column:span 2}.act-g .a7{grid-column:span 2}
@media (max-width:760px){.act-g{grid-template-columns:repeat(2,1fr);grid-auto-rows:42vw}.act-g figure{grid-column:span 1!important;grid-row:span 1!important}.act-g .a1{grid-column:1/-1!important}}
.liste-act{columns:3 240px;column-gap:32px;margin:36px 0 0;padding:0;list-style:none}
.liste-act li{break-inside:avoid;padding:8px 0;border-top:1px solid var(--filet);font-size:15.5px}
.liste-act b{font-weight:600}
/* ---------- deux colonnes génériques ---------- */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,80px);align-items:center}
.duo.inv>:first-child{order:2}
@media (max-width:860px){.duo{grid-template-columns:1fr}.duo.inv>:first-child{order:0}}
.photo{border-radius:var(--r);overflow:hidden;box-shadow:var(--ombre);background:var(--bractee)}
.photo img{width:100%;height:100%;object-fit:cover}
.arche{border-radius:999px 999px var(--r) var(--r)}
/* village */
.village{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;margin-top:32px;border-top:1px solid var(--filet)}
.village div{padding:16px 18px 16px 0;border-bottom:1px solid var(--filet);font-size:15.5px}
.village b{display:block;font:400 19px/1.2 var(--serif);color:var(--feuille);margin-bottom:4px}
/* distances : panneau de route */
.panneau{background:var(--blanc);border:2px solid var(--encre);border-radius:6px;padding:6px 0;max-width:520px;box-shadow:var(--ombre)}
.panneau li{display:flex;justify-content:space-between;gap:16px;padding:9px 18px;border-bottom:1px solid var(--filet);font:500 16px var(--sans)}
.panneau li:last-child{border:0}
.panneau ul{list-style:none;margin:0;padding:0}
.panneau span:last-child{font-variant-numeric:tabular-nums;color:var(--roulotte);font-weight:600;white-space:nowrap}
.alent-g{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin-top:32px}
.alent-g figure{margin:0;position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;background:var(--bractee)}
.alent-g figure:first-child{aspect-ratio:3/4}
.alent-g img{width:100%;height:100%;object-fit:cover}
.alent-g figcaption{position:absolute;left:10px;bottom:10px;right:10px;color:#fff;font:500 14px var(--sans);text-shadow:0 1px 8px rgba(0,0,0,.7)}
@media (max-width:760px){.alent-g{grid-template-columns:1fr 1fr}.alent-g figure:first-child{grid-column:1/-1;aspect-ratio:16/11}}
/* rester : résidentiel / vente */
.rester{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,40px)}
.carte-r{background:var(--blanc);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;color:var(--encre)}
.carte-r .ph{aspect-ratio:16/9;overflow:hidden}
.carte-r .ph img{width:100%;height:100%;object-fit:cover}
.carte-r .in{padding:24px 24px 28px;display:flex;flex-direction:column;gap:10px;flex:1}
.carte-r .prix{font:400 30px/1 var(--serif);color:var(--roulotte)}
.carte-r .btn{align-self:flex-start;margin-top:auto}
@media (max-width:760px){.rester{grid-template-columns:1fr}}
/* presse */
.presse{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);align-items:center}
.presse .photo{transform:rotate(-1.5deg)}
@media (max-width:760px){.presse{grid-template-columns:1fr}}
/* appel final */
.appel{text-align:left}
.appel-g{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,4vw,64px);align-items:end}
.coord{font-size:16px;line-height:1.75}
.coord a{color:var(--bractee)}
@media (max-width:760px){.appel-g{grid-template-columns:1fr}}
/* ---------- pages intérieures ---------- */
.page-tete{padding-top:clamp(40px,6vw,80px);padding-bottom:clamp(24px,3vw,40px)}
.page-tete .lede{margin-top:16px}
.fil{font-size:14px;color:var(--encre-2);margin-bottom:14px}
.fil a{color:var(--encre-2)}

.texte h3{margin:28px 0 10px}
.texte ul{padding-left:20px}
.texte li{margin-bottom:6px}
.tableau{width:100%;border-collapse:collapse;font-size:15.5px;margin:12px 0 20px}
.tableau th,.tableau td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--filet);vertical-align:top}
.tableau th{font-weight:600;color:var(--encre-2);font-size:14px}

.fiche-g{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.fiche-g .photo{aspect-ratio:16/10}
.fiche-vignettes{display:flex;gap:10px;margin-top:10px}
.fiche-vignettes button{padding:0;border:2px solid transparent;border-radius:var(--r);overflow:hidden;width:110px;aspect-ratio:16/10;cursor:pointer;background:none}

.fiche-vignettes img{width:100%;height:100%;object-fit:cover}
.fiche-panneau{position:sticky;top:130px;background:var(--blanc);border-radius:var(--r);padding:24px;box-shadow:var(--ombre)}
.fiche-panneau .etiq{margin:0 0 18px}
.fiche-panneau .btn{width:100%;margin-top:10px}
.garanties{list-style:none;padding:0;margin:16px 0 0;font-size:14.5px;color:var(--encre-2);display:grid;gap:6px}
.garanties li{padding-left:22px;position:relative}
.garanties li::before{content:"";position:absolute;left:0;top:.45em;width:12px;height:7px;border-left:2px solid var(--feuille-2);border-bottom:2px solid var(--feuille-2);transform:rotate(-45deg)}
.equip{columns:2 240px;column-gap:28px;padding:0;list-style:none;margin:10px 0 0}
.equip li{break-inside:avoid;padding:7px 0;border-bottom:1px solid var(--filet);font-size:15.5px}
.fiche-nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
@media (max-width:900px){.fiche-g{grid-template-columns:1fr}.fiche-panneau{position:static}}
/* galerie */
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.galerie button{padding:0;border:0;background:var(--bractee);border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;cursor:zoom-in}
.galerie img{width:100%;height:100%;object-fit:cover}
.visio{position:fixed;inset:0;z-index:90;background:rgba(14,20,12,.92);display:none;align-items:center;justify-content:center;padding:20px}
.visio.on{display:flex}
.visio img{max-height:86vh;border-radius:var(--r)}
.visio button{position:absolute;top:16px;right:16px}
/* liste de lieux */
.lieux{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 28px;margin:20px 0 0;padding:0;list-style:none}
.lieux li{padding:12px 0;border-bottom:1px solid var(--filet);font-size:15px}
.lieux b{display:block;font-weight:600}
.lieux span{color:var(--encre-2)}
/* téléchargements */
.docs{list-style:none;padding:0;margin:0;display:grid;gap:0}
.docs a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--filet);text-decoration:none;font-weight:500}
.docs a span:last-child{color:var(--roulotte);font-size:14px;white-space:nowrap}
/* formulaire */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font:500 14px var(--sans);color:var(--encre-2)}
.form .large{grid-column:1/-1}
.form input,.form textarea,.form select{font:400 16px var(--sans);padding:12px 14px;border:1.5px solid var(--filet);border-radius:8px;background:var(--blanc);color:var(--encre)}
.form input:focus,.form textarea:focus{border-color:var(--feuille);outline:none}
.form input[aria-invalid="true"]{border-color:var(--roulotte)}
.form .case{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}
.form .case input{margin-top:4px;width:18px;height:18px;accent-color:var(--feuille)}
.form-msg{grid-column:1/-1;font-weight:500;min-height:1.5em}
.form-msg.ok{color:var(--feuille-2)}.form-msg.err{color:var(--roulotte)}
@media (max-width:620px){.form{grid-template-columns:1fr}}
.vide{background:var(--blanc);border:1.5px dashed var(--feuille-2);border-radius:var(--r);padding:24px;color:var(--encre-2)}
/* ---------- pied ---------- */
.pied{background:var(--encre);color:#C9CDB9;padding:64px 0 28px;font-size:15px}

.pied-g{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:32px}
.pied h3{font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#9EA78F;margin-bottom:12px}

.pied-bas{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid rgba(232,227,190,.18);margin-top:44px;padding-top:20px;font-size:13.5px;color:#9EA78F}
@media (max-width:860px){.pied-g{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.pied-g{grid-template-columns:1fr}}

.cs-btn{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:10px;background:var(--feuille);color:var(--bractee);border:0;border-radius:999px;padding:10px 18px 10px 10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);cursor:pointer;text-align:left;font-family:var(--sans)}

.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.5}

ab_titre:["Il pleut ? On nage quand même.","Raining? Swim anyway.","¿Llueve? Se nada igual.","Regen? Geschwommen wird trotzdem.","Piove? Si nuota lo stesso.","Regen? Er wordt toch gezwommen."],
ab_lede:["Le ciel du Nord change vite. Notre piscine est sous un abri télescopique : ses arches coulissent l'une sur l'autre et le bassin passe du ciel ouvert au toit fermé selon la météo.","Northern skies change fast. Our pool sits under a telescopic enclosure: its arches slide over each other, and the pool goes from open sky to closed roof in minutes.","El cielo del Norte cambia rápido. Nuestra piscina está bajo un cubierta telescópica: sus arcos se deslizan uno sobre otro y la piscina pasa de cielo abierto a techo cerrado en minutos.","Der Himmel im Norden wechselt schnell. Unser Bad liegt unter einer Teleskop-Überdachung: Die Bögen gleiten übereinander, und in wenigen Minuten wird aus offenem Himmel ein geschlossenes Dach.","Il cielo del Nord cambia in fretta. La nostra piscina è sotto una copertura telescopica: gli archi scorrono uno sull'altro e la vasca passa dal cielo aperto al tetto chiuso in pochi minuti.","Het weer in het noorden verandert snel. Ons zwembad ligt onder een telescopische overkapping: de bogen schuiven over elkaar en het bad gaat in een paar minuten van open hemel naar gesloten dak."],

ab_etat_f:["Abri fermé : on se baigne à l'abri des averses.","Roof closed: swimming safe from the showers.","Cubierta cerrada: baño a salvo de los chubascos.","Dach zu: Baden ohne Regenschauer.","Copertura chiusa: bagno al riparo dagli acquazzoni.","Dak dicht: zwemmen zonder buien."],
ab_etat_o:["Abri replié : le bassin s'ouvre sur le ciel.","Roof folded back: the pool opens to the sky.","Cubierta recogida: la piscina se abre al cielo.","Dach zurückgeschoben: das Becken öffnet sich zum Himmel.","Copertura ripiegata: la vasca si apre sul cielo.","Overkapping weggeschoven: het bad ligt open onder de hemel."],

vil_lede:["Fillièvres, 500 habitants, au bord de la Canche. Tous les commerces sont à moins de 900 m : le pain du matin, la pharmacie et la friterie se font à pied.","Fillièvres, 500 inhabitants, on the river Canche. Every shop is within 900 m: morning bread, the pharmacy and the chip shop are all within walking distance.","Fillièvres, 500 habitantes, a orillas del Canche. Todas las tiendas a menos de 900 m: el pan de la mañana, la farmacia y la freiduría, a pie.","Fillièvres, 500 Einwohner, an der Canche. Alle Geschäfte in unter 900 m: Frühstücksbrot, Apotheke und Pommesbude erreichen Sie zu Fuß.","Fillièvres, 500 abitanti, sulla Canche. Tutti i negozi a meno di 900 m: il pane del mattino, la farmacia e la friggitoria si raggiungono a piedi.","Fillièvres, 500 inwoners, aan de Canche. Alle winkels binnen 900 m: vers brood, de apotheek en de frituur gaat u te voet."],

rest_lede:["Une parcelle à vous, de 120 à 200 m², entourée de haies, à 48 km de la mer. Installez votre mobil-home ou choisissez l'un des nôtres, déjà en place.","A plot of your own, 120 to 200 m², bordered by hedges, 48 km from the sea. Bring your mobile home or choose one of ours, already in place.","Una parcela suya, de 120 a 200 m², rodeada de setos, a 48 km del mar. Instale su mobil-home o elija uno de los nuestros, ya instalado.","Eine eigene Parzelle von 120 bis 200 m², von Hecken umgeben, 48 km vom Meer. Stellen Sie Ihr Mobilheim auf oder wählen Sie eines unserer bereits aufgestellten.","Una piazzola tutta vostra, da 120 a 200 m², circondata da siepi, a 48 km dal mare. Installate la vostra casa mobile o sceglietene una delle nostre, già sul posto.","Een eigen kavel van 120 tot 200 m², omringd door hagen, op 48 km van zee. Zet uw eigen stacaravan neer of kies er een van ons die al geplaatst is."],

pr_txt:["Le magazine Printemps-Été « 7 Vallées Ternois » a mis à l'honneur nos hébergements insolites dans son dossier « Nuits insolites ».","The spring–summer magazine “7 Vallées Ternois” featured our quirky stays in its “Unusual nights” story.","La revista primavera-verano «7 Vallées Ternois» destacó nuestros alojamientos insólitos en su reportaje «Noches insólitas».","Das Frühjahr-Sommer-Magazin „7 Vallées Ternois“ stellte unsere originellen Unterkünfte im Beitrag „Ungewöhnliche Nächte“ vor.","La rivista primavera-estate «7 Vallées Ternois» ha messo in risalto i nostri alloggi insoliti nel servizio «Notti insolite».","Het lente-zomermagazine ‘7 Vallées Ternois’ zette onze bijzondere accommodaties in de kijker in het artikel ‘Bijzondere nachten’."],

p_heb_lede:["Mobil-homes de 1 à 3 chambres avec terrasse, dont un adapté aux personnes à mobilité réduite, et quatre hébergements insolites. Couvertures et oreillers fournis.","Mobile homes with 1 to 3 bedrooms and a terrace, one of them adapted for reduced mobility, plus four quirky stays. Blankets and pillows provided.","Mobil-homes de 1 a 3 dormitorios con terraza, uno adaptado a personas con movilidad reducida, y cuatro alojamientos insólitos. Mantas y almohadas incluidas.","Mobilheime mit 1 bis 3 Schlafzimmern und Terrasse, eines davon barrierefrei, dazu vier originelle Unterkünfte. Decken und Kissen vorhanden.","Case mobili da 1 a 3 camere con veranda, di cui una per persone a mobilità ridotta, e quattro alloggi insoliti. Coperte e cuscini forniti.","Stacaravans met 1 tot 3 slaapkamers en terras, waarvan één aangepast voor mindervaliden, plus vier bijzondere accommodaties. Dekens en kussens aanwezig."],
p_heb_mh:["Dans tous nos mobil-homes","In all our mobile homes","En todos nuestros mobil-homes","In allen unseren Mobilheimen","In tutte le nostre case mobili","In al onze stacaravans"],
p_heb_mh_txt:["Téléviseur, séjour avec coin repas, cuisine équipée (plaque gaz, réfrigérateur-congélateur, micro-ondes, cafetière, grille-pain, vaisselle), sèche-cheveux, aspirateur, ventilateur, chauffage électrique, salon de jardin, parasol et barbecue au charbon de bois. Deux nuits minimum. Wi-Fi possible depuis l'hébergement avec Osmozis (payant).","TV, living area with dining table, equipped kitchen (gas hob, fridge-freezer, microwave, coffee maker, toaster, crockery), hairdryer, vacuum cleaner, fan, electric heating, garden furniture, parasol and charcoal barbecue. Two nights minimum. Wi-Fi available from your accommodation with Osmozis (paid).","Televisor, salón con comedor, cocina equipada (placa de gas, frigorífico-congelador, microondas, cafetera, tostadora, vajilla), secador, aspiradora, ventilador, calefacción eléctrica, muebles de jardín, sombrilla y barbacoa de carbón. Mínimo dos noches. Wi-Fi disponible con Osmozis (de pago).","Fernseher, Wohnbereich mit Essplatz, ausgestattete Küche (Gaskochfeld, Kühl-Gefrierschrank, Mikrowelle, Kaffeemaschine, Toaster, Geschirr), Föhn, Staubsauger, Ventilator, Elektroheizung, Gartenmöbel, Sonnenschirm und Holzkohlegrill. Mindestens zwei Nächte. WLAN über Osmozis möglich (kostenpflichtig).","TV, soggiorno con zona pranzo, cucina attrezzata (piano cottura a gas, frigo-congelatore, microonde, macchina del caffè, tostapane, stoviglie), asciugacapelli, aspirapolvere, ventilatore, riscaldamento elettrico, mobili da giardino, ombrellone e barbecue a carbone. Minimo due notti. Wi-Fi disponibile con Osmozis (a pagamento).","Tv, woonkamer met eethoek, ingerichte keuken (gaskookplaat, koel-vriescombinatie, magnetron, koffiezetapparaat, broodrooster, servies), föhn, stofzuiger, ventilator, elektrische verwarming, tuinset, parasol en houtskoolbarbecue. Minimaal twee nachten. Wifi mogelijk via Osmozis (betalend)."],

p_emp_lede:["124 emplacements sur 3 hectares : de passage avec votre tente, votre caravane ou votre camping-car, ou pour toute la saison avec votre mobil-home.","124 pitches on 3 hectares: passing through with a tent, caravan or motorhome, or for the whole season with your mobile home.","124 parcelas en 3 hectáreas: de paso con su tienda, caravana o autocaravana, o toda la temporada con su mobil-home.","124 Stellplätze auf 3 Hektar: auf der Durchreise mit Zelt, Wohnwagen oder Wohnmobil oder die ganze Saison mit Ihrem Mobilheim.","124 piazzole su 3 ettari: di passaggio con tenda, roulotte o camper, oppure per tutta la stagione con la vostra casa mobile.","124 plaatsen op 3 hectare: op doorreis met tent, caravan of camper, of het hele seizoen met uw stacaravan."],

emp_tour_txt:["Emplacements herbeux pour tente, caravane ou camping-car. Pas d'aire de service camping-car : le vidoir pour cassette et WC chimique est au bloc sanitaire. Un emplacement de tourisme accessible aux personnes à mobilité réduite. Wi-Fi sur l'emplacement avec Osmozis (payant).","Grassy pitches for tents, caravans or motorhomes. No motorhome service area: the cassette and chemical toilet disposal point is in the washroom block. One touring pitch accessible for reduced mobility. Wi-Fi on your pitch with Osmozis (paid).","Parcelas de hierba para tienda, caravana o autocaravana. Sin área de servicio para autocaravanas: el vaciado de casete y WC químico está en el bloque sanitario. Una parcela accesible para movilidad reducida. Wi-Fi en la parcela con Osmozis (de pago).","Rasenstellplätze für Zelt, Wohnwagen oder Wohnmobil. Keine Wohnmobil-Servicestation: Die Entleerung für Kassetten- und Chemietoiletten befindet sich im Sanitärgebäude. Ein barrierefreier Stellplatz. WLAN am Platz über Osmozis (kostenpflichtig).","Piazzole erbose per tenda, roulotte o camper. Nessuna area di servizio camper: lo scarico per cassette e WC chimici è nel blocco servizi. Una piazzola accessibile alle persone a mobilità ridotta. Wi-Fi in piazzola con Osmozis (a pagamento).","Grasplaatsen voor tent, caravan of camper. Geen camperserviceplaats: het loospunt voor cassette- en chemische toiletten is in het sanitairgebouw. Eén toegankelijke plaats voor mindervaliden. Wifi op de plaats via Osmozis (betalend)."],
emp_res_txt:["Ressourcez-vous régulièrement au Pays des 7 Vallées, le poumon vert du Pas-de-Calais, à 48 km de la mer : le bon compromis entre la maison et la plage. Parcelles de 120 à 200 m², engazonnées et délimitées par des haies, viabilisées (eau, électricité, tout-à-l'égout). Le forfait annuel, avec fermeture du 16 octobre au 31 mars, comprend la piscine et les pataugeoires chauffées, la salle de fitness, le terrain multisports, les trampolines, la salle de jeux et le rétrogaming, les fléchettes, le baby-foot, les aires de jeux, le boulodrome et le ping-pong. Wi-Fi sur l'emplacement avec Osmozis (payant).","Recharge regularly in the Seven Valleys, the green lung of the Pas-de-Calais, 48 km from the sea: the perfect halfway point between home and the beach. Plots of 120 to 200 m², grassed and bordered by hedges, serviced (water, electricity, mains drainage). The yearly package, with closure from 16 October to 31 March, includes the heated pool and paddling pool, gym, multisports court, trampolines, games room and retro gaming, darts, table football, playgrounds, boules pitch and table tennis. Wi-Fi on your plot with Osmozis (paid).","Descanse a menudo en el País de los 7 Valles, el pulmón verde del Paso de Calais, a 48 km del mar: el término medio ideal entre casa y playa. Parcelas de 120 a 200 m², con césped y setos, con agua, electricidad y alcantarillado. La tarifa anual, con cierre del 16 de octubre al 31 de marzo, incluye la piscina y el chapoteadero climatizados, el gimnasio, la pista multideporte, las camas elásticas, la sala de juegos y el retrogaming, los dardos, el futbolín, los parques infantiles, la petanca y el ping-pong. Wi-Fi en la parcela con Osmozis (de pago).","Tanken Sie regelmäßig Kraft im Land der 7 Täler, der grünen Lunge des Pas-de-Calais, 48 km vom Meer: der ideale Mittelweg zwischen Zuhause und Strand. Parzellen von 120 bis 200 m², mit Rasen und Hecken, erschlossen (Wasser, Strom, Kanal). Die Jahrespauschale, mit Schließung vom 16. Oktober bis 31. März, umfasst beheiztes Becken und Planschbecken, Fitnessraum, Multisportplatz, Trampoline, Spielraum und Retro-Gaming, Darts, Tischfußball, Spielplätze, Boulebahn und Tischtennis. WLAN am Platz über Osmozis (kostenpflichtig).","Ricaricatevi spesso nel Paese delle 7 Valli, il polmone verde del Pas-de-Calais, a 48 km dal mare: il giusto compromesso tra casa e spiaggia. Piazzole da 120 a 200 m², erbose e delimitate da siepi, con acqua, elettricità e fognatura. Il forfait annuale, con chiusura dal 16 ottobre al 31 marzo, comprende piscina e piscinetta riscaldate, palestra, campo polivalente, trampolini, sala giochi e retrogaming, freccette, calcio balilla, aree giochi, campo da bocce e ping-pong. Wi-Fi in piazzola con Osmozis (a pagamento).","Kom regelmatig tot rust in het Land van de 7 Valleien, de groene long van de Pas-de-Calais, op 48 km van zee: het ideale midden tussen thuis en het strand. Kavels van 120 tot 200 m², met gras en hagen, met water, elektriciteit en riolering. Het jaarforfait, met sluiting van 16 oktober tot 31 maart, omvat het verwarmde zwembad en pierenbad, de fitnessruimte, het multisportveld, de trampolines, de speelzaal en retrogaming, darts, tafelvoetbal, speeltuinen, jeu-de-boulesbaan en tafeltennis. Wifi op de plaats via Osmozis (betalend)."],

/* piscine page */
pi_lede:["Un bassin et une pataugeoire chauffés, sous un abri qui s'ouvre au soleil et se referme sous la pluie. Réservé aux clients du camping.","A heated pool and paddling pool under an enclosure that opens to the sun and closes in the rain. Reserved for campsite guests.","Una piscina y un chapoteadero climatizados bajo una cubierta que se abre al sol y se cierra con la lluvia. Reservado a los clientes del camping.","Ein beheiztes Becken und Planschbecken unter einer Überdachung, die sich bei Sonne öffnet und bei Regen schließt. Nur für Campinggäste.","Una vasca e una piscinetta riscaldate sotto una copertura che si apre al sole e si chiude con la pioggia. Riservate ai clienti del campeggio.","Een verwarmd bad en pierenbad onder een overkapping die opengaat bij zon en sluit bij regen. Alleen voor campinggasten."],
pi_sanit:["Juste à côté des bassins : cabines de déshabillage, casiers, WC, lavabo et douches chaudes.","Right next to the pools: changing cubicles, lockers, toilets, washbasin and hot showers.","Junto a las piscinas: cabinas para cambiarse, taquillas, WC, lavabo y duchas calientes.","Direkt neben den Becken: Umkleidekabinen, Schließfächer, WC, Waschbecken und warme Duschen.","Accanto alle vasche: cabine spogliatoio, armadietti, WC, lavabo e docce calde.","Direct naast de baden: kleedhokjes, kluisjes, toiletten, wastafel en warme douches."],
pi_regles:["Bon à savoir","Good to know","Conviene saber","Gut zu wissen","Buono a sapersi","Goed om te weten"],
pi_r1:["Piscine privée et non surveillée : les enfants de moins de 16 ans sont accompagnés d'un adulte responsable.","Private, unsupervised pool: children under 16 must be with a responsible adult.","Piscina privada y sin vigilancia: los menores de 16 años deben ir acompañados de un adulto responsable.","Privates, unbeaufsichtigtes Bad: Kinder unter 16 Jahren nur in Begleitung eines verantwortlichen Erwachsenen.","Piscina privata e non sorvegliata: i minori di 16 anni devono essere accompagnati da un adulto responsabile.","Privé zwembad zonder toezicht: kinderen onder 16 jaar onder begeleiding van een verantwoordelijke volwassene."],
pi_r2:["Accès avec un bracelet ; les visiteurs extérieurs n'ont pas accès aux bassins.","Access with a wristband; outside visitors are not admitted to the pools.","Acceso con pulsera; los visitantes externos no tienen acceso.","Zugang mit Armband; externe Besucher haben keinen Zutritt.","Accesso con braccialetto; i visitatori esterni non hanno accesso.","Toegang met een polsbandje; externe bezoekers hebben geen toegang."],
pi_r3:["Maillot, slip ou boxer de bain obligatoire : shorts et bermudas ne sont pas admis.","Swimsuit, swim briefs or swim boxers required: no shorts or bermudas.","Bañador, slip o bóxer de baño obligatorio: no se admiten pantalones cortos ni bermudas.","Badeanzug, Badehose oder Badeshorts eng anliegend Pflicht: keine Shorts oder Bermudas.","Costume, slip o boxer da bagno obbligatorio: niente pantaloncini o bermuda.","Badpak, zwembroek of zwemboxer verplicht: geen shorts of bermuda's."],
pi_r4:["Les tout-petits qui ne sont pas encore propres barbotent uniquement dans la pataugeoire, avec une couche de bain, sous l'œil des parents.","Toddlers who aren't potty-trained yet use the paddling pool only, with a swim nappy, watched by their parents.","Los más pequeños que aún usan pañal se bañan solo en el chapoteadero, con pañal de baño, bajo la vigilancia de sus padres.","Kleinkinder, die noch Windeln tragen, nur ins Planschbecken, mit Schwimmwindel und unter Aufsicht der Eltern.","I più piccoli che usano ancora il pannolino solo nella piscinetta, con pannolino da bagno, sotto lo sguardo dei genitori.","Peuters die nog niet zindelijk zijn alleen in het pierenbad, met zwemluier en onder toezicht van de ouders."],
pi_r5:["Le ministère de la Santé conseille de se baigner en même temps que son enfant, ou de désigner un seul adulte nageur pour le surveiller, sans téléphone ni lecture.","The French Ministry of Health advises swimming with your child, or naming one adult swimmer to watch them, with no phone or book.","El Ministerio de Sanidad aconseja bañarse a la vez que el niño, o designar a un solo adulto que sepa nadar para vigilarlo, sin móvil ni lectura.","Das französische Gesundheitsministerium rät, gemeinsam mit dem Kind zu baden oder einen schwimmenden Erwachsenen zur Aufsicht zu bestimmen, ohne Handy oder Buch.","Il Ministero della Salute consiglia di fare il bagno insieme al bambino o di designare un solo adulto che sappia nuotare per sorvegliarlo, senza telefono né lettura.","Het Franse ministerie van Volksgezondheid raadt aan samen met uw kind te zwemmen, of één zwemmende volwassene aan te wijzen die toezicht houdt, zonder telefoon of boek."],
/* activités page */
pa_lede:["Le camping se vit dehors : on saute, on grimpe, on joue aux boules et on se retrouve le soir à la salle de jeux. Les jeux sont gratuits.","Campsite life happens outdoors: jumping, climbing, playing boules and meeting up in the games room at night. Games are free.","La vida en el camping es al aire libre: saltar, trepar, jugar a la petanca y reunirse por la noche en la sala de juegos. Los juegos son gratis.","Campingleben findet draußen statt: springen, klettern, Boule spielen und abends im Spielraum treffen. Die Spiele sind kostenlos.","Al campeggio si vive all'aperto: si salta, si arrampica, si gioca a bocce e la sera ci si ritrova in sala giochi. I giochi sono gratuiti.","Campingleven speelt zich buiten af: springen, klimmen, jeu de boules en 's avonds samen in de speelzaal. De spellen zijn gratis."],

/* alentours */
al_lede:["Fillièvres est au cœur du Pays des 7 Vallées. En une heure de route : la baie de Somme, Le Touquet, Arras, le Louvre-Lens et les marais de Saint-Omer.","Fillièvres lies in the heart of the Seven Valleys. Within an hour's drive: the Bay of Somme, Le Touquet, Arras, the Louvre-Lens and the Saint-Omer marshes.","Fillièvres está en el corazón del País de los 7 Valles. A una hora en coche: la bahía de Somme, Le Touquet, Arras, el Louvre-Lens y las marismas de Saint-Omer.","Fillièvres liegt mitten im Land der 7 Täler. In einer Autostunde: die Somme-Bucht, Le Touquet, Arras, der Louvre-Lens und die Sümpfe von Saint-Omer.","Fillièvres è nel cuore del Paese delle 7 Valli. In un'ora d'auto: la baia della Somme, Le Touquet, Arras, il Louvre-Lens e le paludi di Saint-Omer.","Fillièvres ligt in het hart van het Land van de 7 Valleien. Binnen een uur rijden: de Baai van de Somme, Le Touquet, Arras, het Louvre-Lens en de moerassen van Saint-Omer."],
al_60:["Dans un rayon de 60 km","Within 60 km","En un radio de 60 km","Im Umkreis von 60 km","Nel raggio di 60 km","Binnen 60 km"],
al_60_txt:["Amiens, la baie de Somme et la baie d'Authie, les plages de la Côte d'Opale, Le Touquet-Paris-Plage, Montreuil-sur-Mer et ses remparts, Boulogne-sur-Mer, les marais de Saint-Omer, le Louvre-Lens et le bassin minier inscrit à l'Unesco, Arras (beffroi, boves, places baroques flamandes), les sites de la Grande Guerre : carrière Wellington, mémorial de Vimy, Notre-Dame-de-Lorette et l'anneau de la mémoire. Et des jardins, des musées, des fermes pédagogiques, des ateliers d'artisans. Les chemins de randonnée partent du centre du village, où coule la Canche.","Amiens, the Bay of Somme and Bay of Authie, the Opal Coast beaches, Le Touquet-Paris-Plage, walled Montreuil-sur-Mer, Boulogne-sur-Mer, the Saint-Omer marshes, the Louvre-Lens and the UNESCO-listed mining basin, Arras (belfry, underground tunnels, Flemish baroque squares), First World War sites: Wellington Quarry, the Vimy memorial, Notre-Dame-de-Lorette and the Ring of Remembrance. Plus gardens, museums, educational farms and craft workshops. Hiking trails start in the village centre, where the Canche flows.","Amiens, la bahía de Somme y la de Authie, las playas de la Costa de Ópalo, Le Touquet-Paris-Plage, Montreuil-sur-Mer y sus murallas, Boulogne-sur-Mer, las marismas de Saint-Omer, el Louvre-Lens y la cuenca minera declarada Patrimonio de la Unesco, Arrás (campanario, túneles, plazas barrocas flamencas), los lugares de la Gran Guerra: cantera Wellington, memorial de Vimy, Notre-Dame-de-Lorette y el anillo de la memoria. Y jardines, museos, granjas escuela y talleres artesanos. Los senderos salen del centro del pueblo, por donde pasa el Canche.","Amiens, die Somme- und die Authie-Bucht, die Strände der Opalküste, Le Touquet-Paris-Plage, Montreuil-sur-Mer mit seinen Wällen, Boulogne-sur-Mer, die Sümpfe von Saint-Omer, der Louvre-Lens und das UNESCO-Bergbaurevier, Arras (Belfried, unterirdische Gänge, flämische Barockplätze), Stätten des Ersten Weltkriegs: Wellington-Steinbruch, Vimy-Denkmal, Notre-Dame-de-Lorette und der Ring der Erinnerung. Dazu Gärten, Museen, Lernbauernhöfe und Handwerksateliers. Wanderwege starten im Dorfzentrum an der Canche.","Amiens, la baia della Somme e la baia dell'Authie, le spiagge della Costa d'Opale, Le Touquet-Paris-Plage, Montreuil-sur-Mer e i suoi bastioni, Boulogne-sur-Mer, le paludi di Saint-Omer, il Louvre-Lens e il bacino minerario Unesco, Arras (torre civica, gallerie sotterranee, piazze barocche fiamminghe), i luoghi della Grande Guerra: cava Wellington, memoriale di Vimy, Notre-Dame-de-Lorette e l'anello della memoria. E giardini, musei, fattorie didattiche, laboratori artigiani. I sentieri partono dal centro del paese, dove scorre la Canche.","Amiens, de Baai van de Somme en van de Authie, de stranden van de Opaalkust, Le Touquet-Paris-Plage, het ommuurde Montreuil-sur-Mer, Boulogne-sur-Mer, de moerassen van Saint-Omer, het Louvre-Lens en het mijnbekken op de Unesco-lijst, Arras (belfort, ondergrondse gangen, Vlaamse barokpleinen), plekken van de Eerste Wereldoorlog: Wellington-groeve, Vimy-monument, Notre-Dame-de-Lorette en de Ring van de Herinnering. En tuinen, musea, kinderboerderijen en ambachtsateliers. Wandelpaden starten in het dorpscentrum, waar de Canche stroomt."],

al_venir_txt:["Autoroute A16 à 38 km. Gares : Lille, Saint-Pol-sur-Ternoise et Hesdin (TER). Aéroports : Lille à 90 km, Beauvais à 125 km.","A16 motorway 38 km away. Stations: Lille, Saint-Pol-sur-Ternoise and Hesdin (regional trains). Airports: Lille 90 km, Beauvais 125 km.","Autopista A16 a 38 km. Estaciones: Lille, Saint-Pol-sur-Ternoise y Hesdin (TER). Aeropuertos: Lille a 90 km, Beauvais a 125 km.","Autobahn A16 in 38 km. Bahnhöfe: Lille, Saint-Pol-sur-Ternoise und Hesdin (TER). Flughäfen: Lille 90 km, Beauvais 125 km.","Autostrada A16 a 38 km. Stazioni: Lille, Saint-Pol-sur-Ternoise e Hesdin (TER). Aeroporti: Lille a 90 km, Beauvais a 125 km.","Snelweg A16 op 38 km. Stations: Lille, Saint-Pol-sur-Ternoise en Hesdin (TER). Luchthavens: Lille op 90 km, Beauvais op 125 km."],
peche_t:["La pêche, au bord de la Canche","Fishing on the river Canche","La pesca, a orillas del Canche","Angeln an der Canche","La pesca in riva alla Canche","Vissen aan de Canche"],
peche_txt:["La Canche est une rivière de première catégorie ; l'Authie et la Ternoise sont tout près. Truite fario, arc-en-ciel et truite de mer. Votre carte de pêche se prend sur cartedepeche.fr, association « Les Pêcheurs à la Ligne de Fillièvres ». À 5 km, une pisciculture alimentée par la Canche propose des parcours en famille et la pêche miraculeuse pour les enfants. Pour la carpe : le carpodrome des étangs « Les Prés du Valentin », à Wail (6 km). Renseignez-vous sur les tailles, dates d'ouverture et catégories auprès de la fédération du Pas-de-Calais.","The Canche is a first-category river; the Authie and the Ternoise are close by. Brown trout, rainbow trout and sea trout. Get your fishing licence at cartedepeche.fr, club “Les Pêcheurs à la Ligne de Fillièvres”. 5 km away, a fish farm fed by the Canche offers family fishing and a ‘miracle catch’ for children. For carp: the carp lakes “Les Prés du Valentin” in Wail (6 km). Check sizes, opening dates and categories with the Pas-de-Calais federation.","El Canche es un río de primera categoría; el Authie y el Ternoise están muy cerca. Trucha común, arcoíris y trucha de mar. Su licencia se obtiene en cartedepeche.fr, asociación «Les Pêcheurs à la Ligne de Fillièvres». A 5 km, una piscifactoría alimentada por el Canche ofrece recorridos en familia y pesca milagrosa para niños. Para la carpa: el carpódromo de los estanques «Les Prés du Valentin», en Wail (6 km). Infórmese sobre tallas, fechas y categorías en la federación del Paso de Calais.","Die Canche ist ein Fluss erster Kategorie; Authie und Ternoise liegen ganz nah. Bachforelle, Regenbogenforelle und Meerforelle. Den Angelschein gibt es auf cartedepeche.fr, Verein „Les Pêcheurs à la Ligne de Fillièvres“. 5 km entfernt bietet eine von der Canche gespeiste Fischzucht Familienstrecken und Kinderangeln. Für Karpfen: der Karpfenteich „Les Prés du Valentin“ in Wail (6 km). Mindestmaße, Schonzeiten und Kategorien beim Verband des Pas-de-Calais erfragen.","La Canche è un fiume di prima categoria; l'Authie e la Ternoise sono vicinissimi. Trota fario, iridea e trota di mare. La licenza si fa su cartedepeche.fr, associazione «Les Pêcheurs à la Ligne de Fillièvres». A 5 km una troticoltura alimentata dalla Canche propone percorsi per famiglie e la pesca miracolosa per i bambini. Per la carpa: il carpodromo degli stagni «Les Prés du Valentin» a Wail (6 km). Informatevi su misure, date e categorie presso la federazione del Pas-de-Calais.","De Canche is een rivier van de eerste categorie; de Authie en de Ternoise liggen vlakbij. Beekforel, regenboogforel en zeeforel. Uw visvergunning haalt u op cartedepeche.fr, vereniging ‘Les Pêcheurs à la Ligne de Fillièvres’. Op 5 km biedt een viskwekerij, gevoed door de Canche, gezinsvisplekken en ‘wondervissen’ voor kinderen. Voor karper: de karpervijvers ‘Les Prés du Valentin’ in Wail (6 km). Informeer naar maten, openingsdata en categorieën bij de federatie van de Pas-de-Calais."],
berck_t:["Berck-sur-Mer, la plage à 48 km","Berck-sur-Mer, the beach 48 km away","Berck-sur-Mer, la playa a 48 km","Berck-sur-Mer, der Strand in 48 km","Berck-sur-Mer, la spiaggia a 48 km","Berck-sur-Mer, het strand op 48 km"],
berck_txt:["Prenez la route de la Côte d'Opale et de la baie d'Authie : dunes, grande plage de sable fin, balades à pied, à vélo ou à cheval, sports nautiques. Ancien village de pêcheurs devenu station réputée pour ses cures à l'iode, Berck accueille chaque année les Rencontres internationales de cerfs-volants.","Head for the Opal Coast and the Bay of Authie: dunes, a long fine-sand beach, walks on foot, by bike or on horseback, water sports. A former fishing village that became a resort famed for its iodine cures, Berck hosts the International Kite Festival every year.","Tome la carretera de la Costa de Ópalo y la bahía de Authie: dunas, gran playa de arena fina, paseos a pie, en bici o a caballo, deportes náuticos. Antiguo pueblo pesquero convertido en estación famosa por sus curas de yodo, Berck acoge cada año los Encuentros internacionales de cometas.","Fahren Sie zur Opalküste und zur Authie-Bucht: Dünen, ein großer Feinsandstrand, Ausflüge zu Fuß, mit dem Rad oder zu Pferd, Wassersport. Das einstige Fischerdorf, bekannt für seine Jodkuren, empfängt jedes Jahr das Internationale Drachenfest.","Prendete la strada della Costa d'Opale e della baia dell'Authie: dune, grande spiaggia di sabbia fine, passeggiate a piedi, in bici o a cavallo, sport nautici. Antico villaggio di pescatori diventato stazione rinomata per le cure allo iodio, Berck ospita ogni anno gli Incontri internazionali di aquiloni.","Rijd naar de Opaalkust en de Baai van de Authie: duinen, een breed strand met fijn zand, wandelen, fietsen of paardrijden, watersport. Het vroegere vissersdorp, bekend om zijn jodiumkuren, ontvangt elk jaar het Internationale Vliegerfestival."],
bet_t:["Béthune et le bassin minier","Béthune and the mining basin","Béthune y la cuenca minera","Béthune und das Bergbaurevier","Béthune e il bacino minerario","Béthune en het mijnbekken"],
bet_txt:["Montez les 420 marches d'un terril pour le panorama, visitez le château d'Olhain, château fort médiéval le mieux conservé du Nord, flânez à Fresnicourt-le-Dolmen, cueillez au Jardin de Busnes ou dévalez la piste de ski de Loisinord, sur un terril. Et à Béthune : le manoir de la Peylouse, le domaine de la Chartreuse, Geotopia, la cité des électriciens et le marché de Noël.","Climb the 420 steps of a slag heap for the view, visit Olhain castle, the best-preserved medieval fortress in northern France, stroll through Fresnicourt-le-Dolmen, pick your own at the Jardin de Busnes or ski down the Loisinord slope, built on a slag heap. And in Béthune: the Peylouse manor, the Chartreuse estate, Geotopia, the electricians' housing estate and the Christmas market.","Suba los 420 escalones de una escombrera para ver el panorama, visite el castillo de Olhain, la fortaleza medieval mejor conservada del Norte, pasee por Fresnicourt-le-Dolmen, coseche en el Jardin de Busnes o baje la pista de esquí de Loisinord, sobre una escombrera. Y en Béthune: la mansión de la Peylouse, el dominio de la Chartreuse, Geotopia, la ciudad de los electricistas y el mercado de Navidad.","Steigen Sie die 420 Stufen einer Halde hinauf, besuchen Sie die Burg Olhain, die am besten erhaltene mittelalterliche Burg Nordfrankreichs, schlendern Sie durch Fresnicourt-le-Dolmen, ernten Sie im Jardin de Busnes oder fahren Sie auf der Skipiste von Loisinord, auf einer Halde. Und in Béthune: das Herrenhaus Peylouse, die Domaine de la Chartreuse, Geotopia, die Elektrikersiedlung und der Weihnachtsmarkt.","Salite i 420 gradini di un terril per il panorama, visitate il castello di Olhain, la fortezza medievale meglio conservata del Nord, passeggiate a Fresnicourt-le-Dolmen, raccogliete al Jardin de Busnes o scendete la pista da sci di Loisinord, su un terril. E a Béthune: il maniero della Peylouse, il dominio della Chartreuse, Geotopia, la città degli elettricisti e il mercatino di Natale.","Beklim de 420 treden van een terril voor het uitzicht, bezoek het kasteel van Olhain, de best bewaarde middeleeuwse burcht van Noord-Frankrijk, wandel door Fresnicourt-le-Dolmen, pluk zelf in de Jardin de Busnes of skiet van de piste van Loisinord, op een terril. En in Béthune: het landhuis Peylouse, het domein La Chartreuse, Geotopia, de elektriciensbuurt en de kerstmarkt."],
so_t:["Saint-Omer et ses marais","Saint-Omer and its marshes","Saint-Omer y sus marismas","Saint-Omer und seine Sümpfe","Saint-Omer e le sue paludi","Saint-Omer en zijn moerassen"],
so_txt:["Cité médiévale, cathédrale, ruines de l'abbaye Saint-Bertin et chapelle des Jésuites ; le chou-fleur de Saint-Omer à goûter. Le marais audomarois, où des maisons ne se rejoignent qu'en bateau, et l'atelier du dernier fabricant de bacôves et d'escutes. Arques et la cristallerie d'Arc, la brasserie Goudale, l'ascenseur à bateaux des Fontinettes ; Aire-sur-la-Lys, « la belle du Pas-de-Calais » ; Thérouanne et la via Francigena ; Lumbres pour le trail, le VTT et le canoë ; la vallée de la Hem et le blockhaus d'Éperlecques.","Medieval town, cathedral, ruins of Saint-Bertin abbey and the Jesuit chapel; taste the local cauliflower. The Audomarois marsh, where some houses can only be reached by boat, and the workshop of the last maker of traditional bacôve and escute boats. Arques and the Arc crystal works, the Goudale brewery, the Fontinettes boat lift; Aire-sur-la-Lys, “the beauty of the Pas-de-Calais”; Thérouanne and the Via Francigena; Lumbres for trail running, mountain biking and canoeing; the Hem valley and the Éperlecques bunker.","Ciudad medieval, catedral, ruinas de la abadía de Saint-Bertin y capilla de los Jesuitas; pruebe la coliflor de Saint-Omer. La marisma audomaresa, donde algunas casas solo se alcanzan en barca, y el taller del último fabricante de bacôves y escutes. Arques y la cristalería Arc, la cervecería Goudale, el ascensor de barcos de Fontinettes; Aire-sur-la-Lys, «la bella del Paso de Calais»; Thérouanne y la vía Francígena; Lumbres para trail, BTT y canoa; el valle del Hem y el búnker de Éperlecques.","Mittelalterliche Stadt, Kathedrale, Ruinen der Abtei Saint-Bertin und Jesuitenkapelle; probieren Sie den Blumenkohl von Saint-Omer. Das Sumpfgebiet Audomarois, wo manche Häuser nur per Boot erreichbar sind, und die Werkstatt des letzten Bauers von Bacôves und Escutes. Arques mit der Kristallmanufaktur Arc, die Brauerei Goudale, das Schiffshebewerk Fontinettes; Aire-sur-la-Lys, „die Schöne des Pas-de-Calais“; Thérouanne und die Via Francigena; Lumbres für Trail, Mountainbike und Kanu; das Hem-Tal und der Bunker von Éperlecques.","Città medievale, cattedrale, rovine dell'abbazia di Saint-Bertin e cappella dei Gesuiti; da assaggiare il cavolfiore di Saint-Omer. La palude audomarese, dove alcune case si raggiungono solo in barca, e il laboratorio dell'ultimo costruttore di bacôves ed escutes. Arques e la cristalleria Arc, il birrificio Goudale, l'ascensore per barche delle Fontinettes; Aire-sur-la-Lys, «la bella del Pas-de-Calais»; Thérouanne e la via Francigena; Lumbres per trail, mountain bike e canoa; la valle della Hem e il bunker di Éperlecques.","Middeleeuwse stad, kathedraal, ruïnes van de abdij Saint-Bertin en de jezuïetenkapel; proef de bloemkool van Saint-Omer. Het moerasgebied Audomarois, waar sommige huizen alleen per boot bereikbaar zijn, en de werkplaats van de laatste bouwer van bacôves en escutes. Arques met de kristalfabriek Arc, de brouwerij Goudale, de scheepslift van Fontinettes; Aire-sur-la-Lys, ‘de schone van de Pas-de-Calais’; Thérouanne en de Via Francigena; Lumbres voor trail, mountainbike en kano; het Hem-dal en de bunker van Éperlecques."],

pv_lede:["Devenez propriétaire d'un mobil-home d'occasion, déjà installé sur sa parcelle, dans un parc de 3 hectares ouvert d'avril à octobre. Piscine et activités en accès illimité.","Become the owner of a pre-owned mobile home, already installed on its plot, in a 3-hectare park open April to October. Unlimited access to the pool and activities.","Sea propietario de un mobil-home de ocasión, ya instalado en su parcela, en un parque de 3 hectáreas abierto de abril a octubre. Acceso ilimitado a la piscina y actividades.","Werden Sie Eigentümer eines gebrauchten Mobilheims, bereits auf seiner Parzelle aufgestellt, in einem 3-Hektar-Park, geöffnet von April bis Oktober. Unbegrenzter Zugang zu Bad und Aktivitäten.","Diventate proprietari di una casa mobile usata, già installata sulla piazzola, in un parco di 3 ettari aperto da aprile a ottobre. Accesso illimitato a piscina e attività.","Word eigenaar van een gebruikte stacaravan, al op zijn kavel geplaatst, in een park van 3 hectare, open van april tot oktober. Onbeperkt toegang tot zwembad en activiteiten."],

pv_desc:["7 m × 4 m · cuisine équipée (évier, plaque gaz 4 feux, hotte, réfrigérateur-congélateur) · chambre parentale avec placard-penderie et chambre à 2 lits simples · salon central avec canapé · salle d'eau avec lavabo et douche, WC séparé · radiateurs électriques · double vitrage, rideaux, 2 moustiquaires · terrasse couverte de 4,5 m × 2,5 m avec 2 joues · abri de jardin PVC · salon de jardin · année 2008","7 m × 4 m · equipped kitchen (sink, 4-burner gas hob, hood, fridge-freezer) · master bedroom with wardrobe and twin bedroom · central lounge with sofa · shower room with washbasin and shower, separate toilet · electric radiators · double glazing, curtains, 2 fly screens · covered 4.5 m × 2.5 m terrace with 2 side panels · PVC garden shed · garden furniture · built 2008","7 m × 4 m · cocina equipada (fregadero, placa de gas de 4 fuegos, campana, frigorífico-congelador) · dormitorio principal con armario y dormitorio con 2 camas · salón central con sofá · baño con lavabo y ducha, WC independiente · radiadores eléctricos · doble acristalamiento, cortinas, 2 mosquiteras · terraza cubierta de 4,5 m × 2,5 m con 2 laterales · caseta de jardín de PVC · muebles de jardín · año 2008","7 m × 4 m · ausgestattete Küche (Spüle, 4-Flammen-Gaskochfeld, Haube, Kühl-Gefrierschrank) · Elternschlafzimmer mit Schrank und Zimmer mit 2 Einzelbetten · zentraler Wohnraum mit Sofa · Duschbad mit Waschbecken, separates WC · Elektroheizkörper · Doppelverglasung, Vorhänge, 2 Fliegengitter · überdachte Terrasse 4,5 m × 2,5 m mit 2 Seitenwänden · PVC-Gartenhaus · Gartenmöbel · Baujahr 2008","7 m × 4 m · cucina attrezzata (lavello, piano cottura a gas 4 fuochi, cappa, frigo-congelatore) · camera matrimoniale con armadio e camera con 2 letti singoli · soggiorno centrale con divano · bagno con lavabo e doccia, WC separato · radiatori elettrici · doppi vetri, tende, 2 zanzariere · veranda coperta di 4,5 m × 2,5 m con 2 pannelli laterali · casetta da giardino in PVC · mobili da giardino · anno 2008","7 m × 4 m · ingerichte keuken (gootsteen, 4-pits gaskookplaat, afzuigkap, koel-vriescombinatie) · ouderslaapkamer met kast en slaapkamer met 2 eenpersoonsbedden · woonkamer met bank · doucheruimte met wastafel, apart toilet · elektrische radiatoren · dubbele beglazing, gordijnen, 2 horren · overdekt terras van 4,5 m × 2,5 m met 2 zijwanden · pvc-tuinhuisje · tuinset · bouwjaar 2008"],

in_horaires:["Le camping est ouvert du 1er avril au 15 octobre. Accueil 7 j/7 de 9 h à 12 h et de 14 h 30 à 19 h. En dehors de ces horaires, laissez un message détaillé au 06 32 59 64 82 : nous rappelons dès que possible. Réponse rapide garantie.","The campsite is open 1 April to 15 October. Reception 7 days a week, 9am–12pm and 2.30pm–7pm. Outside these hours, leave a detailed message on +33 6 32 59 64 82 and we'll call back as soon as possible. Quick reply guaranteed.","El camping abre del 1 de abril al 15 de octubre. Recepción 7 días de 9 a 12 h y de 14:30 a 19 h. Fuera de ese horario, deje un mensaje detallado en el +33 6 32 59 64 82: le llamamos lo antes posible. Respuesta rápida garantizada.","Der Platz ist vom 1. April bis 15. Oktober geöffnet. Rezeption täglich 9–12 und 14.30–19 Uhr. Außerhalb dieser Zeiten hinterlassen Sie eine Nachricht unter +33 6 32 59 64 82; wir rufen so bald wie möglich zurück. Schnelle Antwort garantiert.","Il campeggio è aperto dal 1° aprile al 15 ottobre. Reception 7 giorni su 7, 9–12 e 14.30–19. Fuori orario lasciate un messaggio dettagliato al +33 6 32 59 64 82: richiamiamo al più presto. Risposta rapida garantita.","De camping is open van 1 april tot 15 oktober. Receptie dagelijks van 9 tot 12 en van 14.30 tot 19 uur. Buiten deze uren kunt u een bericht inspreken op +33 6 32 59 64 82; we bellen zo snel mogelijk terug. Snel antwoord gegarandeerd."],
in_paie:["Paiement : Chèques-Vacances ANCV acceptés. Pas de carte bancaire sur place. Camping non agréé Vacaf.","Payment: ANCV holiday vouchers accepted. No card payment on site. Not approved by Vacaf.","Pago: se aceptan Chèques-Vacances ANCV. Sin tarjeta bancaria en el camping. No homologado Vacaf.","Zahlung: ANCV-Urlaubsschecks akzeptiert. Keine Kartenzahlung vor Ort. Nicht Vacaf-zugelassen.","Pagamento: Chèques-Vacances ANCV accettati. Niente carta di credito in loco. Non convenzionato Vacaf.","Betaling: ANCV-vakantiecheques geaccepteerd. Geen pinbetaling ter plaatse. Niet erkend door Vacaf."],
in_chien:["Chiens : un par emplacement, tenu en laisse, carnet de vaccination à jour présenté à l'accueil. Chiens de 1re et 2e catégorie refusés.","Dogs: one per pitch, on a lead, with an up-to-date vaccination record shown at reception. Category 1 and 2 dogs not accepted.","Perros: uno por parcela, con correa, cartilla de vacunación al día presentada en recepción. No se admiten perros de 1.ª y 2.ª categoría.","Hunde: einer pro Stellplatz, angeleint, gültiger Impfpass an der Rezeption vorzeigen. Hunde der Kategorien 1 und 2 nicht erlaubt.","Cani: uno per piazzola, al guinzaglio, libretto vaccinale aggiornato da presentare alla reception. Cani di 1ª e 2ª categoria non ammessi.","Honden: één per plaats, aangelijnd, geldig vaccinatieboekje tonen bij de receptie. Honden van categorie 1 en 2 niet toegestaan."],

in_actu_txt:["Choisissez votre future résidence d'été : quelques mobil-homes d'occasion sont à vendre, installés sur parcelle, avec terrasse. Visite possible sur rendez-vous, par téléphone ou par mail.","Choose your future summer home: a few pre-owned mobile homes are for sale, installed on their plots, with a terrace. Viewings by appointment, by phone or email.","Elija su futura residencia de verano: algunos mobil-homes de ocasión están en venta, instalados en su parcela, con terraza. Visitas con cita, por teléfono o correo.","Wählen Sie Ihre künftige Sommerresidenz: Einige gebrauchte Mobilheime mit Terrasse stehen auf ihren Parzellen zum Verkauf. Besichtigung nach Vereinbarung, per Telefon oder E-Mail.","Scegliete la vostra futura residenza estiva: alcune case mobili usate sono in vendita, installate sulla piazzola, con veranda. Visite su appuntamento, per telefono o e-mail.","Kies uw toekomstige zomerverblijf: enkele gebruikte stacaravans met terras staan te koop, op hun kavel. Bezichtiging op afspraak, per telefoon of e-mail."],

me_droits:["Conformément à la loi « Informatique et libertés » et au RGPD, vous disposez d'un droit d'accès, de rectification, d'opposition et d'effacement des données vous concernant. Toute reproduction du site sans autorisation est interdite ; les logos, visuels et marques appartiennent à leurs détenteurs.","Under French data protection law and the GDPR, you have the right to access, correct, object to and erase your personal data. Reproduction of the site without permission is prohibited; logos, images and trademarks belong to their owners.","Conforme a la ley francesa y al RGPD, tiene derecho de acceso, rectificación, oposición y supresión de sus datos. Prohibida la reproducción del sitio sin autorización; logotipos, imágenes y marcas pertenecen a sus titulares.","Gemäß französischem Datenschutzgesetz und DSGVO haben Sie ein Recht auf Auskunft, Berichtigung, Widerspruch und Löschung Ihrer Daten. Vervielfältigung der Website ohne Genehmigung verboten; Logos, Bilder und Marken gehören ihren Inhabern.","Ai sensi della legge francese e del GDPR avete diritto di accesso, rettifica, opposizione e cancellazione dei vostri dati. Vietata la riproduzione del sito senza autorizzazione; loghi, immagini e marchi appartengono ai rispettivi titolari.","Volgens de Franse privacywet en de AVG hebt u recht op inzage, correctie, bezwaar en verwijdering van uw gegevens. Reproductie van de site zonder toestemming is verboden; logo's, beelden en merken zijn eigendom van hun houders."],
me_mediateur:["Médiation de la consommation : en cas de litige, adressez d'abord une réclamation écrite en recommandé avec AR à la réception du camping. Sans réponse, ou si le litige persiste, vous pouvez saisir dans l'année SAS Médiation Solution : sasmediationsolution-conso.fr, contact@sasmediationsolution-conso.fr, ou 222 chemin de la Bergerie, 01800 Saint-Jean-de-Niost.","Consumer mediation: in case of dispute, first send a written complaint by recorded delivery to the campsite reception. If there is no reply or the dispute continues, you may refer it within one year to SAS Médiation Solution: sasmediationsolution-conso.fr, contact@sasmediationsolution-conso.fr, or 222 chemin de la Bergerie, 01800 Saint-Jean-de-Niost, France.","Mediación de consumo: en caso de litigio, envíe primero una reclamación escrita por correo certificado con acuse de recibo a la recepción del camping. Sin respuesta, o si el litigio persiste, puede acudir en el plazo de un año a SAS Médiation Solution: sasmediationsolution-conso.fr, contact@sasmediationsolution-conso.fr, o 222 chemin de la Bergerie, 01800 Saint-Jean-de-Niost, Francia.","Verbraucherschlichtung: Bei Streitigkeiten zuerst eine schriftliche Beschwerde per Einschreiben mit Rückschein an die Rezeption senden. Ohne Antwort oder bei fortbestehendem Streit können Sie sich innerhalb eines Jahres an SAS Médiation Solution wenden: sasmediationsolution-conso.fr, contact@sasmediationsolution-conso.fr oder 222 chemin de la Bergerie, 01800 Saint-Jean-de-Niost, Frankreich.","Mediazione dei consumatori: in caso di controversia inviate prima un reclamo scritto con raccomandata A/R alla reception del campeggio. Senza risposta, o se la controversia persiste, potete rivolgervi entro un anno a SAS Médiation Solution: sasmediationsolution-conso.fr, contact@sasmediationsolution-conso.fr, o 222 chemin de la Bergerie, 01800 Saint-Jean-de-Niost, Francia.","Consumentenbemiddeling: stuur bij een geschil eerst een schriftelijke klacht per aangetekende brief met ontvangstbewijs naar de receptie. Zonder antwoord of als het geschil blijft, kunt u zich binnen een jaar wenden tot SAS Médiation Solution: sasmediationsolution-conso.fr, contact@sasmediationsolution-conso.fr of 222 chemin de la Bergerie, 01800 Saint-Jean-de-Niost, Frankrijk."],
me_donnees_txt:["Pour vous désinscrire des listes de diffusion, accéder à vos informations, les modifier, les supprimer, retirer votre consentement ou les transférer à un tiers, écrivez-nous avec le formulaire de contact en précisant votre demande, ou à contact@camping3tilleuls.com.","To unsubscribe from mailing lists, access, change or delete your information, withdraw your consent or transfer your data to a third party, write to us using the contact form, stating your request, or at contact@camping3tilleuls.com.","Para darse de baja de las listas, acceder, modificar o suprimir sus datos, retirar su consentimiento o transferirlos a un tercero, escríbanos con el formulario indicando su solicitud, o a contact@camping3tilleuls.com.","Um sich von Verteilern abzumelden, Ihre Daten einzusehen, zu ändern, zu löschen, Ihre Einwilligung zu widerrufen oder Daten an Dritte zu übertragen, schreiben Sie uns über das Kontaktformular oder an contact@camping3tilleuls.com.","Per cancellarvi dalle liste, accedere ai vostri dati, modificarli, eliminarli, revocare il consenso o trasferirli a terzi, scriveteci con il modulo di contatto o a contact@camping3tilleuls.com.","Om u af te melden voor mailinglijsten, uw gegevens in te zien, te wijzigen, te verwijderen, uw toestemming in te trekken of ze over te dragen, schrijft u ons via het contactformulier of naar contact@camping3tilleuls.com."],
me_conf_txt:["Le camping collecte uniquement les informations utiles à la gestion de vos demandes, réservations et séjours, et à l'envoi de ses actualités si vous l'acceptez. Elles ne sont ni vendues ni cédées. Vous pouvez retirer votre consentement à tout moment. Le texte intégral de la politique de confidentialité de votre site actuel sera repris ici.","The campsite only collects information needed to handle your enquiries, bookings and stays, and to send its news if you agree. It is never sold or passed on. You can withdraw your consent at any time. The full text of the privacy policy from your current site will be included here.","El camping solo recoge la información necesaria para gestionar sus solicitudes, reservas y estancias, y para enviar novedades si lo acepta. No se vende ni se cede. Puede retirar su consentimiento en cualquier momento. Aquí se incluirá el texto íntegro de la política de su sitio actual.","Der Platz erhebt nur Daten, die für Anfragen, Buchungen und Aufenthalte sowie – mit Ihrer Zustimmung – für Neuigkeiten nötig sind. Sie werden weder verkauft noch weitergegeben. Sie können Ihre Einwilligung jederzeit widerrufen. Der vollständige Text Ihrer aktuellen Datenschutzerklärung wird hier übernommen.","Il campeggio raccoglie solo le informazioni utili a gestire richieste, prenotazioni e soggiorni, e a inviare novità se lo accettate. Non vengono né vendute né cedute. Potete revocare il consenso in qualsiasi momento. Qui sarà ripreso il testo integrale dell'informativa del sito attuale.","De camping verzamelt alleen gegevens die nodig zijn voor uw vragen, reserveringen en verblijven, en om nieuws te sturen als u dat wilt. Ze worden niet verkocht of doorgegeven. U kunt uw toestemming altijd intrekken. De volledige tekst van het privacybeleid van uw huidige site wordt hier overgenomen."],
me_cookies_txt:["Le site utilise des cookies de mesure d'audience. Vous pouvez les refuser ou les supprimer dans les réglages de votre navigateur ; le site reste utilisable.","The site uses audience measurement cookies. You can refuse or delete them in your browser settings; the site remains usable.","El sitio usa cookies de medición de audiencia. Puede rechazarlas o eliminarlas en su navegador; el sitio sigue funcionando.","Die Website nutzt Cookies zur Reichweitenmessung. Sie können sie in Ihrem Browser ablehnen oder löschen; die Website bleibt nutzbar.","Il sito utilizza cookie di misurazione dell'audience. Potete rifiutarli o eliminarli nelle impostazioni del browser; il sito resta utilizzabile.","De site gebruikt cookies voor bezoekersstatistieken. U kunt ze weigeren of verwijderen in uw browser; de site blijft bruikbaar."],

let abriMode=null,abriRaf=0;

function abri(){const sc=$('#abri-scene');if(!sc)return;const reduit=matchMedia('(prefers-reduced-motion: reduce)').matches||innerWidth<900;abriMode=null;
 $$('[data-ab]').forEach(b=>b.onclick=()=>{abriMode=b.dataset.ab=='0'?1:0;const segs=$$('.seg');segs.forEach(s=>s.style.transition=reduit?'none':'transform 1.1s cubic-bezier(.6,.05,.2,1)');poserAbri(abriMode);setTimeout(()=>segs.forEach(s=>s.style.transition=''),1200)});
 if(reduit){poserAbri(0);return}
 const tick=()=>{if(abriMode===null){const r=sc.getBoundingClientRect();const p=Math.min(1,Math.max(0,(-r.top)/(r.height-innerHeight)));poserAbri(p)}};
 removeEventListener('scroll',window.__abriS);window.__abriS=()=>{cancelAnimationFrame(abriRaf);abriRaf=requestAnimationFrame(tick)};addEventListener('scroll',window.__abriS,{passive:true});tick();
}
