a2:["À deux : le mobil-home 1 chambre neuf de 2024, la Cabadienne en bois ou la Cabane POD, à réserver dès une nuit.","For two: the brand-new 2024 one-bedroom mobile home, the wooden Cabadienne or the POD cabin, bookable from one night.","Para dos: el mobil-home de 1 dormitorio nuevo de 2024, la Cabadienne de madera o la cabaña POD, desde una noche.","Zu zweit: das neue Mobilheim mit 1 Schlafzimmer von 2024, die Holzhütte Cabadienne oder die POD-Hütte, ab einer Nacht buchbar.","In due: la casa mobile 1 camera nuova del 2024, la Cabadienne in legno o la capanna POD, prenotabili da una notte.","Met z'n tweeën: de nieuwe stacaravan met 1 slaapkamer uit 2024, de houten Cabadienne of de POD-hut, te boeken vanaf één nacht."],
a4:["À trois ou quatre : les mobil-homes 2 chambres (terrasse couverte ou semi-couverte), la Roulotte, le Tonneau, ou le mobil-home PMR si quelqu'un se déplace en fauteuil.","Three or four: the 2-bedroom mobile homes (covered or semi-covered terrace), the gypsy caravan, the Tonneau, or the accessible mobile home if someone uses a wheelchair.","Tres o cuatro: los mobil-homes de 2 dormitorios (terraza cubierta o semicubierta), la Roulotte, el Tonneau, o el mobil-home adaptado si alguien va en silla de ruedas.","Zu dritt oder viert: die Mobilheime mit 2 Schlafzimmern (Terrasse überdacht oder halb überdacht), der Zirkuswagen, das Tonneau oder das barrierefreie Mobilheim, falls jemand im Rollstuhl sitzt.","In tre o quattro: le case mobili 2 camere (veranda coperta o semicoperta), la Roulotte, il Tonneau, o la casa mobile accessibile se qualcuno è in carrozzina.","Met drie of vier: de stacaravans met 2 slaapkamers (overdekt of half overdekt terras), de woonwagen, de Tonneau, of de aangepaste stacaravan als iemand een rolstoel gebruikt."],
a6:["À cinq ou six : le mobil-home 3 chambres, collection 2024, avec terrasse couverte. C'est le seul pour six, mieux vaut s'y prendre tôt.","Five or six of you: the 3-bedroom mobile home, 2024 collection, with covered terrace. It's the only one for six, so book early.","Cinco o seis: el mobil-home de 3 dormitorios, colección 2024, con terraza cubierta. Es el único para seis, mejor reservar pronto.","Zu fünft oder sechst: das Mobilheim mit 3 Schlafzimmern, Kollektion 2024, mit überdachter Terrasse. Es ist das einzige für sechs, also früh buchen.","In cinque o sei: la casa mobile 3 camere, collezione 2024, con veranda coperta. È l'unica per sei, meglio prenotare presto.","Met vijf of zes: de stacaravan met 3 slaapkamers, collectie 2024, met overdekt terras. Het is de enige voor zes, dus boek op tijd."],
a7:["Au-delà de six personnes, il faudra deux hébergements. Le plus simple est d'appeler l'accueil au 06 32 59 64 82 pour les choisir voisins.","More than six people will need two places. The easiest is to call reception on +33 6 32 59 64 82 to choose neighbouring ones.","Más de seis personas necesitarán dos alojamientos. Lo más fácil es llamar a recepción al +33 6 32 59 64 82 para elegirlos contiguos.","Ab sieben Personen brauchen Sie zwei Unterkünfte. Am einfachsten rufen Sie die Rezeption unter +33 6 32 59 64 82 an, um benachbarte zu wählen.","Oltre sei persone servono due alloggi. Il modo più semplice è chiamare la reception al +33 6 32 59 64 82 per sceglierli vicini.","Met meer dan zes heeft u twee accommodaties nodig. Bel de receptie op +33 6 32 59 64 82 om naast elkaar gelegen te kiezen."],
piscine:["Piscine chauffée de 14 × 7 m et pataugeoire de 7 × 5 m, de mai à septembre, de 10 h à 12 h et de 15 h à 19 h. L'abri télescopique permet de nager même par météo capricieuse. Bracelet à l'entrée, maillot obligatoire (pas de short), baignade non surveillée : les moins de 16 ans viennent avec un adulte.","Heated 14 × 7 m pool and 7 × 5 m paddling pool, May to September, 10am–12pm and 3pm–7pm. The telescopic roof lets you swim even in changeable weather. Wristband at the entrance, swimwear required (no shorts), unsupervised: under-16s come with an adult.","Piscina climatizada de 14 × 7 m y chapoteadero de 7 × 5 m, de mayo a septiembre, de 10 a 12 h y de 15 a 19 h. La cubierta telescópica permite nadar incluso con mal tiempo. Pulsera en la entrada, bañador obligatorio (sin pantalón corto), sin vigilancia: los menores de 16 vienen con un adulto.","Beheiztes Becken 14 × 7 m und Planschbecken 7 × 5 m, Mai bis September, 10–12 und 15–19 Uhr. Dank Teleskopdach wird auch bei wechselhaftem Wetter geschwommen. Armband am Eingang, Badebekleidung Pflicht (keine Shorts), unbeaufsichtigt: unter 16 nur mit Erwachsenen.","Piscina riscaldata di 14 × 7 m e piscinetta di 7 × 5 m, da maggio a settembre, 10–12 e 15–19. La copertura telescopica permette di nuotare anche col tempo incerto. Braccialetto all'ingresso, costume obbligatorio (niente pantaloncini), non sorvegliata: i minori di 16 anni vengono con un adulto.","Verwarmd bad van 14 × 7 m en pierenbad van 7 × 5 m, mei tot september, 10–12 en 15–19 uur. Dankzij de telescopische overkapping zwemt u ook bij wisselvallig weer. Polsbandje bij de ingang, zwemkleding verplicht (geen shorts), zonder toezicht: onder 16 met een volwassene."],
chien:["Sur un emplacement : un chien, tenu en laisse, avec son carnet de vaccination à jour ; pas de chiens de 1re ou 2e catégorie. En location : un seul chien de moins de 10 kg, avec supplément. Les chats ne sont pas admis dans les locations.","On a pitch: one dog, on a lead, with up-to-date vaccinations; no category 1 or 2 dogs. In rentals: one dog under 10 kg, with a supplement. No cats in rentals.","En parcela: un perro, con correa y vacunas al día; no se admiten perros de 1.ª o 2.ª categoría. En alquiler: un solo perro de menos de 10 kg, con suplemento. Gatos no admitidos en alquileres.","Auf dem Stellplatz: ein Hund, angeleint, mit gültigem Impfpass; keine Hunde der Kategorie 1 oder 2. In Mietunterkünften: ein Hund unter 10 kg gegen Aufpreis. Keine Katzen in Mietunterkünften.","In piazzola: un cane, al guinzaglio, con libretto vaccinale aggiornato; niente cani di 1ª o 2ª categoria. Negli alloggi: un solo cane sotto i 10 kg, con supplemento. Gatti non ammessi negli alloggi.","Op een kampeerplaats: één hond, aangelijnd, met geldig vaccinatieboekje; geen honden van categorie 1 of 2. In huuraccommodaties: één hond onder 10 kg, met toeslag. Geen katten in huuraccommodaties."],
prix:["Les tarifs 2026 sont dans la brochure à télécharger, et le prix exact de vos dates s'affiche dans le module de réservation. Chèques-Vacances acceptés ; pas de carte bancaire sur place.","2026 prices are in the downloadable brochure, and the exact price for your dates shows in the booking system. Holiday vouchers accepted; no card payment on site.","Las tarifas 2026 están en el folleto descargable y el precio exacto de sus fechas aparece en el módulo de reservas. Se aceptan Chèques-Vacances; sin tarjeta en el camping.","Die Preise 2026 stehen in der Broschüre, der genaue Preis für Ihre Daten erscheint im Buchungssystem. Urlaubsschecks akzeptiert; keine Kartenzahlung vor Ort.","Le tariffe 2026 sono nel listino scaricabile e il prezzo esatto delle vostre date compare nel modulo di prenotazione. Chèques-Vacances accettati; niente carta in loco.","De prijzen 2026 staan in de brochure en de exacte prijs voor uw data ziet u in het boekingssysteem. Vakantiecheques geaccepteerd; geen pinbetaling ter plaatse."],
acces:["28 rue de Frévent, 62770 Fillièvres. Autoroute A16 à 38 km ; gares TER de Hesdin (12 km) et de Saint-Pol-sur-Ternoise ; aéroport de Lille à 90 km. La mer, à Berck, est à 48 km.","28 rue de Frévent, 62770 Fillièvres. A16 motorway 38 km; regional train stations at Hesdin (12 km) and Saint-Pol-sur-Ternoise; Lille airport 90 km. The sea at Berck is 48 km away.","28 rue de Frévent, 62770 Fillièvres. Autopista A16 a 38 km; estaciones TER de Hesdin (12 km) y Saint-Pol-sur-Ternoise; aeropuerto de Lille a 90 km. El mar, en Berck, a 48 km.","28 rue de Frévent, 62770 Fillièvres. Autobahn A16 in 38 km; TER-Bahnhöfe Hesdin (12 km) und Saint-Pol-sur-Ternoise; Flughafen Lille 90 km. Das Meer in Berck liegt 48 km entfernt.","28 rue de Frévent, 62770 Fillièvres. Autostrada A16 a 38 km; stazioni TER di Hesdin (12 km) e Saint-Pol-sur-Ternoise; aeroporto di Lille a 90 km. Il mare, a Berck, è a 48 km.","28 rue de Frévent, 62770 Fillièvres. Snelweg A16 op 38 km; treinstations Hesdin (12 km) en Saint-Pol-sur-Ternoise; luchthaven Lille op 90 km. De zee bij Berck ligt op 48 km."],
resid:["Pour toute la saison : parcelles de 120 à 200 m² avec haies, eau, électricité et tout-à-l'égout, forfait à l'année (fermeture du 16 octobre au 31 mars), piscine et activités comprises. Un Sun Living Bali 2 chambres est aussi à vendre 12 000 €, déjà installé.","For the whole season: 120–200 m² plots with hedges, water, electricity and drainage, yearly package (closed 16 October–31 March), pool and activities included. A 2-bedroom Sun Living Bali is also for sale at €12,000, already installed.","Para toda la temporada: parcelas de 120 a 200 m² con setos, agua, electricidad y alcantarillado, tarifa anual (cerrado del 16 de octubre al 31 de marzo), piscina y actividades incluidas. También se vende un Sun Living Bali de 2 dormitorios por 12 000 €, ya instalado.","Für die ganze Saison: Parzellen von 120 bis 200 m² mit Hecken, Wasser, Strom und Kanal, Jahrespauschale (geschlossen 16. Oktober–31. März), Bad und Aktivitäten inklusive. Ein Sun Living Bali mit 2 Schlafzimmern steht für 12 000 € zum Verkauf, bereits aufgestellt.","Per tutta la stagione: piazzole da 120 a 200 m² con siepi, acqua, elettricità e fognatura, forfait annuale (chiusura dal 16 ottobre al 31 marzo), piscina e attività incluse. È in vendita anche un Sun Living Bali 2 camere a 12 000 €, già installato.","Voor het hele seizoen: kavels van 120 tot 200 m² met hagen, water, elektriciteit en riolering, jaarforfait (gesloten van 16 oktober tot 31 maart), zwembad en activiteiten inbegrepen. Ook te koop: een Sun Living Bali met 2 slaapkamers voor € 12.000, al geplaatst."],
wifi:["Le Wi-Fi fonctionne sur tout le camping et depuis votre hébergement, avec notre partenaire Osmozis. Il est payant, avec plusieurs forfaits (détail dans les téléchargements).","Wi-Fi works across the campsite and from your accommodation, with our partner Osmozis. It's paid, with several packages (details in downloads).","El Wi-Fi funciona en todo el camping y desde su alojamiento, con Osmozis. Es de pago, con varias tarifas (detalle en descargas).","WLAN gibt es überall auf dem Platz und in Ihrer Unterkunft, über unseren Partner Osmozis. Kostenpflichtig, mit mehreren Tarifen (siehe Downloads).","Il Wi-Fi funziona in tutto il campeggio e dall'alloggio, con il partner Osmozis. È a pagamento, con diverse formule (dettagli nei download).","Wifi werkt op de hele camping en vanuit uw accommodatie, via onze partner Osmozis. Het is betalend, met diverse pakketten (zie downloads)."],
ouvert:["Le camping est ouvert du 1er avril au 15 octobre. L'accueil vous répond tous les jours de 9 h à 12 h et de 14 h 30 à 19 h.","The campsite is open 1 April to 15 October. Reception answers every day 9am–12pm and 2.30pm–7pm.","El camping abre del 1 de abril al 15 de octubre. Recepción todos los días de 9 a 12 h y de 14:30 a 19 h.","Der Platz ist vom 1. April bis 15. Oktober geöffnet. Rezeption täglich 9–12 und 14.30–19 Uhr.","Il campeggio è aperto dal 1° aprile al 15 ottobre. La reception risponde tutti i giorni 9–12 e 14.30–19.","De camping is open van 1 april tot 15 oktober. De receptie is dagelijks bereikbaar van 9 tot 12 en van 14.30 tot 19 uur."],
enfants:["Pour les enfants : trois trampolines (dont un pour les tout-petits), aire de jeux et piscine à balles, structure gonflable, parcours acro avec tyrolienne, NinjaRun, mur d'escalade, pataugeoire chauffée et salle de jeux gratuite.","For children: three trampolines (one for toddlers), playground and ball pit, bouncy castle, adventure course with zip line, NinjaRun, climbing wall, heated paddling pool and a free games room.","Para niños: tres camas elásticas (una para los pequeños), parque y piscina de bolas, hinchable, circuito de aventura con tirolina, NinjaRun, rocódromo, chapoteadero climatizado y sala de juegos gratis.","Für Kinder: drei Trampoline (eines für die Kleinsten), Spielplatz und Bällebad, Hüpfburg, Kletterparcours mit Seilbahn, NinjaRun, Kletterwand, beheiztes Planschbecken und kostenloser Spielraum.","Per i bambini: tre trampolini (uno per i più piccoli), area giochi e piscina di palline, gonfiabile, percorso avventura con teleferica, NinjaRun, parete d'arrampicata, piscinetta riscaldata e sala giochi gratuita.","Voor kinderen: drie trampolines (één voor de kleinsten), speeltuin en ballenbak, springkussen, klimparcours met kabelbaan, NinjaRun, klimwand, verwarmd pierenbad en een gratis speelzaal."],
pmr:["Oui : un mobil-home conçu selon les critères Tourisme & Handicap (déficience motrice), un emplacement de tourisme accessible, un sanitaire adapté et deux places de parking PMR près de l'accueil.","Yes: a mobile home built to Tourisme & Handicap criteria (reduced mobility), an accessible touring pitch, an adapted washroom and two accessible parking spaces near reception.","Sí: un mobil-home según los criterios Tourisme & Handicap (discapacidad motora), una parcela accesible, un sanitario adaptado y dos plazas de aparcamiento junto a recepción.","Ja: ein Mobilheim nach den Kriterien von Tourisme & Handicap (Gehbehinderung), ein barrierefreier Stellplatz, eine angepasste Sanitäranlage und zwei Behindertenparkplätze nahe der Rezeption.","Sì: una casa mobile secondo i criteri Tourisme & Handicap (disabilità motoria), una piazzola accessibile, un servizio adattato e due posti auto riservati vicino alla reception.","Ja: een stacaravan volgens de criteria van Tourisme & Handicap (motorische beperking), een toegankelijke kampeerplaats, aangepast sanitair en twee invalidenparkeerplaatsen bij de receptie."],
cc:["Les emplacements de tourisme accueillent tentes, caravanes et camping-cars, sur herbe. Il n'y a pas d'aire de service camping-car, mais le vidoir pour cassette et WC chimique est au bloc sanitaire.","Touring pitches take tents, caravans and motorhomes, on grass. There's no motorhome service area, but the cassette and chemical toilet disposal point is in the washroom block.","Las parcelas de turismo admiten tiendas, caravanas y autocaravanas, sobre hierba. No hay área de servicio para autocaravanas, pero el vaciado de casete y WC químico está en el bloque sanitario.","Die Touristenstellplätze nehmen Zelte, Wohnwagen und Wohnmobile auf Rasen auf. Es gibt keine Wohnmobil-Servicestation, aber die Entleerung für Kassetten- und Chemietoiletten im Sanitärgebäude.","Le piazzole turistiche accolgono tende, roulotte e camper, su erba. Non c'è area di servizio camper, ma lo scarico per cassette e WC chimici è nel blocco servizi.","De toeristische plaatsen zijn voor tenten, caravans en campers, op gras. Er is geen camperserviceplaats, maar het loospunt voor cassette- en chemische toiletten is in het sanitairgebouw."],
mer:["La plage la plus proche est à Berck-sur-Mer, à 48 km (environ 40 minutes). Le Touquet est à 55 km et la baie de Somme à moins d'une heure.","The nearest beach is Berck-sur-Mer, 48 km away (about 40 minutes). Le Touquet is 55 km and the Bay of Somme less than an hour.","La playa más cercana está en Berck-sur-Mer, a 48 km (unos 40 minutos). Le Touquet a 55 km y la bahía de Somme a menos de una hora.","Der nächste Strand ist Berck-sur-Mer, 48 km (etwa 40 Minuten). Le Touquet liegt 55 km entfernt, die Somme-Bucht weniger als eine Stunde.","La spiaggia più vicina è Berck-sur-Mer, a 48 km (circa 40 minuti). Le Touquet è a 55 km e la baia della Somme a meno di un'ora.","Het dichtstbijzijnde strand is Berck-sur-Mer, op 48 km (ongeveer 40 minuten). Le Touquet ligt op 55 km en de Baai van de Somme op minder dan een uur."],
peche:["La Canche, rivière de première catégorie, passe au village : truite fario, arc-en-ciel et de mer. Carte de pêche sur cartedepeche.fr (« Les Pêcheurs à la Ligne de Fillièvres »). Carpodrome à Wail, 6 km ; pisciculture à 5 km.","The Canche, a first-category river, flows through the village: brown, rainbow and sea trout. Fishing licence on cartedepeche.fr (“Les Pêcheurs à la Ligne de Fillièvres”). Carp lakes in Wail, 6 km; fish farm 5 km away.","El Canche, río de primera categoría, pasa por el pueblo: trucha común, arcoíris y de mar. Licencia en cartedepeche.fr («Les Pêcheurs à la Ligne de Fillièvres»). Carpódromo en Wail, 6 km; piscifactoría a 5 km.","Die Canche, ein Fluss erster Kategorie, fließt durchs Dorf: Bach-, Regenbogen- und Meerforelle. Angelschein auf cartedepeche.fr („Les Pêcheurs à la Ligne de Fillièvres“). Karpfenteich in Wail, 6 km; Fischzucht 5 km.","La Canche, fiume di prima categoria, attraversa il paese: trota fario, iridea e di mare. Licenza su cartedepeche.fr («Les Pêcheurs à la Ligne de Fillièvres»). Carpodromo a Wail, 6 km; troticoltura a 5 km.","De Canche, een rivier van de eerste categorie, stroomt door het dorp: beek-, regenboog- en zeeforel. Visvergunning via cartedepeche.fr (‘Les Pêcheurs à la Ligne de Fillièvres’). Karpervijvers in Wail, 6 km; viskwekerij op 5 km."],
linge:["Couvertures et oreillers sont fournis dans les mobil-homes, le Tonneau, la Cabane POD et la Cabadienne. Pour les draps, le linge de toilette ou une location de linge, je n'ai pas l'information : l'accueil vous répondra au 06 32 59 64 82.","Blankets and pillows are provided in the mobile homes, the Tonneau, the POD cabin and the Cabadienne. For sheets, towels or linen hire, I don't have the information: reception will tell you on +33 6 32 59 64 82.","Mantas y almohadas están incluidas en los mobil-homes, el Tonneau, la cabaña POD y la Cabadienne. Sobre sábanas, toallas o alquiler de ropa de cama no tengo la información: recepción le responderá en el +33 6 32 59 64 82.","Decken und Kissen gibt es in den Mobilheimen, im Tonneau, in der POD-Hütte und in der Cabadienne. Zu Bettwäsche, Handtüchern oder Wäscheverleih habe ich keine Information: Die Rezeption hilft unter +33 6 32 59 64 82.","Coperte e cuscini sono forniti nelle case mobili, nel Tonneau, nella capanna POD e nella Cabadienne. Per lenzuola, asciugamani o noleggio biancheria non ho l'informazione: la reception risponde al +33 6 32 59 64 82.","Dekens en kussens zijn aanwezig in de stacaravans, de Tonneau, de POD-hut en de Cabadienne. Over lakens, handdoeken of linnenverhuur heb ik geen informatie: de receptie helpt u op +33 6 32 59 64 82."],
duree:["Les mobil-homes et la Roulotte se louent deux nuits minimum. Le Tonneau, la Cabane POD et la Cabadienne se réservent à la nuitée.","Mobile homes and the gypsy caravan are rented for two nights minimum. The Tonneau, POD cabin and Cabadienne can be booked by the night.","Los mobil-homes y la Roulotte se alquilan mínimo dos noches. El Tonneau, la cabaña POD y la Cabadienne se reservan por noche.","Mobilheime und der Zirkuswagen ab zwei Nächten. Tonneau, POD-Hütte und Cabadienne auch für eine Nacht.","Case mobili e Roulotte minimo due notti. Il Tonneau, la capanna POD e la Cabadienne si prenotano anche per una notte.","Stacaravans en de woonwagen minimaal twee nachten. De Tonneau, POD-hut en Cabadienne kunt u per nacht boeken."],
douche:["Les douches du bloc sanitaire fonctionnent avec un monnayeur : 1 € les 5 minutes (pièces de 1 €). Les mobil-homes et la Roulotte ont leur propre salle d'eau.","Washroom showers use a coin slot: €1 for 5 minutes (€1 coins). Mobile homes and the gypsy caravan have their own shower room.","Las duchas del bloque funcionan con monedas: 1 € 5 minutos (monedas de 1 €). Los mobil-homes y la Roulotte tienen baño propio.","Die Duschen im Sanitärgebäude laufen mit Münzen: 1 € für 5 Minuten (1-€-Münzen). Mobilheime und Zirkuswagen haben ein eigenes Bad.","Le docce del blocco servizi funzionano a gettoni: 1 € per 5 minuti (monete da 1 €). Case mobili e Roulotte hanno il proprio bagno.","De douches in het sanitairgebouw werken met munten: € 1 per 5 minuten (munten van € 1). Stacaravans en de woonwagen hebben een eigen doucheruimte."],
inconnu:["Je n'ai pas cette information et je préfère ne pas vous répondre au hasard. L'accueil vous répondra au 06 32 59 64 82 ou à contact@camping3tilleuls.com.","I don't have that information and I'd rather not guess. Reception will answer on +33 6 32 59 64 82 or at contact@camping3tilleuls.com.","No tengo esa información y prefiero no responder al azar. Recepción le contestará en el +33 6 32 59 64 82 o en contact@camping3tilleuls.com.","Diese Information habe ich nicht, und ich möchte nicht raten. Die Rezeption antwortet unter +33 6 32 59 64 82 oder contact@camping3tilleuls.com.","Non ho questa informazione e preferisco non tirare a indovinare. La reception risponde al +33 6 32 59 64 82 o a contact@camping3tilleuls.com.","Die informatie heb ik niet en ik gok liever niet. De receptie helpt u op +33 6 32 59 64 82 of via contact@camping3tilleuls.com."],
