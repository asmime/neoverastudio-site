<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nos Petites Conserves — Proposition Neovera Studio</title>
<meta name="description" content="Conserverie artisanale à Alban (Tarn) : jambonneaux, terrines, plats cuisinés et desserts en verrines, sans colorant ni conservateur.">
<link rel="preload" href="fonts/corben-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Corben";font-weight:400;font-display:swap;src:url(fonts/corben-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Corben";font-weight:700;font-display:swap;src:url(fonts/corben-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Corben";font-weight:700;font-display:swap;src:url(fonts/corben-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF}
@font-face{font-family:"Corben";font-weight:400;font-display:swap;src:url(fonts/corben-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF}
@font-face{font-family:"Albert Sans";font-weight:400;font-display:swap;src:url(fonts/albert-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-weight:400;font-display:swap;src:url(fonts/albert-sans-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF}
@font-face{font-family:"Albert Sans";font-weight:500;font-display:swap;src:url(fonts/albert-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Albert Sans";font-weight:700;font-display:swap;src:url(fonts/albert-sans-latin-700-normal.woff2) format("woff2")}
:root{
 --verre:#F2F4EE;--blanc:#fff;--etiquette:#4F7A25;--etiquette-f:#365618;--feuille:#DDE8CB;--or:#C9A03A;--or-f:#8C6A12;--bois:#3A2517;--bois2:#5B3C27;--encre:#1E211B;--gris:#50564A;--ligne:#D5DACB;
 --titre:"Corben",Georgia,serif;--texte:"Albert Sans",system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-color:var(--etiquette) var(--feuille)}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-track{background:var(--feuille)}::-webkit-scrollbar-thumb{background:var(--etiquette);border-radius:6px}
body{margin:0;background:var(--verre);color:var(--encre);font:400 1.05rem/1.6 var(--texte);font-variant-numeric:lining-nums}
img{max-width:100%;display:block}
a{color:var(--etiquette-f);text-underline-offset:.2em}
a:hover{color:var(--or-f)}
::selection{background:var(--or);color:var(--bois)}
:focus-visible{outline:3px solid var(--or);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--titre);font-weight:700;line-height:1.08;margin:0 0 .45em;text-wrap:balance;overflow-wrap:break-word;hyphens:auto}
h2{font-size:clamp(1.9rem,4vw,3.1rem)}
h3{font-size:clamp(1.15rem,1.7vw,1.35rem)}
p{margin:0 0 1em;max-width:64ch;text-wrap:pretty}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:700 .95rem/1 var(--texte);padding:.95em 1.3em;border-radius:8px;border:2px solid var(--bois);background:var(--bois);color:#fff;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.btn:hover{background:var(--etiquette-f);border-color:var(--etiquette-f);color:#fff;transform:translateY(-1px)}
.btn.or{background:var(--or);border-color:var(--or);color:var(--bois)}
.btn.or:hover{background:#DDB54C;border-color:#DDB54C;color:var(--bois)}
.btn.clair{background:transparent;color:#fff;border-color:rgba(255,255,255,.8)}
.btn.clair:hover{background:#fff;color:var(--etiquette-f)}
.btn.ligne{background:transparent;color:var(--bois)}
.btn.ligne:hover{background:var(--bois);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.suite{font-weight:700;color:var(--etiquette-f);text-decoration:none;border-bottom:2px solid var(--or);padding-bottom:2px}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

header.top{position:sticky;top:0;z-index:40;background:rgba(242,244,238,.97);border-bottom:1px solid var(--ligne)}
.bar1{display:flex;align-items:center;gap:16px;padding:10px 24px;max-width:1400px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--encre)}
.logo img{height:46px;width:auto}
.sp{flex:1}
.tel{font-weight:700;text-decoration:none;color:var(--encre);display:flex;gap:.4em;align-items:center;white-space:nowrap}
.langue{display:flex;align-items:center;gap:6px;border:2px solid var(--bois);border-radius:8px;padding:0 6px 0 10px;background:#fff}
.langue select{border:0;background:transparent;font:600 .9rem var(--texte);color:var(--encre);padding:8px 4px;cursor:pointer}
.panier-btn{position:relative}
.panier-btn .n{position:absolute;top:-8px;right:-8px;background:var(--or);color:var(--bois);font:700 .75rem var(--texte);min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;border:2px solid var(--verre)}
.panier-btn .n[data-v="0"]{display:none}
nav.menu{border-top:1px solid var(--ligne);position:relative;background:#fff}
nav.menu ul{list-style:none;margin:0 auto;padding:0 24px;display:flex;gap:2px;max-width:1400px;overflow-x:auto;scrollbar-width:none}
nav.menu ul::-webkit-scrollbar{display:none}
nav.menu a{display:block;padding:11px 12px;white-space:nowrap;text-decoration:none;color:var(--encre);font:600 .95rem var(--texte);border-bottom:3px solid transparent}
nav.menu a:hover{color:var(--etiquette-f)}
nav.menu a[aria-current=page]{border-color:var(--etiquette);color:var(--etiquette-f)}
nav.menu a.conseil{color:var(--or-f)}
nav.menu::after{content:"";position:absolute;right:0;top:0;bottom:0;width:40px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);pointer-events:none}

/* Ouverture + bocal qui se visse */
.ouverture{background:var(--etiquette);color:#fff;overflow:hidden}
.ouverture .g{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-top:56px;padding-bottom:64px}
.ouverture h1{font-size:clamp(2.6rem,6.2vw,5.2rem);line-height:.98;margin:0 0 .3em;display:flex;align-items:flex-end;gap:.18em;flex-wrap:wrap}
.ouverture .lead{font-size:clamp(1.1rem,1.6vw,1.28rem);color:#EEF5E3;max-width:36ch}
.ouverture .act{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.promesse{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px 22px;font-weight:600;color:#fff}
.promesse li{display:flex;gap:.45em;align-items:center}
.promesse svg{color:var(--or)}
.ouverture figure{margin:0;position:relative}
.ouverture figure img{border-radius:14px;aspect-ratio:4/3;object-fit:cover;width:100%;box-shadow:0 26px 50px -26px rgba(0,0,0,.6)}
.ouverture figcaption{position:absolute;left:16px;bottom:16px;background:#fff;color:var(--bois);border-radius:8px;padding:10px 14px;font:700 .95rem var(--texte);box-shadow:0 10px 20px -12px rgba(0,0,0,.5)}
.bocal{width:.9em;height:1.05em;flex:none;transform:translateY(-.06em)}
.ouverture h1 .bocal{width:1.05em;height:1.2em}
.produit h3{hyphens:manual}
.bocal .verre{fill:rgba(255,255,255,.16);stroke:#fff;stroke-width:3}
.bocal.ray .verre{stroke:var(--etiquette)}
.bocal .contenu{fill:var(--bois2)}
.bocal .etq{fill:#fff}
.bocal .couv{fill:var(--or)}
.bocal .stries line{stroke:var(--or-f);stroke-width:2.2}
.bocal .gc{transform-box:fill-box;transform-origin:50% 100%}
.anim .bocal .gc{animation:visse 1.6s var(--ease) .3s both}
.anim .bocal .stries{animation:tourne 1.6s cubic-bezier(.3,.7,.2,1) .3s both}
@keyframes visse{0%{transform:translateY(-26%)}70%{transform:translateY(2%)}84%{transform:translateY(-2%)}100%{transform:none}}
@keyframes tourne{from{transform:translateX(-14px)}to{transform:none}}
.panier-btn.clic .stries{animation:tourne .7s cubic-bezier(.3,.7,.2,1) both}
.panier-btn.clic .gc{animation:visse .7s var(--ease) both}

section{padding:84px 0}
.rayons{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.rayon{background:#fff;border-radius:14px;overflow:hidden;text-decoration:none;color:var(--encre);border:1px solid var(--ligne);transition:transform .3s var(--ease),box-shadow .3s}
.rayon:hover{transform:translateY(-3px);box-shadow:0 18px 30px -20px rgba(0,0,0,.35);color:var(--encre)}
.rayon img{aspect-ratio:1;object-fit:cover;width:100%}
.rayon b{display:block;font:700 1.05rem/1.2 var(--titre);padding:14px 14px 4px}
.rayon span{display:block;padding:0 14px 14px;color:var(--gris);font-size:.92rem}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.deux.inv>:first-child{order:2}
.photo img{border-radius:14px;width:100%;aspect-ratio:4/3;object-fit:cover}
.valeurs{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.valeurs li{border-top:2px solid var(--etiquette);padding-top:12px}
.valeurs b{font:700 1.15rem var(--titre);display:block;color:var(--etiquette-f)}
.bois{background:var(--bois);color:#F1E9DF}
.bois h2,.bois h3{color:#fff}
.bois .suite{color:#fff}
.noel{background:var(--feuille)}
.presse{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--gris);font-size:.95rem;list-style:none;padding:0;margin:0}

/* Boutique */
.tete{background:var(--etiquette);color:#fff;padding:52px 0 40px}
.tete h1{font-size:clamp(2.3rem,5.5vw,4rem);margin-bottom:.2em}
.tete p{color:#EEF5E3;font-size:1.12rem}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.filtres button{border:2px solid var(--bois);background:#fff;border-radius:999px;padding:8px 14px;font:700 .9rem var(--texte);cursor:pointer;color:var(--bois)}
.filtres button[aria-pressed=true]{background:var(--bois);color:#fff}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.produit{background:#fff;border:1px solid var(--ligne);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.produit .im{aspect-ratio:3/2;background:var(--feuille);position:relative}
.produit .im img{width:100%;height:100%;object-fit:cover}
.produit .im .sans{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px;font:700 1.25rem/1.2 var(--titre);color:var(--etiquette-f);background:repeating-linear-gradient(135deg,var(--feuille) 0 14px,#E6EED9 14px 28px)}
.produit .corps{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.produit h3{margin:0}
.produit small{color:var(--gris)}
.produit .indispo{display:inline-block;background:#F3E2D7;color:#7A3B16;border-radius:6px;padding:2px 8px;font:700 .78rem var(--texte);align-self:flex-start}
.produit select{font:500 .95rem var(--texte);border:2px solid var(--ligne);border-radius:8px;padding:8px;background:#fff;width:100%}
.produit .bas{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.produit .px{font:700 1.3rem var(--titre);color:var(--bois);font-variant-numeric:tabular-nums}
.produit .kg{font-size:.82rem;color:var(--gris)}
.produit .fiche{font-size:.88rem}
.produit .btn{padding:.75em 1em}
/* Panier */
.voile{position:fixed;inset:0;background:rgba(20,15,10,.45);z-index:70;display:none}
.voile.on{display:block}
.panier{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--verre);z-index:71;transform:translateX(100%);transition:transform .45s var(--ease);display:flex;flex-direction:column}
.panier.on{transform:none}
.panier header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--etiquette);color:#fff}
.panier header h2{font-size:1.4rem;margin:0}
.panier header button{background:none;border:0;color:#fff;cursor:pointer;width:38px;height:38px;display:grid;place-items:center}
.lignes{flex:1;overflow-y:auto;padding:14px 18px}
.ligne{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--ligne)}
.ligne b{font-size:.98rem}
.ligne small{color:var(--gris)}
.qte{display:flex;align-items:center;gap:6px}
.qte button{width:30px;height:30px;border-radius:6px;border:2px solid var(--bois);background:#fff;cursor:pointer;font:700 1rem var(--texte)}
.vide{color:var(--gris);padding:30px 0;text-align:center}
.total{padding:16px 18px;border-top:2px solid var(--bois);background:#fff}
.total .l{display:flex;justify-content:space-between;font:700 1.2rem var(--titre);margin-bottom:10px}
.total p{font-size:.88rem;color:var(--gris);margin:0 0 12px}
.total .btn{width:100%}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .plein{grid-column:1/-1}
label.ch{display:flex;flex-direction:column;gap:5px;font:700 .82rem var(--texte);color:var(--gris)}
input,select,textarea{min-width:0;font:400 1rem var(--texte);color:var(--encre);border:2px solid var(--ligne);border-radius:8px;padding:10px 11px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--etiquette)}
.err{color:#9B2C1C;font-size:.9rem;min-height:1.2em;margin:.5em 0 0}
.ok{color:var(--etiquette-f);font-weight:700}
.coord{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;border-top:3px solid var(--bois);padding-top:20px}
.coord h3{color:var(--etiquette-f);font-size:1.1rem;margin-bottom:.3em}
.coord p{margin:0;overflow-wrap:anywhere}
.tarifs{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
.tarifs td{padding:12px 14px;border-bottom:1px solid var(--ligne)}
.tarifs td:last-child{text-align:right;font:700 1.1rem var(--titre);white-space:nowrap}

footer{background:var(--bois);color:#E2D8CC;padding:60px 0 110px}
footer a{color:#fff}
footer .g{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:32px}
footer h4{font:700 1.05rem var(--titre);color:#fff;margin:0 0 12px}
footer ul{list-style:none;padding:0;margin:0}footer li{margin:6px 0}
.signature{border-top:1px solid #5a4231;margin-top:36px;padding-top:18px;font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.reseaux a{display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid #7a5d48;border-radius:50%;margin-top:8px}

.barre{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(242,244,238,.97);border-top:1px solid var(--ligne)}
.barre .btn{flex:1;padding:.85em .5em;font-size:.9rem}

.cons-btn{position:fixed;right:20px;top:132px;z-index:50;display:flex;align-items:center;gap:10px;background:#fff;color:var(--bois);border:2px solid var(--bois);border-radius:12px;padding:7px 16px 7px 7px;cursor:pointer;font:inherit;text-align:left;box-shadow:0 12px 24px -14px rgba(0,0,0,.45)}
.cons-btn .av{width:38px;height:38px;border-radius:8px;background:var(--etiquette);color:#fff;display:grid;place-items:center;font:700 1.1rem var(--titre)}
.cons-btn b{display:block;font-size:.95rem}
.cons-btn small{font-size:.8rem;color:var(--gris)}
.cons-bulle{position:fixed;right:20px;top:196px;z-index:50;max-width:300px;background:#fff;border:2px solid var(--bois);border-radius:12px;padding:14px 40px 14px 16px;font-size:.93rem;display:none;box-shadow:0 14px 30px -16px rgba(0,0,0,.4)}
.cons-bulle.on{display:block;animation:monte .5s var(--ease)}
.cons-bulle button{position:absolute;top:6px;right:6px;border:0;background:none;cursor:pointer;width:32px;height:32px;display:grid;place-items:center}
@keyframes monte{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cons{position:fixed;right:20px;top:132px;z-index:60;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 150px));background:var(--verre);border:2px solid var(--bois);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden}
.cons.on{display:flex;animation:monte .45s var(--ease)}
.cons header{background:var(--etiquette);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px}
.cons header b{display:block;font:700 1.1rem var(--titre)}
.cons header small{color:#E3EED3;font-size:.8rem}
.cons header button{margin-left:auto;background:none;border:0;color:#fff;cursor:pointer;width:36px;height:36px;display:grid;place-items:center}
.fil{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:.95rem;line-height:1.5}
.msg.b{background:#fff;align-self:flex-start}
.msg.u{background:var(--etiquette-f);color:#fff;align-self:flex-end}
.msg button{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chips button{border:2px solid var(--bois);background:#fff;border-radius:999px;padding:6px 11px;font:700 .84rem var(--texte);cursor:pointer}
.chips button:hover{background:var(--feuille)}
.cons form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--ligne);background:#fff}
.cons form button{flex:none;padding:0 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--bois);color:#fff;padding:12px 18px;border-radius:10px;z-index:80;transition:all .35s var(--ease);pointer-events:none;font-weight:600}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.apparait{opacity:1}
.js .apparait{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.js .apparait.vu{opacity:1;transform:none}
@media (max-width:1024px){
 .ouverture .g,.deux,.deux.inv{grid-template-columns:minmax(0,1fr);gap:32px}.deux.inv>:first-child{order:0}
 .rayons{grid-template-columns:repeat(3,minmax(0,1fr))}
 footer .g{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
 .bar1{padding:8px 14px;gap:10px}.tel span{display:none}.bar1 .tel{display:none}
 nav.menu ul{padding:0 14px}.wrap{padding:0 16px}
 section{padding:58px 0}
 .barre{display:flex}
 .ouverture .act{display:none}
 .panier-btn .lbl{display:none}
 .langue{padding-left:8px}.langue .i{display:none}
 .cons-btn{top:auto;right:auto;left:12px;bottom:76px;padding:5px 12px 5px 5px}
 .cons-btn .av{width:32px;height:32px}
 .cons-bulle{top:auto;right:auto;left:12px;bottom:136px}
 .cons{top:auto;right:auto;left:12px;bottom:12px;height:min(600px,calc(100vh - 24px))}
 .form,footer .g,.coord{grid-template-columns:minmax(0,1fr)}
 .toast{bottom:84px}
}
@media (max-width:480px){
 .logo img{height:36px}
 .rayons{grid-template-columns:repeat(2,minmax(0,1fr))}
 .cons-btn small{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .apparait{opacity:1;transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-tel" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></symbol>
 <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
 <symbol id="i-ok" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>

function repondre(q,l){
 const s=q.toLowerCase();
 for(const [k,re] of INT){if(re.test(s)){
  if(k==='plat'){const m=s.match(/\b(\d{1,2})\b/);const n=m?+m[1]:(/\b(deux|two|dos|zwei|due|twee|1|un|une|seul|alone|solo|allein|da solo|alleen)\b/.test(s)?2:4);return (n<=2?R.plat2:R.plat4)[l]}
  return R[k][l]}}
 return R.defaut[l];
}

 <div><h4>${t('partT')}</h4><ul><li><a href="http://www.saveursdutarn.fr/fr/" target="_blank" rel="noopener">Saveurs du Tarn</a></li><li><a href="http://spar-alban.fr/" target="_blank" rel="noopener">SPAR Alban</a></li><li><a href="https://jemangefrancais.com/42__nos-petites-conserves" target="_blank" rel="noopener">jemangefrançais.com</a></li></ul></div></div>

function conseiller(){return `<button class="cons-btn" type="button" data-cons><span class="av">P</span><span><b>${t('cName')}</b><small>${t('cSub')}</small></span></button>
 <div class="cons-bulle" id="bulle" role="status"><button type="button" id="bulleX" aria-label="${t('cClose')}">${ico('x')}</button>${t('cBubble')}</div>
 <div class="cons" id="cons" role="dialog" aria-label="${t('cName')}"><header><span class="av" style="width:36px;height:36px;border-radius:8px;background:var(--or);color:var(--bois);display:grid;place-items:center;font:700 1.05rem var(--titre)">P</span><div><b>${t('cName')}</b><small>${t('cVirt')}</small></div><button type="button" id="consX" aria-label="${t('cClose')}">${ico('x')}</button></header>
 <div class="fil" id="fil" aria-live="polite"></div><div class="chips" id="chips">${t('chips').map(c=>`<button type="button">${c}</button>`).join('')}</div>
 <form id="consF"><label class="sr" for="consQ">${t('cPh')}</label><input id="consQ" placeholder="${t('cPh')}" autocomplete="off"><button class="btn" type="submit" aria-label="${t('cPh')}">${ico('send')}</button></form></div>`}
/* Panier */
function rendPanier(){
 const el=document.getElementById('panier');let tot=0;
 const lignes=panier.map((x,i)=>{const p=P.find(y=>y.id===x.id),v=p.v[x.v];tot+=v[3]*x.q;return `<div class="ligne"><div><b>${p.n[lang]}</b><br><small>${fmt(v)} · ${eur(v[3])}</small></div><div class="qte"><button type="button" data-q="${i}:-1" aria-label="−">−</button><span>${x.q}</span><button type="button" data-q="${i}:1" aria-label="+">+</button></div></div>`}).join('');
 el.innerHTML=`<header><h2>${t('cartT')}</h2><button type="button" id="fermePanier" aria-label="${t('cClose')}">${ico('x')}</button></header><div class="lignes">${lignes||`<p class="vide">${t('empty')}</p>`}</div>
 <div class="total"><div class="l"><span>${t('total')}</span><span>${eur(tot)}</span></div><p>${t('cartN')}</p>
 <form class="form" id="fcmd" novalidate><label class="ch plein">${t('oNom')}<input name="n" autocomplete="name"></label><label class="ch">${t('oMail')}<input name="e" type="email" autocomplete="email"></label><label class="ch">${t('oTel')}<input name="t" type="tel" autocomplete="tel"></label><label class="ch plein">${t('oAdr')}<textarea name="a" rows="2"></textarea></label><div class="plein"><button class="btn or" type="submit"${panier.length?'':' disabled'}>${ico('send')}${t('order')}</button><p class="err" aria-live="polite"></p><p style="font-size:.85rem;margin:0"><a href="${CGV}" target="_blank" rel="noopener">${t('cgv')}</a></p></div></form></div>`;
 document.getElementById('fermePanier').onclick=fermePanier;
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.q.split(':').map(Number);panier[i].q+=d;if(panier[i].q<=0)panier.splice(i,1);sauve();rendPanier();majCompteur()});
 const f=document.getElementById('fcmd');f.onsubmit=e=>{e.preventDefault();const er=f.querySelector('.err');er.className='err';
  if(!f.n.value.trim()||!/.+@.+\..+/.test(f.e.value)||!f.a.value.trim()){er.textContent=t('oErr');return}
  const corps=panier.map(x=>{const p=P.find(y=>y.id===x.id),v=p.v[x.v];return `${x.q} × ${p.n.fr} — ${fmt(v)} — ${eur(v[3]*x.q)}`}).join('\n');
  er.className='err ok';er.textContent=t('oOk');
  location.href='mailto:contact@nospetitesconserves.fr?subject='+encodeURIComponent('Commande — '+f.n.value)+'&body='+encodeURIComponent(`${corps}\n\n${t('total')} : ${eur(tot)}\n\n${f.n.value}\n${f.e.value}\n${f.t.value}\n${f.a.value}`)};
}
function ouvrePanier(){rendPanier();document.getElementById('panier').classList.add('on');document.getElementById('voile').classList.add('on')}
function fermePanier(){document.getElementById('panier').classList.remove('on');document.getElementById('voile').classList.remove('on')}
function majCompteur(){const nb=panier.reduce((a,x)=>a+x.q,0);const n=document.querySelector('.panier-btn .n');if(n){n.textContent=nb;n.dataset.v=nb}}
function ajoute(id,vi){const p=P.find(x=>x.id===id);if(!p||p.off)return;const l=panier.find(x=>x.id===id&&x.v===vi);if(l)l.q++;else panier.push({id,v:vi,q:1});sauve();majCompteur();
 const b=document.getElementById('ouvrePanier');b.classList.remove('clic');void b.offsetWidth;b.classList.add('clic');
 const to=document.getElementById('toast');to.textContent=t('added')+' · '+p.n[lang];to.classList.add('on');clearTimeout(window.__tt);window.__tt=setTimeout(()=>to.classList.remove('on'),1800)}
const PAGES={'':accueil,boutique,lots,facon,conserverie,contact,mentions};
let bulleVue=store.get('npc-bulle')==='1';
function render(){
 let r=(location.hash.replace(/^#\/?/,'').split(/[?#]/)[0])||''; if(!PAGES[r])r='';
 const on=document.getElementById('cons')?.classList.contains('on'),fil=document.getElementById('fil')?.innerHTML;
 document.documentElement.lang=lang;
 document.getElementById('app').innerHTML=header(r)+`<main>${PAGES[r]()}</main>`+footer()+conseiller();
 if(fil){document.getElementById('fil').innerHTML=fil;libelles()} if(on)document.getElementById('cons').classList.add('on');
 brancher();
}
function libelles(){document.querySelectorAll('#fil [data-add]').forEach(b=>{const [id,vi]=b.dataset.add.split(':');const p=P.find(x=>x.id===id);b.textContent=t('cAdd')+' · '+p.n[lang]+' · '+eur(p.v[+vi][3])})}
function brancher(){
 document.getElementById('lg').onchange=e=>{lang=e.target.value;store.set('npc-lang',lang);document.getElementById('fil').innerHTML='';render()};
 document.getElementById('ouvrePanier').onclick=ouvrePanier;
 document.getElementById('voile').onclick=fermePanier;
 document.querySelectorAll('[data-var]').forEach(s=>s.onchange=()=>{const p=P.find(x=>x.id===s.dataset.var),v=p.v[+s.value];document.querySelector(`[data-px="${p.id}"]`).textContent=eur(v[3]);const kg=document.querySelector(`[data-kg="${p.id}"]`);if(kg)kg.textContent=eur(v[4])+t('kg')});
 document.querySelectorAll('main [data-add]').forEach(b=>b.onclick=()=>{const s=document.querySelector(`[data-var="${b.dataset.add}"]`);ajoute(b.dataset.add,s?+s.value:0)});
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{location.hash='#/boutique'+(b.dataset.f?'?'+b.dataset.f:'')});
 const fc=document.getElementById('fco');
 if(fc)fc.onsubmit=e=>{e.preventDefault();const er=fc.querySelector('.err');er.className='err';if(!/.+@.+\..+/.test(fc.e.value)||!fc.m.value.trim()){er.textContent=t('coErr');return}er.className='err ok';er.textContent=t('coOk');location.href='mailto:contact@nospetitesconserves.fr?subject='+encodeURIComponent(fc.s.value||t('coF'))+'&body='+encodeURIComponent(fc.m.value+'\n\n'+fc.n.value+'\n'+fc.e.value)};
 document.querySelectorAll('[data-cons]').forEach(b=>b.onclick=e=>{e.preventDefault();ouvrir()});
 document.getElementById('consX').onclick=()=>document.getElementById('cons').classList.remove('on');
 document.getElementById('bulleX').onclick=()=>{document.getElementById('bulle').classList.remove('on')};
 document.getElementById('chips').onclick=e=>{if(e.target.tagName==='BUTTON')poser(e.target.textContent)};
 document.getElementById('consF').onsubmit=e=>{e.preventDefault();const q=document.getElementById('consQ');if(q.value.trim()){poser(q.value.trim());q.value=''}};
 document.getElementById('fil').onclick=e=>{const b=e.target.closest('[data-add]');if(b){const [id,vi]=b.dataset.add.split(':');ajoute(id,+vi);return}const a=e.target.closest('a[data-go]');if(a&&innerWidth<820)document.getElementById('cons').classList.remove('on')};
 const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('vu');io.unobserve(x.target)}}),{rootMargin:'0px 0px -6% 0px'});
 document.querySelectorAll('.apparait').forEach(el=>io.observe(el));
}
function ouvrir(){document.getElementById('cons').classList.add('on');document.getElementById('bulle').classList.remove('on');const f=document.getElementById('fil');if(!f.children.length)dire(t('cHello'),'b');setTimeout(()=>document.getElementById('consQ').focus(),50)}
function dire(h,w){const f=document.getElementById('fil'),d=document.createElement('div');d.className='msg '+w;if(w==='u')d.textContent=h;else d.innerHTML=h;f.appendChild(d);libelles();f.scrollTop=f.scrollHeight}
function poser(q){dire(q,'u');setTimeout(()=>dire(repondre(q,lang),'b'),350)}
addEventListener('keydown',e=>{if(e.key==='Escape'){fermePanier();document.getElementById('cons')?.classList.remove('on')}});
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
render();
setTimeout(()=>{if(!bulleVue&&!document.getElementById('cons').classList.contains('on')){document.getElementById('bulle').classList.add('on');bulleVue=true;store.set('npc-bulle','1')}},4000);
