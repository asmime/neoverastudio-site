:root{
  --papier:#FBF6F3;--gres-clair:#F0DDD5;--gres:#E2BFB2;--gres-vif:#B9685C;--gres-fonce:#7F3B35;
  --sapin:#233A31;--sapin2:#2F4A3F;--sapin3:#3E5C50;--laiton:#B08848;--laiton-clair:#E4CB92;--laiton-fonce:#7A5A26;
  --noyer:#2A1D19;--noyer2:#4A3832;--gris-rose:#6E5A54;
  --serif:"Marcellus",Georgia,serif;--grave:"Cinzel","Marcellus",Georgia,serif;--sans:"Alegreya Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);--r:4px;--w:1240px;--g:clamp(16px,4vw,48px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papier);color:var(--noyer);font:400 18px/1.6 var(--sans);font-kerning:normal;overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:var(--gres-fonce);text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{color:var(--sapin)}
::selection{background:var(--laiton-clair);color:var(--noyer)}
:focus-visible{outline:2px solid var(--laiton);outline-offset:3px;border-radius:2px}
html{scrollbar-color:var(--gres-vif) var(--gres-clair)}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-track{background:var(--gres-clair)}::-webkit-scrollbar-thumb{background:var(--gres-vif);border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,5.6vw,4.9rem)}
h2{font-size:clamp(1.9rem,3.6vw,3.1rem)}
h3{font-size:clamp(1.3rem,2vw,1.65rem)}
p{margin:0 0 1em;text-wrap:pretty}
.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--g)}
.lead{font-size:clamp(1.08rem,1.5vw,1.28rem);line-height:1.55;max-width:60ch}
.muted{color:var(--gris-rose)}
.num{font-variant-numeric:tabular-nums lining-nums}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:#fff;padding:8px 12px}


.top{position:sticky;top:0;z-index:40;background:rgba(251,246,243,.97);border-bottom:1px solid #e6d3cb}
.top-in{display:flex;align-items:center;gap:18px;max-width:1400px;margin:0 auto;padding:10px var(--g)}
.marque{display:flex;flex-direction:column;text-decoration:none;color:var(--noyer);line-height:1;margin-right:auto}
.marque b{font:400 30px/1 var(--serif);letter-spacing:.01em}
.marque span{font:600 10.5px/1.3 var(--grave);letter-spacing:.16em;color:var(--gres-fonce);margin-top:5px;text-transform:uppercase}
.langue{display:flex;align-items:center;gap:8px;border:1.5px solid var(--noyer2);border-radius:999px;padding:5px 6px 5px 12px;background:#fff}
.langue svg{flex:none}
.langue select{border:0;background:transparent;font:500 15px var(--sans);color:var(--noyer);padding:4px 4px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 22px;border-radius:999px;font:600 16px/1 var(--sans);letter-spacing:.01em;text-decoration:none;border:1.5px solid transparent;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease)}
.btn-sapin{background:var(--sapin);color:#fff;border-color:var(--sapin)}
.btn-sapin:hover{background:var(--sapin2);color:#fff}
.btn-sapin::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 28%,rgba(228,203,146,.38) 50%,transparent 72%);transform:translateX(-130%);transition:transform .65s var(--ease)}
.btn-sapin:hover::after{transform:translateX(130%)}
.btn-ligne{background:transparent;color:var(--noyer);border-color:var(--noyer2)}
.btn-ligne:hover{background:var(--noyer);color:#fff}
.btn-clair{background:#fff;color:var(--noyer);border-color:#fff}
.btn-clair:hover{background:var(--laiton-clair);border-color:var(--laiton-clair);color:var(--noyer)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.btn small{font-weight:500;opacity:.8}
.nav{border-top:1px solid #eedfd8;position:relative}
.nav ul{display:flex;gap:2px;list-style:none;margin:0 auto;padding:0 var(--g);max-width:1400px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:11px 12px;font:500 15.5px/1 var(--sans);color:var(--noyer2);text-decoration:none;border-bottom:2px solid transparent}
.nav a:hover{color:var(--gres-fonce)}
.nav a[aria-current=page]{color:var(--noyer);border-bottom-color:var(--laiton)}
.nav a.conseil{color:var(--sapin);font-weight:700}
@media (max-width:1180px){.nav ul{justify-content:flex-start}.nav::after{content:"";position:absolute;right:0;top:0;bottom:0;width:44px;background:linear-gradient(90deg,rgba(251,246,243,0),var(--papier));pointer-events:none}}
@media (max-width:760px){.marque b{font-size:25px}.marque span{font-size:9.5px;letter-spacing:.12em}.top-in{gap:10px;flex-wrap:wrap}.top .btn{min-height:40px;padding:0 15px;font-size:15px}.langue select{font-size:14px;max-width:104px}.nav a{padding:10px 10px;font-size:15px}}
@media (max-width:560px){.top-in{padding:8px 16px;row-gap:8px}.marque{flex:1 1 auto;order:1}#btn-resa{order:2}.langue{order:3;margin-right:auto}#btn-sejour{order:4}}


.plaque{--pw:min(100%,560px);position:relative;display:inline-grid;place-items:center;text-align:center;min-width:min(100%,300px);max-width:var(--pw);padding:20px 54px 18px;border-radius:50%/50%;
  background:radial-gradient(120% 140% at 30% 20%,#F1DCA8 0%,#D2AE69 36%,#B08848 62%,#94702F 100%);
  box-shadow:inset 0 0 0 3px rgba(122,90,38,.55),inset 0 0 0 7px rgba(241,220,168,.55),inset 0 0 0 8px rgba(122,90,38,.35),0 10px 24px -10px rgba(42,29,25,.45),0 2px 4px rgba(42,29,25,.18);overflow:hidden;isolation:isolate}
.plaque::after{content:"";position:absolute;inset:-10% -30%;z-index:2;pointer-events:none;background:linear-gradient(112deg,transparent 34%,rgba(255,250,232,.0) 40%,rgba(255,250,232,.72) 50%,rgba(255,250,232,0) 60%,transparent 66%);transform:translateX(-75%);opacity:0}
.plaque.lit::after{animation:reflet 1.5s var(--ease) .15s 1 both}
.plaque:hover::after{animation:reflet 1.2s var(--ease) 1 both}
@keyframes reflet{0%{transform:translateX(-75%);opacity:0}12%{opacity:1}100%{transform:translateX(75%);opacity:0}}
.plaque>*{position:relative;z-index:1}
.plaque .l1{font:600 clamp(1.05rem,2.3vw,1.6rem)/1.12 var(--grave);letter-spacing:.06em;color:#3B2A12;text-shadow:0 1px 0 rgba(255,244,214,.75),0 -1px 0 rgba(60,40,10,.35);margin:0;text-wrap:balance}
.plaque .l2{display:block;font:italic 400 clamp(.95rem,1.6vw,1.15rem)/1.2 var(--sans);color:#4E3816;text-shadow:0 1px 0 rgba(255,244,214,.6);margin-top:5px}
.plaque.petite{padding:12px 34px 11px;min-width:0}.plaque.petite .l1{font-size:1rem}.plaque.petite .l2{font-size:.92rem}
.plaque.sombre{box-shadow:inset 0 0 0 3px rgba(122,90,38,.55),inset 0 0 0 7px rgba(241,220,168,.5),inset 0 0 0 8px rgba(122,90,38,.35),0 14px 30px -12px rgba(0,0,0,.7)}
.tete{display:flex;flex-direction:column;align-items:flex-start;gap:18px;margin-bottom:clamp(26px,4vw,46px)}
.tete.centre{align-items:center;text-align:center}
@media (prefers-reduced-motion:reduce){.plaque.lit::after,.plaque:hover::after{animation:none}.btn-sapin::after{display:none}html{scroll-behavior:auto}}


.heros{position:relative;min-height:min(86vh,820px);display:grid;align-items:end;color:#fff;background:var(--noyer)}
.heros-media{position:absolute;inset:0;overflow:hidden}
.heros-media video,.heros-media img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.heros-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,18,15,.15) 0%,rgba(28,18,15,.05) 35%,rgba(28,18,15,.72) 78%,rgba(28,18,15,.86) 100%)}
.heros-in{position:relative;z-index:1;width:100%;max-width:var(--w);margin:0 auto;padding:clamp(110px,18vh,200px) var(--g) clamp(28px,5vw,54px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.8fr);gap:clamp(24px,4vw,64px);align-items:end}
.heros h1{max-width:13ch;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.heros .lead{color:#F6ECE6;margin-top:18px}
.heros .prix{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-top:20px;font-size:17px;color:#F1E1D8}
.heros .prix strong{font:400 34px/1 var(--serif);color:#fff}
.resa{background:var(--papier);color:var(--noyer);border-radius:10px;padding:22px;box-shadow:0 24px 50px -20px rgba(0,0,0,.55)}
.resa h2{font-size:1.55rem;margin-bottom:14px}
.champs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.champ{display:flex;flex-direction:column;gap:5px;font:500 14px var(--sans);color:var(--noyer2)}
.champ.plein{grid-column:1/-1}
.champ input,.champ select,.champ textarea{font:400 16.5px var(--sans);color:var(--noyer);background:#fff;border:1.5px solid #d9c5bc;border-radius:6px;padding:10px 12px;min-height:46px;width:100%}
.champ input:focus,.champ select:focus,.champ textarea:focus{border-color:var(--laiton);outline:none;box-shadow:0 0 0 3px rgba(176,136,72,.22)}
.resa .btn{width:100%;margin-top:14px}
.resa .note{font-size:14px;color:var(--gris-rose);margin:10px 0 0}
.resa .ou{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;font-size:15px}
@media (max-width:900px){.heros-media::after{background:linear-gradient(180deg,rgba(28,18,15,.1) 0%,rgba(28,18,15,.35) 30%,rgba(28,18,15,.78) 55%,rgba(28,18,15,.9) 100%)}.heros-in{grid-template-columns:1fr}.heros{min-height:auto}.heros-in{padding-top:min(48vh,360px)}}


.sec{padding:clamp(64px,9vw,120px) 0}
.sec.gres{background:var(--gres-clair)}
.sec.sapin{background:var(--sapin);color:#EFE6DE}
.sec.sapin h2,.sec.sapin h3{color:#fff}
.sec.sapin a:not(.btn){color:var(--laiton-clair)}
.sec.noyer{background:var(--noyer);color:#EADBD3}
.sec.noyer h2,.sec.noyer h3{color:#fff}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);align-items:center}
@media (max-width:860px){.deux{grid-template-columns:1fr}}
.photo{border-radius:var(--r);overflow:hidden;background:var(--gres)}
.photo img{width:100%;height:100%;object-fit:cover}
.legende{font-size:14px;color:var(--gris-rose);margin-top:8px}


.maison-photos{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto auto;gap:12px}
.maison-photos .photo:first-child{grid-row:1/3;aspect-ratio:3/4}
.maison-photos .photo{aspect-ratio:4/3}
.signature{font:italic 400 1.15rem var(--sans);color:var(--gres-fonce)}
.liste-atouts{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 26px;padding:0;list-style:none}
.liste-atouts li{border:1px solid #d7bcb1;border-radius:999px;padding:6px 14px;font-size:15.5px;background:rgba(255,255,255,.55)}


.couloir{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:start}
.portes{list-style:none;margin:0;padding:0;border-top:1px solid #d9c2b8}
.porte{border-bottom:1px solid #d9c2b8}
.porte a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;padding:18px 6px;text-decoration:none;color:var(--noyer);transition:background .3s,padding .3s var(--ease)}
.porte a:hover,.porte a.actif{background:rgba(255,255,255,.6);padding-left:16px}
.porte h3{font-size:1.45rem}
.porte .meta{grid-column:1;font-size:15.5px;color:var(--gris-rose)}
.porte .px{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-size:14px;color:var(--gris-rose)}
.porte .px b{display:block;font:400 1.6rem/1 var(--serif);color:var(--gres-fonce)}
.porte .vignette{display:none}
.vitrine{position:sticky;top:130px;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--gres)}
.vitrine img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s var(--ease),transform 1.4s var(--ease);transform:scale(1.04)}
.vitrine img.on{opacity:1;transform:scale(1)}
.vitrine .plaque{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:2}
@media (max-width:860px){.couloir{grid-template-columns:1fr}.vitrine{display:none}.porte a{grid-template-columns:110px minmax(0,1fr);padding:14px 0}.porte .vignette{display:block;grid-row:1/4;aspect-ratio:1;border-radius:4px;overflow:hidden}.porte .vignette img{width:100%;height:100%;object-fit:cover}.porte h3,.porte .meta{grid-column:2}.porte .px{grid-row:auto;grid-column:2;text-align:left}.porte .px b{display:inline;font-size:1.25rem;margin-right:6px}.porte a:hover,.porte a.actif{padding-left:0}}


.winstub{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(28px,5vw,72px);align-items:center}
.winstub .photo{aspect-ratio:4/5}
.ardoise{border-top:1px solid rgba(228,203,146,.4);margin:24px 0}
.plat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(228,203,146,.25)}
.plat span{color:#EBDDD3}
.plat b{font:400 1.25rem var(--serif);color:var(--laiton-clair);white-space:nowrap}
.horaires{font-size:16px;color:#CDBDB3}
@media (max-width:860px){.winstub{grid-template-columns:1fr}.winstub .photo{aspect-ratio:4/3}}


.spa-grille{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:8px}
.spa-grille>.photo:nth-child(1){grid-column:1/8;aspect-ratio:16/10}
.spa-grille>.photo:nth-child(2){grid-column:8/13}
.spa-grille .photo:nth-child(3){grid-column:1/5;aspect-ratio:1}
.spa-grille .photo:nth-child(4){grid-column:5/13;aspect-ratio:21/9}
.mot{font:400 clamp(1.25rem,2.2vw,1.6rem)/1.35 var(--serif);max-width:30ch}
.mot cite{display:block;font:500 15px var(--sans);font-style:normal;color:var(--gris-rose);margin-top:10px}
@media (max-width:700px){.spa-grille .photo{grid-column:1/-1!important;aspect-ratio:4/3!important}}


.offres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,26px)}
.offre{display:flex;flex-direction:column;background:#fff;border-radius:6px;overflow:hidden;text-decoration:none;color:var(--noyer);box-shadow:0 12px 30px -22px rgba(42,29,25,.5);transition:transform .4s var(--ease),box-shadow .4s}
.offre:hover{transform:translateY(-4px);box-shadow:0 22px 40px -24px rgba(42,29,25,.55);color:var(--noyer)}
.offre .photo{aspect-ratio:3/2;border-radius:0}
.offre div.txt{padding:20px 22px 22px}
.offre .tarif{font:400 1.3rem var(--serif);color:var(--gres-fonce);margin:6px 0 8px}
.offre:nth-child(2){transform:translateY(28px)}.offre:nth-child(2):hover{transform:translateY(24px)}
@media (max-width:860px){.offres{grid-template-columns:1fr}.offre:nth-child(2){transform:none}.offre:nth-child(2):hover{transform:translateY(-4px)}}


.avis-rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 18px;scrollbar-width:thin}
.avis{flex:0 0 min(84vw,380px);scroll-snap-align:start;background:#fff;border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:12px;border:1px solid #ead8d0}
.avis q{font:400 1.12rem/1.45 var(--serif);quotes:"«\00a0" "\00a0»"}
.avis footer{margin-top:auto;font-size:15px;color:var(--gris-rose)}
.avis footer b{color:var(--noyer);font-weight:700}
.rail-nav{display:flex;gap:10px}
.rond{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--noyer2);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--noyer)}
.rond:hover{background:var(--noyer);color:#fff}


.porte-alsace{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,5vw,72px);align-items:start}
.distances{list-style:none;margin:0;padding:0}
.distances li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:13px 0;border-bottom:1px dashed rgba(228,203,146,.45);align-items:baseline}
.distances li span{color:#F0E6DE}
.distances li b{font:400 1.15rem var(--serif);color:var(--laiton-clair);white-space:nowrap}
.visites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.visite{position:relative;display:block;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;color:#fff;text-decoration:none}
.visite img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.visite:hover img{transform:scale(1.05)}
.visite span{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(180deg,transparent,rgba(20,14,12,.8));font:400 1.2rem/1.2 var(--serif)}
.visite:hover{color:#fff}
@media (max-width:860px){.porte-alsace{grid-template-columns:1fr}}


.venir{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px)}
.venir h3{margin-bottom:10px}

['Jean-Stéphane','09/06/2025',"Chambres spacieuses et très bien équipées. Serviette de toilette douce et de qualité, de même que les draps et la literie. Bonne prise en compte des demandes particulières. Places de parking en épi devant l'hôtel."],
['Stephen','07/06/2025',"Hôtel agréable proche du centre ville"],
['Michael','02/06/2025',"C'est merveilleux ! Vélos bien rangés, très sympathique et arrangeant, très propre, très belle chambre confortable, très bien. Matelas, excellent petit déjeuner ! Nous avons rarement été aussi satisfaits ! Merci !!"],
['Sascha','25/05/2025',"Nous avons été accueillis par un patron agréable et sympathique. Hôtel exceptionnel avec une grande attention aux détails. Excellentes installations et un merveilleux petit-déjeuner. Nous reviendrons avec plaisir. Excellent emplacement, calme mais toujours à seulement deux pâtés de maisons du centre-ville."],
['Pierre','09/03/2025',"Très bon hôtel, propre, accueillant, calme, bonne cuisine un peu copieuse, rapport qualité/prix impeccable. À recommander et je reviendrai. Tout était parfait"],
['Fabrice','09/02/2025',"Sympathique hôtel dans le style alsacien. Calme et propreté, très bon accueil. Le restaurant est également très bien"],
['Melanie','08/01/2025',"Emplacement au calme en plein centre. Grande chambre avec séparation toilette et bain/baignoire. Personnel très courtois, par exemple réservation en ligne quotidienne payante pour le parking."],
['Yolande','16/01/2025',"Une nuit confortable et calme suivie d'un bon petit déj !"],
['Valérie','02/10/2024',"En voyage professionnel, c'est la seconde fois que j'y séjourne. Je suis toujours aussi satisfaite. Très jolie chambre et propre. Petit déjeuner de qualité et très varié. J'y retournerai sans aucun doute"],
['Anne-Valérie','19/08/2024',"Idéal pour faire étape. Restaurant extra dans l’hôtel même."],
['Manfred','06/08/2024','Très sympathique. Propre et au goût du jour'],
['Jean-Luc','03/08/2024',"L'accueil, parking, confort."],
['P.M.','28/07/2024',"Séjour court mais agréable dans un hôtel français authentique. Déco authentique, chambre spacieuse, toilettes séparées, situation géographique (proche autoroute, parking devant la porte, centre accessible à pied)"],
['Maximilian','14/07/2024',"L'hôtel est très bien situé et bien équipé. Nous avons été logés dans la partie plus récente de l'hôtel. La chambre était très spacieuse et calme, avec beaucoup de bois. Notre chambre avait une salle de bain et des toilettes séparées."],
['Frank','31/05/2024','Ambiance sympa, soins agréables. Tout était très bien pour nous'],
['Julien','18/05/2024','Hôtel confortable en centre ville'],
['Reinhard','13/05/2024',"Très belle chambre, emplacement calme et central. Nous avons pu ranger nos vélos derrière l'hôtel dans un garage. Belle salle de petit déjeuner avec un bon petit déjeuner."],
['Alison','11/05/2024','Super séjour très central propre et convivial'],
['Andrea','11/05/2024','La chambre était grande et les lits étaient très confortables. Nous avons pu ranger nos vélos en toute sécurité dans le garage. Petit déjeuner copieux.'],
['Veerle','03/05/2024',"Agréable surprise par le jacuzzi, amabilité et serviabilité au comptoir, place pour ranger les vélos"],
['Pierre','02/04/2024','Le calme, la situation, la propreté.'],
['Georges','03/03/2024',"Bon rapport qualité prix. Nous réserverions à nouveau. Pas de bruit nocturne (calme). Bon buffet pour le petit déjeuner. Personnel amical. Chambre propre."],
['Phillip','16/12/2023',"Très bien situé, le spa était incroyablement bon et moderne, le personnel sympathique et la chambre spacieuse"],
['Patrick','03/11/2023',"Nous avons été ravis de notre déjeuner. Excellent accueil et service. Beau décor, très propre. Plats excellents ; fins. Rien à redire. Nous y retournerons avec plaisir."],
['Cornelia','07/10/2023',"Une très belle chambre avec une grande salle de bain neuve. Personnel sympa. Endroit très bien."],
['Charlotte','01/10/2023',"Chambre spacieuse et grande salle de bain. Un bon emplacement, facile pour se garer. Et hôtel calme."],
['Hans-Rudolf','26/09/2023',"Hôtel cosy, grandes chambres avec salle de bain et WC séparés, bon petit déjeuner, parking devant la maison"],
['Salomon','17/09/2023',"Le buffet du petit déjeuner était exceptionnel, des croissants excellents, de la charcuterie, du fromage, des fruits, des œufs à cuisiner pour soi, des jus de fruits et une belle salle. Tout était bien"],
['Pascal','19/08/2023',"Superbe accueil. Restaurant : étant en Alsace, nous avons pris une choucroute : généreuse et bonne. La chambre d'hôtel est tout à fait correcte ainsi que la salle de bain. Belle expérience. À renouveler"],
['Suzanne','04/08/2023',"Nous avons passé une nuit dans le logement lors de notre circuit en vélo et avons été très satisfaits : accueil sympathique, chambre calme et propre, espace de rangement pour les vélos, petit déjeuner délicieux, petites balades au centre… bref parfait."],
['Guy','04/04/2023','Petit déjeuner copieux avec des produits variés. Personnel disponible, accueillant et souriant. Chambre et sanitaire agréables et bien organisés.'],
['Marceline','01/04/2023',"Excellent accueil, discret et souriant. Silencieux, confortable et bien aménagé. Belle atmosphère. Excellent restaurant. Je recommande chaudement « Chez Jean »"],
['Marius','19/03/2023','gute Lage, gemütliche Einrichtung, freundliches Personal'],
['Patrick','23/02/2023','Exceptionnel et très sympathique'],
['Retraité','04/02/2023',"Chambre de très bonne qualité. Un excellent repas. Et un buffet petit déjeuner copieux. Le massage et l'espace détente très agréables. La situation au centre-ville, un plus. Un plus : notre compagnon à 4 pattes accepté, bravo et merci"],
['Maurice','01/12/2022',"Restaurant excellent. La choucroute de poissons ainsi que les desserts sont fabuleux. Le service est parfait, les prix corrects. La propreté de l’établissement est nickel. La prochaine fois que nous irons à Saverne nous y retournerons."],
['Vera','04/09/2022',"Tout est ici parfait ! Un bel emplacement, des chambres spacieuses, très propres, une cuisine vraiment délicieuse au restaurant et un service toujours amical. Et espace de rangement pour nos vélos !"],
['Marc','14/08/2022','Sehr nettes Personal und sehr sauberes Hotel.'],
['Charles N.','16/08/2021',"We were departing from Saverne on our canal boat vacation and stayed here before our trip. The staff were very nice and very helpful, not only during our entire stay but when we needed somewhere to store our cold goods for our canal boat, they put them in their walk in refrigerator for us."],
['David','16/08/2021',"Very good hotel within a short walk of town centre and most tourist attractions. I had 2 excellent dinners. Proprietor and staff friendly and helpful."],
['Fredy Schoepflin','07/08/2022','Belle chambre et très bon restaurant'],
['R. Schmidt','06/08/2022','Freundliches Personal, aufmerksamer Service, gutes Essen, familiäre Atmosphäre, kurzer Weg in die Innenstadt, wir haben uns sehr wohl gefühlt'],
['Christian','23/06/2022','Sympathischer Familienbetrieb in zweiter Generation, zentral gelegen in der schönen Stadt Saverne, mit ansprechenden Zimmern, freundlichem Service und sehr guter Küche.'],
['Ursula','11/07/2022','Ein traditionelles, gleichzeitig modernes Haus; Radreisende werden sehr freundlich empfangen.'],
['Didier','28/07/2022',"Accueil parfait, les renseignements ont été donnés avec précision et une grande amabilité"],
['Achim','21/07/2022',"Séjour très agréable ; j'aimerais revenir encore. Extérieur classique avec confort moderne ; personnel discret, à l'écoute"],
['David Bray','08/07/2022',"Charmant hôtel familial dans les Vosges françaises. Chambres très bien tenues, personnel sympathique et parlant anglais et pour nous une excellente étape sur notre voyage retour de Suisse."],
['Martina','16/08/2020',"Clean and central with a huge modern bathroom! Very nice reception. We enjoyed the breakfast and the whole stay."],
['Isa','09/12/2021',"Hôtel bien situé, proche du centre-ville de Saverne. Prestations de qualité. Restaurant excellent. Petit déjeuner copieux et varié dans un cadre typiquement alsacien. Parking payant proche de l'hôtel. Personnel aux petits soins. Chambre très calme. Une très bonne adresse."],
['Stéphanie N.','18/10/2020',"Hôtel propre, accueil très sympathique, petit déjeuner très bien, repas 3 plats excellent, service excellent. C'était une très bonne surprise. Je recommande !!"]
];

roseraie:{t:'Roseraie de Saverne',c:'Environ 8 500 rosiers, 550 variétés.',b:['À 4 minutes à pied de l’hôtel, la Roseraie fait de Saverne la « ville des roses ». Créée en 1898 au pied du col, elle s’étend sur 1,5 hectare : c’est la deuxième plus ancienne roseraie de France.','De réputation internationale, elle réunit environ 8 500 rosiers de 550 variétés : roses anciennes, roses parfumées, buissons, hybrides de thé, arbustives, couvre-sols et dernières nouveautés.'],i:['Route de Paris, 67700 Saverne','Adulte : 3 € · enfants : gratuit','Du 21 mai au 31 août : tous les jours de 10 h à 19 h','Du 1er au 27 septembre : tous les jours de 14 h à 18 h']},
hautbarr:{t:'Château du Haut-Barr',c:'D’en haut, une vue à couper le souffle.',b:['Surnommé « l’Œil de l’Alsace », le château du Haut-Barr se dresse sur trois rochers de grès rose, à 470 mètres d’altitude. Bâti au XIIe siècle par les évêques de Strasbourg, il est classé monument historique depuis 1874.','Montez sur le promontoire : panorama à 360° sur la plaine d’Alsace et les Vosges du Nord, et par beau temps la cathédrale de Strasbourg. Traversez le pont du Diable, au-dessus du vide, et visitez la chapelle romane. Balade facile, même avec des enfants.'],i:['Application gratuite « Sur la piste des trésors d’Alsace »','Plus d’informations : tourisme-saverne.fr']},
jardin:{t:'Jardin botanique du Col de Saverne',c:'Un vrai tour du monde des végétaux.',b:['À 4 minutes en voiture, ce jardin de 3 hectares a été créé en 1931 par Émile Walter, pharmacien botaniste savernois. Flores d’Europe, d’Afrique, d’Australie et d’Asie y côtoient la flore locale : alpinum, tourbières, fougeraie, rhododendrons, arboretum.','Sa fierté : l’une des plus importantes collections françaises d’orchidées rustiques. Comptez 1 h 30 à 2 h de visite.'],i:['Avril et septembre : samedis, dimanches et jours fériés, de 14 h à 18 h','De mai à août : tous les jours de 10 h à 18 h','Visite libre : 2,50 € · visite guidée : 3,50 €','jardin-botanique-saverne.eu']},
marmoutier:{t:'Abbatiale Saint-Étienne de Marmoutier',c:'L’une des plus belles abbatiales romanes d’Alsace.',b:['À 7 km, sur la Route romane d’Alsace, voici le plus ancien monastère d’Alsace, fondé vers 589. Sa façade de 1145, ses tours terminées en octogones et son narthex roman sont remarquables.','À l’intérieur : une nef lumineuse du XIIIe siècle, un chœur du XVIIIe, une crypte archéologique et l’orgue d’André Silbermann. Classée monument historique depuis 1840.'],i:['Plus d’informations auprès de l’Office de tourisme de Saverne']},
rohan:{t:'Château des Rohan',c:'Le « petit Versailles alsacien ».',b:['En plein centre, au bord du canal de la Marne au Rhin, le château des Rohan déploie côté parc une façade néoclassique de 140 mètres. Résidence des évêques de Strasbourg jusqu’à la Révolution, il a été restauré sous Napoléon III.','Il abrite aujourd’hui le musée de Saverne (section Louise Weiss, collection archéologique, fonds d’art et d’histoire), un espace culturel et un grand parc face au port de plaisance.'],i:['Programme des événements : Office de tourisme de Saverne']},
palette:{t:'Saverne, une riche palette touristique',c:'Alsacez-vous !',b:['Entre les forêts des Vosges et la plaine d’Alsace : des centaines de kilomètres de sentiers balisés par le Club vosgien, des pistes cyclables le long du canal et, au port de plaisance, des bateaux à louer pour naviguer.','Châteaux (Rohan, Haut-Barr, Greifenstein), églises de Neuwiller-lès-Saverne, musées de Saverne, Bouxwiller et Pfaffenhoffen, tour Chappe, plan incliné d’Arzviller, cristalleries et poteries. Le Royal Palace de Kirrwiller est à 10 minutes, la route des vins commence à Marlenheim, à 15 km.']},
histoire:{t:'Saverne, au fil de l’histoire',c:'La porte d’entrée de l’Alsace.',b:['Les Romains utilisaient déjà le col de Saverne comme lieu de passage. Au Moyen Âge, la ville relie la Lorraine au sud : forteresses et abbayes en témoignent, comme le Haut-Barr ou le Grand Geroldseck, l’un des plus anciens châteaux des Vosges du Nord.','Son surnom de « porte d’Alsace » n’a jamais été aussi vrai : RN4, autoroute A4 Strasbourg–Paris et arrêts du TGV. L’hôtel est à 300 mètres de la gare.']},
vosges:{t:'Parc naturel régional des Vosges du Nord',c:'Le paradis des randonneurs.',b:['Créé en 1976, le parc couvre aujourd’hui 130 500 hectares entre Wissembourg et Sarreguemines, avec vue sur Saverne. Hêtres, chênes et pins sylvestres, prairies et vergers.','Villages de colombages et de grès, châteaux perchés, sentiers ombragés au creux des vallées : une biodiversité généreuse à portée de chaussures de marche.']}
},

conseil:{nom:'Jean Conseil',sous:'Je vous aide à choisir',va:'Assistant virtuel de l’Hôtel Chez Jean',bulle:'Bonjour ! Je suis Jean Conseil, l’assistant virtuel de la maison. Une chambre pour deux, un dîner à la winstub, un garage pour vos vélos ? Demandez-moi.',accueil:'Bonjour, je suis Jean Conseil, assistant virtuel de l’Hôtel Chez Jean. Je connais les chambres, la winstub, les services et Saverne. Que puis-je faire pour vous ?',placeholder:'Posez votre question…',envoyer:'Envoyer',puces:['Quelle chambre pour nous ?','Horaires du restaurant','Garage à vélos','Venir en train','Chiens acceptés ?','Le spa'],

r:{prix:'Nos chambres vont de 82 € (Classique, 1 personne) à 190 € (Suite, 5 personnes). Le petit-déjeuner buffet est à 11,50 €. Le meilleur tarif est garanti en réservant sur ce site.',resto:'La winstub S’Rosestiebel est ouverte du mardi au samedi, de 12 h à 14 h et de 19 h à 21 h. Fermée dimanche et lundi, et deux semaines entre Noël et le Nouvel An. Le midi en semaine, menu du jour à 18 €.',carte:'À la carte : choucroute garnie (20 €), choucroute aux deux poissons (23 €), saumon fumé de notre fumoir (19 €), pièce de bœuf Simmental maturée dans notre cave (26 €)… Voulez-vous la carte complète ?',velo:'Oui : un garage fermé et gratuit accueille vos vélos et vos motos, avec prise électrique pour recharger. Les cyclistes du canal de la Marne au Rhin l’adorent.',chien:'Les chiens sont les bienvenus, à l’hôtel comme au restaurant : 6 € par chien et par jour.',parking:'Le stationnement devant l’hôtel est payant en semaine (9 h–19 h) et le samedi (9 h–18 h), gratuit le dimanche et les jours fériés. Places gratuites aux parkings des Remparts, de la Roseraie et des Dragons. Box fermé possible à 10 € par jour, selon disponibilité.',train:'La gare de Saverne, desservie par le TGV, est à 300 m : deux minutes à pied. Strasbourg est à 40 km.',voiture:'Nous sommes à 5 km de l’A4 Paris–Strasbourg, au 3, rue de la Gare, en plein centre de Saverne.',pdj:'Buffet copieux à 11,50 € (6 € jusqu’à 10 ans) : fruits, charcuteries, œufs coque, fromages, viennoiseries… Servi de 7 h 15 à 9 h 30 en semaine, de 8 h à 9 h 30 le week-end. Pain sans gluten sur demande.',spa:'L’hôtel a un espace spa : bain à remous sous ciel étoilé, espace détente et massages. Pour les horaires et les soins, la réception vous renseigne au +33 (0)3 88 91 10 19.',demi:'La demi-pension ajoute 38 € par personne et par nuit : dîner trois plats et petit-déjeuner buffet (15 € de plus pour un menu gastronomique).',etape:'La soirée étape, c’est à partir de 110 € pour une personne : nuit en chambre Classique, petit-déjeuner et dîner, du mardi au vendredi, sur réservation par téléphone.',wifi:'Le wifi est gratuit dans toutes les chambres.',clim:'La climatisation équipe les chambres Prestige, Grand Prestige et la Suite.',famille:'Pour une famille, la Chambre Triple (1 à 3 personnes, 128 €) ou la Suite en duplex (jusqu’à 5 personnes, deux salles de bains, dès 130 €).',groupe:'Pour un groupe, nous avons 40 chambres et deux salles de restaurant. Écrivez-nous ou appelez le +33 (0)3 88 91 10 19 : nous préparons une proposition.',noel:'En décembre, la maison se pare de décorations de Noël et le marché de Noël de Saverne est tout proche. Attention : le restaurant ferme deux semaines entre Noël et le Nouvel An, l’hôtel reste ouvert.',visite:'À faire autour : la Roseraie (4 min à pied), le château des Rohan, le Haut-Barr et sa vue, le jardin botanique, l’abbatiale de Marmoutier (7 km), la route des vins (15 km).',contact:'Vous pouvez nous joindre au +33 (0)3 88 91 10 19 ou à chez.jean@wanadoo.fr. Adresse : 3, rue de la Gare, 67700 Saverne.',ascenseur:'Deux ascenseurs desservent tous les étages.',inconnu:'Je préfère ne pas vous répondre au hasard : je n’ai pas cette information. L’équipe vous répond volontiers au +33 (0)3 88 91 10 19 ou à chez.jean@wanadoo.fr.',merci:'Avec plaisir ! Bon séjour à Saverne.',bonjour:'Bonjour ! Dites-moi ce que vous cherchez : une chambre, une table, un renseignement pratique ?'}},

maison:{h:'A family house, Alsatian style',p1:'Here every room has its own touch: wood panelling, regional paintings, a piece of antique furniture. Nothing standard, and that is on purpose.',p2:'Christelle and Fabrice Veit-Harter run the house with their team. In the morning, breakfast is served by the fireplace; in the evening, the winstub serves the great Alsatian classics.',atouts:['40 rooms','2 lifts','Lounge, and a terrace in summer','Free wifi','Bike and motorbike garage','Dogs welcome'],cta:'Discover the hotel',sign:'Christelle & Fabrice Veit-Harter'},

winstub:{h:'The winstub people come back to for the choucroute',p:'Two dining rooms in pure Alsatian style: the “Jean” room, where breakfast is served, and the “S’Rosestiebel” winstub, the little room of roses, for lunch and dinner. The menu follows the seasons, between Alsatian tradition and French classics, with a fine list of wines from Alsace and beyond.',plats:[['Fresh salmon smoked in our own smokehouse, buttered toast','€19'],['Choucroute with two kinds of fish','€23'],['Simmental beef, aged in our own cellar','€26'],['Iced kougelhopf, rum and raisin','€8']],horaires:'Tuesday to Saturday, 12 pm–2 pm and 7 pm–9 pm. Closed Sunday and Monday.',menuJour:'Lunch menu of the day at €18 on weekdays',cta:'Read the full menu',table:'Book a table'},

hotel:{h:'A family hotel in the heart of Alsace',lead:'Contemporary style and Alsatian spirit under one roof, 5 km from the A4 motorway.',p1:'In Saverne, Hotel Chez Jean offers 40 charming rooms. Christelle and Fabrice Veit-Harter and their team look after your comfort and every request.',p2:'Peace and comfort for a stay as a couple, with family or with friends.',h2:'Rooms with careful decor',p3:'Our rooms breathe Alsace: each has its own decorative touch, made of those little details that make a stay pleasant. Spacious and bright, with wood panelling and regional paintings, they offer every modern comfort: radio, TV, safe, free wifi, bathroom or shower, WC, hairdryer, minibar and, in some, air conditioning.',h3:'For your comfort',atouts:['Two lifts serve every floor','A lounge, and our terrace in summer','A winstub and two dining rooms','A spa and relaxation area','A free, closed garage for bikes and motorbikes'],label:'Logis Hotels · Hotel Cosy · Restaurant Gourmand'},

andy oysters, no. 3'],rosbeef:['Roast beef','spätzle or chips'],cordon:['Chicken cordon bleu with Munster cheese','cream sauce, chips, vegetables'],foiegras:['Duck foie gras'],rossini:['Beef fillet Rossini'],veauGirolles:['Veal fillet with chanterelles'],ris:['Veal sweetbreads, cream and morel sauce','depending on supply'],sandre:['Grilled pike-perch fillet','steamed potatoes and vegetables'],civet:['Venison (doe) stew','spätzle']},parfums:'Ice creams: vanilla, chocolate, coffee, coconut, pistachio. Sorbets: lemon, raspberry, strawberry, pear, pineapple, passion fruit.',supp:'Any extra side (sautéed potatoes, chips or green salad): €3.50. All our meat comes from France and Germany. Net prices.',sallesP:'The “Jean” room hosts the breakfast buffet; the “S’Rosestiebel” winstub welcomes you for lunch and dinner. Each has its own style, always in pure Alsatian spirit. In both, the same care for quality, choice and reliability, whether you come alone, as a couple, with family or as a group. The menu changes with the seasons, alongside a rich list of wines from Alsace and beyond.',jour:{prix:[['Menu of the day (starter, main, dessert)','€18'],['Menu of the day without dessert','€16'],['Menu of the day without starter','€16'],['Dish of the day, eat in or take away','€13']],quand:'Every lunchtime except Saturday, Sunday and Monday.',semaine:'This week',plats:[['Tuesday 17 November','Turkey escalope with Munster sauce, homemade spätzle'],['Wednesday 18 November','Breaded pork loin, carrots and chips'],['Thursday 19 November','Pork shoulder “à la diable”, sautéed potatoes'],['Friday 20 November','Fish from the market'],['Saturday','À la carte']]},enfant:{prix:'€11.50',plat:'Knack sausages, chips or noodles',dessert:'Ice cream with whipped cream',pour:'For children under 10'}},

services:{h:'Hotel services',lead:'The little extras that make a stay.',list:[['velo','Bike and motorbike garage','A free, closed garage for bicycles and motorbikes, with a power socket.'],['box','Lock-up garage','€10 per day. Subject to availability, we rent closed garages for your car. Please ask in advance.'],['chien','Pets','€6 per dog per day. Dogs are welcome, in the hotel and in the restaurant.'],['parking','Parking','Paid parking in front of the hotel Monday to Friday 9 am–7 pm and Saturday 9 am–6 pm; free on Sundays and public holidays. A reduced-rate pass is available (ask at reception). A few free spaces nearby: Remparts, Roseraie and Dragons car parks. Spaces cannot be reserved.'],['wifi','Free wifi','In every room.'],['groupe','Groups','Two dining rooms and 40 rooms: tell us about your group.'],['ascenseur','Lifts','Two lifts serve every floor.']]},
alsacePage:{h:'Discover Saverne and Alsace',lead:'The ideal base for exploring Saverne, its surroundings and all the treasures of Alsace.',lire:'Read',infos:'Practical information'},
visites:{
roseraie:{t:'Saverne Rose Garden',c:'About 8,500 rose bushes, 550 varieties.',b:['A 4-minute walk from the hotel, the Rose Garden makes Saverne the “town of roses”. Created in 1898 at the foot of the pass, it covers 1.5 hectares: the second oldest rose garden in France.','Internationally renowned, it gathers about 8,500 rose bushes of 550 varieties: old roses, fragrant roses, shrubs, hybrid teas, ground cover and the latest new varieties.'],i:['Route de Paris, 67700 Saverne','Adults: €3 · children: free','21 May to 31 August: daily, 10 am–7 pm','1 to 27 September: daily, 2 pm–6 pm']},
hautbarr:{t:'Haut-Barr Castle',c:'From the top, a breathtaking view.',b:['Nicknamed “the Eye of Alsace”, Haut-Barr Castle stands on three pink sandstone rocks, 470 metres up. Built in the 12th century by the bishops of Strasbourg, it has been a listed historic monument since 1874.','Climb the promontory: a 360° panorama over the Alsace plain and the Northern Vosges, and on a clear day Strasbourg Cathedral. Cross the Devil’s Bridge above the void and visit the Romanesque chapel. An easy walk, even with children.'],i:['Free app “Sur la piste des trésors d’Alsace”','More information: tourisme-saverne.fr']},
jardin:{t:'Col de Saverne Botanical Garden',c:'A true world tour of plants.',b:['4 minutes away by car, this 3-hectare garden was created in 1931 by Émile Walter, a pharmacist and botanist from Saverne. Plants from Europe, Africa, Australia and Asia grow alongside local flora: alpine garden, peat bogs, fernery, rhododendrons, arboretum.','Its pride: one of the largest French collections of hardy orchids. Allow 1.5 to 2 hours for your visit.'],i:['April and September: Saturdays, Sundays and public holidays, 2 pm–6 pm','May to August: daily, 10 am–6 pm','Self-guided visit: €2.50 · guided tour: €3.50','jardin-botanique-saverne.eu']},
marmoutier:{t:'Saint-Étienne Abbey Church, Marmoutier',c:'One of the finest Romanesque abbey churches in Alsace.',b:['7 km away on the Romanesque Road of Alsace stands the oldest monastery in Alsace, founded around 589. Its façade from 1145, its towers ending in octagons and its Romanesque narthex are remarkable.','Inside: a bright 13th-century nave, an 18th-century choir, an archaeological crypt and the André Silbermann organ. Listed as a historic monument since 1840.'],i:['More information from the Saverne Tourist Office']},
rohan:{t:'Rohan Palace',c:'The “little Versailles of Alsace”.',b:['In the town centre, on the Marne–Rhine canal, Rohan Palace unfolds a 140-metre neoclassical façade on the park side. Home to the bishops of Strasbourg until the Revolution, it was restored under Napoleon III.','Today it houses the Saverne Museum (Louise Weiss section, archaeological collection, art and history holdings), a cultural venue and a large park facing the marina.'],i:['Events programme: Saverne Tourist Office']},
palette:{t:'Saverne, so much to see',c:'Treat yourself to Alsace!',b:['Between the Vosges forests and the Alsace plain: hundreds of kilometres of trails marked by the Club Vosgien, cycle paths along the canal and, at the marina, boats to hire for a cruise.','Castles (Rohan, Haut-Barr, Greifenstein), the churches of Neuwiller-lès-Saverne, museums in Saverne, Bouxwiller and Pfaffenhoffen, the Chappe tower, the Arzviller boat lift, crystal works and potteries. The Royal Palace in Kirrwiller is 10 minutes away, and the Wine Route starts in Marlenheim, 15 km away.']},
histoire:{t:'Saverne through history',c:'The gateway to Alsace.',b:['The Romans already used the Saverne pass as a crossing point. In the Middle Ages the town linked Lorraine to the south: fortresses and abbeys bear witness to it, such as Haut-Barr or Grand Geroldseck, one of the oldest castles of the Northern Vosges.','Its nickname “gateway to Alsace” has never been truer: the RN4, the A4 Strasbourg–Paris motorway and TGV stops. The hotel is 300 metres from the station.']},
vosges:{t:'Northern Vosges Regional Nature Park',c:'A paradise for hikers.',b:['Created in 1976, the park now covers 130,500 hectares between Wissembourg and Sarreguemines, overlooking Saverne. Beech, oak and Scots pine, meadows and orchards.','Half-timbered and sandstone villages, hilltop castles, shady paths in the valleys: generous biodiversity within reach of your walking boots.']}

r:{prix:'Our rooms range from €82 (Classic, 1 guest) to €190 (Suite, 5 guests). The breakfast buffet is €11.50. The best rate is guaranteed when you book on this website.',resto:'The S’Rosestiebel winstub is open Tuesday to Saturday, 12 pm–2 pm and 7 pm–9 pm. Closed Sunday and Monday, and for two weeks between Christmas and New Year. Weekday lunch menu at €18.',carte:'On the menu: choucroute garnie (€20), choucroute with two fish (€23), salmon from our own smokehouse (€19), Simmental beef aged in our cellar (€26)… Would you like the full menu?',velo:'Yes: a free, closed garage takes your bikes and motorbikes, with a power socket for charging. Cyclists on the Marne–Rhine canal love it.',chien:'Dogs are welcome, in the hotel and in the restaurant: €6 per dog per day.',parking:'Parking in front of the hotel is paid on weekdays (9 am–7 pm) and Saturdays (9 am–6 pm), free on Sundays and public holidays. Free spaces at the Remparts, Roseraie and Dragons car parks. A closed garage is available at €10 per day, subject to availability.',train:'Saverne station, served by the TGV, is 300 m away: a two-minute walk. Strasbourg is 40 km away.',voiture:'We are 5 km from the A4 Paris–Strasbourg motorway, at 3, rue de la Gare, right in the centre of Saverne.',pdj:'A generous buffet at €11.50 (€6 up to age 10): fruit, cold meats, soft-boiled eggs, cheese, pastries… Served 7.15–9.30 am on weekdays, 8–9.30 am at weekends. Gluten-free bread on request.',spa:'The hotel has a spa area: hot tub under a starry ceiling, relaxation area and massages. For opening times and treatments, reception will help on +33 (0)3 88 91 10 19.',demi:'Half board adds €38 per person per night: three-course dinner and breakfast buffet (€15 extra for a gourmet menu).',etape:'The business stopover starts at €110 for one person: a night in a Classic room, breakfast and dinner, Tuesday to Friday, booked by phone.',wifi:'Wifi is free in every room.',clim:'Air conditioning is available in the Prestige and Grand Prestige rooms and in the Suite.',famille:'For a family: the Triple Room (1 to 3 guests, €128) or the duplex Suite (up to 5 guests, two bathrooms, from €130).',groupe:'For a group we have 40 rooms and two dining rooms. Write to us or call +33 (0)3 88 91 10 19: we will prepare a proposal.',noel:'In December the house wears its Christmas decorations and the Saverne Christmas market is close by. Please note: the restaurant closes for two weeks between Christmas and New Year; the hotel stays open.',visite:'Nearby: the Rose Garden (4 min walk), Rohan Palace, Haut-Barr and its view, the botanical garden, Marmoutier Abbey (7 km), the Wine Route (15 km).',contact:'You can reach us on +33 (0)3 88 91 10 19 or at chez.jean@wanadoo.fr. Address: 3, rue de la Gare, 67700 Saverne.',ascenseur:'Two lifts serve every floor.',inconnu:'I’d rather not guess: I don’t have that information. The team will gladly answer on +33 (0)3 88 91 10 19 or at chez.jean@wanadoo.fr.',merci:'My pleasure! Enjoy your stay in Saverne.',bonjour:'Hello! Tell me what you are looking for: a room, a table, some practical information?'}},

winstub:{h:'Die Winstub, in die man für das Sauerkraut zurückkommt',p:'Zwei Stuben im echten elsässischen Stil: der Saal „Jean“, in dem das Frühstück serviert wird, und die Winstub „S’Rosestiebel“, das kleine Rosenstübchen, für Mittag- und Abendessen. Die Karte folgt den Jahreszeiten, zwischen elsässischer Tradition und französischen Klassikern, mit einer schönen Auswahl an Weinen aus dem Elsass und anderswo.',plats:[['Frischer Lachs aus unserer eigenen Räucherei, Buttertoast','19 €'],['Sauerkraut mit zweierlei Fisch','23 €'],['Simmentaler Rind, in unserem Keller gereift','26 €'],['Eisgugelhupf Rum-Rosine','8 €']],horaires:'Dienstag bis Samstag, 12–14 Uhr und 19–21 Uhr. Sonntag und Montag Ruhetag.',menuJour:'Tagesmenü zu 18 € mittags unter der Woche',cta:'Die ganze Karte lesen',table:'Tisch reservieren'},

hotel:{h:'Ein Familienhotel im Herzen des Elsass',lead:'Moderner Stil und elsässisches Flair unter einem Dach, 5 km von der Autobahn A4.',p1:'In Saverne bietet Ihnen das Hotel Chez Jean 40 charmante Zimmer. Christelle und Fabrice Veit-Harter und ihr Team sorgen für Ihren Komfort und erfüllen gern Ihre Wünsche.',p2:'Ruhe und Komfort für einen Aufenthalt zu zweit, mit der Familie oder mit Freunden.',h2:'Liebevoll eingerichtete Zimmer',p3:'Unsere Zimmer atmen Elsass: Jedes hat seine eigene Note, gemacht aus den kleinen Details, die einen Aufenthalt angenehm machen. Geräumig und hell, mit Holzvertäfelung und regionaler Malerei, bieten sie allen modernen Komfort: Radio, TV, Safe, kostenloses WLAN, Bad oder Dusche, WC, Haartrockner, Minibar und teilweise Klimaanlage.',h3:'Für Ihren Komfort',atouts:['Zwei Aufzüge zu allen Etagen','Ein Salon und im Sommer unsere Terrasse','Eine Winstub und zwei Restaurantstuben','Ein Spa- und Ruhebereich','Eine kostenlose, abgeschlossene Garage für Fahrräder und Motorräder'],label:'Logis Hotels · Hôtel Cosy · Restaurant Gourmand'},

 Austern Nr. 3 aus der Normandie'],huitres12:['12 Austern Nr. 3 aus der Normandie'],rosbeef:['Roastbeef','Spätzle oder Pommes frites'],cordon:['Cordon bleu vom Geflügel mit Munsterkäse','Rahmsauce, Pommes frites, Gemüse'],foiegras:['Entenstopfleber'],rossini:['Rinderfilet Rossini'],veauGirolles:['Kalbsfilet mit Pfifferlingen'],ris:['Kalbsbries in Rahmsauce mit Morcheln','je nach Angebot'],sandre:['Gegrilltes Zanderfilet','Salzkartoffeln und Gemüse'],civet:['Hirschkuhragout','Spätzle']},parfums:'Eis: Vanille, Schokolade, Kaffee, Kokos, Pistazie. Sorbets: Zitrone, Himbeere, Erdbeere, Birne, Ananas, Maracuja.',supp:'Jede Extrabeilage (Bratkartoffeln, Pommes frites oder grüner Salat): 3,50 €. Unser Fleisch stammt aus Frankreich und Deutschland. Nettopreise.',sallesP:'Im Saal „Jean“ steht das Frühstücksbuffet; die Winstub „S’Rosestiebel“ empfängt Sie mittags und abends. Jede Stube hat ihren eigenen Stil, immer im echten elsässischen Geist. In beiden derselbe Anspruch an Qualität, Auswahl und Zuverlässigkeit, ob Sie allein, zu zweit, mit der Familie oder als Gruppe kommen. Die Karte wechselt mit den Jahreszeiten und wird von einer reichen Auswahl an Weinen aus dem Elsass und anderswo begleitet.',jour:{prix:[['Tagesmenü (Vorspeise, Hauptgang, Dessert)','18 €'],['Tagesmenü ohne Dessert','16 €'],['Tagesmenü ohne Vorspeise','16 €'],['Tagesgericht, vor Ort oder zum Mitnehmen','13 €']],quand:'Jeden Mittag außer Samstag, Sonntag und Montag.',semaine:'Diese Woche',plats:[['Dienstag, 17. November','Putenschnitzel mit Munstersauce, hausgemachte Spätzle'],['Mittwoch, 18. November','Panierter Schweinekamm, Karotten und Pommes frites'],['Donnerstag, 19. November','Schweineschulter „à la diable“, Bratkartoffeln'],['Freitag, 20. November','Fisch vom Markt'],['Samstag','À la carte']]},enfant:{prix:'11,50 €',plat:'Knacks (Wiener Würstchen), Pommes frites oder Nudeln',dessert:'Eis mit Sahne',pour:'Für Kinder unter 10 Jahren'}},
spaPage:{h:'Spa & Wellness',lead:'Whirlpool, Sternenhimmel, Ruhebereich und Massagen, in aller Ruhe, mitten im Hotel.',p:'Unsere Gäste loben einen Bereich, der „unglaublich gut und modern“ ist. Zu Öffnungszeiten, Anwendungen und Preisen informiert Sie die Rezeption und organisiert alles für Sie.',ajout:'Vorgeschlagene Ergänzung: eine eigene Spa-Seite mit Öffnungszeiten, Anwendungen und Online-Reservierung, mit Ihren Angaben zu vervollständigen.'},
services:{h:'Der Service des Hotels',lead:'Die kleinen Extras, die einen Aufenthalt besonders machen.',list:[['velo','Garage für Fahrräder und Motorräder','Eine kostenlose, abgeschlossene Garage für Fahrräder und Motorräder, mit Steckdose.'],['box','Garagenbox','10 € pro Tag. Je nach Verfügbarkeit vermieten wir abgeschlossene Boxen für Ihr Auto. Bitte vorab anfragen.'],['chien','Haustiere','6 € pro Hund und Tag. Hunde sind willkommen, im Hotel wie im Restaurant.'],['parking','Parken','Gebührenpflichtig vor dem Hotel Montag bis Freitag 9–19 Uhr und Samstag 9–18 Uhr; sonntags und feiertags kostenlos. Ermäßigte Pauschale möglich (Auskunft an der Rezeption). Einige kostenlose Plätze in der Nähe: Parkplätze Remparts, Roseraie und Dragons. Plätze können nicht reserviert werden.'],['wifi','Kostenloses WLAN','In allen Zimmern.'],['groupe','Gruppen','Zwei Restaurantstuben und 40 Zimmer: Erzählen Sie uns von Ihrer Gruppe.'],['ascenseur','Aufzüge','Zwei Aufzüge führen zu allen Etagen.']]},
alsacePage:{h:'Saverne und das Elsass entdecken',lead:'Der ideale Ausgangspunkt, um Saverne, seine Umgebung und alle Schätze des Elsass zu entdecken.',lire:'Lesen',infos:'Praktische Infos'},
visites:{
roseraie:{t:'Rosengarten Saverne',c:'Rund 8.500 Rosenstöcke, 550 Sorten.',b:['Vier Gehminuten vom Hotel macht der Rosengarten Saverne zur „Stadt der Rosen“. 1898 am Fuß des Passes angelegt, umfasst er 1,5 Hektar: der zweitälteste Rosengarten Frankreichs.','International bekannt, vereint er rund 8.500 Rosenstöcke in 550 Sorten: alte Rosen, Duftrosen, Strauchrosen, Teehybriden, Bodendecker und die neuesten Züchtungen.'],i:['Route de Paris, 67700 Saverne','Erwachsene: 3 € · Kinder: frei','21. Mai bis 31. August: täglich 10–19 Uhr','1. bis 27. September: täglich 14–18 Uhr']},
hautbarr:{t:'Burg Hohbarr (Haut-Barr)',c:'Von oben ein atemberaubender Blick.',b:['Das „Auge des Elsass“ thront auf drei rosa Sandsteinfelsen in 470 Metern Höhe. Im 12. Jahrhundert von den Bischöfen von Straßburg erbaut, steht die Burg seit 1874 unter Denkmalschutz.','Steigen Sie auf den Felsvorsprung: Rundblick über die Rheinebene und die Nordvogesen, bei klarem Wetter bis zum Straßburger Münster. Überqueren Sie die Teufelsbrücke über dem Abgrund und besuchen Sie die romanische Kapelle. Ein leichter Ausflug, auch mit Kindern.'],i:['Kostenlose App „Sur la piste des trésors d’Alsace“','Mehr Infos: tourisme-saverne.fr']},
jardin:{t:'Botanischer Garten am Col de Saverne',c:'Eine echte Weltreise durch die Pflanzenwelt.',b:['Vier Autominuten entfernt wurde dieser 3 Hektar große Garten 1931 von Émile Walter, Apotheker und Botaniker aus Saverne, angelegt. Pflanzen aus Europa, Afrika, Australien und Asien wachsen neben der heimischen Flora: Alpinum, Moore, Farngarten, Rhododendren, Arboretum.','Sein Stolz: eine der größten französischen Sammlungen winterharter Orchideen. Planen Sie 1,5 bis 2 Stunden ein.'],i:['April und September: samstags, sonntags und feiertags 14–18 Uhr','Mai bis August: täglich 10–18 Uhr','Freier Besuch: 2,50 € · Führung: 3,50 €','jardin-botanique-saverne.eu']},
marmoutier:{t:'Abteikirche Saint-Étienne in Marmoutier',c:'Eine der schönsten romanischen Abteikirchen des Elsass.',b:['7 km entfernt, an der Romanischen Straße, steht das älteste Kloster des Elsass, um 589 gegründet. Bemerkenswert sind die Fassade von 1145, die achteckig endenden Türme und die romanische Vorhalle.','Innen: ein helles Langhaus aus dem 13. Jahrhundert, ein Chor aus dem 18., eine archäologische Krypta und die Orgel von André Silbermann. Seit 1840 Baudenkmal.'],i:['Mehr Infos beim Tourismusbüro Saverne']},
rohan:{t:'Rohan-Schloss',c:'Das „kleine Versailles des Elsass“.',b:['Mitten in der Stadt, am Rhein-Marne-Kanal, zeigt das Rohan-Schloss zur Parkseite eine 140 Meter lange klassizistische Fassade. Bis zur Revolution Residenz der Straßburger Bischöfe, wurde es unter Napoleon III. restauriert.','Heute beherbergt es das Museum von Saverne (Abteilung Louise Weiss, archäologische Sammlung, Kunst- und Geschichtsbestände), einen Kulturraum und einen großen Park gegenüber dem Jachthafen.'],i:['Veranstaltungen: Tourismusbüro Saverne']},
palette:{t:'Saverne, reich an Ausflugszielen',c:'Gönnen Sie sich das Elsass!',b:['Zwischen den Wäldern der Vogesen und der Rheinebene: Hunderte Kilometer vom Club Vosgien markierte Wanderwege, Radwege entlang des Kanals und im Jachthafen Boote zum Mieten.','Burgen (Rohan, Hohbarr, Greifenstein), die Kirchen von Neuwiller-lès-Saverne, Museen in Saverne, Bouxwiller und Pfaffenhoffen, der Chappe-Turm, das Schiffshebewerk Arzviller, Kristallglashütten und Töpfereien. Der Royal Palace in Kirrwiller ist 10 Minuten entfernt, die Weinstraße beginnt in Marlenheim, 15 km entfernt.']},
histoire:{t:'Saverne im Lauf der Geschichte',c:'Das Eingangstor zum Elsass.',b:['Schon die Römer nutzten den Pass von Saverne als Durchgang. Im Mittelalter verband die Stadt Lothringen mit dem Süden: Davon zeugen Burgen und Abteien wie Hohbarr oder Groß-Geroldseck, eine der ältesten Burgen der Nordvogesen.','Der Beiname „Tor zum Elsass“ war nie zutreffender: RN4, Autobahn A4 Straßburg–Paris und TGV-Halt. Das Hotel liegt 300 Meter vom Bahnhof.']},
vosges:{t:'Regionaler Naturpark Nordvogesen',c:'Ein Paradies für Wanderer.',b:['1976 gegründet, umfasst der Park heute 130.500 Hektar zwischen Wissembourg und Sarreguemines, mit Blick auf Saverne. Buchen, Eichen und Waldkiefern, Wiesen und Streuobstwiesen.','Fachwerk- und Sandsteindörfer, Burgen auf den Höhen, schattige Wege in den Tälern: reiche Natur in Reichweite Ihrer Wanderschuhe.']}
},

r:{prix:'Unsere Zimmer kosten von 82 € (Classique, 1 Person) bis 190 € (Suite, 5 Personen). Das Frühstücksbuffet kostet 11,50 €. Der beste Preis ist bei Buchung auf dieser Website garantiert.',resto:'Die Winstub S’Rosestiebel ist dienstags bis samstags von 12–14 Uhr und 19–21 Uhr geöffnet. Sonntag und Montag geschlossen, ebenso zwei Wochen zwischen Weihnachten und Neujahr. Mittags unter der Woche Tagesmenü zu 18 €.',carte:'Auf der Karte: Sauerkraut mit Fleisch (20 €), Sauerkraut mit zweierlei Fisch (23 €), Lachs aus unserer Räucherei (19 €), Simmentaler Rind aus unserem Reifekeller (26 €)… Möchten Sie die ganze Karte sehen?',velo:'Ja: Eine kostenlose, abgeschlossene Garage nimmt Ihre Fahrräder und Motorräder auf, mit Steckdose zum Laden. Radler auf dem Rhein-Marne-Kanal lieben sie.',chien:'Hunde sind willkommen, im Hotel wie im Restaurant: 6 € pro Hund und Tag.',parking:'Vor dem Hotel ist das Parken werktags (9–19 Uhr) und samstags (9–18 Uhr) gebührenpflichtig, sonntags und feiertags kostenlos. Kostenlose Plätze auf den Parkplätzen Remparts, Roseraie und Dragons. Garagenbox für 10 € pro Tag, je nach Verfügbarkeit.',train:'Der Bahnhof Saverne mit TGV-Halt liegt 300 m entfernt: zwei Minuten zu Fuß. Straßburg ist 40 km entfernt.',voiture:'Wir liegen 5 km von der A4 Paris–Straßburg, 3, rue de la Gare, mitten in Saverne.',pdj:'Reichhaltiges Buffet für 11,50 € (6 € bis 10 Jahre): Obst, Wurstwaren, weiche Eier, Käse, Gebäck… Werktags 7.15–9.30 Uhr, am Wochenende 8–9.30 Uhr. Glutenfreies Brot auf Anfrage.',spa:'Das Hotel hat einen Spa-Bereich: Whirlpool unter Sternenhimmel, Ruhebereich und Massagen. Zu Zeiten und Anwendungen hilft Ihnen die Rezeption unter +33 (0)3 88 91 10 19.',demi:'Die Halbpension kostet 38 € pro Person und Nacht zusätzlich: Drei-Gänge-Abendessen und Frühstücksbuffet (15 € Aufpreis für ein Gourmetmenü).',etape:'Die Geschäftsübernachtung gibt es ab 110 € für eine Person: Nacht im Zimmer Classique, Frühstück und Abendessen, dienstags bis freitags, telefonisch zu reservieren.',wifi:'Das WLAN ist in allen Zimmern kostenlos.',clim:'Klimatisiert sind die Zimmer Prestige und Grand Prestige sowie die Suite.',famille:'Für Familien: das Dreibettzimmer (1 bis 3 Personen, 128 €) oder die Maisonette-Suite (bis 5 Personen, zwei Bäder, ab 130 €).',groupe:'Für Gruppen haben wir 40 Zimmer und zwei Restaurantstuben. Schreiben Sie uns oder rufen Sie an: +33 (0)3 88 91 10 19. Wir erstellen Ihnen ein Angebot.',noel:'Im Dezember schmückt sich das Haus weihnachtlich, und der Weihnachtsmarkt von Saverne ist ganz nah. Bitte beachten: Das Restaurant schließt zwei Wochen zwischen Weihnachten und Neujahr, das Hotel bleibt geöffnet.',visite:'In der Nähe: Rosengarten (4 Min. zu Fuß), Rohan-Schloss, Burg Hohbarr mit Aussicht, botanischer Garten, Abteikirche Marmoutier (7 km), Weinstraße (15 km).',contact:'Sie erreichen uns unter +33 (0)3 88 91 10 19 oder chez.jean@wanadoo.fr. Adresse: 3, rue de la Gare, 67700 Saverne.',ascenseur:'Zwei Aufzüge führen zu allen Etagen.',inconnu:'Ich rate lieber nicht: Diese Information habe ich nicht. Das Team antwortet Ihnen gern unter +33 (0)3 88 91 10 19 oder chez.jean@wanadoo.fr.',merci:'Gern geschehen! Einen schönen Aufenthalt in Saverne.',bonjour:'Guten Tag! Sagen Sie mir, was Sie suchen: ein Zimmer, einen Tisch, eine praktische Auskunft?'}},

hotel:{h:'Un hotel familiar en el corazón de Alsacia',lead:'Estilo contemporáneo y espíritu alsaciano bajo el mismo techo, a 5 km de la autopista A4.',p1:'En Saverne, el Hotel Chez Jean le ofrece 40 habitaciones con encanto. Christelle y Fabrice Veit-Harter y su equipo cuidan de su comodidad y atienden todas sus peticiones.',p2:'Calma y confort para una estancia en pareja, en familia o con amigos.',h2:'Habitaciones decoradas con mimo',p3:'Nuestras habitaciones respiran Alsacia: cada una tiene su toque, hecho de esos pequeños detalles que hacen agradable una estancia. Amplias y luminosas, con maderas y pinturas regionales, ofrecen todo el confort moderno: radio, TV, caja fuerte, wifi gratis, baño o ducha, WC, secador, minibar y, algunas, aire acondicionado.',h3:'Para su comodidad',atouts:['Dos ascensores a todas las plantas','Un salón y, en verano, nuestra terraza','Una winstub y dos salas de restaurante','Un espacio de spa y relax','Un garaje cerrado y gratuito para bicis y motos'],label:'Logis Hotels · Hôtel Cosy · Restaurant Gourmand'},

services:{h:'Servicios del hotel',lead:'Los pequeños detalles que cambian una estancia.',list:[['velo','Garaje para bicis y motos','Un garaje cerrado y gratuito para bicicletas y motos, con toma eléctrica.'],['box','Box para coche','10 € al día. Según disponibilidad, alquilamos boxes cerrados para su coche. Consúltenos antes.'],['chien','Animales','6 € por perro y día. Los perros son bienvenidos, en el hotel y en el restaurante.'],['parking','Aparcamiento','De pago delante del hotel de lunes a viernes de 9:00 a 19:00 y el sábado de 9:00 a 18:00; gratis domingos y festivos. Abono a precio reducido posible (pregunte en recepción). Algunas plazas gratuitas cerca: aparcamientos des Remparts, de la Roseraie y des Dragons. Las plazas no se pueden reservar.'],['wifi','Wifi gratis','En todas las habitaciones.'],['groupe','Grupos','Dos salas de restaurante y 40 habitaciones: háblenos de su grupo.'],['ascenseur','Ascensores','Dos ascensores llegan a todas las plantas.']]},

roseraie:{t:'Rosaleda de Saverne',c:'Unos 8.500 rosales, 550 variedades.',b:['A 4 minutos a pie del hotel, la Rosaleda convierte a Saverne en la «ciudad de las rosas». Creada en 1898 al pie del puerto, ocupa 1,5 hectáreas: es la segunda rosaleda más antigua de Francia.','De fama internacional, reúne unos 8.500 rosales de 550 variedades: rosas antiguas, perfumadas, arbustivas, híbridos de té, tapizantes y las últimas novedades.'],i:['Route de Paris, 67700 Saverne','Adultos: 3 € · niños: gratis','Del 21 de mayo al 31 de agosto: todos los días de 10:00 a 19:00','Del 1 al 27 de septiembre: todos los días de 14:00 a 18:00']},
hautbarr:{t:'Castillo del Haut-Barr',c:'Desde arriba, una vista impresionante.',b:['Apodado «el Ojo de Alsacia», el castillo del Haut-Barr se alza sobre tres rocas de arenisca rosa, a 470 metros de altitud. Construido en el siglo XII por los obispos de Estrasburgo, es monumento histórico desde 1874.','Suba al promontorio: panorama de 360° sobre la llanura de Alsacia y los Vosgos del Norte y, con buen tiempo, la catedral de Estrasburgo. Cruce el puente del Diablo sobre el vacío y visite la capilla románica. Paseo fácil, incluso con niños.'],i:['Aplicación gratuita «Sur la piste des trésors d’Alsace»','Más información: tourisme-saverne.fr']},
jardin:{t:'Jardín botánico del Col de Saverne',c:'Una auténtica vuelta al mundo vegetal.',b:['A 4 minutos en coche, este jardín de 3 hectáreas fue creado en 1931 por Émile Walter, farmacéutico y botánico de Saverne. Flora de Europa, África, Australia y Asia convive con la local: alpinum, turberas, helechos, rododendros, arboreto.','Su orgullo: una de las mayores colecciones francesas de orquídeas rústicas. Calcule de 1 h 30 a 2 h de visita.'],i:['Abril y septiembre: sábados, domingos y festivos, de 14:00 a 18:00','De mayo a agosto: todos los días de 10:00 a 18:00','Visita libre: 2,50 € · visita guiada: 3,50 €','jardin-botanique-saverne.eu']},
marmoutier:{t:'Abacial de Saint-Étienne de Marmoutier',c:'Una de las abaciales románicas más bellas de Alsacia.',b:['A 7 km, en la Ruta Románica de Alsacia, se encuentra el monasterio más antiguo de Alsacia, fundado hacia el año 589. Destacan su fachada de 1145, sus torres rematadas en octógono y su nártex románico.','En el interior: una nave luminosa del siglo XIII, un coro del XVIII, una cripta arqueológica y el órgano de André Silbermann. Monumento histórico desde 1840.'],i:['Más información en la Oficina de Turismo de Saverne']},
rohan:{t:'Palacio de los Rohan',c:'El «pequeño Versalles alsaciano».',b:['En pleno centro, junto al canal del Marne al Rin, el palacio de los Rohan despliega hacia el parque una fachada neoclásica de 140 metros. Residencia de los obispos de Estrasburgo hasta la Revolución, fue restaurado bajo Napoleón III.','Hoy alberga el museo de Saverne (sección Louise Weiss, colección arqueológica, fondos de arte e historia), un espacio cultural y un gran parque frente al puerto deportivo.'],i:['Programa de eventos: Oficina de Turismo de Saverne']},
palette:{t:'Saverne, mil cosas que ver',c:'¡Déjese llevar por Alsacia!',b:['Entre los bosques de los Vosgos y la llanura de Alsacia: cientos de kilómetros de senderos señalizados por el Club Vosgien, carriles bici a lo largo del canal y, en el puerto deportivo, barcos de alquiler para navegar.','Castillos (Rohan, Haut-Barr, Greifenstein), iglesias de Neuwiller-lès-Saverne, museos de Saverne, Bouxwiller y Pfaffenhoffen, la torre Chappe, el plano inclinado de Arzviller, cristalerías y alfarerías. El Royal Palace de Kirrwiller está a 10 minutos y la Ruta del vino empieza en Marlenheim, a 15 km.']},
histoire:{t:'Saverne a lo largo de la historia',c:'La puerta de entrada a Alsacia.',b:['Los romanos ya usaban el puerto de Saverne como lugar de paso. En la Edad Media, la ciudad unía Lorena con el sur: lo atestiguan fortalezas y abadías como el Haut-Barr o el Grand Geroldseck, uno de los castillos más antiguos de los Vosgos del Norte.','Su apodo de «puerta de Alsacia» nunca fue tan cierto: RN4, autopista A4 Estrasburgo–París y paradas del TGV. El hotel está a 300 metros de la estación.']},
vosges:{t:'Parque natural regional de los Vosgos del Norte',c:'El paraíso de los senderistas.',b:['Creado en 1976, el parque cubre hoy 130.500 hectáreas entre Wissembourg y Sarreguemines, con vistas a Saverne. Hayas, robles y pinos silvestres, prados y huertos.','Pueblos de entramado de madera y arenisca, castillos en las alturas, senderos a la sombra de los valles: una naturaleza generosa al alcance de sus botas.']}
},

r:{prix:'Nuestras habitaciones van de 82 € (Clásica, 1 persona) a 190 € (Suite, 5 personas). El desayuno bufé cuesta 11,50 €. El mejor precio está garantizado reservando en esta web.',resto:'La winstub S’Rosestiebel abre de martes a sábado, de 12:00 a 14:00 y de 19:00 a 21:00. Cerrada domingo y lunes, y dos semanas entre Navidad y Año Nuevo. A mediodía entre semana, menú del día a 18 €.',carte:'En la carta: chucrut con guarnición (20 €), chucrut con dos pescados (23 €), salmón de nuestro ahumadero (19 €), ternera Simmental madurada en nuestra bodega (26 €)… ¿Quiere ver la carta completa?',velo:'Sí: un garaje cerrado y gratuito acoge sus bicis y motos, con toma eléctrica para cargar. A los ciclistas del canal del Marne al Rin les encanta.',chien:'Los perros son bienvenidos, en el hotel y en el restaurante: 6 € por perro y día.',parking:'Aparcar delante del hotel es de pago entre semana (9:00–19:00) y el sábado (9:00–18:00), gratis domingos y festivos. Plazas gratuitas en los aparcamientos des Remparts, de la Roseraie y des Dragons. Box cerrado por 10 € al día, según disponibilidad.',train:'La estación de Saverne, con parada del TGV, está a 300 m: dos minutos a pie. Estrasburgo está a 40 km.',voiture:'Estamos a 5 km de la A4 París–Estrasburgo, en el 3, rue de la Gare, en pleno centro de Saverne.',pdj:'Bufé abundante por 11,50 € (6 € hasta 10 años): fruta, embutidos, huevos pasados por agua, quesos, bollería… De 7:15 a 9:30 entre semana y de 8:00 a 9:30 el fin de semana. Pan sin gluten bajo petición.',spa:'El hotel tiene un espacio spa: jacuzzi bajo cielo estrellado, zona de relax y masajes. Para horarios y tratamientos, recepción le informa en el +33 (0)3 88 91 10 19.',demi:'La media pensión suma 38 € por persona y noche: cena de tres platos y desayuno bufé (15 € más por un menú gastronómico).',etape:'La escala de negocios va desde 110 € para una persona: noche en habitación Clásica, desayuno y cena, de martes a viernes, con reserva por teléfono.',wifi:'El wifi es gratuito en todas las habitaciones.',clim:'Tienen aire acondicionado las habitaciones Prestige y Grand Prestige y la Suite.',famille:'Para una familia: la Habitación Triple (1 a 3 personas, 128 €) o la Suite dúplex (hasta 5 personas, dos baños, desde 130 €).',groupe:'Para un grupo tenemos 40 habitaciones y dos salas de restaurante. Escríbanos o llame al +33 (0)3 88 91 10 19: le preparamos una propuesta.',noel:'En diciembre la casa se viste de Navidad y el mercadillo navideño de Saverne está muy cerca. Atención: el restaurante cierra dos semanas entre Navidad y Año Nuevo; el hotel sigue abierto.',visite:'Cerca: la Rosaleda (4 min a pie), el palacio de los Rohan, el Haut-Barr y sus vistas, el jardín botánico, la abadía de Marmoutier (7 km), la Ruta del vino (15 km).',contact:'Puede contactarnos en el +33 (0)3 88 91 10 19 o en chez.jean@wanadoo.fr. Dirección: 3, rue de la Gare, 67700 Saverne.',ascenseur:'Dos ascensores llegan a todas las plantas.',inconnu:'Prefiero no contestarle al azar: no tengo esa información. El equipo le responderá con gusto en el +33 (0)3 88 91 10 19 o en chez.jean@wanadoo.fr.',merci:'¡Con mucho gusto! Feliz estancia en Saverne.',bonjour:'¡Hola! Dígame qué busca: ¿una habitación, una mesa, un dato práctico?'}},

winstub:{h:'La winstub dove si torna per la choucroute',p:'Due sale in puro stile alsaziano: la sala «Jean», dove si serve la colazione, e la winstub «S’Rosestiebel», la stanzetta delle rose, per pranzo e cena. La carta segue le stagioni, tra tradizione alsaziana e grandi classici francesi, con una bella carta dei vini d’Alsazia e non solo.',plats:[['Salmone fresco affumicato nel nostro affumicatoio, toast imburrato','19 €'],['Choucroute ai due pesci','23 €'],['Manzo Simmental frollato nella nostra cantina','26 €'],['Kougelhopf gelato rum e uvetta','8 €']],horaires:'Dal martedì al sabato, 12–14 e 19–21. Chiuso domenica e lunedì.',menuJour:'Menù del giorno a 18 € a pranzo nei giorni feriali',cta:'Leggi tutta la carta',table:'Prenota un tavolo'},
spa:{h:'Un bagno caldo dopo il viaggio',p:'Vasca idromassaggio sotto un cielo stellato, area relax dalle luci soffuse, massaggi: per posare le valigie e respirare. I nostri ospiti lo raccontano meglio di noi.',q1:['La spa era incredibilmente bella e moderna.','Phillip, dicembre 2023'],q2:['Il massaggio e l’area relax molto piacevoli.','Un ospite, febbraio 2023'],info:'Accesso, trattamenti e prenotazioni: chiedete alla reception, organizza il vostro momento.',cta:'Chiedi alla reception',page:'La spa in immagini'},

hotel:{h:'Un hotel di famiglia nel cuore dell’Alsazia',lead:'Stile contemporaneo e spirito alsaziano sotto lo stesso tetto, a 5 km dall’autostrada A4.',p1:'A Saverne, l’Hotel Chez Jean vi propone 40 camere di charme. Christelle e Fabrice Veit-Harter e il loro staff curano il vostro comfort e rispondono a ogni richiesta.',p2:'Calma e comfort per un soggiorno in coppia, in famiglia o tra amici.',h2:'Camere arredate con cura',p3:'Le nostre camere respirano Alsazia: ognuna ha il suo tocco, fatto di quei piccoli dettagli che rendono piacevole un soggiorno. Spaziose e luminose, con boiserie e pitture regionali, offrono tutti i comfort moderni: radio, TV, cassaforte, Wi-Fi gratuito, bagno o doccia, WC, asciugacapelli, minibar e, in alcune, aria condizionata.',h3:'Per il vostro comfort',atouts:['Due ascensori servono tutti i piani','Un salotto e, d’estate, la nostra terrazza','Una winstub e due sale ristorante','Uno spazio spa e relax','Un garage chiuso e gratuito per bici e moto'],label:'Logis Hotels · Hôtel Cosy · Restaurant Gourmand'},

riche n. 3 di Normandia'],huitres12:['12 ostriche n. 3 di Normandia'],rosbeef:['Roast beef','spätzle o patatine'],cordon:['Cordon bleu di pollo al munster','salsa alla panna, patatine, verdure'],foiegras:['Foie gras d’anatra'],rossini:['Filetto di manzo alla Rossini'],veauGirolles:['Filetto di vitello ai finferli'],ris:['Animelle di vitello alla panna con spugnole','secondo disponibilità'],sandre:['Filetto di lucioperca alla griglia','patate al vapore e verdure'],civet:['Civet di cerva','spätzle']},parfums:'Gelati: vaniglia, cioccolato, caffè, cocco, pistacchio. Sorbetti: limone, lampone, fragola, pera, ananas, frutto della passione.',supp:'Ogni contorno extra (patate saltate, patatine o insalata verde): 3,50 €. Le nostre carni provengono da Francia e Germania. Prezzi netti.',sallesP:'La sala «Jean» ospita il buffet della colazione; la winstub «S’Rosestiebel» vi accoglie a pranzo e a cena. Ognuna ha il suo stile, sempre nel più puro spirito alsaziano. In entrambe la stessa cura per qualità, scelta e serietà, che veniate da soli, in coppia, in famiglia o in gruppo. La carta cambia con le stagioni ed è accompagnata da una ricca carta dei vini d’Alsazia e non solo.',jour:{prix:[['Menù del giorno (antipasto, piatto, dolce)','18 €'],['Menù del giorno senza dolce','16 €'],['Menù del giorno senza antipasto','16 €'],['Piatto del giorno, sul posto o da asporto','13 €']],quand:'Tutti i giorni a pranzo tranne sabato, domenica e lunedì.',semaine:'Questa settimana',plats:[['Martedì 17 novembre','Scaloppina di tacchino al munster, spätzle fatti in casa'],['Mercoledì 18 novembre','Lonza di maiale impanata, carote e patatine'],['Giovedì 19 novembre','Spalla di maiale «alla diavola», patate saltate'],['Venerdì 20 novembre','Pesce del mercato'],['Sabato','Alla carta']]},enfant:{prix:'11,50 €',plat:'Würstel knacks, patatine o pasta',dessert:'Gelato con panna',pour:'Per i bambini sotto i 10 anni'}},
spaPage:{h:'Spa e benessere',lead:'Idromassaggio, cielo stellato, area relax e massaggi, in tranquillità, nel cuore dell’hotel.',p:'I nostri ospiti lodano uno spazio «incredibilmente bello e moderno». Per orari, trattamenti e prezzi, la reception vi informa e organizza il vostro momento.',ajout:'Proposta di aggiunta: una pagina dedicata alla spa, con orari, trattamenti e prenotazione online, da completare con le vostre informazioni.'},
services:{h:'I servizi dell’hotel',lead:'I piccoli extra che cambiano un soggiorno.',list:[['velo','Garage per bici e moto','Un garage chiuso e gratuito per biciclette e moto, con presa elettrica.'],['box','Box auto','10 € al giorno. Secondo disponibilità, affittiamo box chiusi per la vostra auto. Informatevi prima.'],['chien','Animali','6 € per cane al giorno. I cani sono i benvenuti, in hotel come al ristorante.'],['parking','Parcheggio','A pagamento davanti all’hotel dal lunedì al venerdì 9–19 e il sabato 9–18; gratuito la domenica e nei giorni festivi. Possibile abbonamento a tariffa ridotta (informazioni alla reception). Alcuni posti gratuiti vicino: parcheggi des Remparts, de la Roseraie e des Dragons. I posti non si possono prenotare.'],['wifi','Wi-Fi gratuito','In tutte le camere.'],['groupe','Gruppi','Due sale ristorante e 40 camere: parlateci del vostro gruppo.'],['ascenseur','Ascensori','Due ascensori servono tutti i piani.']]},
alsacePage:{h:'Scoprire Saverne e l’Alsazia',lead:'Un punto d’appoggio ideale per scoprire Saverne, i dintorni e tutte le ricchezze dell’Alsazia.',lire:'Leggi',infos:'Informazioni pratiche'},
visites:{
roseraie:{t:'Roseto di Saverne',c:'Circa 8.500 rosai, 550 varietà.',b:['A 4 minuti a piedi dall’hotel, il Roseto fa di Saverne la «città delle rose». Creato nel 1898 ai piedi del valico, si estende su 1,5 ettari: è il secondo roseto più antico di Francia.','Di fama internazionale, riunisce circa 8.500 rosai di 550 varietà: rose antiche, profumate, cespugli, ibridi di tè, arbustive, tappezzanti e le ultime novità.'],i:['Route de Paris, 67700 Saverne','Adulti: 3 € · bambini: gratis','Dal 21 maggio al 31 agosto: tutti i giorni 10–19','Dal 1° al 27 settembre: tutti i giorni 14–18']},
hautbarr:{t:'Castello dell’Haut-Barr',c:'Dall’alto, una vista mozzafiato.',b:['Soprannominato «l’Occhio dell’Alsazia», il castello dell’Haut-Barr sorge su tre rocce di arenaria rosa, a 470 metri di altitudine. Costruito nel XII secolo dai vescovi di Strasburgo, è monumento storico dal 1874.','Salite sul promontorio: panorama a 360° sulla pianura d’Alsazia e sui Vosgi del Nord e, con il bel tempo, la cattedrale di Strasburgo. Attraversate il ponte del Diavolo sopra il vuoto e visitate la cappella romanica. Passeggiata facile, anche con i bambini.'],i:['App gratuita «Sur la piste des trésors d’Alsace»','Più informazioni: tourisme-saverne.fr']},
jardin:{t:'Giardino botanico del Col de Saverne',c:'Un vero giro del mondo vegetale.',b:['A 4 minuti in auto, questo giardino di 3 ettari è stato creato nel 1931 da Émile Walter, farmacista e botanico di Saverne. Flore d’Europa, Africa, Australia e Asia convivono con quella locale: giardino alpino, torbiere, felceto, rododendri, arboreto.','Il suo vanto: una delle più importanti collezioni francesi di orchidee rustiche. Calcolate da 1 ora e mezza a 2 ore di visita.'],i:['Aprile e settembre: sabato, domenica e festivi, 14–18','Da maggio ad agosto: tutti i giorni 10–18','Visita libera: 2,50 € · visita guidata: 3,50 €','jardin-botanique-saverne.eu']},
marmoutier:{t:'Abbaziale di Saint-Étienne a Marmoutier',c:'Una delle più belle abbaziali romaniche d’Alsazia.',b:['A 7 km, sulla Strada romanica d’Alsazia, sorge il monastero più antico d’Alsazia, fondato verso il 589. Notevoli la facciata del 1145, le torri che terminano a ottagono e il nartece romanico.','All’interno: una navata luminosa del XIII secolo, un coro del XVIII, una cripta archeologica e l’organo di André Silbermann. Monumento storico dal 1840.'],i:['Più informazioni presso l’Ufficio del turismo di Saverne']},
rohan:{t:'Castello dei Rohan',c:'La «piccola Versailles alsaziana».',b:['In pieno centro, lungo il canale dalla Marna al Reno, il castello dei Rohan mostra sul lato del parco una facciata neoclassica di 140 metri. Residenza dei vescovi di Strasburgo fino alla Rivoluzione, fu restaurato sotto Napoleone III.','Oggi ospita il museo di Saverne (sezione Louise Weiss, collezione archeologica, fondi d’arte e di storia), uno spazio culturale e un grande parco di fronte al porto turistico.'],i:['Programma degli eventi: Ufficio del turismo di Saverne']},
palette:{t:'Saverne, mille cose da vedere',c:'Lasciatevi conquistare dall’Alsazia!',b:['Tra le foreste dei Vosgi e la pianura d’Alsazia: centinaia di chilometri di sentieri segnati dal Club Vosgien, piste ciclabili lungo il canale e, al porto turistico, barche a noleggio per navigare.','Castelli (Rohan, Haut-Barr, Greifenstein), chiese di Neuwiller-lès-Saverne, musei di Saverne, Bouxwiller e Pfaffenhoffen, la torre Chappe, il piano inclinato di Arzviller, cristallerie e ceramiche. Il Royal Palace di Kirrwiller è a 10 minuti, la Strada del vino comincia a Marlenheim, a 15 km.']},
histoire:{t:'Saverne nel corso della storia',c:'La porta d’ingresso dell’Alsazia.',b:['Già i Romani usavano il valico di Saverne come luogo di passaggio. Nel Medioevo la città collegava la Lorena al sud: lo testimoniano fortezze e abbazie come l’Haut-Barr o il Grand Geroldseck, uno dei castelli più antichi dei Vosgi del Nord.','Il soprannome di «porta dell’Alsazia» non è mai stato così vero: RN4, autostrada A4 Strasburgo–Parigi e fermate del TGV. L’hotel è a 300 metri dalla stazione.']},
vosges:{t:'Parco naturale regionale dei Vosgi del Nord',c:'Il paradiso degli escursionisti.',b:['Creato nel 1976, il parco copre oggi 130.500 ettari tra Wissembourg e Sarreguemines, con vista su Saverne. Faggi, querce e pini silvestri, prati e frutteti.','Villaggi a graticcio e in arenaria, castelli sulle alture, sentieri ombreggiati nelle valli: una natura generosa a portata di scarponi.']}
},

conseil:{nom:'Jean Conseil',sous:'Vi aiuto a scegliere',va:'Assistente virtuale dell’Hotel Chez Jean',bulle:'Buongiorno! Sono Jean Conseil, l’assistente virtuale della casa. Una camera per due, una cena alla winstub, un garage per le vostre bici? Chiedetemi pure.',accueil:'Buongiorno, sono Jean Conseil, assistente virtuale dell’Hotel Chez Jean. Conosco le camere, la winstub, i servizi e Saverne. Come posso aiutarvi?',placeholder:'Scrivete la vostra domanda…',envoyer:'Invia',puces:['Quale camera per noi?','Orari del ristorante','Garage per bici','Arrivare in treno','Accettate cani?','La spa'],
