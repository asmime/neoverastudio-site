r:{prix:'Le nostre camere vanno da 82 € (Classica, 1 persona) a 190 € (Suite, 5 persone). La colazione a buffet costa 11,50 €. La miglior tariffa è garantita prenotando su questo sito.',resto:'La winstub S’Rosestiebel è aperta dal martedì al sabato, 12–14 e 19–21. Chiusa domenica e lunedì e per due settimane tra Natale e Capodanno. A pranzo nei giorni feriali, menù del giorno a 18 €.',carte:'In carta: choucroute guarnita (20 €), choucroute ai due pesci (23 €), salmone del nostro affumicatoio (19 €), manzo Simmental frollato nella nostra cantina (26 €)… Volete la carta completa?',velo:'Sì: un garage chiuso e gratuito accoglie bici e moto, con presa elettrica per la ricarica. I ciclisti del canale dalla Marna al Reno lo adorano.',chien:'I cani sono i benvenuti, in hotel come al ristorante: 6 € per cane al giorno.',parking:'Il parcheggio davanti all’hotel è a pagamento nei giorni feriali (9–19) e il sabato (9–18), gratuito la domenica e nei festivi. Posti gratuiti ai parcheggi des Remparts, de la Roseraie e des Dragons. Box chiuso a 10 € al giorno, secondo disponibilità.',train:'La stazione di Saverne, servita dal TGV, è a 300 m: due minuti a piedi. Strasburgo è a 40 km.',voiture:'Siamo a 5 km dalla A4 Parigi–Strasburgo, al 3, rue de la Gare, in pieno centro di Saverne.',pdj:'Buffet abbondante a 11,50 € (6 € fino a 10 anni): frutta, salumi, uova alla coque, formaggi, viennoiserie… Dalle 7:15 alle 9:30 nei giorni feriali, dalle 8:00 alle 9:30 nel weekend. Pane senza glutine su richiesta.',spa:'L’hotel ha uno spazio spa: idromassaggio sotto cielo stellato, area relax e massaggi. Per orari e trattamenti la reception vi informa al +33 (0)3 88 91 10 19.',demi:'La mezza pensione aggiunge 38 € a persona a notte: cena di tre portate e colazione a buffet (15 € in più per un menù gastronomico).',etape:'La tappa di lavoro parte da 110 € per una persona: notte in camera Classica, colazione e cena, dal martedì al venerdì, su prenotazione telefonica.',wifi:'Il Wi-Fi è gratuito in tutte le camere.',clim:'L’aria condizionata è nelle camere Prestige, Grand Prestige e nella Suite.',famille:'Per una famiglia: la Camera Tripla (da 1 a 3 persone, 128 €) o la Suite duplex (fino a 5 persone, due bagni, da 130 €).',groupe:'Per un gruppo abbiamo 40 camere e due sale ristorante. Scriveteci o chiamate il +33 (0)3 88 91 10 19: prepariamo una proposta.',noel:'A dicembre la casa si veste di decorazioni natalizie e il mercatino di Natale di Saverne è vicinissimo. Attenzione: il ristorante chiude due settimane tra Natale e Capodanno, l’hotel resta aperto.',visite:'Nei dintorni: il Roseto (4 min a piedi), il castello dei Rohan, l’Haut-Barr e la sua vista, il giardino botanico, l’abbazia di Marmoutier (7 km), la Strada del vino (15 km).',contact:'Potete contattarci al +33 (0)3 88 91 10 19 o a chez.jean@wanadoo.fr. Indirizzo: 3, rue de la Gare, 67700 Saverne.',ascenseur:'Due ascensori servono tutti i piani.',inconnu:'Preferisco non rispondere a caso: non ho questa informazione. Lo staff vi risponde volentieri al +33 (0)3 88 91 10 19 o a chez.jean@wanadoo.fr.',merci:'Con piacere! Buon soggiorno a Saverne.',bonjour:'Buongiorno! Ditemi cosa cercate: una camera, un tavolo, un’informazione pratica?'}},

hotel:{h:'Een familiehotel in het hart van de Elzas',lead:'Eigentijdse stijl en Elzasser sfeer onder één dak, op 5 km van de A4.',p1:'In Saverne biedt Hotel Chez Jean u 40 sfeervolle kamers. Christelle en Fabrice Veit-Harter en hun team zorgen voor uw comfort en al uw wensen.',p2:'Rust en comfort voor een verblijf met z’n tweeën, met het gezin of met vrienden.',h2:'Zorgvuldig ingerichte kamers',p3:'Onze kamers ademen de Elzas: elke kamer heeft een eigen accent, gemaakt van die kleine details die een verblijf aangenaam maken. Ruim en licht, met houten lambrisering en regionale schilderingen, bieden ze alle moderne comfort: radio, tv, kluis, gratis wifi, bad of douche, toilet, föhn, minibar en soms airconditioning.',h3:'Voor uw comfort',atouts:['Twee liften naar alle verdiepingen','Een lounge en ’s zomers ons terras','Een winstub en twee restaurantzalen','Een spa- en rustruimte','Een gratis, afgesloten garage voor fietsen en motoren'],label:'Logis Hotels · Hôtel Cosy · Restaurant Gourmand'},

,rosbeef:['Rosbief','spätzle of friet'],cordon:['Cordon bleu van gevogelte met munsterkaas','roomsaus, friet, groenten'],foiegras:['Eendenlever (foie gras)'],rossini:['Ossenhaas Rossini'],veauGirolles:['Kalfsfilet met cantharellen'],ris:['Kalfszwezerik in roomsaus met morieljes','afhankelijk van aanvoer'],sandre:['Gegrilde snoekbaarsfilet','gestoomde aardappelen en groenten'],civet:['Hindestoofpot','spätzle']},parfums:'IJs: vanille, chocolade, koffie, kokos, pistache. Sorbets: citroen, framboos, aardbei, peer, ananas, passievrucht.',supp:'Elk extra bijgerecht (gebakken aardappelen, friet of groene salade): € 3,50. Ons vlees komt uit Frankrijk en Duitsland. Nettoprijzen.',sallesP:'In de zaal „Jean” staat het ontbijtbuffet; de winstub „S’Rosestiebel” ontvangt u voor lunch en diner. Elke zaal heeft een eigen stijl, altijd in zuivere Elzasser geest. In beide dezelfde zorg voor kwaliteit, keuze en betrouwbaarheid, of u nu alleen komt, met z’n tweeën, met het gezin of met een groep. De kaart wisselt met de seizoenen, met een rijke wijnkaart uit de Elzas en daarbuiten.',jour:{prix:[['Dagmenu (voorgerecht, hoofdgerecht, dessert)','€ 18'],['Dagmenu zonder dessert','€ 16'],['Dagmenu zonder voorgerecht','€ 16'],['Dagschotel, ter plaatse of om mee te nemen','€ 13']],quand:'Elke middag behalve zaterdag, zondag en maandag.',semaine:'Deze week',plats:[['Dinsdag 17 november','Kalkoenschnitzel met munstersaus, huisgemaakte spätzle'],['Woensdag 18 november','Gepaneerde varkensnek, wortelen en friet'],['Donderdag 19 november','Varkensschouder „à la diable”, gebakken aardappelen'],['Vrijdag 20 november','Vis van de markt'],['Zaterdag','À la carte']]},enfant:{prix:'€ 11,50',plat:'Knakworstjes, friet of noedels',dessert:'IJs met slagroom',pour:'Voor kinderen onder de 10 jaar'}},

visites:{
roseraie:{t:'Rozentuin van Saverne',c:'Zo’n 8.500 rozenstruiken, 550 soorten.',b:['Op 4 minuten lopen van het hotel maakt de Rozentuin van Saverne de „stad van de rozen”. Aangelegd in 1898 aan de voet van de pas, beslaat hij 1,5 hectare: de op één na oudste rozentuin van Frankrijk.','Internationaal bekend, met zo’n 8.500 rozenstruiken van 550 soorten: oude rozen, geurrozen, struiken, theehybriden, heesterrozen, bodembedekkers en de nieuwste variëteiten.'],i:['Route de Paris, 67700 Saverne','Volwassenen: € 3 · kinderen: gratis','21 mei t/m 31 augustus: dagelijks 10.00–19.00 uur','1 t/m 27 september: dagelijks 14.00–18.00 uur']},
hautbarr:{t:'Kasteel Haut-Barr',c:'Van bovenaf een adembenemend uitzicht.',b:['Het „Oog van de Elzas” staat op drie rozerode zandsteenrotsen, op 470 meter hoogte. In de 12e eeuw gebouwd door de bisschoppen van Straatsburg, beschermd monument sinds 1874.','Klim naar het uitkijkpunt: 360° panorama over de Elzasser vlakte en de Noordelijke Vogezen, en bij helder weer de kathedraal van Straatsburg. Steek de Duivelsbrug over boven de afgrond en bezoek de romaanse kapel. Een makkelijke wandeling, ook met kinderen.'],i:['Gratis app „Sur la piste des trésors d’Alsace”','Meer info: tourisme-saverne.fr']},
jardin:{t:'Botanische tuin van de Col de Saverne',c:'Een echte wereldreis door het plantenrijk.',b:['Op 4 minuten rijden ligt deze tuin van 3 hectare, in 1931 aangelegd door Émile Walter, apotheker en botanicus uit Saverne. Planten uit Europa, Afrika, Australië en Azië groeien naast de lokale flora: alpinum, venen, varentuin, rododendrons, arboretum.','Zijn trots: een van de grootste Franse collecties winterharde orchideeën. Reken op 1,5 tot 2 uur.'],i:['April en september: zaterdag, zondag en feestdagen, 14.00–18.00 uur','Mei t/m augustus: dagelijks 10.00–18.00 uur','Vrij bezoek: € 2,50 · rondleiding: € 3,50','jardin-botanique-saverne.eu']},
marmoutier:{t:'Abdijkerk Saint-Étienne in Marmoutier',c:'Een van de mooiste romaanse abdijkerken van de Elzas.',b:['Op 7 km, aan de Romaanse Route van de Elzas, staat het oudste klooster van de Elzas, gesticht rond 589. Opvallend: de gevel uit 1145, de torens die in achthoeken eindigen en de romaanse voorhal.','Binnen: een licht schip uit de 13e eeuw, een koor uit de 18e, een archeologische crypte en het orgel van André Silbermann. Beschermd monument sinds 1840.'],i:['Meer info bij het VVV-kantoor van Saverne']},
rohan:{t:'Kasteel Rohan',c:'Het „kleine Versailles van de Elzas”.',b:['Midden in de stad, aan het Marne-Rijnkanaal, toont kasteel Rohan aan de parkzijde een neoclassicistische gevel van 140 meter. Tot de Revolutie residentie van de bisschoppen van Straatsburg, gerestaureerd onder Napoleon III.','Nu huisvest het het museum van Saverne (afdeling Louise Weiss, archeologische collectie, kunst- en geschiedeniscollectie), een cultureel centrum en een groot park tegenover de jachthaven.'],i:['Evenementen: VVV-kantoor van Saverne']},
palette:{t:'Saverne, volop te zien',c:'Ontdek de Elzas!',b:['Tussen de bossen van de Vogezen en de Elzasser vlakte: honderden kilometers wandelpaden gemarkeerd door de Club Vosgien, fietspaden langs het kanaal en, in de jachthaven, boten te huur om te varen.','Kastelen (Rohan, Haut-Barr, Greifenstein), de kerken van Neuwiller-lès-Saverne, musea in Saverne, Bouxwiller en Pfaffenhoffen, de Chappe-toren, de scheepslift van Arzviller, kristalblazerijen en pottenbakkerijen. Het Royal Palace in Kirrwiller ligt op 10 minuten, de Wijnroute begint in Marlenheim, op 15 km.']},
histoire:{t:'Saverne door de geschiedenis',c:'De toegangspoort tot de Elzas.',b:['De Romeinen gebruikten de pas van Saverne al als doorgang. In de middeleeuwen verbond de stad Lotharingen met het zuiden: burchten en abdijen getuigen ervan, zoals de Haut-Barr of de Grand Geroldseck, een van de oudste kastelen van de Noordelijke Vogezen.','De bijnaam „poort van de Elzas” was nooit zo waar: RN4, snelweg A4 Straatsburg–Parijs en TGV-haltes. Het hotel ligt op 300 meter van het station.']},
vosges:{t:'Regionaal natuurpark Noordelijke Vogezen',c:'Een paradijs voor wandelaars.',b:['Opgericht in 1976, beslaat het park nu 130.500 hectare tussen Wissembourg en Sarreguemines, met uitzicht op Saverne. Beuken, eiken en grove dennen, weiden en boomgaarden.','Vakwerk- en zandsteendorpen, kastelen op de heuvels, schaduwrijke paden in de dalen: een rijke natuur binnen bereik van uw wandelschoenen.']}
},

mentions:{h:'Juridische informatie',editeur:'Uitgever',heberg:'Hosting',med:'Bemiddeling',medP:'Volgens het decreet van 30 oktober 2015 kan de klant, na de directie van SARL Société Exploitation Harter te hebben benaderd en bij gebrek aan een bevredigend antwoord binnen 60 dagen, kosteloos terecht bij de Médiateur Tourisme et Voyage, BP 80303, 75823 Parijs Cedex 17 (mtv.travel).',donnees:'Persoonsgegevens',donneesP:'U hebt recht op inzage, wijziging, correctie en verwijdering van de gegevens die op deze site worden verzameld (Franse wet van 6 januari 1978, zoals gewijzigd). Schrijf daarvoor naar de Société Exploitation Harter, 3, rue de la Gare, 67700 Saverne.',tech:'Technische informatie',techP:'Het briefgeheim is op internet niet gegarandeerd: iedereen moet zijn eigen gegevens en software beschermen.',charte:'Redactionele lijn',charteP:'Deze site presenteert de diensten van de Société Exploitation Harter. Foto’s en afbeeldingen zijn indicatief.',liens:'Links en auteursrecht',liensP:'Voor elke link naar deze site is voorafgaande toestemming van de verantwoordelijke uitgever nodig. Elke reproductie van de pagina’s en onderdelen van de site zonder toestemming is verboden.',credits:'Fotocredits: VVV Pays de Saverne · Hôtel Chez Jean',pub:'Verantwoordelijk uitgever: Fabrice Veit',capital:'Maatschappelijk kapitaal: € 7.622'},

let S={room:null,pers:2,nuits:1,pdj:true,demi:false,box:false,chien:false};
try{const s=JSON.parse(sessionStorage.getItem('cj-sejour')||'null');if(s)S=Object.assign(S,s)}catch(e){}
const saveS=()=>{try{sessionStorage.setItem('cj-sejour',JSON.stringify(S))}catch(e){}majCompteur()};
function ajouterChambre(id,pers){const r=ROOMS.find(x=>x.id===id);S.room=id;S.pers=Math.min(pers||Math.min(2,r.max),r.max);saveS();ouvrirSejour()}
function totalS(){if(!S.room)return 0;const r=ROOMS.find(x=>x.id===S.room);let n=S.nuits,p=S.pers,tot=prixChambre(r,p)*n;if(S.demi)tot+=38*p*n;else if(S.pdj)tot+=11.5*p*n;if(S.box)tot+=10*n;if(S.chien)tot+=6*n;return tot}
function renderSejour(){
 const r=ROOMS.find(x=>x.id===S.room);const c=$('#tiroir .corps');
 $('#tiroir h2').textContent=t('sejour.h');
 if(!r){c.innerHTML=`<p class="vide">${t('sejour.vide')}</p><a class="btn btn-ligne" style="width:100%" href="#/chambres" data-ferme>${t('sejour.choisir')}</a>`;$('#tiroir .pied-t').style.display='none';return}
 $('#tiroir .pied-t').style.display='';
 const opts=n=>Array.from({length:n},(_,i)=>i+1);
 c.innerHTML=`<div style="display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin-bottom:18px"><div class="photo" style="aspect-ratio:1"><img src="${I(r.img[0])}" alt=""></div><div><b style="font:400 1.3rem var(--serif)">${esc(t('noms.'+r.id))}</b><div class="muted" style="font-size:15px">${r.m2} ${t('ui.m2')} · ${r.pers} ${t('ui.pers')}</div><button class="lien-retirer" style="border:0;background:none;padding:0;color:var(--gres-fonce);cursor:pointer;text-decoration:underline;font:inherit;font-size:14.5px" data-retirer>${t('sejour.retirer')}</button></div></div>
 <div class="champs"><label class="champ">${t('sejour.personnes')}<select data-k="pers">${opts(r.max).map(i=>`<option ${i===S.pers?'selected':''}>${i}</option>`).join('')}</select></label><label class="champ">${t('sejour.nuits')}<select data-k="nuits">${opts(10).map(i=>`<option ${i===S.nuits?'selected':''}>${i}</option>`).join('')}</select></label></div>
 <h3 style="font-size:1.2rem;margin:20px 0 4px">${t('sejour.options')}</h3>
 ${[['pdj','pdjS'],['demi','demiS'],['box','boxS'],['chien','chienS']].map(([k,s])=>`<label class="opt"><input type="checkbox" data-o="${k}" ${S[k]?'checked':''} ${k==='pdj'&&S.demi?'disabled':''}><span>${t('sejour.'+k)}<small>${t('sejour.'+s)}</small></span></label>`).join('')}
 <p class="muted" style="font-size:14px;margin-top:14px">${t('sejour.note')}</p>`;
 $('#tiroir .total span').textContent=t('sejour.total');$('#tiroir .total b').textContent=eur(totalS());
 const pay=$('#tiroir [data-payer]');pay.href=ellohaUrl();pay.innerHTML=t('sejour.payer')+ico.fleche;
 $('#tiroir [data-tel]').innerHTML=ico.tel+TEL_TXT;
 $$('select[data-k]',c).forEach(s=>s.onchange=()=>{S[s.dataset.k]=+s.value;saveS();renderSejour()});
 $$('input[data-o]',c).forEach(i=>i.onchange=()=>{S[i.dataset.o]=i.checked;saveS();renderSejour()});
 $('[data-retirer]',c).onclick=()=>{S.room=null;saveS();renderSejour()};
}
function ouvrirSejour(){renderSejour();$('#tiroir').classList.add('on');$('#voile').classList.add('on');$('#tiroir').setAttribute('aria-hidden','false');setTimeout(()=>$('#tiroir header button').focus(),50)}
function fermerSejour(){$('#tiroir').classList.remove('on');$('#voile').classList.remove('on');$('#tiroir').setAttribute('aria-hidden','true')}
function majCompteur(){const b=$('#cpt');if(b){b.textContent=S.room?'1':'';b.style.display=S.room?'':'none'}}

const tete=(h,lead,fil)=>`<header class="page-tete"><div class="wrap"><nav class="fil" aria-label="fil"><a href="#/">${t('ui.accueil')}</a>${fil?` · ${fil}`:''}</nav><h1>${esc(h)}</h1>${lead?`<p class="lead">${esc(lead)}</p>`:''}</div></header>`;
const photo=(n,alt='',cls='photo',lazy=true)=>`<div class="${cls}"><img src="${I(n)}" alt="${esc(alt)}" ${lazy?'loading="lazy"':''} decoding="async"></div>`;
function avisCarte(a){return `<article class="avis"><q>${esc(a[2])}</q><footer><b>${esc(a[0])}</b> · ${t('avis.ecrit')} ${a[1]}</footer></article>`}

 <section class="sec"><div class="wrap deux"><div><h2 style="margin-bottom:22px">${t('maison.h')}</h2><p class="lead">${t('maison.p1')}</p><p>${t('maison.p2')}</p><p class="signature">${t('maison.sign')}</p><ul class="liste-atouts">${t('maison.atouts').map(a=>`<li>${esc(a)}</li>`).join('')}</ul><a class="btn btn-ligne" href="#/hotel">${t('maison.cta')}${ico.fleche}</a></div>
 <div class="pose"><div class="maison-photos">${photo('facade2','Façade fleurie de l’Hôtel Chez Jean, rue de la Gare')}${photo('petitdej-salle','Salle Jean et ses boiseries')}${photo('salon','Le salon')}</div>${plaque('maison','',1)}</div></div></section>
 <section class="sec gres"><div class="wrap"><div class="tete">${plaque('chambres')}<p class="lead">${t('chambres.lead')}</p></div>
 <div class="couloir"><ul class="portes">${ROOMS.map((r,i)=>`<li class="porte"><a href="#/chambre/${r.id}" data-i="${i}" class="${i?'':'actif'}"><span class="vignette"><img src="${I(r.img[0])}" alt="" loading="lazy"></span><h3>${esc(t('noms.'+r.id))}</h3><span class="meta">${r.m2} ${t('ui.m2')} · ${r.pers} ${t('ui.pers')} · ${esc(t('accroches.'+r.id))}</span><span class="px">${t('ui.des')}<b class="num">${eur(r.from)}</b></span></a></li>`).join('')}</ul>
 <div class="vitrine" aria-hidden="true">${ROOMS.map((r,i)=>`<img src="${I(r.img[0])}" alt="" class="${i?'':'on'}" loading="lazy">`).join('')}<div id="vit-plaque">${plaqueChambre(ROOMS[0].id,'petite')}</div></div></div>
 <p style="margin-top:28px"><a class="btn btn-sapin" href="#/chambres">${t('chambres.cta')}${ico.fleche}</a></p></div></section>
 <section class="sec noyer"><div class="wrap winstub"><div class="pose">${photo('winstub2','La winstub S’Rosestiebel')}${plaque('winstub','sombre',1)}</div><div><h2 style="margin-bottom:22px">${t('winstub.h')}</h2><p>${t('winstub.p')}</p><div class="ardoise">${t('winstub.plats').map(p=>`<div class="plat"><span>${esc(p[0])}</span><b class="num">${p[1]}</b></div>`).join('')}</div><p class="horaires">${t('winstub.horaires')}<br>${t('winstub.menuJour')}</p><p style="display:flex;flex-wrap:wrap;gap:10px"><a class="btn btn-clair" href="#/restaurant">${t('winstub.cta')}${ico.fleche}</a><a class="btn btn-ligne" style="color:#fff;border-color:rgba(255,255,255,.5)" href="tel:${TEL}">${ico.tel}${t('winstub.table')}</a></p></div></div></section>
 <section class="sec"><div class="wrap"><div class="deux" style="align-items:end;margin-bottom:28px"><h2>${t('spa.h')}</h2><div><p>${t('spa.p')}</p></div></div>
 <div class="spa-grille"><div class="pose" style="grid-column:1/8">${photo('spa-ciel','Bain à remous sous ciel étoilé')}${plaque('spa','sombre',1)}</div>${photo('spa-bougie','Espace détente')}${photo('spa-detente','Espace détente')}${photo('spa-bain','Bain à remous')}</div>
 <div class="deux" style="margin-top:36px;align-items:start"><blockquote class="mot" style="margin:0">«&nbsp;${t('spa.q1')[0]}&nbsp;»<cite>${t('spa.q1')[1]}</cite></blockquote><div><blockquote class="mot" style="margin:0 0 18px">«&nbsp;${t('spa.q2')[0]}&nbsp;»<cite>${t('spa.q2')[1]}</cite></blockquote><p class="muted">${t('spa.info')}</p><a class="btn btn-ligne" href="#/spa">${t('spa.page')}${ico.fleche}</a></div></div></div></section>
 <section class="sec gres"><div class="wrap"><div class="tete">${plaque('offres')}<p class="lead">${t('offres.lead')}</p></div><div class="offres">${offreCartes()}</div></div></section>
 <section class="sec"><div class="wrap"><div class="deux" style="align-items:end;margin-bottom:26px"><h2>${t('avis.h')}</h2><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><p class="muted" style="margin:0">${t('avis.lead')}</p><div class="rail-nav"><button class="rond" data-rail="-1" aria-label="${t('ui.precedent')}">${ico.gauche}</button><button class="rond" data-rail="1" aria-label="${t('ui.suivant')}">${ico.droite}</button></div></div></div>
 <div class="avis-rail" id="rail">${AVIS_UNE.map(i=>avisCarte(AVIS[i])).join('')}</div><p style="margin-top:14px"><a class="btn btn-ligne" href="#/avis">${t('avis.tous')} (${AVIS.length})${ico.fleche}</a></p></div></section>
 <section class="sec sapin"><div class="wrap porte-alsace"><div><h2 style="margin-bottom:22px">${t('alsace.h')}</h2><p>${t('alsace.p')}</p><ul class="distances">${t('alsace.dist').map(d=>`<li><span>${esc(d[0])}</span><b>${esc(d[1])}</b></li>`).join('')}</ul><p style="margin-top:24px"><a class="btn btn-clair" href="#/alsace">${t('alsace.cta')}${ico.fleche}</a></p></div>
 <div class="pose"><div class="visites">${['roseraie','hautbarr','rohan','marmoutier'].map(id=>{const v=VISITES.find(x=>x.id===id);return `<a class="visite" href="#/alsace/${id}"><img src="${I(v.img)}" alt="" loading="lazy"><span>${esc(t('visites.'+id+'.t'))}</span></a>`}).join('')}</div>${plaque('alsace','sombre centre',1)}</div></div></section>
 <section class="sec"><div class="wrap"><div class="tete">${plaque('venir')}</div><div class="venir"><div><h3>${t('venir.adresse')}</h3><p style="white-space:pre-line">${t('venir.adr')}</p><p><a href="tel:${TEL}">${TEL_TXT}</a><br><a href="mailto:${MAIL}">${MAIL}</a></p></div><div><h3>${t('venir.train')}</h3><p>${t('venir.trainP')}</p></div><div><h3>${t('venir.voiture')}</h3><p>${t('venir.voitureP')}</p><a class="btn btn-ligne" href="https://www.google.com/maps/dir/?api=1&destination=H%C3%B4tel+Chez+Jean+3+rue+de+la+Gare+67700+Saverne" target="_blank" rel="noopener">${t('venir.itin')}${ico.fleche}</a></div></div></div></section>`;
}
function offreCartes(){const o=[['demi','demipension'],['etape','resto2'],['pdj','buffet']];return o.map(([k,im])=>`<a class="offre" href="#/offre/${k}">${photo(im)}<div class="txt"><h3>${t('offres.list.'+k+'.t')}</h3><p class="tarif">${t('offres.list.'+k+'.tarif')}</p><p style="margin:0">${t('offres.list.'+k+'.court')}</p></div></a>`).join('')}

function pHotel(){return tete(t('hotel.h'),t('hotel.lead'),t('nav.hotel'))+`<div class="contenu"><div class="wrap"><div class="bandeau-photo"><img src="${I('facade')}" alt="Façade de l’Hôtel Chez Jean"></div><div class="deux" style="align-items:start"><div class="texte"><p class="lead">${t('hotel.p1')}</p><p>${t('hotel.p2')}</p><h2>${t('hotel.h2')}</h2><p>${t('hotel.p3')}</p><h2>${t('hotel.h3')}</h2><ul>${t('hotel.atouts').map(a=>`<li>${esc(a)}</li>`).join('')}</ul><p class="muted">${t('hotel.label')}</p><p style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-sapin" href="#/chambres">${t('nav.chambres')}${ico.fleche}</a><a class="btn btn-ligne" href="#/services">${t('nav.services')}</a></p></div><div style="display:grid;gap:12px">${photo('accueil','Réception')}${photo('pompons','Détail de la décoration')}${photo('enseigne','L’enseigne Chez Jean')}</div></div></div></div>`}

function pChambres(){return tete(t('nav.chambres'),t('chambres.lead'),t('nav.chambres'))+`<div class="contenu"><div class="wrap"><div class="tuiles">${ROOMS.map(r=>`<a class="tuile" href="#/chambre/${r.id}">${photo(r.img[0],t('noms.'+r.id))}<h3>${esc(t('noms.'+r.id))}</h3><p>${r.m2} ${t('ui.m2')} · ${r.pers} ${t('ui.pers')} · ${t('ui.des')} <b class="num" style="color:var(--gres-fonce)">${eur(r.from)}</b></p><p>${esc(t('accroches.'+r.id))}</p></a>`).join('')}</div></div></div>`}

function pChambre(id){const r=ROOMS.find(x=>x.id===id);if(!r)return pChambres();
 const tarifs=r.tarifs.map(([p,v])=>`<tr><td>${p.includes('–')?p+' '+t('ui.pers'):(p==='1'?t('fiche.p1'):t('fiche.pn').replace('{n}',p))}</td><td class="num">${eur(v)}</td></tr>`).join('');
 return `<header class="page-tete"><div class="wrap"><nav class="fil"><a href="#/">${t('ui.accueil')}</a> · <a href="#/chambres">${t('nav.chambres')}</a></nav><div class="tete" style="margin:0">${plaqueChambre(id)}<h1 style="font-size:clamp(2rem,4.4vw,3.6rem)">${esc(t('accroches.'+id))}</h1></div></div></header>
 <div class="contenu"><div class="wrap fiche"><div><div class="galerie-fiche">${photo(r.img[0],t('noms.'+id),'photo',false)}${photo(r.img[1])}${photo(r.img[2])}</div><p class="lead">${t('desc.'+id)}</p><h2 style="font-size:1.6rem;margin:28px 0 10px">${t('fiche.equip')}</h2><ul class="equip">${r.eq.map(e=>`<li>${esc(t('eq.'+e))}</li>`).join('')}</ul>
 <h2 style="font-size:1.6rem;margin:36px 0 14px">${t('fiche.autres')}</h2><div class="tuiles trois">${ROOMS.filter(x=>x.id!==id).slice(0,3).map(x=>`<a class="tuile" href="#/chambre/${x.id}">${photo(x.img[0])}<h3>${esc(t('noms.'+x.id))}</h3><p>${t('ui.des')} ${eur(x.from)}</p></a>`).join('')}</div></div>
 <aside><p class="muted" style="margin:0">${t('fiche.surface')} : ${r.m2} ${t('ui.m2')} · ${t('fiche.capacite')} : ${r.pers} ${t('ui.pers')}</p><h2 style="font-size:1.4rem;margin:14px 0 4px">${t('fiche.tarifs')}</h2><table class="tarifs">${tarifs}</table><p style="font-size:15px" class="muted">${t('fiche.pdj')}</p>
 <label class="champ" style="margin:14px 0">${t('fiche.combien')}<select id="nb">${Array.from({length:r.max},(_,i)=>`<option ${i+1===Math.min(2,r.max)?'selected':''}>${i+1}</option>`).join('')}</select></label>
 <button class="btn btn-sapin" style="width:100%" data-ajout="${id}">${t('ui.ajouter')}${ico.fleche}</button><p class="ou" style="text-align:center;margin:12px 0 0;font-size:15px">${t('heros.ou')} <a href="tel:${TEL}">${TEL_TXT}</a></p></aside></div></div>`}

function pResto(sub){sub=sub||'carte';const tabs=['carte','salles','jour','enfant','sugg'];
 const ligne=(k,p)=>{const d=t('resto.plats.'+k);return `<div class="ligne"><span>${esc(d[0])}${d[1]?`<small>${esc(d[1])}</small>`:''}</span><b class="num">${eur(+p.replace(',','.'))}</b></div>`};
 let c='';
 if(sub==='carte')c=`<div class="carte-resto">${CARTE.map(s=>`<section><h2>${t('resto.sections.'+s.k)}</h2>${s.items.map(([k,p])=>ligne(k,p)).join('')}${s.k==='desserts'?`<p class="muted" style="font-size:15px;margin-top:10px">${t('resto.parfums')}</p>`:''}</section>`).join('')}</div><p class="muted" style="margin-top:22px">${t('resto.supp')}</p>`;
 if(sub==='salles')c=`<div class="deux" style="align-items:start"><div class="texte"><p class="lead">${t('resto.sallesP')}</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${photo('winstub')}${photo('resto')}${photo('resto2')}${photo('petitdej-salle')}</div></div>`;
 if(sub==='jour'){const j=t('resto.jour');c=`<div class="deux" style="align-items:start"><div>${j.prix.map(p=>`<div class="ligne"><span>${esc(p[0])}</span><b class="num">${p[1]}</b></div>`).join('')}<p class="muted" style="margin-top:12px">${j.quand}</p></div><div><h2 style="font-size:1.6rem;margin-bottom:8px">${j.semaine}</h2>${j.plats.map(p=>`<div class="ligne"><span><small>${esc(p[0])}</small>${esc(p[1])}</span><b></b></div>`).join('')}</div></div>`}
 if(sub==='enfant'){const e=t('resto.enfant');c=`<div class="texte"><div class="ligne"><span>${esc(e.plat)}<small>${esc(e.dessert)}</small></span><b class="num">${e.prix}</b></div><p class="muted" style="margin-top:12px">${e.pour}</p></div>`}
 if(sub==='sugg')c=`<div class="carte-resto"><section>${SUGG.slice(0,6).map(([k,p])=>ligne(k,p)).join('')}</section><section>${SUGG.slice(6).map(([k,p])=>ligne(k,p)).join('')}</section></div>`;
 return tete(t('resto.h'),t('resto.lead'),t('nav.restaurant'))+`<div class="contenu"><div class="wrap"><p style="max-width:70ch">${t('resto.horaires')}</p><p><a class="btn btn-sapin" href="tel:${TEL}">${ico.tel}${t('winstub.table')}</a></p><nav class="onglets" aria-label="${t('nav.restaurant')}">${tabs.map(k=>`<a href="#/restaurant/${k}" ${k===sub?'aria-current="page"':''}>${t('resto.tabs.'+k)}</a>`).join('')}</nav>${c}</div></div>`}

function pSpa(){return tete(t('spaPage.h'),t('spaPage.lead'),t('nav.spa'))+`<div class="contenu"><div class="wrap"><div class="spa-grille" style="margin-bottom:36px">${photo('spa-ciel')}${photo('spa-2')}${photo('spa-3')}${photo('spa-sauna')}</div><div class="deux" style="align-items:start"><div class="texte"><p class="lead">${t('spaPage.p')}</p><p style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-sapin" href="tel:${TEL}">${ico.tel}${t('spa.cta')}</a><a class="btn btn-ligne" href="mailto:${MAIL}">${ico.mail}${MAIL}</a></p><p class="muted" style="font-size:15px;border:1px dashed #d7bcb1;border-radius:6px;padding:12px 14px">${t('spaPage.ajout')}</p></div><div>${[AVIS[38],AVIS[50],AVIS[35]].map(avisCarte).join('<div style="height:14px"></div>')}</div></div></div></div>`}

function pOffres(){return tete(t('offres.list.demi.t')&&t('nav.offres'),t('offres.lead'),t('nav.offres'))+`<div class="contenu"><div class="wrap"><div class="offres">${offreCartes()}</div></div></div>`}
function pOffre(k){const o=t('offres.list.'+k);if(!o)return pOffres();const im={demi:'demipension',etape:'resto2',pdj:'buffet'}[k];
 return `<header class="page-tete"><div class="wrap"><nav class="fil"><a href="#/">${t('ui.accueil')}</a> · <a href="#/offres">${t('nav.offres')}</a></nav><h1>${esc(o.t)}</h1><p class="lead">${esc(o.tarif)}</p></div></header><div class="contenu"><div class="wrap deux" style="align-items:start"><div class="texte"><p class="lead">${esc(o.court)}</p><ul>${o.long.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${o.cond?`<p class="muted">${esc(o.cond)}</p>`:''}<p style="display:flex;gap:10px;flex-wrap:wrap">${k==='etape'?`<a class="btn btn-sapin" href="tel:${TEL}">${ico.tel}${TEL_TXT}</a>`:`<a class="btn btn-sapin" href="#/chambres">${t('sejour.choisir')}${ico.fleche}</a>`}<a class="btn btn-ligne" href="#/offres">${t('nav.offres')}</a></p></div>${photo(im,o.t)}</div></div>`}

function pServices(){return tete(t('services.h'),t('services.lead'),t('nav.services'))+`<div class="contenu"><div class="wrap services">${t('services.list').map(([i,h,p])=>`<div class="service"><h3>${ico[i]||''}${esc(h)}</h3><p style="margin:0">${esc(p)}</p></div>`).join('')}</div></div>`}

 if(k==='chambre'){lancerQuiz();return}
 let txt=t('conseil.r.'+k);let extra='';
 if(k==='carte'||k==='resto')extra=`<br><a class="btn btn-ligne" href="#/restaurant/carte">${t('winstub.cta')}</a>`;
