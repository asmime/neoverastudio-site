<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Optisun — Proposition Neovera Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--nuit:#15100C;--nuit2:#21180F;--ecaille:#C9822F;--ecaille-c:#E8AE62;--cristal:#ECEFEC;--blanc:#F8F9F7;--encre:#1A1512;--gris:#5E5650;--bleu:#25368A;--filet:rgba(26,21,18,.14);--sans:'Archivo','Hiragino Sans','Yu Gothic',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cristal);color:var(--encre);font-family:var(--sans);font-size:17px;line-height:1.6;font-variation-settings:"wdth" 100}
::selection{background:var(--ecaille);color:var(--nuit)}
:focus-visible{outline:2px solid #8A4F14;outline-offset:3px;border-radius:2px}
.nuit :focus-visible{outline-color:var(--ecaille-c)}
html{scrollbar-color:var(--ecaille) var(--nuit)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--nuit)}::-webkit-scrollbar-thumb{background:var(--ecaille);border-radius:10px;border:2px solid var(--nuit)}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
img{max-width:100%;display:block}
h1,h2,h3{hyphens:manual;overflow-wrap:break-word;font-weight:500;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;font-variation-settings:"wdth" 72}
h2{font-size:clamp(34px,4.6vw,64px)}
h3{font-size:22px;letter-spacing:-.01em;font-variation-settings:"wdth" 85}
p{margin:0 0 1em;text-wrap:pretty}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--blanc);padding:8px 14px;z-index:99}.skip:focus{left:8px}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:2px;padding:16px 24px;font:600 15px/1 var(--sans);letter-spacing:.01em;cursor:pointer;text-decoration:none;transition:transform .3s var(--ease),background .3s,color .3s}
.btn:hover{transform:translateY(-2px)}
.btn-or{background:var(--ecaille);color:var(--nuit)}.btn-or:hover{background:var(--ecaille-c)}
.btn-trait{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.btn svg{width:16px;height:16px}
/* En-tête */
.tete{position:sticky;top:0;z-index:40;background:rgba(21,16,12,.92);backdrop-filter:saturate(1.2) blur(10px);color:var(--cristal);border-bottom:1px solid rgba(236,239,236,.08)}
.tete .wrap{display:flex;align-items:center;gap:26px;height:72px}
.logo{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
.logo img{height:38px;width:auto}
.menu{display:flex;gap:22px;margin-left:auto}
.menu a{font-size:14px;text-decoration:none;opacity:.82;padding:6px 0;border-bottom:1px solid transparent;white-space:nowrap}
.menu a:hover,.menu a[aria-current=page]{opacity:1;border-color:var(--ecaille)}
.langue{position:relative}
.langue select{appearance:none;background:transparent;color:var(--cristal);border:1px solid rgba(236,239,236,.4);border-radius:2px;padding:8px 30px 8px 12px;font:500 13px var(--sans);cursor:pointer}
.langue::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--cristal);border-bottom:1.5px solid var(--cristal);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.langue option{color:var(--encre)}
.tete .btn{padding:12px 18px;font-size:14px;white-space:nowrap}
@media (max-width:1520px){.menu{gap:16px}.menu a{font-size:13.5px}}
:lang(ja) .heros h1{font-size:clamp(34px,3.7vw,52px);line-height:1.2}:lang(ja) h1,:lang(ja) h2{line-height:1.25;letter-spacing:0;word-break:auto-phrase}:lang(ja) h2{font-size:clamp(28px,3.4vw,46px)}
.burger{display:none;background:none;border:1px solid rgba(236,239,236,.4);color:var(--cristal);border-radius:2px;padding:9px 12px;font:500 13px var(--sans);cursor:pointer;margin-left:auto}
/* Vues */
.vue{display:none}.vue.on{display:block;animation:vue .6s var(--ease)}
@keyframes vue{from{opacity:0;transform:translateY(10px)}}
.nuit{background:var(--nuit);color:var(--cristal)}
section{padding:110px 0}
/* Héros : la plaque, la fraise, le laser */
.heros{position:relative;overflow:hidden;padding:84px 0 96px;background:radial-gradient(120% 80% at 80% 40%,#2A1D12 0%,var(--nuit) 62%)}
.heros .wrap{display:grid;grid-template-columns:1fr 1.08fr;gap:40px;align-items:center}
.heros h1{font-size:clamp(46px,6.2vw,92px);font-weight:400}
.heros h1 .l{display:block;overflow:hidden;padding-bottom:.06em}
.heros h1 .l>span{display:block;animation:monte 1.1s var(--ease) both}
.heros h1 .l:nth-child(2)>span{animation-delay:.12s;color:var(--ecaille-c)}
@keyframes monte{from{transform:translateY(105%)}}
.heros .intro{max-width:30em;margin:28px 0 34px;color:#C9C7BF;animation:fondu 1s var(--ease) .4s both}
.heros .actions{display:flex;flex-wrap:wrap;gap:12px;animation:fondu 1s var(--ease) .55s both}
@keyframes fondu{from{opacity:0;transform:translateY(14px)}}
.labels{display:flex;gap:18px;align-items:center;margin-top:44px;animation:fondu 1s var(--ease) .7s both}
.labels img{height:54px;width:54px;border-radius:50%;background:#fff;object-fit:contain;padding:3px}
.labels span{font-size:13px;color:#A9A49B;line-height:1.4;max-width:13em}
.plaque{position:relative;width:100%}
.plaque svg{width:100%;height:auto;overflow:visible}
.trace{fill:none;stroke:#F6D7A8;stroke-width:1.4;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(246,190,110,.85))}
.cote{font-family:var(--mono);font-size:9px;fill:#8F877D;letter-spacing:.04em}
.cote-l{stroke:#5F574F;stroke-width:.7}
.grav{font-family:var(--mono);font-size:12.5px;letter-spacing:.2em;fill:#F6DDB0}
.grav-ombre{font-family:var(--mono);font-size:12.5px;letter-spacing:.2em;fill:rgba(0,0,0,.6)}
@media (max-width:860px){.grav,.grav-ombre{font-size:15px;letter-spacing:.08em}}
.etincelle{fill:#FFF3DC;filter:drop-shadow(0 0 6px #FFC46B) drop-shadow(0 0 12px #FF9E2C)}
/* Marques */
.marques{padding:90px 0 80px}
.marques .tete-s{display:flex;justify-content:space-between;gap:40px;align-items:end;margin-bottom:46px}
.marques .tete-s p{max-width:28em;color:var(--gris);margin:0}
.logos{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--filet);border-left:1px solid var(--filet)}
.logos a,.logos .logo-s{display:flex;align-items:center;justify-content:center;height:130px;background:var(--blanc);border-right:1px solid var(--filet);border-bottom:1px solid var(--filet);padding:20px}
.logos img{max-height:74px;max-width:100%;object-fit:contain;filter:grayscale(1) contrast(1.1);opacity:.75;transition:filter .4s,opacity .4s}
.logos a:hover img,.logos .logo-s:hover img{filter:none;opacity:1}
/* Maison */
.maison{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start}
.maison figure{margin:0;position:sticky;top:110px}
.maison figure img{width:100%;aspect-ratio:4/5;object-fit:cover}
.maison figcaption{margin-top:10px;color:var(--gris)}
.pilier{padding:30px 0;border-top:1px solid var(--filet)}
.pilier:last-of-type{border-bottom:1px solid var(--filet)}
.pilier h3{margin-bottom:10px}.pilier p{color:var(--gris);margin:0;max-width:34em}
.lien{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px;margin-top:26px}
.lien:hover{color:var(--ecaille)}
/* Atelier */
.atelier .intro2{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:end;margin-bottom:56px}
.atelier .intro2 p{color:#C9C7BF;margin:0}
.postes{margin-top:22px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ecaille-c)}
.postes span+span::before{content:" / ";color:#6F665D;letter-spacing:0;margin:0 6px}
.galerie{display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:260px 260px;gap:10px}
.galerie img{width:100%;height:100%;object-fit:cover;filter:saturate(.92)}
.galerie .g1{grid-row:1/3}
.fiche{margin-top:70px;display:grid;grid-template-columns:1fr 1.4fr;gap:60px}
.fiche table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.fiche td{padding:14px 0;border-bottom:1px solid rgba(236,239,236,.12);vertical-align:top}
.fiche td:first-child{font-size:14px;color:#A9A49B;width:45%;padding-top:17px;padding-right:16px}
.fiche td:last-child{font-size:19px}
/* Vidéo */
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#000 center/cover;border:0;padding:0;cursor:pointer;overflow:hidden}
.yt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.55))}
.yt .jouer{position:absolute;left:24px;bottom:22px;z-index:2;display:flex;align-items:center;gap:12px;color:#fff;font-weight:600;font-size:15px}
.yt .jouer i{width:52px;height:52px;border-radius:50%;background:var(--ecaille);display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease)}
.yt:hover .jouer i{transform:scale(1.08)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.videos{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:30px}.videos .yt{grid-column:span 2}.videos .yt:nth-child(4),.videos .yt:nth-child(5){grid-column:span 3}
@media (max-width:860px){.videos{grid-template-columns:1fr}.videos .yt{grid-column:auto!important}}
/* Mains */
.mains{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:0;border-top:1px solid var(--filet)}
.main{padding:34px 30px 34px 0;border-bottom:1px solid var(--filet)}
.main+.main{padding-left:30px;border-left:1px solid var(--filet)}
.main:first-child blockquote{font-size:clamp(28px,2.8vw,38px)}
.main blockquote{margin:0 0 18px;font-size:22px;line-height:1.3;letter-spacing:-.01em;font-variation-settings:"wdth" 85}
.main b{display:block;font-weight:600}.main span{color:var(--gris);font-size:15px}
/* Visite */
.visite{display:grid;grid-template-columns:1.2fr 1fr;gap:0;background:var(--nuit2);color:var(--cristal)}
.visite img{width:100%;height:100%;object-fit:cover;min-height:420px}
.visite div{padding:64px 56px;align-self:center}
.visite p{color:#C9C7BF;margin:20px 0 28px}
.etapes{list-style:none;counter-reset:e;margin:50px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid rgba(236,239,236,.14)}
.etapes li{counter-increment:e;padding:30px 30px 0 0;position:relative}
.etapes li+li{padding-left:30px;border-left:1px solid rgba(236,239,236,.14)}
.etapes li::before{content:counter(e) ".";font-size:15px;font-weight:600;color:var(--ecaille-c);margin-right:8px}
.etapes li:not(:last-child)::after{content:"";position:absolute;right:-7px;top:36px;width:12px;height:12px;border-top:1px solid var(--ecaille);border-right:1px solid var(--ecaille);transform:rotate(45deg);background:var(--nuit);z-index:1}
.etapes b{display:inline;font-size:21px;font-weight:500;margin-bottom:8px}
.etapes p{color:#C9C7BF;margin:10px 0 0}
@media (max-width:860px){.etapes li::after{display:none}.etapes{grid-template-columns:1fr}.etapes li+li{padding-left:0;border-left:0;border-top:1px solid rgba(236,239,236,.14);margin-top:26px}}
/* Histoire */
.page-tete{padding:96px 0 60px}
.page-tete p{font-size:20px;color:var(--gris);max-width:34em;margin-top:22px}
.nuit .page-tete p{color:#C9C7BF}
.frise{position:relative;margin:30px 0 0;padding:0;list-style:none}
.frise::before{content:"";position:absolute;left:118px;top:8px;bottom:8px;width:1px;background:var(--filet)}
.frise li{display:grid;grid-template-columns:118px 1fr;gap:34px;padding:0 0 38px;position:relative}
.frise li::before{content:"";position:absolute;left:114px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--ecaille)}
.frise b[data-t]{font-size:19px;padding-top:6px}
.frise b{font-size:30px;font-weight:500;font-variation-settings:"wdth" 70;line-height:1;font-variant-numeric:tabular-nums}
.frise p{max-width:36em;margin:0;padding-top:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.duo img{width:100%;object-fit:cover}
.duo p{color:var(--gris)}
.nuit .duo p{color:#C9C7BF}
.panorama{width:100%;height:min(56vw,560px);object-fit:cover}
/* Valeurs */
.citation{font-size:clamp(28px,3.4vw,46px);line-height:1.12;letter-spacing:-.02em;font-variation-settings:"wdth" 75;max-width:22em;margin:0 0 16px}
.badges{display:flex;gap:26px;flex-wrap:wrap;margin-top:28px}
.badges figure{margin:0;display:flex;align-items:center;gap:14px}
.badges img{height:78px;width:78px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
.badges figcaption{font-size:14px;max-width:14em;line-height:1.4}
.env{list-style:none;padding:0;margin:26px 0 0}
.env li{padding:18px 0;border-top:1px solid var(--filet);color:var(--gris)}
/* Portrait */
.portraits{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.portraits figure{margin:0}
.portraits img{width:100%;aspect-ratio:2/3;object-fit:cover}
.portraits figcaption{padding-top:14px}
.portraits blockquote{margin:6px 0 0;font-size:19px;line-height:1.35}
/* News */
.articles{list-style:none;margin:0;padding:0;border-top:1px solid var(--filet)}
.articles li{display:grid;grid-template-columns:120px 200px 1fr;gap:30px;padding:26px 0;border-bottom:1px solid var(--filet);align-items:start}
.articles time{font-family:var(--mono);font-size:12.5px;color:var(--gris);padding-top:4px}
.articles img{width:200px;height:130px;object-fit:cover;background:#fff}
.articles h3{margin-bottom:8px}
.articles p{color:var(--gris);margin:0 0 8px}
.articles a{font-size:14px;display:inline-block;padding:10px 0}
/* Recrutement */
.voies{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--filet)}
.voie{padding:34px 28px 34px 0;border-bottom:1px solid var(--filet)}
.voie+.voie{padding-left:28px;border-left:1px solid var(--filet)}
.voie p{color:var(--gris)}
/* Contact */
.contact{display:grid;grid-template-columns:1.25fr 1fr;gap:70px}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.champ{display:flex;flex-direction:column;gap:7px}
.champ.large{grid-column:1/-1}
label,.leg{font-size:14px;font-weight:600}
input,select,textarea{font:16px var(--sans);color:var(--encre);background:var(--blanc);border:1px solid rgba(26,21,18,.28);border-radius:2px;padding:13px 14px;transition:border-color .2s,box-shadow .2s}
input:hover,select:hover,textarea:hover{border-color:rgba(26,21,18,.5)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--encre);box-shadow:0 0 0 3px rgba(201,130,47,.35)}
textarea{min-height:130px;resize:vertical}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix label{font-weight:500;display:flex;align-items:center;gap:8px;border:1px solid rgba(26,21,18,.28);border-radius:2px;padding:10px 14px;cursor:pointer;background:var(--blanc)}
.choix input{accent-color:var(--encre);margin:0}
.choix label:has(input:checked){border-color:var(--encre);box-shadow:inset 0 0 0 1px var(--encre)}
fieldset{border:0;padding:0;margin:0;min-width:0;}
legend{padding:0;margin-bottom:8px}
fieldset{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.fichier{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.fichier .btn{padding:12px 18px;font-size:14px;cursor:pointer}.fichier input:focus-visible+.btn{outline:2px solid #8A4F14;outline-offset:3px}.fichier .noms{font-size:14px;color:var(--gris)}
.erreur{color:#A1281B;font-size:13.5px;min-height:0}
.champ.ko input,.champ.ko textarea{border-color:#A1281B}
.ok{grid-column:1/-1;background:#E3EAD9;border:1px solid #7C9362;padding:16px;display:none}
.coord dl{margin:0}
.coord dt{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin-top:22px}
.sig{font-weight:600;color:#8A5A1E;margin:0 0 10px}.nuit .sig{color:var(--ecaille-c)}
.coord dd{margin:4px 0 0;font-size:18px}
/* Pied */
.pied{background:var(--nuit);color:#B9B4AB;padding:70px 0 40px;font-size:15px}
.pied .grille{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
.pied a{color:var(--cristal);text-decoration:none}.pied a:hover{color:var(--ecaille-c)}
.pied ul{list-style:none;margin:0;padding:0}.pied li{margin:6px 0}
.pied .bas{margin-top:50px;padding-top:22px;border-top:1px solid rgba(236,239,236,.1);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px}
.fb{display:inline-flex;align-items:center;gap:10px;margin-top:16px}
.fb svg{width:20px;height:20px}
/* Conseiller */
.cs-bouton{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:12px;background:var(--nuit);color:var(--cristal);border:1px solid rgba(232,174,98,.5);border-radius:40px;padding:8px 20px 8px 8px;cursor:pointer;box-shadow:0 14px 34px rgba(10,6,3,.35);font-family:var(--sans);text-align:left}
.cs-bouton i{width:42px;height:42px;border-radius:50%;background:var(--ecaille);display:flex;align-items:center;justify-content:center;flex:none}
.cs-bouton b{display:block;font-size:14px}.cs-bouton small{display:block;font-size:12.5px;color:#C9C7BF}
.cs-bulle{position:fixed;right:22px;bottom:92px;z-index:60;max-width:300px;background:var(--blanc);color:var(--encre);padding:16px 40px 16px 18px;border-radius:4px;box-shadow:0 18px 40px rgba(10,6,3,.25);font-size:15px;display:none}
.cs-bulle.on{display:block;animation:fondu .5s var(--ease)}
body{padding-bottom:0}
.cs-bulle button{position:absolute;right:8px;top:8px;background:none;border:0;font-size:18px;cursor:pointer;color:var(--gris);width:28px;height:28px}
.cs-panneau{position:fixed;right:22px;bottom:22px;z-index:70;width:min(400px,calc(100vw - 24px));max-height:min(620px,calc(100vh - 40px));background:var(--blanc);border-radius:6px;box-shadow:0 30px 70px rgba(10,6,3,.4);display:none;flex-direction:column;overflow:hidden}
.cs-panneau.on{display:flex;animation:fondu .4s var(--ease)}
.cs-haut{background:var(--nuit);color:var(--cristal);padding:16px 18px;display:flex;align-items:center;gap:12px}
.cs-haut b{display:block}.cs-haut small{color:var(--ecaille-c);font-size:12.5px}
.cs-haut button{margin-left:auto;background:none;border:1px solid rgba(236,239,236,.3);color:var(--cristal);border-radius:2px;padding:6px 10px;cursor:pointer;font:13px var(--sans)}
.cs-fil{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:4px;font-size:15px;line-height:1.5}
.msg.ia{background:var(--cristal)}.msg.moi{background:var(--nuit);color:var(--cristal);align-self:flex-end}
.cs-choix{display:flex;flex-direction:column;gap:8px}
.cs-choix button{text-align:left;background:#fff;border:1px solid rgba(26,21,18,.22);border-radius:3px;padding:11px 13px;font:500 14.5px var(--sans);cursor:pointer;color:var(--encre)}
.cs-choix button:hover{border-color:var(--ecaille);background:#FBF6EE}
.apercu{position:fixed;left:14px;bottom:14px;z-index:30;font-family:var(--mono);font-size:11px;background:var(--blanc);border:1px solid var(--filet);padding:6px 10px;border-radius:20px}
/* Apparitions */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.vu{opacity:1;transform:none}
/* Tablette et mobile */
.menu .m-projet{display:none}
.tete.compact .menu{display:none}.tete.compact .burger{display:block}.tete.compact>.wrap>.btn{display:none}
body.menu-ouvert::after{content:"";position:fixed;inset:72px 0 0;background:rgba(10,6,3,.55);z-index:35}
.tete.compact .menu.ouvert{display:flex;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:var(--nuit);padding:16px 28px 26px;gap:4px}
.tete.compact .menu.ouvert a{font-size:18px;padding:10px 0}.tete.compact .menu.ouvert .m-projet{display:inline-flex;margin-top:12px;color:var(--nuit);font-size:16px;padding:14px 22px;opacity:1;align-self:start;border:0}
body.menu-ouvert .cs-bouton,body.menu-ouvert .cs-bulle{display:none}
@media (max-width:1080px){
 .logos{grid-template-columns:repeat(4,1fr)}}
@media (max-width:860px){section{padding:76px 0}.wrap{padding:0 20px}
 .heros{padding:44px 0 64px}.heros .wrap{grid-template-columns:1fr;gap:20px}.plaque{order:-1;margin:0 -8px}
 .maison,.atelier .intro2,.fiche,.duo,.contact,.visite{grid-template-columns:1fr;gap:34px}
 .maison figure{position:static}.maison figure img{aspect-ratio:4/3}
 .marques .tete-s{flex-direction:column;align-items:start}
 .galerie{grid-template-columns:1fr 1fr;grid-template-rows:200px 160px 160px}.galerie .g1{grid-row:auto;grid-column:1/-1}
 .mains,.voies,.portraits{grid-template-columns:1fr}.main+.main,.voie+.voie{padding-left:0;border-left:0}
 .visite div{padding:40px 22px}.visite img{min-height:260px}
 .articles li{grid-template-columns:1fr;gap:12px}.articles img{width:100%;height:190px}
 form{grid-template-columns:1fr}
 .frise::before{left:70px}.frise li{grid-template-columns:70px 1fr;gap:22px}.frise li::before{left:66px}.frise b{font-size:22px}
 .pied .grille{grid-template-columns:1fr}
 body:not(.passe) .cs-bouton{opacity:0;pointer-events:none;transform:translateY(20px)}.cs-bouton{transition:opacity .4s,transform .4s}
 .cs-bouton span{display:none}.cs-bouton{padding:6px;border-radius:50%}.cs-bouton i{width:44px;height:44px}.apercu{display:none}
 .cs-panneau{right:12px;left:12px;width:auto;bottom:12px}.cs-bulle{right:12px;left:auto;max-width:280px;bottom:78px}.heros{padding-bottom:96px}
 .logos>*:last-child{grid-column:1/-1}
 .logos{grid-template-columns:repeat(2,1fr)}.logos a,.logos .logo-s{height:100px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

nemos los gestos tradicionales y avanzamos con nuevos métodos de producción, para fabricar mejor.", "Wir bewahren die traditionellen Handgriffe und entwickeln neue Fertigungsmethoden, um besser zu produzieren.", "Conserviamo i gesti tradizionali e avanziamo con nuovi metodi di produzione, per produrre meglio.", "伝統的な技を守りながら、新しい生産方法を取り入れ、より良いものづくりを目指しています。"], "at_h": ["Dans l'atelier", "Inside the workshop", "En el taller", "In der Werkstatt", "Nell'atelier", "工房の中で"], "at_p": ["L'acétate arrive en plaque. Il repart en monture, après être passé entre de nombreuses mains et machines.", "Acetate arrives in sheets. It leaves as a frame, after passing through many hands and machines.", "El acetato llega en planchas. Sale convertido en montura, tras pasar por muchas manos y máquinas.", "Das Acetat kommt als Platte an. Es verlässt uns als Fassung, nachdem es durch viele Hände und Maschinen gegangen ist.", "L'acetato arriva in lastre. Riparte come montatura, dopo essere passato da molte mani e macchine.", "アセテートは板の状態で届き、多くの職人の手と機械を経て、フレームとなって出荷されます。"], "at_d1": ["Découpe", "Cutting", "Corte", "Zuschnitt", "Taglio", "切断"], "at_d2": ["Usinage", "Machining", "Mecanizado", "Fräsen", "Lavorazione", "切削加工"], "at_d3": ["Shootage", "Tumbling", "Pulido en tambor", "Trommeln", "Burattatura", "バレル研磨"], "at_d4": ["Finition", "Finishing", "Acabado", "Endbearbeitung", "Finitura", "仕上げ"], "fiche_h": ["Fiche technique de la maison", "The company at a glance", "Ficha técnica de la casa", "Steckbrief des Hauses", "Scheda tecnica della casa", "会社概要"], "f_creation": ["Création", "Founded", "Fundación", "Gegründet", "Fondazione", "設立"], "f_equipe": ["Collaborateurs", "Employees", "Empleados", "Mitarbeitende", "Collaboratori", "従業員数"], "f_equipe_v": ["environ 50", "about 50", "unos 50", "rund 50", "circa 50", "約50名"], "f_usinage": ["Centres d'usinage", "Machining centres", "Centros de mecanizado", "Bearbeitungszentren", "Centri di lavoro", "マシニングセンタ"], "f_usinage_v": ["20 (3, 4 et 5 axes)", "20 nufacture Tour, Optisun apre le sue porte. Un’occasione per vedere nascere montature di creatori, di qualità e complesse.", "マニュファクチュール・ツアーの期間中、工場を公開しています。高品質で複雑なデザイナーズフレームが生まれる現場をご覧いただけます。"], "visite_cta": ["Découvrir le Manufacture Tour", "Discover the Manufacture Tour", "Descubrir el Manufacture Tour", "Den Manufacture Tour entdecken", "Scoprire il Manufacture Tour", "マニュファクチュール・ツアーを見る"], "hi_h": ["L'histoire d'une entreprise familiale d'Oyonnax", "The story of a family company from Oyonnax", "La historia de una empresa familiar de Oyonnax", "Die Geschichte eines Familienunternehmens aus Oyonnax", "La storia di un'azienda di famiglia di Oyonnax", "オヨナの家族経営企業の物語"], "hi_lead": ["Fabricant français depuis 1985.", "French manufacturer since 1985.", "Fabricante francés desde 1985.", "Französischer Hersteller seit 1985.", "Produttore francese dal 1985.", "1985年創業のフランスのメーカー。"], "y1980": ["Edmond Maitre, le fondateur, décide de créer ses propres lunettes. Tout commence dans son garage.", "Edmond Maitre, the founder, decides to create his own glasses. It all begins in his garage.", "Edmond Maitre, el fundador, decide crear sus propias gafas. Todo empieza en su garaje.", "Gründer Edmond Maitre beschließt, eigene Brillen zu fertigen. Alles beginnt in seiner Garage.", "Edmond Maitre, il fondatore, decide di creare i propri occhiali. Tutto inizia nel suo garage.", "創業者エドモン・メートルが自らの眼鏡づくりを決意。すべてはガレージから始まりました。"], "y1985": ["L'entreprise naît. Elle compte 10 salariés.", "The company is born, with 10 employees.", "Nace la empresa, con 10 empleados.", "Das Unternehmen entsteht, mit 10 Beschäftigten.", "Nasce l'azienda, con 10 dipendenti.", "会社設立。従業員は10名でした。"], "y1990": ["Son fils Olivier rejoint l'entreprise. Il comprend que l'outil de production doit se moderniser, et l'usine fabrique ses propres machines à commande numérique.", "His son Olivier joins the company. He sees that production must modernise, and the factory builds its own CNC machines.", "Su hijo Olivier se une a la empresa. Entiende que la producción debe modernizarse, y la fábrica construye sus propias máquinas de control numérico.", "Sein Sohn Olivier steigt ein. Er erkennt, dass die Produktion modernisiert werden muss, und die Fabrik baut eigene CNC-Maschinen.", "Il figlio Olivier entra in azienda. Capisce che la produzione va modernizzata, e la fabbrica costruisce le proprie macchine a controllo numerico.", "息子オリヴィエが入社。生産設備の近代化が必要だと考え、自社でNC工作機械を製作します。"], "y2013": ["L'usine s'agrandit avec un bâtiment écoresponsable, à ossature bois venue du Jura.", "The factory expands with an eco-friendly building, framed in wood from the Jura.", "La fábrica se amplía con un edificio ecorresponsable, con estructura de madera del Jura.", "Die Fabrik wächst um ein nachhaltiges Gebäude mit Holzrahmen aus dem Jura.", "La fabbrica si amplia con un edificio ecosostenibile, con struttura in legno del Giura.", "工場を拡張。ジュラ産木材の骨組みによる環境配慮型の建物です。"], "y2014": ["Optisun reçoit le label Entreprise du Patrimoine Vivant, renouvelé en 2022.", "Optisun is awarded the Living Heritage Company label, renewed in 2022.", "Optisun obtiene el sello Empresa del Patrimonio Vivo, renovado en 2022.", "Optisun erhält das Label „Unternehmen des lebendigen Erbes“, 2022 erneuert.", "Optisun ottiene il marchio Impresa del Patrimonio Vivente, rinnovato nel 2022.", "EPV（無形文化財企業）に認定され、2022年に更新。"], "y2025": ["Optisun obtient le label Origin'Ain, qui distingue les savoir-faire de l'Ain.", "Optisun earns the Origin'Ain label, which honours know-how from the Ain region.", "Optisun obtiene el sello Origin'Ain, que distingue los saberes del Ain.", "Optisun erhält das Label Origin'Ain für Handwerkskunst aus dem Département Ain.", "Optisun ottiene il marchio Origin'Ain, che premia i saper fare dell'Ain.", "アン県の技を称える Origin'Ain ラベルを取得。"], "ynow": ["Environ 50 collaborateurs. Une maison connue dans le monde de la lunette pour son savoir-faire et son expertise.", "About 50 people. A company known in the eyewear world for its know-how and expertise.", "Unos 50 empleados. Una casa conocida en el mundo de las gafas por su saber hacer y su experiencia.", "Rund 50 Mitarbeitende. Ein Haus, das in der Brillenwelt für sein Können bekannt ist.", "Circa 50 collaboratori. Una casa conosciuta nel mondo dell’occhialeria per il suo saper fare.", "従業員は約50名。技術と専門性で眼鏡業界に知られる存在となりました。"], "ynow_t": ["Aujourd'hui", "Today", "Hoy", "Heute", "Oggi", "現在"], "murs_h": ["L'histoire d'un héritage immobilier", "A building with a past", "La historia de un patrimonio inmobiliario", "Die Geschichte der Gebäude", "La storia di un patrimonio immobiliare", "建物に刻まれた歴史"], "murs_1": ["L'usine appartenait autrefois à la famille Deslile, qui y fabriquait des branches de lunettes.", "The factory once belonged to the Deslile family, who made spectacle temples there.", "La fábrica perteneció a la familia Deslile, que fabricaba allí varillas de gafas.", "Die Fabrik gehörte einst der Familie Deslile, die dort Brillenbügel herstellte.", "La fabbrica apparteneva alla famiglia Deslile, che vi produceva aste per occhiali.", "かつてはデリル家の所有で、眼鏡のテンプルが作られていました。"], "murs_2": ["Le bâtiment voisin, construit à la fin du XIXe siècle, abritait la fabrique de barrettes Barreau. Pour limiter les incendies dus au celluloïd, très inflammable, ses box n'étaient pas reliés à la charpente.", "The neighbouring building, from the late 19th century, housed the Barreau hair-clip factory. To limit fires from highly flammable celluloid, its bays were not connected to the roof frame.", "El edificio vecino, de finales del siglo XIX, albergaba la fábrica de pasadores Barreau. Para limitar los incendios del celuloide, muy inflamable, sus boxes no estaban unidos a la armadura.", "Das Nachbargebäude vom Ende des 19. Jahrhunderts beherbergte die Haarspangenfabrik Barreau. Wegen des leicht entflammbaren Zelluloids waren die Boxen nicht mit dem Dachstuhl verbunden.", "L’edificio vicino, di fine Ottocento, ospitava la fabbrica di fermagli Barreau. Per limitare gli incendi dovuti alla celluloide, molto infiammabile, i box non erano collegati alla capriata.", "隣接する19世紀末の建物は、バロー社のヘアクリップ工場でした。燃えやすいセルロイドによる火災を防ぐため、作業区画は屋根組みとつながっていませんでした。"], "murs_3": ["La maison des anciens propriétaires est devenue nos bureaux, et une extension moderne mêle aujourd'hui vieux murs et architecture contemporaine.", "The former owners' house became our offices, and a modern extension now blends old walls with contemporary architecture.", "La casa de los antiguos propietarios se convirtió en nuestras oficinas, y una ampliación moderna mezcla hoy muros antiguos y arquitectura contemporánea.", "Das Wohnhaus der früheren Besitzer wurde zu unseren Büros, und ein moderner Anbau verbindet heute alte Mauern mit zeitgenössischer Architektur.", "La casa dei vecchi proprietari è diventata i nostri uffici, e un’estensione moderna unisce oggi vecchi muri e architettura contemporanea.", "旧所有者の住居はオフィスに生まれ変わり、現代的な増築部分が古い壁と調和しています。"], "va_h": ["Notre savoir-faire français", "Our French know-how", "Nuestro saber hacer francés", "Unser französisches Können", "Il nostro saper fare francese", "私たちのフランスの技"], "va_p": ["Trouver chaque jour le juste équilibre entre innovations technologiques et gestes acquis au fil du temps, pour livrer des montures en acétate de qualité et uniques.", "Every day, striking the right balance between technological innovation and skills built up over time, to deliver unique, quality acetate frames.", "Encontrar cada día el equilibrio justo entre innovación tecnológica y gestos adquiridos con el tiempo, para entregar monturas de acetato de calidad y únicas.", "Jeden Tag das richtige Gleichgewicht zwischen technischer Innovation und gewachsenem Können finden, für einzigartige, hochwertige Acetatfassungen.", "Trovare ogni giorno il giusto equilibrio tra innovazione tecnologica e gesti acquisiti nel tempo, per consegnare montature in acetato di qualità e uniche.", "技術革新と長年培ってきた技のバランスを日々追求し、上質で唯一無二のアセテートフレームをお届けします。"], "va_quote": ["« C’est grâce à la modernisation que l’on produit toujours en France »", "“It is thanks to modernisation that we still produce in France”", "«Gracias a la modernización seguimos produciendo en Francia»", "„Dank der Modernisierung produzieren wir immer noch in Frankreich“", "«È grazie alla modernizzazione che produciamo ancora in Francia»", "「近代化したからこそ、今もフランスで生産できるのです」"], "va_quote_a": ["Olivier Maitre, gérant", "Olivier Maitre, manager", "Olivier Maitre, gerente", "Olivier Maitre, Geschäftsführer", "Olivier Maitre, amministratore", "オリヴィエ・メートル（経営者）"], "va_inno": ["Équipée de 20 centres d'usinage (3, 4 et 5 axes) et de lasers de découpe et de marquage, l'usine a augmenté sa production et la technicité de ses fabrications. Son bureau d'études et son bureau des méthodes s'adaptent aux souhaits de chaque client.", "With 20 machining centres (3, 4 and 5 axes) and cutting and marking lasers, the factory has increased its output and technical level. Its design and methods offices adapt to each client’s wishes.", "Con 20 centros de mecanizado (3, 4 y 5 ejes) y láseres de corte y marcado, la fábrica ha aumentado su producción y su nivel técnico. Sus oficinas técnica y de métodos se adaptan a cada cliente.", "Mit 20 Bearbeitungszentren (3, 4 und 5 Achsen) sowie Schneid- und Markierlasern hat die Fabrik ihre Produktion und Präzision gesteigert. Konstruktion und Arbeitsvorbereitung passen sich jedem Kunden an.", "Con 20 centri di lavoro (3, 4 e 5 assi) e laser di taglio e marcatura, la fabbrica ha aumentato la produzione e la tecnicità. Ufficio tecnico e ufficio metodi si adattano a ogni cliente.", "20台のマシニングセンタ（3・4・5軸）と切断・刻印用レーザーを備え、生産量と技術力を高めてきました。設計・生産技術部門が各顧客のご要望に対応します。"], "env_h": ["Nos actions pour l'environnement", "Our environmental commitments", "Nuestras acciones por el medio ambiente", "Unser Einsatz für die Umwelt", "Le nostre azioni per l'ambiente", "環境への取り組み"], "env_1": ["Un bâtiment écoresponsable depuis 2013 : ossature bois du Jura, conception thermique, acoustique et lumineuse. Le chauffage consomme 20 kWh par m² et par an.", "An eco-friendly building since 2013: Jura timber frame, designed for heat, sound and light. Heating uses 20 kWh per m² per year.", "Un edificio ecorresponsable desde 2013: estructura de madera del Jura, diseño térmico, acústico y luminoso. La calefacción consume 20 kWh por m² al año.", "Ein nachhaltiges Gebäude seit 2013: Holzrahmen aus dem Jura, durchdacht für Wärme, Akustik und Licht. Die Heizung verbraucht 20 kWh pro m² und Jahr.", "Un edificio ecosostenibile dal 2013: struttura in legno del Giura, progettazione termica, acustica e luminosa. Il riscaldamento consuma 20 kWh per m² all’anno.", "2013年からの環境配慮型建物：ジュラ産木材の骨組み、断熱・音響・採光を考えた設計。暖房消費は年間1㎡あたり20kWhです。"], "env_2": ["Depuis 2016, toute notre flotte automobile est électrique.", "Since 2016, our entire vehicle fleet has been electric.", "Desde 2016, toda nuestra flota de vehículos es eléctrica.", "Seit 2016 fahren alle unsere Firmenfahrzeuge elektrisch.", "Dal 2016 tutta la nostra flotta auto è elettrica.", "2016年から、社用車はすべて電気自動車です。"], "env_3": ["Nos prochains chantiers : recycler toujours plus d'acétate, rénover et isoler le bâtiment historique.", "Next steps: recycling ever more acetate, renovating and insulating the historic building.", "Próximos retos: reciclar cada vez más acetato, renovar y aislar el edificio histórico.", "Nächste Vorhaben: noch mehr Acetat recyceln, das historische Gebäude sanieren und dämmen.", "I prossimi cantieri: riciclare sempre più acetato, rinnovare e isolare l’edificio storico.", "今後の課題：アセテートのリサイクル拡大、歴史ある建物の改修と断熱。"], "po_h": ["Portrait des mains", "Portrait of the hands", "Retrato de las manos", "Porträt der Hände", "Ritratto delle mani", "職人の手"], "po_p": ["Les femmes et les hommes qui façonnent chaque monture, poste après poste.", "The women and men who shape every frame, station after station.", "Las mujeres y los hombres que dan forma a cada montura, puesto tras puesto.", "Die Frauen und Männer, die jede Fassung formen, Station für Station.", "Le donne e gli uomini che plasmano ogni montatura, postazione dopo postazione.", "工程ごとに、一本一本のフレームを形づくる職人たち。"], "news_h": ["La vie de l'usine", "Life at the factory", "La vida de la fábrica", "Das Leben in der Fabrik", "La vita della fabbrica", "工場の日々"], "news_more": ["Lire l'article d'origine", "Read the original article", "Leer el artículo original", "Originalartikel lesen", "Leggi l'articolo originale", "元の記事を読む"], "jobs_h": ["Vous êtes branche et lunette ?", "Are you into frames and eyewear?", "¿Le apasionan las monturas y las gafas?", "Brillen sind Ihre Leidenschaft?", "Siete appassionati di montature e occhiali?", "眼鏡づくりに興味はありますか？"], "jobs_p": ["Rejoignez une équipe qui ne rate jamais une occasion de se retrouver : défi sportif, brunch de Noël, soirée d'été.", "Join a team that never misses a chance to get together: sports challenge, Christmas brunch, summer party.", "Únase a un equipo que no pierde ocasión de reunirse: reto deportivo, brunch de Navidad, fiesta de verano.", "Werden Sie Teil eines Teams, das jede Gelegenheit zum Feiern nutzt: Sportwettbewerb, Weihnachtsbrunch, Sommerfest.", "Entrate in una squadra che non perde occasione per ritrovarsi: sfida sportiva, brunch di Natale, festa d’estate.", "スポーツ大会、クリスマスブランチ、夏のパーティーなど、仲間と過ごす時間を大切にするチームです。"], "job1_h": ["Nos offres d'emploi", "Our job offers", "Nuestras ofertas de empleo", "Unsere Stellenangebote", "Le nostre offerte di lavoro", "求人情報"], "job1_t": ["1 offre en ligne : responsable bureau d'études (H/F).", "1 open position: head of design office (M/F).", "1 oferta publicada: responsable de oficina técnica (H/M).", "1 offene Stelle: Leitung Konstruktionsbüro (m/w/d).", "1 offerta: responsabile ufficio tecnico (M/F).", "募集中：設計部門責任者（男女不問）1名"], "job1_c": ["Voir l'offre", "See the offer", "Ver la oferta", "Angebot ansehen", "Vedi l'offerta", "求人を見る"], "job_poste": ["Nous recherchons aussi des opérateurs et opératrices sur lunettes (résine, rouleaux, tonneaux…) et des techniciens et techniciennes de maintenance.", "We are also looking for eyewear operators (resin, rollers, tumbling barrels…) and maintenance technicians.", "También buscamos operarios y operarias de gafas (resina, rodillos, tambores…) y técnicos de mantenimiento.", "Wir suchen außerdem Bediener/innen in der Brillenfertigung (Harz, Walzen, Trommeln…) und Instandhaltungstechniker/innen.", "Cerchiamo anche operatori e operatrici sugli occhiali (resina, rulli, buratti…) e tecnici di manutenzione.", "眼鏡製造オペレーター（樹脂、ローラー、バレルなど）と保守技術者も募集しています。"], "job2_h": ["Une demande de stage", "An internship request", "Una solicitud de prácticas", "Eine Praktikumsanfrage", "Una richiesta di stage", "インターンシップ"], "job2_t": ["Vos premiers pas dans la lunette ? Marchons ensemble.", "Your first steps in eyewear? Let’s walk together.", "¿Sus primeros pasos en las gafas? Caminemos juntos.", "Ihre ersten Schritte in der Brillenwelt? Gehen wir sie gemeinsam.", "I vostri primi passi nell’occhiale? Camminiamo insieme.", "眼鏡の世界への第一歩を、一緒に。"], "job3_h": ["Candidature spontanée", "Speculative application", "Candidatura espontánea", "Initiativbewerbung", "Candidatura spontanea", "自由応募"], "job3_t": ["Rien ne vous arrête ? Soyez spontané.", "Nothing stops you? Be spontaneous.", "¿Nada le detiene? Sea espontáneo.", "Nichts hält Sie auf? Bewerben Sie sich einfach.", "Niente vi ferma? Siate spontanei.", "思い立ったら、気軽にご応募ください。"], "job_mail": ["Écrire à recrutement@optisun.fr", "Write to recrutement@optisun.fr", "Escribir a recrutement@optisun.fr", "An recrutement@optisun.fr schreiben", "Scrivere a recrutement@optisun.fr", "recrutement@optisun.fr へ送る"], "co_h": ["Parlons de votre collection", "Let's talk about your collection", "Hablemos de su colección", "Sprechen wir über Ihre Kollektion", "Parliamo della vostra collezione", "コレクションについてご相談ください"], "co_p": ["Décrivez votre projet en quelques lignes. Notre équipe revient vers vous pour l'étudier ensemble.", "Describe your project in a few lines. Our team will get back to you to look at it together.", ipes.", "Cutting, machining, tumbling, finishing: your frames pass through the hands of our teams.", "Corte, mecanizado, pulido en tambor, acabado: sus monturas pasan por las manos de nuestros talleres.", "Zuschnitt, Fräsen, Trommeln, Endbearbeitung: Ihre Fassungen gehen durch die Hände unserer Werkstätten.", "Taglio, lavorazione, burattatura, finitura: le vostre montature passano per le mani dei nostri reparti.", "切断、切削、バレル研磨、仕上げ。工房の職人たちの手を経てフレームが完成します。"], "fo_tel": ["Téléphone (facultatif)", "Phone (optional)", "Teléfono (opcional)", "Telefon (optional)", "Telefono (facoltativo)", "電話番号（任意）"], "fo_fichier": ["Vos dessins (facultatif)", "Your drawings (optional)", "Sus dibujos (opcional)", "Ihre Zeichnungen (optional)", "I vostri disegni (facoltativo)", "図面（任意）"], "fo_fichier_aide": ["PDF, DXF ou image", "PDF, DXF or image", "PDF, DXF o imagen", "PDF, DXF oder Bild", "PDF, DXF o immagine", "PDF・DXF・画像"], "video_n": ["Vidéo", "Video", "Vídeo", "Video", "Video", "動画"], "fo_fichier_btn": ["Joindre vos dessins", "Attach your drawings", "Adjuntar sus dibujos", "Zeichnungen anhängen", "Allegare i disegni", "図面を添付"], "cs_ecrire": ["Écrire à Optisun", "Write to Optisun", "Escribir a Optisun", "An Optisun schreiben", "Scrivere a Optisun", "オプティサンへメール"], "fermer_menu": ["Fermer", "Close", "Cerrar", "Schließen", "Chiudi", "閉じる"], "cs_nom": ["Optisun Conseil", "Optisun Advice", "Optisun Asesor", "Optisun Beratung", "Optisun Consiglio", "オプティサン・アドバイス"], "cs_sous": ["Je vous oriente", "I can guide you", "Le oriento", "Ich helfe Ihnen weiter", "Vi oriento", "ご案内します"], "cs_bulle": ["Un projet de collection ? Je vous oriente en quelques questions.", "A collection in mind? I can guide you in a few questions.", "¿Un proyecto de colección? Le oriento en pocas preguntas.", "Eine Kollektion geplant? Ich helfe Ihnen mit wenigen Fragen weiter.", "Un progetto di collezione? Vi oriento in poche domande.", "コレクションのご計画ですか？いくつかの質問でご案内します。"], "cs_virtuel": ["Assistant virtuel", "Virtual assistant", "Asistente virtual", "Virtueller Assistent", "Assistente virtuale", "バーチャルアシスタント"], "cs_hello": ["Bonjour, je suis l'assistant virtuel d'Optisun. Que souhaitez-vous faire ?", "Hello, I am Optisun's virtual assistant. What would you like to do?", "Hola, soy el asistente virtual de Optisun. ¿Qué desea hacer?", "Guten Tag, ich bin der virtuelle Assistent von Optisun. Was möchten Sie tun?", "Buongiorno, sono l'assistente virtuale di Optisun. Cosa desiderate fare?", "こんにちは、オプティサンのバーチャルアシスタントです。どのようなご用件でしょうか？"], "cs_q1": ["Faire fabriquer ma collection", "Have my collection made", "Fabricar mi colección", "Meine Kollektion fertigen lassen", "Far produrre la mia collezione", "コレクションを製造したい"], "cs_a1": ["Avec plaisir. Optisun fabrique des montures optiques et solaires en acétate et combinées. Notre bureau d'études et notre bureau des méthodes étudient votre dessin et l'adaptent à la fabrication. Quel type de montures avez-vous en tête ?", "Gladly. Optisun makes optical and sun frames in acetate and combined materials. Our design and methods offices study your drawing and adapt it for production. What type of frames do you have in mind?", "Con mucho gusto. Optisun fabrica monturas ópticas y solares de acetato y combinadas. Nuestras oficinas técnica y de métodos estudian su dibujo y lo adaptan a la fabricación. ¿Qué tipo de monturas tiene en mente?", "Sehr gern. Optisun fertigt Korrektions- und Sonnenbrillenfassungen aus Acetat und Materialkombinationen. Konstruktion und Arbeitsvorbereitung prüfen Ihre Zeichnung und machen sie fertigungsreif. An welche Fassungen denken Sie?", "Con piacere. Optisun produce montature da vista e da sole in acetato e combinate. Ufficio tecnico e ufficio metodi studiano il vostro disegno e lo adattano alla produzione. Che tipo di montature avete in mente?", "喜んで。オプティサンはアセテートおよびコンビネーション素材の眼鏡・サングラスフレームを製造しています。設計・生産技術部門が図面を検討し、製造に合わせて調整します。どのようなフレームをお考えですか？"], "cs_a1b": ["Parfait. Le plus simple est de nous décrire votre projet : je pré-remplis le formulaire pour vous.", "Perfect. The easiest is to describe your project: I will pre-fill the form for you.", "Perfecto. Lo más sencillo es describirnos su proyecto: le relleno el formulario.", "Perfekt. Am einfachsten beschreiben Sie uns Ihr Projekt: Ich fülle das Formular für Sie vor.", "Perfetto. La cosa più semplice è descriverci il progetto: vi precompilo il modulo.", "かしこまりました。プロジェクトの内容をお知らせください。フォームに入力しておきます。"], "cs_go_form": ["Ouvrir le formulaire", "Open the form", "Abrir el formulario", "Formular öffnen", "Aprire il modulo", "フォームを開く"], "cs_q2": ["Comprendre votre savoir-faire", "Understand your know-how", "Conocer su saber hacer", "Ihr Können verstehen", "Capire il vostro saper fare", "技術について知りたい"], "cs_a2": ["L'usine compte 20 centres d'usinage (3, 4 et 5 axes), des lasers de découpe et de marquage, et environ 50 collaborateurs : découpe, usinage, shootage, finition. Optisun est labellisée Entreprise du Patrimoine Vivant depuis 2014.", "The factory has 20 machining centres (3, 4 and 5 axes), cutting and marking lasers, and about 50 people: cutting, machining, tumbling, finishing. Optisun has held the Living Heritage Company label since 2014.", "La fábrica cuenta con 20 centros de mecanizado (3, 4 y 5 ejes), láseres de corte y marcado y unos 50 empleados: corte, mecanizado, pulido en tambor, acabado. Optisun tiene el sello Empresa del Patrimonio Vivo desde 2014.", "Die Fabrik verfügt über 20 Bearbeitungszentren (3, 4 und 5 Achsen), Schneid- und Markierlaser und rund 50 Mitarbeitende: Zuschnitt, Fräsen, Trommeln, Endbearbeitung. Optisun trägt seit 2014 das Label „Unternehmen des lebendigen Erbes“.", "La fabbrica conta 20 centri di lavoro (3, 4 e 5 assi), laser di taglio e marcatura e circa 50 collaboratori: taglio, lavorazione, burattatura, finitura. Optisun ha il marchio Impresa del Patrimonio Vivente dal 2014.", "工場には20台のマシニングセンタ（3・4・5軸）、切断・刻印用レーザー、約50名の従業員がいます。切断、切削、バレル研磨、仕上げまで一貫して行います。2014年からEPV認定企業です。"], "cs_go_atelier": ["Voir l'atelier", "See the workshop", "Ver el taller", "Werkstatt ansehen", "Vedere l'atelier", "工房を見る"], "cs_q3": ["Visiter l'usine", "Visit the factory", "Visitar la fábrica", "Die Fabrik besuchen", "Visitare la fabbrica", "工場を見学したい"], "cs_a3": ["Optisun ouvre ses portes lors du Manufacture Tour, sur réservation. Pour une visite professionnelle, écrivez-nous.", "Optisun opens its doors during the Manufacture Tour, by booking. For a professional visit, write to us.", "Optisun abre sus puertas durante el Manufacture Tour, con reserva. Para una visita profesional, escríbanos.", "Optisun öffnet beim Manufacture Tour seine Türen, mit Anmeldung. Für einen Fachbesuch schreiben Sie uns.", "Optisun apre le sue porte durante il Manufacture Tour, su prenotazione. Per una visita professionale, scriveteci.", "マニュファクチュール・ツアーの期間に予約制で工場を公開しています。業務でのご見学はお問い合わせください。"], "cs_q4": ["Travailler chez Optisun", "Work at Optisun", "Trabajar en Optisun", "Bei Optisun arbeiten", "Lavorare in Optisun", "オプティサンで働きたい"], "cs_a4": ["Une offre est en ligne (responsable bureau d'études), et vous pouvez envoyer une demande de stage ou une candidature spontanée à recrutement@optisun.fr.", "One position is open (head of design office), and you can send an internship request or speculative application to recrutement@optisun.fr.", "Hay una oferta publicada (responsable de oficina técnica), y puede enviar una solicitud de prácticas o candidatura espontánea a recrutement@optisun.fr.", "Eine Stelle ist ausgeschrieben (Leitung Konstruktionsbüro). Praktikumsanfragen und Initiativbewerbungen gehen an recrutement@optisun.fr.", "È aperta un'offerta (responsabile ufficio tecnico) e potete inviare una richiesta di stage o una candidatura spontanea a recrutement@optisun.fr.", "設計部門責任者を募集中です。インターンシップや自由応募は recrutement@optisun.fr までお送りください。"], "cs_go_jobs": ["Voir les offres", "See the offers", "Ver las ofertas", "Angebote ansehen", "Vedere le offerte", "求人を見る"], "cs_q5": ["Nous contacter", "Contact us", "Contactarnos", "Kontakt aufnehmen"
