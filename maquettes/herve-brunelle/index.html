<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hervé Brunelle — Proposition Neovera Studio</title>
<meta name="description" content="Hervé Brunelle, formier-embauchoiriste à Troësnes (Aisne) : formes de montage et embauchoirs sur mesure en hêtre. Entreprise du Patrimoine Vivant.">
<meta name="theme-color" content="#251912">
<link rel="preload" href="fonts/petrona.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/spline.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"Petrona";src:url(fonts/petrona.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Petrona";src:url(fonts/petrona-i.woff2) format("woff2");font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:"Spline Sans";src:url(fonts/spline.woff2) format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"Spline Sans Mono";src:url(fonts/spline-mono.woff2) format("woff2");font-weight:300 700;font-display:swap}
:root{
--atelier:#ECEAE6;--atelier-2:#E2DFD9;--atelier-3:#D3CFC7;--copeau:#D9C4A2;
--noyer:#251912;--noyer-2:#33241B;--noyer-3:#4A372A;--encre:#1F1611;--encre-2:#4E4036;
--laiton:#BE8E2C;--laiton-clair:#D8BB78;--acajou:#7C3A22;--sur-noyer:#E9DCC6;--sur-noyer-2:#BFAE95;
--titre:"Petrona",Georgia,"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
--corps:"Spline Sans","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
--cote:"Spline Sans Mono","Hiragino Sans",ui-monospace,monospace;
--r:2px;--max:1320px;--g:clamp(16px,4vw,48px);
--ease:cubic-bezier(.16,1,.3,1)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-color:var(--noyer-3) var(--atelier-2)}
body{margin:0;background:var(--atelier);color:var(--encre);font:400 17px/1.6 var(--corps);font-feature-settings:"ss01"}
::selection{background:var(--laiton);color:var(--noyer)}
::-webkit-scrollbar{width:11px;height:8px}::-webkit-scrollbar-track{background:var(--atelier-2)}::-webkit-scrollbar-thumb{background:var(--noyer-3);border-radius:6px;border:2px solid var(--atelier-2)}
:focus-visible{outline:2px solid var(--laiton);outline-offset:3px;border-radius:2px}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration-color:var(--laiton);text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
h1,h2,h3{font-family:var(--titre);font-weight:560;line-height:1.08;letter-spacing:-.018em;margin:0;text-wrap:balance}
h1{font-size:clamp(2.35rem,5.6vw,4.9rem)}h2{font-size:clamp(1.9rem,3.6vw,3.1rem)}h3{font-size:clamp(1.25rem,1.9vw,1.55rem);letter-spacing:-.01em}
p{margin:0 0 1em;max-width:62ch;text-wrap:pretty}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--g)}
.skip{position:absolute;left:-999px;top:8px;background:var(--noyer);color:#fff;padding:8px 12px;z-index:99}.skip:focus{left:8px}
/* en-tête */
header.top{position:sticky;top:0;z-index:40;background:rgba(236,234,230,.94);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--atelier-3)}
.top .row{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.05;flex-shrink:0}
.brand b{font:600 1.34rem/1 var(--titre);letter-spacing:-.01em}
.brand small{font:500 .68rem/1.2 var(--cote);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-2);margin-top:4px}
nav.menu{flex:1;min-width:0;position:relative}
nav.menu ul{list-style:none;margin:0;padding:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.menu ul::-webkit-scrollbar{display:none}
nav.menu a{display:block;white-space:nowrap;text-decoration:none;padding:9px 9px;font-size:.92rem;border-radius:var(--r);color:var(--encre-2)}
nav.menu a:hover{color:var(--encre);background:var(--atelier-2)}
nav.menu a[aria-current=page]{color:var(--encre);box-shadow:inset 0 -2px 0 var(--laiton)}
nav.menu a.ai-link{color:var(--acajou);font-weight:600}
.tools{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lang{display:flex;align-items:center;gap:6px;border:1px solid var(--encre-2);border-radius:var(--r);padding:0 4px 0 9px;background:#F5F3EF}
.lang svg{width:15px;height:15px;flex-shrink:0}
.lang select{appearance:none;border:0;background:transparent;font:500 .9rem var(--corps);color:var(--encre);padding:8px 20px 8px 2px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--encre) 50%),linear-gradient(135deg,var(--encre) 50%,transparent 50%);background-position:calc(100% - 9px) 52%,calc(100% - 4px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 20px;border-radius:var(--r);font:600 .95rem/1.1 var(--corps);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .25s var(--ease),color .25s,border-color .25s,transform .25s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn.plein{background:var(--noyer);color:var(--sur-noyer)}.btn.plein:hover{background:var(--acajou);color:#fff}
.btn.laiton{background:var(--laiton);color:var(--noyer)}.btn.laiton:hover{background:var(--laiton-clair)}
.btn.trait{border-color:currentColor;color:inherit;background:transparent}.btn.trait:hover{background:rgba(180,140,62,.14)}
.btn svg{width:18px;height:18px}
.tel-top{display:none}
@media(min-width:1241px){#top-cta{display:none}}
@media(max-width:1240px){.top .row{flex-wrap:wrap;gap:0 14px;padding-top:8px}.brand{order:1;flex:1}.tools{order:2}nav.menu{order:3;flex-basis:100%;margin:4px 0 2px}nav.menu::after{content:"";position:absolute;right:0;top:0;bottom:0;width:40px;background:linear-gradient(90deg,rgba(236,234,230,0),var(--atelier));pointer-events:none}}
@media(max-width:620px){.brand small{display:none}.tools .btn{display:none}.tel-top{display:inline-flex;width:42px;min-height:42px;padding:0}.lang select{font-size:.85rem;padding:7px 18px 7px 0}}
/* pages */
main>section.page{display:none}main>section.page.on{display:block;animation:entree .5s var(--ease)}
@keyframes entree{from{opacity:.001}to{opacity:1}}
.band{padding:clamp(56px,9vw,120px) 0}
.band.noyer{background:var(--noyer);color:var(--sur-noyer)}
.band.noyer a{color:var(--sur-noyer)}
.band.copeau{background:var(--copeau)}
.band.gris{background:var(--atelier-2)}
.cote{font-family:var(--cote);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase}
.muted{color:var(--encre-2)}.noyer .muted{color:var(--sur-noyer-2)}
.lead{font:400 clamp(1.1rem,1.6vw,1.3rem)/1.5 var(--titre);max-width:46ch}
/* héros */
.hero{padding:clamp(28px,5vw,64px) 0 clamp(40px,6vw,80px)}
.hero .grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:clamp(20px,4vw,60px);align-items:center}
.hero h1{margin:0 0 .45em;font-size:clamp(2.2rem,4.4vw,4.1rem);hyphens:manual}
.hero .lead{margin-bottom:1.5em}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.hero .tag{display:flex;gap:12px;align-items:center;color:var(--encre-2)}
.hero .tag{font-size:.88rem}.hero .tag img{height:46px;width:auto;mix-blend-mode:multiply}
.hero figure{margin:0;position:relative}
.hero figure img{width:100%;aspect-ratio:4/3;object-fit:cover;mix-blend-mode:multiply;filter:contrast(1.04)}
.hero figure{background:radial-gradient(ellipse 60% 18% at 50% 82%,rgba(37,25,18,.18),transparent 70%)}
.hero figcaption{margin-top:12px;color:var(--encre-2);font-size:.9rem}
.marque{position:absolute;right:clamp(10px,3vw,28px);top:clamp(10px,3vw,28px);width:clamp(84px,11vw,124px);height:auto;color:var(--acajou);opacity:.88}
@media(max-width:820px){.hero .grid{grid-template-columns:1fr}.hero figure{order:-1}.hero figure img{aspect-ratio:16/10}.hero{padding-top:12px}}
/* cernes */
.cernes .grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(24px,5vw,72px);align-items:center}
.disque{position:relative;aspect-ratio:1;max-width:620px;width:100%;margin:0 auto}
.disque svg{width:100%;height:100%;overflow:visible}
.disque .cerne{fill:none;stroke:#8C6A4A;stroke-width:1.15;opacity:.95;transition:stroke .3s,stroke-width .3s}
.disque .cerne.fort{stroke:var(--laiton-clair);stroke-width:2.6}
.disque .rayon{stroke:#C9A57A;stroke-width:.6;opacity:.35}
.annees{list-style:none;margin:22px 0 26px;padding:0;border-top:1px solid var(--noyer-3)}
.annees li{border-bottom:1px solid var(--noyer-3)}
.annees button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:7.2em 1fr;gap:14px;width:100%;padding:14px 4px;cursor:pointer;color:var(--sur-noyer-2);transition:color .25s}
.annees button:hover,.annees button[aria-pressed=true]{color:var(--sur-noyer)}
.annees button[aria-pressed=true] .an{color:var(--laiton-clair)}
.annees .an{font-family:var(--cote);font-size:.95rem;padding-top:2px}
.annees button:focus-visible{outline:2px solid var(--laiton)}
@media(max-width:860px){.cernes .grid{grid-template-columns:1fr}.disque{max-width:420px}}
/* deux métiers */
.duo{display:grid;grid-template-columns:7fr 5fr;gap:clamp(20px,3vw,40px);margin-top:clamp(28px,4vw,48px)}
.duo article{position:relative}
.duo article:nth-child(2){margin-top:clamp(40px,8vw,120px)}
.duo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);margin-bottom:18px}
.duo h3{margin-bottom:.4em}
@media(max-width:760px){.duo{grid-template-columns:1fr}.duo article:nth-child(2){margin-top:0}}
/* forêts */
.forets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;margin-top:36px;background:var(--atelier-3);border:1px solid var(--atelier-3)}
.foret{all:unset;box-sizing:border-box;cursor:pointer;background:var(--atelier);padding:14px 14px 18px;display:flex;flex-direction:column;gap:8px;transition:background .3s}
.foret:hover{background:#F4F2EE}.foret:focus-visible{outline:2px solid var(--laiton);outline-offset:-2px}
.foret img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .6s var(--ease)}
.foret:hover img{transform:scale(1.04)}
.foret b{font:560 1.35rem/1.1 var(--titre)}
.foret span{color:var(--encre-2);font-size:.88rem}
@media(max-width:860px){.forets{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* cires */
.cires{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;margin:30px 0}
.cire{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--encre-2)}
.cire img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50% 50% 6px 6px;transition:transform .4s var(--ease),box-shadow .3s}
.cire:hover img,.cire[aria-pressed=true] img{transform:translateY(-4px);box-shadow:0 14px 22px -14px rgba(37,25,18,.6)}
.cire[aria-pressed=true]{color:var(--encre);font-weight:600}
.cire .vide{width:100%;aspect-ratio:1;border-radius:50% 50% 6px 6px;background:repeating-linear-gradient(115deg,#E6D4B4 0 7px,#DCC7A4 7px 9px)}
.cire:focus-visible img{outline:2px solid var(--laiton);outline-offset:2px}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.filtres button{font:500 .88rem var(--corps);border:1px solid var(--atelier-3);background:transparent;padding:8px 13px;border-radius:30px;cursor:pointer;color:var(--encre-2)}
.filtres button[aria-pressed=true]{background:var(--noyer);color:var(--sur-noyer);border-color:var(--noyer)}
/* vidéo */
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;margin-top:28px}
.video img{width:100%;height:100%;object-fit:cover;opacity:.78}
.video button{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:inline-flex;gap:12px;align-items:center}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* presse */
.presse{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;margin-top:26px}
.presse a{display:flex;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--atelier-3);text-decoration:none}
.presse a:hover span{text-decoration:underline;text-decoration-color:var(--laiton)}
.presse img{width:72px;height:auto;mix-blend-mode:multiply;flex-shrink:0}
@media(max-width:700px){.presse{grid-template-columns:1fr}}
/* bandeau contact */
.strip{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:end}
.coord{display:flex;flex-wrap:wrap;gap:12px}
/* en-tête de page */
.phead{padding:clamp(40px,6vw,84px) 0 clamp(20px,3vw,36px)}
.phead h1{margin-bottom:.4em}
.sousnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.sousnav a{font-size:.9rem;padding:8px 14px;border:1px solid var(--atelier-3);border-radius:30px;text-decoration:none}
.sousnav a:hover{border-color:var(--encre-2)}
/* modèles */
.modeles{display:grid;gap:clamp(40px,6vw,80px);margin-top:36px}
.modele{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(20px,4vw,56px);align-items:center;scroll-margin-top:140px}
.modele:nth-child(even){grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.modele:nth-child(even) .vues{order:2}
.vues{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.vues .principale{grid-column:1/-1;aspect-ratio:4/3;object-fit:cover;width:100%;cursor:zoom-in;border-radius:var(--r)}
.vues button{all:unset;cursor:zoom-in}
.vues button img{aspect-ratio:3/2;object-fit:cover;width:100%;opacity:.88;transition:opacity .25s}
.vues button:hover img{opacity:1}.vues button:focus-visible{outline:2px solid var(--laiton)}
.modele h3{font-size:clamp(1.8rem,3vw,2.6rem);margin-bottom:.3em}
.modele .cote{color:var(--acajou);margin-bottom:14px;display:block}
@media(max-width:820px){.modele,.modele:nth-child(even){grid-template-columns:1fr}.modele:nth-child(even) .vues{order:0}}
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:26px}
.galerie button{all:unset;cursor:zoom-in;background:#F2F1EE}
.galerie img{width:100%;aspect-ratio:3/4;object-fit:cover}
.galerie button:focus-visible{outline:2px solid var(--laiton)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(18px,3vw,40px);margin-top:30px}
.trio h3{font-size:1.2rem;margin-bottom:.4em;color:var(--acajou)}
@media(max-width:760px){.trio{grid-template-columns:1fr}}
.deux{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
@media(max-width:760px){.deux{grid-template-columns:1fr}}
/* formes */
.travaux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(30px,4vw,60px) clamp(20px,3vw,40px);margin-top:36px}
.travaux img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);margin-bottom:16px}
.travaux h3{margin-bottom:.4em}
@media(max-width:700px){.travaux{grid-template-columns:1fr}}
.note{border:1px solid var(--acajou);color:var(--acajou);padding:14px 18px;border-radius:var(--r);max-width:62ch;font-size:.95rem}
.points{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:28px}
.points h3{font-size:1.2rem;margin-bottom:.4em}
@media(max-width:760px){.points{grid-template-columns:1fr}}
/* registre */
.registre{width:100%;border-collapse:collapse;margin-top:22px;font-variant-numeric:tabular-nums}
.registre td{padding:16px 6px;border-bottom:1px solid var(--noyer-3);vertical-align:baseline}
.registre td:first-child{font:500 1.5rem/1 var(--cote);color:var(--laiton-clair);width:7.5em;white-space:nowrap}
.portrait img{width:100%;border-radius:var(--r);filter:grayscale(.15)}
blockquote{margin:0;font:italic 500 clamp(1.4rem,2.6vw,2.1rem)/1.3 var(--titre);max-width:30ch;text-wrap:balance}
/* configurateur */
.cf{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(20px,4vw,56px);align-items:start;margin-top:20px}
.cf fieldset{border:0;padding:0;margin:0 0 30px}
.cf legend{font:560 1.3rem var(--titre);margin-bottom:12px;padding:0}
.choix{display:flex;flex-wrap:wrap;gap:8px}
.choix label{position:relative;cursor:pointer}
.choix input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choix span{display:block;padding:10px 15px;border:1px solid var(--atelier-3);border-radius:var(--r);font-size:.93rem;background:#F4F2EE;transition:all .2s}
.choix input:checked+span{background:var(--noyer);color:var(--sur-noyer);border-color:var(--noyer)}
.choix input:focus-visible+span{outline:2px solid var(--laiton);outline-offset:2px}
.choix label:hover span{border-color:var(--encre-2)}
.cf .cires{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));margin:0}
.apercu{position:sticky;top:140px;background:#F4F2EE;border:1px solid var(--atelier-3);border-radius:var(--r);padding:18px}
.apercu .img{position:relative;aspect-ratio:4/3;overflow:hidden;background:#EDEDEB;margin-bottom:14px}
.apercu .img img{width:100%;height:100%;object-fit:cover}
.apercu .img img.pastille{position:absolute;right:10px;bottom:10px;width:64px;height:64px;border-radius:50%;border:3px solid #F4F2EE;object-fit:cover;box-shadow:0 8px 16px -8px rgba(0,0,0,.5)}
.apercu dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px;font-size:.92rem}
.apercu dt{color:var(--encre-2)}.apercu dd{margin:0;font-weight:600}
@media(max-width:860px){.cf{grid-template-columns:1fr}.apercu{position:static}}
/* contact */
.ct{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:start}
.ct dl{margin:0}.ct dt{margin-top:18px}.ct dd{margin:4px 0 0;font:500 1.2rem var(--titre)}
form.f{display:grid;gap:16px}
.f label{display:grid;gap:6px;font-size:.9rem;font-weight:600}
.f input,.f select,.f textarea{font:400 1rem var(--corps);padding:12px 13px;border:1px solid #A89C8E;border-radius:var(--r);background:#FAF9F7;color:var(--encre);width:100%;caret-color:var(--acajou)}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--laiton);outline-offset:1px;border-color:var(--noyer)}
.f textarea{min-height:140px;resize:vertical}
.f .err{color:#9A2E1E;font-weight:600}.f .ok{color:#2F5A35;font-weight:600}
.f .sel{background:var(--copeau);padding:12px 14px;border-radius:var(--r);font-size:.92rem;display:flex;justify-content:space-between;gap:12px;align-items:start}
.f .sel button{all:unset;cursor:pointer;text-decoration:underline;font-size:.85rem}
.duo2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:560px){.duo2{grid-template-columns:1fr}}
.mentions h2{font-size:1.3rem;margin:34px 0 10px}
/* pied */
footer{background:var(--noyer);color:var(--sur-noyer-2);padding:56px 0 110px;font-size:.92rem}
footer a{color:var(--sur-noyer)}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr;gap:30px}
footer h4{font:600 .78rem var(--cote);letter-spacing:.06em;text-transform:uppercase;color:var(--laiton-clair);margin:0 0 12px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
footer .bas{margin-top:40px;padding-top:18px;border-top:1px solid var(--noyer-3);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
@media(max-width:820px){footer .cols{grid-template-columns:1fr 1fr}}
/* visionneuse */
.lb{position:fixed;inset:0;background:rgba(20,13,9,.94);z-index:80;display:none;align-items:center;justify-content:center;padding:60px 16px}
.lb.on{display:flex}
.lb img{max-height:82vh;max-width:min(1100px,92vw);object-fit:contain;background:#eee}

/* conseiller */
.ai-fab{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;align-items:center;gap:11px;background:var(--noyer);color:var(--sur-noyer);border:0;border-radius:40px;padding:9px 18px 9px 9px;cursor:pointer;box-shadow:0 14px 30px -12px rgba(37,25,18,.65);text-align:left}
.ai-fab .pic{width:42px;height:42px;border-radius:50%;background:var(--laiton);display:grid;place-items:center;color:var(--noyer);flex-shrink:0}
.ai-fab .pic svg{width:24px;height:24px}
.ai-fab b{display:block;font:600 .98rem/1.1 var(--corps)}.ai-fab small{display:block;font-size:.8rem;color:var(--sur-noyer-2)}
.ai-bulle{position:fixed;right:16px;bottom:84px;z-index:59;max-width:300px;background:#FBFAF8;border:1px solid var(--atelier-3);border-radius:10px;padding:14px 38px 14px 16px;box-shadow:0 16px 34px -16px rgba(37,25,18,.5);font-size:.93rem;display:none}
.ai-bulle.on{display:block;animation:entree .4s var(--ease)}
.ai-bulle button{position:absolute;top:6px;right:6px;background:none;border:0;cursor:pointer;width:28px;height:28px;color:var(--encre-2)}
.ai{position:fixed;right:16px;bottom:16px;z-index:70;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100vh - 32px));background:#FBFAF8;border:1px solid var(--atelier-3);border-radius:12px;box-shadow:0 30px 60px -20px rgba(37,25,18,.55);display:none;flex-direction:column;overflow:hidden}
.ai.on{display:flex}
.ai header{background:var(--noyer);color:var(--sur-noyer);padding:12px 14px;display:flex;align-items:center;gap:10px}
.ai header b{font:600 1rem var(--corps);display:block}.ai header small{color:var(--laiton-clair);font:500 .74rem var(--cote);letter-spacing:.05em;text-transform:uppercase}
.ai header button{margin-left:auto;background:none;border:0;color:var(--sur-noyer);cursor:pointer;width:36px;height:36px}
.ai .fil{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:10px;font-size:.93rem;line-height:1.45}
.msg.ia{background:var(--atelier-2);align-self:flex-start;border-bottom-left-radius:2px}
.msg.moi{background:var(--noyer);color:var(--sur-noyer);align-self:flex-end;border-bottom-right-radius:2px}
.msg .go{display:inline-block;margin-top:8px;font-weight:600;color:var(--acajou);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-size:.9rem}
.puces{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.puces button{font:500 .82rem var(--corps);border:1px solid var(--atelier-3);background:#fff;padding:7px 10px;border-radius:20px;cursor:pointer;color:var(--encre)}
.puces button:hover{border-color:var(--acajou);color:var(--acajou)}
.ai form{display:flex;border-top:1px solid var(--atelier-3)}
.ai input{flex:1;border:0;padding:14px;font:400 .95rem var(--corps);background:transparent;min-width:0}
.ai input:focus{outline:none}.ai form:focus-within{box-shadow:inset 0 2px 0 var(--laiton)}
.ai form button{border:0;background:var(--laiton);color:var(--noyer);padding:0 16px;cursor:pointer;font-weight:600}

tr_intro:"Turned in beech, sometimes in alder or maple, never in softwood. A made-to-measure shoe tree is always made from the last your shoes were built on: it fills them exactly.",

shoes_p:"Also called travel shoe trees. Sawing and hollowing are chosen on request.",

low_p:"Entirely handmade in beech, shaped to the model of the boot. Four parts: the back, the key, the front and the foot, jointed with mortise and tenon.",
low_p2:"Balmoral, Derby, Grand Cambré or Jodhpur: a classic line, finished with the same waxes, with a soap-bar key or rings.",
boots_h:"Boot trees",boots_sub:"Polo, riding, hunting and venery",
boots_p:"They are usually turned before the boots, from the bootmaker’s measurements, and used to shape the leg. They can also be made for finished boots, even worn ones.",

fo_h:"Shoe lasts",
fo_intro:"I turn wood rather than plastic, for technical reasons and by choice. Beech and hornbeam meet craftsmen’s demands better and are easier to work by hand. Each last is copied on a pantograph lathe, then made in several widths and sizes.",
fo_what_h:"The shoe last",fo_what:"The form on which the bootmaker or orthopaedic shoemaker builds the finished shoe.",
fo_no:"For technical reasons, I do not make iron-plated lasts for tack lasting.",
fo_create_h:"Creating a last",fo_create:"It is not only about looks or fit: a last needs balanced stance and volumes that answer a real need.",
fo_fit_h:"Fine-tuning the fit",fo_fit:"The delicate point of bespoke. A last’s fit can be kept while its look is changed, working hand in hand with the bootmaker.",
fo_sty_h:"With designers and prototype makers",fo_sty:"I listen to their requests; my range of work steers the last towards the right solution for the final product.",
fo_types_h:"Four kinds of last work",
t_cambrure_h:"Changing the heel height",t_cambrure:"For women’s lasts, from the heel supplied with the model last. Going from 3 to 9 or 10 cm can take several turnings; the bootmaker then makes a new fitting shoe.",
t_sciage_h:"Sawing",t_sciage:"Two cuts to choose from: the traditional wedge, which releases the measurement at the instep, or the “system” cut, an oblique line from the base of the waist to mid-instep, which frees the back and then the forefoot.",
t_bout_h:"The unturned toe",t_bout:"An existing last is turned to the client’s measurements without finishing the toe. The bootmaker shapes a different style on it while keeping the fit: several toes, the same comfort.",
t_proto_h:"Prototyping",t_proto:"Done together with the designer, it takes many hours of work and fittings.",
fo_cta_h:"A last project?",fo_cta_p:"We answer with a study before accepting any project.",
at_h:"The Troësnes workshop",at_lead:"A craftsman working for craftsmen.",
at_p1:"Hervé Brunelle set up his workshop in 2005 in the south of the Aisne, near Villers-Cotterêts, to keep this craft alive.",
at_p2:"Making lasts was a real headache for small workshops. He chose a different way of working from the workshops of the time, to meet the bootmaker’s demands.",
at_exp_h:"Experience",at_exp:"22 years of shoe repair, orthopaedic shoemaking, riding boots and luxury boots, before focusing on lasts and shoe trees.",

fo_h:"Hormas de montado",
fo_intro:"Torneo madera y no plástico, por razones técnicas y por elección. La haya y el carpe responden mejor a las exigencias de los artesanos y se trabajan mejor a mano. Cada horma se copia en un torno pantógrafo y luego se declina en anchos y tallas.",
fo_what_h:"La horma de montado",fo_what:"Sobre ella el zapatero a medida o el podólogo ortopédico monta el zapato definitivo.",
fo_no:"Por razones técnicas, no fabrico hormas herradas para el montado con tachuelas.",
fo_create_h:"La creación",fo_create:"No se limita a la estética o al calce: la horma debe tener aplomos proporcionados y volúmenes que respondan a la necesidad.",
fo_fit_h:"El ajuste del calce",fo_fit:"El punto delicado de la medida. Se puede conservar el calce de una horma y cambiar su estética, junto con el zapatero.",
fo_sty_h:"Con diseñadores y prototipistas",fo_sty:"Escucho sus peticiones; mi gama de trabajos orienta la horma hacia la solución más justa para el producto final.",
fo_types_h:"Cuatro trabajos de horma",
t_cambrure_h:"El cambio de tacón",t_cambrure:"Para la horma de mujer, a partir del tacón entregado con la horma modelo. Pasar de 3 a 9 o 10 cm puede exigir varios torneados; luego el zapatero hace una nueva prueba.",
t_sciage_h:"El corte",t_sciage:"Dos cortes a elegir: la cuña tradicional, que libera la medida por el empeine, o el corte «sistema», oblicuo, de la base del enfranque a la mitad del empeine, que libera el talón y luego el antepié.",
t_bout_h:"La puntera sin tornear",t_bout:"Una horma existente se tornea a las medidas del cliente sin terminar la puntera. El zapatero le da otra estética conservando el calce: varias punteras, la misma comodidad.",
t_proto_h:"El prototipado",t_proto:"Hecho con el diseñador, exige muchas horas de trabajo y de pruebas.",
fo_cta_h:"¿Un proyecto de horma?",fo_cta_p:"Respondemos con un estudio antes de aceptar cualquier proyecto.",

tr_intro:"Aus Buche gedrechselt, manchmal aus Erle oder Ahorn, nie aus Nadelholz. Ein Maßspanner entsteht immer aus dem Leisten, auf dem Ihre Schuhe gebaut wurden: Er füllt sie genau aus.",

low_p2:"Balmoral, Derby, Grand Cambré oder Jodhpur: eine klassische Linie, mit denselben Wachsen gefärbt, mit Seifenstück-Keil oder Ringen.",

boots_p:"Sie werden meist vor den Stiefeln nach den Maßen des Stiefelmachers gedrechselt und dienen zum Formen des Schafts. Sie können auch für fertige, sogar getragene Stiefel gefertigt werden.",

fo_h:"Schuhleisten",
fo_intro:"Ich drechsle Holz statt Kunststoff, aus technischen Gründen und aus Überzeugung. Buche und Hainbuche werden den Ansprüchen der Handwerker besser gerecht und lassen sich besser von Hand bearbeiten. Jeder Leisten wird auf einer Pantographen-Drehbank kopiert und dann in Weiten und Größen abgewandelt.",
fo_what_h:"Der Schuhleisten",fo_what:"Auf ihm baut der Maßschuhmacher oder Orthopädieschuhmacher den fertigen Schuh.",
fo_no:"Aus technischen Gründen fertige ich keine beschlagenen Leisten für die Zwickarbeit mit Täcksen.",
fo_create_h:"Die Entwicklung",fo_create:"Es geht nicht nur um Aussehen oder Passform: Der Leisten braucht ausgewogene Standlinien und Volumen, die dem Bedarf entsprechen.",
fo_fit_h:"Die Feinabstimmung der Passform",fo_fit:"Der heikle Punkt beim Maßschuh. Die Passform eines Leistens kann erhalten und sein Aussehen geändert werden, in Absprache mit dem Schuhmacher.",
fo_sty_h:"Mit Designern und Prototypenbauern",fo_sty:"Ich höre auf ihre Wünsche; meine Erfahrung lenkt den Leisten zur passendsten Lösung für das Endprodukt.",
fo_types_h:"Vier Leistenarbeiten",
t_cambrure_h:"Änderung der Absatzhöhe",t_cambrure:"Für Damenleisten, ausgehend vom mitgelieferten Absatz des Modellleistens. Von 3 auf 9 oder 10 cm zu gehen kann mehrere Drehgänge erfordern; danach fertigt der Schuhmacher einen neuen Probeschuh.",
t_sciage_h:"Der Schnitt",t_sciage:"Zwei Schnitte zur Wahl: der klassische Keil, der das Maß am Spann freigibt, oder der schräge „System“-Schnitt vom Gelenkansatz bis zur Mitte des Spanns, der zuerst die Ferse und dann den Vorfuß freigibt.",
t_bout_h:"Die ungedrehte Spitze",t_bout:"Ein vorhandener Leisten wird auf die Maße des Kunden gedrechselt, ohne die Spitze fertigzustellen. Der Schuhmacher gibt ihr ein anderes Aussehen bei gleicher Passform: mehrere Spitzen, derselbe Komfort.",
t_proto_h:"Der Prototypenbau",t_proto:"Gemeinsam mit dem Designer erfordert er viele Arbeitsstunden und Anproben.",
fo_cta_h:"Ein Leistenprojekt?",fo_cta_p:"Wir antworten mit einer Prüfung, bevor wir ein Projekt annehmen.",

a_travel:"Für Reisen wählen Sie ein ausgehöhltes, leichteres Modell: den Aigoual (ausgehöhlter, belüfteter Vorfuß) oder den Brocéliande, Loudéac oder Tronçais mit Scharnier. Der nicht ausgehöhlte Boscodon bleibt besser zu Hause.",
a_luxe:"Der Retz: dreiteilig, Seifenstück-Keil, unser schönstes Modell. Gezeigt in Mahagoni.",
a_boots:"Für Reiten, Jagd oder Parforcejagd gibt der Spanner auch die Schaftform: Saumur, Chantilly, englisch oder halbenglisch. Er wird nach den Maßen des Stiefelmachers gedrechselt oder für fertige, auch getragene Stiefel.",
a_wax:"Dreiundzwanzig Wachse, von farblos bis violett. Für einen klassischen Schuh: Nussbaum, Mahagoni, Kirsche oder Eiche. Wasserlösliche Wachse, nie Lack, damit das Holz Feuchtigkeit aufnimmt.",
a_last:"Hervé drechselt Leisten aus Buche oder Hainbuche: Entwicklung, Passform-Anpassung, Änderung der Absatzhöhe, ungedrehte Spitze, Keil- oder „System“-Schnitt, Prototypen. Keine beschlagenen Leisten für Täcksarbeit.",
a_price:"Preise und Lieferzeiten werden nicht veröffentlicht: Jedes Projekt beginnt mit einer Prüfung. Am einfachsten: +33 3 23 96 97 04 anrufen oder an brunelle.herve@wanadoo.fr schreiben.",
a_custom:"Ein Maßspanner für Schuhe entsteht aus dem Leisten Ihrer Schuhe, den Ihr Schuhmacher aufbewahrt. Für fertige, auch getragene Stiefel ist es ebenfalls möglich.",
a_bottines:"Für Stiefeletten (Balmoral, Derby, Grand Cambré, Jodhpur): ein vierteiliger Spanner mit Seifenstück-Keil oder Ringen. Der Ardennes wird für Stiefeletten nicht empfohlen.",
a_wood:"Meist Buche, auch Erle oder Ahorn; nie Nadelholz. Schuhleisten sind aus Buche oder Hainbuche.",
a_contact:"Werkstatt: 5 place de la Mairie, 02460 Troësnes, Frankreich. Telefon: +33 3 23 96 97 04. E-Mail: brunelle.herve@wanadoo.fr.",
a_hours:"Öffnungszeiten stehen nicht auf der Website, und ich möchte Ihnen keine falsche Zeit nennen. Bitte rufen Sie vor einem Besuch an: +33 3 23 96 97 04.",
a_ship:"Die Werkstatt verkauft 30 bis 35 Stück im Monat weltweit. Versandbedingungen sind nicht veröffentlicht: Fragen Sie bei der Prüfung danach.",

tr_h:"I tendiscarpe",
tr_intro:"Torniti in faggio, talvolta in ontano o acero, mai in resinosa. Un tendiscarpe su misura nasce sempre dalla forma su cui sono state fatte le sue scarpe: le riempie con esattezza.",
sub_shoes:"Scarpe",sub_low:"Stivaletti e anfibi",sub_boots:"Stivali",sub_wax:"Tinte",
shoes_h:"Tendiscarpe per scarpe",
shoes_p:"Chiamato anche tendiscarpe da viaggio. Taglio e scavatura si scelgono su richiesta.",
m_aigoual:"L’avampiede viene scavato dopo il taglio del blocco del sottopiede, poi rimesso al suo posto e forato per far respirare il legno.",
m_ardennes:"Il suo taglio include una maniglia curva sul retro. Sconsigliato per gli stivaletti.",
m_boscodon:"Il più semplice. Non scavato, quindi più pesante: resta a casa più che in viaggio, e mantiene lo stesso volume degli altri.",
m_broceliande:"Il tendiscarpe a cerniera dal taglio più classico, affinato dalla scavatura del collo del piede.",
m_loudeac:"A cerniera, con quarti equilibrati. La scavatura, non tinta, arriva a metà del fiosso. Anello in ottone.",
m_retz:"Tre pezzi, chiave a saponetta: il nostro modello più bello, per gli amanti dei begli oggetti.",
m_sherwood:"Una versione dell’Ardennes con il tallone forato.",
m_troncais:"A cerniera, con tallone arrotondato: una linea tutta morbidezza.",
m_shown:"Presentato in: {c}",m_photos:"{n} foto",m_choose:"Scegliere questo modello",m_open:"Vedere le foto",
low_h:"Tendiscarpe per stivaletti",
low_p:"Interamente fatti a mano in faggio, con una curva propria del modello di stivaletto. Quattro parti: il retro, la chiave, l’avanti e il piede articolato a tenone e mortasa.",
low_p2:"Balmoral, Derby, Grand Cambré o Jodhpur: una linea classica, tinta con le stesse cere, con chiave a saponetta o anelli.",
boots_h:"Tendistivali",boots_sub:"Polo, equitazione, caccia e caccia alla muta",
boots_p:"Di solito si torniscono prima degli stivali, sulle misure dello stivalaio, e servono a modellare il gambale. Si possono fare anche per stivali finiti, perfino già portati.",
b_func_h:"Funzione",b_func:"Tenere lo stivale in forma conservandone le misure originali: ne dipendono durata ed estetica.",
b_trans_h:"Trasporto",b_trans:"La maniglia, scavata nel prolungamento della chiave centrale, porta stivali e tendistivali. Può essere sostituita da un anello in ottone lucido o cromato.",
b_fab_h:"Fabbricazione",b_fab:"Secondo lo stivale: con lacci, con cerniera, polo, equitazione, caccia o caccia alla muta. Per equitazione e caccia danno anche la forma del gambale: Saumur, Chantilly, inglese o mezzo inglese.",
wax_page_h:"Personalizzazione delle tinte",
wax_page_p:"Dall’incolore ai legni tradizionali e ai colori vivaci. Cere idrosolubili e non vernici: il tendiscarpe conserva la sua funzione, assorbire l’umidità.",

fo_h:"Le forme da calzolaio",
fo_intro:"Tornisco il legno e non la plastica, per ragioni tecniche e per scelta. Faggio e carpino rispondono meglio alle esigenze degli artigiani e si lavorano meglio a mano. Ogni forma è copiata su un tornio a pantografo, poi declinata in larghezze e misure.",
fo_what_h:"La forma da calzolaio",fo_what:"È su di essa che il calzolaio su misura o il tecnico ortopedico monta la scarpa definitiva.",
fo_no:"Per ragioni tecniche, non fabbrico forme ferrate per il montaggio a semenze.",
fo_create_h:"La creazione",fo_create:"Non si limita all’estetica o alla calzata: la forma deve avere appiombi proporzionati e volumi che rispondano al bisogno.",
fo_fit_h:"La messa a punto della calzata",fo_fit:"Il punto delicato del su misura. Si può conservare la calzata di una forma e cambiarne l’estetica, insieme al calzolaio.",
fo_sty_h:"Con stilisti e prototipisti",fo_sty:"Ascolto le loro richieste; la mia gamma di lavori orienta la forma verso la soluzione più giusta per il prodotto finale.",
fo_types_h:"Quattro lavori sulla forma",
t_cambrure_h:"Il cambio di altezza del tacco",t_cambrure:"Per la forma donna, a partire dal tacco fornito con la forma modello. Passare da 3 a 9 o 10 cm può richiedere più torniture; poi il calzolaio rifà una prova.",
t_sciage_h:"Il taglio",t_sciage:"Due tagli a scelta: il cuneo tradizionale, che libera la misura dal collo del piede, o il taglio «sistema», obliquo, dalla base del fiosso a metà collo del piede, che libera il tallone e poi l’avampiede.",
t_bout_h:"La punta non tornita",t_bout:"Una forma esistente viene tornita sulle misure del cliente senza finire la punta. Il calzolaio le dà un’altra estetica mantenendo la calzata: più punte, la stessa comodità.",
t_proto_h:"La prototipazione",t_proto:"Condotta con lo stilista, richiede molte ore di lavoro e di prove.",
fo_cta_h:"Un progetto di forma?",fo_cta_p:"Rispondiamo con uno studio prima di accettare qualsiasi progetto.",
at_h:"Il laboratorio di Troësnes",at_lead:"Un artigiano al servizio degli artigiani.",

a_travel:"Per viaggiare scelga un modello scavato, quindi leggero: l’Aigoual (avampiede scavato e aerato), oppure il Brocéliande, il Loudéac o il Tronçais, a cerniera. Il Boscodon, non scavato, è meglio a casa.",

a_bottines:"Per gli stivaletti (Balmoral, Derby, Grand Cambré, Jodhpur): un tendiscarpe in quattro parti, con chiave a saponetta o anelli. L’Ardennes non è consigliato per gli stivaletti.",
a_wood:"Soprattutto faggio, anche ontano o acero; mai resinose. Le forme da calzolaio sono in faggio o carpino.",

a_hours:"Gli orari non sono indicati sul sito e non voglio darle un orario sbagliato. Chiami prima di passare: +33 3 23 96 97 04.",
a_ship:"Il laboratorio vende da 30 a 35 pezzi al mese in tutto il mondo. Le condizioni di spedizione non sono pubblicate: le chieda durante lo studio.",
a_epv:"Hervé Brunelle ha ricevuto il premio dipartimentale della Société d’Encouragement aux Métiers d’Art nel 2005, poi il marchio Impresa del Patrimonio Vivente nel 2007, come ultimo artigiano di forme e tendiscarpe di Francia.",

fo_intro:"技術的な理由と自分の選択から、樹脂ではなく木を削っています。ブナとシデは職人の要求によく応え、手作業にも向いています。木型はパンタグラフ旋盤で複製し、ワイズとサイズを展開します。",

fo_create_h:"木型の創作",fo_create:"見た目やフィットだけではありません。釣り合いのとれた立ち姿と、用途に合ったボリュームが必要です。",

t_sciage_h:"木型のカット",t_sciage:"2種類から選べます。甲から寸法を逃がす伝統的なくさび型と、土踏まずの付け根から甲の中ほどへ斜めに切る「システム」カット。後者はかかと、次に前足部の順に抜けます。",

function bruit(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function cernes(){const box=document.getElementById('disque');if(!box)return;
 const R=bruit(1981),cx=300,cy=300,ox=-14,oy=10;const N=22;/* 2005 → 2026 */
 const ph=[...Array(5)].map(()=>R()*6.28);const amp=[...Array(5)].map((_,i)=>(0.016+R()*0.02)/(i+1));
 const larg=[...Array(N)].map((_,i)=>0.7+R()*0.75+(i==2||i==6?.35:0));const tot=larg.reduce((a,b)=>a+b,0);
 const inner=34,outer=262;let r=inner,paths=[],rayons='',fill='';
 const pt=(rad,a,k)=>{let f=1;for(let j=0;j<5;j++)f+=amp[j]*Math.sin((j+2)*a+ph[j]+k*.05);const ex=1-k/N;return [cx+ox*ex+Math.cos(a)*rad*f,cy+oy*ex+Math.sin(a)*rad*f*0.97]};
 const ring=(rad,k)=>{let d='';for(let s=0;s<=96;s++){const a=s/96*6.2832;const [x,y]=pt(rad,a,k);d+=(s?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}return d+'Z'};
 paths.push({d:ring(inner*0.55,0),an:'before',w:1});paths.push({d:ring(inner,0),an:'before'});
 for(let k=0;k<N;k++){r+=larg[k]/tot*(outer-inner);paths.push({d:ring(r,k+1),an:String(2005+k)})}
 const ecorce=ring(outer+14,N+1);
 for(let j=0;j<46;j++){const a=R()*6.2832,r0=inner+R()*60,r1=r0+40+R()*(outer-r0-40);const [x0,y0]=pt(r0,a,0),[x1,y1]=pt(r1,a,N);rayons+=`<path class="rayon" d="M${x0.toFixed(1)} ${y0.toFixed(1)}L${x1.toFixed(1)} ${y1.toFixed(1)}"/>`}
 const marq={before:1,'2005':2,'2007':4,'2011':8,now:paths.length-1};
 box.innerHTML=`<svg viewBox="0 0 600 600" role="img" aria-label="${esc(t('rings_h'))}"><defs><radialGradient id="bois" cx="47%" cy="52%" r="55%"><stop offset="0" stop-color="#D9B98E"/><stop offset=".72" stop-color="#C9A274"/><stop offset="1" stop-color="#A97E52"/></radialGradient></defs>
 <path d="${ecorce}" fill="#4A372A"/><path d="${ring(outer+3,N)}" fill="url(#bois)"/><path d="${ring(outer-8,N-1)}" fill="none" stroke="#E6CDA4" stroke-width="10" opacity=".35"/><path d="${paths[9].d}" fill="#8E5A3A" opacity=".16"/>${rayons}
 ${paths.map((p,i)=>`<path class="cerne" data-k="${i}" d="${p.d}"/>`).join('')}<circle cx="${cx+ox}" cy="${cy+oy}" r="4" fill="#7A5634"/>
 <g id="reperes" font-family="Spline Sans Mono, monospace" font-size="13" fill="#4A372A"></g><g id="etiq" font-family="Spline Sans Mono, monospace" font-size="15" fill="#F3E7D3"></g></svg>`;
 const rep=box.querySelector('#reperes');[['2005',0.62],['2007',0.40],['2011',0.86]].forEach(([an,f])=>{const p=box.querySelectorAll('.cerne')[marq[an]];const q=p.getPointAtLength(p.getTotalLength()*f);const c=box.querySelectorAll('.cerne')[paths.length-1].getPointAtLength(box.querySelectorAll('.cerne')[paths.length-1].getTotalLength()*f);rep.insertAdjacentHTML('beforeend',`<line x1="${q.x}" y1="${q.y}" x2="${c.x}" y2="${c.y}" stroke="#7A5634" stroke-width=".8" stroke-dasharray="2 3"/><circle cx="${q.x}" cy="${q.y}" r="3" fill="#7A5634"/><text x="${(q.x+c.x)/2+6}" y="${(q.y+c.y)/2}" >${an}</text>`)});
 const ps=[...box.querySelectorAll('.cerne')];
 const montrer=an=>{const k=marq[an];ps.forEach((p,i)=>p.classList.toggle('fort',i==k));document.querySelectorAll('#annees button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.an==an));
  const e=box.querySelector('#etiq');const p=ps[k];if(!p)return;const L2=p.getTotalLength(),q=p.getPointAtLength(L2*0.13);const lab=an=='before'?t('yr_before'):an=='now'?t('yr_now'):an;
  e.innerHTML=`<circle cx="${q.x}" cy="${q.y}" r="5" fill="#D8BB78"/><rect x="${q.x+10}" y="${q.y-28}" width="${lab.length*9.6+18}" height="26" rx="2" fill="#251912" opacity=".88"/><text x="${q.x+19}" y="${q.y-10}">${esc(lab)}</text>`};
 document.querySelectorAll('#annees button').forEach(b=>b.onclick=()=>montrer(b.dataset.an));
 ps.forEach((p,i)=>{p.style.cursor='pointer';p.style.pointerEvents='stroke';p.style.strokeWidth='';p.addEventListener('click',()=>{const an=Object.entries(marq).reduce((best,[a,k])=>Math.abs(k-i)<Math.abs(marq[best]-i)?a:best,'now');montrer(an)})});
 const reduit=matchMedia('(prefers-reduced-motion:reduce)').matches;
 if(reduit){montrer('now');return}
 ps.forEach(p=>{const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l});
 const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;io.disconnect();
  ps.forEach((p,i)=>{p.style.transition=`stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1) ${i*0.085}s`;requestAnimationFrame(()=>p.style.strokeDashoffset=0)});
  setTimeout(()=>montrer('now'),ps.length*85+700)})},{threshold:.35});io.observe(box)}
