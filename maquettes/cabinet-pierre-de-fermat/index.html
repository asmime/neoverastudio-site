nt": "Stampante 3D per le placche realizzate nello studio", "equipe_t": "Dieci professionisti, una stessa esigenza", "equipe_p": "Odontoiatri generali, ortodontista, pedodontista, specialisti di impianti e gengive: ciascuno con la propria formazione, tutti formati a Toulouse o altrove.", "f_all": "Tutti", "f_impl": "Impianti", "f_ortho": "Ortodonzia", "f_paro": "Gengive", "f_ped": "Bambini e sedazione", "f_esth": "Estetica", "f_gen": "Cure generali", "acces_t": "Rue Joseph-Lakanal, nel cuore della città rosa", "acces_p": "Lo studio si trova di fronte al liceo Pierre-de-Fermat, a due passi dalla piazza del Capitole e dalla piazza Saint-Pierre. Metro linea A, fermata Capitole.", "adr_l": "Indirizzo", "tel_l": "Telefono", "mail_l": "E-mail", "hor_l": "Orari", "hor_v": "Lunedì – venerdì: 8.30 – 19.30\nSabato e domenica: chiuso", "hor_note": "Orari e numero civico da confermare con lo studio (variano da una pagina all'altra del sito attuale).", "carte_open": "Apri l'itinerario", "faq_t": "Le Sue domande, le nostre risposte", "blog_t": "Il quaderno dello studio", "blog_p": "Quattordici articoli per capire prima di venire.", "blog_all": "Tutto il quaderno", "read": "Leggi l'articolo", "soins_t": "Tutte le cure dello studio", "soins_p": "Ventisei schede, ordinate come le cercherebbe Lei.", "fam_all": "Vedi tutto", "fam_quot": "Cure quotidiane", "fam_esth": "Estetica", "fam_rempl": "Sostituire un dente", "fam_genc": "Gengive", "fam_ortho": "Ortodonzia", "enbref": "In breve", "back_soins": "Tutte le cure", "back_blog": "Tutto il quaderno", "rb_l": "Rimborso", "who_l": "Professionisti formati", "urg_t": "Un'urgenza dentale?", "urg_p": "Dolore acuto, ascesso, caduta, dente rotto: il team La prende in carico il prima possibile. I pazienti già seguiti dallo studio vengono di norma ricevuti in giornata; gli altri in base agli orari disponibili.", "urg_garde_t": "Domenica e giorni festivi", "urg_garde_p": "Il Conseil de l'Ordre des chirurgiens-dentistes de la Haute-Garonne organizza un servizio di guardia. Se la Sua vita è in pericolo, componga il 15.", "urg_garde_note": "Il sito attuale indica di chiamare la regolazione al 05 87 14 06 17, che però è il numero dello studio: numero di guardia da confermare con lo studio.", "urg_sit_t": "Situazioni che prendiamo in carico", "urg_s1": "Dolore dentale intenso o persistente", "urg_s2": "Infezione: ascesso, gengiva infiammata", "urg_s3": "Colpo o trauma: dente rotto o espulso", "urg_s4": "Dolore dopo l'estrazione di un dente del giudizio", "urg_s5": "Perdita di un'otturazione o di una corona", "urg_causes_t": "Le cause più frequenti", "urg_c1": "Ascesso dentale: pus attorno alla radice o nella gengiva. Dolore pulsante, guancia gonfia, a volte febbre.", "urg_c2": "Gengivite e parodontite: gengive rosse, gonfie, che sanguinano durante lo spazzolamento.", "urg_c3": "Pericoronarite: infezione attorno a un dente del giudizio che spunta male.", "urg_c4": "Pulpite: il nervo del dente è infiammato e il dolore sveglia di notte.", "urg_c5": "Alveolite: infezione dell'alveolo dopo un'estrazione.", "urg_quoi_t": "In attesa del Suo appuntamento", "urg_q1": "Dente espulso: lo tenga per la corona, lo conservi nel latte o in bocca e venga subito.", "urg_q2": "Dolore: un antidolorifico adatto, mai aspirina sulla gengiva, niente calore sulla guancia.", "urg_q3": "Guancia che si gonfia o febbre: chiami senza attendere.", "urg_hor": "Accoglienza delle urgenze nei giorni feriali, durante gli orari di apertura.", "ortho_t": "Ortodonzia a Toulouse: un sorriso dritto, a ogni età", "ortho_p": "Il Dr Hugon de Scoeux adatta il trattamento a ciascuno: apparecchi classici o in ceramica, allineatori Invisalign®, Quad-Hélix per i più piccoli.", "ortho_tarifs_t": "Tariffe e rimborsi", "ortho_tar1": "Primo appuntamento: 23 €. Diagnosi, valutazione e preventivo dettagliato.", "ortho_tar2": "Prima dei 16 anni, con previo accordo dell'assicurazione sanitaria francese (Assurance maladie): base di rimborso di 193,50 € a semestre, per un massimo di sei semestri.", "ortho_tar3": "Contenzione dopo il trattamento: in genere da 100 a 800 € all'anno, a seconda della tecnica (filo o placca).", "ortho_tar4": "Adulti: in genere non rimborsato dalla Sécurité sociale; la Sua assicurazione integrativa (mutuelle) può coprirne una parte.", "ortho_ages_t": "Tre età, tre approcci", "cab_t": "Uno studio pensato per farLe dimenticare che sta andando « dal dentista »", "cab_p": "Attrezzature recenti, arredi scelti con cura, luce soffusa: lo studio Pierre de Fermat è stato ideato per accoglierLa in un luogo caldo e offrirLe un'odontoiatria di qualità in pieno centro a Toulouse.", "cab_l1": "Un team multidisciplinare: impianti, ortodonzia, estetica, gengive, bambini.", "cab_l2": "Piani di cura su misura, pensati per durare.", "cab_l3": "Le tecnologie più recenti, al servizio del comfort.", "cab_l4": "Il terzo pagante della Sécurité sociale: si ricordi della Sua carte Vitale.", "contact_t": "Scriverci, chiamarci, venire a trovarci", "contact_p": "Il modo più rapido: Doctolib, a qualsiasi ora. Altrimenti una telefonata o un messaggio, e il team Le risponde.", "form_nom": "Cognome e nome", "form_mail": "E-mail", "form_tel": "Telefono", "form_msg": "Il Suo messaggio", "form_send": "Invia il messaggio", "form_ok": "Grazie, il Suo messaggio è pronto. Nella versione finale arriverà direttamente alla segreteria.", "form_err": "Indichi il Suo nome e un'e-mail o un telefono, grazie.", "join_t": "Entrare nel team", "join_p": "Lo studio cerca sempre professionisti motivati, che abbiano voglia di lavorare con attrezzature recenti e di mettere la persona al centro. Assistente, odontoiatra, segretaria: si presenti.", "join_poste": "Posizione desiderata", "join_p1": "Odontoiatra", "join_p2": "Ortodontista", "join_p3": "Assistente di studio odontoiatrico", "join_p4": "Segretaria/o medica/o", "join_p5": "Altro", "join_cv": "Il Suo CV (PDF)", "join_send": "Invia la mia candidatura", "leg_t": "Note legali", "conf_t": "Informativa sulla privacy", "foot_tag": "Studio dentistico Pierre de Fermat · SELAS · Toulouse", "foot_soc": "Prenota un appuntamento online", "foot_proto": "Proposta di rifacimento realizzata da Neovera Studio. Contenuti ripresi dal sito attuale dello studio.", "adv_btn": "La aiuto a scegliere", "adv_hello": "Buongiorno, sono Fermat Conseil, l'assistente virtuale dello studio. Rispondo su cure, orari, come arrivare, urgenze e rimborsi.", "adv_tag": "Assistente virtuale", "adv_ph": "Faccia la Sua domanda…", "adv_send": "Invia", "adv_invite": "Una domanda su una cura, un appuntamento? La oriento io.", "adv_close": "Chiudi", "q_rdv": "Prenotare un appuntamento", "q_urg": "Ho male, è urgente", "q_rb": "Rimborsi", "q_acces": "Venire allo studio", "q_ortho": "Ortodonzia", "q_impl": "Impianto", "lang_l": "Lingua", "menu_l": "Menu principale", "skip": "Vai al contenuto", "illus": "Illustrazione del sito attuale", "minutes": "min di lettura", "art_more": "Per approfondire, ne parli con lo studio al Suo prossimo appuntamento.", "not_found": "Questa pagina non esiste. Torni alla home."}, "soins": {"gouttieres": {"t": "Placche dentali", "s": "Per chi? Per cosa?", "p": "La placca è un apparecchio rimovibile fatto su misura, a partire da un'impronta digitale dei Suoi denti. Serve a proteggere, sbiancare o allineare.", "k": ["Bruxismo: la placca di svincolo occlusale protegge i denti che digrignano di notte e allevia la mandibola.", "Ortodonzia: gli allineatori trasparenti spostano i denti con delicatezza.", "Contenzione: portata di notte dopo un trattamento, mantiene il risultato.", "Sport: una placca di protezione evita di rompere i denti negli urti."], "r": "Copertura variabile a seconda dell'uso: lo studio Le consegna un preventivo."}, "invisalign": {"t": "Invisalign®", "s": "L'ortodonzia discreta", "p": "Mascherine trasparenti, stampate in 3D, che allineano i denti senza fili né apparecchi. Per adulti, adolescenti e alcuni bambini.", "k": ["Discreto, comodo, facile da pulire, si toglie durante i pasti.", "Prima visita: le Sue aspettative e un esame per capire se il trattamento fa per Lei.", "Valutazione: radiografia laterale, impronte 3D, poi piano di cura simulato in 3D e preventivo dettagliato.", "Professionisti certificati Invisalign® nello studio."], "r": "Prezzo definito dopo la valutazione, preventivo consegnato prima di qualsiasi impegno."}, "caries": {"t": "Carie", "s": "Una bocca sana, senza carie", "p": "La carie è la distruzione del dente da parte dei batteri della placca. Se presa in tempo si cura facilmente; se trascurata, raggiunge il nervo.", "k": ["Quattro stadi: demineralizzazione, carie dello smalto, carie profonda, infezione della polpa.", "Carie piccola: otturazione in composito, del colore del dente.", "Più estesa: inlay o onlay in ceramica, o corona se il dente è molto compromesso.", "Prevenzione: spazzolamento, alimentazione meno zuccherata, pulizia dal tartaro almeno una volta all'anno."], "r": "Cura comune: rimborsata al 70 % dall'assicurazione sanitaria, il resto dalla Sua assicurazione integrativa (mutuelle)."}, "detartrage": {"t": "Pulizia dal tartaro", "s": "Denti lisci, un sorriso nitido", "p": "Il tartaro è placca che si è indurita: lo spazzolino non la toglie più. La pulizia lo rimuove in una seduta, senza dolore.", "k": ["Ultrasuoni per staccare il tartaro, anche nelle zone difficili.", "Lucidatura per superfici lisce dove la placca si attacca meno.", "Almeno una volta all'anno, più spesso per fumatori o persone diabetiche.", "Levigatura radicolare se il tartaro è sceso sotto la gengiva."], "r": "Rimborsata dall'assicurazione sanitaria e dall'assicurazione integrativa (mutuelle)."}, "blanchiment": {"t": "Sbiancamento dentale", "s": "La luminosità ritrovata, in poche settimane", "p": "Con il tempo caffè, tè, vino e fumo opacizzano i denti e lo smalto si assottiglia. Lo sbiancamento fa guadagnare diverse tonalità di bianco.", "k": ["Visita preliminare: si controllano carie, gengive, sensibilità, eventuale gravidanza.", "Pulizia dal tartaro, air polishing, foto prima del trattamento.", "Impronta 3D e mascherine realizzate nello studio, consegnate con il prodotto.", "Riservato ai maggiori di 18 anni (perossido di carbamide, norma europea)."], "r": "Cura estetica non rimborsata: tariffa e durata presentate durante la visita."}, "devitalisation": {"t": "Devitalizzazione", "s": "Salvare il dente invece di estrarlo", "p": "Quando una carie profonda o un colpo raggiunge il nervo, si toglie la polpa, si pulisce e si sigillano i canali. Il dente viene conservato.", "k": ["Radiografie per decidere il trattamento.", "Anestesia locale: la cura si svolge senza dolore.", "Pulizia, disinfezione e otturazione dei canali.", "Ricostruzione: corona, inlay o onlay a seconda dello stato del dente."], "r": "Cura comune: rimborsata al 70 % dall'assicurazione sanitaria, il resto dalla Sua assicurazione integrativa (mutuelle)."}, "facettes": {"t": "Faccette dentali", "s": "Un nuovo sorriso, senza compromessi", "p": "Un sottile guscio di ceramica o composito incollato sulla parte visibile del dente: colore, forma e piccoli difetti vengono corretti.", "k": ["Per le tonalità che resistono allo sbiancamento e per i denti corti o rovinati.", "Poco invasivo: si prepara un sottile strato di smalto.", "Impronte ottiche, faccette su misura, incollaggio e lucidatura.", "Durano da 10 a 15 anni con una buona igiene."], "r": "Cura estetica: preventivo consegnato alla prima visita."}, "implants": {"t": "Impianti dentali", "s": "Il comfort di un dente naturale", "p": "Una radice artificiale in titanio posizionata nell'osso, poi una corona in ceramica. Per un dente, più denti o un'intera arcata.", "k": ["Corona su impianto, ponte su impianti, o protesi fissa senza palato su 4 o 6 impianti (All-on X®).", "Tasso di successo spesso superiore al 95 % su più anni.", "Dopo un trauma, una perdita legata alle gengive, un'agenesia o un dente impossibile da salvare.", "Alternative: ponte, ponte adesivo, protesi rimovibile parziale o totale."], "r": "Impianto non rimborsato dalla Sécurité sociale; la corona può esserlo in parte. Preventivo per la Sua assicurazione integrativa (mutuelle)."}, "couronnes": {"t": "Corone", "s": "Un dente rinforzato, che resta naturale", "p": "La corona ricopre interamente un dente rovinato per restituirgli forma, solidità e colore. In ceramica Emax o in zirconia.", "k": ["Esame clinico e radiografia, preventivo per la Sua assicurazione integrativa (mutuelle).", "Preparazione del dente, impronta ottica 3D.", "Quando è possibile, corona realizzata sotto i Suoi occhi dalla CEREC: se ne va con la corona un'ora dopo l'inizio dell'appuntamento.", "Durata: da 10 a 20 anni se ben curata."], "r": "Copertura parziale da parte dell'assicurazione sanitaria a seconda del materiale; preventivo per la Sua assicurazione integrativa (mutuelle)."}, "inlay": {"t": "Inlay, onlay, overlay", "s": "Riparare senza limare troppo", "p": "Un elemento in ceramica o zirconia, realizzato su misura dalla fresatrice dello studio, che riempie la cavità di un dente mediamente compromesso.", "k": ["Inlay: dentro il dente. Onlay: copre una parte della superficie. Overlay: copre tutta la superficie.", "Preserva più dente di una corona.", "Ceramica: resistente e del colore del dente.", "Realizzato nello studio, spesso in una sola seduta."], "r": "Copertura parziale a seconda del caso; preventivo consegnato prima della cura."}, "sagesse": {"t": "Denti del giudizio", "s": "Per una bocca in buona salute", "p": "I terzi molari spuntano tra i 16 e i 20 anni. Se posizionati male, fanno male, si infettano o spingono gli altri denti.", "k": ["Visita con radiografia panoramica prima di ogni decisione.", "Estrazione in anestesia locale, nello studio.", "Dopo: dolore e gonfiore sotto controllo, istruzioni consegnate.", "Lo studio è a due passi dal Capitole."], "r": "Estrazione rimborsata dall'assicurazione sanitaria e dall'assicurazione integrativa (mutuelle)."}, "greffe": {"t": "Innesto di gengiva", "s": "Quando la gengiva si ritira", "p": "Uno spazzolamento troppo energico può far retrocedere la gengiva: la radice si scopre e il dente diventa sensibile. L'innesto la ricopre.", "k": ["Protegge la radice e frena lo scalzamento.", "Rinforza una gengiva troppo sottile.", "Migliora l'estetica del sorriso.", "Controlli dopo l'intervento e consigli di spazzolamento."], "r": "Intervento poco rimborsato: preventivo consegnato prima dell'intervento."}, "bridge": {"t": "Ponte dentale", "s": "Un ponte tra due denti", "p": "Una protesi fissa che sostituisce uno o più denti appoggiandosi ai denti vicini.", "k": ["Ponte singolo per un dente, ponte completo per più denti.", "In ceramica per un risultato naturale.", "Masticazione comoda ed efficace ritrovata.", "Impronte digitali, prova, poi applicazione."], "r": "Copertura parziale da parte dell'assicurazione sanitaria; preventivo per la Sua assicurazione integrativa (mutuelle)."}, "conservateurs": {"t": "Cure conservative", "s": "Tenere i propri denti il più a lungo possibile", "p": "Curare il dente conservando il più possibile di tessuto sano, per evitare l'estrazione.", "k": ["Trattamento delle carie con il composito.", "Inlay e onlay in ceramica.", "Pulizia dal tartaro e profilassi.", "Trattamento endodontico (devitalizzazione)."], "r": "Cure comuni rimborsate al 70 % dall'assicurazione sanitaria."}, "restauration": {"t": "Restauro del sorriso", "s": "Luminosità e fiducia ritrovate", "p": "Più tecniche si combinano per abbellire il sorriso senza interventi pesanti.", "k": ["Corone interamente in ceramica: estetica e resistenza.", "Faccette: un sorriso trasformato in poche sedute.", "Mascherine invisibili: riallineare con discrezione.", "Sbiancamento, inlay e onlay, e trattamento dei problemi di occlusione."], "r": "A seconda delle cure scelte: preventivo dettagliato durante la visita."}, "titane": {"t": "Impianti in titanio", "s": "Una soluzione affidabile e duratura", "p": "Il titanio è il materiale di riferimento in implantologia dagli anni Ottanta: l'osso lo accetta e vi si salda.", "k": ["Valutazione delle Sue esigenze con i nostri dentisti.", "Inserimento dell'impianto, poi osteointegrazione (l'osso si salda al titanio).", "Vite di guarigione, poi restauro protesico.", "Titanio di grado 4 o 5, lo stesso usato in ortopedia."], "r": "Impianto non rimborsato dalla Sécurité sociale; preventivo per la Sua assicurazione integrativa (mutuelle)."}, "manquante": {"t": "Sostituire un dente mancante", "s": "Tre soluzioni, una è quella giusta", "p": "Un dente assente fa spostare i vicini, fa riassorbire l'osso e disturba nel mangiare o nel parlare. Si può sostituire.", "k": ["L'impianto: la soluzione duratura.", "Il ponte: un'alternativa fissa efficace.", "La protesi rimovibile: temporanea o definitiva.", "La scelta si fa insieme, in base all'osso, ai denti vicini e al budget."], "r": "A seconda della soluzione: preventivo comparativo consegnato durante la visita."}, "paro": {"t": "Parodontologia", "s": "Curare ciò che sostiene i denti", "p": "Gengiva, legamento, cemento e osso: quando si infiammano, i denti si scalzano. La parodontologia li cura.", "k": ["Segnali: gengive che sanguinano, rosse, alito cattivo, denti che si muovono.", "Pulizia dal tartaro e levigatura radicolare.", "Trattamenti chirurgici avanzati se necessario.", "Prevenzione e igiene adatte per durare nel tempo."], "r": "Una parte degli interventi è rimborsata; preventivo per il resto."}, "prevention": {"t": "Prevenzione dentale", "s": "La cura migliore è quella che si evita", "p": "Carie, malattie delle gengive: la maggior parte si può evitare. Il team La accompagna per mantenere una bocca sana.", "k": ["Spazzolamento con uno spazzolino adatto, filo interdentale e collutorio.", "Controlli e pulizie regolari.", "Consigli ed educazione all'igiene, fin dall'infanzia.", "Programma M'T dents dell'assicurazione sanitaria per bambini e giovani."], "r": "Visite di controllo rimborsate; M'T dents coperto al 100 %."}, "premiers-rdv": {"t": "Primi appuntamenti di ortodonzia", "s": "Il Suo problema diventa il nostro", "p": "Un dentista, un medico o Lei stesso/a avete notato un problema di allineamento. Tutto comincia con due appuntamenti.", "k": ["Prima visita: ci conosciamo, ascoltiamo le Sue aspettative, eseguiamo l'esame.", "Appuntamento di valutazione: scanner 3D, foto, teleradiografia.", "Piano di cura e preventivo spiegati passo dopo passo.", "Primo appuntamento: 23 €."], "r": "Prima dei 16 anni, rimborso dopo previo accordo dell'assicurazione sanitaria."}, "technologies": {"t": "Tecnologie di ortodonzia", "s": "Diagnosi precisa, trattamento confortevole", "p": "Lo studio si è attrezzato per risparmiarLe le paste per impronte e gli andirivieni.", "k": ["Scanner intraorale 3D TRIOS 3 (3Shape): impronte in pochi minuti.", "Radiografia panoramica e teleradiografia digitali.", "Sala di sterilizzazione dedicata.", "Stampante 3D per apparecchi e mascherine."], "r": ""}, "ortho-adulte": {"t": "Ortodonzia per adulti", "s": "Il Suo sorriso più bello, a ogni età", "p": "L'età non è un ostacolo finché gengive e osso sono in buona salute. Gli apparecchi sono diventati discreti.", "k": ["Allineatori trasparenti: estetici e rimovibili.", "Apparecchi in ceramica: del colore del dente.", "Ortodonzia preprotesica per preparare impianti o corone.", "Associata alla chirurgia per i grandi disallineamenti delle mascelle."], "r": "In genere non rimborsata per l'adulto; l'assicurazione integrativa (mutuelle) può contribuire."}, "ortho-ado": {"t": "Ortodonzia per adolescenti", "s": "Il momento giusto per agire", "p": "In adolescenza sono presenti tutti i denti definitivi e la crescita aiuta ancora: è il momento ideale.", "k": ["Apparecchi multibracket (fissi).", "Mascherine trasparenti (allineatori).", "Estrazione di denti definitivi se necessario.", "Agire prima della fine della crescita per correggere i disallineamenti ossei."], "r": "Prima dei 16 anni: rimborso dopo previo accordo (base 193,50 € a semestre)."}, "ortho-enfant": {"t": "Ortodonzia per bambini", "s": "Guidare la crescita", "p": "Alcuni squilibri compaiono presto e disturbano la masticazione, la deglutizione o la respirazione. Si può intervenire presto.", "k": ["Correzione dei disallineamenti tra le mascelle.", "Espansione del palato (Quad-Hélix).", "Riposizionamento dei denti troppo avanzati.", "Correzione delle cattive abitudini: dito, lingua."], "r": "Rimborso dopo previo accordo dell'assicurazione sanitaria."}}, "arts": {"adulte": {"t": "L'ortodonzia, anche una questione da adulti", "s": "Sempre più adulti migliorano il proprio sorriso e la salute dei denti grazie ad apparecchi discreti.", "k": ["Affollamenti e disallineamenti peggiorano con l'età.", "Apparecchi in metallo o ceramica, allineatori Invisalign®, mascherine, chirurgia se necessario.", "Diagnosi completa prima di scegliere l'apparecchio."]}, "implant": {"t": "Che cos'è un impianto dentale e come funziona?", "s": "Una vite in titanio che sostituisce la radice di un dente mancante, in anestesia locale.", "k": ["Visita e diagnosi, poi intervento chirurgico.", "Posizionamento preciso della vite in titanio, guarigione di alcuni mesi.", "Vantaggi, rischi e controindicazioni spiegati prima di decidere."]}, "infection": {"t": "Quali sono i sintomi di un'infezione dentale?", "s": "Dolore pulsante, gengiva gonfia, cattivo sapore: riconoscere un'infezione e reagire in fretta.", "k": ["Segnali: dolore, sensibilità, ascesso, febbre, guancia gonfia.", "Cause: carie profonda, trauma, gengive malate, dente del giudizio.", "Se non curata, l'infezione può estendersi: consulti rapidamente."]}, "gencives": {"t": "Come prevenire le malattie delle gengive?", "s": "Gengivite e parodontite avanzano spesso in silenzio. Ecco come fermarle.", "k": ["La gengivite è reversibile, la parodontite distrugge l'osso.", "Igiene rigorosa, alimentazione, controlli regolari.", "Sanguinamenti, gengive che si ritirano: è il momento di consultare."]}, "caries": {"t": "Quali sono le cause delle carie e come prevenirle?", "s": "Batteri, zucchero e tempo: capire la carie per evitarla.", "k": ["I batteri della placca attaccano lo smalto, poi la dentina.", "Spazzolamento, filo interdentale, meno zucchero, pulizia regolare dal tartaro.", "Una carie curata in tempo evita la devitalizzazione."]}, "frequence": {"t": "Ogni quanto andare dal dentista?", "s": "Bambini, adulti, anziani: il ritmo giusto dipende dall'età e dalla storia di ciascuno.", "k": ["In genere un controllo ogni sei mesi.", "Più spesso per i fumatori, i diabetici o chi porta un apparecchio.", "Le visite regolari evitano le cure impegnative."]}, "ortho-bienfaits": {"t": "L'ortodonzia non serve solo ad allineare i denti", "s": "Masticazione, respirazione, articolazione della mandibola: i benefici poco noti.", "k": ["Corregge le malocclusioni che disturbano nel mangiare o nel respirare.", "Possibile a ogni età.", "Durata e costo spiegati durante la valutazione."]}, "brossage": {"t": "Come lavarsi correttamente i denti?", "s": "Spazzolino, dentifricio, gesto, durata: la guida completa.", "k": ["Due minuti, due volte al giorno, spazzolino morbido cambiato ogni tre mesi.", "Dentifricio al fluoro, filo o scovolini come complemento.", "Gli errori da evitare e i consigli per i più piccoli."]}, "rembourse": {"t": "L'ortodonzia è rimborsata?", "s": "Sécurité sociale, assicurazione integrativa (mutuelle), bambini, adulti: chi paga cosa.", "k": ["Prima dei 16 anni: 70 % della tariffa convenzionata dopo previo accordo.", "Adulti: raramente rimborsata, salvo casi chirurgici.", "L'assicurazione integrativa (mutuelle) completa a seconda del contratto: chieda un preventivo."]}, "ronfler": {"t": "Come dormire senza russare?", "s": "Un adulto su quattro russa. Il dentista può aiutare.", "k": ["Dormire su un fianco, perdere peso, meno alcol e fumo.", "L'ortesi di avanzamento mandibolare, portata di notte, libera le vie respiratorie.", "Se il russamento persiste: parere di un medico otorinolaringoiatra."]}, "mtdents": {"t": "L'esame M'T dents", "s": "L'appuntamento di prevenzione offerto dall'assicurazione sanitaria.", "k": ["Ogni anno a partire dai 3 anni dal 2025, esteso progressivamente fino ai 28 anni entro il 2028.", "Un esame dedicato per le donne in gravidanza dal 4° mese.", "Invito per posta, disponibile anche su ameli.fr."]}, "gouttieres": {"t": "Placca dentale: per chi? per cosa?", "s": "Bruxismo, sbiancamento, allineamento, sport: una placca, più usi.", "k": ["Fatta su misura a partire da un'impronta digitale.", "Di giorno o di notte a seconda della prescrizione.", "Manutenzione semplice, durata e costo spiegati nello studio."]}, "role-ortho": {"t": "Qual è il ruolo di un ortodontista?", "s": "Lo specialista dei denti e delle mascelle mal posizionati, per bambini e adulti.", "k": ["Diagnosi, prevenzione e trattamento delle malocclusioni.", "Quando consultare: denti sovrapposti, mascelle disallineate, masticazione difficile.", "Trattamenti da 12 a 36 mesi, poi contenzione."]}, "cout-implant": {"t": "Qual è il costo medio di un impianto?", "s": "Che cosa comprende il prezzo e come ottenere il rimborso.", "k": ["Il prezzo comprende l'impianto, il moncone e la corona.", "L'impianto non è rimborsato; la corona può esserlo in parte.", "Invii il preventivo alla Sua assicurazione integrativa (mutuelle) prima dell'intervento."]}}, "faq": [["C'è una differenza tra dentista e chirurgo dentista?", "Nessuna. Tutti i professionisti ottengono il titolo di dottore in chirurgia dentale. Alcuni scelgono semplicemente di non praticare la chirurgia."], ["A che età portare il proprio bambino dal dentista?", "In teoria dai primi dentini, in pratica verso i 3 o 4 anni. Prima, se qualcosa La preoccupa."], ["Accettate le urgenze dentali?", "Sì. I pazienti già seguiti dallo studio vengono di norma ricevuti in giornata; gli altri in base agli orari disponibili."], ["Ho mal di denti, è una carie?", "Forse: un dolore può venire anche da un ascesso, da un dente del giudizio o dalle gengive. Prenoti un appuntamento: una visita rapida La solleverà il prima possibile."], ["Come verrò rimborsato?", "Visite e cure comuni (pulizia dal tartaro, carie, devitalizzazione, estrazione) sono rimborsate al 70 % dall'assicurazione sanitaria, il resto in genere dalla Sua assicurazione integrativa (mutuelle). Per le altre cure Le viene consegnato un preventivo."], ["Che cosa succede alla prima visita?", "Ci conosciamo, esaminiamo la Sua bocca, con radiografie se serve, e parliamo delle Sue aspettative. Se un trattamento è utile, Le proponiamo un piano spiegato passo dopo passo."], ["Ogni quanto venire?", "Un controllo ogni sei mesi: esame clinico e radiologico, e pulizia se serve. Più spesso a seconda della Sua situazione."], ["Posso farmi curare se sono incinta?", "Sì. Le gengive sono più sensibili durante la gravidanza: l'igiene conta ancora di più. Per alcune cure più impegnative chiediamo il parere del Suo ostetrico."], ["Quali tecnologie utilizzate?", "Imaging 3D e scanner intraorali, impronte digitali senza pasta, laser dentale, allineatori Invisalign®, implantologia guidata e corone o inlay realizzati sul posto in un'ora grazie alla CEREC®."]], "team_roles": {"sekkat": "Presidente dello studio · gengive, estetica, ortodonzia", "badoures": "Impianti, gengive, CAD/CAM", "beugnet": "Odontoiatra", "moreau": "Impianti e chirurgia ossea, gengive", "gouchet": "Odontoiatra", "panozzo": "Odontoiatria pediatrica e sedazione", "bramardi": "Cure in sedazione (MEOPA)", "lespinard": "Usura, impianti, faccette", "lignieres": "Odontoiatra", "hugon": "Ortodonzia, allineatori"}, "demo": {"mal": {"h": "Ho mal di denti", "or": "Un dolore può venire da una carie, da un ascesso, dalle gengive o da un dente del giudizio.", "donc": "Una visita rapida per trovare la causa e darLe sollievo.", "rb": "Visita e cure comuni rimborsate al 70 %, il resto dall'assicurazione integrativa (mutuelle).", "soin": "urgences"}, "casse": {"h": "Un dente si è rotto o è caduto", "or": "Dopo un trauma ogni ora conta, soprattutto se il dente è stato espulso.", "donc": "Conservi il dente nel latte e chiami subito lo studio.", "rb": "Cure d'urgenza rimborsate come cure comuni.", "soin": "urgences"}, "controle": {"h": "Vorrei un controllo o una pulizia dal tartaro", "or": "Il tartaro non va più via con lo spazzolino, e una carie agli inizi non fa male.", "donc": "Un controllo con pulizia dal tartaro, ogni sei mesi.", "rb": "Rimborsato dall'assicurazione sanitaria e dall'assicurazione integrativa (mutuelle).", "soin": "detartrage"}, "enfant": {"h": "Mio figlio ha i denti storti", "or": "Prima della fine della crescita si possono guidare le mascelle.", "donc": "Un primo appuntamento di ortodonzia (23 €) e una valutazione.", "rb": "Prima dei 16 anni, rimborsato dopo previo accordo (base 193,50 € a semestre).", "soin": "ortho-enfant"}, "aligner": {"h": "Vorrei i denti dritti (adulto)", "or": "L'ortodonzia non ha età e gli apparecchi sono diventati discreti.", "donc": "Allineatori Invisalign® o apparecchi in ceramica, dopo una valutazione 3D.", "rb": "In genere non rimborsato per l'adulto; l'assicurazione integrativa (mutuelle) può contribuire.", "soin": "invisalign"}, "manque": {"h": "Mi manca un dente", "or": "Un dente assente fa spostare i vicini e riassorbire l'osso.", "donc": "Impianto, ponte o protesi: scegliamo insieme.", "rb": "Impianto non rimborsato, corona in parte; preventivo per l'assicurazione integrativa (mutuelle).", "soin": "manquante"}, "blanc": {"h": "Vorrei denti più bianchi", "or": "Caffè, tè, fumo ed età opacizzano lo smalto.", "donc": "Uno sbiancamento con mascherine realizzate nello studio, o faccette se la tonalità resiste.", "rb": "Cura estetica non rimborsata, riservata ai maggiori di 18 anni.", "soin": "blanchiment"}, "saigne": {"h": "Le mie gengive sanguinano", "or": "Spesso è una gengivite: reversibile se presa in tempo.", "donc": "Una valutazione delle gengive, pulizia dal tartaro e levigatura se serve.", "rb": "Una parte degli interventi è rimborsata.", "soin": "paro"}, "sagesse": {"h": "I miei denti del giudizio mi danno fastidio", "or": "Se posizionati male, si infettano o spingono gli altri denti.", "donc": "Una radiografia panoramica, poi estrazione nello studio se necessario.", "rb": "Estrazione rimborsata dall'assicurazione sanitaria.", "soin": "sagesse"}, "enceinte": {"h": "Sono incinta", "or": "Le gengive sono più sensibili durante la gravidanza.", "donc": "Si consiglia un controllo; la maggior parte delle cure è possibile.", "rb": "Esame di prevenzione dedicato coperto dal 4° mese.", "soin": "prevention"}, "grince": {"h": "Digrigno i denti di notte", "or": "Il bruxismo consuma i denti e affatica la mandibola.", "donc": "Una placca di svincolo occlusale, fatta su misura.", "rb": "Copertura variabile: preventivo consegnato.", "soin": "gouttieres"}}, "adv": {"rdv": "Il modo più semplice: prenoti su Doctolib, a qualsiasi ora. Può anche chiamare il 05 87 14 06 17 nei giorni feriali.", "horaires": "Lo studio riceve dal lunedì al venerdì, dalle 8.30 alle 19.30. È chiuso nel fine settimana. (Orari da confermare con lo studio.)", "acces": "Rue Joseph-Lakanal, a Toulouse, di fronte al liceo Pierre-de-Fermat. Metro linea A, fermata Capitole, a due passi dalla piazza del Capitole e dalla piazza Saint-Pierre.", "parking": "Non ho informazioni sul parcheggio vicino allo studio. Il modo più semplice è la metro A, fermata Capitole, oppure chiamare il 05 87 14 06 17.", "urgence": "Nei giorni feriali chiami il 05 87 14 06 17: i pazienti dello studio vengono di norma ricevuti in giornata. La domenica e nei giorni festivi, un dentista di guardia è organizzato dall'Ordine in Haute-Garonne. Se la Sua vita è in pericolo, chiami il 15.", "rb": "Visite e cure comuni sono rimborsate al 70 % dall'assicurazione sanitaria, il resto in genere dalla Sua assicurazione integrativa (mutuelle). Si applica il terzo pagante: si ricordi della Sua carte Vitale. Per impianti, estetica o ortodonzia per adulti Le viene consegnato un preventivo.", "prix": "Il sito dello studio indica una sola tariffa: il primo appuntamento di ortodonzia a 23 €. Per le altre cure il prezzo dipende dalla Sua situazione: un preventivo Le viene consegnato durante la visita.", "implant": "Un impianto sostituisce la radice di un dente con una vite in titanio, poi si applica una corona. Nello studio i Drs Badoures, Moreau e Lespinard sono formati in implantologia. L'impianto non è rimborsato dalla Sécurité sociale, la corona può esserlo in parte.", "ortho": "Il Dr Hugon de Scoeux, ortodontista, tratta bambini, adolescenti e adulti: apparecchi, allineatori Invisalign®, Quad-Hélix. Primo appuntamento: 23 €. Prima dei 16 anni, rimborso dopo previo accordo.", "enfant": "Prima visita verso i 3 o 4 anni, prima in caso di problemi. La Dr Panozzo è formata in odontoiatria pediatrica e sedazione, la Dr Bramardi nelle cure con MEOPA. L'esame M'T dents è coperto.", "blanc": "Lo sbiancamento si fa con mascherine realizzate nello studio, dopo un controllo e una pulizia dal tartaro. Fa guadagnare fino a quattro tonalità. È riservato ai maggiori di 18 anni e non è rimborsato.", "facettes": "Le faccette sono sottili gusci in ceramica o composito incollati sulla parte visibile dei denti. Durano da 10 a 15 anni. La Dr Lespinard si è formata sulle faccette.", "detartrage": "La pulizia dal tartaro si fa in una seduta, con gli ultrasuoni, seguita da una lucidatura. Lo studio consiglia un controllo ogni sei mesi. È rimborsata.", "carie": "Un dolore può essere una carie, ma anche un ascesso o le gengive. Prenoti presto un appuntamento. Una carie piccola si cura con il composito; se più estesa, con un inlay o una corona.", "sagesse": "I denti del giudizio si estraggono nello studio, in anestesia locale, dopo una radiografia panoramica. L'estrazione è rimborsata.", "gencives": "Gengive che sanguinano sono spesso una gengivite. I Drs Sekkat, Badoures e Moreau sono formati in parodontologia. Prima pulizia dal tartaro e levigatura, chirurgia se necessario.", "enceinte": "Sì, può essere curata durante la gravidanza. Un esame di prevenzione è coperto dal 4° mese. Per le cure più impegnative chiediamo il parere del Suo ostetrico.", "cerec": "Lo studio ha una fresatrice CEREC®: quando è possibile, la Sua corona o il Suo inlay viene realizzato sotto i Suoi occhi e posizionato circa un'ora dopo l'inizio dell'appuntamento.", "equipe": "Dieci professionisti: Drs Sekkat, Badoures, Beugnet, Moreau, Gouchet, Panozzo, Bramardi, Lespinard, Lignères e Hugon de Scoeux. Veda la sezione Il team per le loro formazioni.", "job": "Lo studio assume regolarmente. Passi dalla pagina Lavora con noi per inviare la Sua candidatura.", "langues": "Non ho informazioni sulle lingue parlate da ciascun professionista. La cosa migliore è chiedere al 05 87 14 06 17.", "fallback": "Non ho la risposta a questa domanda e preferisco non dirLe imprecisioni. Lo studio Le risponderà al 05 87 14 06 17 o a bonjour@cabinet-dentaire-toulouse-fermat.fr.", "merci": "Con piacere. Buona giornata, e a presto allo studio.", "peur": "È frequente e l'équipe ci è abituata. La Dr.ssa Panozzo è formata in sedazione cosciente, la Dr.ssa Bramardi e la Dr.ssa Sekkat nelle cure con MEOPA (gas rilassante). Lo dica quando prenota: ci prenderemo il tempo necessario."}, "legal": {"edit": "Editore: Cabinet dentaire Pierre de Fermat, SELAS con capitale di 1 020 €, 6 rue Joseph-Lakanal, 31000 Toulouse. SIREN 988 229 043. Presidente: Dr Samia Sekkat. E-mail: bonjour@cabinet-dentaire-toulouse-fermat.fr.", "host": "Hosting: o2switch, 222-224 boulevard Gustave-Flaubert, 63000 Clermont-Ferrand.", "repro": "Tutti i testi, le foto e i contenuti del sito sono protetti: nessuna riproduzione senza il consenso dell'editore.", "data": "Le informazioni inviate tramite i moduli servono unicamente a rispondere alle Sue richieste e al follow-up dei pazienti. Vengono conservate per due anni. Può accedervi, correggerle o farle cancellare scrivendo a bonjour@cabinet-dentaire-toulouse-fermat.fr. Elenco d ance maladie）事先批准：每半年的报销基数为 193,50 €，最多六个半年。", "ortho_tar3": "矫正后保持器：一般每年 100 至 800 €，视方式（固定钢丝或牙套）而定。", "ortho_tar4": "成人：医保一般不报销；您的补充医疗保险（mutuelle）可能承担一部分。", "ortho_ages_t": "三个年龄段，三种思路", "cab_t": "一家让您忘了自己正在“看牙医”的诊所", "cab_p": "设备新，家具精挑细选，灯光柔和：Pierre de Fermat 诊所希望给您一个温暖的就诊环境，让您在图卢兹市中心就能享受优质的牙科服务。", "cab_l1": "多专科团队：种植、正畸、美学、牙龈、儿童。", "cab_l2": "量身定制、着眼长久的治疗方案。", "cab_l3": "最新的技术，只为让您更舒适。", "cab_l4": "支持医保第三方支付：请记得带上医保卡（carte Vitale）。", "contact_t": "写信、致电，或直接来诊所", "contact_p": "最快的方式是 Doctolib，随时可以预约。也可以打电话或留言，团队会回复您。", "form_nom": "姓名", "form_mail": "电子邮箱", "form_tel": "电话", "form_msg": "您的留言", "form_send": "发送留言", "form_ok": "谢谢，您的留言已准备好。正式上线后，它会直接送达前台。", "form_err": "请填写您的姓名，以及电子邮箱或电话。", "join_t": "加入我们的团队", "join_p": "诊所一直在寻找有热情的专业人士，愿意使用新设备工作，并把人放在第一位。无论是助理、医生还是秘书，欢迎来自我介绍。", "join_poste": "应聘职位", "join_p1": "牙科医生", "join_p2": "正畸医生", "join_p3": "牙科助理", "join_p4": "医务秘书", "join_p5": "其他", "join_cv": "您的简历（PDF）", "join_send": "提交申请", "leg_t": "法律声明", "conf_t": "隐私政策", "foot_tag": "Pierre de Fermat 牙科诊所 · SELAS · 图卢兹", "foot_soc": "在线预约", "foot_proto": "本改版方案由 Neovera Studio 制作，内容取自诊所现有网站。", "adv_btn": "帮您选择", "adv_hello": "您好，我是 Fermat Conseil，诊所的虚拟助手。我可以解答诊疗项目、营业时间、交通、急诊和报销方面的问题。", "adv_tag": "虚拟助手", "adv_ph": "请输入您的问题…", "adv_send": "发送", "adv_invite": "对某项治疗或预约有疑问？我来为您指路。", "adv_close": "关闭", "q_rdv": "预约就诊", "q_urg": "我牙痛，很急", "q_rb": "报销", "q_acces": "如何到诊所", "q_ortho": "正畸", "q_impl": "种植牙", "lang_l": "语言", "menu_l": "主菜单", "skip": "跳到正文", "illus": "现有网站的插图", "minutes": "分钟阅读", "art_more": "想了解更多，下次就诊时可以直接和诊所聊聊。", "not_found": "此页面不存在，请返回首页。"}, "soins": {"gouttieres": {"t": "牙套", "s": "适合谁？用来做什么？", "p": "牙套是一种可摘戴的定制装置，依据您牙齿的数字化印模制作，可用于保护、美白或矫正。", "k": ["磨牙症：咬合释放牙套可以保护夜间磨牙的牙齿，缓解下颌压力。", "正畸：透明矫治器温和地移动牙齿。", "保持：矫正后夜间佩戴，维持矫正效果。", "运动：护牙套可避免撞击时牙齿折断。"], "r": "报销情况视用途而定：诊所会给您一份报价单。"}, "invisalign": {"t": "Invisalign®", "s": "不显眼的正畸", "p": "透明牙套经 3D 打印制成，无需钢丝和托槽即可排齐牙齿。适合成人、青少年和部分儿童。", "k": ["隐形、舒适、易清洁，吃饭时可以取下。", "首次就诊：了解您的期望，并检查您是否适合这种治疗。", "评估：头颅侧位片、3D 印模，随后提供 3D 模拟的治疗方案和详细报价。", "诊所有获得 Invisalign® 认证的医生。"], "r": "价格在评估后确定，签订任何承诺之前都会先给您报价单。"}, "caries": {"t": "龋齿", "s": "健康的口腔，没有蛀牙", "p": "龋齿是牙菌斑中的细菌对牙齿的破坏。发现得早，治疗很简单；拖下去，就会伤到牙神经。", "k": ["分四个阶段：脱矿、釉质龋、深龋、牙髓感染。", "小的蛀洞：用与牙齿同色的树脂填补。", "较大的蛀洞：做陶瓷嵌体或高嵌体；如果牙齿损坏严重，则做牙冠。", "预防：认真刷牙，少吃甜食，每年至少洁牙一次。"], "r": "常规治疗：法国医保（Assurance maladie）报销 70 %，其余由您的补充医疗保险（mutuelle）承担。"}, "detartrage": {"t": "洁牙", "s": "牙面光滑，笑容清爽", "p": "牙结石就是变硬的牙菌斑，牙刷已经刷不掉了。洁牙一次就能清除，而且不疼。", "k": ["用超声波震落牙结石，难清洁的部位也能处理。", "抛光，让牙面更光滑，不易挂菌斑。", "每年至少一次；吸烟者或糖尿病患者要更勤一些。", "如果牙结石已伸到牙龈下，则需要龈下刮治。"], "r": "由医保（Assurance maladie）和补充医疗保险（mutuelle）报销。"}, "blanchiment": {"t": "牙齿美白", "s": "几周内找回光泽", "p": "时间一长，咖啡、茶、红酒和烟会让牙齿暗淡，釉质也会变薄。美白可以提亮好几个色阶。", "k": ["先做检查：龋齿、牙龈、敏感程度和是否怀孕都要确认。", "洁牙、喷砂抛光，治疗前拍照。", "在诊所取 3D 印模并制作牙套，连同美白产品一并交给您。", "仅限 18 岁以上（过氧化脲，欧盟规定）。"], "r": "美学项目，医保不报销：费用和疗程会在就诊时向您说明。"}, "devitalisation": {"t": "根管治疗（去神经）", "s": "保住牙，而不是拔掉", "p": "当深龋或外伤伤到牙神经时，我们会取出牙髓，清洁并封闭根管，牙齿得以保留。", "k": ["拍 X 光片，决定治疗方案。", "局部麻醉：治疗过程不疼。", "清洁、消毒并充填根管。", "修复重建：视牙齿状况做牙冠、嵌体或高嵌体。"], "r": "常规治疗：法国医保（Assurance maladie）报销 70 %，其余由您的补充医疗保险（mutuelle）承担。"}, "facettes": {"t": "牙贴面", "s": "全新的笑容，毫不将就", "p": "一层薄薄的陶瓷或树脂壳粘在牙齿可见的一面：颜色、形状和小瑕疵都能修正。", "k": ["适合美白效果不理想的牙色，以及偏短或受损的牙齿。", "创伤很小：只需磨去薄薄一层釉质。", "光学印模，定制贴面，粘接后抛光。", "保持良好的口腔卫生，可使用 10 至 15 年。"], "r": "美学项目：首次就诊时会给您报价单。"}, "implants": {"t": "种植牙", "s": "和天然牙一样舒适", "p": "把人工钛牙根植入骨内，再装上陶瓷牙冠。可以种一颗、几颗，甚至整个牙弓。", "k": ["种植牙冠、种植牙桥，或在 4 颗或 6 颗种植体上做无腭托的固定修复（All-on X®）。", "成功率往往在多年后仍超过 95 %。", "适用于外伤、牙周原因导致的缺牙、先天缺牙，或无法保留的牙。", "替代方案：牙桥、粘接桥、部分或全口活动义齿。"], "r": "种植体医保（Sécurité sociale）不报销；牙冠可能部分报销。可出具报价单供您的补充医疗保险（mutuelle）使用。"}, "couronnes": {"t": "牙冠", "s": "加固受损的牙，仍是您自己的牙", "p": "牙冠完整包住受损的牙，恢复它的形状、强度和颜色。材质为 Emax 陶瓷或氧化锆。", "k": ["临床检查和 X 光片，并出具报价单供您的补充医疗保险（mutuelle）使用。", "预备牙齿，光学 3D 印模。", "条件允许时，由 CEREC 在您眼前加工牙冠：从预约开始约一小时后，您就能戴着新牙冠离开。", "保养得当，寿命为 10 至 20 年。"], "r": "医保（Assurance maladie）视材料部分报销；报价单可供您的补充医疗保险（mutuelle）使用。"}, "inlay": {"t": "嵌体、高嵌体、全覆盖嵌体", "s": "修补时少磨一点牙", "p": "由诊所的加工机定制的陶瓷或氧化锆修复体，用来填补中度受损牙齿的缺损。", "k": ["嵌体（inlay）：嵌在牙内。高嵌体（onlay）：覆盖部分牙面。全覆盖嵌体（overlay）：覆盖整个牙面。", "比牙冠保留更多的牙体组织。", "陶瓷：坚固，且与牙齿同色。", "在诊所内制作，往往一次就能完成。"], "r": "视情况部分报销；治疗前会先给您报价单。"}, "sagesse": {"t": "智齿", "s": "为了口腔健康", "p": "第三磨牙在 16 至 20 岁之间萌出。如果位置不正，会疼痛、发炎，或者顶挤其他牙齿。", "k": ["做决定前先看诊并拍全景片。", "在诊所局部麻醉下拔除。", "术后：疼痛和肿胀可控，并会给您术后注意事项。", "诊所离 Capitole 只有几步路。"], "r": "拔牙由医保（Assurance maladie）和补充医疗保险（mutuelle）报销。"}, "greffe": {"t": "牙龈移植", "s": "牙龈萎缩时", "p": "刷牙太用力会让牙龈退缩：牙根暴露，牙齿变得敏感。牙龈移植可以把它重新盖住。", "k": ["保护牙根，延缓牙龈继续退缩。", "加强过薄的牙龈。", "改善笑容的美观。", "术后随访，并指导刷牙方法。"], "r": "报销比例较低：手术前会先给您报价单。"}, "bridge": {"t": "牙桥", "s": "在两颗牙之间架一座桥", "p": "一种固定修复体，以邻牙为支撑，替代一颗或多颗缺失的牙。", "k": ["单颗牙用单位桥，多颗牙用完整牙桥。", "选用陶瓷，效果自然。", "恢复舒适而高效的咀嚼。", "数字化印模、试戴，然后粘固。"], "r": "医保（Assurance maladie）部分报销；报价单可供您的补充医疗保险（mutuelle）使用。"}, "conservateurs": {"t": "保存性治疗", "s": "尽可能长久地保住自己的牙", "p": "治疗时尽量保留健康的牙体组织，避免拔牙。", "k": ["用树脂治疗龋齿。", "陶瓷嵌体和高嵌体。", "洁牙与预防护理。", "牙髓治疗（根管治疗）。"], "r": "常规治疗：法国医保（Assurance maladie）报销 70 %。"}, "restauration": {"t": "笑容修复", "s": "找回光彩与自信", "p": "多种技术结合使用，不必大动干戈，就能让笑容更美。", "k": ["全瓷牙冠：美观又坚固。", "牙贴面：几次就诊，笑容焕然一新。", "隐形牙套：不显眼地重新排齐牙齿。", "美白、嵌体与高嵌体，以及咬合问题的处理。"], "r": "视您选择的项目而定：咨询时会给您详细报价。"}, "titane": {"t": "钛种植体", "s": "可靠而持久的方案", "p": "自 1980 年代以来，钛一直是种植牙的首选材料：骨头能接纳它，并与它长在一起。", "k": ["与我们的牙医一起评估您的需求。", "植入种植体，然后等待骨结合（骨头与钛长合在一起）。", "安装愈合基台，再进行修复。", "使用 4 级或 5 级钛，与骨科所用的相同。"], "r": "种植体医保（Sécurité sociale）不报销；报价单可供您的补充医疗保险（mutuelle）使用。"}, "manquante": {"t": "修复缺失的牙", "s": "三种方案，选对一种", "p": "缺了牙，邻牙会移位，牙槽骨会萎缩，吃东西和说话也会受影响。缺牙是应该补上的。", "k": ["种植牙：持久的方案。", "牙桥：有效的固定替代方案。", "活动义齿：可作临时或长期使用。", "方案由我们一起商量，依据骨量、邻牙情况和预算来定。"], "r": "视方案而定：咨询时会给您一份对比报价单。"}, "paro": {"t": "牙周治疗", "s": "照顾好固定牙齿的组织", "p": "牙龈、牙周韧带、牙骨质和牙槽骨：它们一旦发炎，牙齿就会松动。牙周治疗就是针对这些组织。", "k": ["征兆：牙龈出血、发红，口臭，牙齿松动。", "洁牙和牙根面刮治。", "必要时进行进阶的手术治疗。", "针对您的情况做预防和口腔护理，让效果长久。"], "r": "部分项目可以报销；其余部分会给您报价单。"}, "prevention": {"t": "牙齿预防", "s": "最好的治疗，是不必治疗", "p": "龋齿、牙龈疾病：多数都可以预防。团队会陪您一起保持口腔健康。", "k": ["选对牙刷，配合牙线和漱口水刷牙。", "定期检查和洁牙。", "从小开始的口腔卫生指导与教育。", "法国医保（Assurance maladie）面向儿童和青少年的 M'T dents 计划。"], "r": "检查类就诊可报销；M'T dents 由医保 100 % 承担。"}, "premiers-rdv": {"t": "正畸的最初几次就诊", "s": "您的问题，就是我们的问题", "p": "牙医、医生或您自己发现了牙齿排列的问题。一切从两次就诊开始。", "k": ["首次就诊：互相认识，倾听您的期望，并做检查。", "评估就诊：3D 扫描、拍照、头颅侧位片。", "治疗方案和报价，一步一步向您解释。", "首次就诊：23 €。"], "r": "16 岁以下，经法国医保（Assurance maladie）事先批准后可报销。"}, "technologies": {"t": "正畸技术", "s": "诊断精准，治疗舒适", "p": "诊所配备这些设备，是为了让您不必再咬印模泥，也少跑几趟。", "k": ["TRIOS 3（3Shape）口内 3D 扫描仪：几分钟就能完成取模。", "数字化全景片和头颅侧位片。", "独立的消毒室。", "3D 打印机，用于制作矫治器和牙套。"], "r": ""}, "ortho-adulte": {"t": "成人正畸", "s": "任何年龄，都能拥有最美的笑容", "p": "只要牙龈和牙槽骨健康，年龄不是障碍。如今的矫治器已经很不起眼。", "k": ["透明矫治器：美观，可自行摘戴。", "陶瓷托槽：与牙齿同色。", "修复前正畸：为种植牙或牙冠做准备。", "颌骨错位较大时，可配合手术。"], "r": "成人一般不报销；补充医疗保险（mutuelle）可能承担一部分。"}, "ortho-ado": {"t": "青少年正畸", "s": "出手的好时机", "p": "到了青春期，恒牙已经长齐，身体还在发育，对矫正仍有帮助：正是理想的时机。", "k": ["多托槽矫治器（牙套）。", "透明牙套（隐形矫治器）。", "必要时拔除部分恒牙。", "在生长发育结束前介入，以纠正骨性错位。"], "r": "16 岁以下：经事先批准后可报销（基数为每半年 193,50 €）。"}, "ortho-enfant": {"t": "儿童正畸", "s": "引导颌骨生长", "p": "有些失衡出现得很早，会影响咀嚼、吞咽或呼吸。可以尽早介入。", "k": ["纠正上下颌之间的错位。", "腭部扩弓（Quad-Hélix）。", "把过于前突的牙齿调整到合适位置。", "纠正不良习惯：吮拇指、顶舌。"], "r": "经法国医保（Assurance maladie）事先批准后可报销。"}}, "arts": {"adulte": {"t": "正畸，也是成年人的事", "s": "越来越多的成年人借助不起眼的矫治器，改善了笑容和牙齿健康。", "k": ["牙齿拥挤和错位会随年龄加重。", "金属或陶瓷托槽、Invisalign® 隐形矫正、牙套，必要时手术。", "选择矫治器之前，先做完整的诊断。"]}, "implant": {"t": "什么是种植牙？它是怎么起作用的？", "s": "一颗钛螺钉，在局部麻醉下替代缺失牙的牙根。", "k": ["先咨询诊断，再进行手术。", "精确植入钛螺钉，需要几个月愈合。", "优点、风险和禁忌症，会在您做决定前讲清楚。"]}, "infection": {"t": "牙齿感染有哪些症状？", "s": "跳痛、牙龈肿胀、口中有异味：学会识别感染，并及时应对。", "k": ["征兆：疼痛、敏感、脓肿、发烧、脸颊肿胀。", "原因：深龋、外伤、牙龈疾病、智齿。", "不治疗，感染可能扩散：请尽快就诊。"]}, "gencives": {"t": "如何预防牙龈疾病？", "s": "牙龈炎和牙周炎往往悄无声息地发展。以下是阻止它们的办法。", "k": ["牙龈炎可以逆转，牙周炎则会破坏牙槽骨。", "严格的口腔卫生、饮食习惯、定期检查。", "出血、牙龈萎缩：该去看医生了。"]}, "caries": {"t": "龋齿的成因是什么？如何预防？", "s": "细菌、糖和时间：了解龋齿，才能避免龋齿。", "k": ["牙菌斑中的细菌先侵蚀釉质，再侵蚀牙本质。", "刷牙、用牙线、少吃糖、定期洁牙。", "龋齿早治，可以避免根管治疗。"]}, "frequence": {"t": "多久看一次牙医？", "s": "儿童、成人、老年人：合适的频率取决于每个人的年龄和经历。", "k": ["一般每半年检查一次。", "吸烟者、糖尿病患者或戴矫治器的人要更勤一些。", "定期就诊，可以避免大治疗。"]}, "ortho-bienfaits": {"t": "正畸不只是把牙排整齐", "s": "咀嚼、呼吸、下颌关节：鲜为人知的好处。", "k": ["纠正影响进食或呼吸的错颌畸形。", "任何年龄都可以做。", "疗程和费用会在评估时向您说明。"]}, "brossage": {"t": "怎样正确刷牙？", "s": "牙刷、牙膏、手法、时长：完整指南。", "k": ["每天两次，每次两分钟，软毛牙刷每三个月更换一次。", "使用含氟牙膏，辅以牙线或牙缝刷。", "要避免的错误，以及给小朋友的建议。"]}, "rembourse": {"t": "正畸能报销吗？", "s": "医保、补充医疗保险、儿童、成人：谁付哪一部分。", "k": ["16 岁以下：经事先批准后，报销协议价的 70 %。", "成人：很少报销，除非是需要手术的情况。", "补充医疗保险（mutuelle）按合同补充：请向诊所要一份报价单。"]}, "ronfler": {"t": "怎样睡觉不打鼾？", "s": "四个成年人里就有一个打鼾。牙医可以帮上忙。", "k": ["侧卧睡、减重、少喝酒少抽烟。", "下颌前移矫治器夜间佩戴，可以让气道通畅。", "如果仍然打鼾：请咨询耳鼻喉科医生。"]}, "mtdents": {"t": "M'T dents 检查", "s": "法国医保（Assurance maladie）提供的免费预防就诊。", "k": ["自 2025 年起，3 岁起每年一次，并将逐步扩大，到 2028 年覆盖至 28 岁。", "孕妇自怀孕第 4 个月起有专门的检查。", "会通过信件邀请，也可在 ameli.fr 上查看。"]}, "gouttieres": {"t": "牙套：适合谁？用来做什么？", "s": "磨牙症、美白、矫正、运动：一副牙套，多种用途。", "k": ["依据数字化印模定制。", "按医嘱白天或夜间佩戴。", "护理简单，使用寿命和费用在诊所会向您说明。"]}, "role-ortho": {"t": "正畸医生是做什么的？", "s": "专门处理牙齿和颌骨错位的专科医生，儿童和成人都适用。", "k": ["错颌畸形的诊断、预防和治疗。", "何时就诊：牙齿拥挤、颌骨错位、咀嚼困难。", "疗程 12 至 36 个月，之后进入保持期。"]}, "cout-implant": {"t": "种植牙的平均费用是多少？", "s": "价格里包含什么，以及如何申请报销。", "k": ["价格包含种植体、基台和牙冠。", "种植体不报销；牙冠可能部分报销。", "手术前请把报价单寄给您的补充医疗保险（mutuelle）。"]}}, "faq": [["牙医和牙科外科医生有区别吗？", "没有区别。所有医生都获得牙科外科博士的头衔，只是有些人选择不做外科。"], ["孩子几岁带去看牙医？", "理论上长出第一颗牙就可以，实际上一般在 3 到 4 岁。如果您有任何担心，可以更早。"], ["你们接急诊吗？", "接。已在诊所就诊过的患者，通常当天即可接诊；其他患者视空余时段安排。"], ["我有颗牙疼，是蛀牙吗？", "有可能：疼痛也可能来自脓肿、智齿或牙龈。请预约就诊，尽快看诊能让您更快缓解。"], ["我能报销多少？", "检查和常规治疗（洁牙、龋齿、根管治疗、拔牙）由法国医保（Assurance maladie）报销 70 %，其余一般由您的补充医疗保险（mutuelle）承担。其他项目会给您一份报价单。"], ["第一次就诊会做什么？", "我们先互相认识，检查您的口腔，必要时拍 X 光片，并聊聊您的期望。如果需要治疗，我们会给您一份一步一步讲清楚的方案。"], ["多久来一次比较好？", "每半年检查一次：临床和影像检查，必要时洁牙。视您的情况，也可能更勤一些。"], ["怀孕了还能看牙吗？", "可以。孕期牙龈更敏感，口腔卫生就更重要。有些较大的治疗，我们会先征求您产科医生的意见。"], ["你们用了哪些技术？", "3D 影像和口内扫描仪、无需印模泥的数字化取模、牙科激光、Invisalign® 隐形矫正、导板种植，以及借助 CEREC® 在一小时内现场加工的牙冠或嵌体。"]], "team_roles": {"sekkat": "诊所负责人 · 牙龈、美学、正畸", "badoures": "种植、牙龈、CAD/CAM（计算机辅助设计与制造）", "beugnet": "牙科医生", "moreau": "种植与骨外科、牙龈", "gouchet": "牙科医生", "panozzo": "儿童牙科与镇静", "bramardi": "镇静下治疗（MEOPA）", "lespinard": "牙齿磨耗、种植、贴面", "lignieres": "牙科医生", "hugon": "正畸、隐形矫正"}, "demo": {"mal": {"h": "我有颗牙疼", "or": "疼痛可能来自龋齿、脓肿、牙龈或智齿。", "donc": "尽快看诊，找出原因并缓解疼痛。", "rb": "检查和常规治疗报销 70 %，其余由补充医疗保险（mutuelle）承担。", "soin": "urgences"}, "casse": {"h": "有颗牙折断了或掉了", "or": "外伤之后，每一个小时都很关键，尤其是牙齿脱落的时候。", "donc": "把牙齿放在牛奶里，立刻打电话给诊所。", "rb": "急诊治疗按常规治疗报销。", "soin": "urgences"}, "controle": {"h": "我想做检查或洁牙", "or": "牙结石刷不掉了，而初期的龋齿并不会痛。", "donc": "每半年做一次检查并洁牙。", "rb": "由医保（Assurance maladie）和补充医疗保险（mutuelle）报销。", "soin": "detartrage"}, "enfant": {"h": "我家孩子的牙齿排列不整齐", "or": "在发育结束前，可以引导颌骨生长。", "donc": "先做一次正畸首诊（23 €），并进行评估。", "rb": "16 岁以下，经事先批准后可报销（基数为每半年 193,50 €）。", "soin": "ortho-enfant"}, "aligner": {"h": "我想把牙齿排整齐（成人）", "or": "正畸没有年龄限制，而且矫治器已经很不起眼了。", "donc": "做完 3D 评估后，选择 Invisalign® 隐形矫正或陶瓷托槽。", "rb": "成人一般不报销；补充医疗保险（mutuelle）可能承担一部分。", "soin": "invisalign"}, "manque": {"h": "我缺了一颗牙", "or": "缺牙会让邻牙移位，牙槽骨萎缩。", "donc": "种植牙、牙桥还是义齿：我们一起商量着选。", "rb": "种植体不报销，牙冠部分报销；报价单可供补充医疗保险（mutuelle）使用。", "soin": "manquante"}, "blanc": {"h": "我想让牙齿更白", "or": "咖啡、茶、烟和年龄都会让釉质暗淡。", "donc": "用诊所自制的牙套美白；如果牙色效果不理想，可以考虑贴面。", "rb": "美学项目，医保不报销，仅限 18 岁以上。", "soin": "blanchiment"}, "saigne": {"h": "我的牙龈出血", "or": "多半是牙龈炎：发现得早，就可以逆转。", "donc": "先做牙龈评估，必要时洁牙和龈下刮治。", "rb": "部分项目可以报销。", "soin": "paro"}, "sagesse": {"h": "我的智齿让我很不舒服", "or": "位置不正的智齿会发炎，或者顶挤其他牙齿。", "donc": "先拍全景片，必要时在诊所拔除。", "rb": "拔牙由医保（Assurance maladie）报销。", "soin": "sagesse"}, "enceinte": {"h": "我怀孕了", "or": "孕期牙龈更敏感。", "donc": "建议做一次检查；大多数治疗都可以进行。", "rb": "自怀孕第 4 个月起，有专门的预防检查由医保承担。", "soin": "prevention"}, "grince": {"h": "我夜里磨牙", "or": "磨牙症会磨损牙齿，让下颌疲劳。", "donc": "定制一副咬合释放牙套。", "rb": "报销情况视用途而定：会给您报价单。", "soin": "gouttieres"}}, "adv": {"rdv": "最简单的方式：通过 Doctolib 预约，随时都可以。工作日也可以拨打 05 87 14 06 17。", "horaires": "诊所周一至周五 8:30 至 19:30 接诊，周末休息。（营业时间有待向诊所确认。）", "acces": "位于图卢兹 Rue Joseph-Lakanal，Pierre-de-Fermat 高中对面。地铁 A 线，Capitole 站，离 Capitole 广场和 Saint-Pierre 广场只有几步路。", "parking": "我没有诊所附近停车的信息。最方便的是乘地铁 A 线到 Capitole 站，或者拨打 05 87 14 06 17 询问。", "urgence": "工作日请拨打 05 87 14 06 17：诊所的患者通常当天即可接诊。 function etatK(){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Paris",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());const g=k=>p.find(x=>x.type==k).value;const d=g("weekday"),m=+g("hour")*60+ +g("minute");const we=["Sat","Sun"].includes(d);if(!we&&m>=510&&m<1170)return "open_until";if(!we&&m<510)return "open_at";if(we||d=="Fri")return "reopen";return "reopen_tom"}

let SP=1;
