ra entender antes de venir.", "blog_all": "Todo el cuaderno", "read": "Leer el artículo", "soins_t": "Todos los tratamientos de la clínica", "soins_p": "Veintiséis fichas, ordenadas como usted las busca.", "fam_all": "Ver todo", "fam_quot": "Cuidados del día a día", "fam_esth": "Estética", "fam_rempl": "Sustituir un diente", "fam_genc": "Encías", "fam_ortho": "Ortodoncia", "enbref": "En resumen", "back_soins": "Todos los tratamientos", "back_blog": "Todo el cuaderno", "rb_l": "Reembolso", "who_l": "Profesionales formados", "urg_t": "¿Una urgencia dental?", "urg_p": "Dolor agudo, absceso, golpe, diente roto: el equipo le atiende lo antes posible. A los pacientes que ya son de la clínica se les suele recibir el mismo día; a los demás, según los huecos disponibles.", "urg_garde_t": "Domingos y festivos", "urg_garde_p": "El Colegio de Cirujanos Dentistas del Alto Garona organiza un servicio de guardia. Si su vida corre peligro, llame al 15.", "urg_garde_note": "El sitio web actual indica llamar a la regulación al 05 87 14 06 17, que es el número de la clínica: número de guardia por confirmar con la clínica.", "urg_sit_t": "Situaciones que atendemos", "urg_s1": "Dolor dental intenso o persistente", "urg_s2": "Infección: absceso, encía infectada", "urg_s3": "Golpe o traumatismo: diente roto o arrancado", "urg_s4": "Dolor después de extraer una muela del juicio", "urg_s5": "Pérdida de un empaste o de una corona", "urg_causes_t": "Las causas más frecuentes", "urg_c1": "Absceso dental: pus alrededor de la raíz o en la encía. Dolor punzante, mejilla hinchada, a veces fiebre.", "urg_c2": "Gingivitis y periodontitis: encías rojas, hinchadas, que sangran al cepillarse.", "urg_c3": "Pericoronaritis: infección alrededor de una muela del juicio que sale mal.", "urg_c4": "Pulpitis: el nervio del diente está inflamado y el dolor le despierta por la noche.", "urg_c5": "Alveolitis: infección del alvéolo después de una extracción.", "urg_quoi_t": "Mientras espera su cita", "urg_q1": "Diente arrancado: sujételo por la corona, guárdelo en leche o en la boca, y venga enseguida.", "urg_q2": "Dolor: un analgésico adecuado, nunca aspirina sobre la encía, ni calor sobre la mejilla.", "urg_q3": "Mejilla hinchada o fiebre: llame sin esperar.", "urg_hor": "Atención de urgencias entre semana, en horario de apertura.", "ortho_t": "Ortodoncia en Toulouse: una sonrisa recta, a cualquier edad", "ortho_p": "El Dr. Hugon de Scoeux adapta el tratamiento a cada persona: brackets clásicos o cerámicos, alineadores Invisalign®, Quad-Hélix para los más jóvenes.", "ortho_tarifs_t": "Tarifas y reembolsos", "ortho_tar1": "Primera cita: 23 €. Diagnóstico, evaluación y presupuesto detallado.", "ortho_tar2": "Antes de los 16 años, con acuerdo previo de la Seguridad Social francesa (Assurance maladie): base de reembolso de 193,50 € por semestre, con un máximo de seis semestres.", "ortho_tar3": "Retención tras el tratamiento: por lo general de 100 a 800 € al año, según la técnica (alambre o férula).", "ortho_tar4": "Adultos: por lo general no lo reembolsa la Seguridad Social; su seguro complementario (mutuelle) puede cubrir una parte.", "ortho_ages_t": "Tres edades, tres enfoques", "cab_t": "Una clínica pensada para que se olvide de que va «al dentista»", "cab_p": "Equipamiento reciente, mobiliario escogido, luz suave: la clínica Pierre de Fermat se ha concebido para recibirle en un lugar acogedor y darle acceso a una odontología de calidad en pleno centro de Toulouse.", "cab_l1": "Un equipo multidisciplinar: implantes, ortodoncia, estética, encías, niños.", "cab_l2": "Planes de tratamiento a medida, pensados para durar.", "cab_l3": "Las últimas tecnologías, al servicio de su comodidad.", "cab_l4": "Tercero pagador con la Seguridad Social: no olvide su carte Vitale.", "contact_t": "Escríbanos, llámenos, venga", "contact_p": "Lo más rápido: Doctolib, a cualquier hora. Si no, una llamada o un mensaje, y el equipo se pondrá en contacto con usted.", "form_nom": "Nombre y apellidos", "form_mail": "Correo electrónico", "form_tel": "Teléfono", "form_msg": "Su mensaje", "form_send": "Enviar el mensaje", "form_ok": "Gracias, su mensaje está listo. En la versión final, llegará directamente a secretaría.", "form_err": "Indique, por favor, su nombre y un correo electrónico o un teléfono.", "join_t": "Únase al equipo", "join_p": "La clínica siempre busca profesionales motivados, con ganas de trabajar con equipamiento reciente y de poner a las personas en el centro. Auxiliar, odontólogo, secretaria: preséntese.", "join_poste": "Puesto deseado", "join_p1": "Cirujano dentista", "join_p2": "Ortodoncista", "join_p3": "Auxiliar dental", "join_p4": "Secretario/a médico/a", "join_p5": "Otro", "join_cv": "Su currículum (PDF)", "join_send": "Enviar mi candidatura", "leg_t": "Aviso legal", "conf_t": "Política de privacidad", "foot_tag": "Clínica dental Pierre de Fermat · SELAS · Toulouse", "foot_soc": "Pedir cita en línea", "foot_proto": "Propuesta de rediseño realizada por Neovera Studio. Contenidos tomados del sitio web actual de la clínica.", "adv_btn": "Le ayudo a elegir", "adv_hello": "Buenos días, soy Fermat Conseil, el asistente virtual de la clínica. Respondo sobre tratamientos, horarios, cómo llegar, urgencias y reembolsos.", "adv_tag": "Asistente virtual", "adv_ph": "Escriba su pregunta…", "adv_send": "Enviar", "adv_invite": "¿Una duda sobre un tratamiento o una cita? Le oriento.", "adv_close": "Cerrar", "q_rdv": "Pedir cita", "q_urg": "Me duele, es urgente", "q_rb": "Reembolsos", "q_acces": "Venir a la clínica", "q_ortho": "Ortodoncia", "q_impl": "Implante", "lang_l": "Idioma", "menu_l": "Menú principal", "skip": "Ir al contenido", "illus": "Ilustración del sitio web actual", "minutes": "min de lectura", "art_more": "Para saber más, coméntelo en la clínica en su próxima cita.", "not_found": "Esta página no existe. Vuelva al inicio."}, "soins": {"gouttieres": {"t": "Férulas dentales", "s": "¿Para quién? ¿Para qué?", "p": "Una férula es un aparato removible hecho a medida, a partir de una impresión digital de sus dientes. Sirve para proteger, aclarar o alinear.", "k": ["Bruxismo: la férula de descarga protege los dientes que rechinan por la noche y alivia la mandíbula.", "Ortodoncia: los alineadores transparentes mueven los dientes con suavidad.", "Retención: se lleva por la noche tras un tratamiento y mantiene el resultado.", "Deporte: una férula protectora evita dientes rotos en caso de golpe."], "r": "Cobertura variable según el uso: la clínica le entrega un presupuesto."}, "invisalign": {"t": "Invisalign®", "s": "La ortodoncia discreta", "p": "Férulas transparentes, impresas en 3D, que alinean los dientes sin alambres ni brackets. Para adultos, adolescentes y algunos niños.", "k": ["Discreto, cómodo, fácil de limpiar y se retira durante las comidas.", "Primera consulta: sus expectativas y una exploración para saber si el tratamiento le conviene.", "Evaluación: radiografía de perfil, impresiones 3D, y después plan de tratamiento simulado en 3D y presupuesto detallado.", "Profesionales certificados en Invisalign® en la clínica."], "r": "Precio fijado tras la evaluación; presupuesto entregado antes de cualquier compromiso."}, "caries": {"t": "Caries", "s": "Una boca sana, sin caries", "p": "La caries es la destrucción del diente por las bacterias de la placa. Si se trata pronto, se cura fácilmente; si se deja, llega al nervio.", "k": ["Cuatro fases: desmineralización, caries del esmalte, caries profunda, infección de la pulpa.", "Caries pequeña: empaste de composite, del color del diente.", "Más grande: inlay u onlay de cerámica, o corona si el diente está muy dañado.", "Prevención: cepillado, alimentación con menos azúcar, limpieza dental al menos una vez al año."], "r": "Tratamiento habitual: la Seguridad Social reembolsa el 70 % y el resto, su seguro complementario (mutuelle)."}, "detartrage": {"t": "Limpieza dental", "s": "Dientes lisos, una sonrisa limpia", "p": "El sarro es la placa que se ha endurecido: el cepillo ya no lo quita. La limpieza lo elimina en una sesión, sin dolor.", "k": ["Ultrasonidos para despegar el sarro, incluso en las zonas difíciles.", "Pulido para obtener superficies lisas donde la placa se adhiere menos.", "Al menos una vez al año, con más frecuencia en fumadores o personas con diabetes.", "Raspado radicular si el sarro ha bajado por debajo de la encía."], "r": "Reembolsado por la Seguridad Social y por el seguro complementario (mutuelle)."}, "blanchiment": {"t": "Blanqueamiento dental", "s": "El brillo recuperado, en unas semanas", "p": "Con el tiempo, el café, el té, el vino y el tabaco apagan los dientes, y el esmalte se adelgaza. El aclarado permite ganar varios tonos de blanco.", "k": ["Consulta previa: se revisan caries, encías, sensibilidad y embarazo.", "Limpieza, pulido con aire y fotos antes del tratamiento.", "Impresión 3D y férulas fabricadas en la clínica, que se le entregan con el producto.", "Reservado a mayores de 18 años (peróxido de carbamida, norma europea)."], "r": "Tratamiento estético no reembolsado: tarifa y duración se presentan en la consulta."}, "devitalisation": {"t": "Endodoncia", "s": "Salvar el diente en lugar de arrancarlo", "p": "Cuando una caries profunda o un golpe alcanza el nervio, se retira la pulpa, se limpia y se sellan los conductos. El diente se conserva.", "k": ["Radiografías para decidir el tratamiento.", "Anestesia local: el tratamiento se hace sin dolor.", "Limpieza, desinfección y obturación de los conductos.", "Reconstrucción: corona, inlay u onlay según el estado del diente."], "r": "Tratamiento habitual: la Seguridad Social reembolsa el 70 % y el resto, su seguro complementario (mutuelle)."}, "facettes": {"t": "Carillas dentales", "s": "Una sonrisa nueva, sin concesiones", "p": "Una fina lámina de cerámica o composite pegada en la cara visible del diente: se corrigen el color, la forma y los pequeños defectos.", "k": ["Para los tonos que resisten al blanqueamiento y los dientes cortos o dañados.", "Muy poco invasivo: se prepara una fina capa de esmalte.", "Impresiones ópticas, carillas a medida, pegado y después pulido.", "Duran de 10 a 15 años con una buena higiene."], "r": "Tratamiento estético: presupuesto entregado en la primera consulta."}, "implants": {"t": "Implantes dentales", "s": "La comodidad de un diente natural", "p": "Una raíz artificial de titanio colocada en el hueso y, después, una corona de cerámica. Para un diente, varios o toda una arcada.", "k": ["Corona sobre implante, puente sobre implantes o prótesis fija sin paladar sobre 4 o 6 implantes (All-on X®).", "Tasa de éxito a menudo superior al 95 % a lo largo de varios años.", "Tras un golpe, una pérdida por enfermedad de las encías, una agenesia o un diente imposible de salvar.", "Alternativas: puente, puente adhesivo, prótesis removible parcial o completa."], "r": "El implante no lo reembolsa la Seguridad Social; la corona puede estarlo en parte. Presupuesto para su seguro complementario (mutuelle)."}, "couronnes": {"t": "Coronas", "s": "Un diente reforzado, que sigue siendo natural", "p": "La corona cubre por completo un diente dañado para devolverle su forma, su solidez y su color. De cerámica Emax o de circonio.", "k": ["Exploración clínica y radiografía, presupuesto para su seguro complementario (mutuelle).", "Preparación del diente e impresión óptica 3D.", "Cuando es posible, corona fresada ante sus ojos por la CEREC: usted se va con ella una hora después de empezar la cita.", "Duración: de 10 a 20 años con buen mantenimiento."], "r": "Cobertura parcial de la Seguridad Social según el material; presupuesto para su seguro complementario (mutuelle)."}, "inlay": {"t": "Inlay, onlay, overlay", "s": "Reparar sin tallar demasiado", "p": "Una pieza de cerámica o de circonio, hecha a medida por la fresadora de la clínica, que rellena la cavidad de un diente moderadamente dañado.", "k": ["Inlay: dentro del diente. Onlay: cubre una parte de la superficie. Overlay: cubre toda la superficie.", "Conserva más diente que una corona.", "Cerámica: resistente y del color del diente.", "Fabricada en la clínica, a menudo en una sola sesión."], "r": "Cobertura parcial según el caso; presupuesto entregado antes del tratamiento."}, "sagesse": {"t": "Muelas del juicio", "s": "Para una boca sana", "p": "Los terceros molares salen entre los 16 y los 20 años. Mal colocados, duelen, se infectan o empujan a los demás dientes.", "k": ["Consulta con radiografía panorámica antes de cualquier decisión.", "Extracción con anestesia local, en la clínica.", "Después: dolor e hinchazón controlados, y se le entregan las pautas.", "La clínica está a dos pasos del Capitole."], "r": "Extracción reembolsada por la Seguridad Social y por el seguro complementario (mutuelle)."}, "greffe": {"t": "Injerto de encía", "s": "Cuando la encía se retrae", "p": "Un cepillado demasiado fuerte puede hacer retroceder la encía: la raíz queda al descubierto y el diente se vuelve sensible. El injerto la cubre.", "k": ["Protege la raíz y frena la pérdida de soporte del diente.", "Refuerza una encía demasiado fina.", "Mejora la estética de la sonrisa.", "Seguimiento tras la intervención y consejos de cepillado."], "r": "Acto con poco reembolso: presupuesto entregado antes de la intervención."}, "bridge": {"t": "Puente dental", "s": "Un puente entre dos dientes", "p": "Una prótesis fija que sustituye uno o varios dientes apoyándose en los dientes vecinos.", "k": ["Puente unitario para un diente, puente completo para varios.", "De cerámica para un aspecto natural.", "Se recupera una masticación cómoda y eficaz.", "Impresiones digitales, prueba y después colocación."], "r": "Cobertura parcial de la Seguridad Social; presupuesto para su seguro complementario (mutuelle)."}, "conservateurs": {"t": "Tratamientos conservadores", "s": "Conservar sus dientes el mayor tiempo posible", "p": "Tratar el diente conservando la mayor cantidad posible de tejido sano, para evitar la extracción.", "k": ["Tratamiento de las caries con composite.", "Inlays y onlays de cerámica.", "Limpieza dental y profilaxis.", "Tratamiento endodóntico (endodoncia)."], "r": "Tratamientos habituales reembolsados al 70 % por la Seguridad Social."}, "restauration": {"t": "Restauración de la sonrisa", "s": "Brillo y confianza recuperados", "p": "Se combinan varias técnicas para embellecer la sonrisa sin una intervención pesada.", "k": ["Coronas totalmente cerámicas: estética y resistencia.", "Carillas: una sonrisa transformada en unas pocas sesiones.", "Férulas invisibles: realinear con total discreción.", "Blanqueamiento, inlays y onlays, y tratamiento de los problemas de oclusión."], "r": "Según los tratamientos elegidos: presupuesto detallado en la consulta."}, "titane": {"t": "Implantes de titanio", "s": "Una solución fiable y duradera", "p": "El titanio es el material de referencia en implantología desde los años ochenta: el hueso lo acepta y se suelda a él.", "k": ["Evaluación de sus necesidades con nuestros dentistas.", "Colocación del implante y después osteointegración (el hueso se suelda al titanio).", "Tornillo de cicatrización y después restauración protésica.", "Titanio de grado 4 o 5, el mismo que se usa en ortopedia."], "r": "El implante no lo reembolsa la Seguridad Social; presupuesto para su seguro complementario (mutuelle)."}, "manquante": {"t": "Sustituir un diente que falta", "s": "Tres soluciones, una buena", "p": "Un diente ausente hace que se muevan los vecinos, hace que el hueso se pierda y dificulta comer o hablar. Se puede sustituir.", "k": ["El implante: la solución duradera.", "El puente: una alternativa fija eficaz.", "La prótesis removible: temporal o definitiva.", "La elección se hace entre los dos, según el hueso, los dientes vecinos y el presupuesto."], "r": "Según la solución: presupuesto comparativo entregado en la consulta."}, "paro": {"t": "Periodoncia", "s": "Cuidar lo que sujeta los dientes", "p": "Encía, ligamento, cemento y hueso: cuando se inflaman, los dientes pierden soporte. La periodoncia los trata.", "k": ["Señales: encías que sangran, rojas, mal aliento, dientes que se mueven.", "Limpieza y raspado radicular.", "Tratamientos quirúrgicos avanzados si hace falta.", "Prevención e higiene adaptadas para que dure."], "r": "Una parte de los actos está reembolsada; presupuesto para el resto."}, "prevention": {"t": "Prevención dental", "s": "El mejor tratamiento es el que se evita", "p": "Caries, enfermedades de las encías: la mayoría se pueden evitar. El equipo le acompaña para mantener una boca sana.", "k": ["Cepillado con un cepillo adecuado, hilo dental y colutorio.", "Revisiones y limpiezas periódicas.", "Consejos y educación en higiene, desde la infancia.", "Programa M'T dents de la Seguridad Social para niños y jóvenes."], "r": "Consultas de revisión reembolsadas; M'T dents cubierto al 100 %."}, "premiers-rdv": {"t": "Primeras citas de ortodoncia", "s": "Su problema pasa a ser el nuestro", "p": "Un dentista, un médico o usted mismo han detectado un problema de alineación. Todo empieza con dos citas.", "k": ["Primera consulta: nos conocemos, escuchamos sus expectativas, exploramos.", "Cita de evaluación: escáner 3D, fotos, telerradiografía.", "Plan de tratamiento y presupuesto explicados paso a paso.", "Primera cita: 23 €."], "r": "Antes de los 16 años, reembolso tras acuerdo previo de la Seguridad Social."}, "technologies": {"t": "Tecnologías de ortodoncia", "s": "Diagnóstico preciso, tratamiento cómodo", "p": "La clínica se ha equipado para ahorrarle las pastas de impresión y las idas y venidas.", "k": ["Escáner intraoral 3D TRIOS 3 (3Shape): impresiones en pocos minutos.", "Radiografía panorámica y telerradiografía digitales.", "Sala de esterilización exclusiva.", "Impresora 3D para los aparatos y las férulas."], "r": ""}, "ortho-adulte": {"t": "Ortodoncia para adultos", "s": "Su mejor sonrisa, a cualquier edad", "p": "La edad no es un obstáculo mientras las encías y el hueso estén sanos. Los aparatos se han vuelto discretos.", "k": ["Alineadores transparentes: estéticos y removibles.", "Brackets cerámicos: del color del diente.", "Ortodoncia preprotésica para preparar implantes o coronas.", "Combinada con cirugía para los grandes desajustes de mandíbula."], "r": "Por lo general no reembolsada en adultos; el seguro complementario (mutuelle) puede participar."}, "ortho-ado": {"t": "Ortodoncia para adolescentes", "s": "El buen momento para actuar", "p": "En la adolescencia ya están todos los dientes definitivos y el crecimiento todavía ayuda: es el momento ideal.", "k": ["Aparatos multibrackets.", "Férulas transparentes (alineadores).", "Extracción de dientes definitivos si es necesario.", "Actuar antes de que termine el crecimiento para corregir los desajustes óseos."], "r": "Antes de los 16 años: reembolso tras acuerdo previo (base de 193,50 € por semestre)."}, "ortho-enfant": {"t": "Ortodoncia infantil", "s": "Guiar el crecimiento", "p": "Algunos desequilibrios aparecen pronto y dificultan la masticación, la deglución o la respiración. Se puede intervenir pronto.", "k": ["Corrección de los desajustes entre las mandíbulas.", "Expansión del paladar (Quad-Hélix).", "Reposicionamiento de los dientes demasiado adelantados.", "Corrección de los malos hábitos: chuparse el dedo, empujar con la lengua."], "r": "Reembolso tras acuerdo previo de la Seguridad Social."}}, "arts": {"adulte": {"t": "La ortodoncia, también cosa de adultos", "s": "Cada vez más adultos mejoran su sonrisa y su salud dental con aparatos discretos.", "k": ["Los apiñamientos y desajustes se acentúan con la edad.", "Brackets metálicos o cerámicos, alineadores Invisalign®, férulas, cirugía si hace falta.", "Diagnóstico completo antes de elegir el aparato."]}, "implant": {"t": "¿Qué es un implante dental y cómo funciona?", "s": "Un tornillo de titanio que sustituye la raíz de un diente que falta, con anestesia local.", "k": ["Consulta y diagnóstico, y después intervención quirúrgica.", "Colocación precisa del tornillo de titanio y cicatrización de unos meses.", "Ventajas, riesgos y contraindicaciones explicados antes de decidir."]}, "infection": {"t": "¿Cuáles son los síntomas de una infección dental?", "s": "Dolor punzante, encía hinchada, mal sabor de boca: cómo reconocer una infección y reaccionar rápido.", "k": ["Señales: dolor, sensibilidad, absceso, fiebre, mejilla hinchada.", "Causas: caries profunda, golpe, encías enfermas, muela del juicio.", "Si no se trata, la infección puede extenderse: consulte pronto."]}, "gencives": {"t": "¿Cómo prevenir las enfermedades de las encías?", "s": "La gingivitis y la periodontitis suelen avanzar sin hacer ruido. Así se detienen.", "k": ["La gingivitis es reversible; la periodontitis destruye el hueso.", "Higiene rigurosa, alimentación, revisiones periódicas.", "Sangrado, encías que se retraen: es hora de consultar."]}, "caries": {"t": "¿Cuáles son las causas de las caries y cómo prevenirlas?", "s": "Bacterias, azúcar y tiempo: entender la caries para evitarla.", "k": ["Las bacterias de la placa atacan el esmalte y después la dentina.", "Cepillado, hilo, menos azúcar, limpieza dental periódica.", "Una caries tratada a tiempo evita la endodoncia."]}, "frequence": {"t": "¿Con qué frecuencia hay que ir al dentista?", "s": "Niños, adultos, personas mayores: el ritmo adecuado depende de la edad y de la historia de cada uno.", "k": ["Por lo general, una revisión cada seis meses.", "Con más frecuencia en fumadores, diabéticos o personas con aparatos.", "Las visitas periódicas evitan los tratamientos grandes."]}, "ortho-bienfaits": {"t": "La ortodoncia no sirve solo para alinear los dientes", "s": "Masticación, respiración, articulación de la mandíbula: los beneficios poco conocidos.", "k": ["Corrige las maloclusiones que dificultan comer o respirar.", "Es posible a cualquier edad.", "Duración y coste se explican en la evaluación."]}, "brossage": {"t": "¿Cómo cepillarse bien los dientes?", "s": "Cepillo, pasta, gesto, duración: la guía completa.", "k": ["Dos minutos, dos veces al día, con un cepillo suave que se cambia cada tres meses.", "Pasta con flúor, hilo o cepillos interdentales como complemento.", "Los errores que hay que evitar y los consejos para los más pequeños."]}, "rembourse": {"t": "¿Está reembolsada la ortodoncia?", "s": "Seguridad Social, seguro complementario (mutuelle), niños, adultos: quién paga qué.", "k": ["Antes de los 16 años: 70 % de la tarifa de convenio tras acuerdo previo.", "Adultos: rara vez se reembolsa, salvo casos quirúrgicos.", "El seguro complementario (mutuelle) completa según el contrato: pida un presupuesto."]}, "ronfler": {"t": "¿Cómo dormir sin roncar?", "s": "Uno de cada cuatro adultos ronca. El dentista puede ayudar.", "k": ["Dormir de lado, perder peso, tomar menos alcohol y tabaco.", "El dispositivo de avance mandibular, que se lleva por la noche, libera las vías respiratorias.", "Si el ronquido persiste: consulte a un otorrinolaringólogo."]}, "mtdents": {"t": "La revisión M'T dents", "s": "La cita de prevención que ofrece la Seguridad Social.", "k": ["Cada año a partir de los 3 años desde 2025, ampliada progresivamente hasta los 28 años de aquí a 2028.", "Una revisión específica para las mujeres embarazadas desde el cuarto mes.", "Invitación por correo postal, también disponible en ameli.fr."]}, "gouttieres": {"t": "Férula dental: ¿para quién? ¿para qué?", "s": "Bruxismo, aclarado, alineación, deporte: una férula, varios usos.", "k": ["Hecha a medida a partir de una impresión digital.", "De día o de noche según la prescripción.", "Mantenimiento sencillo; duración y coste se explican en la clínica."]}, "role-ortho": {"t": "¿Cuál es el papel de un ortodoncista?", "s": "El especialista en dientes y mandíbulas mal colocados, tanto en niños como en adultos.", "k": ["Diagnóstico, prevención y tratamiento de las maloclusiones.", "Cuándo consultar: dientes apiñados, mandíbulas desajustadas, masticación difícil.", "Tratamientos de 12 a 36 meses y después retención."]}, "cout-implant": {"t": "¿Cuál es el coste medio de un implante?", "s": "Qué incluye el precio y cómo conseguir el reembolso.", "k": ["El precio incluye el implante, el pilar y la corona.", "El implante no se reembolsa; la corona puede estarlo en parte.", "Envíe el presupuesto a su seguro complementario (mutuelle) antes de la intervención."]}}, "faq": [["¿Hay alguna diferencia entre dentista y cirujano dentista?", "Ninguna. Todos los profesionales obtienen el título de doctor en cirugía dental. Algunos simplemente eligen no practicar la cirugía."], ["¿A qué edad hay que llevar al niño al dentista?", "En teoría, desde los primeros dientes; en la práctica, hacia los 3 o 4 años. Antes si algo le preocupa."], ["¿Atienden urgencias dentales?", "Sí. A los pacientes que ya son de la clínica se les suele recibir el mismo día; a los demás, según los huecos disponibles."], ["Me duele un diente, ¿será una caries?", "Quizá: el dolor también puede venir de un absceso, de una muela del juicio o de las encías. Pida cita; una consulta rápida le aliviará cuanto antes."], ["¿Cómo me reembolsarán?", "Las consultas y los tratamientos habituales (limpieza, caries, endodoncia, extracción) los reembolsa al 70 % la Seguridad Social y el resto, por lo general, su seguro complementario (mutuelle). Para los demás tratamientos, se le entrega un presupuesto."], ["¿Qué ocurre en la primera visita?", "Nos conocemos, exploramos su boca, con radiografías si hace falta, y hablamos de sus expectativas. Si un tratamiento es útil, le proponemos un plan explicado paso a paso."], ["¿Con qué frecuencia debo venir?", "Una revisión cada seis meses: exploración clínica y radiológica, y limpieza si hace falta. Con más frecuencia según su situación."], ["¿Puedo recibir tratamiento si estoy embarazada?", "Sí. Las encías son más sensibles durante el embarazo: la higiene importa todavía más. Para algunos tratamientos más pesados, pedimos la opinión de su obstetra."], ["¿Qué tecnologías utilizan?", "Imagen 3D y escáneres intraorales, impresiones digitales sin pasta, láser dental, alineadores Invisalign®, implantología guiada y coronas o inlays fresados en el propio centro, en una hora, gracias a la CEREC®."]], "team_roles": {"sekkat": "Presidenta de la clínica · encías, estética, ortodoncia", "badoures": "Implantes, encías, CAD/CAM", "beugnet": "Cirujano dentista", "moreau": "Implantes y cirugía ósea, encías", "gouchet": "Cirujano dentista", "panozzo": "Odontología pediátrica y sedación", "bramardi": "Tratamientos bajo sedación (MEOPA)", "lespinard": "Desgaste, implantes, carillas", "lignieres": "Cirujano dentista", "hugon": "Ortodoncia, alineadores"}, "demo": {"mal": {"h": "Me duele un diente", "or": "El dolor puede venir de una caries, de un absceso, de las encías o de una muela del juicio.", "donc": "Una consulta rápida para encontrar la causa y aliviarle.", "rb": "Consulta y tratamientos habituales reembolsados al 70 %; el resto, por el seguro complementario (mutuelle).", "soin": "urgences"}, "casse": {"h": "Se me ha roto o se me ha caído un diente", "or": "Tras un golpe, cada hora cuenta, sobre todo si el diente se ha desprendido.", "donc": "Guarde el diente en leche y llame a la clínica enseguida.", "rb": "Tratamientos de urgencia reembolsados como tratamientos habituales.", "soin": "urgences"}, "controle": {"h": "Quiero una revisión o una limpieza", "or": "El sarro ya no sale con el cepillado, y una caries incipiente no duele.", "donc": "Una revisión con limpieza, cada seis meses.", "rb": "Reembolsado por la Seguridad Social y por el seguro complementario (mutuelle).", "soin": "detartrage"}, "enfant": {"h": "Mi hijo tiene los dientes mal colocados", "or": "Antes de que termine el crecimiento, se pueden guiar las mandíbulas.", "donc": "Una primera cita de ortodoncia (23 €) y una evaluación.", "rb": "Antes de los 16 años, reembolsado tras acuerdo previo (base de 193,50 € por semestre).", "soin": "ortho-enfant"}, "aligner": {"h": "Quisiera tener los dientes rectos (adulto)", "or": "La ortodoncia no tiene edad, y los aparatos se han vuelto discretos.", "donc": "Alineadores Invisalign® o brackets cerámicos, tras una evaluación 3D.", "rb": "Por lo general no reembolsado en adultos; el seguro complementario (mutuelle) puede participar.", "soin": "invisalign"}, "manque": {"h": "Me falta un diente", "or": "Un diente ausente hace que se muevan los vecinos y que el hueso se pierda.", "donc": "Implante, puente o prótesis: lo elegimos juntos.", "rb": "Implante no reembolsado, corona en parte; presupuesto para el seguro complementario (mutuelle).", "soin": "manquante"}, "blanc": {"h": "Quisiera tener los dientes más blancos", "or": "El café, el té, el tabaco y la edad apagan el esmalte.", "donc": "Un aclarado con férulas hechas en la clínica, o carillas si el tono resiste.", "rb": "Tratamiento estético no reembolsado, reservado a mayores de 18 años.", "soin": "blanchiment"}, "saigne": {"h": "Me sangran las encías", "or": "Suele ser una gingivitis: reversible si se trata pronto.", "donc": "Una evaluación de las encías, limpieza y raspado radicular si hace falta.", "rb": "Una parte de los actos está reembolsada.", "soin": "paro"}, "sagesse": {"h": "Me molestan las muelas del juicio", "or": "Mal colocadas, se infectan o empujan a los demás dientes.", "donc": "Una radiografía panorámica y después extracción en la clínica si es necesario.", "rb": "Extracción reembolsada por la Seguridad Social.", "soin": "sagesse"}, "enceinte": {"h": "Estoy embarazada", "or": "Las encías son más sensibles durante el embarazo.", "donc": "Se aconseja una revisión; la mayoría de los tratamientos son posibles.", "rb": "Revisión de prevención específica cubierta desde el cuarto mes.", "soin": "prevention"}, "grince": {"h": "Rechino los dientes por la noche", "or": "El bruxismo desgasta los dientes y fatiga la mandíbula.", "donc": "Una férula de descarga, hecha a medida.", "rb": "Cobertura variable: se le entrega un presupuesto.", "soin": "gouttieres"}}, "adv": {"rdv": "Lo más sencillo: reserve en Doctolib, a cualquier hora. También puede llamar al 05 87 14 06 17 entre semana.", "horaires": "La clínica atiende de lunes a viernes, de 8:30 a 19:30. Cierra el fin de semana. (Horario por confirmar con la clínica.)", "acces": "Rue Joseph-Lakanal, en Toulouse, frente al liceo Pierre-de-Fermat. Metro línea A, estación Capitole, a dos pasos de la plaza del Capitole y de la plaza Saint-Pierre.", "parking": "No tengo información sobre el aparcamiento cerca de la clínica. Lo más sencillo es el metro A, estación Capitole, o llamar al 05 87 14 06 17.", "urgence": "Entre semana, llame al 05 87 14 06 17: a los pacientes de la clínica se les suele recibir el mismo día. Los domingos y festivos, el Colegio organiza un dentista de guardia en el Alto Garona. Si su vida corre peligro, llame al 15.", "rb": "Las consultas y los tratamientos habituales los reembolsa al 70 % la Seguridad Social y el resto, por lo general, su seguro complementario (mutuelle). Se aplica el tercero pagador: no olvide su carte Vitale. Para los implantes, la estética o la ortodoncia de adultos, se le entrega un presupuesto.", "prix": "El sitio web de la clínica solo da una tarifa: la primera cita de ortodoncia, a 23 €. Para los demás tratamientos, el precio depende de su situación: se le entrega un presupuesto en la consulta.", "implant": "Un implante sustituye la raíz de un diente por un tornillo de titanio, y después se coloca una corona. En la clínica, los Dres. Badoures, Moreau y Lespinard están formados en implantología. La Seguridad Social no reembolsa el implante; la corona puede estarlo en parte.", "ortho": "El Dr. Hugon de Scoeux, ortodoncista, trata a niños, adolescentes y adultos: brackets, alineadores Invisalign®, Quad-Hélix. Primera cita: 23 €. Antes de los 16 años, reembolso tras acuerdo previo.", "enfant": "Primera visita hacia los 3 o 4 años, antes si hay algún problema. La Dra. Panozzo está formada en odontología pediátrica y en sedación, y la Dra. Bramardi en tratamientos con MEOPA. La revisión M'T dents está cubierta.", "blanc": "El blanqueamiento se hace con férulas fabricadas en la clínica, tras una revisión y una limpieza. Permite ganar hasta cuatro tonos. Está reservado a mayores de 18 años y no se reembolsa.", "facettes": "Las carillas son finas láminas de cerámica o composite pegadas en la cara visible de los dientes. Duran de 10 a 15 años. La Dra. Lespinard se ha formado en carillas.", "detartrage": "Una limpieza se hace en una sesión, con ultrasonidos, seguida de un pulido. La clínica aconseja una revisión cada seis meses. Está reembolsada.", "carie": "Un dolor puede ser una caries, pero también un absceso o las encías. Pida cita pronto. Una caries pequeña se trata con composite; si es más grande, con un inlay o una corona.", "sagesse": "Las muelas del juicio se extraen en la clínica, con anestesia local, tras una radiografía panorámica. La extracción está reembolsada.", "gencives": "Unas encías que sangran suelen ser una gingivitis. Los Dres. Sekkat, Badoures y Moreau están formados en periodoncia. Primero limpieza y raspado radicular, cirugía si hace falta.", "enceinte": "Sí, puede recibir tratamiento durante el embarazo. Una revisión de prevención está cubierta desde el cuarto mes. Para los tratamientos más pesados, pedimos la opinión de su obstetra.", "cerec": "La clínica tiene una fresadora CEREC®: cuando es posible, su corona o su inlay se fabrica ante sus ojos y se coloca aproximadamente una hora después de empezar la cita.", "equipe": "Diez profesionales: Dres. Sekkat, Badoures, Beugnet, Moreau, Gouchet, Panozzo, Bramardi, Lespinard, Lignères y Hugon de Scoeux. Consulte la sección El equipo para conocer su formación.", "job": "La clínica contrata con regularidad. Acceda a la página Únase al equipo para enviar su candidatura.", "langues": "No tengo información sobre los idiomas que habla cada profesional. Lo mejor es preguntar al 05 87 14 06 17.", "fallback": "No tengo la respuesta a esta pregunta y prefiero no decirle ninguna tontería. La clínica le responderá en el 05 87 14 06 17 o en bonjour@cabinet-dentaire-toulouse-fermat.fr.", "merci": "Con mucho gusto. Que tenga un buen día, y hasta pronto en la clínica.", "peur": "Es algo frecuente y el equipo está acostumbrado. La Dra. Panozzo está formada en sedación consciente, y la Dra. Bramardi y la Dra. Sekkat en tratamientos con MEOPA (gas relajante). Coménteselo al pedir cita: nos tomaremos el tiempo necesario."}, "legal": {"edit": "Editor: Cabinet dentaire Pierre de Fermat, SELAS con un capital de 1 020 €, 6 rue Joseph-Lakanal, 31000 Toulouse. SIREN 988 229 043. Presidenta: Dra. Samia Sekkat. Correo electrónico: bonjour@cabinet-dentaire-toulouse-fermat.fr.", "host": "Alojamiento: o2switch, 222-224 boulevard Gustave-Flaubert, 63000 Clermont-Ferrand.", "repro": "Todos los textos, fotos y contenidos del sitio web están protegidos: queda prohibida su reproducción sin el consentimiento del editor.", "data": "La información enviada a través de los formularios se utiliza únicamente para responder a sus solicitudes y para el seguimiento de los pacientes. Se conserva durante dos años. Puede acceder a ella, corregirla o solicitar su supresión escribiendo a bonjour@cabinet-dentaire-toulouse-fermat.fr. Lista de oposición a la venta telefónica: bloctel.gouv.fr.", "conf1": "Responsable del tratamiento: Cabinet dentaire Pierre de Fermat, SELAS, 6 rue Joseph-Lakanal, Toulouse.", "conf2": "Datos recogidos: identidad, correo electrónico, teléfono, mensaje, código postal, intercambios y datos técnicos de conexión (dominio, dirección IP).", "conf3": "Se utilizan para responder a sus solicitudes y organizar sus citas; nunca se venden.", "conf4": "Usted dispone de un derecho de acceso, rectificación, supresión y oposición, que puede ejercer por correo electrónico."}}, "de": {"ui": {"lang_name": "Deutsch", "nav_soins": "Behandlungen", "nav_urg": "Notfälle", "nav_ortho": "Kieferorthopädie", "nav_cab": "Die Praxis", "nav_equipe": "Das Team", "nav_blog": "Blog", "nav_contact": "Kontakt", "nav_join": "Zum Team", "nav_adv": "Fermat Conseil", "cta_rdv": "Termin vereinbaren", "cta_rdv_short": "Termin", "cta_call": "Praxis anrufen", "cta_doctolib": "Auf Doctolib buchen", "cta_soin": "Behandlung ansehen", "hero_t": "Ihre Zahnärzte im Herzen von Toulouse, gegenüber dem Lycée Pierre-de-Fermat.", "hero_p": "Zehn Zahnärztinnen und Zahnärzte in einer neuen Praxis, nur wenige Schritte vom Capitole: Alltagsbehandlungen, Implantate, Kieferorthopädie, Ästhetik. Und eine Krone, die wir vor Ort anfertigen, innerhalb einer Stunde, wenn es möglich ist.", "hero_open": "Jetzt geöffnet", "hero_closed": "Derzeit geschlossen", "hero_hours": "Montag bis Freitag, 8.30 – 19.30 Uhr", "m1": "Gegeben sei ein Patient in Toulouse.", "m2": "Annahme: Er hat Schmerzen oder träumt von einem schöneren Lächeln.", "m3": "Nun: zehn Zahnärzte, fünf Tage die Woche, Metro Capitole.", "m4": "Also: ein Termin, ohne Umwege.", "qed": "q.e.d.", "metro": "Metro A · Capitole", "tiers": "Direktabrechnung mit der Sécurité sociale", "demo_t": "Ihre Demonstration", "demo_p": "Wählen Sie Ihre Situation: Die Seite zeigt Ihnen die passende Behandlung, die dafür ausgebildeten Zahnärzte und den weiteren Weg.", "demo_hyp": "Annahme", "demo_or": "Nun", "demo_donc": "Also", "demo_avec": "Mit", "demo_rb": "Erstattung", "demo_pick": "Wählen Sie links eine Situation, um zu beginnen.", "piliers_t": "Was wir behandeln, vom ersten bis zum letzten Zahn", "p1_t": "Kieferorthopädie und unsichtbare Aligner", "p1_p": "Kind, Jugendlicher oder Erwachsener: Keramikbrackets, Invisalign®, Quad-Hélix. Nein, Kieferorthopädie ist nicht nur etwas für Kinder.", "p2_t": "Zahnaufhellung", "p2_p": "Bis zu vier Zahnfarben heller, unter Aufsicht speziell ausgebildeter Zahnärzte. Kaffee, Tee, Wein, Tabak: Die Verfärbungen verschwinden.", "p3_t": "Zahnimplantate", "p3_p": "Eine Titanwurzel im Knochen, eine Krone darauf: Der fehlende Zahn wird ersetzt, und Sie vergessen ihn.", "p4_t": "Vorsorge und Kontrolle", "p4_p": "Eine Kontrolle alle sechs Monate, eine Zahnreinigung, Tipps für Sie: Die beste Behandlung ist die, die man vermeidet.", "tech_t": "Die Werkstatt hinter dem Behandlungsstuhl", "tech_p": "Die Praxis ist so ausgestattet, dass wir sicher diagnostizieren und Ihnen unnötige Wege ersparen.", "t_cerec": "CEREC®: Kronen und Inlays vor Ort gefertigt, innerhalb einer Stunde", "t_scan": "3D-Intraoralscanner TRIOS 3: Schluss mit der Abdruckmasse", "t_radio": "Panoramaaufnahme, Fernröntgen und 3D-Cone-Beam-Scanner", "t_ster": "Eigener Sterilisationsraum", "t_print": "3D-Drucker für Schienen, die in der Praxis entstehen", "equipe_t": "Zehn Zahnärzte, ein gemeinsamer Anspruch", "equipe_p": "Allgemeinzahnärzte, Kieferorthopädin, Kinderzahnärztin, Spezialisten für Implantate und Zahnfleisch: jeder mit eigener Ausbildung, alle in Toulouse oder darüber hinaus ausgebildet.", "f_all": "Alle", "f_impl": "Implantate", "f_ortho": "Kieferorthopädie", "f_paro": "Zahnfleisch", "f_ped": "Kinder und Sedierung", "f_esth": "Ästhetik", "f_gen": "Allgemeine Behandlungen", "acces_t": "Rue Joseph-Lakanal, im Herzen der rosa Stadt", "acces_p": "Die Praxis liegt gegenüber dem Lycée Pierre-de-Fermat, nur wenige Schritte von der Place du Capitole und der Place Saint-Pierre. Metro Linie A, Station Capitole.", "adr_l": "Adresse", "tel_l": "Telefon", "mail_l": "E-Mail", "hor_l": "Öffnungszeiten", "hor_v": "Montag – Freitag: 8.30 – 19.30 Uhr\nSamstag und Sonntag: geschlossen", "hor_note": "Öffnungszeiten und Hausnummer der Straße sind mit der Praxis abzustimmen (sie weichen auf den Seiten der aktuellen Website voneinander ab).", "carte_open": "Route öffnen", "faq_t": "Ihre Fragen, unsere Antworten", "blog_t": "Das Praxisjournal", "blog_p": "Vierzehn Artikel, die Sie vor Ihrem Besuch lesen können.", "blog_all": "Das ganze Journal", "read": "Artikel lesen", "soins_t": "Alle Behandlungen der Praxis", "soins_p": "Sechsundzwanzig Übersichten, so geordnet, wie Sie danach suchen.", "fam_all": "Alle ansehen", "fam_quot": "Alltagsbehandlungen", "fam_esth": "Ästhetik", "fam_rempl": "Einen Zahn ersetzen", "fam_genc": "Zahnfleisch", "fam_ortho": "Kieferorthopädie", "enbref": "Kurz gesagt", "back_soins": "Alle Behandlungen", "back_blog": "Das ganze Journal", "rb_l": "Erstattung", "who_l": "Ausgebildete Zahnärzte", "urg_t": "Ein zahnärztlicher Notfall?", "urg_p": "Akuter Schmerz, Abszess, Sturz, abgebrochener Zahn: Das Team kümmert sich so schnell wie möglich um Sie. Patienten, die bereits bei uns in Behandlung sind, werden in der Regel am selben Tag empfangen, alle anderen nach freien Terminen.", "urg_garde_t": "Sonntage und Feiertage", "urg_garde_p": "Den Bereitschaftsdienst organisiert die Zahnärztekammer (Conseil de l'Ordre des chirurgiens-dentistes) der Haute-Garonne. Wenn Ihr Leben in Gefahr ist, wählen Sie die 15.", "urg_garde_note": "Die aktuelle Website nennt für die Vermittlung die 05 87 14 06 17, die Nummer der Praxis: Die Nummer des Bereitschaftsdienstes ist mit der Praxis abzustimmen.", "urg_sit_t": "Situationen, die wir behandeln", "urg_s1": "Starker oder anhaltender Zahnschmerz", "urg_s2": "Entzündung: Abszess, entzündetes Zahnfleisch", "urg_s3": "Schlag oder Unfall: abgebrochener oder ausgeschlagener Zahn", "urg_s4": "Schmerzen nach dem Ziehen eines Weisheitszahns", "urg_s5": "Verlust einer Füllung oder einer Krone", "urg_causes_t": "Die häufigsten Ursachen", "urg_c1": "Zahnabszess: Eiter um die Wurzel oder im Zahnfleisch. Pochender Schmerz, geschwollene Wange, manchmal Fieber.", "urg_c2": "Gingivitis und Parodontitis: rotes, geschwollenes Zahnfleisch, das beim Zähneputzen blutet.", "urg_c3": "Perikoronitis: Entzündung um einen Weisheitszahn, der schief durchbricht.", "urg_c4": "Pulpitis: Der Zahnnerv ist entzündet, der Schmerz weckt Sie nachts.", "urg_c5": "Alveolitis: Entzündung der Zahnfachwunde nach einer Extraktion.", "urg_quoi_t": "Bis zu Ihrem Termin", "urg_q1": "Ausgeschlagener Zahn: an der Krone halten, in Milch oder im Mund aufbewahren und sofort kommen.", "urg_q2": "Schmerzen: ein passendes Schmerzmittel, niemals Aspirin auf das Zahnfleisch legen, keine Wärme auf die Wange.", "urg_q3": "Geschwollene Wange oder Fieber: Rufen Sie ohne Zögern an.", "urg_hor": "Notfallsprechstunde unter der Woche, während der Öffnungszeiten.", "ortho_t": "Kieferorthopädie in Toulouse: ein gerades Lächeln, in jedem Alter", "ortho_p": "Dr. Hugon de Scoeux passt die Behandlung an jeden an: klassische oder Keramikbrackets, Invisalign®-Aligner, Quad-Hélix für die Jüngsten.", "ortho_tarifs_t": "Preise und Erstattung", "ortho_tar1": "Erster Termin: 23 €. Befund, Auswertung und detaillierter Kostenvoranschlag.", "ortho_tar2": "Vor dem 16. Geburtstag, mit vorheriger Zustimmung der französischen Krankenversicherung (Assurance maladie): Erstattungsbasis von 193,50 € pro Halbjahr, höchstens sechs Halbjahre.", "ortho_tar3": "Retainer nach der Behandlung: in der Regel 100 bis 800 € pro Jahr, je nach Technik (Draht oder Schiene).", "ortho_tar4": "Erwachsene: in der Regel nicht von der Sécurité sociale erstattet; Ihre Zusatzversicherung (Mutuelle) kann einen Teil übernehmen.", "ortho_ages_t": "Drei Altersstufen, drei Ansätze", "cab_t": "Eine Praxis, in der man vergisst, dass man „zum Zahnarzt“ geht", "cab_p": "Moderne Geräte, ausgesuchte Möbel, sanftes Licht: Die Praxis Pierre de Fermat wurde als warmer Ort gedacht, der Ihnen mitten in Toulouse Zahnmedizin auf hohem Niveau bietet.", "cab_l1": "Ein interdisziplinäres Team: Implantate, Kieferorthopädie, Ästhetik, Zahnfleisch, Kinder.", "cab_l2": "Behandlungspläne nach Maß, auf Dauer angelegt.", "cab_l3": "Die neueste Technik, im Dienst Ihres Komforts.", "cab_l4": "Direktabrechnung mit der Sécurité sociale: Denken Sie an Ihre Carte Vitale.", "contact_t": "Schreiben, anrufen, vorbeikommen", "contact_p": "Am schnellsten geht es über Doctolib, zu jeder Uhrzeit. Sonst genügt ein Anruf oder eine Nachricht, und das Team meldet sich bei Ihnen.", "form_nom": "Vor- und Nachname", "form_mail": "E-Mail", "form_tel": "Telefon", "form_msg": "Ihre Nachricht", "form_send": "Nachricht senden", "form_ok": "Danke, Ihre Nachricht ist bereit. In der endgültigen Version geht sie direkt an das Sekretariat.", "form_err": "Bitte geben Sie Ihren Namen und eine E-Mail-Adresse oder Telefonnummer an.", "join_t": "Zum Team gehören", "join_p": "Die Praxis sucht laufend motivierte Fachkräfte, die gern mit moderner Ausstattung arbeiten und den Menschen in den Mittelpunkt stellen. Assistenz, Zahnarzt oder Zahnärztin, Sekretariat: Stellen Sie sich vor.", "join_poste": "Gewünschte Stelle", "join_p1": "Zahnarzt/Zahnärztin", "join_p2": "Kieferorthopäde/Kieferorthopädin", "join_p3": "Zahnmedizinische Fachangestellte", "join_p4": "Medizinische Sekretärin / Sekretär", "join_p5": "Sonstiges", "join_cv": "Ihr Lebenslauf (PDF)", "join_send": "Bewerbung senden", "leg_t": "Impressum", "conf_t": "Datenschutzerklärung", "foot_tag": "Zahnarztpraxis Pierre de Fermat · SELAS · Toulouse", "foot_soc": "Online einen Termin vereinbaren", "foot_proto": "Vorschlag zur Neugestaltung von Neovera Studio. Inhalte von der aktuellen Website der Praxis übernommen.", "adv_btn": "Ich helfe Ihnen bei der Wahl", "adv_hello": "Guten Tag, ich bin Fermat Conseil, der virtuelle Assistent der Praxis. Ich antworte zu Behandlungen, Öffnungszeiten, Anfahrt, Notfällen und Erstattung.", "adv_tag": "Virtueller Assistent", "adv_ph": "Stellen Sie Ihre Frage …", "adv_send": "Senden", "adv_invite": "Eine Frage zu einer Behandlung oder einem Termin? Ich weise Ihnen den Weg.", "adv_close": "Schließen", "q_rdv": "Termin vereinbaren", "q_urg": "Ich habe Schmerzen, es ist dringend", "q_rb": "Erstattung", "q_acces": "Zur Praxis kommen", "q_ortho": "Kieferorthopädie", "q_impl": "Implantat", "lang_l": "Sprache", "menu_l": "Hauptmenü", "skip": "Zum Inhalt springen", "illus": "Abbildung von der aktuellen Website", "minutes": "Min. Lesezeit", "art_more": "Für mehr Informationen sprechen Sie uns bei Ihrem nächsten Termin in der Praxis an.", "not_found": "Diese Seite gibt es nicht. Zurück zur Startseite."}, "soins": {"gouttieres": {"t": "Zahnschienen", "s": "Für wen? Wofür?", "p": "Eine Zahnschiene ist ein herausnehmbares Gerät nach Maß, gefertigt nach einem digitalen Abdruck Ihrer Zähne. Sie schützt, hellt auf oder richtet aus.", "k": ["Bruxismus: Die Knirscherschiene schützt Zähne, die nachts aufeinander mahlen, und entlastet den Kiefer.", "Kieferorthopädie: Durchsichtige Aligner bewegen die Zähne sanft.", "Retainer: Nachts nach einer Behandlung getragen, hält er das Ergebnis.", "Sport: Ein Mundschutz verhindert abgebrochene Zähne bei Stößen."], "r": "Die Kostenübernahme hängt vom Einsatz ab: Die Praxis erstellt Ihnen einen Kostenvoranschlag."}, "invisalign": {"t": "Invisalign®", "s": "Die unauffällige Kieferorthopädie", "p": "Durchsichtige, im 3D-Druck gefertigte Schienen, die die Zähne ohne Draht und Brackets ausrichten. Für Erwachsene, Jugendliche und manche Kinder.", "k": ["Unauffällig, bequem, leicht zu reinigen, zu den Mahlzeiten herausgenommen.", "Erste Beratung: Ihre Wünsche und eine Untersuchung, ob die Behandlung für Sie passt.", "Befund: seitliche Röntgenaufnahme, 3D-Abdrücke, dann ein in 3D simulierter Behandlungsplan und ein detaillierter Kostenvoranschlag.", "Zertifizierte Invisalign®-Zahnärzte in der Praxis."], "r": "Der Preis wird nach dem Befund festgelegt, den Kostenvoranschlag erhalten Sie vor jeder Verpflichtung."}, "caries": {"t": "Karies", "s": "Ein gesunder Mund, ohne Karies", "p": "Karies ist die Zerstörung des Zahns durch die Bakterien im Zahnbelag. Früh erkannt, lässt sie sich einfach behandeln; bleibt sie unbehandelt, erreicht sie den Nerv.", "k": ["Vier Stadien: Demineralisierung, Schmelzkaries, tiefe Karies, Entzündung der Pulpa.", "Kleine Karies: Füllung aus Komposit in Zahnfarbe.", "Größere Karies: Inlay oder Onlay aus Keramik, oder eine Krone bei stark geschädigtem Zahn.", "Vorbeugung: Zähneputzen, weniger Zucker, mindestens einmal im Jahr eine Zahnreinigung."], "r": "Übliche Behandlung: 70 % übernimmt die französische Krankenversicherung (Assurance maladie), den Rest Ihre Zusatzversicherung (Mutuelle)."}, "detartrage": {"t": "Zahnreinigung", "s": "Glatte Zähne, ein klares Lächeln", "p": "Zahnstein ist verhärteter Belag: Die Zahnbürste entfernt ihn nicht mehr. Die Zahnreinigung beseitigt ihn in einer Sitzung, schmerzfrei.", "k": ["Ultraschall löst den Zahnstein, auch an schwer erreichbaren Stellen.", "Polieren für glatte Flächen, an denen Belag schlechter haftet.", "Mindestens einmal im Jahr, öfter für Raucher oder Menschen mit Diabetes.", "Wurzelglättung, wenn der Zahnstein unter das Zahnfleisch gewandert ist."], "r": "Von der Krankenversicherung und der Zusatzversicherung (Mutuelle) erstattet."}, "blanchiment": {"t": "Zahnaufhellung", "s": "Strahlender Glanz, in wenigen Wochen", "p": "Mit der Zeit machen Kaffee, Tee, Wein und Tabak die Zähne matt, und der Zahnschmelz wird dünner. Die Aufhellung macht die Zähne um mehrere Farbstufen heller.", "k": ["Vorab-Beratung: Karies, Zahnfleisch, Empfindlichkeit und Schwangerschaft werden geprüft.", "Zahnreinigung, Pulverstrahl, Fotos vor der Behandlung.", "3D-Abdruck und in der Praxis gefertigte Schienen, die Sie mit dem Produkt erhalten.", "Nur für Personen ab 18 Jahren (Carbamidperoxid, europäische Vorschrift)."], "r": "Ästhetische Behandlung ohne Erstattung: Preis und Dauer besprechen wir bei der Beratung."}, "devitalisation": {"t": "Wurzelbehandlung", "s": "Den Zahn retten, statt ihn zu ziehen", "p": "Wenn eine tiefe Karies oder ein Schlag den Nerv erreicht, entfernen wir die Pulpa, reinigen und verschließen die Kanäle. Der Zahn bleibt erhalten.", "k": ["Röntgenaufnahmen entscheiden über die Behandlung.", "Lokalanästhesie: Die Behandlung verläuft schmerzfrei.", "Reinigung, Desinfektion und Füllung der Wurzelkanäle.", "Wiederaufbau: Krone, Inlay oder Onlay, je nach Zustand des Zahns."], "r": "Übliche Behandlung: 70 % übernimmt die französische Krankenversicherung (Assurance maladie), den Rest Ihre Zusatzversicherung (Mutuelle)."}, "facettes": {"t": "Veneers", "s": "Ein neues Lächeln, ohne Kompromisse", "p": "Eine dünne Schale aus Keramik oder Komposit, auf die sichtbare Zahnseite geklebt: Farbe, Form und kleine Makel werden korrigiert.", "k": ["Für Verfärbungen, die sich nicht aufhellen lassen, und für kurze oder beschädigte Zähne.", "Sehr schonend: Es wird nur eine dünne Schmelzschicht vorbereitet.", "Optische Abdrücke, maßgefertigte Veneers, Kleben, dann Polieren.", "Halten 10 bis 15 Jahre bei guter Pflege."], "r": "Ästhetische Behandlung: Den Kostenvoranschlag erhalten Sie bei der ersten Beratung."}, "implants": {"t": "Zahnimplantate", "s": "Der Komfort eines natürlichen Zahns", "p": "Eine künstliche Wurzel aus Titan im Knochen, dann eine Krone aus Keramik. Für einen Zahn, mehrere oder einen ganzen Kiefer.", "k": ["Krone auf Implantat, Brücke auf Implantaten oder feste Prothese ohne Gaumen auf 4 oder 6 Implantaten (All-on X®).", "Erfolgsquote oft über 95 % über mehrere Jahre.", "Nach einem Unfall, bei Zahnverlust durch Zahnfleischerkrankung, bei fehlender Anlage oder einem nicht zu rettenden Zahn.", "Alternativen: Brücke, Klebebrücke, teilweise oder vollständige herausnehmbare Prothese."], "r": "Das Implantat wird von der Sécurité sociale nicht erstattet; die Krone teilweise. Kostenvoranschlag für Ihre Zusatzversicherung (Mutuelle)."}, "couronnes": {"t": "Kronen", "s": "Ein gestärkter Zahn, der natürlich bleibt", "p": "Die Krone umschließt einen beschädigten Zahn vollständig und gibt ihm Form, Festigkeit und Farbe zurück. Aus Emax-Keramik oder Zirkonoxid.", "k": ["Klinische Untersuchung und Röntgenbild, Kostenvoranschlag für Ihre Zusatzversicherung (Mutuelle).", "Präparation des Zahns, optischer 3D-Abdruck.", "Wenn es möglich ist, wird die Krone vor Ihren Augen von der CEREC gefräst: Sie gehen damit nach Hause, eine Stunde nach Beginn des Termins.", "Lebensdauer: 10 bis 20 Jahre bei guter Pflege."], "r": "Teilweise Kostenübernahme durch die französische Krankenversicherung (Assurance maladie), je nach Material; Kostenvoranschlag für Ihre Zusatzversicherung (Mutuelle)."}, "inlay": {"t": "Inlay, Onlay, Overlay", "s": "Reparieren, ohne viel abzuschleifen", "p": "Ein Teil aus Keramik oder Zirkonoxid, nach Maß von der Fräsmaschine der Praxis gefertigt, das die Kavität eines mittelschwer geschädigten Zahns füllt.", "k": ["Inlay: im Zahn. Onlay: bedeckt einen Teil der Oberfläche. Overlay: bedeckt die ganze Oberfläche.", "Erhält mehr Zahnsubstanz als eine Krone.", "Keramik: widerstandsfähig und in Zahnfarbe.", "In der Praxis gefertigt, oft in einer Sitzung."], "r": "Teilweise Kostenübernahme je nach Fall; den Kostenvoranschlag erhalten Sie vor der Behandlung."}, "sagesse": {"t": "Weisheitszähne", "s": "Für einen gesunden Mund", "p": "Die dritten Backenzähne brechen zwischen 16 und 20 Jahren durch. Stehen sie falsch, schmerzen sie, entzünden sich oder schieben die anderen Zähne.", "k": ["Beratung mit Panoramaaufnahme vor jeder Entscheidung.", "Entfernung unter Lokalanästhesie, in der Praxis.", "Danach: Schmerzen und Schwellung gut im Griff, Verhaltenshinweise erhalten Sie mit.", "Die Praxis liegt nur wenige Schritte vom Capitole."], "r": "Die Entfernung wird von der Krankenversicherung und der Zusatzversicherung (Mutuelle) erstattet."}, "greffe": {"t": "Zahnfleischtransplantation", "s": "Wenn sich das Zahnfleisch zurückzieht", "p": "Zu kräftiges Putzen kann das Zahnfleisch zurückweichen lassen: Die Wurzel liegt frei, der Zahn wird empfindlich. Die Transplantation deckt sie wieder ab.", "k": ["Schützt die Wurzel und bremst den Rückgang des Zahnfleischs.", "Stärkt ein zu dünnes Zahnfleisch.", "Verbessert die Ästhetik des Lächelns.", "Nachsorge nach dem Eingriff und Tipps zum Zähneputzen."], "r": "Wird kaum erstattet: Den Kostenvoranschlag erhalten Sie vor dem Eingriff."}, "bridge": {"t": "Zahnbrücke", "s": "Eine Brücke zwischen zwei Zähnen", "p": "Eine feste Prothese, die einen oder mehrere Zähne ersetzt und sich auf die Nachbarzähne stützt.", "k": ["Brücke für einen Zahn, größere Brücke für mehrere.", "Aus Keramik für ein natürliches Aussehen.", "Bequemes, wirksames Kauen wird wieder möglich.", "Digitale Abdrücke, Anprobe, dann Einsetzen."], "r": "Teilweise Kostenübernahme durch die französische Krankenversicherung (Assurance maladie); Kostenvoranschlag für Ihre Zusatzversicherung (Mutuelle)."}, "conservateurs": {"t": "Zahnerhaltende Behandlungen", "s": "Die eigenen Zähne so lange wie möglich behalten", "p": "Den Zahn behandeln und dabei möglichst viel gesunde Substanz erhalten, um eine Extraktion zu vermeiden.", "k": ["Kariesbehandlung mit Komposit.", "Inlays und Onlays aus Keramik.", "Zahnreinigung und Prophylaxe.", "Wurzelbehandlung (Endodontie)."], "r": "Übliche Behandlungen: 70 % von der französischen Krankenversicherung (Assurance maladie) erstattet."}, "restauration": {"t": "Wiederherstellung des Lächelns", "s": "Glanz und Selbstvertrauen zurück", "p": "Mehrere Techniken lassen sich kombinieren, um das Lächeln ohne großen Eingriff zu verschönern.", "k": ["Vollkeramikkronen: ästhetisch und widerstandsfähig.", "Veneers: ein verwandeltes Lächeln in wenigen Sitzungen.", "Unsichtbare Schienen: unauffällig neu ausrichten.", "Aufhellung, Inlays und Onlays sowie Behandlung von Bissproblemen."], "r": "Je nach gewählter Behandlung: detaillierter Kostenvoranschlag bei der Beratung."}, "titane": {"t": "Titanimplantate", "s": "Eine verlässliche und dauerhafte Lösung", "p": "Titan ist seit den 1980er-Jahren das Referenzmaterial der Implantologie: Der Knochen nimmt es an und verwächst damit.", "k": ["Einschätzung Ihres Bedarfs mit unseren Zahnärzten.", "Einsetzen des Implantats, dann Osseointegration (der Knochen verwächst mit dem Titan).", "Einheilschraube, dann prothetische Versorgung.", "Titan der Güteklasse 4 oder 5, dasselbe wie in der Orthopädie."], "r": "Das Implantat wird von der Sécurité sociale nicht erstattet; Kostenvoranschlag für Ihre Zusatzversicherung (Mutuelle)."}, "manquante": {"t": "Einen fehlenden Zahn ersetzen", "s": "Drei Lösungen, eine passende", "p": "Ein fehlender Zahn lässt die Nachbarn wandern, den Knochen schwinden und stört beim Essen und Sprechen. Er lässt sich ersetzen.", "k": ["Das Implantat: die dauerhafte Lösung.", "Die Brücke: eine wirksame feste Alternative.", "Die herausnehmbare Prothese: vorübergehend oder dauerhaft.", "Die Wahl treffen wir gemeinsam, je nach Knochen, Nachbarzähnen und Budget."], "r": "Je nach Lösung: Einen Vergleichs-Kostenvoranschlag erhalten Sie bei der Beratung."}, "paro": {"t": "Parodontologie", "s": "Behandeln, was die Zähne hält", "p": "Zahnfleisch, Wurzelhaut, Zement und Knochen: Wenn sie sich entzünden, lockern sich die Zähne. Die Parodontologie behandelt sie.", "k": ["Anzeichen: blutendes, rotes Zahnfleisch, Mundgeruch, wackelnde Zähne.", "Zahnreinigung und Wurzelglättung.", "Fortgeschrittene chirurgische Behandlungen, falls nötig.", "Angepasste Vorsorge und Hygiene, damit das Ergebnis hält."], "r": "Ein Teil der Leistungen wird erstattet; für den Rest gibt es einen Kostenvoranschlag."}, "prevention": {"t": "Zahnvorsorge", "s": "Die beste Behandlung ist die, die man vermeidet", "p": "Karies und Zahnfleischerkrankungen lassen sich meist vermeiden. Das Team begleitet Sie, damit Ihr Mund gesund bleibt.", "k": ["Zähneputzen mit passender Bürste, Zahnseide und Mundspülung.", "Regelmäßige Untersuchungen und Zahnreinigungen.", "Beratung und Mundhygiene-Training, schon im Kindesalter.", "Programm M'T dents der französischen Krankenversicherung (Assurance maladie) für Kinder und Jugendliche."], "r": "Kontrolluntersuchungen werden erstattet; M'T dents wird zu 100 % übernommen."}, "premiers-rdv": {"t": "Erste kieferorthopädische Termine", "s": "Ihr Anliegen wird zu unserem", "p": "Ein Zahnarzt, ein Arzt oder Sie selbst haben ein Problem bei der Zahnstellung bemerkt. Alles beginnt mit zwei Terminen.", "k": ["Erste Beratung: Wir lernen uns kennen, hören auf Ihre Wünsche und untersuchen.", "Befundtermin: 3D-Scan, Fotos, Fernröntgen.", "Behandlungsplan und Kostenvoranschlag, Schritt für Schritt erklärt.", "Erster Termin: 23 €."], "r": "Vor dem 16. Geburtstag Erstattung nach vorheriger Zustimmung der französischen Krankenversicherung (Assurance maladie)."}, "technologies": {"t": "Technik in der Kieferorthopädie", "s": "Genaue Diagnose, bequeme Behandlung", "p": "Die Praxis hat sich so ausgestattet, dass Ihnen Abdruckmasse und unnötige Wege erspart bleiben.", "k": ["3D-Intraoralscanner TRIOS 3 (3Shape): Abdrücke in wenigen Minuten.", "Digitale Panoramaaufnahme und Fernröntgen.", "Eigener Sterilisationsraum.", "3D-Drucker für Apparaturen und Schienen."], "r": ""}, "ortho-adulte": {"t": "Kieferorthopädie für Erwachsene", "s": "Ihr schönstes Lächeln, in jedem Alter", "p": "Das Alter ist kein Hindernis, solange Zahnfleisch und Knochen gesund sind. Die Apparaturen sind unauffällig geworden.", "k": ["Durchsichtige Aligner: ästhetisch und herausnehmbar.", "Keramikbrackets: in der Farbe des Zahns.", "Präprothetische Kieferorthopädie als Vorbereitung für Implantate oder Kronen.", "In Verbindung mit einer Operation bei großen Kieferfehlstellungen."], "r": "Bei Erwachsenen in der Regel nicht erstattet; die Zusatzversicherung (Mutuelle) kann sich beteiligen."}, "ortho-ado": {"t": "Kieferorthopädie für Jugendliche", "s": "Der richtige Zeitpunkt zu handeln", "p": "In der Pubertät sind alle bleibenden Zähne da, und das Wachstum hilft noch: Es ist der ideale Zeitpunkt.", "k": ["Multibracket-Apparaturen (feste Spange).", "Durchsichtige Schienen (Aligner).", "Entfernung bleibender Zähne, falls nötig.", "Vor dem Ende des Wachstums handeln, um Kieferfehlstellungen zu korrigieren."], "r": "Vor dem 16. Geburtstag: Erstattung nach vorheriger Zustimmung (Basis 193,50 € pro Halbjahr)."}, "ortho-enfant": {"t": "Kieferorthopädie für Kinder", "s": "Das Wachstum lenken", "p": "Manche Fehlstellungen zeigen sich früh und stören beim Kauen, Schlucken oder Atmen. Man kann früh eingreifen.", "k": ["Korrektur von Verschiebungen zwischen den Kiefern.", "Gaumenerweiterung (Quad-Hélix).", "Zurückführen zu weit vorstehender Zähne.", "Abgewöhnen schlechter Gewohnheiten: Daumen, Zunge."], "r": "Erstattung nach vorheriger Zustimmung der Krankenversicherung."}}, "arts": {"adulte": {"t": "Kieferorthopädie, auch eine Sache für Erwachsene", "s": "Immer mehr Erwachsene verbessern mit unauffälligen Apparaturen ihr Lächeln und ihre Zahngesundheit.", "k": ["Engstände und Fehlstellungen verstärken sich mit dem Alter.", "Metall- oder Keramikbrackets, Invisalign®-Aligner, Schienen, bei Bedarf Operation.", "Vollständige Diagnose, bevor die Apparatur gewählt wird."]}, "implant": {"t": "Was ist ein Zahnimplantat und wie funktioniert es?", "s": "Eine Titanschraube, die unter Lokalanästhesie die Wurzel eines fehlenden Zahns ersetzt.", "k": ["Beratung und Diagnose, dann der chirurgische Eingriff.", "Genaues Setzen der Titanschraube, Einheilung über einige Monate.", "Vorteile, Risiken und Gegenanzeigen werden vor der Entscheidung erklärt."]}, "infection": {"t": "Welche Symptome hat eine Zahnentzündung?", "s": "Pochender Schmerz, geschwollenes Zahnfleisch, schlechter Geschmack: eine Entzündung erkennen und schnell handeln.", "k": ["Anzeichen: Schmerz, Empfindlichkeit, Abszess, Fieber, geschwollene Wange.", "Ursachen: tiefe Karies, Schlag, erkranktes Zahnfleisch, Weisheitszahn.", "Unbehandelt kann sich die Entzündung ausbreiten: Suchen Sie rasch einen Arzt auf."]}, "gencives": {"t": "Wie beugt man Zahnfleischerkrankungen vor?", "s": "Gingivitis und Parodontitis schreiten oft unbemerkt voran. So halten Sie sie auf.", "k": ["Gingivitis ist umkehrbar, Parodontitis zerstört den Knochen.", "Sorgfältige Hygiene, Ernährung, regelmäßige Kontrollen.", "Blutungen, zurückgehendes Zahnfleisch: Es ist Zeit für einen Termin."]}, "caries": {"t": "Was verursacht Karies und wie beugt man ihr vor?", "s": "Bakterien, Zucker und Zeit: Karies verstehen, um sie zu vermeiden.", "k": ["Die Bakterien im Zahnbelag greifen den Schmelz an, dann das Dentin.", "Zähneputzen, Zahnseide, weniger Zucker, regelmäßige Zahnreinigung.", "Früh behandelte Karies erspart eine Wurzelbehandlung."]}, "frequence": {"t": "Wie oft sollte man zum Zahnarzt gehen?", "s": "Kinder, Erwachsene, ältere Menschen: Der richtige Rhythmus hängt vom Alter und von der Vorgeschichte ab.", "k": ["In der Regel eine Kontrolle alle sechs Monate.", "Öfter für Raucher, Menschen mit Diabetes oder Träger von Apparaturen.", "Regelmäßige Besuche ersparen große Behandlungen."]}, "ortho-bienfaits": {"t": "Kieferorthopädie richtet nicht nur Zähne aus", "s": "Kauen, Atmen, Kiefergelenk: die weniger bekannten Vorteile.", "k": ["Korrigiert Bissfehler, die beim Essen oder Atmen stören.", "In jedem Alter möglich.", "Dauer und Kosten werden beim Befund erklärt."]}, "brossage": {"t": "Wie putzt man sich richtig die Zähne?", "s": "Bürste, Zahnpasta, Technik, Dauer: der vollständige Ratgeber.", "k": ["Zwei Minuten, zweimal täglich, weiche Bürste alle drei Monate wechseln.", "Fluoridhaltige Zahnpasta, ergänzend Zahnseide oder Zwischenraumbürsten.", "Die Fehler, die Sie vermeiden sollten, und Tipps für die Jüngsten."]}, "rembourse": {"t": "Wird Kieferorthopädie erstattet?", "s": "Sécurité sociale, Zusatzversicherung, Kinder, Erwachsene: wer was zahlt.", "k": ["Vor dem 16. Geburtstag: 70 % des Vertragstarifs nach vorheriger Zustimmung.", "Erwachsene: selten erstattet, außer bei chirurgischen Fällen.", "Die Zusatzversicherung (Mutuelle) ergänzt je nach Vertrag: Holen Sie einen Kostenvoranschlag ein."]}, "ronfler": {"t": "Wie schläft man ohne zu schnarchen?", "s": "Jeder vierte Erwachsene schnarcht. Der Zahnarzt kann helfen.", "k": ["Auf der Seite schlafen, Gewicht verlieren, weniger Alkohol und Tabak.", "Die Unterkiefer-Protrusionsschiene, nachts getragen, macht die Atemwege frei.", "Wenn das Schnarchen bleibt: den Rat eines HNO-Arztes einholen."]}, "mtdents": {"t": "Die Untersuchung M'T dents", "s": "Der Vorsorgetermin, den die französische Krankenversicherung (Assurance maladie) anbietet.", "k": ["Jedes Jahr ab 3 Jahren seit 2025, schrittweise bis 2028 auf 28 Jahre ausgeweitet.", "Eine eigene Untersuchung für Schwangere ab dem 4. Monat.", "Einladung per Post, auch auf ameli.fr abrufbar."]}, "gouttieres": {"t": "Zahnschiene: für wen? wofür?", "s": "Bruxismus, Aufhellung, Ausrichtung, Sport: eine Schiene, mehrere Einsatzzwecke.", "k": ["Nach Maß gefertigt, nach digitalem Abdruck.", "Tagsüber oder nachts, je nach Verordnung.", "Einfache Pflege, Lebensdauer und Kosten werden in der Praxis erklärt."]}, "role-ortho": {"t": "Was macht ein Kieferorthopäde?", "s": "Der Spezialist für schief stehende Zähne und Kiefer, für Kinder wie für Erwachsene.", "k": ["Diagnose, Vorbeugung und Behandlung von Zahn- und Kieferfehlstellungen.", "Wann zum Termin: überlappende Zähne, verschobene Kiefer, Kauprobleme.", "Behandlungen von 12 bis 36 Monaten, danach Retainer."]}, "cout-implant": {"t": "Was kostet ein Implantat im Durchschnitt?", "s": "Was im Preis enthalten ist und wie Sie Geld erstattet bekommen.", "k": ["Im Preis enthalten sind Implantat, Aufbau und Krone.", "Das Implantat wird nicht erstattet; die Krone teilweise.", "Schicken Sie den Kostenvoranschlag vor dem Eingriff an Ihre Zusatzversicherung (Mutuelle)."]}}, "faq": [["Gibt es einen Unterschied zwischen Dentiste und Chirurgien-dentiste?", "Nein. Alle Zahnärzte erhalten den Titel Doktor der Zahnchirurgie. Manche entscheiden sich lediglich, nicht chirurgisch zu arbeiten."], ["Ab welchem Alter sollte man mit dem Kind zum Zahnarzt?", "Theoretisch ab den ersten Zähnen, praktisch mit 3 oder 4 Jahren. Früher, wenn Sie etwas beunruhigt."], ["Nehmen Sie Notfälle an?", "Ja. Patienten, die bereits bei uns in Behandlung sind, werden in der Regel am selben Tag empfangen, alle anderen nach freien Terminen."], ["Ich habe Zahnschmerzen, ist das Karies?", "Vielleicht: Ein Schmerz kann auch von einem Abszess, einem Weisheitszahn oder dem Zahnfleisch kommen. Vereinbaren Sie einen Termin, eine rasche Untersuchung verschafft Ihnen schnell Linderung."], ["Wie bekomme ich meine Kosten erstattet?", "Untersuchungen und übliche Behandlungen (Zahnreinigung, Karies, Wurzelbehandlung, Extraktion) werden zu 70 % von der französischen Krankenversicherung (Assurance maladie) erstattet, den Rest übernimmt in der Regel Ihre Zusatzversicherung (Mutuelle). Für andere Behandlungen erhalten Sie einen Kostenvoranschlag."], ["Was passiert beim ersten Besuch?", "Wir lernen uns kennen, untersuchen Ihren Mund, bei Bedarf mit Röntgenbildern, und sprechen über Ihre Wünsche. Wenn eine Behandlung sinnvoll ist, schlagen wir Ihnen einen Plan vor, Schritt für Schritt erklärt."], ["Wie oft sollte ich kommen?", "Eine Kontrolle alle sechs Monate: klinische und radiologische Untersuchung, bei Bedarf eine Reinigung. Öfter, je nach Ihrer Situation."], ["Kann ich behandelt werden, wenn ich schwanger bin?", "Ja. Das Zahnfleisch ist in der Schwangerschaft empfindlicher: Hygiene ist umso wichtiger. Bei größeren Behandlungen holen wir den Rat Ihres Frauenarztes ein."], ["Welche Technik setzen Sie ein?", "3D-Bildgebung und Intraoralscanner, digitale Abdrücke ohne Abdruckmasse, Dentallaser, Invisalign®-Aligner, geführte Implantologie sowie Kronen und Inlays, die dank CEREC® vor Ort innerhalb einer Stunde gefräst werden."]], "team_roles": {"sekkat": "Praxisleiterin · Zahnfleisch, Ästhetik, Kieferorthopädie", "badoures": "Implantate, Zahnfleisch, CAD/CAM", "beugnet": "Zahnarzt", "moreau": "Implantate und Knochenchirurgie, Zahnfleisch", "gouchet": "Zahnarzt", "panozzo": "Kinderzahnheilkunde und Sedierung", "bramardi": "Behandlungen unter Sedierung (MEOPA)", "lespinard": "Zahnabnutzung, Implantate, Veneers", "lignieres": "Zahnarzt", "hugon": "Kieferorthopädie, Aligner"}, "demo": {"mal": {"h": "Ich habe Zahnschmerzen", "or": "Ein Schmerz kann von Karies, einem Abszess, dem Zahnfleisch oder einem Weisheitszahn kommen.", "donc": "Eine rasche Untersuchung, um die Ursache zu finden und Ihnen Linderung zu verschaffen.", "rb": "Untersuchung und übliche Behandlungen zu 70 % erstattet, den Rest übernimmt die Zusatzversicherung (Mutuelle).", "soin": "urgences"}, "casse": {"h": "Ein Zahn ist abgebrochen oder herausgefallen", "or": "Nach einem Unfall zählt jede Stunde, vor allem bei einem ausgeschlagenen Zahn.", "donc": "Bewahren Sie den Zahn in Milch auf und rufen Sie sofort die Praxis an.", "rb": "Notfallbehandlungen werden wie übliche Behandlungen erstattet.", "soin": "urgences"}, "controle": {"h": "Ich möchte eine Kontrolle oder eine Zahnreinigung", "or": "Zahnstein geht beim Putzen nicht mehr weg, und beginnende Karies tut nicht weh.", "donc": "Eine Kontrolle mit Zahnreinigung, alle sechs Monate.", "rb": "Von der Krankenversicherung und der Zusatzversicherung (Mutuelle) erstattet.", "soin": "detartrage"}, "enfant": {"h": "Mein Kind hat schief stehende Zähne", "or": "Vor dem Ende des Wachstums lassen sich die Kiefer lenken.", "donc": "Ein erster kieferorthopädischer Termin (23 €) und ein Befund.", "rb": "Vor dem 16. Geburtstag nach vorheriger Zustimmung erstattet (Basis 193,50 € pro Halbjahr).", "soin": "ortho-enfant"}, "aligner": {"h": "Ich möchte gerade Zähne (als Erwachsener)", "or": "Kieferorthopädie kennt kein Alter, und die Apparaturen sind unauffällig geworden.", "donc": "Invisalign®-Aligner oder Keramikbrackets, nach einem 3D-Befund.", "rb": "Bei Erwachsenen in der Regel nicht erstattet; die Zusatzversicherung (Mutuelle) kann sich beteiligen.", "soin": "invisalign"}, "manque": {"h": "Mir fehlt ein Zahn", "or": "Ein fehlender Zahn lässt die Nachbarn wandern und den Knochen schwinden.", "donc": "Implantat, Brücke oder Prothese: Wir entscheiden gemeinsam.", "rb": "Implantat nicht erstattet, Krone teilweise; Kostenvoranschlag für die Zusatzversicherung (Mutuelle).", "soin": "manquante"}, "blanc": {"h": "Ich möchte hellere Zähne", "or": "Kaffee, Tee, Tabak und Alter machen den Schmelz matt.", "donc": "Eine Aufhellung mit Schienen aus der Praxis, oder Veneers, wenn die Farbe bleibt.", "rb": "Ästhetische Behandlung ohne Erstattung, nur ab 18 Jahren.", "soin": "blanchiment"}, "saigne": {"h": "Mein Zahnfleisch blutet", "or": "Oft ist es eine Gingivitis: umkehrbar, wenn man früh handelt.", "donc": "Ein Zahnfleischbefund, bei Bedarf Zahnreinigung und Wurzelglättung.", "rb": "Ein Teil der Leistungen wird erstattet.", "soin": "paro"}, "sagesse": {"h": "Meine Weisheitszähne stören mich", "or": "Stehen sie falsch, entzünden sie sich oder schieben die anderen Zähne.", "donc": "Eine Panoramaaufnahme, dann bei Bedarf die Entfernung in der Praxis.", "rb": "Die Entfernung wird von der Krankenversicherung erstattet.", "soin": "sagesse"}, "enceinte": {"h": "Ich bin schwanger", "or": "Das Zahnfleisch ist in der Schwangerschaft empfindlicher.", "donc": "Eine Kontrolle wird empfohlen; die meisten Behandlungen sind möglich.", "rb": "Eigene Vorsorgeuntersuchung ab dem 4. Monat übernommen.", "soin": "prevention"}, "grince": {"h": "Ich knirsche nachts mit den Zähnen", "or": "Bruxismus nutzt die Zähne ab und ermüdet den Kiefer.", "donc": "Eine Knirscherschiene, nach Maß gefertigt.", "rb": "Kostenübernahme je nach Fall: Sie erhalten einen Kostenvoranschlag.", "soin": "gouttieres"}}, "adv": {"rdv": "Am einfachsten: Buchen Sie auf Doctolib, zu jeder Uhrzeit. Sie können unter der Woche auch die 05 87 14 06 17 anrufen.", "horaires": "Die Praxis empfängt von Montag bis Freitag, von 8.30 bis 19.30 Uhr. Am Wochenende ist sie geschlossen. (Öffnungszeiten mit der Praxis abzustimmen.)", "acces": "Rue Joseph-Lakanal in Toulouse, gegenüber dem Lycée Pierre-de-Fermat. Metro Linie A, Station Capitole, nur wenige Schritte von der Place du Capitole und der Place Saint-Pierre.", "parking": "Zu Parkmöglichkeiten in der Nähe der Praxis habe ich keine Informationen. Am einfachsten ist die Metro A, Station Capitole, oder ein Anruf unter 05 87 14 06 17.", "urgence": "Unter der Woche rufen Sie die 05 87 14 06 17 an: Patienten der Praxis werden in der Regel am selben Tag empfangen. Sonntags und an Feiertagen organisiert die Zahnärztekammer einen Bereitschaftsdienst in der Haute-Garonne. Wenn Ihr Leben in Gefahr ist, wählen Sie die 15.", "rb": "Untersuchungen und übliche Behandlungen werden zu 70 % von der französischen Krankenversicherung (Assurance maladie) erstattet, den Rest übernimmt in der Regel Ihre Zusatzversicherung (Mutuelle). Wir rechnen direkt ab: Denken Sie an Ihre Carte Vitale. Für Implantate, Ästhetik oder Kieferorthopädie bei Erwachsenen erhalten Sie einen Kostenvoranschlag.", "prix": "Die Website der Praxis nennt nur einen Preis: den ersten kieferorthopädischen Termin für 23 €. Bei den anderen Behandlungen hängt der Preis von Ihrer Situation ab: Den Kostenvoranschlag erhalten Sie bei der Beratung.", "implant": "Ein Implantat ersetzt die Zahnwurzel durch eine Titanschraube, danach wird eine Krone gesetzt. In der Praxis sind die Drs. Badoures, Moreau und Lespinard in Implantologie ausgebildet. Das Implantat wird von der Sécurité sociale nicht erstattet, die Krone teilweise.", "ortho": "Dr. Hugon de Scoeux, Kieferorthopädin, behandelt Kinder, Jugendliche und Erwachsene: Brackets, Invisalign®-Aligner, Quad-Hélix. Erster Termin: 23 €. Vor dem 16. Geburtstag Erstattung nach vorheriger Zustimmung.", "enfant": "Erster Besuch mit etwa 3 oder 4 Jahren, früher bei Sorgen. Dr. Panozzo ist in Kinderzahnheilkunde und Sedierung ausgebildet, Dr. Bramardi in Behandlungen unter MEOPA. Die Untersuchung M'T dents wird übernommen.", "blanc": "Die Aufhellung erfolgt mit Schienen, die in der Praxis gefertigt werden, nach einer Kontrolle und einer Zahnreinigung. Sie macht die Zähne bis zu vier Farbstufen heller. Sie ist nur ab 18 Jahren möglich und wird nicht erstattet.", "facettes": "Veneers sind dünne Schalen aus Keramik oder Komposit, die auf die sichtbare Seite der Zähne geklebt werden. Sie halten 10 bis 15 Jahre. Dr. Lespinard hat sich in Veneers weitergebildet.", "detartrage": "Eine Zahnreinigung erfolgt in einer Sitzung mit Ultraschall, danach wird poliert. Die Praxis empfiehlt eine Kontrolle alle sechs Monate. Sie wird erstattet.", "carie": "Ein Schmerz kann Karies sein, aber auch ein Abszess oder das Zahnfleisch. Vereinbaren Sie bald einen Termin. Eine kleine Karies wird mit Komposit behandelt; eine größere mit einem Inlay oder einer Krone.", "sagesse": "Weisheitszähne werden in der Praxis unter Lokalanästhesie entfernt, nach einer Panoramaaufnahme. Die Entfernung wird erstattet.", "gencives": "Blutendes Zahnfleisch ist oft eine Gingivitis. Die Drs. Sekkat, Badoures und Moreau sind in Parodontologie ausgebildet. Zuerst Zahnreinigung und Wurzelglättung, bei Bedarf Chirurgie.", "enceinte": "Ja, Sie können in der Schwangerschaft behandelt werden. Eine Vorsorgeuntersuchung wird ab dem 4. Monat übernommen. Bei größeren Behandlungen holen wir den Rat Ihres Frauenarztes ein.", "cerec": "Die Praxis hat eine CEREC®-Fräsmaschine: Wenn es möglich ist, wird Ihre Krone oder Ihr Inlay vor Ihren Augen gefertigt und etwa eine Stunde nach Beginn des Termins eingesetzt.", "equipe": "Zehn Zahnärzte: Drs. Sekkat, Badoures, Beugnet, Moreau, Gouchet, Panozzo, Bramardi, Lespinard, Lignères und Hugon de Scoeux. Im Bereich Das Team finden Sie ihre Ausbildungen.", "job": "Die Praxis stellt regelmäßig ein. Über die Seite Zum Team können Sie Ihre Bewerbung senden.", "langues": "Zu den Sprachen, die die einzelnen Zahnärzte sprechen, habe ich keine Informationen. Am besten fragen Sie unter 05 87 14 06 17 nach.", "fallback": "Auf diese Frage habe ich keine Antwort, und ich möchte Ihnen nichts Falsches sagen. Die Praxis antwortet Ihnen unter 05 87 14 06 17 oder per E-Mail an bonjour@cabinet-dentaire-toulouse-fermat.fr.", "merci": "Sehr gern. Einen schönen Tag, und bis bald in der Praxis.", "peur": "Das ist häufig, und das Team kennt das. Dr. Panozzo ist in Sedierung ausgebildet, Dr. Bramardi und Dr. Sekkat in Behandlungen mit MEOPA (Lachgas). Sagen Sie es bei der Terminbuchung: Wir nehmen uns Zeit."}, "legal": {"edit": "Herausgeber: Cabinet dentaire Pierre de Fermat, SELAS mit einem Kapital von 1 020 €, 6 rue Joseph-Lakanal, 31000 Toulouse. SIREN 988 229 043. Präsidentin: Dr Samia Sekkat. E-Mail: bonjour@cabinet-dentaire-toulouse-fermat.fr.", "host": "Hosting: o2switch, 222-224 boulevard Gustave-Flaubert, 63000 Clermont-Ferrand.", "repro": "Alle Texte, Fotos und Inhalte der Website sind geschützt: Eine Vervielfältigung ist ohne Zustimmung des Herausgebers nicht gestattet.", "data": "Die über die Formulare gesendeten Angaben dienen ausschließlich der Beantwortung Ihrer Anfragen und der Betreuung der Patienten. Sie werden zwei Jahre lang gespeichert. Sie können sie einsehen, berichtigen oder löschen lassen, indem Sie an bonjour@cabinet-dentaire-toulouse-fermat.fr schreiben. Widerspruchsliste gegen Werbeanrufe: bloctel.gouv.fr.", "conf1": "Verantwortlicher: Cabinet dentaire Pierre de Fermat, SELAS, 6 rue Joseph-Lakanal, Toulouse.", "conf2": "Erhobene Daten: Identität, E-Mail, Telefon, Nachricht, Postleitzahl, Korrespondenz sowie technische Verbindungsdaten (Domain, IP-Adresse).", "conf3": "Sie dienen dazu, Ihre Anfragen zu beantworten und Ihre Termine zu organisieren; sie werden niemals verkauft.", "conf4": "Sie haben ein Recht auf Auskunft, Berichtigung, Löschung und Widerspruch, auszuüben per E-Mail."}}, "it": {"ui": {"lang_name": "Italiano", "nav_soins": "Cure", "nav_urg": "Urgenze", "nav_ortho": "Ortodonzia", "nav_cab": "Lo studio", "nav_equipe": "Il team", "nav_blog": "Blog", "nav_contact": "Contatti", "nav_join": "Lavora con noi", "nav_adv": "Fermat Conseil", "cta_rdv": "Prenota un appuntamento", "cta_rdv_short": "Appuntamento", "cta_call": "Chiami lo studio", "cta_doctolib": "Prenoti su Doctolib", "cta_soin": "Vedi la scheda della cura", "hero_t": "I Suoi dentisti nel cuore di Toulouse, di fronte al liceo Pierre-de-Fermat.", "hero_p": "Dieci professionisti riuniti in uno studio nuovo, a due passi dal Capitole: cure quotidiane, impianti, ortodonzia, estetica. E una corona realizzata sul posto, in un'ora, quando è possibile.", "hero_open": "Aperto ora", "hero_closed": "Chiuso al momento", "hero_hours": "Dal lunedì al venerdì, 8.30 – 19.30", "m1": "Prendiamo un paziente, a Toulouse.", "m2": "Ipotesi: ha male, oppure sogna un sorriso più bello.", "m3": "Ora: dieci dentisti, cinque giorni su sette, metro Capitole.", "m4": "Dunque: un appuntamento, senza giri di parole.", "qed": "CVD", "metro": "Metro A · Capitole", "tiers": "Terzo pagante Sécurité sociale", "demo_t": "La Sua dimostrazione", "demo_p": "Scelga la Sua situazione: la pagina scrive per Lei la cura, i professionisti formati per eseguirla e i passi da seguire.", "demo_hyp": "Ipotesi", "demo_or": "Ora", "demo_donc": "Dunque", "demo_avec": "Con", "demo_rb": "Rimborso", "demo_pick": "Scelga una situazione a sinistra per iniziare.", "piliers_t": "Ciò che curiamo, dal primo all'ultimo dente", "p1_t": "Ortodonzia e allineatori invisibili", "p1_p": "Bambini, adolescenti o adulti: apparecchi in ceramica, Invisalign®, Quad-Hélix. No, l'ortodonzia non è solo per i bambini.", "p2_t": "Sbiancamento dentale", "p2_p": "Fino a quattro tonalità di bianco in più, sotto il controllo di dentisti formati. Caffè, tè, vino, fumo: le macchie se ne vanno.", "p3_t": "Impianti dentali", "p3_p": "Una radice in titanio nell'osso, una corona sopra: il dente mancante si sostituisce e poi non ci si pensa più.", "p4_t": "Prevenzione e controllo", "p4_p": "Un controllo ogni sei mesi, una pulizia dal tartaro, consigli su misura: la cura migliore è quella che si evita.", "tech_t": "Il laboratorio dietro la poltrona", "tech_p": "Lo studio è stato attrezzato per formulare una diagnosi precisa e risparmiarLe inutili andirivieni.", "t_cerec": "CEREC®: corone e inlay realizzati sul posto, in un'ora", "t_scan": "Scanner intraorale 3D TRIOS 3: addio alla pasta per impronte", "t_radio": "Radiografia panoramica, teleradiografia e TAC 3D cone beam", "t_ster": "Sala di sterilizzazione dedicata", "t_pri
