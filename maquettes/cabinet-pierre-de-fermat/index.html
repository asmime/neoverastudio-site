:root{
--encre:#1b2a5c;--encre-2:#2a3d7a;--papier:#f4f5f1;--feuille:#fbfbf8;--grille:rgba(21,41,74,.075);
--brique:#b5402b;--brique-doux:#f3dcd5;--texte:#1a2234;--doux:#525d74;--ligne:#d6dbe4;--ok:#2f6b4f;
--titre:"Schibsted Grotesk","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
--plume:"Kalam","Schibsted Grotesk","Kaiti SC","STKaiti",cursive;
--r:14px;--ombre:0 10px 30px -12px rgba(21,41,74,.28),0 2px 6px -2px rgba(21,41,74,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scrollbar-color:var(--encre) var(--papier)}
body{margin:0;font-family:var(--titre);color:var(--texte);background:var(--papier);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--encre);color:#fff}
::-webkit-scrollbar{width:11px;height:8px}::-webkit-scrollbar-thumb{background:var(--encre);border-radius:8px;border:3px solid var(--papier)}::-webkit-scrollbar-track{background:var(--papier)}
a{color:var(--encre);text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{color:var(--brique)}
:focus-visible{outline:2.5px solid var(--brique);outline-offset:3px;border-radius:6px}
img{max-width:100%;display:block}
h1,h2,h3{font-weight:800;letter-spacing:-.025em;line-height:1.08;color:var(--encre);text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,5.2vw,4.4rem)}
h2{font-size:clamp(1.75rem,3.4vw,2.8rem)}
h3{font-size:1.25rem;letter-spacing:-.01em;line-height:1.25}
p{margin:0 0 1em;max-width:68ch;text-wrap:pretty}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}
.grille{background-image:linear-gradient(var(--grille) 1px,transparent 1px),linear-gradient(90deg,var(--grille) 1px,transparent 1px);background-size:26px 26px}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;z-index:99;background:#fff;padding:8px 12px}
/* en-tête */
header.top{position:sticky;top:0;z-index:40;background:rgba(251,251,248,.96);border-bottom:1px solid var(--ligne)}
.barre{display:flex;align-items:center;gap:18px;min-height:70px}
.marque{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--encre);flex:0 0 auto}
.marque img{height:44px;width:auto}
.marque span{display:none}
.marque img{height:50px}
nav.menu{flex:1;min-width:0;position:relative}
nav.menu ul{list-style:none;display:flex;gap:2px;margin:0;padding:0;justify-content:center}

thétique", "fam_rempl": "Remplacer une dent", "fam_genc": "Gencives", "fam_ortho": "Orthodontie", "enbref": "En bref", "back_soins": "Tous les soins", "back_blog": "Tout le carnet", "rb_l": "Remboursement", "who_l": "Praticiens formés", "urg_t": "Une urgence dentaire ?", "urg_p": "Douleur aiguë, abcès, chute, dent cassée : l'équipe vous prend en charge au plus vite. Les patients déjà suivis au cabinet sont habituellement reçus le jour même ; les autres selon les créneaux disponibles.", "urg_garde_t": "Dimanche et jours fériés", "urg_garde_p": "Un service de garde est organisé par le Conseil de l'Ordre des chirurgiens-dentistes de la Haute-Garonne. Si votre vie est en danger, composez le 15.", "urg_garde_note": "Le site actuel indique d'appeler la régulation au 05 87 14 06 17, qui est le numéro du cabinet : numéro de garde à confirmer avec le cabinet.", "urg_sit_t": "Situations prises en charge", "urg_s1": "Douleur dentaire intense ou persistante", "urg_s2": "Infection : abcès, gencive infectée", "urg_s3": "Choc ou traumatisme : dent cassée ou expulsée", "urg_s4": "Douleur après une extraction de dent de sagesse", "urg_s5": "Perte d'un plombage ou d'une couronne", "urg_causes_t": "Les causes les plus fréquentes", "urg_c1": "Abcès dentaire : du pus autour de la racine ou dans la gencive. Douleur lancinante, joue gonflée, parfois fièvre.", "urg_c2": "Gingivite et parodontite : gencives rouges, gonflées, qui saignent au brossage.", "urg_c3": "Péricoronarite : infection autour d'une dent de sagesse qui pousse mal.", "urg_c4": "Pulpite : le nerf de la dent est enflammé, la douleur réveille la nuit.", "urg_c5": "Alvéolite : infection de l'alvéole après une extraction.", "urg_quoi_t": "En attendant votre rendez-vous", "urg_q1": "Dent expulsée : la tenir par la couronne, la garder dans du lait ou dans la bouche, et venir tout de suite.", "urg_q2": "Douleur : un antalgique adapté, jamais d'aspirine sur la gencive, pas de chaleur sur la joue.", "urg_q3": "Joue qui gonfle ou fièvre : appelez sans attendre.", "urg_hor": "Accueil des urgences en semaine, aux heures d'ouverture.", "ortho_t": "Orthodontie à Toulouse : un sourire droit, à tout âge", "ortho_p": "Le Dr Hugon de Scoeux adapte le traitement à chacun : bagues classiques ou céramiques, aligneurs Invisalign®, Quad-Hélix pour les plus jeunes.", "ortho_tarifs_t": "Tarifs et remboursements", "ortho_tar1": "Premier rendez-vous : 23 €. Diagnostic, bilan et devis détaillé.", "ortho_tar2": "Avant 16 ans, avec accord préalable de l'Assurance maladie : base de remboursement de 193,50 € par semestre, six semestres au plus.", "ortho_tar3": "Contention après traitement : en général de 100 à 800 € par an, selon la technique (fil ou gouttière).", "ortho_tar4": "Adultes : en général non remboursé par la Sécurité sociale ; votre mutuelle peut prendre une part.", "ortho_ages_t": "Trois âges, trois approches", "cab_t": "Un cabinet pensé pour qu'on oublie qu'on va « chez le dentiste »", "cab_p": "Matériel récent, mobilier choisi, lumière douce : le cabinet Pierre de Fermat a été imaginé pour vous accueillir dans un lieu chaleureux et vous donner accès à une dentisterie de qualité en plein centre de Toulouse.", "cab_l1": "Une équipe pluridisciplinaire : implants, orthodontie, esthétique, gencives, enfants.", "cab_l2": "Des plans de traitement sur mesure, pensés pour durer.", "cab_l3": "Les dernières technologies, au service du confort.", "cab_l4": "Le tiers payant de la Sécurité sociale : pensez à votre carte Vitale.", "contact_t": "Nous écrire, nous appeler, venir", "contact_p": "Le plus rapide : Doctolib, à toute heure. Sinon, un appel ou un message, et l'équipe revient vers vous.", "form_nom": "Nom et prénom", "form_mail": "E-mail", "form_tel": "Téléphone", "form_msg": "Votre message", "form_send": "Envoyer le message", "form_ok": "Merci, votre message est prêt. Dans la version finale, il arrivera directement au secrétariat.", "form_err": "Merci d'indiquer votre nom et un e-mail ou un téléphone.", "join_t": "Rejoindre l'équipe", "join_p": "Le cabinet cherche toujours des professionnels motivés, qui ont envie de travailler avec du matériel récent et de placer l'humain au centre. Assistant(e), praticien(ne), secrétaire : présentez-vous.", "join_poste": "Poste visé", "join_p1": "Chirurgien-dentiste", "join_p2": "Orthodontiste", "join_p3": "Assistant(e) dentaire", "join_p4": "Secrétaire médical(e)", "join_p5": "Autre", "join_cv": "Votre CV (PDF)", "join_send": "Envoyer ma candidature", "leg_t": "Mentions légales", "conf_t": "Politique de confidentialité", "foot_tag": "Cabinet dentaire Pierre de Fermat · SELAS · Toulouse", "foot_soc": "Prendre rendez-vous en ligne", "foot_proto": "Proposition de refonte réalisée par Neovera Studio. Contenus repris du site actuel du cabinet.", "adv_btn": "Je vous aide à choisir", "adv_hello": "Bonjour, je suis Fermat Conseil, l'assistant virtuel du cabinet. Je réponds sur les soins, les horaires, l'accès, les urgences et les remboursements.", "adv_tag": "Assistant virtuel", "adv_ph": "Posez votre question…", "adv_send": "Envoyer", "adv_invite": "Une question sur un soin, un rendez-vous ? Je vous oriente.", "adv_close": "Fermer", "q_rdv": "Prendre rendez-vous", "q_urg": "J'ai mal, c'est urgent", "q_rb": "Remboursements", "q_acces": "Venir au cabinet", "q_ortho": "Orthodontie", "q_impl": "Implant", "lang_l": "Langue", "menu_l": "Menu principal", "skip": "Aller au contenu", "illus": "Illustration du site actuel", "minutes": "min de lecture", "art_more": "Pour aller plus loin, parlez-en au cabinet lors de votre prochain rendez-vous.", "not_found": "Cette page n'existe pas. Revenez à l'accueil."}, "soins": {"gouttieres": {"t": "Gouttières dentaires", "s": "Pour qui ? Pour quoi ?", "p": "Une gouttière est un appareil amovible fait sur mesure, d'après une empreinte numérique de vos dents. Elle sert à protéger, à éclaircir ou à aligner.", "k": ["Bruxisme : la gouttière de libération occlusale protège les dents qui grincent la nuit et soulage la mâchoire.", "Orthodontie : les aligneurs transparents déplacent les dents en douceur.", "Contention : portée la nuit après un traitement, elle garde le résultat.", "Sport : une gouttière de protection évite les dents cassées lors des chocs."], "r": "Prise en charge variable selon l'usage : le cabinet vous remet un devis."}, "invisalign": {"t": "Invisalign®", "s": "L'orthodontie discrète", "p": "Des gouttières transparentes, imprimées en 3D, qui alignent les dents sans fil ni bague. Pour les adultes, les ados et certains enfants.", "k": ["Discret, confortable, facile à nettoyer, retiré pendant les repas.", "Première consultation : vos attentes et un examen pour savoir si le traitement vous convient.", "Bilan : radio de profil, empreintes 3D, puis plan de traitement simulé en 3D et devis détaillé.", "Praticiens certifiés Invisalign® au cabinet."], "r": "Prix fixé après le bilan, devis remis avant tout engagement."}, "caries": {"t": "Caries", "s": "Une bouche saine, sans carie", "p": "La carie est une destruction de la dent par les bactéries de la plaque. Prise tôt, elle se soigne simplement ; laissée, elle atteint le nerf.", "k": ["Quatre stades : déminéralisation, carie de l'émail, carie profonde, infection de la pulpe.", "Petite carie : obturation au composite, de la couleur de la dent.", "Plus grande : inlay ou onlay en céramique, ou couronne si la dent est très abîmée.", "Prévention : brossage, alimentation moins sucrée, détartrage au moins une fois par an."], "r": "Soin courant : remboursé à 70 % par l'Assurance maladie, le reste par votre mutuelle."}, "detartrage": {"t": "Détartrage", "s": "Des dents lisses, un sourire net", "p": "Le tartre, c'est la plaque qui a durci : la brosse ne l'enlève plus. Le détartrage le retire en une séance, sans douleur.", "k": ["Ultrasons pour décoller le tartre, même dans les zones difficiles.", "Polissage pour des surfaces lisses où la plaque accroche moins.", "Au moins une fois par an, plus souvent pour les fumeurs ou les personnes diabétiques.", "Surfaçage si le tartre est descendu sous la gencive."], "r": "Remboursé par l'Assurance maladie et la mutuelle."}, "blanchiment": {"t": "Blanchiment dentaire", "s": "L'éclat retrouvé, en quelques semaines", "p": "Avec le temps, café, thé, vin et tabac ternissent les dents, et l'émail s'amincit. L'éclaircissement fait gagner plusieurs teintes de blanc.", "k": ["Consultation préalable : caries, gencives, sensibilité, grossesse sont vérifiées.", "Détartrage, aéropolissage, photos avant traitement.", "Empreinte 3D et gouttières fabriquées au cabinet, remises avec le produit.", "Réservé aux plus de 18 ans (peroxyde de carbamide, règle européenne)."], "r": "Soin esthétique non remboursé : tarif et durée présentés lors de la consultation."}, "devitalisation": {"t": "Dévitalisation", "s": "Sauver la dent plutôt que l'arracher", "p": "Quand une carie profonde ou un choc atteint le nerf, on retire la pulpe, on nettoie et on scelle les canaux. La dent est conservée.", "k": ["Radiographies pour décider du traitement.", "Anesthésie locale : le soin se fait sans douleur.", "Nettoyage, désinfection et obturation des canaux.", "Reconstruction : couronne, inlay ou onlay selon l'état de la dent."], "r": "Soin courant : remboursé à 70 % par l'Assurance maladie, le reste par votre mutuelle."}, "facettes": {"t": "Facettes dentaires", "s": "Un nouveau sourire, sans compromis", "p": "Une fine coque de céramique ou de composite collée sur la face visible de la dent : couleur, forme et petits défauts sont corrigés.", "k": ["Pour les teintes qui résistent au blanchiment et les dents courtes ou abîmées.", "Très peu invasif : une fine couche d'émail est préparée.", "Empreintes optiques, facettes sur mesure, collage puis polissage.", "Durent 10 à 15 ans avec une bonne hygiène."], "r": "Soin esthétique : devis remis lors de la première consultation."}, "implants": {"t": "Implants dentaires", "s": "Le confort d'une dent naturelle", "p": "Une racine artificielle en titane placée dans l'os, puis une couronne en céramique. Pour une dent, plusieurs, ou toute une arcade.", "k": ["Couronne sur implant, bridge sur implants, ou prothèse fixe sans palais sur 4 ou 6 implants (All-on X®).", "Taux de succès souvent supérieur à 95 % sur plusieurs années.", "Après un choc, une perte liée aux gencives, une agénésie ou une dent impossible à sauver.", "Alternatives : bridge, bridge collé, prothèse amovible partielle ou complète."], "r": "Implant non remboursé par la Sécurité sociale ; la couronne peut l'être en partie. Devis pour votre mutuelle."}, "couronnes": {"t": "Couronnes", "s": "Une dent renforcée, qui reste naturelle", "p": "La couronne recouvre entièrement une dent abîmée pour lui rendre sa forme, sa solidité et sa couleur. En céramique Emax ou en zircone.", "k": ["Examen clinique et radio, devis pour votre mutuelle.", "Préparation de la dent, empreinte optique 3D.", "Quand c'est possible, couronne usinée sous vos yeux par la CEREC : vous repartez avec, une heure après le début du rendez-vous.", "Durée de vie : 10 à 20 ans bien entretenue."], "r": "Prise en charge partielle par l'Assurance maladie selon le matériau ; devis pour votre mutuelle."}, "inlay": {"t": "Inlay, onlay, overlay", "s": "Réparer sans trop tailler", "p": "Une pièce de céramique ou de zircone, faite sur mesure par l'usineuse du cabinet, qui comble la cavité d'une dent moyennement abîmée.", "k": ["Inlay : dans la dent. Onlay : couvre une partie de la surface. Overlay : couvre toute la surface.", "Préserve plus de dent qu'une couronne.", "Céramique : résistante et de la couleur de la dent.", "Fabriquée au cabinet, souvent en une séance."], "r": "Prise en charge partielle selon le cas ; devis remis avant le soin."}, "sagesse": {"t": "Dents de sagesse", "s": "Pour une bouche en bonne santé", "p": "Les troisièmes molaires poussent entre 16 et 20 ans. Mal placées, elles font mal, s'infectent ou poussent les autres dents.", "k": ["Consultation avec radio panoramique avant toute décision.", "Extraction sous anesthésie locale, au cabinet.", "Suites : douleur et gonflement maîtrisés, consignes remises.", "Le cabinet est à deux pas du Capitole."], "r": "Extraction remboursée par l'Assurance maladie et la mutuelle."}, "greffe": {"t": "Greffe de gencives", "s": "Quand la gencive se rétracte", "p": "Un brossage trop fort peut faire reculer la gencive : la racine se découvre, la dent devient sensible. La greffe la recouvre.", "k": ["Protège la racine et freine le déchaussement.", "Renforce une gencive trop fine.", "Améliore l'esthétique du sourire.", "Suivi après l'intervention et conseils de brossage."], "r": "Acte peu remboursé : devis remis avant l'intervention."}, "bridge": {"t": "Bridge dentaire", "s": "Un pont entre deux dents", "p": "Une prothèse fixe qui remplace une ou plusieurs dents en prenant appui sur les dents voisines.", "k": ["Bridge unitaire pour une dent, bridge complet pour plusieurs.", "En céramique pour un rendu naturel.", "Mastication confortable et efficace retrouvée.", "Empreintes numériques, essayage, puis pose."], "r": "Prise en charge partielle par l'Assurance maladie ; devis pour votre mutuelle."}, "conservateurs": {"t": "Soins conservateurs", "s": "Garder ses dents le plus longtemps possible", "p": "Soigner la dent en gardant le plus possible de tissu sain, pour éviter l'extraction.", "k": ["Traitement des caries au composite.", "Inlays et onlays en céramique.", "Détartrage et prophylaxie.", "Traitement endodontique (dévitalisation)."], "r": "Soins courants remboursés à 70 % par l'Assurance maladie."}, "restauration": {"t": "Restauration du sourire", "s": "Éclat et confiance retrouvés", "p": "Plusieurs techniques se combinent pour embellir le sourire sans intervention lourde.", "k": ["Couronnes tout céramique : esthétique et résistance.", "Facettes : un sourire transformé en quelques séances.", "Gouttières invisibles : réaligner en toute discrétion.", "Blanchiment, inlays et onlays, et traitement des problèmes d'occlusion."], "r": "Selon les soins choisis : devis détaillé lors de la consultation."}, "titane": {"t": "Implants en titane", "s": "Une solution fiable et durable", "p": "Le titane est le matériau de référence en implantologie depuis les années 1980 : l'os l'accepte et s'y soude.", "k": ["Évaluation de vos besoins avec nos dentistes.", "Mise en place de l'implant, puis ostéointégration (l'os se soude au titane).", "Vis de cicatrisation, puis restauration prothétique.", "Titane de grade 4 ou 5, le même qu'en orthopédie."], "r": "Implant non remboursé par la Sécurité sociale ; devis pour votre mutuelle."}, "manquante": {"t": "Remplacer une dent manquante", "s": "Trois solutions, une bonne", "p": "Une dent absente fait bouger les voisines, fait fondre l'os et gêne pour manger ou parler. Elle se remplace.", "k": ["L'implant : la solution durable.", "Le bridge : une alternative fixe efficace.", "La prothèse amovible : temporaire ou définitive.", "Le choix se fait ensemble, selon l'os, les dents voisines et le budget."], "r": "Selon la solution : devis comparatif remis en consultation."}, "paro": {"t": "Parodontologie", "s": "Soigner ce qui tient les dents", "p": "Gencive, ligament, cément et os : quand ils s'enflamment, les dents se déchaussent. La parodontologie les soigne.", "k": ["Signes : gencives qui saignent, rouges, mauvaise haleine, dents qui bougent.", "Détartrage et surfaçage radiculaire.", "Traitements chirurgicaux avancés si besoin.", "Prévention et hygiène adaptées pour durer."], "r": "Une partie des actes est remboursée ; devis pour le reste."}, "prevention": {"t": "Prévention dentaire", "s": "Le meilleur soin est celui qu'on évite", "p": "Caries, maladies des gencives : la plupart s'évitent. L'équipe vous accompagne pour garder une bouche saine.", "k": ["Brossage avec une brosse adaptée, fil dentaire et bain de bouche.", "Bilans et détartrages réguliers.", "Conseils et éducation à l'hygiène, dès l'enfance.", "Programme M'T dents de l'Assurance maladie pour les enfants et les jeunes."], "r": "Consultations de contrôle remboursées ; M'T dents pris en charge à 100 %."}, "premiers-rdv": {"t": "Premiers rendez-vous d'orthodontie", "s": "Votre problème devient le nôtre", "p": "Un dentiste, un médecin ou vous-même avez repéré un souci d'alignement. Tout commence par deux rendez-vous.", "k": ["Première consultation : on fait connaissance, on écoute vos attentes, on examine.", "Rendez-vous bilan : scanner 3D, photos, téléradiographie.", "Plan de traitement et devis expliqués étape par étape.", "Premier rendez-vous : 23 €."], "r": "Avant 16 ans, remboursement après accord préalable de l'Assurance maladie."}, "technologies": {"t": "Technologies d'orthodontie", "s": "Diagnostic précis, traitement confortable", "p": "Le cabinet s'est équipé pour vous éviter les pâtes à empreinte et les allers-retours.", "k": ["Scanner intra-buccal 3D TRIOS 3 (3Shape) : empreintes en quelques minutes.", "Radio panoramique et téléradiographie numériques.", "Salle de stérilisation dédiée.", "Imprimante 3D pour les appareils et gouttières."], "r": ""}, "ortho-adulte": {"t": "Orthodontie adulte", "s": "Votre plus beau sourire, à tout âge", "p": "L'âge n'est pas un obstacle tant que les gencives et l'os sont en bonne santé. Les appareils sont devenus discrets.", "k": ["Aligneurs transparents : esthétiques et amovibles.", "Bagues céramiques : la couleur de la dent.", "Orthodontie pré-prothétique pour préparer implants ou couronnes.", "Associée à la chirurgie pour les grands décalages de mâchoires."], "r": "En général non remboursé pour l'adulte ; la mutuelle peut participer."}, "ortho-ado": {"t": "Orthodontie adolescent", "s": "Le bon moment pour agir", "p": "À l'adolescence, toutes les dents définitives sont là et la croissance aide encore : c'est le moment idéal.", "k": ["Appareils multi-attaches (bagues).", "Gouttières transparentes (aligneurs).", "Extraction de dents définitives si nécessaire.", "Agir avant la fin de la croissance pour corriger les décalages osseux."], "r": "Avant 16 ans : remboursement après accord préalable (base 193,50 € par semestre)."}, "ortho-enfant": {"t": "Orthodontie enfant", "s": "Guider la croissance", "p": "Certains déséquilibres apparaissent tôt et gênent la mastication, la déglutition ou la respiration. On peut intervenir tôt.", "k": ["Correction des décalages entre les mâchoires.", "Expansion du palais (Quad-Hélix).", "Repositionnement des dents trop avancées.", "Correction des mauvaises habitudes : pouce, langue."], "r": "Remboursement après accord préalable de l'Assurance maladie."}}, "arts": {"adulte": {"t": "L'orthodontie, aussi une affaire d'adulte", "s": "De plus en plus d'adultes améliorent leur sourire et leur santé dentaire grâce à des appareils discrets.", "k": ["Chevauchements et décalages s'accentuent avec l'âge.", "Bagues métal ou céramique, aligneurs Invisalign®, gouttières, chirurgie si besoin.", "Diagnostic complet avant de choisir l'appareil."]}, "implant": {"t": "Qu'est-ce qu'un implant dentaire et comment fonctionne-t-il ?", "s": "Une vis en titane qui remplace la racine d'une dent manquante, sous anesthésie locale.", "k": ["Consultation et diagnostic, puis intervention chirurgicale.", "Placement précis de la vis en titane, cicatrisation de quelques mois.", "Avantages, risques et contre-indications expliqués avant de décider."]}, "infection": {"t": "Quels sont les symptômes d'une infection dentaire ?", "s": "Douleur qui lance, gencive gonflée, mauvais goût : savoir reconnaître une infection et réagir vite.", "k": ["Signes : douleur, sensibilité, abcès, fièvre, joue gonflée.", "Causes : carie profonde, choc, gencives malades, dent de sagesse.", "Non traitée, l'infection peut s'étendre : consultez rapidement."]}, "gencives": {"t": "Comment prévenir les maladies des gencives ?", "s": "Gingivite et parodontite avancent souvent sans bruit. Voici comment les arrêter.", "k": ["La gingivite est réversible, la parodontite détruit l'os.", "Hygiène rigoureuse, alimentation, contrôles réguliers.", "Saignements, gencives qui reculent : il est temps de consulter."]}, "caries": {"t": "Quelles sont les causes des caries et comment les prévenir ?", "s": "Bactéries, sucre et temps : comprendre la carie pour l'éviter.", "k": ["Les bactéries de la plaque attaquent l'émail, puis la dentine.", "Brossage, fil, moins de sucre, détartrage régulier.", "Une carie traitée tôt évite la dévitalisation."]}, "frequence": {"t": "À quelle fréquence aller chez le dentiste ?", "s": "Enfants, adultes, personnes âgées : le bon rythme dépend de l'âge et de l'histoire de chacun.", "k": ["En général un contrôle tous les six mois.", "Plus souvent pour les fumeurs, les diabétiques ou les porteurs d'appareil.", "Les visites régulières évitent les gros soins."]}, "ortho-bienfaits": {"t": "L'orthodontie ne sert pas qu'à aligner les dents", "s": "Mastication, respiration, articulation de la mâchoire : les bienfaits méconnus.", "k": ["Corrige les malocclusions qui gênent pour manger ou respirer.", "Possible à tout âge.", "Durée et coût expliqués lors du bilan."]}, "brossage": {"t": "Comment se brosser les dents correctement ?", "s": "Brosse, dentifrice, geste, durée : le guide complet.", "k": ["Deux minutes, deux fois par jour, brosse souple changée tous les trois mois.", "Dentifrice fluoré, fil ou brossettes en complément.", "Les erreurs à éviter, et les conseils pour les plus jeunes."]}, "rembourse": {"t": "Est-ce que l'orthodontie est remboursée ?", "s": "Sécurité sociale, mutuelle, enfants, adultes : qui paie quoi.", "k": ["Avant 16 ans : 70 % du tarif de convention après accord préalable.", "Adultes : rarement remboursé, sauf cas chirurgicaux.", "La mutuelle complète selon le contrat : demandez un devis."]}, "ronfler": {"t": "Comment dormir sans ronfler ?", "s": "Un adulte sur quatre ronfle. Le dentiste peut aider.", "k": ["Dormir sur le côté, perdre du poids, moins d'alcool et de tabac.", "L'orthèse d'avancée mandibulaire, portée la nuit, libère les voies respiratoires.", "Si le ronflement persiste : avis d'un médecin ORL."]}, "mtdents": {"t": "L'examen M'T dents", "s": "Le rendez-vous de prévention offert par l'Assurance maladie.", "k": ["Chaque année à partir de 3 ans depuis 2025, élargi progressivement jusqu'à 28 ans d'ici 2028.", "Un examen dédié pour les femmes enceintes dès le 4e mois.", "Invitation par courrier, aussi disponible sur ameli.fr."]}, "gouttieres": {"t": "Gouttière dentaire : pour qui ? pour quoi ?", "s": "Bruxisme, éclaircissement, alignement, sport : une gouttière, plusieurs usages.", "k": ["Faite sur mesure d'après une empreinte numérique.", "De jour ou de nuit selon la prescription.", "Entretien simple, durée de vie et coût expliqués au cabinet."]}, "role-ortho": {"t": "Quel est le rôle d'un orthodontiste ?", "s": "Le spécialiste des dents et des mâchoires mal placées, pour les enfants comme les adultes.", "k": ["Diagnostic, prévention et traitement des malocclusions.", "Quand consulter : dents qui se chevauchent, mâchoires décalées, mastication difficile.", "Traitements de 12 à 36 mois, puis contention."]}, "cout-implant": {"t": "Quel est le coût moyen d'un implant ?", "s": "Ce que comprend le prix, et comment se faire rembourser.", "k": ["Le prix comprend l'implant, le pilier et la couronne.", "L'implant n'est pas remboursé ; la couronne peut l'être en partie.", "Envoyez le devis à votre mutuelle avant l'intervention."]}}, "faq": [["Existe-t-il une différence entre dentiste et chirurgien-dentiste ?", "Aucune. Tous les praticiens obtiennent le titre de docteur en chirurgie dentaire. Certains choisissent simplement de ne pas pratiquer la chirurgie."], ["À quel âge amener son enfant chez le dentiste ?", "Dès les premières dents en théorie, vers 3 ou 4 ans en pratique. Plus tôt si quelque chose vous inquiète."], ["Acceptez-vous les urgences dentaires ?", "Oui. Les patients déjà suivis au cabinet sont habituellement reçus le jour même ; les autres selon les créneaux disponibles."], ["J'ai mal à une dent, est-ce une carie ?", "Peut-être : une douleur peut aussi venir d'un abcès, d'une dent de sagesse ou des gencives. Prenez rendez-vous, une consultation rapide vous soulagera au plus vite."], ["Comment serai-je remboursé ?", "Consultations et soins courants (détartrage, carie, dévitalisation, extraction) sont remboursés à 70 % par l'Assurance maladie, le reste en général par votre mutuelle. Pour les autres soins, un devis vous est remis."], ["Que se passe-t-il lors de la première visite ?", "On fait connaissance, on examine votre bouche, avec des radios si besoin, et on parle de vos attentes. Si un traitement est utile, on vous propose un plan expliqué étape par étape."], ["À quelle fréquence venir ?", "Un contrôle tous les six mois : examen clinique et radiologique, et nettoyage si besoin. Plus souvent selon votre situation."], ["Puis-je être soignée si je suis enceinte ?", "Oui. Les gencives sont plus sensibles pendant la grossesse : l'hygiène compte d'autant plus. Pour certains soins plus lourds, on demande l'avis de votre obstétricien."], ["Quelles technologies utilisez-vous ?", "Imagerie 3D et scanners intra-oraux, empreintes numériques sans pâte, laser dentaire, aligneurs Invisalign®, implantologie guidée et couronnes ou inlays usinés sur place dans l'heure grâce à la CEREC®."]], "team_roles": {"sekkat": "Présidente du cabinet · gencives, esthétique, orthodontie", "badoures": "Implants, gencives, CFAO", "beugnet": "Chirurgien-dentiste", "moreau": "Implants et chirurgie osseuse, gencives", "gouchet": "Chirurgien-dentiste", "panozzo": "Dentisterie pédiatrique et sédation", "bramardi": "Soins sous sédation (MEOPA)", "lespinard": "Usure, implants, facettes", "lignieres": "Chirurgien-dentiste", "hugon": "Orthodontie, aligneurs"}, "demo": {"mal": {"h": "J'ai mal à une dent", "or": "Une douleur peut venir d'une carie, d'un abcès, des gencives ou d'une dent de sagesse.", "donc": "Une consultation rapide pour trouver la cause et vous soulager.", "rb": "Consultation et soins courants remboursés à 70 %, le reste par la mutuelle.", "soin": "urgences"}, "casse": {"h": "Une dent s'est cassée ou est tombée", "or": "Après un choc, chaque heure compte, surtout si la dent est expulsée.", "donc": "Gardez la dent dans du lait et appelez le cabinet tout de suite.", "rb": "Soins d'urgence remboursés comme des soins courants.", "soin": "urgences"}, "controle": {"h": "Je veux un contrôle ou un détartrage", "or": "Le tartre ne part plus au brossage, et une carie débutante ne fait pas mal.", "donc": "Un contrôle avec détartrage, tous les six mois.", "rb": "Remboursé par l'Assurance maladie et la mutuelle.", "soin": "detartrage"}, "enfant": {"h": "Mon enfant a les dents mal placées", "or": "Avant la fin de la croissance, on peut guider les mâchoires.", "donc": "Un premier rendez-vous d'orthodontie (23 €) et un bilan.", "rb": "Avant 16 ans, remboursé après accord préalable (base 193,50 € par semestre).", "soin": "ortho-enfant"}, "aligner": {"h": "Je voudrais des dents droites (adulte)", "or": "L'orthodontie n'a pas d'âge, et les appareils sont devenus discrets.", "donc": "Aligneurs Invisalign® ou bagues céramiques, après un bilan 3D.", "rb": "En général non remboursé pour l'adulte ; la mutuelle peut participer.", "soin": "invisalign"}, "manque": {"h": "Il me manque une dent", "or": "Une dent absente fait bouger les voisines et fondre l'os.", "donc": "Implant, bridge ou prothèse : on choisit ensemble.", "rb": "Implant non remboursé, couronne en partie ; devis pour la mutuelle.", "soin": "manquante"}, "blanc": {"h": "Je voudrais des dents plus blanches", "or": "Café, thé, tabac et âge ternissent l'émail.", "donc": "Un éclaircissement avec gouttières faites au cabinet, ou des facettes si la teinte résiste.", "rb": "Soin esthétique non remboursé, réservé aux plus de 18 ans.", "soin": "blanchiment"}, "saigne": {"h": "Mes gencives saignent", "or": "C'est souvent une gingivite : réversible si on la prend tôt.", "donc": "Un bilan des gencives, détartrage et surfaçage si besoin.", "rb": "Une partie des actes est remboursée.", "soin": "paro"}, "sagesse": {"h": "Mes dents de sagesse me gênent", "or": "Mal placées, elles s'infectent ou poussent les autres dents.", "donc": "Une radio panoramique, puis extraction au cabinet si nécessaire.", "rb": "Extraction remboursée par l'Assurance maladie.", "soin": "sagesse"}, "enceinte": {"h": "Je suis enceinte", "or": "Les gencives sont plus sensibles pendant la grossesse.", "donc": "Un contrôle est conseillé ; la plupart des soins sont possibles.", "rb": "Examen de prévention dédié pris en charge dès le 4e mois.", "soin": "prevention"}, "grince": {"h": "Je grince des dents la nuit", "or": "Le bruxisme use les dents et fatigue la mâchoire.", "donc": "Une gouttière de libération occlusale, faite sur mesure.", "rb": "Prise en charge variable : devis remis.", "soin": "gouttieres"}}, "adv": {"rdv": "Le plus simple : réservez sur Doctolib, à toute heure. Vous pouvez aussi appeler le 05 87 14 06 17 en semaine.", "horaires": "Le cabinet reçoit du lundi au vendredi, de 8 h 30 à 19 h 30. Il est fermé le week-end. (Horaires à confirmer avec le cabinet.)", "acces": "Rue Joseph-Lakanal, à Toulouse, en face du lycée Pierre-de-Fermat. Métro ligne A, station Capitole, à deux pas de la place du Capitole et de la place Saint-Pierre.", "parking": "Je n'ai pas d'information sur le stationnement près du cabinet. Le plus simple est le métro A, station Capitole, ou d'appeler le 05 87 14 06 17.", "urgence": "En semaine, appelez le 05 87 14 06 17 : les patients du cabinet sont habituellement reçus le jour même. Le dimanche et les jours fériés, un dentiste de garde est organisé par l'Ordre en Haute-Garonne. Si votre vie est en danger, faites le 15.", "rb": "Consultations et soins courants sont remboursés à 70 % par l'Assurance maladie, le reste en général par votre mutuelle. Le tiers payant est appliqué : pensez à votre carte Vitale. Pour les implants, l'esthétique ou l'orthodontie adulte, un devis vous est remis.", "prix": "Le site du cabinet ne donne qu'un tarif : le premier rendez-vous d'orthodontie à 23 €. Pour les autres soins, le prix dépend de votre situation : un devis vous est remis en consultation.", "implant": "Un implant remplace la racine d'une dent par une vis en titane, puis on pose une couronne. Au cabinet, les Drs Badoures, Moreau et Lespinard sont formés en implantologie. L'implant n'est pas remboursé par la Sécurité sociale, la couronne peut l'être en partie.", "ortho": "Le Dr Hugon de Scoeux, orthodontiste, traite enfants, ados et adultes : bagues, aligneurs Invisalign®, Quad-Hélix. Premier rendez-vous : 23 €. Avant 16 ans, remboursement après accord préalable.", "enfant": "Première visite vers 3 ou 4 ans, plus tôt en cas de souci. La Dr Panozzo est formée en dentisterie pédiatrique et en sédation, la Dr Bramardi aux soins sous MEOPA. L'examen M'T dents est pris en charge.", "blanc": "Le blanchiment se fait avec des gouttières fabriquées au cabinet, après un contrôle et un détartrage. Il fait gagner jusqu'à quatre teintes. Il est réservé aux plus de 18 ans et n'est pas remboursé.", "facettes": "Les facettes sont de fines coques en céramique ou composite collées sur la face visible des dents. Elles durent 10 à 15 ans. La Dr Lespinard s'est formée aux facettes.", "detartrage": "Un détartrage se fait en une séance, aux ultrasons, suivi d'un polissage. Le cabinet conseille un contrôle tous les six mois. C'est remboursé.", "carie": "Une douleur peut être une carie, mais aussi un abcès ou les gencives. Prenez rendez-vous rapidement. Une petite carie se soigne au composite ; plus grande, avec un inlay ou une couronne.", "sagesse": "Les dents de sagesse s'extraient au cabinet, sous anesthésie locale, après une radio panoramique. L'extraction est remboursée.", "gencives": "Des gencives qui saignent, c'est souvent une gingivite. Les Drs Sekkat, Badoures et Moreau sont formés en parodontologie. Détartrage et surfaçage d'abord, chirurgie si besoin.", "enceinte": "Oui, vous pouvez être soignée pendant la grossesse. Un examen de prévention est pris en charge dès le 4e mois. Pour les soins plus lourds, on demande l'avis de votre obstétricien.", "cerec": "Le cabinet a une usineuse CEREC® : quand c'est possible, votre couronne ou votre inlay est fabriqué sous vos yeux et posé environ une heure après le début du rendez-vous.", "equipe": "Dix praticiens : Drs Sekkat, Badoures, Beugnet, Moreau, Gouchet, Panozzo, Bramardi, Lespinard, Lignères et Hugon de Scoeux. Voyez la section L'équipe pour leurs formations.", "job": "Le cabinet recrute régulièrement. Passez par la page Nous rejoindre pour envoyer votre candidature.", "langues": "Je n'ai pas l'information sur les langues parlées par chaque praticien. Le mieux est de demander au 05 87 14 06 17.", "fallback": "Je n'ai pas la réponse à cette question, et je préfère ne pas vous dire de bêtise. Le cabinet vous répondra au 05 87 14 06 17 ou à bonjour@cabinet-dentaire-toulouse-fermat.fr.", "merci": "Avec plaisir. Bonne journée, et à bientôt au cabinet.", "peur": "C'est fréquent, et l'équipe en a l'habitude. La Dr Panozzo est formée à la sédation consciente, la Dr Bramardi et la Dr Sekkat aux soins sous MEOPA (gaz relaxant). Dites-le en prenant rendez-vous : on prend le temps."}, "legal": {"edit": "Éditeur : Cabinet dentaire Pierre de Fermat, SELAS au capital de 1 020 €, 6 rue Joseph-Lakanal, 31000 Toulouse. SIREN 988 229 043. Présidente : Dr Samia Sekkat. E-mail : bonjour@cabinet-dentaire-toulouse-fermat.fr.", "host": "Hébergement : o2switch, 222-224 boulevard Gustave-Flaubert, 63000 Clermont-Ferrand.", "repro": "Tous les textes, photos et contenus du site sont protégés : aucune reproduction sans l'accord de l'éditeur.", "data": "Les informations envoyées par les formulaires servent uniquement à répondre à vos demandes et au suivi des patients. Elles sont conservées deux ans. Vous pouvez y accéder, les corriger ou les faire supprimer en écrivant à bonjour@cabinet-dentaire-toulouse-fermat.fr. Liste d'opposition au démarchage : bloctel.gouv.fr.", "conf1": "Responsable du traitement : Cabinet dentaire Pierre de Fermat, SELAS, 6 rue Joseph-Lakanal, Toulouse.", "conf2": "Données collectées : identité, e-mail, téléphone, message, code postal, échanges, et données techniques de connexion (domaine, adresse IP).", "conf3": "Elles servent à répondre à vos demandes et à organiser vos rendez-vous ; elles ne sont jamais vendues.", "conf4": "Vous disposez d'un droit d'accès, de rectification, d'effacement et d'opposition, à exercer par e-mail."}}, "en": {"ui": {"lang_name": "English", "nav_soins": "Treatments", "nav_urg": "Emergencies", "nav_ortho": "Orthodontics", "nav_cab": "The practice", "nav_equipe": "The team", "nav_blog": "Blog", "nav_contact": "Contact", "nav_join": "Join us", "nav_adv": "Fermat Conseil", "cta_rdv": "Book an appointment", "cta_rdv_short": "Appointment", "cta_call": "Call the practice", "cta_doctolib": "Book on Doctolib", "cta_soin": "See the treatment page", "hero_t": "Your dentists in the heart of Toulouse, opposite the Pierre-de-Fermat school.", "hero_p": "Ten dentists under one roof, in a brand-new practice a short walk from the Capitole: everyday care, implants, orthodontics, cosmetic dentistry. And a crown made on site, within the hour, whenever possible.", "hero_open": "Open now", "hero_closed": "Closed at the moment", "hero_hours": "Monday to Friday, 8:30 am – 7:30 pm", "m1": "Take one patient, in Toulouse.", "m2": "Hypothesis: they are in pain, or dream of a lovelier smile.", "m3": "Now: ten dentists, five days a week, right by Capitole metro.", "m4": "Therefore: an appointment, with no detours.", "qed": "QED", "metro": "Metro line A · Capitole", "tiers": "Direct billing to social security (tiers payant)", "demo_t": "Your own demonstration", "demo_p": "Choose your situation. The page writes out the treatment for you, the dentists trained to do it and the steps to follow.", "demo_hyp": "Hypothesis", "demo_or": "Now", "demo_donc": "Therefore", "demo_avec": "With", "demo_rb": "Reimbursement", "demo_pick": "Choose a situation on the left to begin.", "piliers_t": "What we treat, from the first tooth to the last", "p1_t": "Orthodontics and invisible aligners", "p1_p": "Child, teenager or adult: ceramic braces, Invisalign®, Quad-Hélix. And no, orthodontics is not only for children.", "p2_t": "Teeth whitening", "p2_p": "Up to four shades whiter, under the supervision of trained dentists. Coffee, tea, wine, tobacco: the stains fade away.", "p3_t": "Dental implants", "p3_p": "A titanium root in the bone, a crown on top: a missing tooth can be replaced, and you soon forget about it.", "p4_t": "Prevention and check-ups", "p4_p": "A check-up every six months, a scale and polish, advice tailored to you: the best treatment is the one you avoid.", "tech_t": "The workshop behind the chair", "tech_p": "The practice is equipped to make an accurate diagnosis and spare you extra trips.", "t_cerec": "CEREC®: crowns and inlays milled on site, within the hour", "t_scan": "TRIOS 3 3D intraoral scanner: no more impression paste", "t_radio": "Panoramic X-ray, cephalometric X-ray and 3D cone beam scanner", "t_ster": "Dedicated sterilisation room", "t_print": "3D printer for splints made in the practice", "equipe_t": "Ten dentists, one shared standard", "equipe_p": "General dentists, an orthodontist, a paediatric dentist, implant and gum specialists: each with their own training, all trained in Toulouse or further afield.", "f_all": "All", "f_impl": "Implants", "f_ortho": "Orthodontics", "f_paro": "Gums", "f_ped": "Children and sedation", "f_esth": "Cosmetic", "f_gen": "General care", "acces_t": "Rue Joseph-Lakanal, in the heart of the pink city", "acces_p": "The practice is opposite the Pierre-de-Fermat school, a short walk from place du Capitole and place Saint-Pierre. Metro line A, Capitole station.", "adr_l": "Address", "tel_l": "Phone", "mail_l": "E-mail", "hor_l": "Opening hours", "hor_v": "Monday – Friday: 8:30 am – 7:30 pm\nSaturday and Sunday: closed", "hor_note": "Opening hours and street number to be confirmed with the practice (they vary from one page to another on the current website).", "carte_open": "Open directions", "faq_t": "Your questions, our answers", "blog_t": "The practice notebook", "blog_p": "Fourteen articles to help you understand before you visit.", "blog_all": "The whole notebook", "read": "Read the article", "soins_t": "All our treatments", "soins_p": "Twenty-six pages, sorted the way you would look for them.", "fam_all": "See all", "fam_quot": "Everyday care", "fam_esth": "Cosmetic", "fam_rempl": "Replace a tooth", "fam_genc": "Gums", "fam_ortho": "Orthodontics", "enbref": "In brief", "back_soins": "All treatments", "back_blog": "The whole notebook", "rb_l": "Reimbursement", "who_l": "Trained dentists", "urg_t": "A dental emergency?", "urg_p": "Severe pain, abscess, a fall, a broken tooth: the team will see you as soon as possible. Patients already followed at the practice are usually seen the same day. Others are seen depending on available slots.", "urg_garde_t": "Sundays and public holidays", "urg_garde_p": "An on-call service is organised by the Conseil de l'Ordre des chirurgiens-dentistes de la Haute-Garonne (the local dental association). If your life is in danger, dial 15.", "urg_garde_note": "The current website says to call the dispatch line on 05 87 14 06 17, which is the practice's own number: on-call number to be confirmed with the practice.", "urg_sit_t": "Situations we can help with", "urg_s1": "Intense or persistent toothache", "urg_s2": "Infection: abscess, infected gum", "urg_s3": "Knock or injury: broken or knocked-out tooth", "urg_s4": "Pain after a wisdom tooth extraction", "urg_s5": "A lost filling or crown", "urg_causes_t": "The most common causes", "urg_c1": "Dental abscess: pus around the root or in the gum. Throbbing pain, a swollen cheek, sometimes a fever.", "urg_c2": "Gingivitis and periodontitis: red, swollen gums that bleed when you brush.", "urg_c3": "Pericoronitis: an infection around a wisdom tooth that is coming in badly.", "urg_c4": "Pulpitis: the nerve of the tooth is inflamed, and the pain wakes you at night.", "urg_c5": "Dry socket: an infection of the socket after an extraction.", "urg_quoi_t": "While you wait for your appointment", "urg_q1": "Knocked-out tooth: hold it by the crown, keep it in milk or in your mouth, and come straight away.", "urg_q2": "Pain: take a suitable painkiller, never put aspirin on the gum, and do not apply heat to the cheek.", "urg_q3": "Swollen cheek or fever: call without delay.", "urg_hor": "Emergencies are seen on weekdays, during opening hours.", "ortho_t": "Orthodontics in Toulouse: a straight smile, at any age", "ortho_p": "Dr Hugon de Scoeux adapts the treatment to each person: traditional or ceramic braces, Invisalign® aligners, Quad-Hélix for the youngest.", "ortho_tarifs_t": "Fees and reimbursements", "ortho_tar1": "First appointment: €23. Diagnosis, assessment and a detailed quote.", "ortho_tar2": "Under 16, with prior approval from the French national health insurance (Assurance maladie): reimbursement base of €193.50 per six-month period, up to six periods.", "ortho_tar3": "Retainer after treatment: usually €100 to €800 per year, depending on the technique (wire or splint).", "ortho_tar4": "Adults: usually not reimbursed by social security. Your top-up health insurance (mutuelle) may cover a share.", "ortho_ages_t": "Three ages, three approaches", "cab_t": "A practice designed to make you forget you are going \"to the dentist\"", "cab_p": "Modern equipment, carefully chosen furniture, soft lighting: the Pierre de Fermat practice was imagined to welcome you in a warm setting and give you quality dentistry in the very centre of Toulouse.", "cab_l1": "A multidisciplinary team: implants, orthodontics, cosmetic dentistry, gums, children.", "cab_l2": "Tailor-made treatment plans, designed to last.", "cab_l3": "The latest technology, for your comfort.", "cab_l4": "Direct billing to social security: remember your Carte Vitale.", "contact_t": "Write to us, call us, visit us", "contact_p": "The quickest way: Doctolib, at any hour. Otherwise, a call or a message, and the team will get back to you.", "form_nom": "Full name", "form_mail": "E-mail", "form_tel": "Phone", "form_msg": "Your message", "form_send": "Send the message", "form_ok": "Thank you, your message is ready. In the final version, it will go straight to the front desk.", "form_err": "Please give your name and either an e-mail or a phone number.", "join_t": "Join the team", "join_p": "The practice is always looking for motivated people who like working with modern equipment and putting people first. Assistant, dentist, receptionist: tell us about yourself.", "join_poste": "Position", "join_p1": "Dentist", "join_p2": "Orthodontist", "join_p3": "Dental assistant", "join_p4": "Medical secretary", "join_p5": "Other", "join_cv": "Your CV (PDF)", "join_send": "Send my application", "leg_t": "Legal notice", "conf_t": "Privacy policy", "foot_tag": "Pierre de Fermat Dental Practice · SELAS · Toulouse", "foot_soc": "Book an appointment online", "foot_proto": "Redesign proposal by Neovera Studio. Content taken from the practice's current website.", "adv_btn": "Let me help you choose", "adv_hello": "Hello, I am Fermat Conseil, the practice's virtual assistant. I can answer questions about treatments, opening hours, how to get here, emergencies and reimbursements.", "adv_tag": "Virtual assistant", "adv_ph": "Ask your question…", "adv_send": "Send", "adv_invite": "A question about a treatment or an appointment? I will point you the right way.", "adv_close": "Close", "q_rdv": "Book an appointment", "q_urg": "I am in pain, it is urgent", "q_rb": "Reimbursements", "q_acces": "Getting to the practice", "q_ortho": "Orthodontics", "q_impl": "Implant", "lang_l": "Language", "menu_l": "Main menu", "skip": "Skip to content", "illus": "Illustration from the current website", "minutes": "min read", "art_more": "To find out more, talk to the practice at your next appointment.", "not_found": "This page does not exist. Head back to the home page."}, "soins": {"gouttieres": {"t": "Dental splints", "s": "Who are they for? What are they for?", "p": "A splint is a removable, custom-made appliance, based on a digital impression of your teeth. It protects, whitens or aligns.", "k": ["Teeth grinding (bruxism): an occlusal splint protects teeth that grind at night and eases the jaw.", "Orthodontics: clear aligners gently move the teeth.", "Retainer: worn at night after treatment, it keeps the result.", "Sport: a mouthguard prevents broken teeth from knocks."], "r": "Coverage varies depending on the use: the practice will give you a quote."}, "invisalign": {"t": "Invisalign®", "s": "Discreet orthodontics", "p": "Clear, 3D-printed aligners that straighten teeth with no wires or brackets. For adults, teenagers and some children.", "k": ["Discreet, comfortable, easy to clean, and removed for meals.", "First consultation: your expectations and an examination to see whether the treatment suits you.", "Assessment: side-view X-ray, 3D impressions, then a treatment plan simulated in 3D and a detailed quote.", "Invisalign® certified dentists at the practice."], "r": "Price set after the assessment, with a quote given before any commitment."}, "caries": {"t": "Cavities", "s": "A healthy mouth, free of decay", "p": "A cavity is the destruction of the tooth by the bacteria in plaque. Caught early, it is simple to treat. Left alone, it reaches the nerve.", "k": ["Four stages: demineralisation, enamel decay, deep decay, infection of the pulp.", "Small cavity: a tooth-coloured composite filling.", "Larger one: a ceramic inlay or onlay, or a crown if the tooth is badly damaged.", "Prevention: brushing, less sugar in your diet, a scale and polish at least once a year."], "r": "Routine care: 70% reimbursed by the French national health insurance (Assurance maladie), the rest by your top-up health insurance (mutuelle)."}, "detartrage": {"t": "Scale and polish", "s": "Smooth teeth, a clean smile", "p": "Tartar is plaque that has hardened: your toothbrush can no longer remove it. A scale and polish removes it in one visit, without pain.", "k": ["Ultrasound to loosen tartar, even in hard-to-reach areas.", "Polishing for smooth surfaces where plaque sticks less.", "At least once a year, more often for smokers or people with diabetes.", "Root planing if tartar has gone below the gum."], "r": "Reimbursed by national health insurance and your mutuelle."}, "blanchiment": {"t": "Teeth whitening", "s": "Brightness restored, in a few weeks", "p": "Over time, coffee, tea, wine and tobacco dull the teeth, and the enamel thins. Whitening gives you several shades of white back.", "k": ["Initial consultation: we check for cavities, gums, sensitivity and pregnancy.", "Scale and polish, air polishing, photos before treatment.", "3D impression and trays made in the practice, given to you with the product.", "For over-18s only (carbamide peroxide, European rule)."], "r": "Cosmetic treatment, not reimbursed: price and duration explained at the consultation."}, "devitalisation": {"t": "Root canal treatment", "s": "Save the tooth rather than pull it", "p": "When a deep cavity or a knock reaches the nerve, we remove the pulp, clean the canals and seal them. The tooth is kept.", "k": ["X-rays to decide on the treatment.", "Local anaesthetic: the treatment is painless.", "Cleaning, disinfection and filling of the canals.", "Rebuilding: a crown, inlay or onlay depending on the state of the tooth."], "r": "Routine care: 70% reimbursed by national health insurance, the rest by your mutuelle."}, "facettes": {"t": "Dental veneers", "s": "A new smile, no compromise", "p": "A thin shell of ceramic or composite bonded to the visible surface of the tooth: colour, shape and small flaws are corrected.", "k": ["For shades that resist whitening, and for short or damaged teeth.", "Very minimally invasive: only a thin layer of enamel is prepared.", "Optical impressions, custom veneers, then bonding and polishing.", "They last 10 to 15 years with good hygiene."], "r": "Cosmetic treatment: a quote is given at the first consultation."}, "implants": {"t": "Dental implants", "s": "The comfort of a natural tooth", "p": "An artificial titanium root placed in the bone, then a ceramic crown. For one tooth, several, or a whole arch.", "k": ["A crown on an implant, a bridge on implants, or a fixed palate-free denture on 4 or 6 implants (All-on X®).", "Success rates often above 95% over several years.", "After a knock, gum-related loss, a missing tooth from birth or a tooth that cannot be saved.", "Alternatives: a bridge, a bonded bridge, or a partial or full removable denture."], "r": "Implants are not reimbursed by social security. The crown may be partly covered. We provide a quote for your mutuelle."}, "couronnes": {"t": "Crowns", "s": "A strengthened tooth that stays natural", "p": "A crown fully covers a damaged tooth to restore its shape, strength and colour. In Emax ceramic or zirconia.", "k": ["Clinical examination and X-ray, with a quote for your mutuelle.", "Tooth preparation, 3D optical impression.", "Whenever possible, the crown is milled in front of you by the CEREC: you leave with it one hour after your appointment begins.", "Lifespan: 10 to 20 years if well looked after."], "r": "Partly covered by national health insurance depending on the material. We provide a quote for your mutuelle."}, "inlay": {"t": "Inlay, onlay, overlay", "s": "Repair without drilling away too much", "p": "A custom-made ceramic or zirconia piece, produced by the practice's milling machine, that fills the cavity of a moderately damaged tooth.", "k": ["Inlay: sits inside the tooth. Onlay: covers part of the surface. Overlay: covers the whole surface.", "Keeps more of your tooth than a crown.", "Ceramic: strong and tooth-coloured.", "Made in the practice, often in a single visit."], "r": "Partly covered depending on the case. A quote is given before treatment."}, "sagesse": {"t": "Wisdom teeth", "s": "For a healthy mouth", "p": "Third molars come in between the ages of 16 and 20. If badly placed, they hurt, become infected or push the other teeth.", "k": ["Consultation with a panoramic X-ray before any decision.", "Extraction under local anaesthetic, in the practice.", "Afterwards: pain and swelling kept under control, with written advice.", "The practice is a short walk from the Capitole."], "r": "Extraction reimbursed by national health insurance and your mutuelle."}, "greffe": {"t": "Gum graft", "s": "When the gum recedes", "p": "Brushing too hard can make the gum recede: the root is exposed and the tooth becomes sensitive. A graft covers it again.", "k": ["Protects the root and slows gum recession.", "Strengthens a gum that is too thin.", "Improves the look of your smile.", "Follow-up after the procedure and brushing advice."], "r": "Little reimbursement for this procedure: a quote is given before it."}, "bridge": {"t": "Dental bridge", "s": "A bridge between two teeth", "p": "A fixed prosthesis that replaces one or more teeth by resting on the neighbouring teeth.", "k": ["A single-unit bridge for one tooth, a full bridge for several.", "In ceramic for a natural look.", "Comfortable, effective chewing restored.", "Digital impressions, a fitting, then placement."], "r": "Partly covered by national health insurance. We provide a quote for your mutuelle."}, "conservateurs": {"t": "Conservative care", "s": "Keep your teeth for as long as possible", "p": "Treating the tooth while keeping as much healthy tissue as possible, to avoid extraction.", "k": ["Cavity treatment with composite.", "Ceramic inlays and onlays.", "Scale and polish and preventive care.", "Endodontic treatment (root canal)."], "r": "Routine care reimbursed at 70% by national health insurance."}, "restauration": {"t": "Smile restoration", "s": "Brightness and confidence restored", "p": "Several techniques can be combined to improve your smile without major intervention.", "k": ["All-ceramic crowns: attractive and strong.", "Veneers: a transformed smile in a few visits.", "Invisible splints: realign discreetly.", "Whitening, inlays and onlays, and treatment of bite problems."], "r": "Depends on the treatments chosen: a detailed quote is given at the consultation."}, "titane": {"t": "Titanium implants", "s": "A reliable, lasting solution", "p": "Titanium has been the reference material in implant dentistry since the 1980s: the bone accepts it and fuses with it.", "k": ["An assessment of your needs with our dentists.", "Placement of the implant, then osseointegration (the bone fuses with the titanium).", "Healing screw, then the prosthetic restoration.", "Grade 4 or 5 titanium, the same as used in orthopaedics."], "r": "Implants are not reimbursed by social security. We provide a quote for your mutuelle."}, "manquante": {"t": "Replacing a missing tooth", "s": "Three solutions, one right choice", "p": "A missing tooth lets its neighbours drift, makes the bone shrink and gets in the way of eating and speaking. It can be replaced.", "k": ["The implant: the lasting solution.", "The bridge: an effective fixed alternative.", "The removable denture: temporary or permanent.", "The choice is made together, based on the bone, the neighbouring teeth and your budget."], "r": "Depends on the solution: a comparative quote is given at the consultation."}, "paro": {"t": "Periodontology", "s": "Caring for what holds your teeth in place", "p": "Gum, ligament, cementum and bone: when they become inflamed, teeth loosen. Periodontology treats them.", "k": ["Signs: bleeding or red gums, bad breath, loose teeth.", "Scale and polish and root planing.", "Advanced surgical treatment if needed.", "Prevention and hygiene tailored to keep results lasting."], "r": "Part of the procedures is reimbursed. We provide a quote for the rest."}, "prevention": {"t": "Dental prevention", "s": "The best treatment is the one you avoid", "p": "Cavities, gum disease: most can be avoided. The team supports you in keeping a healthy mouth.", "k": ["Brushing with a suitable brush, flossing and mouthwash.", "Regular check-ups and scale and polish.", "Advice and hygiene education, from childhood.", "The M'T dents programme from national health insurance for children and young people."], "r": "Check-up consultations reimbursed. M'T dents is covered at 100%."}, "premiers-rdv": {"t": "First orthodontic appointments", "s": "Your concern becomes ours", "p": "A dentist, a doctor or you yourself have noticed an alignment issue. It all starts with two appointments.", "k": ["First consultation: we get to know you, listen to your expectations and examine you.", "Assessment appointment: 3D scan, photos, cephalometric X-ray.", "Treatment plan and quote explained step by step.", "First appointment: €23."], "r": "Under 16, reimbursement after prior approval from national health insurance."}, "technologies": {"t": "Orthodontic technology", "s": "Precise diagnosis, comfortable treatment", "p": "The practice is equipped to spare you impression paste and extra trips.", "k": ["TRIOS 3 (3Shape) 3D intraoral scanner: impressions in a few minutes.", "Digital panoramic X-ray and cephalometric X-ray.", "Dedicated sterilisation room.", "3D printer for appliances and splints."], "r": ""}, "ortho-adulte": {"t": "Adult orthodontics", "s": "Your best smile, at any age", "p": "Age is no obstacle as long as the gums and bone are healthy. Appliances have become discreet.", "k": ["Clear aligners: attractive and removable.", "Ceramic braces: the colour of the tooth.", "Pre-prosthetic orthodontics to prepare for implants or crowns.", "Combined with surgery for large jaw discrepancies."], "r": "Usually not reimbursed for adults. Your mutuelle may contribute."}, "ortho-ado": {"t": "Teen orthodontics", "s": "The right time to act", "p": "In the teenage years, all the permanent teeth are in and growth is still helping: it is the ideal moment.", "k": ["Multi-bracket appliances (braces).", "Clear aligners.", "Extraction of permanent teeth if necessary.", "Acting before growth ends to correct jaw discrepancies."], "r": "Under 16: reimbursement after prior approval (base of €193.50 per six-month period)."}, "ortho-enfant": {"t": "Children's orthodontics", "s": "Guiding growth", "p": "Some imbalances appear early and interfere with chewing, swallowing or breathing. We can step in early.", "k": ["Correcting discrepancies between the jaws.", "Palate expansion (Quad-Hélix).", "Repositioning teeth that stick out too far.", "Correcting bad habits: thumb, tongue."], "r": "Reimbursement after prior approval from national health insurance."}}, "arts": {"adulte": {"t": "Orthodontics is for adults too", "s": "More and more adults are improving their smile and dental health with discreet appliances.", "k": ["Crowding and misalignment get worse with age.", "Metal or ceramic braces, Invisalign® aligners, splints, surgery if needed.", "A full diagnosis before choosing the appliance."]}, "implant": {"t": "What is a dental implant and how does it work?", "s": "A titanium screw that replaces the root of a missing tooth, placed under local anaesthetic.", "k": ["Consultation and diagnosis, then the surgical procedure.", "Precise placement of the titanium screw, with a few months of healing.", "Benefits, risks and contraindications explained before you decide."]}, "infection": {"t": "What are the symptoms of a dental infection?", "s": "Throbbing pain, a swollen gum, a bad taste: learn to spot an infection and act fast.", "k": ["Signs: pain, sensitivity, abscess, fever, swollen cheek.", "Causes: deep cavity, knock, gum disease, wisdom tooth.", "Left untreated, the infection can spread: see someone quickly."]}, "gencives": {"t": "How can you prevent gum disease?", "s": "Gingivitis and periodontitis often creep in silently. Here is how to stop them.", "k": ["Gingivitis is reversible, periodontitis destroys the bone.", "Careful hygiene, diet, regular check-ups.", "Bleeding or receding gums: it is time to see someone."]}, "caries": {"t": "What causes cavities and how can you prevent them?", "s": "Bacteria, sugar and time: understand decay to avoid it.", "k": ["Bacteria in plaque attack the enamel, then the dentine.", "Brushing, flossing, less sugar, regular scale and polish.", "A cavity treated early avoids a root canal."]}, "frequence": {"t": "How often should you see the dentist?", "s": "Children, adults, older people: the right rhythm depends on your age and history.", "k": ["Generally a check-up every six months.", "More often for smokers, people with diabetes or anyone wearing an appliance.", "Regular visits help you avoid major treatment."]}, "ortho-bienfaits": {"t": "Orthodontics is about more than straightening teeth", "s": "Chewing, breathing, jaw movement: the lesser-known benefits.", "k": ["Corrects bite problems that make eating or breathing harder.", "Possible at any age.", "Duration and cost explained at the assessment."]}, "brossage": {"t": "How do you brush your teeth properly?", "s": "Brush, toothpaste, technique, duration: the complete guide.", "k": ["Two minutes, twice a day, a soft brush replaced every three months.", "Fluoride toothpaste, with floss or interdental brushes as well.", "The mistakes to avoid, and advice for younger ones."]}, "rembourse": {"t": "Is orthodontics reimbursed?", "s": "Social security, top-up insurance, children, adults: who pays what.", "k": ["Under 16: 70% of the standard rate after prior approval.", "Adults: rarely reimbursed, except in surgical cases.", "Your mutuelle tops it up depending on your policy: ask for a quote."]}, "ronfler": {"t": "How can you sleep without snoring?", "s": "One adult in four snores. A dentist can help.", "k": ["Sleep on your side, lose weight, cut down on alcohol and tobacco.", "A mandibular advancement device, worn at night, opens the airways.", "If the snoring continues: see an ENT doctor."]}, "mtdents": {"t": "The M'T dents check-up", "s": "The preventive appointment offered by national health insurance.", "k": ["Every year from age 3 since 2025, gradually extended up to age 28 by 2028.", "A dedicated check-up for pregnant women from the 4th month.", "An invitation arrives by post, and is also available on ameli.fr."]}, "gouttieres": {"t": "Dental splints: who are they for? What are they for?", "s": "Teeth grinding, whitening, alignment, sport: one splint, several uses.", "k": ["Custom-made from a digital impression.", "Worn by day or by night depending on the prescription.", "Easy to care for, with lifespan and cost explained at the practice."]}, "role-ortho": {"t": "What does an orthodontist do?", "s": "The specialist in misplaced teeth and jaws, for children and adults alike.", "k": ["Diagnosis, prevention and treatment of bite problems.", "When to see one: overlapping teeth, misaligned jaws, difficulty chewing.", "Treatment lasts 12 to 36 months, followed by a retainer."]}, "cout-implant": {"t": "What is the average cost of an implant?", "s": "What the price includes, and how to get reimbursed.", "k": ["The price includes the implant, the abutment and the crown.", "The implant is not reimbursed. The crown may be partly covered.", "Send the quote to your mutuelle before the procedure."]}}, "faq": [["Is there a difference between a dentist and a dental surgeon?", "None. All dentists earn the title of doctor of dental surgery. Some simply choose not to practise surgery."], ["At what age should I bring my child to the dentist?", "In theory, as soon as the first teeth appear. In practice, around 3 or 4 years old. Earlier if anything worries you."], ["Do you take dental emergencies?", "Yes. Patients already followed at the practice are usually seen the same day. Others are seen depending on available slots."], ["My tooth hurts. Is it a cavity?", "Maybe. Pain can also come from an abscess, a wisdom tooth or the gums. Book an appointment: a quick consultation will relieve you as soon as possible."], ["How will I be reimbursed?", "Consultations and routine care (scale and polish, cavities, root canals, extractions) are reimbursed at 70% by the French national health insurance (Assurance maladie), and the rest is usually covered by your top-up health insurance (mutuelle). For other treatments, we give you a quote."], ["What happens at the first visit?", "We get to know you, examine your mouth, take X-rays if needed, and talk about your expectations. If treatment is useful, we offer you a plan explained step by step."], ["How often should I come?", "A check-up every six months: a clinical and X-ray examination, and a clean if needed. More often depending on your situation."], ["Can I be treated if I am pregnant?", "Yes. Gums are more sensitive during pregnancy, so hygiene matters even more. For some heavier treatments, we ask your obstetrician for their opinion."], ["What technology do you use?", "3D imaging and intraoral scanners, digital impressions with no paste, dental laser, Invisalign® aligners, guided implant surgery, and crowns or inlays milled on site within the hour thanks to CEREC®."]], "team_roles": {"sekkat": "Practice president · gums, cosmetic dentistry, orthodontics", "badoures": "Implants, gums, CAD/CAM", "beugnet": "Dentist", "moreau": "Implants and bone surgery, gums", "gouchet": "Dentist", "panozzo": "Paediatric dentistry and sedation", "bramardi": "Treatment under sedation (MEOPA)", "lespinard": "Tooth wear, implants, veneers", "lignieres": "Dentist", "hugon": "Orthodontics, aligners"}, "demo": {"mal": {"h": "My tooth hurts", "or": "Pain can come from a cavity, an abscess, the gums or a wisdom tooth.", "donc": "A quick consultation to find the cause and relieve you.", "rb": "Consultation and routine care reimbursed at 70%, the rest by your mutuelle.", "soin": "urgences"}, "casse": {"h": "A tooth has broken or fallen out", "or": "After a knock, every hour counts, especially if the tooth is knocked out.", "donc": "Keep the tooth in milk and call the practice straight away.", "rb": "Emergency care reimbursed like routine care.", "soin": "urgences"}, "controle": {"h": "I want a check-up or a scale and polish", "or": "Tartar does not come off with brushing, and an early cavity does not hurt.", "donc": "A check-up with a scale and polish, every six months.", "rb": "Reimbursed by national health insurance and your mutuelle.", "soin": "detartrage"}, "enfant": {"h": "My child's teeth are misaligned", "or": "Before growth ends, we can guide the jaws.", "donc": "A first orthodontic appointment (€23) and an assessment.", "rb": "Under 16, reimbursed after prior approval (base of €193.50 per six-month period).", "soin": "ortho-enfant"}, "aligner": {"h": "I would like straight teeth (adult)", "or": "Orthodontics has no age limit, and appliances have become discreet.", "donc": "Invisalign® aligners or ceramic braces, after a 3D assessment.", "rb": "Usually not reimbursed for adults. Your mutuelle may contribute.", "soin": "invisalign"}, "manque": {"h": "I am missing a tooth", "or": "A missing tooth lets its neighbours drift and makes the bone shrink.", "donc": "Implant, bridge or denture: we choose together.", "rb": "Implant not reimbursed, crown partly covered. We provide a quote for your mutuelle.", "soin": "manquante"}, "blanc": {"h": "I would like whiter teeth", "or": "Coffee, tea, tobacco and age dull the enamel.", "donc": "Whitening with trays made in the practice, or veneers if the shade resists.", "rb": "Cosmetic treatment, not reimbursed, for over-18s only.", "soin": "blanchiment"}, "saigne": {"h": "My gums bleed", "or": "It is often gingivitis: reversible if caught early.", "donc": "A gum assessment, with a scale and polish and root planing if needed.", "rb": "Part of the procedures is reimbursed.", "soin": "paro"}, "sagesse": {"h": "My wisdom teeth are bothering me", "or": "If badly placed, they become infected or push the other teeth.", "donc": "A panoramic X-ray, then extraction in the practice if necessary.", "rb": "Extraction reimbursed by national health insurance.", "soin": "sagesse"}, "enceinte": {"h": "I am pregnant", "or": "Gums are more sensitive during pregnancy.", "donc": "A check-up is advised. Most treatments are possible.", "rb": "A dedicated preventive check-up is covered from the 4th month.", "soin": "prevention"}, "grince": {"h": "I grind my teeth at night", "or": "Grinding (bruxism) wears down the teeth and tires the jaw.", "donc": "A custom-made occlusal splint.", "rb": "Coverage varies: a quote is given.", "soin": "gouttieres"}}, "adv": {"rdv": "The simplest way: book on Doctolib, at any hour. You can also call 05 87 14 06 17 on weekdays.", "horaires": "The practice is open Monday to Friday, from 8:30 am to 7:30 pm. It is closed at the weekend. (Opening hours to be confirmed with the practice.)", "acces": "Rue Joseph-Lakanal, in Toulouse, opposite the Pierre-de-Fermat school. Metro line A, Capitole station, a short walk from place du Capitole and place Saint-Pierre.", "parking": "I do not have any information on parking near the practice. The easiest way is metro line A, Capitole station, or you can call 05 87 14 06 17.", "urgence": "On weekdays, call 05 87 14 06 17: the practice's patients are usually seen the same day. On Sundays and public holidays, an on-call dentist is arranged by the dental association in Haute-Garonne. If your life is in danger, dial 15.", "rb": "Consultations and routine care are reimbursed at 70% by the French national health insurance (Assurance maladie), and the rest is usually covered by your top-up health insurance (mutuelle). Direct billing (tiers payant) applies: remember your Carte Vitale. For implants, cosmetic care or adult orthodontics, we give you a quote.", "prix": "The practice's website gives only one price: the first orthodontic appointment at €23. For other treatments, the price depends on your situation: a quote is given at the consultation.", "implant": "An implant replaces the root of a tooth with a titanium screw, then a crown is fitted. At the practice, Drs Badoures, Moreau and Lespinard are trained in implant dentistry. The implant is not reimbursed by social security. The crown may be partly covered.", "ortho": "Dr Hugon de Scoeux, the orthodontist, treats children, teenagers and adults: braces, Invisalign® aligners, Quad-Hélix. First appointment: €23. Under 16, reimbursement after prior approval.", "enfant": "First visit around 3 or 4 years old, earlier if there is a concern. Dr Panozzo is trained in paediatric dentistry and sedation, and Dr Bramardi in treatment under MEOPA. The M'T dents check-up is covered.", "blanc": "Whitening is done with trays made in the practice, after a check-up and a scale and polish. It gives up to four shades whiter. It is for over-18s only and is not reimbursed.", "facettes": "Veneers are thin ceramic or composite shells bonded to the visible surface of the teeth. They last 10 to 15 years. Dr Lespinard has trained in veneers.", "detartrage": "A scale and polish takes one visit, using ultrasound, followed by polishing. The practice recommends a check-up every six months. It is reimbursed.", "carie": "Pain may be a cavity, but also an abscess or the gums. Book an appointment quickly. A small cavity is treated with composite. A larger one, with an inlay or a crown.", "sagesse": "Wisdom teeth are extracted in the practice, under local anaesthetic, after a panoramic X-ray. The extraction is reimbursed.", "gencives": "Bleeding gums are often gingivitis. Drs Sekkat, Badoures and Moreau are trained in periodontology. Scale and polish and root planing first, surgery if needed.", "enceinte": "Yes, you can be treated during pregnancy. A preventive check-up is covered from the 4th month. For heavier treatments, we ask your obstetrician for their opinion.", "cerec": "The practice has a CEREC® milling machine: whenever possible, your crown or inlay is made in front of you and fitted about an hour after the appointment begins.", "equipe": "Ten dentists: Drs Sekkat, Badoures, Beugnet, Moreau, Gouchet, Panozzo, Bramardi, Lespinard, Lignères and Hugon de Scoeux. See The team section for their training.", "job": "The practice recruits regularly. Go to the Join us page to send your application.", "langues": "I do not have information on the languages each dentist speaks. The best thing is to ask on 05 87 14 06 17.", "fallback": "I do not have the answer to that question, and I would rather not tell you something wrong. The practice will reply on 05 87 14 06 17 or at bonjour@cabinet-dentaire-toulouse-fermat.fr.", "merci": "My pleasure. Have a lovely day, and see you soon at the practice.", "peur": "That's common, and the team is used to it. Dr Panozzo is trained in conscious sedation, and Dr Bramardi and Dr Sekkat in care under MEOPA (relaxing gas). Mention it when you book: we'll take our time."}, "legal": {"edit": "Publisher: Cabinet dentaire Pierre de Fermat, SELAS with share capital of €1,020, 6 rue Joseph-Lakanal, 31000 Toulouse. SIREN 988 229 043. President: Dr Samia Sekkat. E-mail: bonjour@cabinet-dentaire-toulouse-fermat.fr.", "host": "Hosting: o2switch, 222-224 boulevard Gustave-Flaubert, 63000 Clermont-Ferrand.", "repro": "All texts, photos and content on the site are protected: no reproduction without the publisher's permission.", "data": "The information sent through the forms is used only to answer your requests and to follow up with patients. It is kept for two years. You can access it, correct it or have it deleted by writing to bonjour@cabinet-dentaire-toulouse-fermat.fr. Do-not-call list: bloctel.gouv.fr.", "conf1": "Data controller: Cabinet dentaire Pierre de Fermat, SELAS, 6 rue Joseph-Lakanal, Toulouse.", "conf2": "Data collected: identity, e-mail, phone, message, postcode, correspondence, and technical connection data (domain, IP address).", "conf3": "It is used to answer your requests and arrange your appointments. It is never sold.", "conf4": "You have the right to access, rectify, erase and object, which you can exercise by e-mail."}}, "es": {"ui": {"lang_name": "Español", "nav_soins": "Tratamientos", "nav_urg": "Urgencias", "nav_ortho": "Ortodoncia", "nav_cab": "La clínica", "nav_equipe": "El equipo", "nav_blog": "Blog", "nav_contact": "Contacto", "nav_join": "Únase al equipo", "nav_adv": "Fermat Conseil", "cta_rdv": "Pedir cita", "cta_rdv_short": "Cita", "cta_call": "Llamar a la clínica", "cta_doctolib": "Reservar en Doctolib", "cta_soin": "Ver la ficha del tratamiento", "hero_t": "Sus dentistas en el corazón de Toulouse, frente al liceo Pierre-de-Fermat.", "hero_p": "Diez profesionales reunidos en una clínica nueva, a dos pasos del Capitole: cuidados del día a día, implantes, ortodoncia, estética. Y una corona fabricada en el propio centro, en una hora, cuando es posible.", "hero_open": "Abierto ahora", "hero_closed": "Cerrado en este momento", "hero_hours": "De lunes a viernes, de 8:30 a 19:30", "m1": "Sea un paciente, en Toulouse.", "m2": "Hipótesis: le duele algo, o sueña con una sonrisa más bonita.", "m3": "Ahora bien: diez dentistas, cinco días a la semana, metro Capitole.", "m4": "Por tanto: una cita, sin rodeos.", "qed": "QED", "metro": "Metro A · Capitole", "tiers": "Tercero pagador con la Seguridad Social", "demo_t": "Su demostración", "demo_p": "Elija su situación: la página redacta para usted el tratamiento, los profesionales formados para realizarlo y los pasos a seguir.", "demo_hyp": "Hipótesis", "demo_or": "Ahora bien", "demo_donc": "Por tanto", "demo_avec": "Con", "demo_rb": "Reembolso", "demo_pick": "Elija una situación a la izquierda para empezar.", "piliers_t": "Lo que tratamos, desde el primer diente hasta el último", "p1_t": "Ortodoncia y alineadores invisibles", "p1_p": "Niños, adolescentes o adultos: brackets cerámicos, Invisalign®, Quad-Hélix. No, la ortodoncia no es solo para niños.", "p2_t": "Blanqueamiento dental", "p2_p": "Hasta cuatro tonos más blancos, bajo la supervisión de dentistas formados. Café, té, vino, tabaco: las manchas desaparecen.", "p3_t": "Implantes dentales", "p3_p": "Una raíz de titanio en el hueso y una corona encima: el diente que falta se sustituye y usted se olvida de él.", "p4_t": "Prevención y revisión", "p4_p": "Una revisión cada seis meses, una limpieza y consejos para usted: el mejor tratamiento es el que se evita.", "tech_t": "El taller detrás del sillón", "tech_p": "La clínica se ha equipado para hacer un diagnóstico acertado y ahorrarle idas y venidas.", "t_cerec": "CEREC®: coronas e inlays fabricados en el centro, en una hora", "t_scan": "Escáner intraoral 3D TRIOS 3: se acabó la pasta de impresión", "t_radio": "Radiografía panorámica, telerradiografía y escáner 3D cone beam", "t_ster": "Sala de esterilización exclusiva", "t_print": "Impresora 3D para las férulas fabricadas en la clínica", "equipe_t": "Diez profesionales, una misma exigencia", "equipe_p": "Odontólogos generales, ortodoncista, odontopediatra, especialistas en implantes y encías: cada uno con su formación, todos formados en Toulouse o fuera de ella.", "f_all": "Todos", "f_impl": "Implantes", "f_ortho": "Ortodoncia", "f_paro": "Encías", "f_ped": "Niños y sedación", "f_esth": "Estética", "f_gen": "Cuidados generales", "acces_t": "Rue Joseph-Lakanal, en el corazón de la ciudad rosa", "acces_p": "La clínica está frente al liceo Pierre-de-Fermat, a dos pasos de la plaza del Capitole y de la plaza Saint-Pierre. Metro línea A, estación Capitole.", "adr_l": "Dirección", "tel_l": "Teléfono", "mail_l": "Correo electrónico", "hor_l": "Horario", "hor_v": "Lunes a viernes: 8:30 – 19:30\nSábado y domingo: cerrado", "hor_note": "Horario y número de la calle por confirmar con la clínica (varían de una página a otra del sitio web actual).", "carte_open": "Abrir el itinerario", "faq_t": "Sus preguntas, nuestras respuestas", "blog_t": "El cuaderno de la clínica", "blog_p": "Catorce artículos pa
