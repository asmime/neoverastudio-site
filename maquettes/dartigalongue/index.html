:root{
--encre:#15233A;--encre2:#1C2D49;--encre3:#2A3F62;--encre-txt:#C3CCDA;
--papier:#ECEBE6;--papier2:#E2E0D9;--blanc:#F8F7F3;
--ambre:#C98A2E;--ambre-clair:#E4B566;--ambre-fonce:#8A5512;
--txt:#1A2232;--txt2:#545D6C;--ligne:rgba(21,35,58,.16);--ligne-n:rgba(232,236,242,.18);
--d:"Gilda Display","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
--l:"Josefin Sans","Hiragino Sans","Noto Sans JP",sans-serif;
--b:"Libre Franklin","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
--ease:cubic-bezier(.16,1,.3,1);--r:3px;--ombre:0 10px 30px -12px rgba(21,35,58,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papier);color:var(--txt);font:400 1.0625rem/1.6 var(--b);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,video{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--ambre-clair);color:var(--encre)}
:focus-visible{outline:2px solid var(--ambre);outline-offset:3px;border-radius:2px}
html{scrollbar-color:var(--encre3) var(--papier2)}
::-webkit-scrollbar{width:11px;height:8px}::-webkit-scrollbar-track{background:var(--papier2)}::-webkit-scrollbar-thumb{background:var(--encre3);border-radius:8px;border:2px solid var(--papier2)}
.skip{position:absolute;left:-999px;top:8px;background:var(--ambre);color:var(--encre);padding:8px 14px;z-index:99}.skip:focus{left:8px}
.wrap{width:min(1240px,100% - 2*clamp(16px,4vw,48px));margin-inline:auto}
h1,h2,h3{font-family:var(--d);font-weight:400;line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:clamp(2rem,1.3rem + 2.6vw,3.6rem)}
h3{font-size:clamp(1.4rem,1.1rem + 1vw,2rem)}
p{margin:0;text-wrap:pretty}
.lead{font-size:clamp(1.05rem,1rem + .3vw,1.2rem);color:var(--txt2);max-width:58ch}
.nuit .lead,.nuit p{color:var(--encre-txt)}
.lab{font:600 .78rem/1 var(--l);letter-spacing:.16em;text-transform:uppercase}
:lang(ja) .lab{letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums lining-nums}
.btn{display:inline-flex;align-items:center;gap:.6em;min-height:48px;padding:.9em 1.5em .8em;border:1px solid currentColor;background:none;border-radius:var(--r);font:600 .82rem/1 var(--l);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
:lang(ja) .btn{letter-spacing:.04em}
.btn.plein{background:var(--ambre);border-color:var(--ambre);color:var(--encre)}
.btn.plein:hover{background:var(--ambre-clair);border-color:var(--ambre-clair)}
.btn:not(.plein):hover{background:var(--encre);color:var(--blanc);border-color:var(--encre)}
.nuit .btn:not(.plein):hover{background:var(--blanc);color:var(--encre)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lien{font:600 .82rem/1.2 var(--l);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--ambre);padding-bottom:.35em;display:inline-block}
.lien:hover{color:var(--ambre-fonce)}.nuit .lien:hover{color:var(--ambre-clair)}
.nuit{background:var(--encre);color:var(--blanc)}
/* Bandeau loi Evin */
.evin{background:var(--encre);color:var(--encre-txt);font-size:.78rem;text-align:center;padding:6px 16px;border-bottom:1px solid var(--ligne-n)}
/* En-tête */
header.tete{position:sticky;top:0;z-index:40;background:rgba(236,235,230,.94);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--ligne)}
.tete .l1{display:flex;align-items:center;gap:20px;min-height:68px}
.marque{display:flex;flex-direction:column;text-decoration:none;line-height:1;margin-right:auto}
.marque b{font:400 1.7rem/1 var(--d);font-style:italic;letter-spacing:-.01em}
.marque span{font:600 .62rem/1 var(--l);letter-spacing:.3em;text-transform:uppercase;color:var(--txt2);margin-top:6px}
nav.menu{display:flex;gap:4px}
nav.menu a{font:600 .76rem/1 var(--l);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding:12px 10px 10px;border-radius:2px;white-space:nowrap;position:relative}
:lang(ja) nav.menu a{letter-spacing:.02em;font-size:.82rem}
nav.menu a[aria-current=page]::after{content:"";position:absolute;left:10px;right:10px;bottom:4px;height:1px;background:var(--ambre)}
nav.menu a:hover{color:var(--ambre-fonce)}
.outils{display:flex;align-items:center;gap:10px}
.langue{position:relative}
.langue select{appearance:none;border:1px solid var(--ligne);background:var(--blanc);border-radius:var(--r);padding:10px 30px 9px 12px;font:500 .86rem/1 var(--b);cursor:pointer;min-height:42px}
.langue::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--txt);border-bottom:1.5px solid var(--txt);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.panier-btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border:1px solid var(--encre);background:var(--encre);color:var(--blanc);border-radius:var(--r);cursor:pointer;font:600 .76rem/1 var(--l);letter-spacing:.12em;text-transform:uppercase}
.panier-btn b{background:var(--ambre);color:var(--encre);border-radius:20px;min-width:22px;height:22px;display:grid;place-items:center;font:600 .78rem/1 var(--b);letter-spacing:0}
@media (max-width:1180px){
 .tete .l1{flex-wrap:wrap;gap:10px 16px;padding-top:10px}
 nav.menu{order:3;width:100%;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent);padding-bottom:4px;margin-inline:-6px}
 nav.menu::-webkit-scrollbar{display:none}
}
@media (max-width:560px){.marque b{font-size:1.4rem}.panier-btn span{display:none}.langue select{padding-right:26px;font-size:.8rem}}
/* Accueil — premier écran */
.hero{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);min-height:min(88vh,860px)}
.hero .gauche{background:var(--encre);color:var(--blanc);display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,6vw,96px) clamp(20px,5vw,80px)}
.hero h1{font-size:clamp(2.5rem,1.4rem + 3.6vw,5rem);max-width:15ch;hyphens:none}
:lang(ja) .hero h1{font-size:clamp(2rem,1.2rem + 2.6vw,3.6rem);max-width:14em;line-height:1.3}
.hero .lead{color:var(--encre-txt);margin-top:24px;max-width:46ch}
.saisie{margin-top:36px;display:flex;align-items:stretch;gap:0;max-width:440px;border:1px solid var(--ligne-n);border-radius:var(--r);background:var(--encre2)}
.saisie label{display:flex;align-items:center;padding:0 14px;font:600 .72rem/1.2 var(--l);letter-spacing:.14em;text-transform:uppercase;color:var(--encre-txt);border-right:1px solid var(--ligne-n);max-width:46%}
.saisie input{flex:1;min-width:0;background:none;border:0;padding:12px 14px;font:400 1.9rem/1 var(--d);color:var(--ambre-clair);letter-spacing:.06em}
.saisie input::placeholder{color:rgba(228,181,102,.35)}
.saisie input:focus{outline:none}.saisie:focus-within{border-color:var(--ambre)}
.saisie button{border:0;background:var(--ambre);color:var(--encre);padding:0 18px;font:600 .8rem/1 var(--l);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:0 var(--r) var(--r) 0}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:26px}
.hero .droite{position:relative;overflow:hidden;background:#0d1626}
.hero .droite img{width:100%;height:100%;object-fit:cover;object-position:60% 50%;clip-path:inset(0 0 0 0);animation:devoile 1.6s var(--ease) both}
@keyframes devoile{from{clip-path:inset(0 0 100% 0);transform:scale(1.06)}to{clip-path:inset(0 0 0 0);transform:none}}
.hero h1 .ligne{display:block;overflow:hidden}.hero h1 .ligne>span{display:block;animation:monte 1.1s var(--ease) both}
.hero h1 .ligne:nth-child(2)>span{animation-delay:.08s}.hero h1 .ligne:nth-child(3)>span{animation-delay:.16s}
@keyframes monte{from{transform:translateY(105%)}to{transform:none}}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.hero .droite{order:-1;height:44vh;min-height:260px}}
.reass{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ligne);background:var(--blanc)}
.reass div{padding:18px 20px;border-left:1px solid var(--ligne)}.reass div:first-child{border-left:0}
.reass b{display:block;font:500 .95rem/1.3 var(--b)}.reass span{font-size:.84rem;color:var(--txt2)}
@media (max-width:860px){.reass{grid-template-columns:1fr 1fr}.reass div:nth-child(3){border-left:0}.reass div{border-top:1px solid var(--ligne)}}
/* Le registre (geste signature) */
.registre{padding:clamp(64px,9vw,120px) 0 clamp(56px,8vw,104px)}
.registre .entete{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.registre .entete .lead{max-width:44ch}
.reg-corps{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,72px);align-items:center;margin-top:clamp(32px,5vw,56px)}
.etui-scene{position:relative;aspect-ratio:4/5;background:radial-gradient(120% 80% at 50% 100%,rgba(201,138,46,.22),transparent 60%),var(--encre2);border:1px solid var(--ligne-n);border-radius:var(--r);overflow:hidden;display:grid;place-items:end center}
.etui-scene .annee-fond{position:absolute;inset:auto 0 50% 0;text-align:center;font:400 clamp(7rem,16vw,15rem)/.8 var(--d);color:rgba(248,247,243,.05);letter-spacing:-.04em;pointer-events:none;user-select:none}
.etui-scene img{position:relative;height:92%;width:auto;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(0,0,0,.45));transition:clip-path .9s var(--ease),transform .9s var(--ease),opacity .4s}
.etui-scene img.sort{clip-path:inset(100% 0 0 0);transform:translateY(14%);opacity:.3}
.etui-scene .bord{position:absolute;left:0;right:0;bottom:0;height:9%;background:linear-gradient(var(--encre),#0f1a2c);border-top:1px solid rgba(228,181,102,.35)}
.fiche-reg .y{font:400 clamp(4.5rem,3rem + 6vw,8.5rem)/.9 var(--d);color:var(--ambre-clair);letter-spacing:-.03em}
.fiche-reg .app{margin-top:10px;color:var(--encre-txt)}
.notes{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;margin-top:26px;align-items:baseline}
.notes dt{color:var(--ambre-clair)}
.notes dd{margin:0;display:flex;flex-wrap:wrap;gap:6px}
.puce{font-size:.86rem;padding:5px 11px 4px;border:1px solid var(--ligne-n);border-radius:40px;color:var(--blanc)}
.ere{margin-top:24px;padding-top:18px;border-top:1px solid var(--ligne-n);font-size:.95rem;color:var(--encre-txt);max-width:52ch;font-style:italic}
.choix{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
.choix button{flex:1 1 150px;text-align:left;padding:12px 14px;border:1px solid var(--ligne-n);border-radius:var(--r);background:none;cursor:pointer;color:var(--blanc)}
.choix button b{display:block;font:600 .74rem/1 var(--l);letter-spacing:.14em;text-transform:uppercase;color:var(--encre-txt)}
.choix button span{font:400 1.5rem/1.2 var(--d)}
.choix button[aria-pressed=true]{border-color:var(--ambre);background:rgba(201,138,46,.12)}
.choix button[aria-pressed=true] b{color:var(--ambre-clair)}
.reg-actions{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:center;margin-top:22px}
.main{font-size:.84rem;color:var(--encre-txt);margin-top:16px}
.regle{position:relative;margin-top:clamp(36px,5vw,60px);border-top:1px solid var(--ligne-n);border-bottom:1px solid var(--ligne-n)}
.regle ol{list-style:none;margin:0;padding:18px 50%;display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.regle ol::-webkit-scrollbar{display:none}
.regle li{scroll-snap-align:center;flex:0 0 auto}
.regle button{background:none;border:0;cursor:pointer;color:rgba(248,247,243,.38);font:400 1.5rem/1 var(--d);padding:10px 16px;transition:color .3s,transform .4s var(--ease);font-variant-numeric:lining-nums}
.regle button:hover{color:var(--blanc)}
.regle button[aria-current=true]{color:var(--ambre-clair);transform:scale(1.35)}
.regle::before{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--ambre);opacity:.6}
.regle .fond-g,.regle .fond-d{position:absolute;top:0;bottom:0;width:14%;pointer-events:none}
.regle .fond-g{left:0;background:linear-gradient(90deg,var(--encre),transparent)}.regle .fond-d{right:0;background:linear-gradient(-90deg,var(--encre),transparent)}
.regle-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px;flex-wrap:wrap}
.regle-nav .fl{display:flex;gap:8px}
.regle-nav .fl button{width:44px;height:44px;border:1px solid var(--ligne-n);border-radius:50%;background:none;color:var(--blanc);cursor:pointer;font-size:1.1rem}
.regle-nav .fl button:hover{border-color:var(--ambre)}
.regle-nav small{color:var(--encre-txt)}
.cadeau{margin-top:28px;font-family:var(--d);font-size:clamp(1.15rem,1rem + .5vw,1.45rem);color:var(--blanc);max-width:44ch}
@media (max-width:860px){.reg-corps{grid-template-columns:1fr}.etui-scene{aspect-ratio:1/1;max-height:62vh;width:100%}}
/* Âges */
.ages{padding:clamp(64px,9vw,120px) 0}
.ages-liste{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:clamp(32px,5vw,56px);border-top:1px solid var(--ligne)}
.age{padding:22px 18px 26px;border-right:1px solid var(--ligne);display:flex;flex-direction:column;gap:12px;text-decoration:none;position:relative;transition:background .35s}
.age:last-child{border-right:0}
.age .teinte{height:6px;border-radius:2px}
.age img{height:230px;width:auto;margin:6px auto 4px;object-fit:contain;transition:transform .5s var(--ease)}
.age:hover{background:var(--blanc)}.age:hover img{transform:translateY(-6px)}
.age .min{color:var(--txt2)}
.age h3{font-size:1.65rem}
.age p{font-size:.92rem;color:var(--txt2)}
.age .prix{margin-top:auto;font:500 1rem var(--b)}
@media (max-width:980px){.ages-liste{grid-template-columns:repeat(5,minmax(220px,1fr));overflow-x:auto;scroll-snap-type:x mandatory}.age{scroll-snap-align:start}}
/* Blocs éditoriaux */
.duo{display:grid;grid-template-columns:1fr 1fr;min-height:560px}
.duo .txt{padding:clamp(48px,7vw,104px) clamp(20px,5vw,80px);display:flex;flex-direction:column;justify-content:center;gap:20px}
.duo .img{position:relative;overflow:hidden;min-height:340px}
.duo .img img,.duo .img video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.duo.inv .img{order:-1}
.duo .meta{color:var(--txt2)}.nuit .meta{color:var(--encre-txt)}
.prixl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.prixl strong{font:400 2rem/1 var(--d)}
@media (max-width:860px){.duo{grid-template-columns:1fr}.duo.inv .img{order:0}.duo .img{min-height:320px}}
.flacon{position:absolute!important;inset:auto!important;right:6%;bottom:6%;height:68%!important;width:auto!important;object-fit:contain!important;filter:drop-shadow(0 20px 26px rgba(0,0,0,.5))}
.bande{padding:clamp(56px,8vw,100px) 0;border-top:1px solid var(--ligne)}
.grille3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,40px)}
@media (max-width:860px){.grille3{grid-template-columns:1fr}}
.archive{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,72px);align-items:center}
.archive figure{margin:0}
.archive img{filter:grayscale(1) contrast(1.05);border-radius:var(--r)}
.archive figcaption{font-size:.84rem;color:var(--txt2);margin-top:10px}
@media (max-width:860px){.archive{grid-template-columns:1fr}}
.epv{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:28px 0;border-top:1px solid var(--ligne);border-bottom:1px solid var(--ligne)}
.sceau{width:92px;height:92px;border-radius:50%;border:1px solid var(--encre);display:grid;place-items:center;text-align:center;font:600 .62rem/1.25 var(--l);letter-spacing:.12em;text-transform:uppercase;padding:10px}
@media (max-width:700px){.epv{grid-template-columns:auto 1fr}.epv .lien{grid-column:1/-1}}
/* Pages */

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:40px}.photos img{aspect-ratio:2/1;object-fit:cover;border-radius:var(--r);width:100%}

.recettes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,3vw,36px);margin-top:28px}

.gamme-ck{display:flex;gap:18px;align-items:center;margin-top:56px;padding-top:28px;border-top:1px solid var(--ligne)}

4:["Jeunes eaux-de-vie choisies pour leur fruit et leur douceur : prune, poire, finale sur l'amande douce. La meilleure porte d'entrée dans notre style.","Young eaux-de-vie chosen for fruit and softness: plum, pear, a sweet-almond finish. The easiest way into our style.","Aguardientes jóvenes elegidos por su fruta y suavidad: ciruela, pera, final de almendra dulce. La mejor puerta de entrada a nuestro estilo.","Junge Brände, ausgewählt für Frucht und Sanftheit: Pflaume, Birne, Abgang auf süßer Mandel. Der leichteste Einstieg in unseren Stil.","Acquaviti giovani scelte per frutto e morbidezza: prugna, pera, finale di mandorla dolce. Il modo più semplice per conoscere il nostro stile.","果実味とやわらかさで選んだ若いオー・ド・ヴィー。プラム、洋梨、スイートアーモンドの余韻。私たちのスタイルへの最初の一本。"],
5:["Un élevage plus long sous bois : pomme cuite et pruneau des jeunes millésimes, épices des millésimes de réserve. Frais, gourmand, très séducteur.","Longer in oak: baked apple and prune from the young vintages, spice from the reserve ones. Fresh, indulgent, seductive.","Más tiempo en roble: manzana asada y ciruela pasa de las añadas jóvenes, especias de las de reserva. Fresco, goloso, seductor.","Länger im Eichenfass: Bratapfel und Backpflaume der jungen Jahrgänge, Gewürze der Reservejahrgänge. Frisch, genussvoll, verführerisch.","Più tempo in rovere: mela cotta e prugna delle annate giovani, spezie di quelle di riserva. Fresco, goloso, seducente.","より長い樽熟成。若いヴィンテージの焼き林檎とプルーン、リザーヴのスパイス。フレッシュで豊か。"],
6:["La signature de la maison : fruits confits (ananas, orange), chêne toasté, épices, bois de santal. Puissant mais jamais agressif, avec une longueur remarquable.","The house signature: candied pineapple and orange, toasted oak, spice, sandalwood. Powerful yet never harsh, with a remarkable finish.","La firma de la casa: piña y naranja confitadas, roble tostado, especias, sándalo. Potente pero nunca agresivo, con un final notable.","Die Signatur des Hauses: kandierte Ananas und Orange, geröstete Eiche, Gewürze, Sandelholz. Kraftvoll, nie aggressiv, mit bemerkenswerter Länge.","La firma della casa: ananas e arancia candite, rovere tostato, spezie, sandalo. Potente ma mai aggressivo, con una lunghezza notevole.","メゾンの顔。パイナップルとオレンジの砂糖漬け、トーストしたオーク、スパイス、白檀。力強くも角がなく、長い余韻。"],
7:["De vieux millésimes hérités des générations précédentes. L'âge de l'harmonie : texture soyeuse, pain d'épices, réglisse, gingembre confit.","Old vintages handed down by earlier generations. The age of harmony: silky texture, gingerbread, liquorice, candied ginger.","Añadas antiguas heredadas de generaciones anteriores. La edad de la armonía: textura sedosa, pan de especias, regaliz, jengibre confitado.","Alte Jahrgänge, von früheren Generationen geerbt. Das Alter der Harmonie: seidige Textur, Lebkuchen, Lakritz, kandierter Ingwer.","Vecchie annate ereditate dalle generazioni precedenti. L'età dell'armonia: trama setosa, pan di spezie, liquirizia, zenzero candito.","先代から受け継いだ古いヴィンテージ。調和の年齢。シルキーな質感、パン・デピス、リコリス、ジンジャーコンフィ。"],
8:["Notre assemblage le plus long sous bois. Une ode au rancio noble : noix, fruits secs, bois fumé. D'une complexité rare.","Our longest-aged blend. An ode to noble rancio: walnut, dried fruit, smoked wood. Rare complexity.","Nuestro ensamblaje con más crianza. Una oda al rancio noble: nuez, frutos secos, madera ahumada. Complejidad poco común.","Unsere am längsten gereifte Assemblage. Eine Ode an edles Rancio: Walnuss, Trockenfrüchte, Rauchholz. Seltene Komplexität.","Il nostro assemblaggio più lungo in botte. Un'ode al rancio nobile: noce, frutta secca, legno affumicato. Complessità rara.","最も長く樽で眠ったブレンド。気高いランシオへの賛歌。クルミ、ドライフルーツ、スモークウッド。"],
9:["Nos cinq assemblages en 10 cl, de 4 à 30 ans, deux verres tulipes Lehmann sérigraphiés et un livret de 20 pages : histoire, conseils du maître de chai, accords.","Our five blends in 10 cl, from 4 to 30 years, two printed Lehmann tulip glasses and a 20-page booklet: history, cellar master's tips, pairings.","Nuestros cinco ensamblajes en 10 cl, de 4 a 30 años, dos copas tulipa Lehmann serigrafiadas y un cuaderno de 20 páginas: historia, consejos del maestro bodeguero, maridajes.","Unsere fünf Assemblagen à 10 cl, von 4 bis 30 Jahren, zwei bedruckte Lehmann-Tulpengläser und ein 20-seitiges Heft: Geschichte, Tipps des Kellermeisters, Speisebegleiter.","I nostri cinque assemblaggi da 10 cl, da 4 a 30 anni, due bicchieri a tulipano Lehmann serigrafati e un libretto di 20 pagine: storia, consigli del maestro di cantina, abbinamenti.","4年から30年まで5種のブレンド（各10cl）、ロゴ入りレーマン社チューリップグラス2脚、20ページの冊子（歴史、セラーマスターの助言、ペアリング）。"],
10:["VSOP, Réserve et XO Signature en 20 cl : trois âges pour comprendre comment le chêne fait évoluer l'armagnac.","VSOP, Réserve and XO Signature in 20 cl: three ages to taste how oak shapes armagnac.","VSOP, Réserve y XO Signature en 20 cl: tres edades para entender cómo el roble transforma el armañac.","VSOP, Réserve und XO Signature à 20 cl: drei Alter, um zu schmecken, wie die Eiche den Armagnac prägt.","VSOP, Réserve e XO Signature da 20 cl: tre età per capire come il rovere trasforma l'armagnac.","VSOP、レゼルヴ、XOシグネチャー（各20cl）。オークがアルマニャックをどう変えるかを3つの年齢で。"],
gf:["Le même assemblage, en grand format pour les grandes tablées : anniversaire, mariage, repas de famille.","The same blend in a large format for big tables: birthdays, weddings, family meals.","El mismo ensamblaje en gran formato para las grandes mesas: cumpleaños, bodas, comidas familiares.","Dieselbe Assemblage im Großformat für große Tafeln: Geburtstag, Hochzeit, Familienfeste.","Lo stesso assemblaggio in grande formato per le grandi tavolate: compleanni, matrimoni, pranzi di famiglia.","同じブレンドを大きなボトルで。誕生日、結婚式、家族の集まりに。"],
67:["Carafe « Diva » 70 cl en caisse bois, remplie et habillée à la main, avec notre XO Signature.","“Diva” 70 cl decanter in a wooden case, filled and dressed by hand, with our XO Signature.","Licorera «Diva» de 70 cl en caja de madera, llenada y vestida a mano, con nuestro XO Signature.","Karaffe „Diva“ 70 cl in Holzkiste, von Hand gefüllt und ausgestattet, mit unserem XO Signature.","Caraffa «Diva» da 70 cl in cassa di legno, riempita e vestita a mano, con il nostro XO Signature.","木箱入りデキャンタ「ディーヴァ」70cl。XOシグネチャーを手作業で充填・装飾。"],
68:["Carafe « Jens » 50 cl, remplie et habillée à la main, en étui bleu, avec notre Réserve.","“Jens” 50 cl decanter, filled and dressed by hand, in a blue box, with our Réserve.","Licorera «Jens» de 50 cl, llenada y vestida a mano, en estuche azul, con nuestro Réserve.","Karaffe „Jens“ 50 cl, von Hand gefüllt und ausgestattet, im blauen Etui, mit unserer Réserve.","Caraffa «Jens» da 50 cl, riempita e vestita a mano, in astuccio blu, con il nostro Réserve.","青い箱入りデキャンタ「イェンス」50cl。レゼルヴを手作業で充填・装飾。"],
69:["Carafe « Yogi » 50 cl, remplie et habillée à la main, présentée dans une arche en bois, avec notre XO Signature.","“Yogi” 50 cl decanter, filled and dressed by hand, set in a wooden arch, with our XO Signature.","Licorera «Yogi» de 50 cl, llenada y vestida a mano, en un arco de madera, con nuestro XO Signature.","Karaffe „Yogi“ 50 cl, von Hand gefüllt und ausgestattet, in einem Holzbogen, mit unserem XO Signature.","Caraffa «Yogi» da 50 cl, riempita e vestita a mano, in un arco di legno, con il nostro XO Signature.","木製アーチ入りデキャンタ「ヨギ」50cl。XOシグネチャーを手作業で充填・装飾。"],
75:["Créée pour les 180 ans de la maison, fondée sous Louis-Philippe : un assemblage de cinq millésimes (1979, 1983, 1986, 1992, 1994). Fleurs blanches, miel, tabac blond, puis rancio et cuir. Carafe 70 cl en étui luxe, habillée à la main.","Created for the house's 180th year, founded under King Louis-Philippe: a blend of five vintages (1979, 1983, 1986, 1992, 1994). White flowers, honey, blond tobacco, then rancio and leather. 70 cl decanter in a luxury box, dressed by hand.","Creada para los 180 años de la casa, fundada bajo Luis Felipe: ensamblaje de cinco añadas (1979, 1983, 1986, 1992, 1994). Flores blancas, miel, tabaco rubio, luego rancio y cuero. Licorera de 70 cl en estuche de lujo, vestida a mano.","Zum 180. Jubiläum des unter Louis-Philippe gegründeten Hauses: eine Assemblage aus fünf Jahrgängen (1979, 1983, 1986, 1992, 1994). Weiße Blüten, Honig, heller Tabak, dann Rancio und Leder. 70-cl-Karaffe im Luxusetui, von Hand ausgestattet.","Creata per i 180 anni della casa, fondata sotto Luigi Filippo: assemblaggio di cinque annate (1979, 1983, 1986, 1992, 1994). Fiori bianchi, miele, tabacco biondo, poi rancio e cuoio. Caraffa da 70 cl in astuccio di lusso, vestita a mano.","ルイ＝フィリップ王の時代に創業したメゾンの180周年記念。1979・1983・1986・1992・1994年の5ヴィンテージをブレンド。白い花、蜂蜜、ブロンドタバコ、やがてランシオとレザー。高級ケース入り70clデキャンタ。"],
70:["Une blanche d'Armagnac qui n'a jamais vu le bois : simplement reposée en cuve inox. Poire, pomme, fleurs blanches, texture onctueuse. Pure, sur glace ou avec du tonic.","A white armagnac that has never touched wood, simply rested in steel. Pear, apple, white flowers, creamy texture. Neat, on ice or with tonic.","Un armañac blanco que nunca ha tocado la madera, reposado en acero. Pera, manzana, flores blancas, textura untuosa. Solo, con hielo o con tónica.","Ein weißer Armagnac ohne Holzkontakt, nur im Edelstahltank gereift. Birne, Apfel, weiße Blüten, cremige Textur. Pur, auf Eis oder mit Tonic.","Un armagnac bianco che non ha mai toccato il legno, riposato in acciaio. Pera, mela, fiori bianchi, trama untuosa. Liscio, con ghiaccio o con tonica.","一度も木樽に触れないブランシュ・アルマニャック。ステンレスタンクで熟成。洋梨、林檎、白い花、とろりとした口当たり。ストレート、ロック、トニック割りで。"],
71:["Élevé dans un seul type de fût : le chêne roux du Sud-Ouest, qui garde tout le fruit. Vanille, prune, pêche, finale épicée.","Aged in a single type of cask: South-West red oak, which keeps all the fruit. Vanilla, plum, peach, spicy finish.","Criado en un solo tipo de barrica: roble rojizo del suroeste, que conserva toda la fruta. Vainilla, ciruela, melocotón, final especiado.","In nur einer Fassart gereift: rötliche Eiche aus dem Südwesten, die alle Frucht bewahrt. Vanille, Pflaume, Pfirsich, würziger Abgang.","Affinato in un solo tipo di botte: rovere rosso del Sud-Ovest, che conserva tutto il frutto. Vaniglia, prugna, pesca, finale speziato.","南西部産の使用済み樽の一種類だけで熟成し、果実味をそのまま残しました。バニラ、プラム、桃、スパイシーな余韻。"],
72:["Deux passages en fût neuf du Sud-Ouest, chauffe forte : pain grillé, cacao, torréfaction, épices. Développé avec le soutien de la région Occitanie.","Two passes through new South-West casks, heavy toast: toast, cocoa, roast, spice. Developed with support from the Occitanie region.","Dos pasos por barrica nueva del suroeste, tostado fuerte: pan tostado, cacao, torrefacción, especias. Desarrollado con el apoyo de la región Occitania.","Zwei Durchgänge in neuen Fässern aus dem Südwesten, starke Röstung: Toast, Kakao, Röstnoten, Gewürze. Mit Unterstützung der Region Okzitanien entwickelt.","Due passaggi in botte nuova del Sud-Ovest, tostatura forte: pane tostato, cacao, torrefazione, spezie. Sviluppato con il sostegno della regione Occitania.","南西部産の新樽で二度熟成（強めのトースト）。トースト、カカオ、焙煎香、スパイス。オクシタニー地域圏の支援で開発。"],
73:["Certifié Agriculture biologique. Baco 22A et Folle Blanche, au moins 5 ans de fût. Fruits jaunes, vanille, finale boisée et épicée.","Certified organic. Baco 22A and Folle Blanche, at least 5 years in cask. Yellow fruit, vanilla, a woody, spicy finish.","Certificado ecológico. Baco 22A y Folle Blanche, al menos 5 años en barrica. Frutas amarillas, vainilla, final amaderado y especiado.","Bio-zertifiziert. Baco 22A und Folle Blanche, mindestens 5 Jahre im Fass. Gelbe Früchte, Vanille, holzig-würziger Abgang.","Certificato biologico. Baco 22A e Folle Blanche, almeno 5 anni in botte. Frutta gialla, vaniglia, finale legnoso e speziato.","有機農業認証。バコ22Aとフォル・ブランシュ、5年以上の樽熟成。黄色い果実、バニラ、木とスパイスの余韻。"],
74:["Six générations racontées par deux enseignants-chercheurs, après dix ans de recherches. 200 pages, moitié textes, moitié archives. Préface du chef Quentin Pellestor Veyrier et du sommelier Nathan Menou.","Six generations told by two academic historians after ten years of research. 200 pages, half text, half archives. Foreword by chef Quentin Pellestor Veyrier and sommelier Nathan Menou.","Seis generaciones contadas por dos profesores investigadores tras diez años de trabajo. 200 páginas, mitad textos, mitad archivos. Prólogo del chef Quentin Pellestor Veyrier y del sumiller Nathan Menou.","Sechs Generationen, erzählt von zwei Historikern nach zehn Jahren Forschung. 200 Seiten, halb Text, halb Archiv. Vorwort von Koch Quentin Pellestor Veyrier und Sommelier Nathan Menou.","Sei generazioni raccontate da due docenti ricercatori dopo dieci anni di studi. 200 pagine, metà testi, metà archivi. Prefazione dello chef Quentin Pellestor Veyrier e del sommelier Nathan Menou.","2人の研究者が10年の調査を経て綴った6世代の物語。200ページ、半分が文章、半分が資料。シェフ、カンタン・ペレストール・ヴェイリエとソムリエ、ナタン・ムヌーの序文。"],
76:["Liqueur artisanale : armagnac, pruneaux d'Agen, thé noir de Ceylan et épices. Texture veloutée, sucre maîtrisé. Très fraîche, sur glace ou en Spritz 32.","Craft liqueur: armagnac, Agen prunes, Ceylon black tea and spices. Velvety, not too sweet. Well chilled, on ice or in a Spritz 32.","Licor artesanal: armañac, ciruelas de Agen, té negro de Ceilán y especias. Aterciopelado, dulzor medido. Muy frío, con hielo o en Spritz 32.","Handwerklicher Likör: Armagnac, Agen-Pflaumen, schwarzer Ceylon-Tee und Gewürze. Samtig, nicht zu süß. Gut gekühlt, auf Eis oder als Spritz 32.","Liquore artigianale: armagnac, prugne di Agen, tè nero di Ceylon e spezie. Vellutato, dolcezza misurata. Ben freddo, con ghiaccio o in Spritz 32.","アルマニャック、アジャンのプルーン、セイロン紅茶、スパイスの手作りリキュール。ビロードの口当たり、控えめな甘さ。よく冷やして、ロックやスプリッツ32で。"],
77:["Recette de famille inchangée depuis des générations : armagnac, pruneaux d'Agen, thé noir infusé maison. 24 à 26 pruneaux par bocal. Avec un foie gras, un magret, une glace vanille.","A family recipe unchanged for generations: armagnac, Agen prunes, house-brewed black tea. 24 to 26 prunes per jar. With foie gras, duck breast or vanilla ice cream.","Receta familiar sin cambios desde hace generaciones: armañac, ciruelas de Agen, té negro infusionado en casa. 24 a 26 ciruelas por tarro. Con foie gras, magret o helado de vainilla.","Familienrezept seit Generationen: Armagnac, Agen-Pflaumen, hausgemachter Schwarztee. 24 bis 26 Pflaumen pro Glas. Zu Foie gras, Entenbrust oder Vanilleeis.","Ricetta di famiglia invariata da generazioni: armagnac, prugne di Agen, tè nero in infusione. Da 24 a 26 prugne per vasetto. Con foie gras, petto d'anatra o gelato alla vaniglia.","何世代も変わらない家族のレシピ。アルマニャック、アジャンのプルーン、自家製の紅茶。1瓶24〜26粒。フォアグラ、鴨胸肉、バニラアイスに。"],
78:["Verres tulipes en cristallin sans plomb, sérigraphiés à nos couleurs. L'ouverture resserrée libère les arômes en douceur. Carton de 6 · 12 cl · H 82 mm.","Lead-free crystalline tulip glasses printed with our colours. The narrow rim releases aromas gently. Box of 6 · 12 cl · H 82 mm.","Copas tulipa de cristalino sin plomo, serigrafiadas con nuestros colores. La boca estrecha libera los aromas con suavidad. Caja de 6 · 12 cl · Al. 82 mm.","Bleifreie Tulpengläser mit unserem Aufdruck. Die verengte Öffnung gibt die Aromen sanft frei. Karton mit 6 · 12 cl · H 82 mm.","Bicchieri a tulipano in cristallino senza piombo, serigrafati con i nostri colori. L'apertura stretta libera gli aromi con dolcezza. Confezione da 6 · 12 cl · H 82 mm.","メゾンのロゴ入り無鉛クリスタリンのチューリップグラス。すぼまった口が香りをやさしく開きます。6個入り・12cl・高さ82mm。"],
79:["Verres tulipes à pied en cristallin sans plomb, sérigraphiés à nos couleurs. Carton de 6 · 15 cl · H 155 mm.","Stemmed lead-free crystalline tulip glasses printed with our colours. Box of 6 · 15 cl · H 155 mm.","Copas tulipa con pie de cristalino sin plomo, serigrafiadas. Caja de 6 · 15 cl · Al. 155 mm.","Bleifreie Tulpengläser mit Stiel, mit unserem Aufdruck. Karton mit 6 · 15 cl · H 155 mm.","Bicchieri a tulipano con stelo in cristallino senza piombo, serigrafati. Confezione da 6 · 15 cl · H 155 mm.","脚付きの無鉛クリスタリン・チューリップグラス、ロゴ入り。6個入り・15cl・高さ155mm。"],
fe:["Un fût unique repéré dans nos chais, mis en bouteille au degré qui révèle le mieux son millésime. Série limitée, chaque bouteille est numérotée.","A single cask found in our cellars, bottled at the strength that best reveals its vintage. Limited series, every bottle numbered.","Una barrica única elegida en nuestras bodegas, embotellada al grado que mejor revela su añada. Serie limitada, cada botella numerada.","Ein einzelnes Fass aus unseren Kellern, abgefüllt mit der Stärke, die seinen Jahrgang am besten zeigt. Limitierte Serie, jede Flasche nummeriert.","Una botte unica scelta nelle nostre cantine, imbottigliata al grado che meglio rivela la sua annata. Serie limitata, ogni bottiglia numerata.","セラーで選んだ一樽を、そのヴィンテージが最も輝く度数でボトリング。限定シリーズ、全ボトルにナンバー入り。"],
0:["Pour la 3e édition du Fest'Armagnac, Ghislain Laffargue et Michael Illouz, fondateur du festival, ont assemblé plusieurs fûts de 1976. 50 ans de chêne, et toujours cette fraîcheur. 76 bouteilles de 50 cl en caisse bois, mises en bouteille en janvier 2026. Noté 91/100 par Whisky Fun. Frais de port inclus.","For the 3rd Fest'Armagnac, Ghislain Laffargue and festival founder Michael Illouz blended several 1976 casks. 50 years in oak, still fresh. 76 bottles of 50 cl in a wooden case, bottled January 2026. Rated 91/100 by Whisky Fun. Shipping included.","Para la 3.ª edición del Fest'Armagnac, Ghislain Laffargue y Michael Illouz, fundador del festival, ensamblaron varias barricas de 1976. 50 años de roble y aún frescura. 76 botellas de 50 cl en caja de madera, embotelladas en enero de 2026. 91/100 en Whisky Fun. Envío incluido.","Zum 3. Fest'Armagnac haben Ghislain Laffargue und Festivalgründer Michael Illouz mehrere Fässer von 1976 vermählt. 50 Jahre Eiche, noch immer frisch. 76 Flaschen à 50 cl in Holzkiste, abgefüllt im Januar 2026. 91/100 bei Whisky Fun. Versand inklusive.","Per la 3ª edizione del Fest'Armagnac, Ghislain Laffargue e Michael Illouz, fondatore del festival, hanno assemblato più botti del 1976. 50 anni di rovere, ancora freschezza. 76 bottiglie da 50 cl in cassa di legno, imbottigliate a gennaio 2026. 91/100 per Whisky Fun. Spedizione inclusa.","第3回フェスト・アルマニャックのため、ギスラン・ラファルグと創設者ミカエル・イルーズが1976年の複数の樽をブレンド。50年の樽熟成を経てなおフレッシュ。50cl・76本、木箱入り、2026年1月瓶詰め。Whisky Fun 91点。送料込み。"],
66:["Ghislain Laffargue, maître de chai depuis 1990, termine sa carrière en 2026. Pour ouvrir cette collection, il vous confie son coup de cœur : le fût A12 du chai de la Gare, millésime 2011. Crème brûlée, fleur d'oranger, praliné, bois de santal. Un armagnac généreux, qui lui ressemble. 560 bouteilles.","Ghislain Laffargue, cellar master since 1990, retires in 2026. To open this collection he shares his favourite: cask A12 from the Station cellar, vintage 2011. Crème brûlée, orange blossom, praline, sandalwood. A generous armagnac, just like him. 560 bottles.","Ghislain Laffargue, maestro bodeguero desde 1990, se jubila en 2026. Para abrir esta colección comparte su favorita: la barrica A12 de la bodega de la Estación, añada 2011. Crema quemada, azahar, praliné, sándalo. Un armañac generoso, como él. 560 botellas.","Ghislain Laffargue, Kellermeister seit 1990, beendet 2026 seine Laufbahn. Zum Auftakt dieser Kollektion teilt er seinen Liebling: Fass A12 aus dem Bahnhofskeller, Jahrgang 2011. Crème brûlée, Orangenblüte, Praliné, Sandelholz. Ein großzügiger Armagnac, ganz wie er. 560 Flaschen.","Ghislain Laffargue, maestro di cantina dal 1990, chiude la carriera nel 2026. Per aprire questa collezione condivide il suo preferito: la botte A12 della cantina della Stazione, annata 2011. Crème brûlée, fiori d'arancio, pralinato, sandalo. Un armagnac generoso, come lui. 560 bottiglie.","1990年からセラーマスターを務めるギスラン・ラファルグが2026年に引退。コレクションの幕開けに、駅前セラーの樽A12（2011年）を託します。クレームブリュレ、オレンジの花、プラリネ、白檀。彼に似た寛大なアルマニャック。560本。"],
mi:["Mis en bouteille à la main, la date d'embouteillage est notée en contre-étiquette. Après 40 à 50 ans de fût, nos plus vieux millésimes reposent en bonbonnes de verre, au « Paradis ».","Bottled by hand, with the bottling date written on the back label. After 40 to 50 years in cask, our oldest vintages rest in glass demijohns, in the “Paradise”.","Embotellado a mano, con la fecha de embotellado en la contraetiqueta. Tras 40 a 50 años en barrica, nuestras añadas más antiguas reposan en damajuanas de vidrio, en el «Paraíso».","Von Hand abgefüllt, das Abfülldatum steht auf dem Rückenetikett. Nach 40 bis 50 Jahren im Fass ruhen unsere ältesten Jahrgänge in Glasballons, im „Paradies“.","Imbottigliato a mano, con la data di imbottigliamento in controetichetta. Dopo 40-50 anni in botte, le nostre annate più vecchie riposano in damigiane di vetro, nel «Paradiso».","手作業で瓶詰めし、瓶詰め日を裏ラベルに記載。40〜50年の樽熟成の後、最も古いヴィンテージは「パラダイス」でガラスのボンボンヌに眠ります。"]
};

ch:[["1838","Pascal settles in Nogaro","Born in 1817 near Madiran into a winegrowing family, Pascal receives 10,000 gold francs from his father. He soon sees that armagnac travels: Belgium, Holland, England, already the United States."],
["1870","Joseph and the railway","His nephew Joseph takes over. The railway arrives: no more need for the port of Bayonne, wagons leave Nogaro for Rotterdam, Antwerp, London, Hamburg."],
["1880","Phylloxera","The Gers vineyards are devastated. A hard decade, and the house comes through it."],
["1906","The cafés of Paris","André opens an office in Paris, Henri runs production in Nogaro. Our vintages are poured at the Café de Flore, the Édouard VII, the Café Riche."],
["1914","The war","André and Henri go to the front, Joseph takes the house back. André returns badly wounded, Henri ill."],
["1930","Pierre and the Normandie","Very young, Pierre takes over and sells in bottles. In 1936 he signs with a major New York distributor, a partnership that lasts decades. After the war: Belgium, Holland, Sweden, Norway."],
["1980","Jean-Pierre and Françoise","Jean-Pierre opens Spain and Italy, then the United States in the 2000s. Françoise brings the house to France's fine grocers and great restaurants."],
["2010","Benoît, sixth generation","Françoise persuades Benoît Hillion, husband of her niece Virginie, to leave Paris and his career as an agronomist. He opens Japan, Australia, Russia and China, and travels France to meet wine merchants."]],

sfp_t:"Craft is an art",sfp_l:"We do not distil: we age. Choose, wait, taste, blend.",
sf:[["Bas-Armagnac","Silty, sandy soils, known for fine, elegant eaux-de-vie."],["Four grapes","Out of the ten allowed: Ugni Blanc for fruit, Baco 22A for structure, Folle Blanche for finesse, Colombard for roundness."],["The armagnac still","Continuous distillation in a column still with plates, at our partners'. It keeps the most aroma."],["Gascon oak","400-litre casks bought from local coopers. They give armagnac its generous, indulgent side."],["Dry and damp cellars","The first calm the fire of young spirits, the second bring roundness and finesse."],["Paradise","After 40 to 50 years in cask, the spirit moves into glass demijohns. It barely changes any more, and the angels' share stops: in wood, 3 to 4% evaporates each year."],["Decided by two","Ghislain Laffargue, cellar master since 1990, and Benoît Hillion, director and sixth generation, create each blend together. Our style in two words: freshness and elegance."]],

["1980","Jean-Pierre y Françoise","Jean-Pierre abre España e Italia, y luego Estados Unidos en los años 2000. Françoise lleva la casa a las tiendas gourmet y a las grandes mesas de Francia."],

ch:[["1838","Pascal kommt nach Nogaro","1817 bei Madiran in einer Winzerfamilie geboren, erhält Pascal von seinem Vater 10.000 Goldfranken. Bald merkt er: Armagnac reist. Belgien, Holland, England, schon die USA."],
["1870","Joseph und die Eisenbahn","Sein Neffe Joseph folgt ihm. Die Bahn kommt: Der Hafen von Bayonne ist nicht mehr nötig, Waggons fahren von Nogaro nach Rotterdam, Antwerpen, London, Hamburg."],
["1880","Die Reblaus","Die Weinberge des Gers werden verwüstet. Ein schweres Jahrzehnt, das das Haus übersteht."],
["1906","Die Pariser Cafés","André eröffnet ein Büro in Paris, Henri führt die Produktion in Nogaro. Unsere Jahrgänge werden im Café de Flore, im Édouard VII und im Café Riche ausgeschenkt."],
["1914","Der Krieg","André und Henri ziehen an die Front, Joseph übernimmt wieder. André kehrt schwer verwundet zurück, Henri krank."],
["1930","Pierre und die Normandie","Sehr jung übernimmt Pierre und verkauft in Flaschen. 1936 unterschreibt er in New York mit einem großen Vertrieb, eine Partnerschaft über Jahrzehnte. Nach dem Krieg: Belgien, Holland, Schweden, Norwegen."],
["1980","Jean-Pierre und Françoise","Jean-Pierre erschließt Spanien und Italien, in den 2000ern die USA. Françoise bringt das Haus in Frankreichs Feinkostläden und Spitzenrestaurants."],
["2010","Benoît, sechste Generation","Françoise überzeugt Benoît Hillion, den Mann ihrer Nichte Virginie, Paris und seinen Beruf als Agraringenieur zu verlassen. Er erschließt Japan, Australien, Russland, China und bereist Frankreich zu den Weinhändlern."]],

sf:[["Bas-Armagnac","Schluff- und Sandböden, bekannt für feine, elegante Brände."],["Vier Rebsorten","Von den zehn der Appellation: Ugni Blanc für die Frucht, Baco 22A für die Struktur, Folle Blanche für die Finesse, Colombard für die Rundheit."],["Die Armagnac-Brennblase","Kontinuierliche Destillation in der Kolonne mit Böden, bei unseren Partnern. Sie bewahrt die meisten Aromen."],["Gascogner Eiche","400-Liter-Fässer von Küfern aus der Region. Sie geben dem Armagnac seine großzügige, genussvolle Seite."],["Trockene und feuchte Keller","Die einen zähmen das Feuer junger Brände, die anderen bringen Rundheit und Finesse."],["Das Paradies","Nach 40 bis 50 Jahren im Fass kommt der Brand in Glasballons. Er verändert sich kaum noch, und der Anteil der Engel endet: Im Holz verdunsten jedes Jahr 3 bis 4 %."],["Zu zweit entschieden","Ghislain Laffargue, Kellermeister seit 1990, und Benoît Hillion, Direktor in sechster Generation, schaffen jede Assemblage gemeinsam. Unser Stil in zwei Worten: Frische und Eleganz."]],

ch:[["1838","Pascal si stabilisce a Nogaro","Nato nel 1817 vicino a Madiran in una famiglia di vignaioli, Pascal riceve dal padre 10.000 franchi oro. Capisce presto che l'armagnac viaggia: Belgio, Olanda, Inghilterra, già gli Stati Uniti."],
["1870","Joseph e la ferrovia","Gli succede il nipote Joseph. Arriva il treno: non serve più il porto di Bayonne, i vagoni partono da Nogaro per Rotterdam, Anversa, Londra, Amburgo."],
["1880","La fillossera","I vigneti del Gers sono devastati. Un decennio difficile, che la casa supera."],
["1906","I caffè di Parigi","André apre un'agenzia a Parigi, Henri segue la produzione a Nogaro. Le nostre annate si servono al Café de Flore, all'Édouard VII, al Café Riche."],
["1914","La guerra","André e Henri partono per il fronte, Joseph riprende la casa. André torna gravemente ferito, Henri malato."],
["1930","Pierre e il Normandie","Giovanissimo, Pierre prende il testimone e vende in bottiglia. Nel 1936 firma a New York con un grande distributore, una collaborazione di decenni. Dopo la guerra: Belgio, Olanda, Svezia, Norvegia."],
["1980","Jean-Pierre e Françoise","Jean-Pierre apre Spagna e Italia, poi gli Stati Uniti negli anni 2000. Françoise porta la casa nelle gastronomie e nei grandi ristoranti di Francia."],
["2010","Benoît, sesta generazione","Françoise convince Benoît Hillion, marito della nipote Virginie, a lasciare Parigi e il lavoro di ingegnere agronomo. Apre Giappone, Australia, Russia, Cina, e gira la Francia incontrando le enoteche."]],

sf:[["Bas-Armagnac","Suoli limosi e sabbiosi, noti per acquaviti fini ed eleganti."],["Quattro vitigni","Dei dieci della denominazione: ugni blanc per il frutto, baco 22A per la struttura, folle blanche per la finezza, colombard per la rotondità."],["L'alambicco armagnacchese","Distillazione continua in alambicco a piatti, presso i nostri partner. Conserva il massimo degli aromi."],["Rovere guascone","Botti da 400 litri comprate da bottai della zona. Danno all'armagnac il suo lato generoso e goloso."],["Cantine secche e umide","Le prime calmano l'impeto delle acquaviti giovani, le seconde danno rotondità e finezza."],["Il Paradiso","Dopo 40-50 anni in botte, l'acquavite passa in damigiane di vetro. Non evolve quasi più e la parte degli angeli si ferma: nel legno evapora il 3-4% ogni anno."],["Deciso in due","Ghislain Laffargue, maestro di cantina dal 1990, e Benoît Hillion, direttore e sesta generazione, creano insieme ogni assemblaggio. Il nostro stile in due parole: freschezza ed eleganza."]],

ch:[["1838","パスカル、ノガロへ","1817年、マディラン近くのぶどう農家に生まれたパスカルは、父から金貨1万フランを受け取ります。アルマニャックは旅をすると気づき、ベルギー、オランダ、イギリス、そしてすでにアメリカへ。"],
["1870","ジョゼフと鉄道","甥のジョゼフが跡を継ぎます。鉄道が通り、バイヨンヌ港に頼らず、ノガロから貨車でロッテルダム、アントワープ、ロンドン、ハンブルクへ。"],
["1880","フィロキセラ","ジェールのぶどう畑が壊滅。苦しい10年を、メゾンは乗り越えました。"],
["1906","パリのカフェ","アンドレがパリに支店を開き、アンリがノガロで生産を担います。カフェ・ド・フロール、エドゥアール7世、カフェ・リッシュでヴィンテージが供されました。"],
["1914","戦争","アンドレとアンリは出征し、ジョゼフがメゾンに戻ります。アンドレは重傷、アンリは病を得て帰還。"],
["1930","ピエールとノルマンディー号","若くして跡を継いだピエールは瓶での販売を広げます。1936年、ニューヨークの大手販売会社と契約し、数十年続く関係に。戦後はベルギー、オランダ、スウェーデン、ノルウェーへ。"],
["1980","ジャン＝ピエールとフランソワーズ","ジャン＝ピエールはスペインとイタリア、2000年代にはアメリカを開拓。フランソワーズはフランスの高級食料品店と名店へメゾンを広げました。"],
["2010","6代目、ブノワ","フランソワーズは姪ヴィルジニーの夫ブノワ・イリオンを説得し、パリと農業技師の職を離れてもらいます。彼は日本、オーストラリア、ロシア、中国を開拓し、フランス中のワインショップを訪ねています。"]],
