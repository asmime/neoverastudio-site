evening, hot-air balloons drift over the water.", "plage.cta": "Head down to the river", "heb.h": "Four ways to sleep here", "heb.p": "Every rental has its own terrace and garden furniture. Free wifi throughout.", "calc.h": "How much will your stay cost?", "calc.p": "Choose an accommodation, a period and the number of nights: the price comes from our 2026 rates.", "calc.heb": "Accommodation", "calc.period": "Period", "calc.nights": "Nights", "calc.adults": "Adults (18+)", "calc.kids": "Children", "calc.elec": "10 A electricity", "calc.total": "Estimate", "calc.tax": "including tourist tax", "calc.note": "Indicative estimate based on the 2026 rates shown. Rentals run Saturday to Saturday by the week; the exact price is confirmed when you book.", "calc.weeks": "week(s)", "calc.camp": "Pitch for a tent, caravan or motorhome", "piscine.h": "Pool and paddling pool", "piscine.lead": "An 18 × 8 m swimming pool, a paddling pool for little ones, and a large sun terrace with loungers.", "piscine.p1": "A few lengths first thing, a cooling dip in the afternoon, then a nap on a lounger.", "piscine.p2": "Children splash about in the paddling pool while you keep an eye on them. And for open water, the Dordogne is at the end of the campsite.", "piscine.infos": "Open May to end of September (weather permitting) · 10am to 8pm · swim shorts not allowed · children must be accompanied by an adult", "riv.h": "The pebble beach", "riv.lead": "Direct access to the Dordogne: it is how we got our name.", "riv.bain.h": "Wild swimming", "riv.bain": "Clear, calm water at the foot of the cliffs. The river is lined with sand and pebble beaches where you can swim safely.", "riv.peche.h": "Freshwater fishing", "riv.peche": "The Dordogne is one of the finest rivers in France for fly fishing: roach, bleak, chub, pike, zander, perch. We issue fishing permits.", "riv.canoe.h": "Canoeing on the Dordogne", "riv.canoe": "Our partner Canoë Vacances, in La Roque-Gageac (3 km), picks you up at the campsite in high season, at a special rate.", "loisirs.h": "Activities and entertainment", "loisirs.lead": "There is something for every age: playground, trampolines, table tennis, pétanque, and themed evenings in summer.", "anim.jeunes.h": "For the youngest", "anim.jeunes": "Playground for ages 3-8: slide, little tunnel, rope bridge, spring and see-saw rides. Then the trampolines.", "anim.tous.h": "For young and old", "anim.tous": "Table tennis, table football and, of course, pétanque: don't forget your boules.", "anim.soir.h": "Evenings", "anim.soir": "Every Friday evening in high season, a themed meal with music: paella, mussels and chips…", "act.h": "Around the campsite", "act.items": [["Horse riding", "Ferme équestre de Simon in Cénac-et-Saint-Julien (7.8 km): lessons, courses, rides · L'Étrier de Vitrac (11.9 km): courses, outings"], ["Golf", "Souillac Golf & Country Club, 18 holes, La Chapelle-Auzac (40.1 km) · Golf de la Forge, 9 holes, Siorac-en-Périgord (20.5 km)"], ["Canoe and kayak", "Canoë Vacances in La Roque-Gageac (3 km): shuttle from the campsite in high season, special rate"], ["Mountain biking", "Bike hire at Bike Bus in Castelnaud-la-Chapelle (2.5 km), at the start of the greenway"], ["Adventure park", "Airparc Périgord in Saint-Vincent-de-Cosse (8.7 km): treetop courses, zip lines, rope bridges"], ["Paintball", "Périgord Paintball in Vézac (1.7 km), on hilly, wooded ground"], ["Tennis", "Tennis Club de Vitrac (8.7 km): school and court booking"], ["Hot-air ballooning", "Montgolfières du Périgord in La Roque-Gageac (3 km): the Dordogne seen from the sky"], ["Gabares", "Gabares Norbert and Gabares Caminade in La Roque-Gageac (1.2 km) · Gabares de Beynac (3.8 km)"], ["In the air", "ULM Dordogne in Domme: 06 81 88 03 98 · 05 53 29 71 35"], ["Climbing and caving", "Couleurs Périgord in Vézac (3 km)"], ["Fishing", "Fishing permits available at the campsite reception"], ["Via ferrata", "Cliff course at the Jardins de Marqueyssac (2.5 km)"]], "aqua.h": "Aquarium Périgord Noir", "aqua.p": "Europe's largest private freshwater aquarium, in Le Bugue: 70 tanks, more than 6,000 animals, and the Alligator Park, where you can feed baby alligators at the Ferme du Bayou.", "serv.h": "Campsite services", "serv.lead": "A team that loves its region and will gladly advise you on visits, outings and events not to be missed.", "serv.accueil": "Reception open 8am to 8pm · languages spoken: French, English, German · tourist information", "serv.items": "Sanitary block open 24 hours a day · laundry (2 washing machines, 1 dryer, tokens from reception) · iron and ironing board to borrow · motorhome service area · electric charging point, free for our guests · free wifi throughout the campsite · baby cot, high chair and booster seat to borrow · charcoal barbecues to borrow · bar with TV · snack bar · small emergency grocery · bread and pastries ordered here · fridge hire · disposable sheets for sale", "serv.animaux": "Pets are welcome on the campsite, but not in the rentals. Up-to-date vaccination record required; category 1 and 2 dogs are not allowed.", "serv.courses": "A small shop and a bakery 1 km away, supermarkets 3 km away.", "snack.h": "The snack bar", "snack.lead": "Open every day from 8am to 11pm, mid-June to mid-September.", "snack.p1": "A coffee in the morning, a cold drink at aperitif time, an ice cream after your nap. Takeaway or eat in: pizzas, hot dogs, chips, crêpes.", "snack.p2": "On the large terrace: beers, cocktails, Bergerac wine, sodas, smoothies. And we watch the Tour de France, the Olympic Games or the World Cup together.", "emp.h": "Pitches for tents, caravans and motorhomes", "emp.lead": "Pitches of about 100 m², in shade or sun, at the foot of the golden cliffs and on the banks of the Dordogne.", "emp.items": "1 vehicle per pitch · 10 A electricity (European plug required) · water points nearby · sanitary facilities open 24 hours a day with accessible area and baby area · washing-up sinks · laundry · free wifi · standing barbecues allowed (gas, electric or charcoal) · motorhome service area · free charging point for electric cars", "tarifs.h": "2026 rates", "tarifs.lead": "Book by phone on 05 53 29 50 83 or 06 83 36 41 68, or online.", "tarifs.loc": "Rentals (price per week, Saturday to Saturday)", "tarifs.camp": "Camping (price per night)", "tarifs.camp.a": "2 people + pitch + vehicle", "tarifs.camp.b": "2 people + pitch + vehicle + 10 A electricity", "tarifs.camp.c": "Child (under 7)", "tarifs.camp.d": "Extra person (7 and over)", "tarifs.basse": "Low season", "tarifs.haute": "High season (6 July-24 August)", "tarifs.taxe": "Tourist tax: €0.66 per day and per adult over 18.", "tarifs.draps": "Disposable sheets: single bed €7, double bed €12.", "tarifs.horaires": "Rentals: arrival from 3pm, departure before 10am · pitches: arrival from 12 noon, departure before 12 noon.", "tarifs.treck": "Canada Treck tent (2 people): low season €45/night, €40/night beyond 7 days · high season €50/night, €45/night beyond 7 days.", "tarifs.check": "Two amounts differ on your current website between the Rates page and the product pages (Canada tent, Treck tent): the mock-up uses the product pages, to be confirmed with you.", "rh.name": "Rapidhome mobile home", "rh.short": "27 m² · 2 bedrooms · 4 people · TV, wifi · shower room and WC", "rh.desc": "Alizé model: 1 bedroom with a 140 × 190 bed, 1 bedroom with two 80 × 190 beds · shower room with basin, separate WC · lounge with television, electric heating, free wifi · fitted kitchen: fridge, 12-place dishwasher, 4-burner gas hob, extractor hood, microwave, crockery · built-in covered terrace of 8 m² with garden furniture", "lou.name": "Louisiane mobile home", "lou.short": "30 m² · 2 bedrooms · 4 people · TV, wifi · shower room and WC", "lou.desc": "Grand Large model: 1 bedroom with a 140 × 190 bed, 1 bedroom with two 80 × 190 beds · shower room with basin, separate WC · lounge with television, electric heating, free wifi · fitted kitchen: fridge, 12-place dishwasher, 4-burner gas hob, extractor hood, microwave, crockery · semi-covered terrace of 15 m² with garden furniture", "can.name": "Canada tent", "can.short": "32 m² · 2 bedrooms · 4/5 people · wifi · campsite sanitary facilities", "can.desc": "1 bedroom with a 140 × 190 bed, 1 bedroom with three 80 × 190 beds · fitted kitchen: fridge, induction hob, coffee maker, microwave, crockery · covered terrace with garden furniture · wooden floor · electricity · sanitary block nearby", "trk.name": "Canada Treck tent", "trk.short": "12 m² · 1 bedroom · 2 people · wifi · fridge", "trk.desc": "1 bedroom with a 140 × 190 bed · fridge · covered terrace with garden furniture · wooden floor · electricity · sanitary block nearby. Ideal for hikers, couples travelling light and campers passing through.", "photo.credit": "Photo credits: © Stéphane Porte (some photos of the rentals and activities).", "al.h": "The Dordogne valley, at the end of the path", "al.lead": "In the heart of the Golden Triangle, among cliffs, hilltop villages and prehistoric caves.", "al.p": "The Dordogne is rich in historic and prehistoric heritage, unspoiled nature and generous regional cooking: relaxation, outdoors, culture and good food.", "al.sarlat.h": "Sarlat", "al.sarlat.k": "12 km", "al.sarlat": "The pearl of the Périgord Noir, a town of art and history, medieval and Renaissance: Saint-Sacerdos cathedral, Lanterne des Morts, Hôtel Plamon, La Boétie's house, Hôtel de Vienne, Présidial. A capital of good food: truffles, foie gras, ceps, walnuts. Markets on Wednesday and Saturday, covered market in Sainte-Marie church in season. Truffle Festival (mid-January), Fest'oie (early March), Journées du Terroir (Ascension).", "al.roque.h": "La Roque-Gageac", "al.roque.k": "1 km", "al.roque": "One of the most beautiful villages in France, at the foot of limestone cliffs: troglodyte dwellings, the Jardin exotique, the Ferme fleurie garden (4,000 m²), and a trip by gabare.", "al.lascaux.h": "Lascaux", "al.lascaux.k": "39 km", "al.lascaux": "Discovered in 1940 by four teenagers, closed to the public in 1963. Lascaux 2 (1983), then Lascaux 4 (2016), a full replica: 2,000 painted and engraved figures, more than 600 animals, and a workshop to try the techniques of cave dwellers.", "al.eyzies.h": "Les Eyzies-de-Tayac", "al.eyzies.k": "24 km", "al.eyzies": "Cro-Magnon country: some fifteen UNESCO-listed sites, the Combarelles cave, the Font-de-Gaume cave, the Cro-Magnon shelter and the National Museum of Prehistory.", "al.castel.h": "Castelnaud-la-Chapelle", "al.castel.k": "2 km", "al.castel": "One of the most beautiful villages in France, where the Dordogne meets the Céou. Castelnaud fortress and its medieval weapons; the Château des Milandes, home of Joséphine Baker, with birds of prey shows.", "al.marq.h": "Jardins de Marqueyssac", "al.marq.k": "3 km", "al.marq": "The most visited garden in the Périgord: 22 hectares, 6 km of paths, 150,000 hand-clipped box trees, and the great viewpoint over Beynac, Castelnaud, La Roque-Gageac and Domme.", "al.credit": "Photo credits: OT Sarlat Périgord Noir (M. Anglada, D. Repérant), Thomas Lambelin / SDHPA Dordogne, Mairie des Eyzies, Les Jardins de Marqueyssac (Laugery).", "avis.h": "What our campers say", "avis.src": "Reviews published on your current website", "actu.h": "Campsite news", "actu.borne": "New fast charging point for electric vehicles: charge your car at the campsite, free for our guests.", "actu.site": "2017 archive: the campsite launched a website that works on computers, smartphones and tablets.", "actu.agenda": "The Périgord events calendar (May to December) from your current website will be carried over at installation.", "contact.h": "Contact & directions", "contact.addr": "Camping *** La Plage · La Malartrie · 24220 Vézac", "contact.gps": "GPS: 44°49'28.2\" N 1°10'10.2\" E", "contact.form.h": "Write to us", "f.nom": "Name", "f.email": "E-mail", "f.tel": "Phone", "f.dates": "Preferred dates", "f.msg": "Your message", c.heb": "Alojamiento", "calc.period": "Periodo", "calc.nights": "Noches", "calc.adults": "Adultos (+ 18 años)", "calc.kids": "Niños", "calc.elec": "Electricidad 10 A", "calc.total": "Estimación", "calc.tax": "incluida tasa turística", "calc.note": "Estimación orientativa según las tarifas 2026 publicadas. Los alquileres se contratan por semanas, de sábado a sábado; el precio exacto se confirma al reservar.", "calc.weeks": "semana(s)", "calc.camp": "Parcela para tienda, caravana o autocaravana", "piscine.h": "Piscina y chapoteadero", "piscine.lead": "Una piscina de 18 × 8 m, un chapoteadero para los pequeños y un amplio solárium con tumbonas.", "piscine.p1": "Unos largos desde primera hora, un chapuzón para refrescarse por la tarde y una siesta en la tumbona.", "piscine.p2": "Los niños chapotean en el chapoteadero bajo la mirada de sus padres. Y para el agua viva, el Dordoña está al final del camping.", "piscine.infos": "Abierta de mayo a finales de septiembre (según el tiempo) · de 10:00 a 20:00 · prohibido el bañador tipo bermuda · niños acompañados de un adulto", "riv.h": "La playa de guijarros", "riv.lead": "Acceso directo al Dordoña: de ahí viene nuestro nombre.", "riv.bain.h": "Baño en el río", "riv.bain": "Agua clara y tranquila, a los pies de los acantilados. El río está bordeado de playas de arena y guijarros donde se puede nadar sin riesgo.", "riv.peche.h": "Pesca de agua dulce", "riv.peche": "El Dordoña es uno de los ríos más bellos de Francia para la pesca con mosca: gardí, alburno, cachuelo, lucio, lucioperca, perca. Expedimos las licencias de pesca.", "riv.canoe.h": "Canoa en el Dordoña", "riv.canoe": "Nuestro socio Canoë Vacances, en La Roque-Gageac (3 km), pasa a recogerle al camping en temporada alta, con tarifa preferente.", "loisirs.h": "Ocio y animación", "loisirs.lead": "Hay para todas las edades: zona de juegos, camas elásticas, ping-pong, petanca y veladas temáticas en verano.", "anim.jeunes.h": "Para los más pequeños", "anim.jeunes": "Zona de e comer a los bebés caimán en la Ferme du Bayou.", "serv.h": "Servicios del camping", "serv.lead": "Un equipo que quiere a su región y le aconseja sobre visitas, excursiones y citas imprescindibles.", "serv.accueil": "Recepción abierta de 8:00 a 20:00 · idiomas: francés, inglés, alemán · información turística", "serv.items": "Bloque sanitario abierto las 24 horas · lavandería (2 lavadoras, 1 secadora, fichas en recepción) · préstamo de plancha y tabla de planchar · área de servicio para autocaravanas · punto de recarga eléctrica, gratuito para nuestros clientes · wifi gratuito en todo el camping · préstamo de cuna, trona y alzador · préstamo de barbacoas de carbón · bar con TV · snack · tienda de urgencia · pan y bollería por encargo · alquiler de neveras · venta de sábanas desechables", "serv.animaux": "Se admiten animales en el camping, salvo en los alquileres. Cartilla de vacunación al día; prohibidos los perros de categorías 1 y 2.", "serv.courses": "Pequeño comercio y panadería a 1 km, supermercados a 3 km.", "snack.h": "El snack-bar", "snack.lead": "Abierto todos los días de 8:00 a 23:00, de mediados de junio a mediados de septiembre.", "snack.p1": "Un café por la mañana, una bebida fresca a la hora del aperitivo, un helado después de la siesta. Para llevar o para tomar allí: pizzas, perritos calientes, patatas fritas, crepes.", "snack.p2": "En la gran terraza: cervezas, cócteles, vino de Bergerac, refrescos, batidos. Y allí vemos juntos el Tour de Francia, los Juegos Olímpicos o el Mundial.", "emp.h": "Parcelas para tienda, caravana y autocaravana", "emp.lead": "Parcelas de unos 100 m², a la sombra o al sol, al pie de los acantilados dorados y a orillas del Dordoña.", "emp.items": "1 vehículo por parcela · electricidad 10 A (se necesita enchufe europeo) · puntos de agua cercanos · sanitarios abiertos las 24 horas con espacio para personas con movilidad reducida y espacio para bebés · fregaderos · lavandería · wifi gratuito · barbacoas de pie permitidas (gas, , Journées du Terroir (Ascensión).", "al.roque.h": "La Roque-Gageac", "al.roque.k": "1 km", "al.roque": "Uno de los pueblos más bonitos de Francia, a los pies de acantilados de roca caliza: viviendas trogloditas, Jardin exotique, jardín de la Ferme fleurie (4.000 m²) y paseo en gabarra.", "al.lascaux.h": "Lascaux", "al.lascaux.k": "39 km", "al.lascaux": "Descubierta en 1940 por cuatro adolescentes, cerrada al público en 1963. Lascaux 2 (1983) y después Lascaux 4 (2016), réplica íntegra: 2.000 figuras pintadas y grabadas, más de 600 animales y un taller para iniciarse en las técnicas de los hombres de las cavernas.", "al.eyzies.h": "Les Eyzies-de-Tayac", "al.eyzies.k": "24 km", "al.eyzies": "Tierra de Cromañón: una quincena de sitios declarados por la Unesco, la cueva de Les Combarelles, la cueva de Font-de-Gaume, el abrigo de Cro-Magnon y el Museo Nacional de Prehistoria.", "al.castel.h": "Castelnaud-la-Chapelle", "al.castel.k": "2 km", "al.castel": "Uno de los pueblos más bonitos de Francia, en la confluencia del Dordoña y el Céou. El castillo de Castelnaud y sus armas medievales; el castillo de Les Milandes, hogar de Joséphine Baker, con espectáculos de aves rapaces.", "al.marq.h": "Jardins de Marqueyssac", "al.marq.k": "3 km", "al.marq": "El jardín más visitado del Périgord: 22 hectáreas, 6 km de paseos, 150.000 bojes podados a mano y el gran mirador sobre Beynac, Castelnaud, La Roque-Gageac y Domme.", "al.credit": "Créditos fotográficos: OT Sarlat Périgord Noir (M. Anglada, D. Repérant), Thomas Lambelin / SDHPA Dordogne, Mairie des Eyzies, Les Jardins de Marqueyssac (Laugery).", "avis.h": "Lo que dicen nuestros campistas", "avis.src": "Opiniones publicadas en su sitio web actual", "actu.h": "Novedades del camping", "actu.borne": "Nuevo punto de recarga rápida para vehículos eléctricos: cargue su coche en el camping, gratis para nuestros clientes.", "actu.site": "Archivo 2017: el camping estrenaba un sitio web compatible con ordenadores, smartphones y tabletas.", 8 m, Mobilheime und ausgestattete Zelte.", "home.season": "Saison 2026: vom 15. März bis 18. Oktober.", "home.cta.calc": "Meinen Aufenthalt berechnen", "home.skip": "Steine flitschen", "plage.h": "Ein Kiesstrand ganz für Sie", "plage.p": "Vom Campingplatz sind es nur wenige Schritte bis zur Dordogne: zum Baden, Angeln oder für eine Kanufahrt. Abends ziehen die Heißluftballons über das Wasser.", "plage.cta": "Hinunter zum Fluss", "heb.h": "Vier Arten, hier zu übernachten", "heb.p": "Jede Unterkunft hat ihre eigene Terrasse mit Gartenmöbeln. Überall kostenloses WLAN.", "calc.h": "Was kostet Ihr Aufenthalt?", "calc.p": "Wählen Sie eine Unterkunft, einen Zeitraum und die Zahl der Nächte: Der Preis richtet sich nach unseren Preisen 2026.", "calc.heb": "Unterkunft", "calc.period": "Zeitraum", "calc.nights": "Nächte", "calc.adults": "Erwachsene (ab 18 Jahren)", "calc.kids": "Kinder", "calc.elec": "Strom 10 A", "calc.total": "Schätzung", "calc.tax": "darin Kurtaxe", "calc.note": "Unverbindliche Schätzung auf Grundlage der angezeigten Preise 2026. Mietunterkünfte werden wochenweise von Samstag bis Samstag vermietet; der genaue Preis wird bei der Buchung bestätigt.", "calc.weeks": "Woche(n)", "calc.camp": "Stellplatz für Zelt, Wohnwagen oder Wohnmobil", "piscine.h": "Schwimmbad und Planschbecken", "piscine.lead": "Ein Schwimmbecken von 18 × 8 m, ein Planschbecken für die Kleinen und eine große Sonnenterrasse mit Liegen.", "piscine.p1": "Ein paar Bahnen gleich am Morgen, nachmittags eine Abkühlung, dann ein Nickerchen auf der Liege.", "piscine.p2": "Die Kinder planschen im Planschbecken unter den Augen der Eltern. Und für frisches Flusswasser liegt die Dordogne am Ende des Campingplatzes.", "piscine.infos": "Geöffnet von Mai bis Ende September (wetterabhängig) · von 10 bis 20 Uhr · Badeshorts nicht erlaubt · Kinder nur in Begleitung eines Erwachsenen", "riv.h": "Der Kiesstrand", "riv.lead": "Direkter Zugang zur Dordogne: Daher haben wir unseren Namen.", "riv.bain.h": "Baden im Fluss", "riv.bain": "Klares, ruhiges Wasser am Fuß der Felsen. Der Fluss ist von Sand- und Kiesstränden gesäumt, an denen man gefahrlos baden kann.", "riv.peche.h": "Süßwasserangeln", "riv.peche": "Die Dordogne zählt zu den schönsten Flüssen Frankreichs für das Fliegenfischen: Rotauge, Laube, Döbel, Hecht, Zander, Barsch. Wir geben die Angelscheine aus.", "riv.canoe.h": "Kanu auf der Dordogne", "riv.canoe": "Unser Partner Canoë Vacances in La Roque-Gageac (3 km) holt Sie in der Hochsaison am Campingplatz ab, zu einem Vorzugspreis.", "loisirs.h": "Freizeit und Animation", "loisirs.lead": "Für jedes Alter ist etwas dabei: Spielplatz, Trampoline, Tischtennis, Pétanque und im Sommer Themenabende.", "anim.jeunes.h": "Für die Jüngsten", "anim.jeunes": "Spielplatz für 3- bis 8-Jährige: Rutsche, kleiner Tunnel, Affenbrücke, Feder- und Wippgeräte. Dazu die Trampoline.", "anim.tous.h": "Für Klein und Groß", "anim.tous": "Tischtennisplatten, Tischkicker und natürlich Pétanque: Vergessen Sie Ihre Kugeln nicht.", "anim.soir.h": "Die Abende", "anim.soir": "In der Hochsaison jeden Freitagabend ein Themenessen mit Musik: Paella, Muscheln mit Pommes …", "act.h": "Rund um den Campingplatz", "act.items": [["Reiten", "Ferme équestre de Simon in Cénac-et-Saint-Julien (7,8 km): Unterricht, Kurse, Ausritte · L'Étrier de Vitrac (11,9 km): Kurse, Ausritte"], ["Golf", "Souillac Golf & Country Club, 18 Löcher, La Chapelle-Auzac (40,1 km) · Golf de la Forge, 9 Löcher, Siorac-en-Périgord (20,5 km)"], ["Kanu und Kajak", "Canoë Vacances in La Roque-Gageac (3 km): in der Hochsaison Shuttle ab Campingplatz, Vorzugspreis"], ["Mountainbike", "Verleih bei Bike Bus in Castelnaud-la-Chapelle (2,5 km), am Beginn des Radwegs"], ["Abenteuerpark", "Airparc Périgord in Saint-Vincent-de-Cosse (8,7 km): Hochseilgarten, Seilrutschen, Affenbrücken"], ["Paintball", "Périgord Paintball in Vézac (1,7 km), auf hügeligem, bewaldetem Gelände"], ["Tennis", "Tennis Club de Vitrac (8,7 km): Tennisschule und Kursbuchung"], ["Heißluftballon", "Montgolfières du Périgord in La Roque-Gageac (3 km): die Dordogne aus der Luft"], ["Gabares", "Gabares Norbert und Gabares Caminade in La Roque-Gageac (1,2 km) · Gabares de Beynac (3,8 km)"], ["In der Luft", "ULM Dordogne in Domme: 06 81 88 03 98 · 05 53 29 71 35"], ["Klettern und Höhlenforschung", "Couleurs Périgord in Vézac (3 km)"], ["Angeln", "Angelscheine erhalten Sie an der Rezeption des Campingplatzes"], ["Klettersteig", "Felsroute in den Jardins de Marqueyssac (2,5 km)"]], "aqua.h": "Aquarium Périgord Noir", "aqua.p": "Das größte private Süßwasseraquarium Europas in Le Bugue: 70 Becken, mehr als 6.000 Tiere und der Alligator Park, wo man auf der Ferme du Bayou junge Alligatoren füttern kann.", "serv.h": "Service auf dem Campingplatz", "serv.lead": "Ein Team, das seine Region liebt und Sie gern zu Besichtigungen, Ausflügen und lohnenden Terminen berät.", "serv.accueil": "Rezeption von 8 bis 20 Uhr geöffnet · gesprochene Sprachen: Französisch, Englisch, Deutsch · Touristeninformationen", "serv.items": "Sanitärgebäude rund um die Uhr geöffnet · Waschküche (2 Waschmaschinen, 1 Trockner, Münzen an der Rezeption) · Bügeleisen und Bügelbrett zum Ausleihen · Entsorgungsstation für Wohnmobile · Ladestation für Elektrofahrzeuge, für unsere Gäste kostenlos · kostenloses WLAN auf dem gesamten Platz · Babybett, Hochstuhl und Sitzerhöhung zum Ausleihen · Holzkohlegrills zum Ausleihen · Bar mit TV · Snack · kleiner Laden für das Nötigste · Brot und Gebäck auf Bestellung · Kühlschrank-Vermietung · Verkauf von Einwegbettwäsche", "serv.animaux": "Haustiere sind auf dem Campingplatz erlaubt, nicht aber in den Mietunterkünften. Gültiger Impfpass erforderlich; Hunde der Kategorien 1 und 2 sind nicht erlaubt.", "serv.courses": "Kleiner Supermarkt und Bäckerei in 1 km, Supermärkte in 3 km Entfernung.", "snack.h": "Die Snackbar", "snack.lead": "Täglich von 8 bis 23 Uhr geöffnet, von Mitte Juni bis Mitte September.", "snack.p1": "Morgens ein Kaffee, zum Aperitif ein kühles Getränk, nach dem Mittagsschlaf ein Eis. Zum Mitnehmen oder vor Ort: Pizza, Hotdogs, Pommes, Crêpes.", "snack.p2": "Auf der großen Terrasse: Bier, Cocktails, Wein aus Bergerac, Softdrinks, Smoothies. Und hier schauen wir gemeinsam die Tour de France, die Olympischen Spiele oder die Weltmeisterschaft.", "emp.h": "Stellplätze für Zelt, Wohnwagen und Wohnmobil", "emp.lead": "Parzellen von etwa 100 m², im Schatten oder in der Sonne, am Fuß der goldenen Felsen und direkt an der Dordogne.", "emp.items": "1 Fahrzeug pro Stellplatz · Strom 10 A (europäischer Stecker erforderlich) · Wasserstellen in der Nähe · Sanitäranlagen rund um die Uhr geöffnet, mit Bereich für Menschen mit eingeschränkter Mobilität und Babybereich · Spülbecken · Waschküche · kostenloses WLAN · Standgrills erlaubt (Gas, Elektro oder Holzkohle) · Entsorgungsstation für Wohnmobile · kostenlose Ladestation für Elektroautos", "tarifs.h": "Preise 2026", "tarifs.lead": "Buchen Sie telefonisch unter 05 53 29 50 83 oder 06 83 36 41 68 oder online.", "tarifs.loc": "Mietunterkünfte (Preis pro Woche, von Samstag bis Samstag)", "tarifs.camp": "Camping (Preis pro Nacht)", "tarifs.camp.a": "2 Personen + Stellplatz + Fahrzeug", "tarifs.camp.b": "2 Personen + Stellplatz + Fahrzeug + Strom 10 A", "tarifs.camp.c": "Kind (unter 7 Jahren)", "tarifs.camp.d": "Zusätzliche Person (ab 7 Jahren)", "tarifs.basse": "Nebensaison", "tarifs.haute": "Hochsaison (6. Juli-24. August)", "tarifs.taxe": "Kurtaxe: 0,66 € pro Tag und pro Erwachsenem über 18 Jahre.", "tarifs.draps": "Einwegbettwäsche: Einzelbett 7 €, Doppelbett 12 €.", "tarifs.horaires": "Mietunterkünfte: Anreise ab 15 Uhr, Abreise vor 10 Uhr · Stellplätze: Anreise ab 12 Uhr, Abreise vor 12 Uhr.", "tarifs.treck": "Zelt Canada Treck (2 Pers.): Nebensaison 45 €/Nacht, 40 €/Nacht ab 7 Tagen · Hochsaison 50 €/Nacht, 45 €/Nacht ab 7 Tagen.", "tarifs.check": "Zwei Beträge weichen auf Ihrer aktuellen Website zwischen der Preisseite und den Unterkunftsseiten (Zelt Canada, Zelt Treck) voneinander ab: Der Entwurf übernimmt die Unterkunftsseiten, bitte mit Ihnen abzustimmen.", "rh.name": "Mobilheim Rapidhome", "rh.short": "27 m² · 2 Schlafzimmer · 4 Pers. · TV, WLAN · Duschbad und WC", "rh.desc": "Modell Alizé: 1 Schlafzimmer mit Bett 140 × 190, 1 Schlafzimmer mit 2 Betten 80 × 190 · Duschbad mit Waschbecken, separates WC · Wohnbereich mit Fernseher, Elektroheizung, kostenlosem WLAN · ausgestattete Küche: Kühlschrank, Geschirrspüler für 12 Gedecke, Gaskochfeld mit 4 Flammen, Dunstabzugshaube, Mikrowelle, Geschirr · integrierte überdachte Terrasse von 8 m² mit Gartenmöbeln", "lou.name": "Mobilheim Louisiane", "lou.short": "30 m² · 2 Schlafzimmer · 4 Pers. · TV, WLAN · Duschbad und WC", "lou.desc": "Modell Grand Large: 1 Schlafzimmer mit Bett 140 × 190, 1 Schlafzimmer mit 2 Betten 80 × 190 · Duschbad mit Waschbecken, separates WC · Wohnbereich mit Fernseher, Elektroheizung, kostenlosem WLAN · ausgestattete Küche: Kühlschrank, Geschirrspüler für 12 Gedecke, Gaskochfeld mit 4 Flammen, Dunstabzugshaube, Mikrowelle, Geschirr · teilüberdachte Terrasse von 15 m² mit Gartenmöbeln", "can.name": "Zelt Canada", "can.short": "32 m² · 2 Schlafzimmer · 4/5 Pers. · WLAN · Sanitäranlagen des Campingplatzes", "can.desc": "1 Schlafzimmer mit Bett 140 × 190, 1 Schlafzimmer mit 3 Betten 80 × 190 · ausgestattete Küche: Kühlschrank, Induktionskochfeld, Kaffeemaschine, Mikrowelle, Geschirr · überdachte Terrasse mit Gartenmöbeln · Holzboden · Strom · Sanitärgebäude in der Nähe", "trk.name": "Zelt Canada Treck", "trk.short": "12 m² · 1 Schlafzimmer · 2 Pers. · WLAN · Kühlschrank", "trk.desc": "1 Schlafzimmer mit Bett 140 × 190 · Kühlschrank · überdachte Terrasse mit Gartenmöbeln · Holzboden · Strom · Sanitärgebäude in der Nähe. Ideal für Wanderer, Paare mit leichtem Gepäck und Durchreisende.", "photo.credit": "Bildnachweis: © Stéphane Porte (einige Fotos der Mietunterkünfte und der Animation).", "al.h": "Das Dordogne-Tal, am Ende des Weges", "al.lead": "Im Herzen des Goldenen Dreiecks, zwischen Felsen, Dörfern auf den Höhen und prähistorischen Höhlen.", "al.p": "Die Dordogne ist reich an historischem und prähistorischem Erbe, unberührter Natur und herzhafter regionaler Küche: Faulenzen, Natur, Kultur und Genuss.", "al.sarlat.h": "Sarlat", "al.sarlat.k": "12 km", "al.sarlat": "Die Perle des Périgord Noir, Stadt der Kunst und Geschichte, mittelalterlich und Renaissance: Kathedrale Saint-Sacerdos, Lanterne des Morts, Hôtel Plamon, Haus von La Boétie, Hôtel de Vienne, Présidial. Hauptstadt der Genüsse: Trüffel, Foie gras, Steinpilze, Walnüsse. Märkte mittwochs und samstags, in der Saison Markthalle in der Kirche Sainte-Marie. Trüffelfest (Mitte Januar), Fest'oie (Anfang März), Journées du Terroir (Christi Himmelfahrt).", "al.roque.h": "La Roque-Gageac", "al.roque.k": "1 km", "al.roque": "Eines der schönsten Dörfer Frankreichs, am Fuß von Kalksteinfelsen: Höhlenwohnungen, Jardin exotique, Garten der Ferme fleurie (4.000 m²) und eine Fahrt mit der Gabare.", "al.lascaux.h": "Lascaux", "al.lascaux.k": "39 km", "al.lascaux": "1940 von vier Jugendlichen entdeckt, 1963 für die Öffentlichkeit geschlossen. Lascaux 2 (1983), dann Lascaux 4 (2016), eine vollständige Nachbildung: 2.000 gemalte und gravierte Figuren, mehr als 600 Tiere und eine Werkstatt, in der man die Techniken der Höhlenmenschen ausprobieren kann.", "al.eyzies.h": "Les Eyzies-de-Tayac", "al.eyzies.k": "24 km", "al.eyzies": "Das Land des Cro-Magnon: rund fünfzehn UNESCO-Stätten, die Grotte des Combarelles, die Grotte de Font-de-Gaume, der Abri Cro-Magnon und das Nationale Museum für Vorgeschichte.", "al.castel.h": "Castelnaud-la-Chapelle", "al.castel.k": "2 km", "al.castel": "Eines der schönsten Dörfer Frankreichs, am Zusammenfluss von Dordogne und Céou. Die Burg Castelnaud mit ihren mittelalterlichen Waffen; das Château des Milandes, Wohnsitz von Joséphine Baker, mit Greifvogelshows.", "al.marq.h": "Jardins de Marqueyssac", "al.marq.k": "3 km", "al.marq": "Der meistbesuchte Garten des Périgord: 22 Hektar, 6 km Spazierwege, 150.000 von Hand geschnittene Buchsbäume und der große Aussichtspunkt über Beynac, Castelnaud, La Roque-Gageac und Domme.", "al.credit": "Bildnachweis: OT Sarlat Périgord Noir (M. Anglada, D. Repérant), Thomas Lambelin / SDHPA Dordogne, Mairie des Eyzies, Les Jardins de Marqueyssac (Laugery).", "avis.h": "Was unsere Camper sagen", "avis.src": "Auf Ihrer aktuellen Website veröffentlichte Bewertungen", "actu.h": "Neuigkeiten vom Campingplatz", "actu.borne": "Neue Schnellladestation für Elektrofahrzeuge: Laden Sie Ihr Auto auf dem Campingplatz, für unsere Gäste kostenlos.", "actu.site": "Archiv 2017: Der Campingplatz erhielt eine Website für Computer, Smartphones und Tablets.", "actu.agenda": "Der Veranstaltungskalender des Périgord (Mai bis Dezember) von Ihrer aktuellen Website wird bei der Installation übernommen.", "contact.h": "Kontakt & Anfahrt", "contact.addr": "Camping *** La Plage · La Malartrie · 24220 Vézac", "contact.gps": "GPS: 44°49'28.2\" N 1°10'10.2\" E", "contact.form.h": "Schreiben Sie uns", "f.nom": "Name", "f.email": "E-Mail", "f.tel": "Telefon", "f.dates": "Gewünschte Daten", "f.msg": "Ihre Nachricht", "f.send": "Senden", "f.ok": "Vielen Dank! In der Online-Version geht Ihre Nachricht an den Campingplatz. Hier handelt es sich um einen Entwurf: Es wird nichts gesendet.", "f.err": "Es fehlen Ihr Name sowie eine E-Mail-Adresse oder eine Telefonnummer.", "f.projet": "Aus „Mein Aufenthalt“:", "mine.h": "Mein Aufenthalt", "mine.empty": "Noch nichts. Fügen Sie von den Seiten aus eine Unterkunft oder eine Aktivität hinzu.", "mine.go": "Verfügbarkeit anfragen", "mentions.h": "Impressum", "mentions.p": "Camping La Plage, betrieben von SARL La Malartrie, La Malartrie, 24220 Vézac. Der vollständige Text des Impressums und der Datenschutzerklärung Ihrer aktuellen Website wird bei der Installation übernommen.", "conf.h": "Datenschutzerklärung", "conf.p": "Die Formulardaten dienen ausschließlich der Beantwortung Ihrer Anfrage. Der vollständige Text Ihrer aktuellen Erklärung wird bei der Installation übernommen.", "foot.tag": "3-Sterne-Campingplatz an der Dordogne, in Vézac, zwischen La Roque-Gageac und Castelnaud.", "foot.maquette": "Vorschlag zur Neugestaltung von Neovera Studio — unverbindlicher Entwurf.", "foot.meteo": "Wetter in Vézac", "bot.name": "La Plage Conseil", "bot.sub": "Ich helfe Ihnen bei der Wahl", "bot.virtual": "Virtueller Assistent", "bot.hello": "Guten Tag! Ich bin der virtuelle Assistent des Camping La Plage. Unterkünfte, Preise, Schwimmbad, Fluss, Ausflüge: Stellen Sie mir Ihre Frage.", "bot.invite": "Eine Frage zu Ihrem Aufenthalt an der Dordogne?", "bot.ph": "Schreiben Sie Ihre Frage …", "bot.send": "Senden", "bot.chips": ["Welche Unterkunft für 5?", "Preise im August", "Sind Hunde erlaubt?", "Im Fluss baden", "Was besichtigen?", "Buchen"], "bot.unknown": "Ich bin nicht sicher, ob ich das gut beantworten kann. Am einfachsten: Rufen Sie den Campingplatz unter 05 53 29 50 83 oder 06 83 36 41 68 an oder schreiben Sie an campinglaplage24@orange.fr.", "bot.a.heb": "Für 4: Mobilheime Rapidhome oder Louisiane (eigenes Duschbad). Für 5: das Zelt Canada (2 Schlafzimmer, 4/5 Pers.). Für 2 mit leichtem Gepäck: das Zelt Canada Treck.", "bot.a.prix": "Im Sommer (6. Juli-24. August): Rapidhome 850 €/Woche, Louisiane 950 €, Zelt Canada 565 €, Treck 50 €/Nacht; Stellplatz für 2 Pers. + Fahrzeug 23,80 €/Nacht. Der Rechner gibt Ihnen eine Schätzung.", "bot.a.basse": "Außerhalb des Sommers: Rapidhome ab 350 €/Woche, Louisiane ab 410 €, Zelt Canada ab 290 €, Treck 45 €/Nacht; Stellplatz ab 15,80 €/Nacht.", "bot.a.chien": "Ja, Haustiere sind auf dem Campingplatz erlaubt, nicht aber in den Mietunterkünften. Gültiger Impfpass erforderlich; Hunde der Kategorien 1 und 2 sind nicht erlaubt.", "bot.a.riviere": "Unser Kiesstrand liegt direkt an der Dordogne: ruhiges Baden, Angeln (Angelscheine an der Rezeption) und Kanu mit unserem Partner, der Sie in der Hochsaison abholt.", "bot.a.piscine": "Schwimmbad von 18 × 8 m und Planschbecken, geöffnet von Mai bis Ende September, von 10 bis 20 Uhr. Badeshorts nicht erlaubt.", "bot.a.visiter": "In der Nähe: La Roque-Gageac (1 km), Castelnaud (2 km), Marqueyssac (3 km), Sarlat (12 km). Weiter weg: Les Eyzies (24 km), Lascaux (39 km).", "bot.a.resa": "Buchen Sie online über die Schaltfläche „Online buchen“ oder telefonisch unter 05 53 29 50 83.", "bot.a.dates": "Der Campingplatz ist vom 15. März bis 18. Oktober 2026 geöffnet. Mietunterkünfte: Anreise ab 15 Uhr, Abreise vor 10 Uhr, von Samstag bis Samstag.", "bot.a.wifi": "Kostenloses WLAN auf dem gesamten Campingplatz.", "bot.a.snack": "Die Snackbar ist täglich von 8 bis 23 Uhr geöffnet, von Mitte Juni bis Mitte September: Pizza, Pommes, Crêpes, Eis und in der Hochsaison freitags Themenessen.", "bot.a.recharge": "Ja: Ladestation für Elektroautos, für unsere Gäste kostenlos, und eine Entsorgungsstation für Wohnmobile.", "bot.a.langues": "An der Rezeption spricht man Französisch, Englisch und Deutsch.", "bot.a.draps": "Einwegbettwäsche zu kaufen: 7 € für das Einzelbett, 12 € für das Doppelbett.", "bot.a.bebe": "Babybett, Hochstuhl und Sitzerhöhung zum Ausleihen, je nach Verfügbarkeit, und ein Babybereich in den Sanitäranlagen.", "act.g.eau": "Auf dem Wasser", "act.g.air": "In der Höhe", "act.g.terre": "An Land"}, "it": {"meta.title": "Camping La Plage *** — Vézac, sulle rive della Dordogna, vicino a Sarlat", "ui.book": "Prenota online", "ui.call": "Chiama", "ui.more": "Vedi la pagina", "ui.back": "Indietro", "ui.close": "Chiudi", "ui.lang": "Lingua", "ui.from": "a partire da", "ui.week": "settimana", "ui.night": "notte", "ui.tour": "Visita virtuale", "ui.docs": "Documenti da scaricare", "ui.docs.list": "Brochure del campeggio · contratto di locazione · contratto di prenotazione campeggio · mappa del campeggio · condizioni generali di vendita · assicurazione annullamento", "ui.docs.note": "I PDF del vostro sito attuale saranno ripresi così come sono al momento dell'installazione.", "ui.mine": "Il mio soggiorno", "ui.add": "Aggiungi al mio soggiorno", "ui.added": "Aggiunto", "nav.locations": "Alloggi", "nav.emplacements": "Piazzole", "nav.tarifs": "Tariffe 2026", "nav.piscine": "Piscina", "nav.riviere": "Il fiume", "nav.loisirs": "Svago", "nav.services": "Servizi", "nav.snack": "Snack-bar", "nav.alentours": "Dintorni", "nav.avis": "Recensioni", "nav.actu": "Novità", "nav.contact": "Contatti e come arrivare", "nav.conseil": "La Plage Conseil", "nav.mentions": "Note legali", "nav.confidentialite": "Privacy", "nav.sejour": "Calcola il mio soggiorno", "top.open": "Aperto dal 15 marzo al 18 ottobre 2026 · reception 8-20", "home.h1": "La vostra tenda sulla Dordogna, con le scogliere di fronte.", "home.lead": "Un campeggio a 3 stelle a Vézac, a 1 km da La Roque-Gageac e a 12 km da Sarlat. Accesso diretto al fiume dalla nostra spiaggia di ciottoli, piscina di 18 × 8 m, case mobili e tende attrezzate.", "home.season": "Stagione 2026: dal 15 marzo al 18 ottobre.", "home.cta.calc": "Calcola il mio soggiorno", "home.skip": "Far rimbalzare il sasso", "plage.h": "Una spiaggia di ciottoli, tutta per voi", "plage.p": "Dal campeggio bastano pochi passi per fare il bagno nella Dordogna, pescare o partire in canoa. La sera le mongolfiere sorvolano l'acqua.", "plage.cta": "Scendere al fiume", "heb.h": "Quattro modi di dormire qui", "heb.p": "Ogni alloggio ha la sua terrazza e il suo salottino da giardino. Wi-fi gratuito ovunque.", "calc.h": "Quanto costa il vostro soggiorno?", "calc.p": "Scegliete un alloggio, un periodo e il numero di notti: il prezzo deriva dalle nostre tariffe 2026.", "calc.heb": "Alloggio", "calc.period": "Periodo", "calc.nights": "Notti", "calc.adults": "Adulti (+ 18 anni)", "calc.kids": "Bambini", "calc.elec": "Elettricità 10 A", "calc.total": "Stima", "calc.tax": "di cui tassa di soggiorno", "calc.note": "Stima indicativa basata sulle tariffe 2026 pubblicate. Gli alloggi si affittano da sabato a sabato in settimana; il prezzo esatto viene confermato alla prenotazione.", "calc.weeks": "settimana/e", "calc.camp": "Piazzola per tenda, roulotte o camper", "piscine.h": "Piscina e baby pool", "piscine.lead": "Una vasca da nuoto di 18 × 8 m, una vasca per i più piccoli, un ampio solarium con lettini.", "piscine.p1": "Qualche vasca al mattino, un tuffo rinfrescante nel pomeriggio, poi un pisolino su un lettino.", "piscine.p2": "I bambini sguazzano nella vasca bassa sotto lo sguardo dei genitori. E per l'acqua viva, la Dordogna è in fondo al campeggio.", "piscine.infos": "Aperta da maggio a fine settembre (secondo il meteo) · dalle 10 alle 20 · pantaloncini da bagno vietati · bambini accompagnati da un adulto", "riv.h": "La spiaggia di ciottoli", "riv.lead": "L'accesso diretto alla Dordogna: è da qui che prende il nome il nostro campeggio.", "riv.bain.h": "Bagni in libertà", "riv.bain": "Acqua limpida e calma, ai piedi delle scogliere. Il fiume è costeggiato da spiagge di sabbia e ciottoli dove si fa il bagno in sicurezza.", "riv.peche.h": "Pesca in acqua dolce", "riv.peche": "La Dordogna è tra i più bei fiumi di Francia per la pesca a mosca: triotto, alborella, cavedano, luccio, lucioperca, pesce persico. Rilasciamo i permessi di pesca.", "riv.canoe.h": "Canoa sulla Dordogna", "riv.canoe": "Il nostro partner Canoë Vacances, a La Roque-Gageac (3 km), viene a prendervi al campeggio in alta stagione, a tariffa agevolata.", "loisirs.h": "Svago e animazione", "loisirs.lead": "C'è qualcosa per tutte le età: area giochi, trampolini, ping-pong, petanque e serate a tema in estate.", "anim.jeunes.h": "Per i più piccoli", "anim.jeunes": "Area giochi per i 3-8 anni: scivolo, piccolo tunnel, ponte di corda, giochi a molla e a dondolo. Poi i trampolini.", "anim.tous.h": "Per grandi e piccoli", "anim.tous": "Tavoli da ping-pong, calciobalilla e, naturalmente, petanque: non dimenticate le vostre bocce.", "anim.soir.h": "Le serate", "anim.soir": "Ogni venerdì sera in alta stagione, cena a tema con musica: paella, cozze con patatine…", "act.h": "Intorno al campeggio", "act.items": [["Equitazione", "Maneggio di Simon a Cénac-et-Saint-Julien (7,8 km): lezioni, corsi, passeggiate · L'Étrier de Vitrac (11,9 km): corsi, passeggiate"], ["Golf", "Souillac Golf & Country Club, 18 buche, La Chapelle-Auzac (40,1 km) · Golf de la Forge, 9 buche, Siorac-en-Périgord (20,5 km)"], ["Canoa e kayak", "Canoë Vacances a La Roque-Gageac (3 km): navetta dal campeggio in alta stagione, tariffa agevolata"], ["Mountain bike", "Noleggio da Bike Bus a Castelnaud-la-Chapelle (2,5 km), alla partenza della pista ciclabile"], ["Parco avventura", "Airparc Périgord a Saint-Vincent-de-Cosse (8,7 km): percorsi sugli alberi, teleferiche, ponti tibetani"], ["Paintball", "Périgord Paintball a Vézac (1,7 km), su terreno collinare e boschivo"], ["Tennis", "Tennis Club de Vitrac (8,7 km): scuola e prenotazione lezioni"], ["Mongolfiera", "Montgolfières du Périgord a La Roque-Gageac (3 km): la Dordogne vista dal cielo"], ["Gabarre", "Gabares Norbert e Gabares Caminade a La Roque-Gageac (1,2 km) · Gabares de Beynac (3,8 km)"], ["In volo", "ULM Dordogne a Domme: 06 81 88 03 98 · 05 53 29 71 35"], ["Arrampicata e speleologia", "Couleurs Périgord a Vézac (3 km)"], ["Pesca", "Permessi di pesca rilasciati alla reception del campeggio"], ["Via ferrata", "Percorso in parete ai Jardins de Marqueyssac (2,5 km)"]], "aqua.h": "Aquarium Périgord Noir", "aqua.p": "Il più grande acquario privato d'Europa di acqua dolce, a Le Bugue: 70 vasche, oltre 6.000 animali e l'Alligator Park, dove si danno da mangiare ai piccoli alligatori alla Ferme du Bayou.", "serv.h": "Servizi del campeggio", "serv.lead": "Una squadra che ama il proprio territorio e vi consiglia su visite, gite e appuntamenti da non perdere.", "serv.accueil": "Reception aperta dalle 8 alle 20 · lingue parlate: francese, inglese, tedesco · documentazione turistica", "serv.items": "Blocco servizi aperto 24 ore su 24 · lavanderia (2 lavatrici, 1 asciugatrice, gettoni alla reception) · prestito di ferro e asse da stiro · area di servizio per camper · colonnina di ricarica elettrica, gratuita per i nostri ospiti · wi-fi gratuito in tutto il campeggio · prestito di lettino, seggiolone e rialzo per bambini · prestito di barbecue a carbonella · bar con TV · snack · piccolo alimentari d'emergenza · pane e viennoiserie · noleggio frigoriferi · vendita di lenzuola monouso", "serv.animaux": "Animali ammessi nel campeggio, tranne negli alloggi. Libretto delle vaccinazioni aggiornato; cani di categoria 1 e 2 vietati.", "serv.courses": "Piccolo negozio e panetteria a 1 km, supermercati a 3 km.", "snack.h": "Lo snack-bar", "snack.lead": "Aperto tutti i giorni dalle 8 alle 23, da metà giugno a metà settembre.", "snack.p1": "Un caffè al mattino, una bibita fresca all'aperitivo, un gelato dopo il pisolino. Da asporto o sul posto: pizze, hot dog, patatine, crêpes.", "snack.p2": "Sulla grande terrazza: birre, cocktail, vino di Bergerac, bibite, frullati. E lì si guardano insieme il Tour de France, le Olimpiadi o i Mondiali.", "emp.h": "Piazzole per tenda, roulotte, camper", "emp.lead": "Piazzole di circa 100 m², all'ombra o al sole, ai piedi delle scogliere dorate e sulle rive della Dordogna.", "emp.items": "1 veicolo per piazzola · elettricità 10 A (presa europea necessaria) · punti acqua vicini · servizi aperti 24 ore su 24 con bagno per disabili e spazio bebè · lavelli per i piatti · lavanderia · wi-fi gratuito · barbecue su piedi ammessi (a gas, elettrici o a carbonella) · area di servizio per camper · colonnina di ricarica gratuita per auto elettriche", "tarifs.h": "Tariffe 2026", "tarifs.lead": "Prenotate per telefono al 05 53 29 50 83 o al 06 83 36 41 68, oppure online.", "tarifs.loc": "Alloggi (prezzo a settimana, da sabato a sabato)", "tarifs.camp": "Campeggio (prezzo a notte)", "tarifs.camp.a": "2 persone + piazzola + veicolo", "tarifs.camp.b": "2 persone + piazzola + veicolo + elettricità 10 A", "tarifs.camp.c": "Bambino (- di 7 anni)", "tarifs.camp.d": "Persona in più (+ 7 anni)", "tarifs.basse": "Bassa stagione", "tarifs.haute": "Alta stagione (6 luglio-24 agosto)", "tarifs.taxe": "Tassa di soggiorno: 0,66 € al giorno per adulto di oltre 18 anni.", "tarifs.draps": "Lenzuola monouso: letto singolo 7 €, letto matrimoniale 12 €.", "tarifs.horaires": "Alloggi: arrivo dalle 15, partenza entro le 10 · piazzole: arrivo dalle 12, partenza entro le 12.", "tarifs.treck": "Tenda Canada Treck (2 pers.): bassa stagione 45 €/notte, 40 €/notte oltre i 7 giorni · alta stagione 50 €/notte, 45 €/notte oltre i 7 giorni.", "tarifs.check": "Due importi differiscono sul vostro sito attuale tra la pagina Tariffe e le schede (tenda Canada, tenda Treck): la bozza riprende le schede, da confermare con voi.", "rh.name": "Casa mobile Rapidhome", "rh.short": "27 m² · 2 camere · 4 pers. · TV, wi-fi · bagno con doccia e WC", "rh.desc": "Modello Alizé: 1 camera con letto 140 × 190, 1 camera con 2 letti 80 × 190 · bagno con doccia e lavabo, WC separato · soggiorno con televisione, riscaldamento elettrico, wi-fi gratuito · cucina attrezzata: frigorifero, lavastoviglie per 12 coperti, piano cottura a gas a 4 fuochi, cappa, microonde, stoviglie · terrazza coperta integrata di 8 m² con salottino da giardino", "lou.name": "Casa mobile Louisiane", "lou.short": "30 m² · 2 camere · 4 pers. · TV, wi-fi · bagno con doccia e WC", "lou.desc": "Modello Grand Large: 1 camera con letto 140 × 190, 1 camera con 2 letti 80 × 190 · bagno con doccia e lavabo, WC separato · soggiorno con televisione, riscaldamento elettrico, wi-fi gratuito · cucina attrezzata: frigorifero, lavastoviglie per 12 coperti, piano cottura a gas a 4 fuochi, cappa, microonde, stoviglie · terrazza semi-coperta di 15 m² con salottino da giardino", "can.name": "Tenda Canada", "can.short": "32 m² · 2 camere · 4/5 pers. · wi-fi · servizi del campeggio", "can.desc": "1 camera con letto 140 × 190, 1 camera con 3 letti 80 × 190 · cucina attrezzata: frigorifero, piano a induzione, caffettiera, microonde, stoviglie · terrazza coperta con salottino da giardino · pavimento in legno · elettricità · blocco servizi vicino", "trk.name": "Tenda Canada Treck", "trk.short": "12 m² · 1 camera · 2 pers. · wi-fi · frigorifero", "trk.desc": "1 camera con letto 140 × 190 · frigorifero · terrazza coperta con salottino da giardino · pavimento in legno · elettricità · blocco servizi vicino. Ideale per escursionisti, coppie che viaggiano leggere e campeggiatori di passaggio.", "photo.credit": "Crediti fotografici: © Stéphane Porte (alcune foto degli alloggi e delle animazioni).", "al.h": "La valle della Dordogna, in fondo al sentiero", "al.lead": "Nel cuore del Triangolo d'oro, tra scogliere, villaggi arroccati e grotte preistoriche.", "al.p": "La Dordogna vanta un ricco patrimonio storico e preistorico, una natura intatta e una generosa cucina del territorio: relax, aria aperta, cultura e gastronomia.", "al.sarlat.h": "Sarlat", "al.sarlat.k": "12 km", "al.sarlat": "La perla del Périgord Noir, città d'arte e di storia, medievale e rinascimentale: cattedrale Saint-Sacerdos, lanterna dei morti, hôtel Plamon, casa di La Boétie, hôtel de Vienne, Présidial. Capitale golosa: tartufi, foie gras, porcini, noci. Mercati il mercoledì e il sabato, mercato coperto nella chiesa Sainte-Marie in stagione. Fête de la Truffe (metà gennaio), Fest'oie (inizio marzo), Journées du Terroir (Ascensione).", "al.roque.h": "La Roque-Gageac", "al.roque.k": "1 km", "al.roque": "Uno dei più bei villaggi di Francia, ai piedi di scogliere calcaree: abitazioni trogloditiche, Jardin exotique, giardino della Ferme fleurie (4.000 m²) e la gita in gabarra.", "al.lascaux.h": "Lascaux", "al.lascaux.k": "39 km", "al.lascaux": "Scoperta nel 1940 da quattro ragazzi, chiusa al pubblico nel 1963. Lascaux 2 (1983), poi Lascaux 4 (2016), replica integrale: 2.000 figure dipinte e incise, oltre 600 animali e un laboratorio per avvicinarsi alle tecniche degli uomini delle caverne.", "al.eyzies.h": "Les Eyzies-de-Tayac", "al.eyzies.k": "24 km", "al.eyzies": "Terra di Cro-Magnon: una quindicina di siti patrimonio Unesco, la grotta des Combarelles, la grotta di Font-de-Gaume, il riparo di Cro-Magnon e il Museo nazionale di Preistoria.", "al.castel.h": "Castelnaud-la-Chapelle", "al.castel.k": "2 km", "al.castel": "Uno dei più bei villaggi di Francia, alla confluenza di Dordogna e Céou. Il castello di Castelnaud con le sue armi medievali; il castello des Milandes, dimora di Joséphine Baker, con spettacoli di rapaci.", "al.marq.h": "Jardins de Marqueyssac", "al.marq.k": "3 km", "al.marq": "Il giardino più visitato del Périgord: 22 ettari, 6 km di sentieri, 150.000 bossi potati a mano e il grande belvedere su Beynac, Castelnaud, La Roque-Gageac e Domme.", "al.credit": "Crediti fotografici: OT Sarlat Périgord Noir (M. Anglada, D. Repérant), Thomas Lambelin / SDHPA Dordogne, Mairie des Eyzies, Les Jardins de Marqueyssac (Laugery).", "avis.h": "Cosa dicono i nostri campeggiatori", "avis.src": "Recensioni pubblicate sul vostro sito attuale", "actu.h": "Le novità del campeggio", "actu.borne": "Nuova colonnina di ricarica rapida per veicoli elettrici: ricaricate l'auto al campeggio, gratis per i nostri ospiti.", "actu.site": "Archivio 2017: il campeggio si dotava di un sito compatibile con computer, smartphone e tablet.", "actu.agenda": "L'agenda delle uscite del Périgord (da maggio a dicembre) del vostro sito attuale sarà ripresa all'installazione.", "contact.h": "Contatti e come arrivare", "contact.addr": "Camping *** La Plage · La Malartrie · 24220 Vézac", "contact.gps": "GPS: 44°49'28.2\" N 1°10'10.2\" E", "contact.form.h": "Scriveteci", "f.nom": "Nome", "f.email": "E-mail", "f.tel": "Telefono", "f.dates": "Date desiderate", "f.msg": "Il vostro messaggio", "f.send": "Invia", "f.ok": "Grazie! Nella versione online, il vostro messaggio arriverà al campeggio. Qui è una bozza: non viene inviato nulla.", "f.err": "Mancano il vostro nome e un'e-mail o un telefono.", "f.projet": "Dal «Mio soggiorno»:", "mine.h": "Il mio soggiorno", "mine.empty": "Ancora nulla. Aggiungete un alloggio o un'attività dalle pagine.", "mine.go": "Chiedi la disponibilità", "mentions.h": "Note legali", "mentions.p": "Camping La Plage, gestito da SARL La Malartrie, La Malartrie, 24220 Vézac. Il testo completo delle note legali e dell'informativa sulla privacy del vostro sito attuale sarà ripreso all'installazione.", "conf.h": "Informativa sulla privacy", "conf.p": "I dati del modulo servono unicamente a rispondere alla vostra richiesta. Il testo completo della vostra informativa attuale sarà ripreso all'installazione.", "foot.tag": "Campeggio a 3 stelle sulla Dordogna, a Vézac, tra La Roque-Gageac e Castelnaud.", "foot.maquette": "Proposta di restyling realizzata da Neovera Studio — bozza non contrattuale.", "foot.meteo": "Meteo a Vézac", "bot.name": "La Plage Conseil", "bot.sub": "Vi aiuto a scegliere", "bot.virtual": "Assistente virtuale", "bot.hello": "Buongiorno! Sono l'assistente virtuale del Camping La Plage. Alloggi, prezzi, piscina, fiume, visite: fatemi la vostra domanda.", "bot.invite": "Una domanda sul vostro soggiorno sulla Dordogna?", "bot.ph": "Scrivete la vostra domanda…", "bot.send": "Invia", "bot.chips": ["Quale alloggio per 5?", "Prezzi ad agosto", "I cani sono ammessi?", "Fare il bagno nel fiume", "Cosa visitare?", "Prenotare"], "bot.unknown": "Non sono sicuro di rispondere bene a questa domanda. La cosa più semplice: chiamate il campeggio al 05 53 29 50 83 o al 06 83 36 41 68, oppure scrivete a campinglaplage24@orange.fr.", "bot.a.heb": "Per 4: case mobili Rapidhome o Louisiane (bagno privato). Per 5: la tenda Canada (2 camere, 4/5 pers.). Per 2 che viaggiano leggeri: la tenda Canada Treck.", "bot.a.prix": "In estate (6 luglio-24 agosto): Rapidhome 850 €/settimana, Louisiane 950 €, tenda Canada 565 €, Treck 50 €/notte; piazzola 2 pers. + veicolo 23,80 €/notte. Il calcolatore vi dà una stima.", "bot.a.basse": "Fuori estate: Rapidhome da 350 €/settimana, Louisiane da 410 €, tenda Canada da 290 €, Treck 45 €/notte; piazzola da 15,80 €/notte.", "bot.a.chien": "Sì, gli animali sono ammessi nel campeggio, ma non negli alloggi. Libretto delle vaccinazioni aggiornato; cani di categoria 1 e 2 vietati.", "bot.a.riviere": "La nostra spiaggia di ciottoli dà direttamente sulla Dordogna: bagni tranquilli, pesca (permessi alla reception) e canoa con il nostro partner, che viene a prendervi in alta stagione.", "bot.a.piscine": "Piscina di 18 × 8 m e vasca per bambini, aperte da maggio a fine settembre dalle 10 alle 20. Pantaloncini da bagno vietati.", "bot.a.visiter": "Vicino: La Roque-Gageac (1 km), Castelnaud (2 km), Marqueyssac (3 km), Sarlat (12 km). Più lontano: Les Eyzies (24 km), Lascaux (39 km).", "bot.a.resa": "Prenotate online con il pulsante «Prenota online», oppure per telefono al 05 53 29 50 83.", "bot.a.dates": "Il campeggio è aperto dal 15 marzo al 18 ottobre 2026. Alloggi: arrivo dalle 15, partenza entro le 10, da sabato a sabato.", "bot.a.wifi": "Wi-fi gratuito in tutto il campeggio.", "bot.a.snack": "Lo snack-bar è aperto tutti i giorni dalle 8 alle 23, da metà giugno a metà settembre: pizze, patatine, crêpes, gelati e cene a tema il venerdì in alta stagione.", "bot.a.recharge": "Sì: colonnina di ricarica per auto elettriche, gratuita per i nostri ospiti, e area di servizio per camper.", "bot.a.langues": "Alla reception si parla francese, inglese e tedesco.", "bot.a.draps": "Lenzuola monouso in vendita: 7 € il letto singolo, 12 € il letto matrimoniale.", "bot.a.bebe": "Prestito di lettino, seggiolone e rialzo secondo disponibilità, e uno spazio bebè nei servizi.", "act.g.eau": "Sull'acqua", "act.g.air": "In alto", "act.g.terre": "A terra"}, "nl": {"meta.title": "Camping La Plage *** — Vézac, aan de Dordogne, vlak bij Sarlat", "ui.book": "Online boeken", "ui.call": "Bellen", "ui.more": "Bekijk de pagina", "ui.back": "Terug", "ui.close": "Sluiten", "ui.lang": "Taal", "ui.from": "vanaf", "ui.week": "week", "ui.night": "nacht", "ui.tour": "Virtuele rondleiding", "ui.docs": "Documenten om te downloaden", "ui.docs.list": "Campingbrochure · huurcontract · reserveringscontract camping · plattegrond van de camping · algemene voorwaarden · annuleringsverzekering", "ui.docs.note": "De pdf's van uw huidige website worden bij de installatie ongewijzigd overgenomen.", "ui.mine": "Mijn verblijf", "ui.add": "Toevoegen aan mijn verblijf", "ui.added": "Toegevoegd", "nav.locations": "Verhuur", "nav.emplacements": "Kampeerplaatsen", "nav.tarifs": "Tarieven 2026", "nav.piscine": "Zwembad", "nav.riviere": "De rivier", "nav.loisirs": "Ontspanning", "nav.services": "Voorzieningen", "nav.snack": "Snackbar", "nav.alentours": "Omgeving", "nav.avis": "Beoordelingen", "nav.actu": "Nieuws", "nav.contact": "Contact en route", "nav.conseil": "La Plage Conseil", "nav.mentions": "Juridische informatie", "nav.confidentialite": "Privacy", "nav.sejour": "Bereken mijn verblijf", "top.open": "Open van 15 maart tot 18 oktober 2026 · receptie 8.00-20.00 uur", "home.h1": "Uw tent aan de Dordogne, met de rotswanden aan de overkant.", "home.lead": "Een driesterrencamping in Vézac, op 1 km van La Roque-Gageac en 12 km van Sarlat. Direct toegang tot de rivier via ons kiezelstrand, zwembad van 18 × 8 m, stacaravans en ingerichte tenten.", "home.season": "Seizoen 2026: van 15 maart tot 18 oktober.", "home.cta.calc": "Bereken mijn verblijf", "home.skip": "Steentjes keilen", "plage.h": "Een kiezelstrand, helemaal voor u", "plage.p": "Vanaf de camping bent u in een paar stappen bij de Dordogne om te zwemmen, te vissen of te gaan kanoën. 's Avonds zweven de luchtballonnen over het water.", "plage.cta": "Naar de rivier", "heb.h": "Vier manieren om hier te slapen", "heb.p": "Elke accommodatie heeft een eigen terras en tuinset. Overal gratis wifi.", "calc.h": "Wat kost uw verblijf?", "calc.p": "Kies een accommodatie, een periode en het aantal nachten: de prijs komt uit onze tarieven voor 2026.", "calc.heb": "Accommodatie", "calc.period": "Periode", "calc.nights": "Nachten", "calc.adults": "Volwassenen (+ 18 jaar)", "calc.kids": "Kinderen", "calc.elec": "Elektriciteit 10 A", "calc.total": "Raming", "calc.tax": "waarvan toeristenbelasting", "calc.note": "Indicatieve raming op basis van de getoonde tarieven voor 2026. Verhuuraccommodaties worden doordeweeks van zaterdag tot zaterdag verhuurd; de exacte prijs wordt bij de reservering bevestigd.", "calc.weeks": "week/weken", "calc.camp": "Kampeerplaats voor tent, caravan of camper", "piscine.h": "Zwembad en kinderbad", "piscine.lead": "Een zwembad van 18 × 8 m, een kinderbad voor de kleintjes en een groot solarium met ligbedden.", "piscine.p1": "Een paar baantjes in de ochtend, een verfrissende duik in de middag en daarna een dutje op een ligbed.", "piscine.p2": "De kinderen spetteren in het kinderbad, onder het oog van hun ouders. En voor stromend water ligt de Dordogne aan het einde van de camping.", "piscine.infos": "Open van mei tot eind september (afhankelijk van het weer) · van 10.00 tot 20.00 uur · zwembroeken (shorts) niet toegestaan · kinderen onder begeleiding van een volwassene", "riv.h": "Het kiezelstrand", "riv.lead": "Direct toegang tot de Dordogne: daar hebben we onze naam aan te danken.", "riv.bain.h": "Zwemmen in de rivier", "riv.bain": "Helder, rustig water aan de voet van de rotswanden. Langs de rivier liggen zand- en kiezelstranden waar u veilig kunt zwemmen.", "riv.peche.h": "Zoetwatervissen", "riv.peche": "De Dordogne is een van de mooiste rivieren van Frankrijk voor vliegvissen: blankvoorn, alver, kopvoorn, snoek, snoekbaars, baars. Wij verkopen de visvergunningen.", "riv.canoe.h": "Kanoën op de Dordogne", "riv.canoe": "Onze partner Canoë Vacances, in La Roque-Gageac (3 km), haalt u in het hoogseizoen op bij de camping, tegen een voordelig tarief.", "loisirs.h": "Ontspanning en animatie", "loisirs.lead": "Voor elke leeftijd iets: speeltuin, trampolines, tafeltennis, jeu de boules en in de zomer themafeesten.", "anim.jeunes.h": "Voor de kleintjes", "anim.jeunes": "Speeltuin voor 3 tot 8 jaar: glijbaan, tunneltje, touwbrug, veer- en wipdieren. En daarna de trampolines.", "anim.tous.h": "Voor jong en oud", "anim.tous": "Tafeltennistafels, tafelvoetbal en natuurlijk jeu de boules: vergeet uw ballen niet.", "anim.soir.h": "De avonden", "anim.soir": "Elke vrijdagavond in het hoogseizoen een themamaaltijd met muziek: paella, mosselen met friet…", "act.h": "Rond de camping", "act.items": [["Paardrijden", "Manege van Simon in Cénac-et-Saint-Julien (7,8 km): lessen, cursussen, tochten · L'Étrier de Vitrac (11,9 km): cursussen, buitenritten"], ["Golf", "Souillac Golf & Country Club, 18 holes, La Chapelle-Auzac (40,1 km) · Golf de la Forge, 9 holes, Siorac-en-Périgord (20,5 km)"], ["Kano en kajak", "Canoë Vacances in La Roque-Gageac (3 km): in het hoogseizoen een pendeldienst vanaf de camping, voordelig tarief"], ["Mountainbiken", "Verhuur bij Bike Bus in Castelnaud-la-Chapelle (2,5 km), aan het begin van de fietsroute"], ["Avonturenpark", "Airparc Périgord in Saint-Vincent-de-Cosse (8,7 km): klimparcours, kabelbanen, touwbruggen"], ["Paintball", "Périgord Paintball in Vézac (1,7 km), op heuvelachtig, bebost terrein"], ["Tennis", "Tennis Club de Vitrac (8,7 km): tennisschool en lessen reserveren"], ["Luchtballon", "Montgolfières du Périgord in La Roque-Gageac (3 km): de Dordogne vanuit de lucht"], ["Gabares", "Gabares Norbert en Gabares Caminade in La Roque-Gageac (1,2 km) · Gabares de Beynac (3,8 km)"], ["In de lucht", "ULM Dordogne in Domme: 06 81 88 03 98 · 05 53 29 71 35"], ["Klimmen en speleologie", "Couleurs Périgord in Vézac (3 km)"], ["Vissen", "Visvergunningen verkrijgbaar bij de receptie van de camping"], ["Via ferrata", "Route langs de rotswand in Les Jardins de Marqueyssac (2,5 km)"]], "aqua.h": "Aquarium Périgord Noir", "aqua.p": "Het grootste particuliere zoetwateraquarium van Europa, in Le Bugue: 70 bassins, meer dan 6.000 dieren en het Alligator Park, waar u de kleine alligators voert bij de Ferme du Bayou.", "serv.h": "Voorzieningen van de camping", "serv.lead": "Een team dat van zijn streek houdt en u graag adviseert over bezienswaardigheden, uitstapjes en evenementen die u niet mag missen.", "serv.accueil": "Receptie open van 8.00 tot 20.00 uur · gesproken talen: Frans, Engels, Duits · toeristische informatie", "serv.items": "Sanitairgebouw 24 uur per dag open · wasserette (2 wasmachines, 1 droger, munten bij de receptie) · strijkijzer en strijkplank te leen · camperservicepunt · elektrische laadpaal, gratis voor onze gasten · gratis wifi op de hele camping · babybed, kinderstoel en stoelverhoger te leen · houtskoolbarbecues te leen · bar met tv · snackbar · kleine noodwinkel · broodjes- en croissantservice · koelkasten te huur · wegwerplakens te koop", "serv.animaux": "Huisdieren zijn welkom op de camping, behalve in de huuraccommodaties. Actueel vaccinatieboekje vereist; honden van categorie 1 en 2 niet toegestaan.", "serv.courses": "Kleine supermarkt en bakkerij op 1 km, grote supermarkten op 3 km.", "snack.h": "De snackbar", "snack.lead": "Elke dag open van 8.00 tot 23.00 uur, van half juni tot half september.", "snack.p1": "Een kop koffie 's ochtends, een koel drankje bij het aperitief, een ijsje na de siësta. Om mee te nemen of ter plaatse: pizza's, hotdogs, friet, pannenkoeken.", "snack.p2": "Op het grote terras: bier, cocktails, wijn uit Bergerac, frisdrank, smoothies. En samen kijken we er naar de Tour de France, de Olympische Spelen of het WK voetbal.", "emp.h": "Kampeerplaatsen voor tent, caravan en camper", "emp.lead": "Plaatsen van ongeveer 100 m², in de schaduw of in de zon, aan de voet van de goudkleurige rotswanden en aan de oever van de Dordogne.", "emp.items": "1 voertuig per plaats · elektriciteit 10 A (Europese stekker nodig) · watertappunten dichtbij · sanitair 24 uur per dag open met gehandicaptentoilet en babyruimte · afwasbakken · wasserette · gratis wifi · standaardbarbecues toegestaan (gas, elektrisch of houtskool) · camperservicepunt · gratis laadpaal voor elektrische auto's", "tarifs.h": "Tarieven 2026", "tarifs.lead": "Reserveer telefonisch op 05 53 29 50 83 of 06 83 36 41 68, of online.", "tarifs.loc": "Verhuur (prijs per week, van zaterdag tot zaterdag)", "tarifs.camp": "Kamperen (prijs per nacht)", "tarifs.camp.a": "2 personen + kampeerplaats + voertuig", "tarifs.camp.b": "2 personen + kampeerplaats + voertuig + elektriciteit 10 A", "tarifs.camp.c": "Kind (- van 7 jaar)", "tarifs.camp.d": "Extra persoon (+ 7 jaar)", "tarifs.basse": "Laagseizoen", "tarifs.haute": "Hoogseizoen (6 juli-24 augustus)", "tarifs.taxe": "Toeristenbelasting: 0,66 € per dag per volwassene boven 18 jaar.", "tarifs.draps": "Wegwerplakens: eenpersoonsbed 7 €, tweepersoonsbed 12 €.", "tarifs.horaires": "Verhuur: aankomst vanaf 15.00 uur, vertrek vóór 10.00 uur · kampeerplaatsen: aankomst vanaf 12.00 uur, vertrek vóór 12.00 uur.", "tarifs.treck": "Tent Canada Treck (2 pers.): laagseizoen 45 €/nacht, 40 €/nacht vanaf 7 nachten · hoogseizoen 50 €/nacht, 45 €/nacht vanaf 7 nachten.", "tarifs.check": "Twee bedragen verschillen op uw huidige website tussen de pagina Tarieven en de accommodatiepagina's (tent Canada, tent Treck): het ontwerp volgt de accommodatiepagina's, nog te bevestigen met u.", "rh.name": "Stacaravan Rapidhome", "rh.short": "27 m² · 2 slaapkamers · 4 pers. · tv, wifi · badkamer en toilet", "rh.desc": "Model Alizé: 1 slaapkamer met bed van 140 × 190, 1 slaapkamer met 2 bedden van 80 × 190 · badkamer met douche en wastafel, apart toilet · woonkamer met televisie, elektrische verwarming, gratis wifi · volledig ingerichte keuken: koelkast, vaatwasser voor 12 couverts, gasfornuis met 4 pitten, afzuigkap, magnetron, serviesgoed · ingebouwd overdekt terras van 8 m² met tuinset", "lou.name": "Stacaravan Louisiane", "lou.short": "30 m² · 2 slaapkamers · 4 pers. · tv, wifi · badkamer en toilet", "lou.desc": "Model Grand Large: 1 slaapkamer met bed van 140 × 190, 1 slaapkamer met 2 bedden van 80 × 190 · badkamer met douche en wastafel, apart toilet · woonkamer met televisie, elektrische verwarming, gratis wifi · volledig ingerichte keuken: koelkast, vaatwasser voor 12 couverts, gasfornuis met 4 pitten, afzuigkap, magnetron, serviesgoed · half overdekt terras van 15 m² met tuinset", "can.name": "Tent Canada", "can.short": "32 m² · 2 slaapkamers · 4/5 pers. · wifi · sanitair van de camping", "can.desc": "1 slaapkamer met bed van 140 × 190, 1 slaapkamer met 3 bedden van 80 × 190 · volledig ingerichte keuken: koelkast, inductiekookplaat, koffiezetapparaat, magnetron, serviesgoed · overdekt terras met tuinset · houten vloer · elektriciteit · sanitairgebouw vlakbij", "trk.name": "Tente Canada Treck", "trk.short": "12 m² · 1 slaapkamer · 2 pers. · wifi · koelkast", "trk.desc": "1 slaapkamer met bed van 140 × 190 · koelkast · overdekt terras met tuinset · houten vloer · elektriciteit · sanitairgebouw vlakbij. Ideaal voor wandelaars, stellen die licht reizen en passanten.", "photo.credit": "Fotocredits: © Stéphane Porte (enkele foto's van de accommodaties en animatie).", "al.h": "Het Dordogne-dal, aan het eind van het pad", "al.lead": "In het hart van de Gouden Driehoek, tussen rotswanden, dorpen op de heuvels en prehistorische grotten.", "al.p": "De Dordogne heeft een rijk historisch en prehistorisch erfgoed, ongerepte natuur en een rijke streekkeuken: luieren, buiten zijn, cultuur en gastronomie.", "al.sarlat.h": "Sarlat", "al.sarlat.k": "12 km", "al.sarlat": "De parel van de Périgord Noir, een middeleeuwse en renaissancistische kunst- en geschiedenisstad: kathedraal Saint-Sacerdos, lanterne des morts, hôtel Plamon, huis van La Boétie, hôtel de Vienne, Présidial. Culinaire hoofdstad: truffels, foie gras, eekhoorntjesbrood, walnoten. Markten op woensdag en zaterdag, in het seizoen overdekte markt in de kerk Sainte-Marie. Fête de la Truffe (half januari), Fest'oie (begin maart), Journées du Terroir (Hemelvaart).", "al.roque.h": "La Roque-Gageac", "al.roque.k": "1 km", "al.roque": "Een van de mooiste dorpen van Frankrijk, aan de voet van kalkrotsen: grotwoningen, Jardin exotique, tuin van de Ferme fleurie (4.000 m²) en de tocht met de gabare.", "al.lascaux.h": "Lascaux", "al.lascaux.k": "39 km", "al.lascaux": "In 1940 ontdekt door vier tieners, in 1963 gesloten voor het publiek. Lascaux 2 (1983) en daarna Lascaux 4 (2016), een complete replica: 2.000 geschilderde en gegraveerde figuren, ruim 600 dieren en een workshop om kennis te maken met de technieken van de holbewoners.", "al.eyzies.h": "Les Eyzies-de-Tayac", "al.eyzies.k": "24 km", "al.eyzies": "Het land van Cro-Magnon: een vijftiental door Unesco erkende locaties, de grot Les Combarelles, de grot Font-de-Gaume, het abri Cro-Magnon en het Nationaal Museum van de Prehistorie.", "al.castel.h": "Castelnaud-la-Chapelle", "al.castel.k": "2 km", "al.castel": "Een van de mooiste dorpen van Frankrijk, bij de samenvloeiing van de Dordogne en de Céou. Het kasteel van Castelnaud met zijn middeleeuwse wapens; het kasteel Les Milandes, woonplaats van Joséphine Baker, met roofvogelshows.", "al.marq.h": "Jardins de Marqueyssac", "al.marq.k": "3 km", "al.marq": "De meest bezochte tuin van de Périgord: 22 hectare, 6 km wandelpaden, 150.000 met de hand gesnoeide buxusstruiken en het grote uitzichtpunt over Beynac, Castelnaud, La Roque-Gageac en Domme.", "al.credit": "Fotocredits: OT Sarlat Périgord Noir (M. Anglada, D. Repérant), Thomas Lambelin / SDHPA Dordogne, Mairie des Eyzies, Les Jardins de Marqueyssac (Laugery).", "avis.h": "Wat onze kampeerders zeggen", "avis.src": "Beoordelingen gepubliceerd op uw huidige website", "actu.h": "Nieuws van de camping", "actu.borne": "Nieuwe snellaadpaal voor elektrische voertuigen: laad uw auto op bij de camping, gratis voor onze gasten.", "actu.site": "Archief 2017: de camping kreeg een website die werkt op computer, smartphone en tablet.", "actu.agenda": "De uitgaansagenda van de Périgord (mei tot december) van uw huidige website wordt bij de installatie overgenomen.", "contact.h": "Contact en route", "contact.addr": "Camping *** La Plage · La Malartrie · 24220 Vézac", "contact.gps": "GPS: 44°49'28.2\" N 1°10'10.2\" E", "contact.form.h": "Schrijf ons", "f.nom": "Naam", "f.email": "E-mail", "f.tel": "Telefoon", "f.dates": "Gewenste data", "f.msg": "Uw bericht", "f.send": "Verzenden", "f.ok": "Bedankt! In de online versie gaat uw bericht naar de camping. Dit is een ontwerp: er wordt niets verzonden.", "f.err": "Uw naam en een e-mailadres of telefoonnummer ontbreken.", "f.projet": "Vanuit ‘Mijn verblijf’:", "mine.h": "Mijn verblijf", "mine.empty": "Nog niets. Voeg een accommodatie of activiteit toe vanaf de pagina's.", "mine.go": "Beschikbaarheid aanvragen", "mentions.h": "Juridische informatie", "mentions.p": "Camping La Plage, geëxploiteerd door SARL La Malartrie, La Malartrie, 24220 Vézac. De volledige tekst van de juridische informatie en het privacybeleid van uw huidige website wordt bij de installatie overgenomen.", "conf.h": "Privacybeleid", "conf.p": "De gegevens uit het formulier worden uitsluitend gebruikt om uw aanvraag te beantwoorden. De volledige tekst van uw huidige beleid wordt bij de installatie overgenomen.", "foot.tag": "Driesterrencamping aan de Dordogne, in Vézac, tussen La Roque-Gageac en Castelnaud.", "foot.maquette": "Voorstel voor een nieuwe website door Neovera Studio — vrijblijvend ontwerp.", "foot.meteo": "Weer in Vézac", "bot.name": "La Plage Conseil", "bot.sub": "Ik help u kiezen", "bot.virtual": "Virtuele assistent", "bot.hello": "Goedendag! Ik ben de virtuele assistent van Camping La Plage. Accommodaties, prijzen, zwembad, rivier, uitstapjes: stel gerust uw vraag.", "bot.invite": "Een vraag over uw verblijf aan de Dordogne?", "bot.ph": "Schrijf uw vraag…", "bot.send": "Verzenden", "bot.chips": ["Welke accommodatie voor 5?", "Prijzen in augustus", "Zijn honden toegestaan?", "Zwemmen in de rivier", "Wat te bezoeken?", "Reserveren"], "bot.unknown": "Ik weet niet zeker of ik dit goed kan beantwoorden. Het eenvoudigst: bel de camping op 05 53 29 50 83 of 06 83 36 41 68, of schrijf naar campinglaplage24@orange.fr.", "bot.a.heb": "Voor 4: stacaravans Rapidhome of Louisiane (eigen badkamer). Voor 5: de tent Canada (2 slaapkamers, 4/5 pers.). Voor 2 die licht reizen: de tent Canada Treck.", "bot.a.prix": "In de zomer (6 juli-24 augustus): Rapidhome 850 €/week, Louisiane 950 €, tent Canada 565 €, Treck 50 €/nacht; kampeerplaats 2 pers. + voertuig 23,80 €/nacht. De calculator geeft u een raming.", "bot.a.basse": "Buiten de zomer: Rapidhome vanaf 350 €/week, Louisiane vanaf 410 €, tent Canada vanaf 290 €, Treck 45 €/nacht; kampeerplaats vanaf 15,80 €/nacht.", "bot.a.chien": "Ja, huisdieren zijn welkom op de camping, maar niet in de huuraccommodaties. Actueel vaccinatieboekje vereist; honden van categorie 1 en 2 niet toegestaan.", "bot.a.riviere": "Ons kiezelstrand ligt direct aan de Dordogne: rustig zwemwater, vissen (vergunningen bij de receptie) en kanoën met onze partner, die u in het hoogseizoen komt ophalen.", "bot.a.piscine": "Zwembad van 18 × 8 m en kinderbad, open van mei tot eind september van 10.00 tot 20.00 uur. Zwembroeken (shorts) niet toegestaan.", "bot.a.visiter": "Dichtbij: La Roque-Gageac (1 km), Castelnaud (2 km), Marqueyssac (3 km), Sarlat (12 km). Verder weg: Les Eyzies (24 km), Lascaux (39 km).", "bot.a.resa": "Reserveer online met de knop ‘Online boeken’, of telefonisch op 05 53 29 50 83.", "bot.a.dates": "De camping is open van 15 maart tot 18 oktober 2026. Verhuur: aankomst vanaf 15.00 uur, vertrek vóór 10.00 uur, van zaterdag tot zaterdag.", "bot.a.wifi": "Gratis wifi op de hele camping.", "bot.a.snack": "De snackbar is elke dag open van 8.00 tot 23.00 uur, van half juni tot half september: pizza's, friet, pannenkoeken, ijs en op vrijdag in het hoogseizoen een themamaaltijd.", "bot.a.recharge": "Ja: een laadpaal voor elektrische auto's, gratis voor onze gasten, en een camperservicepunt.", "bot.a.langues": "Bij de receptie spreekt men Frans, Engels en Duits.", "bot.a.draps": "Wegwerplakens te koop: 7 € voor een eenpersoonsbed, 12 € voor een tweepersoonsbed.", "bot.a.bebe": "Babybed, kinderstoel en stoelverhoger te leen, afhankelijk van beschikbaarheid, en een babyruimte in het sanitair.", "act.g.eau": "Op het water", "act.g.air": "Hoog in de lucht", "act.g.terre": "Op het land"}}</script>

 document.getElementById('fl1').innerHTML=['rh','lou','can','trk'].map(k=>`<li><a href="#/location/${k}">${t(k+'.name')}</a></li>`).join('')+`<li><a href="#/emplacements">${t('nav.emplacements')}</a></li><li><a href="#/tarifs">${t('nav.tarifs')}</a></li><li><a href="#/sejour">${t('nav.sejour')}</a></li>`;
 document.getElementById('fl2').innerHTML=[['piscine','nav.piscine'],['riviere','nav.riviere'],['loisirs','nav.loisirs'],['services','nav.services'],['snack','nav.snack'],['avis','nav.avis'],['actu','nav.actu'],['contact','nav.contact']].map(([k,l])=>`<li><a href="#/${k}">${t(l)}</a></li>`).join('');
 document.getElementById('fl3').innerHTML=AL.map(([k])=>`<li><a href="#/alentours/${k}">${t('al.'+k+'.h')}</a></li>`).join('')+`<li><a href="#/loisirs">${t('aqua.h')}</a></li>`}

const AVIS=[['Un très bel endroit',"Arrivés par hasard, très très bien reçus, nous ne sommes restés que deux nuits car devant continuer notre route. Quoiqu'il en soit, un très beau camping idéalement situé pour les balades ou se reposer en bord de rivière. Nous y reviendrons et vous conseillerons autour de nous. Mention spéciale pour les mésanges semi apprivoisées",'Raph L','04/2022'],['De vraies vacances',"Camping familial où on se sent comme chez soi. Situé au bord de la Dordogne entre La Roque Gageac et Castelnaud la Chapelle qui sont à quelques minutes à pied. Accueil chaleureux de la part de toute l'équipe. De beaux emplacements, un vrai havre de paix. Base de canoë à quelques mètres, le soir on peut voir le bal des montgolfières. L'entretien des espaces verts et des sanitaires est au top. Piscine, épicerie, petite restauration et bar sont là pour vous accompagner. De 2 nuits au début on est finalement resté 8 nuits.",'Jean G','07/2021'],['Belle découverte',"Un camping situé aux pieds des falaises d'un côté et au bord de la Dordogne, une vue magnifique, il y'en a pour tous les goûts. Les prix sont très abordables pour les prestations proposées ( piscine, supérette etc) , je recommande! Seul bémol si je dois en trouver un : un seul bâtiment de sanitaire pour tout le camping. J'y retourne même le mois prochain !",'Flore C','07/2021'],['Camping paradis',"Camper devant une vue magnifique. Apaisant, calme, en pleine nature. Un havre de paix au cœur de tous les plus beaux village de France. Un personnel aux petits soins et à l'écoute de ses clients. À refaire ! Je recommande vivement !!",'Gathe','06/2021'],['Vue magnifique',"Camping magnifique, personnel très accueillant et disponible, nous étions face à la Dordogne. La propreté des sanitaires est parfaite, bar très agréable avec ces chaleurs. Montgolfière qui vont pour certaine jusqu'à se poser sur la Dordogne très beau à voir et tôt le matin, vu sur la faune, hérons, canard col vert etc.. Et de l'autre côté vu sur les troglodytes, à 1km de la Roque Gageac, et 2km de Castelnaud à travers les champs ou vous pourrez apercevoir la source de Bulide. Ainsi que les balades à la Roque Gageac. Sérieusement venez vous ne le regretterais pas, et merci encore à vous 3",'Bruno Mercier','06/2021'],["Séjour d'une semaine","Super séjour, très beau et très propre , mobile homme excellent, restaurant très bon prix correcte , piscine super super agréable , à deux pas pour la pêche , canoë, balade baignade. a 10 minutes de Sarlat, Très belle ville, paysage magnifique.",'Coiffure asymétrique','09/2020']];
const avisQ=([h,x,n,d])=>`<blockquote><h3>« ${esc(h)} »</h3><p>${esc(x)}</p><cite>${esc(n)} <span>· ${d}</span></cite></blockquote>`;
const RICO=`<svg viewBox="0 0 780 550" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g id="rips">${[[300,412,44],[430,396,34],[540,386,26],[612,380,18]].map(([x,y,r],i)=>`<ellipse class="rip" data-i="${i}" cx="${x}" cy="${y}" rx="${r}" ry="${r*.28}"/>`).join('')}</g><ellipse class="stone" id="stone" cx="120" cy="470" rx="10" ry="6"/></svg>`;
function ricochet(){const s=document.getElementById('stone');if(!s)return;const rips=[...document.querySelectorAll('.rip')];if(matchMedia('(prefers-reduced-motion: reduce)').matches){s.style.display='none';rips.forEach(r=>{r.style.opacity=.6});return}
 const pts=[[120,470],[300,412],[430,396],[540,386],[612,380]];const hops=[70,46,30,16];let i=0;s.style.display='';rips.forEach(r=>{r.getAnimations().forEach(a=>a.cancel());r.style.opacity=0});
 const step=()=>{if(i>=4){s.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});return}const [x0,y0]=pts[i],[x1,y1]=pts[i+1],h=hops[i],d=[520,420,340,260][i];const kf=[];for(let k=0;k<=12;k++){const u=k/12;kf.push({transform:`translate(${x0+(x1-x0)*u-120}px,${y0+(y1-y0)*u-h*4*u*(1-u)-470}px) rotate(${u*300}deg)`})}s.style.transformBox='fill-box';s.style.transformOrigin='center';const a=s.animate(kf,{duration:d,easing:'linear',fill:'forwards'});a.onfinish=()=>{const r=rips[i];r.animate([{opacity:.95,transform:'scale(.3)'},{opacity:0,transform:'scale(2.4)'}],{duration:1600,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});r.style.transformBox='fill-box';r.style.transformOrigin='center';i++;step()}};step()}
const PAGES={};
PAGES['']=()=>`<section class="hero"><div class="wrap hgrid"><div><h1>${t('home.h1')}</h1><p class="lead">${t('home.lead')}</p>

function bindCalc(){const H=document.getElementById('cH');if(!H)return;const Pp=document.getElementById('cP'),N=document.getElementById('cN'),A=document.getElementById('cA'),K=document.getElementById('cK'),E=document.getElementById('cE');
 const periods=()=>{const k=H.value;Pp.innerHTML=(HEB[k]&&HEB[k].w?HEB[k].w.map((p,i)=>`<option value="${i}">${dfmt(p[0])} – ${dfmt(p[1])}</option>`):[`<option value="basse">${t('tarifs.basse')}</option>`,`<option value="haute">${t('tarifs.haute')}</option>`]).join('');document.getElementById('cEw').style.display=k==='camp'?'':'none';document.getElementById('cNl').textContent=(HEB[k]&&HEB[k].w)?t('calc.weeks'):t('calc.nights');N.value=(HEB[k]&&HEB[k].w)?1:7;calc()};
 const calc=()=>{const k=H.value,n=Math.max(1,+N.value||1),a=Math.max(1,+A.value||1),kids=Math.max(0,+K.value||0);let tot=0,nights;
  if(HEB[k]&&HEB[k].w){tot=HEB[k].w[+Pp.value][2]*n;nights=n*7}else if(k==='trk'){const s=HEB.trk.n[Pp.value];tot=(n>7?s[1]:s[0])*n;nights=n}else{const c=CAMP[Pp.value];tot=(E.checked?c.b:c.a)*n+Math.max(0,a-2)*c.p*n+kids*c.k*n;nights=n}
  const tax=.66*a*nights;document.getElementById('cT').textContent=money(Math.round((tot+tax)*100)/100);document.getElementById('cTax').textContent=t('calc.tax')+' '+money(Math.round(tax*100)/100)};
 H.addEventListener('change',periods);[Pp,N,A,K,E].forEach(x=>x.addEventListener('input',calc));periods()}
