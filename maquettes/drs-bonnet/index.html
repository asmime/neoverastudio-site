therapie. Die Eingriffe finden im Operationsraum statt, alle Behandlungen unter Lupenbrille."],["Auch in der Praxis","Echte „ästhetische Zahnfleischchirurgie“, um empfindliche Stellen abzudecken oder zu verstärken."]]},"cas-cliniques-dorthodontie":{"s":"orthodontie","t":"Kieferorthopädische Fälle","lead":"Fünf Behandlungen, vom Kind mit 8 Jahren bis zum Erwachsenen.","by":"Dr Marie Bonnet","b":[["Kind","Frühbehandlung mit 8 Jahren durch einen funktionellen Trainer."],["Jugendlicher","Feste Multibracket-Apparatur."],["Erwachsener","Multibracket; transparente Aligner; Aligner, dann Veneers."]],"cases":["c-ortho-e1a|c-ortho-e1b","c-ortho-e2a|c-ortho-e2b","c-ortho-a1a|c-ortho-a1b","c-ortho-a2a|c-ortho-a2b","c-ortho-a3a|c-ortho-a3b"]},"lorthodontie":{"s":"orthodontie","t":"Kieferorthopädische Behandlungen","lead":"Vier Wege, Zähne zu bewegen, gewählt nach Alter, Fall und Ihrem Alltag.","b":[["Vorbeugend","Beim Kind werden Lippen, Wangen und Zunge ins Gleichgewicht gebracht, für ein harmonisches Wachstum; Fehlstellungen und schlechte Gewohnheiten (Atmung, Schlucken, Kauen) werden korrigiert. Maßgefertigte Apparaturen nach optischem Abdruck und Übungen zur funktionellen Erziehung."],["Klassisch","Aufgeklebte Metallbrackets: das selbstligierende System DAMON Q® mit Hightech-Bögen und leichten Kräften."],["Unauffällig","Dieselben Brackets aus Keramik: das System DAMON CLEAR®, robust und fast unsichtbar."],["Transparent","Maßgefertigte Aligner INVISALIGN® für Erwachsene, Jugendliche und manche Kinder. Unauffällig und bequem, erfordert aber gute Mitarbeit."]],"videos":[["nsxbY1URF4c","Vorstellung"],["wM0ODjt3MrU","Pflege und Tragen"],["S_DnJC5nhe8","Atemübungen"],["UKFd2jAGlPA","Muskelübungen"]]},"la-prise-en-charge-en-orthodontie":{"s":"orthodontie","t":"Die kieferorthopädische Behandlung","lead":"Fünf Schritte, vom ersten Termin bis zur jährlichen Kontrolle.","b":[["Erste Konsultation","Untersuchung, ein oder mehrere Behandlungspläne, Dauer und Finanzierung werden erklärt."],["Befund","Fotos, Röntgenbilder und digitaler Abdruck für die Diagnose."],["Einsetzen","Transparente Schienen werden anprobiert oder Brackets aufgeklebt: Die Behandlung beginnt."],["Entfernen und Retention","Ist die Korrektur optimal, wird die Apparatur entfernt und ein unauffälliger Retainer sichert das Ergebnis."],["Nachsorge","Kontrollen nach 1, 3 und 6 Monaten, danach einmal im Jahr."]]},"la-chirurgie-orale-au-service-de-lorthodontie":{"s":"orthodontie","t":"Mundchirurgie für die Kieferorthopädie","lead":"Manchmal macht ein kleiner chirurgischer Eingriff die Behandlung erst möglich oder schneller.","b":[["Wann","Einen verlagerten Zahn freilegen, Mini-Implantate zur Verankerung setzen, einen Zahn bewegen, Weisheitszähne oder überzählige Zähne entfernen, immer in Absprache mit Ihrem überweisenden Zahnarzt. Verlagerte Zähne werden in 3D lokalisiert."],["Beschleunigen","Kortikotomie und Piezocision lockern den Knochen um die Zähne unter örtlicher Betäubung: um bei Erwachsenen schneller voranzukommen, ankylosierte Zähne oder verlagerte Eckzähne zu bewegen und trotz Knochenverlust zu behandeln."]]},"les-malpositions-dentaires":{"s":"orthodontie","t":"Zahnfehlstellungen","lead":"Zu viel oder zu wenig Platz, und die Zähne ordnen sich, so gut sie können.","b":[["Die Risiken","Ästhetische Beeinträchtigung, unausgewogenes Kauen, Kiefergelenk, Abnutzung und Brüche, Aussprache, Bisse in die Schleimhaut, unvollständige Zahnreinigung."],["Die Ursachen","Zähne und Kiefer unterschiedlicher Größe (erblich), verspätete bleibende Zähne, gestörte Funktionen: kindliches Schlucken, Mundatmung."],["Die Lösungen","Daumenlutschen und Schnuller rechtzeitig abgewöhnen, Training (Schlucken, Sprechen, Nasenatmung), störende Milchzähne ziehen, eine dem Alter angepasste Behandlung."]]},"les-colorations-dentaires":{"s":"esthetique","t":"Verfärbungen und Abnutzung der Zähne","lead":"Tabak, Tee, Kaffee, Wein, bestimmte Mundspülungen oder Eisen: Der leicht poröse Zahnschmelz verfärbt sich.","by":"Dr Clarisse Bonnet","b":[["Meine Zähne sind verfärbt","Tägliche Pflege, regelmäßige Zahnreinigung und Politur genügen oft. Meiden Sie zu abrasive Zahnpasten. Bei kleinen Schmelzdefekten hilft die Mikroabrasion."],["Ohne Amalgam","Ein kleines Loch wird in der Sitzung mit Komposit gefüllt; ein großes mit einem geklebten Inlay oder Onlay, nach Abdruck gefertigt."],["Ein wurzelbehandelter Zahn, der nachdunkelt","Ist er nicht zu stark geschädigt, gibt ihm eine innere Aufhellung seinen Glanz zurück."]],"cases":["c-col-a1|c-col-b1","c-col-a2|c-col-b2"]},"le-blanchiment-des-dents":{"s":"esthetique","t":"Zahnaufhellung","lead":"Der natürlichen Zahnfarbe neuen Glanz geben, zu Hause und unter Kontrolle der Praxis.","by":"Dr Clarisse Bonnet","b":[["Zuerst","Eine Konsultation, um Karies, undichte Füllungen oder entzündetes Zahnfleisch auszuschließen, dann Zahnreinigung und Politur. Tiefe Verfärbungen des Schmelzes sind eher ein Fall für Veneers."],["Drei Termine","Abdrücke und Vergleichsfoto; Übergabe der Schienen und des Gels; Kontrolle nach 15 Tagen. Das Gel wird anfangs 2 Stunden täglich getragen, dann nachts, meist 15 Tage lang (bis zu 6 Wochen). Die Farbe verändert sich schon ab dem 3. Tag."],["Die Schienen behalten Sie","Sie lassen sich wiederverwenden, zum Beispiel nach einer Zahnreinigung, für einen Frischekick."],["Wurzelbehandelter Zahn","Ein Gel im Zahninneren, bei geschützter Wurzel, gibt ihm die Farbe seiner Nachbarn zurück."]],"cases":["c-bl-a1|c-bl-b1","c-bl-a2|c-bl-b2","c-bl-a3|c-bl-b3"]},"les-restaurations-esthetiques-directes-et-indirectes":{"s":"esthetique","t":"Ästhetische Restaurationen","lead":"Den Zahn reparieren und dabei dank Klebetechnik so viel gesunde Zahnsubstanz wie möglich erhalten.","by":"Dr Clarisse Bonnet","b":[["Direkt","Bei Karies, einem Riss oder einem begrenzten Bruch: ein Komposit, unter Kofferdam eingebracht, modelliert und poliert, in einer Sitzung."],["Indirekt","Bei größerem Substanzverlust: ein Inlay oder Onlay aus Keramik, im Labor nach Abdruck gefertigt und unter Kofferdam eingeklebt, für einen dichten Rand."]],"cases":["c-res-a1|c-res-b1","c-res-a2|c-res-b2","c-res-a3|c-res-b3","c-res-a4|c-res-b4"]},"les-facettes-ceramiques":{"s":"esthetique","t":"Virtuelle Planung und Veneers","lead":"Das künftige Lächeln sehen, bevor irgendein unumkehrbarer Schritt erfolgt.","by":"Dr Clarisse Bonnet","b":[["Simulieren","Nach einer Fotoanalyse legt eine virtuelle Planung die Ziele gemeinsam mit Ihnen fest; ein Mock-up im Mund macht das Projekt für das ganze Team greifbar (Kieferorthopäde, Implantologe, Zahntechniker)."],["Die Veneers","Hauchdünne Keramikschalen, auf die sichtbare Zahnfläche geklebt: bei Farbe, kleinen Fehlstellungen, Abnutzung. Ein natürliches Ergebnis, bei dem der Zahn geschont wird."]],"cases":["c-fac-a1|c-fac-b1","c-fac-a2|c-fac-b2"]},"les-couronnes-sur-implants-par-avec-technique-dempreinte-numerique":{"s":"esthetique","t":"Kronen auf Implantaten, digitaler Abdruck","lead":"Nach dem Einsetzen des Implantats ersetzt eine Kamera die Abdruckmasse, um die Keramikkrone herzustellen.","b":[["Angenehmer","Keine Abdruckmasse mehr im Mund: angenehmer und sehr präzise."]],"cases":["c-couronne"]},"injection-dacide-hyaluronique":{"s":"esthetique","t":"Hyaluronsäure-Injektion","lead":"Zum Lächeln gehören auch die Lippen: Zahnärzte können rund um den Mund und im unteren Gesichtsbereich injizieren.","b":[["Warum","Mit dem Alter verlieren die Lippen an Volumen, es entstehen Falten und Linien. Die Injektion gibt Volumen zurück oder füllt Falten um die Lippen auf, im therapeutischen Rahmen."],["Das Produkt","Ein Stoff, der natürlicherweise in der Haut vorkommt und seit 1934 bekannt ist. Das Produkt der Praxis ist nicht tierischen Ursprungs, körperverträglich und abbaubar."],["Wo","Nasolabialfalten, Marionettenfalten, Falten und Fältchen um den Mund, Lippenkontur, Gesichtsoval."],["Ergebnis und Dauer","Sofort sichtbar, nach 10 Tagen optimal, es hält je nach Produkt 12 bis 18 Monate. Selten eine kleine Schwellung oder Rötung, die schnell abklingt. Produkte mit Sicherheitsprüfung der Afssaps."]]},"la-petite-souris":{"s":"pedodontie","t":"Die kleine Maus der Praxis","lead":"Sie wohnt hinter einem Regal der Praxis, mit gepunkteten Vorhängen und einer Lampe aus einem Zahnpastadeckel.","b":[["Ihre Aufgabe","Wenn ein Milchzahn ausfällt, holt sie ihn ab und lässt eine glänzende Münze zurück. Sie bekommt viele Briefe und Zeichnungen. Und hier gibt es keine Katze."],["Das Set „kleine Maus“","Eine mäuseförmige Schachtel, um den Zahn unters Kopfkissen zu legen, ein Blatt, um die Milchzähne im Blick zu behalten, und ein kleines Briefchen mit ihrer Pfote unterschrieben. Frag deinen Zahnarzt danach!"]],"imgs":["souris","pochons","souris2"]},"soins-pour-les-enfants":{"s":"pedodontie","t":"Behandlung für Kinder","lead":"Dr Héloïse Panaras, Kinderzahnärztin, empfängt Kinder und Jugendliche mit viel Einfühlungsvermögen.","by":"Dr Héloïse Panaras","b":[["Warum eine Kinderzahnärztin","Karies vorbeugen, Zähne und Kiefer beobachten, die ersten bleibenden Zähne begleiten, die Angst vor der Behandlung nehmen."],["In der Praxis","Persönliche Betreuung, angepasste Vorsorge, Umgang mit Angst, ein Ort, der für die Jüngsten gedacht ist. Jeder Schritt wird dem Kind wie den Eltern erklärt."]],"imgs":["dr-panaras","salle-enf"]},"salle-attente-dediee-aux-mini-patients":{"s":"pedodontie","t":"Das Wartezimmer der kleinen Patienten","lead":"Ein farbenfroher Raum nur für sie: Bücher, Malvorlagen, Zeichentrickfilme und die Tür der kleinen Maus.","b":[["Vertrauen beginnt hier","Alles ist darauf ausgelegt, dass der Besuch entspannt verläuft, von der Ankunft bis zum Behandlungsstuhl."]],"imgs":["mxl547","mxl535","mxl539","mxl533","cab4"]},"le-traitement-endodontique":{"s":"endodontie","t":"Die endodontische Behandlung","lead":"Das Zahninnere behandeln, wenn die Pulpa entzündet oder infiziert ist, um Schmerzen und Abszesse zu vermeiden.","b":[["Den Zahn lebendig halten","Bleibt die Entzündung begrenzt, wird die Karies unter dem Mikroskop entfernt und die Pulpa mit einem Material überkappt, das sie heilen lässt."],["Die Wurzelbehandlung","Reinigen, Formen, Desinfizieren und dichtes Füllen der Kanäle, unter Kofferdam. Der Zahn wird danach von Ihrem Zahnarzt aufgebaut."],["Ein Spezialist","Mikroskop, Apexlokalisator, Ultraschall, Warmfülltechnik, 3D-Bildgebung: eine technische Ausstattung für komplexe Fälle. Quelle: Société Française d’Endodontie."]],"imgs":["c-endo1","c-endo2"]},"le-retraitement-endodontique":{"s":"endodontie","t":"Die endodontische Revision","lead":"Wenn sich ein bereits behandelter Zahn infiziert oder nicht heilt, wird die Wurzelbehandlung wiederholt.","b":[["Warum","Ein nicht entdeckter Kanal, ein zu später Aufbau, neue Karies, eine undichte Restauration."],["Die Schritte","Restaurationen entfernen, altes Füllmaterial herausnehmen, weitere Kanäle suchen, reinigen, desinfizieren, füllen, dann den Zahn aufbauen."]],"imgs":["c-retrait","c-etapes"]},"la-chirurgie-endodontique":{"s":"endodontie","t":"Die endodontische Chirurgie","lead":"Wenn die Revision scheitert oder nicht möglich ist (abgebrochenes Instrument, Krümmung, verkalkter Kanal …).","b":[["Der Eingriff","Unter dem Mikroskop wird das infizierte Gewebe entfernt, indem die Wurzelspitze gekappt wird. Dann wird der Kanal von der Spitze her mit einem körperverträglichen Material verschlossen."]],"imgs":["c-chir-endo"]}},"tech":[{"t":"Optische Abdruckkamera","p":"Keine Abdruckmasse mehr: kein Würgereiz, kein schlechter Geschmack, eine Präzision, die zusätzliche Termine erspart.","img":"t-rect54"},{"t":"Geführte Chirurgie und Navigation","p":"Der Computer führt Bohrer und Implantat während des gesamten Eingriffs in 3D.","img":"t-rect5"},{"t":"AIRFLOW ONE","p":"Parodontale Erhaltungstherapie nach der Guided Biofilm Therapy. Der exklusive Parodontologe wurde in Deutschland und der Schweiz ausgebildet.","img":"fauteuil"},{"t":"3D-Röntgen mit Cone Beam","p":"Panoramaaufnahme und 3D-Scan vor Ort: sofortige Diagnose, weniger Strahlung, geringere Gesamtkosten einer Implantatbehandlung.","img":"t-radio"},{"t":"Operationsmikroskop","p":"Der exklusive Endodontist arbeitet damit. Es dient auch dazu, Risse und Wurzelbrüche aufzuspüren, und für ästhetischen Zahnersatz.","img":"t-8004122"},{"t":"Piezochirurgie","p":"Ultraschall, um Knochen mit mikrometergenauer Präzision zu korrigieren oder zu entnehmen.","img":"t-piezo"}],"blocs":{"t":"Drei Operationsräume","p":"Für Chirurgie und Mikrochirurgie, damit unter besten Bedingungen in Ergonomie und Keimfreiheit operiert werden kann."},"team":{"docs":[["dr-clarisse","Dr Clarisse Bonnet","Ästhetische restaurative Zahnheilkunde"],["dr-marie","Dr Marie Bonnet","Kieferorthopädie"],["dr-franck","Dr Franck Bonnet","Implantologie, komplexe Rehabilitationen"],["dr-rathelot","Dr Benjamin Rathelot","Parodontologie"],["dr-panaras","Dr Héloïse Panaras","Kinderzahnheilkunde"],["dr-guerson","Dr Yaël Guerson","Parodontale Erhaltungstherapie"],["dr-manders","Dr Rian Manders","Allgemeine Zahnheilkunde und parodontale Erhaltungstherapie"]],"staff":[["eq-helene","Hélène","Empfang und Sekretariat"],["eq-joy","Joy","Qualifizierte Zahnarzthelferin"],["eq-dounia","Dounia","Qualifizierte Zahnarzthelferin"],["eq-anna","Anna","Qualifizierte Zahnarzthelferin"],["eq-vania","Vania","Qualifizierte Zahnarzthelferin"],["eq-sabine","Sabine","Sterilisationsassistentin"],["eq-zorica","Zorica","Direktionsassistentin"],["eq-elisa","Elisa","Leiterin Kommunikation"],["eq-morgane","Morgane","Community Managerin"]],"motto":"Alles daran setzen, dass die Patienten so behandelt werden, wie wir selbst gern behandelt würden."},"advice":{"la-prevention-votre-meilleur-allie-sante":{"t":"Vorsorge, Ihr bester Verbündeter","img":"k-prev","p":["Manche Probleme beginnen lautlos: Ein Besuch pro Jahr hilft, sie rechtzeitig zu erkennen.","Beim Termin untersucht der Zahnarzt Zähne, Zahnfleisch, vorhandene Versorgungen und Mundhygiene; bei Bedarf kommen Röntgenbilder dazu.","Im Alltag: mindestens zweimal täglich Zähne putzen, nach den Mahlzeiten, und weniger Zucker, vor allem zwischen den Mahlzeiten."]},"douleurs-et-si-cetait-vos-gencives":{"t":"Schmerzen: Liegt es am Zahnfleisch?","img":"k-douleurs","p":["Rotes, geschwollenes Zahnfleisch: Das ist eine Zahnfleischentzündung, verursacht durch Plaque.","Blutung beim Zähneputzen, Mundgeruch, Empfindlichkeit auf Wärme oder Kälte, zurückgehendes Zahnfleisch: alles Warnzeichen.","Lassen Sie es abklären, damit daraus keine Parodontitis wird."]},"zoom-sur-les-causes-des-douleurs-gingivales":{"t":"Ursachen von Zahnfleischschmerzen","img":"k-causes","p":["Unzureichendes Putzen (bevorzugen Sie eine weiche Bürste), Zahnfleischentzündung und dann Parodontitis.","Verletzung, hormonelle Veränderungen (Schwangerschaft, Pubertät, Wechseljahre), Zähneknirschen.","Fortschreitende Karies, scheuernde Zahnspangen oder Prothesen, durchbrechende Weisheitszähne."]},"votre-suivi-orthodontique-avec-dental-monitoring":{"t":"Ihre kieferorthopädische Kontrolle mit Dental Monitoring","img":"k-dm","p":["Die App begleitet Ihre Behandlung, auch wenn Sie nicht in der Praxis sind.","Sie erhalten eine E-Mail, laden die App herunter (Apple oder Android), und wir aktivieren sie gemeinsam beim Befundtermin mit einem ersten Scan.","Danach beantwortet das Team Ihre Fragen über die Nachrichtenfunktion der App."]},"les-dents-de-sagesse":{"t":"Die Weisheitszähne","img":"k-sagesse","p":["Sie brechen meist zwischen 17 und 21 Jahren durch; 22 % der Menschen haben keine.","Fehlt der Platz, entfernt man sie besser: Sie stören die anderen Zähne und begünstigen Karies.","Nach der Entfernung: Kompresse bei Blutung, Kühlung bei Schwellung, weiche und lauwarme Speisen, weder Tabak noch Alkohol."]},"eviter-les-maladies-parodontales":{"t":"Zahnfleischerkrankungen vermeiden","img":"k-gingivite","p":["Plaque verkalkt innerhalb von 72 Stunden zu Zahnstein und hält die Entzündung am Laufen.","Gesundes Zahnfleisch ist rosa und fest; rot, glatt und blutend: Dann sollten Sie einen Termin machen.","Weiche Bürste zweimal täglich, Zahnseide und Zwischenraumbürsten, jährliche Zahnreinigung. Ein Rückgang des Zahnfleischs wird durch angepasstes Putzen behandelt, manchmal mit einer Transplantation."]},"quest-ce-que-lorthodontie-fonctionnelle":{"t":"Funktionelle Kieferorthopädie","img":"k-ortho","p":["Während des Wachstums auf Atmung, Kauen, Schlucken und Haltung einwirken.","Mundatmung, langes Daumenlutschen oder ein kindliches Schluckmuster verformen die Kiefer.","Osteopathen, HNO-Ärzte, Logopäden oder Physiotherapeuten können die Behandlung ergänzen."]},"les-bons-reflexes-pour-se-brosser-les-dents-avec-un-appareil-dentaire":{"t":"Zähneputzen mit Zahnspange","img":"k-brossage","p":["Mindestens zweimal täglich putzen, am besten dreimal, und nicht zwischendurch naschen.","Zwei Minuten, auch unter dem Draht und mit Nachdruck am Zahnfleischrand; blutendes Zahnfleisch braucht mehr Putzen, nicht weniger.","Kleine weiche oder elektrische Bürste, zum Schluss eine Zwischenraumbürste."]},"tracas-appareil-dentaire":{"t":"Kleine Probleme mit der Zahnspange","img":"k-tracas","p":["Zähne, die anfangs und nach jeder Anpassung „ziehen“: Das vergeht in 24 bis 48 Stunden. Weiche oder eiskalte Speisen, bei Bedarf Schmerzmittel.","Gereizte Wangen oder Lippen: Kieferorthopädisches Wachs schützt.","Ein überstehender Draht: Drücken Sie ihn mit einer Pinzette zurück und schreiben Sie uns an contact@drs-bonnet-associes.fr."]},"piercings-buccaux-et-consequences-sur-votre-sante-dentaire":{"t":"Mundpiercings und Zahngesundheit","img":"k-piercing","p":["Eine auf dem EuroPerio vorgestellte Studie (Pr Clemens Walter, Universität Greifswald) bringt Lippen- und Zungenpiercings mit Zahnfleischrückgang und tieferen Taschen in Verbindung.","Je länger das Piercing getragen wird, desto höher das Risiko.","Sprechen Sie bei Ihren Terminen mit Ihrem Zahnarzt darüber."]},"mieux-respirer-un-des-principaux-bienfaits-de-lorthodontie":{"t":"Besser atmen dank Kieferorthopädie","img":"k-respirer","p":["Offener Mund, trockene Lippen, verstopfte Nase, Augenringe: Ein Kind atmet vielleicht schlecht.","Nasenatmung filtert und wärmt die Luft, fördert den Schlaf und formt das Gesicht.","Eine frühe Behandlung, gemeinsam mit HNO-Arzt und Kinderarzt, kann eine gute Belüftung wiederherstellen. Auch Naseputzen und Nasenspülen zu lernen hilft."]},"limpact-du-grignotage-sur-la-sante-bucco-dentaire":{"t":"Naschen und Ihre Zähne","img":"k-grignotage","p":["Jede Zwischenmahlzeit vervielfacht die Säureangriffe auf den Zahnschmelz.","Vier Mahlzeiten am Tag: Frühstück, Mittagessen, Vesperbrot, Abendessen. Wasser ist das einzige zahnfreundliche Getränk.","Zahnseide oder Zwischenraumbürsten vor dem Putzen, 2 Minuten, eine erbsengroße Menge Zahnpasta, die Bürste alle 3 Monate wechseln und nie teilen. Quelle: UFSBD."]},"quest-ce-que-le-bruxisme-grincement-serrement-des-dents":{"t":"Bruxismus (Zähneknirschen und Pressen)","img":"k-bruxisme","p":["Vor allem nachts (80 % der Fälle), 10 bis 15 % der Franzosen: Abnutzung, Schmerzen in Wangen und Schläfen, beim Aufwachen.","Behandelt werden die Folgen: Aufbissschiene für die Nacht, Stressbewältigung, bei Bedarf Restaurationen.","Bei starken Schmerzen Botulinumtoxin; manchmal Kieferorthopädie. Quelle: UFSBD."]}},"reviews":[["Céline Leclercq","18/02/2026","Un grand merci au Dr Marie Bonnet et Joy qui m’ont refait mon sourire et je peux vous dire que je partais de très loin, grâce à elles je peux sourire sans honte. Elles ont été très professionnelles, je recommande sans hésiter."],["Laetitia Wneczak ép. Saladino","20/05/2026","Entièrement satisfaite de la prise en charge en orthodontie pour ma fille de 9 ans. Dr Marie Bonnet et son assistante Joy sont très compétentes et super gentilles ! De plus, le nouveau cabinet est absolument splendide !!"],["thierry vidal rossines","30/01/2026","Accueil parfait, prise en charge de mes problèmes adaptée, mise en place des implants sans aucune douleur… L’ensemble des professionnels sont à l’écoute. À recommander obligatoirement."],["Léonie Taton","04/12/2025","Je suis ravie d’avoir été soignée par le Dr Clarisse Bonnet. Elle est à la fois très professionnelle, douce et à l’écoute. Elle prend le temps d’expliquer chaque étape, ce qui met vraiment en confiance. Les soins ont été réalisés avec beaucoup de sérieux et sans douleur."],["Mathieu FERRAND","01/12/2025","Superbe travail de reconstruction en composite sur incisives fracturées. Excellente praticienne, douce, minutieuse et passionnée. J’éprouve une totale satisfaction sur le plan esthétique comme fonctionnel !"],["Véronique DUBROCARD IMBARD","04/03/2025","Suivie par le Docteur Franck Bonnet depuis plusieurs années, je recommande ce praticien très professionnel et à l’écoute. Travail soigné et le Dr Bonnet est très rassurant et patient avec les phobiques stressées comme moi."],["jc brun","04/02/2025","Un grand merci à Clarisse et Marie pour les bons soins prodigués. Travail de haute qualité et précision pour un beau sourire retrouvé ! Merci à l’équipe !"],["Brooke Gynt","21/07/2024","Le Dr Clarisse Bonnet m’a tout de suite mise à l’aise et a fait un très bon travail en soignant mes caries. Le personnel est accueillant et professionnel, et l’ambiance du cabinet est très agréable."],["Baptiste PHILIBERT","18/04/2024","Super travail, très minutieux et très professionnel, super équipe et tout le monde très sympa ! Au top !"],["Christine HUSS","","Elle m’a donné, avec quelques modifications et sans me limer les dents, un éclat à mon sourire. En plus elle est très douce. Son papa m’a déjà fait un implant et ma paro a été traitée dans le même cabinet. Pour moi « the best » de la région."]],"contact":{"title":"Zur Praxis kommen","address":"2 rond-point Duboys d’Angers, 06400 Cannes","parking":"Parken: Parkhaus Palais Stéphanie in 90 m; Parkhaus Lamy in 150 m (2 Stunden kostenlos, einmal pro Woche).","hours":[["08h30","18h00"],["08h30","18h00"],["09h00","19h00"],["08h30","18h00"],["08h30","18h00"],null],"phone_label":"Für Termine und alle Fragen","form_title":"Terminanfrage","form_lead":"Hinterlassen Sie Ihre Kontaktdaten: Das Sekretariat ruft Sie zurück, um einen Termin zu vereinbaren. Ihre Anfrage geht per E-Mail an die Praxis.","f_name":"Vor- und Nachname","f_phone":"Telefon","f_email":"E-Mail","f_spec":"Gewünschtes Fachgebiet","f_spec_any":"Ich weiß es noch nicht","f_who":"Für wen?","f_who_me":"Für mich","f_who_child":"Für mein Kind","f_msg":"Ihre Nachricht (Anliegen, Verfügbarkeiten)","f_new":"Ich bin neuer Patient","f_ok":"Ihr E-Mail-Programm öffnet sich mit der fertigen Anfrage. Falls sich nichts öffnet, schreiben Sie an contact@drs-bonnet-associes.fr oder rufen Sie 04 93 99 72 81 an.","f_err":"Bitte geben Sie Ihren Namen und eine Telefonnummer oder E-Mail-Adresse an.","f_privacy":"Ihre Daten dienen ausschließlich dazu, Sie zurückzurufen. Recht auf Auskunft und Löschung: cnil@drs-bonnet-associes.fr","doctolib_note":"Dr Marie Bonnet (Kieferorthopädie) nimmt ihre Termine auch über Doctolib entgegen.","urgent":"Bei Schmerzen rufen Sie bitte direkt in der Praxis an.","f_bad":"Dieses Feld scheint unvollständig: bitte prüfen."},"clinic":{"title":"Die Praxis","lead":"Eine voll ausgestattete medizinische Einrichtung, die täglich komplexe Rehabilitationen behandelt, mit einem interdisziplinären Team.","caps":["Der Empfang","Der Flur der Behandlungsräume","Das Wartezimmer","Die Kinderecke","Ein Behandlungsraum","Der Behandlungsstuhl","Ein Behandlungszimmer","Dr Franck Bonnet bei der Sprechstunde","Dr Clarisse Bonnet mit einer Patientin","Dr Marie Bonnet am Behandlungsstuhl","Dr Benjamin Rathelot am Behandlungsstuhl","Die Fassade","Ein Behandlungsstuhl"]},"kids":{"title":"Kinder haben ihren Zahnarzt, ihr Zimmer und ihre Maus","lead":"Dr Héloïse Panaras, Kinderzahnärztin, ein farbenfrohes Wartezimmer und die kleine Maus, die in der Praxis wohnt."},"insta":[["cabinet.dentaire.cannes","Le cabinet"],["drfranckbonnet","Dr Franck Bonnet"],["drbonnet.ortho","Orthodontie"],["drbonnet.esthetics","Esthétique"]],"legal":{"title":"Impressum","p":[["Eigentümer der Website","Die Website drs-bonnet-associes.fr ist Eigentum von Dr Franck Bonnet, Zahnarzt, RPPS 10003600615."],["Firmensitz","Zahnarztpraxis der Drs Bonnet & Associés, 2 rond-point Duboys d’Angers, 06400 Cannes. Tel. 04 93 99 72 81. APE: Zahnarztpraxis."],["Entwicklung","Aktuelle Website, entwickelt und gewartet von Mediweb, 32 boulevard du Président Poincaré, 67000 Strasbourg."],["Hosting","OVH SAS, 2 rue Kellermann, 59100 Roubaix."],["Verantwortlich für den Inhalt","Dr Franck Bonnet."],["Geistiges Eigentum","Texte, Bilder, Logos und Dateien gehören Dr Franck Bonnet; jede Vervielfältigung ohne Genehmigung ist untersagt."],["Links","Ordre national des chirurgiens-dentistes: www.ordre-chirurgiens-dentistes.fr"],["Personenbezogene Daten (DSGVO)","Recht auf Auskunft, Berichtigung, Löschung und Widerspruch: cnil@drs-bonnet-associes.fr"],["Cookies","Dieser Entwurf verwendet nur eine anonyme Reichweitenmessung. Die künftige Website holt Ihre Zustimmung ein, bevor nicht notwendige Cookies gesetzt werden."]],"study":"Die Praxis veranstaltet außerdem Study-Group-Abende in Cannes."},"bot":{"name":"Bonnet Conseil","sub":"Virtueller Assistent der Praxis","help":"Ich helfe Ihnen bei der Wahl","hello":"Guten Tag, ich bin Bonnet Conseil, der virtuelle Assistent der Praxis. Ich leite Sie zum passenden Spezialisten weiter und beantworte praktische Fragen. Eine ärztliche Beratung ersetze ich nicht.","invite":"Eine Frage? Ich leite Sie zum passenden Spezialisten weiter.","ph":"Schreiben Sie Ihre Frage …","chips":["Mir fehlt ein Zahn","Mein Zahnfleisch blutet","Meine Zähne richten","Hellere Zähne","Für mein Kind","Öffnungszeiten und Anfahrt"],"a_implant":"Bei einem oder mehreren fehlenden Zähnen ist die Implantologie von Dr Franck Bonnet die richtige Adresse. Die Praxis setzt Implantate und feste Provisorien oft in derselben Sitzung ein, nach einer Untersuchung in 3D.","a_paro":"Blutendes Zahnfleisch ist oft eine Zahnfleischentzündung, manchmal der Beginn einer Parodontitis. Das ist das Fachgebiet von Dr Benjamin Rathelot (Parodontologie). Am besten lassen Sie es ohne Zögern abklären.","a_ortho":"Zum Ausrichten der Zähne, bei Kindern wie Erwachsenen, gibt es die Kieferorthopädie von Dr Marie Bonnet: Metall- oder Keramikbrackets (Damon) oder transparente Aligner von Invisalign. Sie nimmt ihre Termine auch über Doctolib entgegen.","a_esth":"Flecken, abgebrochener Zahn, Aufhellung oder Veneers: Das ist die ästhetische Zahnheilkunde von Dr Clarisse Bonnet, mit einer Simulation Ihres künftigen Lächelns vor jedem Eingriff.","a_kids":"Für Kinder ist Dr Héloïse Panaras als Kinderzahnärztin da. Es gibt ein Wartezimmer nur für sie, und die kleine Maus wohnt in der Praxis!","a_endo":"Ein sehr schmerzhafter oder bereits wurzelbehandelter Zahn, der wehtut, ist oft ein Fall für die Endodontie, die der Endodontist der Praxis unter dem Mikroskop durchführt. Bei Schmerzen rufen Sie die 04 93 99 72 81 an.","a_pain":"Wenn Sie Schmerzen haben, rufen Sie am schnellsten in der Praxis an unter 04 93 99 72 81. Ich kann keine Diagnose stellen, aber das Team hilft Ihnen weiter.","a_hours":"Die Praxis ist montags, dienstags, donnerstags und freitags von 8.30 bis 18 Uhr geöffnet, mittwochs von 9 bis 19 Uhr, samstags geschlossen. Adresse: 2 rond-point Duboys d’Angers, Cannes.","a_parking":"Zwei Parkhäuser ganz in der Nähe: Palais Stéphanie in 90 m und Lamy in 150 m (2 Stunden kostenlos, einmal pro Woche).","a_rdv":"Rufen Sie die 04 93 99 72 81 an oder füllen Sie die Terminanfrage aus: Das Sekretariat ruft Sie zurück. Für die Kieferorthopädie ist auch Doctolib möglich.","a_price":"Die Preise werden nicht online veröffentlicht: Sie hängen von Ihrer Untersuchung ab. Sie werden Ihnen beim ersten Termin mit dem Behandlungsplan erklärt. Das Sekretariat hilft auch unter 04 93 99 72 81.","a_fear":"Das ist häufig, und Sie können es schon bei der Terminvereinbarung sagen. Mehrere Patienten schreiben in ihren Bewertungen, dass das Team sie beruhigt hat. Bei Kindern kümmert sich Dr. Héloïse Panaras, Kinderzahnärztin, um die Angst.","a_hya":"Die Praxis bietet Hyaluronsäure-Injektionen rund um den Mund an (Lippen, Falten): sofort sichtbares Ergebnis, Haltbarkeit von 12 bis 18 Monaten.","a_lang":"Das Team spricht Französisch; für eine andere Sprache geben Sie dies bitte bei der Terminvereinbarung an, die Praxis sagt Ihnen, was möglich ist.","a_unknown":"Ich beantworte Fragen zur Praxis, zu Behandlungen, Öffnungszeiten und Anfahrt, und diese Information habe ich nicht. Am besten rufen Sie 04 93 99 72 81 an oder schreiben an contact@drs-bonnet-associes.fr.","go_care":"Zur Seite","go_rdv":"Termin anfragen","a_urgent":"Eine gelöste Krone, ein wackelndes Implantat, ein abgebrochener Zahn oder eine Schwellung: Rufen Sie die Praxis unter 04 93 99 72 81 an, damit Sie schnell gesehen werden. Ich kann keine Diagnose stellen. Bei Fieber oder starker Schwellung außerhalb der Öffnungszeiten wählen Sie die 15.","a_health":"Schwangerschaft, laufende Medikamente oder gesundheitliche Probleme: Teilen Sie es bei der Terminvereinbarung mit, die Behandlung wird angepasst. Für eine konkrete Frage rufen Sie am besten 04 93 99 72 81 an.","a_hello":"Guten Tag! Sagen Sie mir, worum es geht (fehlender Zahn, Zahnfleisch, Zahnspange, ein Kind …), und ich zeige Ihnen den richtigen Spezialisten.","a_pay":"Zu Zahlungsarten und Kostenübernahme gibt Ihnen das Sekretariat unter 04 93 99 72 81 Auskunft: Diese Information habe ich nicht.","a_wisdom":"Weisheitszähne brechen meist zwischen 17 und 21 Jahren durch; ohne Platz entfernt man sie oft besser. Die Praxis hat dazu ein Merkblatt, die Entfernung erfolgt unter örtlicher Betäubung.","a_brux":"Zähneknirschen oder -pressen (Bruxismus) nutzt die Zähne ab und belastet den Kiefer. Behandelt wird vor allem mit einer Nachtschiene; hier das Merkblatt der Praxis."}},"it":{"ui":{"skip":"Vai al contenuto","lang":"Lingua","nav_accueil":"Home","nav_soins":"Le cure","nav_clinique":"Lo studio","nav_equipe":"Il team","nav_techno":"Tecnologie","nav_enfants":"Bambini","nav_conseils":"Consigli","nav_avis":"Recensioni","nav_contact":"Contatti","nav_conseil":"Bonnet Conseil","rdv":"Prenota un appuntamento","call":"Chiama lo studio","close":"Chiudi","back":"Indietro","read_more":"Leggi tutto","see_care":"Vedi la cura","by":"Eseguito da","before":"Prima","after":"Dopo","real_case":"Caso reale dello studio","cases_note":"Foto di pazienti dello studio, pubblicate sul sito attuale. Ogni bocca è diversa: un risultato non si promette, si prepara insieme.","next":"Avanti","prev":"Indietro","send":"Invia","open_map":"Apri la mappa","footer_rights":"Drs Bonnet & Associés · Studio odontoiatrico specializzato · Cannes","mentions":"Note legali","proposal":"Proposta di rifacimento realizzata da Neovera Studio, bozza non vincolante.","follow":"Segui lo studio","specialty":"Specialità","all_care":"Tutte le cure di questa specialità","related":"Da leggere dopo","video":"Video","videos_title":"Video di educazione funzionale","watch":"Guarda su YouTube","reviews_note":"Recensioni pubblicate sul sito attuale, citate così come sono (in francese).","illus":"immagine illustrativa","doctolib":"Prenota online (Doctolib)","hours_closed":"Chiuso","menu_aria":"Menu principale","all_n":"Tutti i trattamenti"},"days":["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"],"home":{"title":"Il suo sorriso, esaminato da vicino.","lead":"Sette dentisti specialisti, tre sale operatorie e cure eseguite con ingrandimento o al microscopio, nel cuore di Cannes.","spec_line":"Implantologia · Estetica · Ortodonzia · Parodontologia · Endodonzia · Odontoiatria pediatrica","cta2":"Scopri le cure","hero_note":"2 rond-point Duboys d’Angers, Cannes · dal lunedì al venerdì","loupe_title":"Sotto la lente","loupe_lead":"Qui ogni cura si esegue con ingrandimento: lenti, microscopio operatorio, telecamera per impronte. Passi la lente sulla foto per vedere il lavoro finito.","loupe_hint":"Faccia scorrere la lente sulla foto","loupe_hint_touch":"Tocchi e trascini per spostare la lente","loupe_cases":[{"k":"col","t":"Macchie su due incisivi","by":"Dr Clarisse Bonnet","care":"les-colorations-dentaires"},{"k":"res4","t":"Amalgame sostituite con ceramica","by":"Dr Clarisse Bonnet","care":"les-restaurations-esthetiques-directes-et-indirectes"},{"k":"res","t":"Composito su un dente scheggiato","by":"Dr Clarisse Bonnet","care":"les-restaurations-esthetiques-directes-et-indirectes"},{"k":"bl","t":"Sbiancamento","by":"Dr Clarisse Bonnet","care":"le-blanchiment-des-dents"}],"spec_title":"Ogni specialità ha il suo specialista","spec_lead":"Ogni professionista ha una formazione specialistica post-laurea nel proprio campo. La sua cartella passa da uno specialista all’altro senza cambiare indirizzo.","clinic_title":"Legno chiaro, pareti celadon e tre sale operatorie","clinic_lead":"Una struttura interamente medicalizzata e completamente rinnovata: legno chiaro, pareti verde celadon, una sala d’attesa riservata ai bambini. E dietro, tre sale operatorie dedicate alla chirurgia e alla microchirurgia.","clinic_cta":"Visita lo studio","team_title":"Il team che si prende cura di voi","team_lead":"Specialisti che lavorano insieme al suo piano di cura, affiancati da assistenti qualificate.","team_cta":"Conosca il team","process_title":"Come funziona la presa in carico","process":[{"t":"La prima visita","p":"Valutazione clinica, foto e radiografie in 2D e in 3D, per una diagnosi approfondita."},{"t":"Il piano di cura","p":"Costruito in équipe, al servizio del paziente. Lei sceglie a ogni passaggio."},{"t":"Lo specialista giusto","p":"Ogni intervento è eseguito dagli specialisti interessati, in contatto con il suo dentista di fiducia se serve."},{"t":"Il controllo","p":"Subito e nel lungo periodo, affidato agli stessi specialisti."}],"process_note":"Cerchiamo sempre di ridurre al minimo il numero di sedute.","lab_title":"Protesi realizzate in Francia","lab_p":"Tutte le nostre protesi sono realizzate in Francia, da odontotecnici specializzati in estetica e in protesi su impianti, tra cui M. Jean-Pierre Casu, Meilleur Ouvrier de France.","quote":"Un sorriso dura solo un istante, ma il suo ricordo è a volte eterno.","quote_by":"Raoul Follereau, Le livre d’amour, « Le sourire » (1920)","reviews_title":"Cosa dicono i pazienti","advice_title":"I consigli dello studio","advice_lead":"Tredici schede per capire, prevenire e vivere bene una cura.","insta_title":"Lo studio su Instagram","insta_lead":"Dietro le quinte, casi clinici e piccoli momenti di squadra, su quattro account.","tech_line":"Sei strumenti al servizio della precisione","insta_note":"I post appariranno qui in diretta una volta installato il sito."},"specs":{"implantologie":{"t":"Implantologia","p":"Sostituire uno, più o tutti i denti con radici in titanio, con denti provvisori fissi applicati talvolta lo stesso giorno.","doc":"Dr Franck Bonnet"},"parodontologie":{"t":"Parodontologia","p":"Curare le gengive e l’osso che sostengono i denti: la parodontite colpisce quasi un francese su due, spesso senza dolore.","doc":"Dr Benjamin Rathelot"},"orthodontie":{"t":"Ortodonzia","p":"Allineare i denti e guidare la crescita, dal bambino all’adulto: attacchi in metallo o in ceramica, oppure allineatori trasparenti.","doc":"Dr Marie Bonnet"},"esthetique":{"t":"Estetica","p":"Macchie, denti scheggiati, colore, faccette: un’odontoiatria che preserva il dente e cerca la naturalezza.","doc":"Dr Clarisse Bonnet"},"pedodontie":{"t":"Odontoiatria pediatrica","p":"Cure delicate per i bambini, una sala d’attesa a misura di bambino e un topolino che abita nello studio.","doc":"Dr Héloïse Panaras"},"endodontie":{"t":"Endodonzia","p":"Curare l’interno del dente al microscopio per conservarlo, anche quando un primo trattamento non è riuscito.","doc":"Endodontista esclusivo dello studio"}},"care":{"pose-dimplants-dentaires":{"s":"implantologie","t":"Inserimento di impianti dentali","lead":"L’intervento impressiona, ma è piuttosto rapido e il decorso è molto buono nella grande maggioranza dei casi.","b":[["Dove e come","L’inserimento richiede un’asepsi rigorosa: si esegue in studio o in sala operatoria. In anestesia locale, la gengiva viene aperta per raggiungere l’osso."],["Chiudere in due tempi","L’impianto è interamente coperto dalla gengiva, protetto da una vite piatta in titanio. Dopo 4-6 mesi e una radiografia di controllo, si scopre la testa dell’impianto, si applica una vite di guarigione e poi il moncone che riceverà la protesi, cementata o avvitata. La scelta dipende dall’osso, da un eventuale innesto precedente o dal fumo."],["O in un tempo solo","La testa dell’impianto resta visibile con una vite di guarigione: niente seconda chirurgia, ma un impianto meno protetto. È riservato ai casi più favorevoli. In entrambi i casi, l’osso integra l’impianto in 4-6 mesi."],["I nostri consigli","Segua con cura le prescrizioni e mantenga un’igiene rigorosa. In rari casi l’impianto viene rigettato: se ne inserisce allora uno nuovo."]],"cases":["c-impl-avant|c-impl-apres","c-impl-9","c-impl-8","c-impl-5","c-impl-4","c-impl-10","c-impl-11","c-impl-bonnet","c-impl-2"]},"implant-dentaire":{"s":"implantologie","t":"Impianto dentale","lead":"Una «terza dentizione»: una radice artificiale posta nell’osso, dove il dente è andato perso.","b":[["Che cos’è","Un cilindro medicalmente puro, integrato dall’osso, che riceve una corona, un ponte o un’intera arcata, oppure stabilizza una protesi rimovibile. Ritrova denti fissi e naturali."],["Il nostro lavoro quotidiano","Lo studio è centrato sulle riabilitazioni complesse. Nella stessa seduta operatoria inseriamo gli impianti e i denti provvisori fissi: il paziente ritrova il sorriso e la masticazione in poche ore."],["Pianificato in 3D","Una ricostruzione 3D della mandibola, ottenuta dalla TAC, permette di simulare l’intervento. Delle mascherine chirurgiche riportano questo piano in bocca con precisione."],["La protesi","Utilizziamo la zirconia, senza metallo, per un risultato naturale, e lavoriamo con M. Jean-Pierre Casu, odontotecnico Meilleur Ouvrier de France."]]},"la-maladie-parodontale":{"s":"parodontologie","t":"La malattia parodontale","lead":"La parodontite («piorrea») distrugge poco a poco l’attacco del dente, spesso senza dolore. Quando la si nota, a volte è tardi.","b":[["Perché","Una doppia origine, batterica e immunitaria: i batteri attaccano, l’organismo si difende più o meno bene. Una diagnosi precisa e precoce è indispensabile."],["La cura","Prima una bonifica senza chirurgia, poi una rivalutazione dopo 6-8 settimane. Se restano tasche, una chirurgia di bonifica in sala operatoria, talvolta con biomateriali rigenerativi. Poi il mantenimento, per tutta la vita."],["I segnali da non ignorare","Gengive che sanguinano durante lo spazzolamento, rosse o gonfie; alito cattivo persistente; pus e cattivo sapore; denti che si muovono, si separano o si scoprono; un morso che cambia."],["Cosa peggiora la situazione","Placca e tartaro, fumo, gravidanza e pubertà, stress, alcuni farmaci, digrignamento dei denti, malnutrizione, malattie generali che coinvolgono le difese immunitarie."],["Il nostro follow-up","Cure con ingrandimento, controlli radiografici e «charting»; i controlli sono analizzati ogni mese da tutti i professionisti."]]},"le-suivi-parodontal":{"s":"parodontologie","t":"Il mantenimento parodontale","lead":"Importante quanto la cura: senza controlli, le tasche si reinfettano e l’osso continua a ridursi.","b":[["Da uno specialista","Axelsson e Lindhe lo hanno dimostrato (1981, 2004): se eseguito da uno specialista, il mantenimento limita le recidive, le carie e la perdita di attacco."],["Il protocollo GBT","In studio seguiamo la Guided Biofilm Therapy, con l’AIRFLOW ONE, per rimuovere perfettamente placca e tartaro."],["Una seduta tipo","Radiografie e questionario medico aggiornati, esame delle gengive, consigli personalizzati, poi ablazione del tartaro, levigatura radicolare, lucidatura e irrigazione."],["Il ritmo","Dipende dal suo rischio e dalla sua igiene. Ogni recidiva viene trattata subito. La salute delle gengive è legata a quella del cuore, al diabete, alle nascite premature e all’artrite reumatoide."]]},"la-chirurgie-mucco-gingivale-ou-chirurgie-plastique-parodontale":{"s":"parodontologie","t":"L’innesto di gengiva","lead":"Ricoprire una radice scoperta, rinforzare una gengiva troppo sottile o armonizzarne il contorno.","by":"Dr Benjamin Rathelot","b":[["Perché ricoprire una radice","Senza smalto, la radice si consuma, può cariarsi e diventa sensibile al freddo. Il ricoprimento è possibile a certe condizioni, valutate durante la visita."],["Meno doloroso di un tempo","Microchirurgia, prelievi speciali, mascherine di protezione: la percezione è cambiata. Nei fumatori le probabilità di successo sono basse: smettere di fumare è indispensabile durante la guarigione."]],"cases":["c-paro-av1|c-paro-ap1","c-paro-av2|c-paro-ap2","c-paro-av3|c-paro-ap3"]},"les-parodontites-dechaussement-des-dents":{"s":"parodontologie","t":"Le parodontiti (piorrea)","lead":"Quasi un francese su due ne è colpito. La perdita di attacco avviene in silenzio: meglio individuarla presto.","b":[["Placca e tartaro","La placca si forma con saliva, batteri e residui di cibo. Se non viene rimossa bene, si mineralizza in tartaro, più rapidamente in chi produce molta saliva."],["La cura","Bonifica, rivalutazione a 6-8 settimane, chirurgia se restano tasche, poi mantenimento per tutta la vita. Gli interventi si fanno in sala operatoria, tutte le cure con ingrandimento."],["Anche in studio","Vere «chirurgie estetiche delle gengive» per ricoprire o rinforzare le zone fragili."]]},"cas-cliniques-dorthodontie":{"s":"orthodontie","t":"Casi clinici di ortodonzia","lead":"Cinque trattamenti, dal bambino di 8 anni all’adulto.","by":"Dr Marie Bonnet","b":[["Bambino","Trattamento intercettivo a 8 anni con educatore funzionale."],["Adolescente","Apparecchio fisso multi-attacco."],["Adulto","Multi-attacco; allineatori trasparenti; allineatori poi faccette."]],"cases":["c-ortho-e1a|c-ortho-e1b","c-ortho-e2a|c-ortho-e2b","c-ortho-a1a|c-ortho-a1b","c-ortho-a2a|c-ortho-a2b","c-ortho-a3a|c-ortho-a3b"]},"lorthodontie":{"s":"orthodontie","t":"I trattamenti ortodontici","lead":"Quattro modi di spostare i denti, scelti in base all’età, al caso e alla sua quotidianità.","b":[["Preventivo","Nel bambino, riequilibrare labbra, guance e lingua per una crescita armoniosa; correggere i disallineamenti e le cattive abitudini (respirazione, deglutizione, masticazione). Apparecchi su misura da impronta ottica ed esercizi di educazione funzionale."],["Classico","Attacchi metallici incollati: il sistema DAMON Q®, autoleganti, con archi ad alta tecnologia e forze leggere."],["Discreto","Gli stessi attacchi in ceramica: il sistema DAMON CLEAR®, robusto e quasi invisibile."],["Trasparente","Allineatori INVISALIGN® su misura, per adulti, adolescenti e alcuni bambini. Discreto e confortevole, richiede una buona collaborazione."]],"videos":[["nsxbY1URF4c","Presentazione"],["wM0ODjt3MrU","Cura e utilizzo"],["S_DnJC5nhe8","Esercizi di respirazione"],["UKFd2jAGlPA","Esercizi muscolari"]]},"la-prise-en-charge-en-orthodontie":{"s":"orthodontie","t":"La presa in carico in ortodonzia","lead":"Cinque tappe, dal primo appuntamento al controllo annuale.","b":[["Prima visita","Esame, uno o più piani di cura, tempi e finanziamento spiegati."],["Valutazione","Foto, radiografie e impronta digitale per formulare la diagnosi."],["Applicazione","Mascherine trasparenti provate o attacchi incollati: la cura comincia."],["Rimozione e contenzione","Quando la correzione è ottimale, l’apparecchio viene tolto e una contenzione, senza fastidio, consolida il risultato."],["Controlli","Visite a 1, 3 e 6 mesi, poi una volta all’anno."]]},"la-chirurgie-orale-au-service-de-lorthodontie":{"s":"orthodontie","t":"La chirurgia orale al servizio dell’ortodonzia","lead":"A volte un piccolo gesto chirurgico rende il trattamento possibile, o più rapido.","b":[["Quando","Scoprire un dente incluso, posizionare delle miniviti di ancoraggio, mobilizzare un dente, estrarre denti del giudizio o soprannumerari, sempre d’accordo con il suo dentista di riferimento. I denti inclusi vengono localizzati in 3D."],["Accelerare","Corticotomie e piezocisione rendono più elastico l’osso attorno ai denti in anestesia locale: per andare più veloci nell’adulto, spostare denti anchilosati o canini inclusi, trattare nonostante una perdita d’osso."]]},"les-malpositions-dentaires":{"s":"orthodontie","t":"I disallineamenti dentali","lead":"Troppo spazio o troppo poco, e i denti si sistemano come possono.","b":[["I rischi","Disagio estetico, masticazione squilibrata, articolazione della mandibola, usura e fratture, dizione, morsi alla guancia, spazzolamento incompleto."],["Le cause","Denti e mandibole di dimensioni diverse (ereditarie), denti definitivi in ritardo, funzioni alterate: deglutizione infantile, respirazione orale."],["Le soluzioni","Smettere in tempo con il pollice e il ciuccio, rieducazione (deglutizione, dizione, respirazione nasale), estrazione di denti da latte che disturbano, trattamento adatto all’età."]]},"les-colorations-dentaires":{"s":"esthetique","t":"Colorazioni e usura dei denti","lead":"Fumo, tè, caffè, vino, alcuni collutori o il ferro: lo smalto, un po’ poroso, si colora.","by":"Dr Clarisse Bonnet","b":[["I miei denti sono macchiati","L’igiene quotidiana, le sedute di igiene regolari e la lucidatura spesso bastano. Eviti i dentifrici troppo abrasivi. Per piccoli difetti dello smalto: la microabrasione."],["Senza amalgama","Una piccola carie si ripara con il composito durante la seduta; una grande, con un inlay o un onlay incollato, realizzato da impronta."],["Un dente devitalizzato che scurisce","Se non è troppo compromesso, uno sbiancamento interno gli restituisce la sua luminosità."]],"cases":["c-col-a1|c-col-b1","c-col-a2|c-col-b2"]},"le-blanchiment-des-dents":{"s":"esthetique","t":"Lo sbiancamento dentale","lead":"Restituire luminosità al colore naturale dei denti, a casa e sotto il controllo dello studio.","by":"Dr Clarisse Bonnet","b":[["Prima di tutto","Una visita per escludere carie, otturazioni che perdono o gengive infiammate, poi igiene professionale e lucidatura. Le colorazioni profonde dello smalto si trattano piuttosto con le faccette."],["Tre sedute","Impronte e foto di riferimento; consegna delle mascherine e del gel; controllo dopo 15 giorni. All’inizio il gel si porta 2 ore al giorno, poi di notte, in genere per 15 giorni (fino a 6 settimane). Il colore cambia già dal 3° giorno."],["Le mascherine si conservano","Possono servire di nuovo, ad esempio dopo una seduta di igiene, per un ritocco di luminosità."],["Dente devitalizzato","Un gel posto dentro il dente, con la radice protetta, gli restituisce il colore dei vicini."]],"cases":["c-bl-a1|c-bl-b1","c-bl-a2|c-bl-b2","c-bl-a3|c-bl-b3"]},"les-restaurations-esthetiques-directes-et-indirectes":{"s":"esthetique","t":"I restauri estetici","lead":"Riparare il dente conservando il più possibile tessuto sano, grazie all’adesione.","by":"Dr Clarisse Bonnet","b":[["Diretto","Per una carie, una fissurazione o una frattura limitata: un composito applicato in campo isolato con la diga, modellato e lucidato, in una sola seduta."],["Indiretto","Per una perdita più estesa: un inlay o un onlay in ceramica, realizzato in laboratorio da impronta, poi incollato in campo isolato per una chiusura ermetica."]],"cases":["c-res-a1|c-res-b1","c-res-a2|c-res-b2","c-res-a3|c-res-b3","c-res-a4|c-res-b4"]},"les-facettes-ceramiques":{"s":"esthetique","t":"Pianificazione virtuale e faccette","lead":"Vedere il proprio futuro sorriso prima di qualsiasi gesto irreversibile.","by":"Dr Clarisse Bonnet","b":[["Simulare","Dopo una valutazione fotografica, una pianificazione virtuale definisce gli obiettivi insieme a lei; un mock-up in bocca rende concreto il progetto per tutta l’équipe (ortodontista, implantologo, odontotecnico)."],["Le faccette","Sottilissime lamine di ceramica incollate sulla parte visibile dei denti: colore, piccoli disallineamenti, usura. Un risultato naturale che preserva il dente."]],"cases":["c-fac-a1|c-fac-b1","c-fac-a2|c-fac-b2"]},"les-couronnes-sur-implants-par-avec-technique-dempreinte-numerique":{"s":"esthetique","t":"Corone su impianti, impronta digitale","lead":"Dopo l’inserimento dell’impianto, una telecamera sostituisce la pasta per impronte per realizzare la corona in ceramica.","b":[["Più confortevole","Niente più materiale da impronta in bocca: più piacevole e molto preciso."]],"cases":["c-couronne"]},"injection-dacide-hyaluronique":{"s":"esthetique","t":"Iniezione di acido ialuronico","lead":"Il sorriso sono anche le labbra: i dentisti possono iniettare intorno alla bocca e nella parte bassa del viso.","b":[["Perché","Con l’età le labbra perdono volume e compaiono rughe e pieghe. L’iniezione restituisce volume o riempie le rughe attorno alle labbra, in un contesto terapeutico."],["Il prodotto","Una molecola naturalmente presente nella pelle, nota dal 1934. Quella dello studio è di origine non animale, biocompatibile e riassorbibile."],["Dove","Solchi nasogenieni, pieghe amare, rughe e rughette attorno alla bocca, contorno delle labbra, ovale del viso."],["Risultato e durata","Visibile subito, ottimale dopo 10 giorni, dura da 12 a 18 mesi a seconda del prodotto. Raramente un piccolo gonfiore o un arrossamento che passa in fretta. Prodotti verificati dall’Afssaps."]]},"la-petite-souris":{"s":"pedodontie","t":"Il topolino dello studio","lead":"Abita dietro uno scaffale dello studio, con tendine a pois e una lampada fatta con un tappo di dentifricio.","b":[["La sua missione","Quando cade un dente da latte, lo raccoglie e lascia una moneta luccicante. Riceve tante lettere e disegni. E qui non ci sono gatti."],["Il kit «topolino»","Una scatola a forma di topolino in cui mettere il dentino sotto il cuscino, una scheda per seguire i denti da latte e un biglietto firmato con la sua zampetta. Chiedilo al tuo dentista!"]],"imgs":["souris","pochons","souris2"]},"soins-pour-les-enfants":{"s":"pedodontie","t":"Cure per i bambini","lead":"La Dr Héloïse Panaras, odontoiatra pediatrica, accoglie bambini e adolescenti con dolcezza.","by":"Dr Héloïse Panaras","b":[["Perché un odontoiatra pediatrico","Prevenire le carie, controllare denti e mandibole, accompagnare i primi denti definitivi, rendere le cure meno spaventose."],["In studio","Follow-up personalizzato, prevenzione adatta, gestione dell’ansia, un luogo pensato per i più piccoli. Ogni passaggio viene spiegato al bambino come ai genitori."]],"imgs":["dr-panaras","salle-enf"]},"salle-attente-dediee-aux-mini-patients":{"s":"pedodontie","t":"La sala d’attesa dei mini-pazienti","lead":"Uno spazio colorato riservato a loro: libri, album da colorare, cartoni animati e la porta del topolino.","b":[["La fiducia comincia qui","Tutto è pensato perché la visita sia serena, dall’arrivo fino alla poltrona."]],"imgs":["mxl547","mxl535","mxl539","mxl533","cab4"]},"le-traitement-endodontique":{"s":"endodontie","t":"Il trattamento endodontico","lead":"Curare l’interno del dente quando la polpa è infiammata o infetta, per evitare dolore e ascessi.","b":[["Mantenere il dente vitale","Se l’infiammazione è limitata, la carie viene rimossa al microscopio e la polpa viene «coperta» con un materiale che ne favorisce la guarigione."],["Il trattamento canalare","Pulizia, sagomatura, disinfezione e poi otturazione ermetica dei canali, con la diga. Il dente viene poi ricostruito dal suo dentista."],["Uno specialista","Microscopio, localizzatore d’apice, ultrasuoni, otturazione a caldo, imaging 3D: una dotazione tecnica per i casi complessi. Fonte: Société Française d’Endodontie."]],"imgs":["c-endo1","c-endo2"]},"le-retraitement-endodontique":{"s":"endodontie","t":"Il ritrattamento endodontico","lead":"Quando un dente già trattato si infetta o non guarisce, si rifà il trattamento delle radici.","b":[["Perché","Canale non individuato, ricostruzione troppo tardiva, nuova carie, restauro che perde."],["Le fasi","Rimuovere i restauri, togliere il vecchio materiale, cercare altri canali, pulire, disinfettare, otturare, poi ricostruire."]],"imgs":["c-retrait","c-etapes"]},"la-chirurgie-endodontique":{"s":"endodontie","t":"La chirurgia endodontica","lead":"Quando il ritrattamento fallisce o non è possibile (strumento rotto, curvatura, canale calcificato…).","b":[["Il gesto","Al microscopio, si rimuove il tessuto infetto tagliando l’estremità della radice, poi si otturano i canali dall’apice con un materiale biocompatibile."]],"imgs":["c-chir-endo"]}},"tech":[{"t":"Telecamera per impronte ottiche","p":"Niente più pasta: nessun conato, nessun cattivo sapore, una precisione che evita appuntamenti in più.","img":"t-rect54"},{"t":"Chirurgia guidata e navigazione","p":"Il computer guida la fresa e l’impianto in 3D per tutta la durata dell’intervento.","img":"t-rect5"},{"t":"AIRFLOW ONE","p":"Mantenimento parodontale secondo la Guided Biofilm Therapy. Il parodontologo esclusivo si è formato in Germania e in Svizzera.","img":"fauteuil"},{"t":"Radiografia 3D cone beam","p":"Panoramica e TAC 3D in sede: diagnosi immediata, meno radiazioni, costo complessivo di un trattamento implantare ridotto.","img":"t-radio"},{"t":"Microscopio operatorio","p":"L’endodontista esclusivo lavora con questo strumento. Serve anche a individuare fessure e fratture radicolari e per le protesi estetiche.","img":"t-8004122"},{"t":"Piezochirurgia","p":"Ultrasuoni per correggere o prelevare l’osso con una precisione micrometrica.","img":"t-piezo"}],"blocs":{"t":"Tre sale operatorie","p":"Dedicate alla chirurgia e alla microchirurgia, per operare in condizioni ottimali di ergonomia e asepsi."},"team":{"docs":[["dr-clarisse","Dr Clarisse Bonnet","Odontoiatria restaurativa estetica"],["dr-marie","Dr Marie Bonnet","Ortodonzia"],["dr-franck","Dr Franck Bonnet","Implantologia, riabilitazioni complesse"],["dr-rathelot","Dr Benjamin Rathelot","Parodontologia"],["dr-panaras","Dr Héloïse Panaras","Odontoiatria pediatrica"],["dr-guerson","Dr Yaël Guerson","Mantenimento parodontale"],["dr-manders","Dr Rian Manders","Odontoiatria generale e mantenimento parodontale"]],"staff":[["eq-helene","Hélène","Accoglienza e segreteria"],["eq-joy","Joy","Assistente dentale qualificata"],["eq-dounia","Dounia","Assistente dentale qualificata"],["eq-anna","Anna","Assistente dentale qualificata"],["eq-vania","Vania","Assistente dentale qualificata"],["eq-sabine","Sabine","Addetta alla sterilizzazione"],["eq-zorica","Zorica","Assistente di direzione"],["eq-elisa","Elisa","Responsabile comunicazione"],["eq-morgane","Morgane","Community manager"]],"motto":"Fare di tutto perché i pazienti siano curati come vorremmo esserlo noi stessi."},"advice":{"la-prevention-votre-meilleur-allie-sante":{"t":"La prevenzione, la sua migliore alleata","img":"k-prev","p":["Alcuni problemi iniziano in silenzio: una visita all’anno permette di individuarli in tempo.","Durante l’appuntamento il dentista esamina denti, gengive, cure già eseguite e igiene; se serve, si aggiungono delle radiografie.","Ogni giorno: spazzolare i denti almeno due volte, dopo i pasti, e ridurre gli zuccheri, soprattutto fuori pasto."]},"douleurs-et-si-cetait-vos-gencives":{"t":"Dolori: e se fossero le gengive?","img":"k-douleurs","p":["Gengiva rossa e gonfia: è una gengivite, dovuta alla placca.","Sanguinamento allo spazzolamento, alito cattivo, sensibilità al caldo o al freddo, gengiva che si ritira: tutti campanelli d’allarme.","Consulti il dentista per evitare che evolva in parodontite."]},"zoom-sur-les-causes-des-douleurs-gingivales":{"t":"Le cause dei dolori alle gengive","img":"k-causes","p":["Spazzolamento insufficiente (meglio uno spazzolino morbido), gengivite e poi parodontite.","Ferite, cambiamenti ormonali (gravidanza, pubertà, menopausa), digrignamento dei denti.","Carie che avanza, apparecchi o protesi che irritano, denti del giudizio che spuntano."]},"votre-suivi-orthodontique-avec-dental-monitoring":{"t":"Il suo controllo ortodontico con Dental Monitoring","img":"k-dm","p":["L’app segue il suo trattamento anche quando non è in studio.","Riceve un’e-mail, scarica l’app (Apple o Android) e la attiviamo insieme all’appuntamento di valutazione con una prima scansione.","In seguito, il team risponde alle sue domande tramite la messaggistica dell’app."]},"les-dents-de-sagesse":{"t":"I denti del giudizio","img":"k-sagesse","p":["Spuntano in genere tra i 17 e i 21 anni; il 22 % delle persone non ne ha nessuno.","Se manca lo spazio, è meglio toglierli: disturbano gli altri denti e favoriscono le carie.","Dopo l’estrazione: garza se sanguina, ghiaccio se si gonfia, cibi morbidi e tiepidi, né fumo né alcol."]},"eviter-les-maladies-parodontales":{"t":"Evitare le malattie delle gengive","img":"k-gingivite","p":["La placca si calcifica in tartaro in 72 ore e mantiene l’infiammazione.","Una gengiva sana è rosa e soda; rossa, liscia e sanguinante: occorre consultare il dentista.","Spazzolino morbido due volte al giorno, filo e scovolini, igiene professionale annuale. Una recessione si cura adattando lo spazzolamento, talvolta con un innesto."]},"quest-ce-que-lorthodontie-fonctionnelle":{"t":"L’ortodonzia funzionale","img":"k-ortho","p":["Agire durante la crescita su respirazione, masticazione, deglutizione e postura.","Respirare con la bocca, succhiare il pollice a lungo o mantenere una deglutizione infantile deformano le mandibole.","Osteopati, otorinolaringoiatri, logopedisti o fisioterapisti possono completare il trattamento."]},"les-bons-reflexes-pour-se-brosser-les-dents-avec-un-appareil-dentaire":{"t":"Spazzolare i denti con l’apparecchio","img":"k-brossage","p":["Almeno due spazzolamenti al giorno, idealmente tre, e niente spuntini fuori pasto.","Due minuti, passando sotto il filo e insistendo sul bordo della gengiva; una gengiva che sanguina richiede più spazzolamento, non meno.","Spazzolino piccolo e morbido o elettrico, e uno scovolino per finire."]},"tracas-appareil-dentaire":{"t":"I piccoli fastidi dell’apparecchio","img":"k-tracas","p":["Denti che «tirano» all’inizio e dopo ogni regolazione: passa in 24-48 ore. Cibi morbidi o freddi, analgesici se serve.","Guance o labbra irritate: la cera ortodontica protegge.","Un filo che sporge: lo rimetta a posto con una pinzetta e ci scriva a contact@drs-bonnet-associes.fr."]},"piercings-buccaux-et-consequences-sur-votre-sante-dentaire":{"t":"Piercing alla bocca e salute dei denti","img":"k-piercing","p":["Uno studio presentato a EuroPerio (Pr Clemens Walter, università di Greifswald) collega i piercing a labbra e lingua a recessioni gengivali e a tasche più profonde.","Più a lungo si porta il piercing, più il rischio aumenta.","Ne parli con il suo dentista durante le cure."]},"mieux-respirer-un-des-principaux-bienfaits-de-lorthodontie":{"t":"Respirare meglio grazie all’ortodonzia","img":"k-respirer","p":["Bocca aperta, labbra secche, naso chiuso, occhiaie: forse il bambino respira male.","Respirare con il naso filtra e riscalda l’aria, aiuta il sonno e modella il viso.","Un trattamento precoce, con l’otorino e il pediatra, può ristabilire una buona ventilazione. Anche imparare a soffiarsi il naso e a lavarlo aiuta."]},"limpact-du-grignotage-sur-la-sante-bucco-dentaire":{"t":"Gli spuntini e i suoi denti","img":"k-grignotage","p":["Ogni spuntino moltiplica gli attacchi acidi sullo smalto.","Quattro pasti al giorno: colazione, pranzo, merenda, cena. L’acqua è l’unica bevanda amica dei denti.","Filo o scovolini prima dello spazzolamento, 2 minuti, una dose di dentifricio grande come una nocciolina, spazzolino cambiato ogni 3 mesi e mai condiviso. Fonte: UFSBD."]},"quest-ce-que-le-bruxisme-grincement-serrement-des-dents":{"t":"Il bruxismo (digrignare o serrare i denti)","img":"k-bruxisme","p":["Soprattutto di notte (80 % dei casi), 10-15 % dei francesi: usura, dolori a guance e tempie, al risveglio.","Si trattano le conseguenze: bite notturno, gestione dello stress, restauri se necessario.","In caso di forti dolori, la tossina botulinica; talvolta l’ortodonzia. Fonte: UFSBD."]}},"reviews":[["Céline Leclercq","18/02/2026","Un grand merci au Dr Marie Bonnet et Joy qui m’ont refait mon sourire et je peux vous dire que je partais de très loin, grâce à elles je peux sourire sans honte. Elles ont été très professionnelles, je recommande sans hésiter."],["Laetitia Wneczak ép. Saladino","20/05/2026","Entièrement satisfaite de la prise en charge en orthodontie pour ma fille de 9 ans. Dr Marie Bonnet et son assistante Joy sont très compétentes et super gentilles ! De plus, le nouveau cabinet est absolument splendide !!"],["thierry vidal rossines","30/01/2026","Accueil parfait, prise en charge de mes problèmes adaptée, mise en place des implants sans aucune douleur… L’ensemble des professionnels sont à l’écoute. À recommander obligatoirement."],["Léonie Taton","04/12/2025","Je suis ravie d’avoir été soignée par le Dr Clarisse Bonnet. Elle est à la fois très professionnelle, douce et à l’écoute. Elle prend le temps d’expliquer chaque étape, ce qui met vraiment en confiance. Les soins ont été réalisés avec beaucoup de sérieux et sans douleur."],["Mathieu FERRAND","01/12/2025","Superbe travail de reconstruction en composite sur incisives fracturées. Excellente praticienne, douce, minutieuse et passionnée. J’éprouve une totale satisfaction sur le plan esthétique comme fonctionnel !"],["Véronique DUBROCARD IMBARD","04/03/2025","Suivie par le Docteur Franck Bonnet depuis plusieurs années, je recommande ce praticien très professionnel et à l’écoute. Travail soigné et le Dr Bonnet est très rassurant et patient avec les phobiques stressées comme moi."],["jc brun","04/02/2025","Un grand merci à Clarisse et Marie pour les bons soins prodigués. Travail de haute qualité et précision pour un beau sourire retrouvé ! Merci à l’équipe !"],["Brooke Gynt","21/07/2024","Le Dr Clarisse Bonnet m’a tout de suite mise à l’aise et a fait un très bon travail en soignant mes caries. Le personnel est accueillant et professionnel, et l’ambiance du cabinet est très agréable."],["Baptiste PHILIBERT","18/04/2024","Super travail, très minutieux et très professionnel, super équipe et tout le monde très sympa ! Au top !"],["Christine HUSS","","Elle m’a donné, avec quelques modifications et sans me limer les dents, un éclat à mon sourire. En plus elle est très douce. Son papa m’a déjà fait un implant et ma paro a été traitée dans le même cabinet. Pour moi « the best » de la région."]],"contact":{"title":"Venire allo studio","address":"2 rond-point Duboys d’Angers, 06400 Cannes","parking":"Parcheggio: parking Palais Stéphanie a 90 m; parking Lamy a 150 m (2 ore gratuite, una volta a settimana).","hours":[["08h30","18h00"],["08h30","18h00"],["09h00","19h00"],["08h30","18h00"],["08h30","18h00"],null],"phone_label":"Per prenotare e per qualsiasi domanda","form_title":"Richiesta di appuntamento","form_lead":"Lasci i suoi recapiti: la segreteria la richiama per fissare l’orario. La sua richiesta parte per e-mail verso lo studio.","f_name":"Nome e cognome","f_phone":"Telefono","f_email":"E-mail","f_spec":"Specialità interessata","f_spec_any":"Non lo so ancora","f_who":"Per chi?","f_who_me":"Per me","f_who_child":"Per mio figlio","f_msg":"Il suo messaggio (motivo, disponibilità)","f_new":"Sono un nuovo paziente","f_ok":"Si apre la vostra posta con la richiesta pronta da inviare. Se non si apre nulla, scrivete a contact@drs-bonnet-associes.fr o chiamate lo 04 93 99 72 81.","f_err":"Indichi per favore il suo nome e un telefono o un’e-mail.","f_privacy":"I suoi dati servono unicamente a ricontattarla. Diritto di accesso e cancellazione: cnil@drs-bonnet-associes.fr","doctolib_note":"La Dr Marie Bonnet (ortodonzia) riceve gli appuntamenti anche su Doctolib.","urgent":"In caso di dolore, chiami direttamente lo studio.","f_bad":"Questo campo sembra inco
