c-ortho-e1b","c-ortho-e2a|c-ortho-e2b","c-ortho-a1a|c-ortho-a1b","c-ortho-a2a|c-ortho-a2b","c-ortho-a3a|c-ortho-a3b"]},"lorthodontie":{"s":"orthodontie","t":"Orthodontic treatments","lead":"Four ways to move teeth, chosen according to age, the case and your daily life.","b":[["Preventive","In children, rebalance lips, cheeks and tongue for harmonious growth; correct misalignments and bad habits (breathing, swallowing, chewing). Custom appliances from an optical impression, and functional education exercises."],["Classic","Bonded metal brackets: the DAMON Q® system, self-ligating, with high-tech archwires and light forces."],["Discreet","The same brackets in ceramic: the DAMON CLEAR® system, sturdy and almost invisible."],["Clear","Custom INVISALIGN® aligners, for adults, teenagers and some children. Discreet and comfortable, but they require good cooperation."]],"videos":[["nsxbY1URF4c","Introduction"],["wM0ODjt3MrU","Care and wear"],["S_DnJC5nhe8","Breathing exercises"],["UKFd2jAGlPA","Muscle exercises"]]},"la-prise-en-charge-en-orthodontie":{"s":"orthodontie","t":"How orthodontic care works","lead":"Five steps, from the first appointment to the yearly check-up.","b":[["First consultation","Examination, one or more treatment plans, timelines and financing explained."],["Assessment","Photos, X-rays and a digital impression to make the diagnosis."],["Fitting","Clear trays tried on or brackets bonded: treatment begins."],["Removal and retention","When the correction is optimal, the appliance is removed and a comfortable retainer secures the result."],["Follow-up","Visits at 1, 3 and 6 months, then once a year."]]},"la-chirurgie-orale-au-service-de-lorthodontie":{"s":"orthodontie","t":"Oral surgery in support of orthodontics","lead":"Sometimes a small surgical procedure makes treatment possible, or faster.","b":[["When","Uncover an impacted tooth, place anchorage mini-screws, mobilise a tooth, remove wisdom teeth or extra teeth, always in agreement with your referring dentist. Impacted teeth are located in 3D."],["Speeding up","Corticotomies and piezocision loosen the bone around the teeth under local anaesthetic: to move faster in adults, to move ankylosed teeth or impacted canines, to treat despite bone loss."]]},"les-malpositions-dentaires":{"s":"orthodontie","t":"Misaligned teeth","lead":"Too much or too little room, and the teeth settle as best they can.","b":[["The risks","Aesthetic discomfort, unbalanced chewing, jaw joint problems, wear and fractures, speech, bitten gums, incomplete brushing."],["The causes","Teeth and jaws of different sizes (hereditary), late permanent teeth, disturbed functions: infantile swallowing, mouth breathing."],["The solutions","Stop thumb-sucking and dummies in time, retraining (swallowing, speech, nasal breathing), extraction of problematic baby teeth, treatment suited to the age."]]},"les-colorations-dentaires":{"s":"esthetique","t":"Tooth stains and wear","lead":"Tobacco, tea, coffee, wine, certain mouthwashes or iron: enamel, slightly porous, takes on colour.","by":"Dr Clarisse Bonnet","b":[["My teeth are stained","Daily hygiene, regular scaling and polishing are often enough. Avoid overly abrasive toothpastes. For small enamel defects: micro-abrasion."],["Amalgam-free","A small cavity is repaired in composite during the visit; a large one, with a bonded inlay or onlay made from an impression."],["A root-treated tooth that darkens","If it is not too damaged, an internal whitening gives it back its brightness."]],"cases":["c-col-a1|c-col-b1","c-col-a2|c-col-b2"]},"le-blanchiment-des-dents":{"s":"esthetique","t":"Teeth whitening","lead":"Bring back the brightness of your natural tooth shade, at home, under the practice’s supervision.","by":"Dr Clarisse Bonnet","b":[["First of all","A consultation to rule out cavities, leaks or inflamed gums, then scaling and polishing. Deep enamel stains are better treated with veneers."],["Three sessions","Impressions and a reference photo; trays and gel handed over; check-up after 15 days. The gel is worn 2 hours a day at first, then overnight, generally for 15 days (up to 6 weeks). The shade changes from the 3rd day."],["Keep your trays","They can be used again, for example after a scaling, for a quick boost."],["Root-treated tooth","A gel placed inside the tooth, with the root protected, gives it back the shade of its neighbours."]],"cases":["c-bl-a1|c-bl-b1","c-bl-a2|c-bl-b2","c-bl-a3|c-bl-b3"]},"les-restaurations-esthetiques-directes-et-indirectes":{"s":"esthetique","t":"Aesthetic restorations","lead":"Repair the tooth while keeping as much healthy tissue as possible, thanks to bonding.","by":"Dr Clarisse Bonnet","b":[["Direct","For a cavity, a crack or a limited fracture: a composite placed under a rubber dam, shaped then polished, in a single visit."],["Indirect","For larger loss: a ceramic inlay or onlay, made in the laboratory from an impression, then bonded under a rubber dam for a watertight seal."]],"cases":["c-res-a1|c-res-b1","c-res-a2|c-res-b2","c-res-a3|c-res-b3","c-res-a4|c-res-b4"]},"les-facettes-ceramiques":{"s":"esthetique","t":"Virtual planning and veneers","lead":"See your future smile before any irreversible step.","by":"Dr Clarisse Bonnet","b":[["Simulate","After a photo assessment, virtual planning sets the goals with you; a mock-up in the mouth makes the project tangible for the whole team (orthodontist, implantologist, dental technician)."],["Veneers","Very thin ceramic shells bonded to the visible surface of the teeth: shade, small misalignments, wear. A natural result while preserving the tooth."]],"cases":["c-fac-a1|c-fac-b1","c-fac-a2|c-fac-b2"]},"les-couronnes-sur-implants-par-avec-technique-dempreinte-numerique":{"s":"esthetique","t":"Crowns on implants, digital impression","lead":"After the implant is placed, a camera replaces the impression paste to make the ceramic crown.","b":[["More comfortable","No more impression material in the mouth: more pleasant and very precise."]],"cases":["c-couronne"]},"injection-dacide-hyaluronique":{"s":"esthetique","t":"Hyaluronic acid injection","lead":"A smile is also about the lips: dentists can inject around the mouth and the lower face.","b":[["Why","With age, lips lose volume, and wrinkles and folds appear. The injection restores volume or fills wrinkles around the lips, within a therapeutic framework."],["The product","A molecule naturally present in the skin, known since 1934. The one used at the practice is of non-animal origin, biocompatible and resorbable."],["Where","Nasolabial folds, marionette lines, wrinkles and fine lines around the mouth, lip border, jawline."],["Result and duration","Visible straight away, optimal at 10 days, it lasts 12 to 18 months depending on the product. Rarely, slight swelling or redness that quickly fades. Products approved by the Afssaps."]]},"la-petite-souris":{"s":"pedodontie","t":"The practice’s little mouse","lead":"She lives behind a shelf in the practice, with polka-dot curtains and a lamp made from a toothpaste cap.","b":[["Her mission","When a baby tooth falls out, she collects it and leaves a shiny coin. She receives lots of letters and drawings. And here, there are no cats."],["The “little mouse” kit","A mouse-shaped box to slip the tooth under the pillow, a chart to follow your baby teeth and a little note signed with her paw. Ask your dentist for it!"]],"imgs":["souris","pochons","souris2"]},"soins-pour-les-enfants":{"s":"pedodontie","t":"Care for children","lead":"Dr Héloïse Panaras, paediatric dentist, welcomes children and teenagers with gentleness.","by":"Dr Héloïse Panaras","b":[["Why a paediatric dentist","Prevent cavities, monitor teeth and jaws, support the first permanent teeth, make treatment feel familiar."],["At the practice","Personalised follow-up, tailored prevention, support for anxiety, a place designed for the youngest. Every step is explained to the child and to the parents."]],"imgs":["dr-panaras","salle-enf"]},"salle-attente-dediee-aux-mini-patients":{"s":"pedodontie","t":"The mini-patients’ waiting room","lead":"A colourful space just for them: books, colouring, cartoons, and the little mouse’s door.","b":[["Trust starts here","Everything is designed to make the visit calm, from arrival to the chair."]],"imgs":["mxl547","mxl535","mxl539","mxl533","cab4"]},"le-traitement-endodontique":{"s":"endodontie","t":"Endodontic treatment","lead":"Treat the inside of the tooth when the pulp is inflamed or infected, to avoid pain and abscesses.","b":[["Keeping the tooth alive","If the inflammation is limited, the decay is removed under the microscope and the pulp is “capped” with a material that helps it heal."],["Root canal treatment","Cleaning, shaping, disinfection, then watertight filling of the canals, under a rubber dam. The tooth is then rebuilt by your dentist."],["A specialist","Microscope, apex locator, ultrasound, warm obturation, 3D imaging: a technical platform for complex cases. Source: Société Française d’Endodontie."]],"imgs":["c-endo1","c-endo2"]},"le-retraitement-endodontique":{"s":"endodontie","t":"Endodontic retreatment","lead":"When a tooth that has already been treated becomes infected or does not heal, the root treatment is redone.","b":[["Why","Undetected canal, restoration placed too late, new cavity, leaking restoration."],["The steps","Remove the restorations, take out the old material, look for other canals, clean, disinfect, fill, then rebuild."]],"imgs":["c-retrait","c-etapes"]},"la-chirurgie-endodontique":{"s":"endodontie","t":"Endodontic surgery","lead":"When retreatment fails or is not possible (broken instrument, curvature, calcified canal…).","b":[["The procedure","Under the microscope, the infected tissue is removed by cutting the tip of the root, then the canal is sealed from the end with a biocompatible material."]],"imgs":["c-chir-endo"]}},"tech":[{"t":"Optical impression camera","p":"No more paste: no gagging or bad taste, and a precision that avoids extra appointments.","img":"t-rect54"},{"t":"Guided surgery and navigation","p":"The computer guides the drill and the implant in 3D throughout the procedure.","img":"t-rect5"},{"t":"AIRFLOW ONE","p":"Periodontal maintenance following Guided Biofilm Therapy. The practice’s exclusive periodontist trained in Germany and Switzerland.","img":"fauteuil"},{"t":"3D cone beam X-ray","p":"Panoramic X-ray and 3D scan on site: immediate diagnosis, less radiation, lower overall cost of implant treatment.","img":"t-radio"},{"t":"Operating microscope","p":"The exclusive endodontist works with it. It is also used to spot cracks and root fractures, and for aesthetic prosthetics.","img":"t-8004122"},{"t":"Piezosurgery","p":"Ultrasound to reshape or harvest bone with micrometric precision.","img":"t-piezo"}],"blocs":{"t":"Three operating rooms","p":"Dedicated to surgery and microsurgery, to operate in optimal conditions of ergonomics and asepsis."},"team":{"docs":[["dr-clarisse","Dr Clarisse Bonnet","Aesthetic restorative dentistry"],["dr-marie","Dr Marie Bonnet","Orthodontics"],["dr-franck","Dr Franck Bonnet","Implantology, complex rehabilitations"],["dr-rathelot","Dr Benjamin Rathelot","Periodontics"],["dr-panaras","Dr Héloïse Panaras","Paediatric dentistry"],["dr-guerson","Dr Yaël Guerson","Periodontal maintenance"],["dr-manders","Dr Rian Manders","General dentistry and periodontal maintenance"]],"staff":[["eq-helene","Hélène","Reception and administration"],["eq-joy","Joy","Qualified dental assistant"],["eq-dounia","Dounia","Qualified dental assistant"],["eq-anna","Anna","Qualified dental assistant"],["eq-vania","Vania","Qualified dental assistant"],["eq-sabine","Sabine","Sterilisation technician"],["eq-zorica","Zorica","Executive assistant"],["eq-elisa","Elisa","Communications manager"],["eq-morgane","Morgane","Community manager"]],"motto":"Do everything we can so that patients are cared for the way we would want to be ourselves."},"advice":{"la-prevention-votre-meilleur-allie-sante":{"t":"Prevention, your best ally","img":"k-prev","p":["Some problems start silently: one visit a year lets us catch them in time.","At the appointment, the dentist examines teeth, gums, existing work and hygiene; X-rays are added if needed.","Day to day: brush at least twice a day, after meals, and eat less sugar, especially between meals."]},"douleurs-et-si-cetait-vos-gencives":{"t":"Pain: could it be your gums?","img":"k-douleurs","p":["Red, swollen gums: that is gingivitis, caused by plaque.","Bleeding when brushing, bad breath, sensitivity to hot or cold, receding gums: all warning signs.","See us to stop it turning into periodontitis."]},"zoom-sur-les-causes-des-douleurs-gingivales":{"t":"The causes of gum pain","img":"k-causes","p":["Insufficient brushing (choose a soft brush), gingivitis then periodontitis.","Injury, hormonal changes (pregnancy, puberty, menopause), teeth grinding.","A cavity that is progressing, braces or prostheses that irritate, wisdom teeth coming through."]},"votre-suivi-orthodontique-avec-dental-monitoring":{"t":"Your orthodontic follow-up with Dental Monitoring","img":"k-dm","p":["The app tracks your treatment even when you are not at the practice.","You receive an e-mail, download the app (Apple or Android), and we activate it together at the assessment appointment with a first scan.","Afterwards, the team answers your questions through the app’s messaging."]},"les-dents-de-sagesse":{"t":"Wisdom teeth","img":"k-sagesse","p":["They usually come through between 17 and 21; 22% of people have none.","If there is no room, it is better to remove them: they crowd the other teeth and encourage cavities.","After extraction: gauze if it bleeds, ice if it swells, soft and lukewarm food, no tobacco or alcohol."]},"eviter-les-maladies-parodontales":{"t":"Preventing gum disease","img":"k-gingivite","p":["Plaque hardens into tartar within 72 hours and feeds inflammation.","A healthy gum is pink and firm; red, shiny and bleeding: time to see us.","Soft brush twice a day, floss and interdental brushes, a scaling every year. Gum recession is treated by adapting your brushing, sometimes with a graft."]},"quest-ce-que-lorthodontie-fonctionnelle":{"t":"Functional orthodontics","img":"k-ortho","p":["Act during growth on breathing, chewing, swallowing and posture.","Mouth breathing, late thumb-sucking or keeping a baby’s swallowing pattern deform the jaws.","Osteopaths, ENT doctors, speech therapists or physiotherapists can complement the treatment."]},"les-bons-reflexes-pour-se-brosser-les-dents-avec-un-appareil-dentaire":{"t":"Brushing your teeth with braces","img":"k-brossage","p":["At least two brushings a day, ideally three, and no snacking.","Two minutes, going under the wire and focusing on the gum line; a bleeding gum needs more brushing, not less.","A small soft or electric brush, and an interdental brush to finish."]},"tracas-appareil-dentaire":{"t":"The little nuisances of braces","img":"k-tracas","p":["Teeth that feel “pulled” at first and after each adjustment: it passes in 24 to 48 hours. Soft or iced food, painkillers if needed.","Irritated cheeks or lips: orthodontic wax protects them.","A wire sticking out: push it back with tweezers and write to us at contact@drs-bonnet-associes.fr."]},"piercings-buccaux-et-consequences-sur-votre-sante-dentaire":{"t":"Mouth piercings and dental health","img":"k-piercing","p":["A study presented at EuroPerio (Prof. Clemens Walter, University of Greifswald) links lip and tongue piercings to gum recession and deeper pockets.","The longer the piercing is worn, the higher the risk.","Talk to your dentist about it during your appointments."]},"mieux-respirer-un-des-principaux-bienfaits-de-lorthodontie":{"t":"Breathing better thanks to orthodontics","img":"k-respirer","p":["Open mouth, dry lips, blocked nose, dark circles: a child may not be breathing well.","Breathing through the nose filters and warms the air, helps sleep and shapes the face.","Early treatment, together with the ENT doctor and the paediatrician, can restore good breathing. Learning to blow the nose and rinse it also helps."]},"limpact-du-grignotage-sur-la-sante-bucco-dentaire":{"t":"Snacking and your teeth","img":"k-grignotage","p":["Every snack multiplies the acid attacks on enamel.","Four times a day: breakfast, lunch, afternoon snack, dinner. Water is the only drink that is friendly to teeth.","Floss or interdental brushes before brushing, 2 minutes, a pea-sized amount of toothpaste, brush replaced every 3 months and never shared. Source: UFSBD."]},"quest-ce-que-le-bruxisme-grincement-serrement-des-dents":{"t":"Bruxism (grinding or clenching your teeth)","img":"k-bruxisme","p":["Mostly at night (80% of cases), 10 to 15% of French people: wear, pain in the cheeks and temples, on waking.","We treat the consequences: a night guard, stress management, restorations if needed.","For severe pain, botulinum toxin; sometimes orthodontics. Source: UFSBD."]}},"reviews":[["Céline Leclercq","18/02/2026","Un grand merci au Dr Marie Bonnet et Joy qui m’ont refait mon sourire et je peux vous dire que je partais de très loin, grâce à elles je peux sourire sans honte. Elles ont été très professionnelles, je recommande sans hésiter."],["Laetitia Wneczak ép. Saladino","20/05/2026","Entièrement satisfaite de la prise en charge en orthodontie pour ma fille de 9 ans. Dr Marie Bonnet et son assistante Joy sont très compétentes et super gentilles ! De plus, le nouveau cabinet est absolument splendide !!"],["thierry vidal rossines","30/01/2026","Accueil parfait, prise en charge de mes problèmes adaptée, mise en place des implants sans aucune douleur… L’ensemble des professionnels sont à l’écoute. À recommander obligatoirement."],["Léonie Taton","04/12/2025","Je suis ravie d’avoir été soignée par le Dr Clarisse Bonnet. Elle est à la fois très professionnelle, douce et à l’écoute. Elle prend le temps d’expliquer chaque étape, ce qui met vraiment en confiance. Les soins ont été réalisés avec beaucoup de sérieux et sans douleur."],["Mathieu FERRAND","01/12/2025","Superbe travail de reconstruction en composite sur incisives fracturées. Excellente praticienne, douce, minutieuse et passionnée. J’éprouve une totale satisfaction sur le plan esthétique comme fonctionnel !"],["Véronique DUBROCARD IMBARD","04/03/2025","Suivie par le Docteur Franck Bonnet depuis plusieurs années, je recommande ce praticien très professionnel et à l’écoute. Travail soigné et le Dr Bonnet est très rassurant et patient avec les phobiques stressées comme moi."],["jc brun","04/02/2025","Un grand merci à Clarisse et Marie pour les bons soins prodigués. Travail de haute qualité et précision pour un beau sourire retrouvé ! Merci à l’équipe !"],["Brooke Gynt","21/07/2024","Le Dr Clarisse Bonnet m’a tout de suite mise à l’aise et a fait un très bon travail en soignant mes caries. Le personnel est accueillant et professionnel, et l’ambiance du cabinet est très agréable."],["Baptiste PHILIBERT","18/04/2024","Super travail, très minutieux et très professionnel, super équipe et tout le monde très sympa ! Au top !"],["Christine HUSS","","Elle m’a donné, avec quelques modifications et sans me limer les dents, un éclat à mon sourire. En plus elle est très douce. Son papa m’a déjà fait un implant et ma paro a été traitée dans le même cabinet. Pour moi « the best » de la région."]],"contact":{"title":"Visit the practice","address":"2 rond-point Duboys d’Angers, 06400 Cannes","parking":"Parking: Palais Stéphanie car park 90 m away; Lamy car park 150 m away (2 free hours, once a week).","hours":[["08h30","18h00"],["08h30","18h00"],["09h00","19h00"],["08h30","18h00"],["08h30","18h00"],null],"phone_label":"To book an appointment and for any question","form_title":"Appointment request","form_lead":"Leave your details: the secretariat will call you back to set a time. Your request is sent by e-mail to the practice.","f_name":"Full name","f_phone":"Phone","f_email":"E-mail","f_spec":"Specialty concerned","f_spec_any":"I don’t know yet","f_who":"For whom?","f_who_me":"For me","f_who_child":"For my child","f_msg":"Your message (reason, availability)","f_new":"I am a new patient","f_ok":"Your email app opens with the request ready to send. If nothing opens, write to contact@drs-bonnet-associes.fr or call 04 93 99 72 81.","f_err":"Please enter your name and a phone number or an e-mail.","f_privacy":"Your data is used only to get back to you. Right of access and deletion: cnil@drs-bonnet-associes.fr","doctolib_note":"Dr Marie Bonnet (orthodontics) also takes appointments on Doctolib.","urgent":"If you are in pain, call the practice directly.","f_bad":"This field looks incomplete: please check it."},"clinic":{"title":"The clinic","lead":"A fully medicalised facility that handles complex rehabilitations every day, with a multidisciplinary team.","caps":["Reception","The corridor of treatment rooms","The waiting room","The children’s corner","A treatment room","The chair","A treatment room","Dr Franck Bonnet in consultation","Dr Clarisse Bonnet with a patient","Dr Marie Bonnet at the chair","Dr Benjamin Rathelot at the chair","The façade","A treatment chair"]},"kids":{"title":"Children have their own dentist, their own room and their own mouse","lead":"Dr Héloïse Panaras, paediatric dentist, a colourful waiting room, and the little mouse who lives in the practice."},"insta":[["cabinet.dentaire.cannes","Le cabinet"],["drfranckbonnet","Dr Franck Bonnet"],["drbonnet.ortho","Orthodontie"],["drbonnet.esthetics","Esthétique"]],"legal":{"title":"Legal notice","p":[["Website ownership","The website drs-bonnet-associes.fr is owned by Dr Franck Bonnet, dental surgeon, RPPS 10003600615."],["Registered office","Cabinet dentaire des Drs Bonnet & Associés, 2 rond-point Duboys d’Angers, 06400 Cannes. Tel. 04 93 99 72 81. APE: dental practice."],["Development","Current website developed and maintained by Mediweb, 32 boulevard du Président Poincaré, 67000 Strasbourg."],["Hosting","OVH SAS, 2 rue Kellermann, 59100 Roubaix."],["Publication director","Dr Franck Bonnet."],["Intellectual property","Texts, images, logos and files belong to Dr Franck Bonnet; any reproduction without permission is prohibited."],["Links","Ordre national des chirurgiens-dentistes: www.ordre-chirurgiens-dentistes.fr"],["Personal data (GDPR)","Right of access, rectification, deletion and objection: cnil@drs-bonnet-associes.fr"],["Cookies","This mock-up uses only anonymous audience measurement. The future website will ask for your consent before any non-essential cookie."]],"study":"The practice also organises Study Group evenings in Cannes."},"bot":{"name":"Bonnet Conseil","sub":"The practice’s virtual assistant","help":"I’ll help you choose","hello":"Hello, I’m Bonnet Conseil, the practice’s virtual assistant. I point you to the right specialist and answer practical questions. I don’t replace medical advice.","invite":"A question? I’ll point you to the right specialist.","ph":"Type your question…","chips":["I’m missing a tooth","My gums bleed","Straighten my teeth","Whiter teeth","For my child","Hours and directions"],"a_implant":"For one or more missing teeth, you want Dr Franck Bonnet’s implantology. The practice often places the implants and fixed temporary teeth in the same session, after a 3D assessment.","a_paro":"Bleeding gums are often gingivitis, sometimes the start of periodontitis. This is Dr Benjamin Rathelot’s specialty (periodontics). It is best to be seen without delay.","a_ortho":"To align teeth, in a child or an adult, you want Dr Marie Bonnet’s orthodontics: metal or ceramic braces (Damon) or Invisalign clear aligners. She also takes appointments on Doctolib.","a_esth":"Stains, a broken tooth, whitening or veneers: this is Dr Clarisse Bonnet’s aesthetic dentistry, with a simulation of your future smile before any procedure.","a_kids":"For children, Dr Héloïse Panaras is a paediatric dentist. There is a waiting room just for them, and the little mouse lives in the practice!","a_endo":"A very painful tooth, or one that was already root-treated and hurts, is often a matter for endodontics, done under the microscope by the practice’s endodontist. If you are in pain, call 04 93 99 72 81.","a_pain":"If you are in pain, the fastest way is to call the practice on 04 93 99 72 81. I can’t make a diagnosis, but the team will guide you.","a_hours":"The practice is open Monday, Tuesday, Thursday and Friday from 8:30 am to 6 pm, Wednesday from 9 am to 7 pm, and closed on Saturday. Address: 2 rond-point Duboys d’Angers, Cannes.","a_parking":"Two car parks close by: Palais Stéphanie, 90 m away, and Lamy, 150 m away (2 free hours, once a week).","a_rdv":"Call 04 93 99 72 81, or fill in the appointment request: the secretariat will call you back. For orthodontics, Doctolib is also an option.","a_price":"Fees are not published online: they depend on your assessment. They are explained at your first consultation, together with the treatment plan. The front desk can also help on 04 93 99 72 81.","a_fear":"It is very common, and you can mention it when you book. Several patients write in their reviews that the team put them at ease. For children, Dr Héloïse Panaras, a paediatric dentist, takes care of anxiety.","a_hya":"The practice offers hyaluronic acid injections around the mouth (lips, folds): the result is visible straight away and lasts 12 to 18 months.","a_lang":"The team speaks French; for another language, mention it when booking and the practice will tell you what is possible.","a_unknown":"I answer questions about the practice, its treatments, opening hours and access, and I do not have this information. The best is to call 04 93 99 72 81 or write to contact@drs-bonnet-associes.fr.","go_care":"See the page","go_rdv":"Request an appointment","a_urgent":"A crown that has come off, an implant that moves, a broken tooth or swelling: call the practice on 04 93 99 72 81 to be seen quickly. I cannot make a diagnosis. With fever or major swelling outside opening hours, call 15.","a_health":"Pregnancy, ongoing medication or a health condition: tell the practice when you book and the dentist will adapt your care. For a specific question, it is best to call 04 93 99 72 81.","a_hello":"Hello! Tell me what brings you here (a missing tooth, gums, braces, a child…) and I will point you to the right specialist.","a_pay":"For payment methods and insurance cover, the front desk will answer on 04 93 99 72 81: I do not have this information.","a_wisdom":"Wisdom teeth usually come through between 17 and 21; if there is no room, it is often better to remove them. The practice has a full advice sheet, and extraction is done under local anaesthetic.","a_brux":"Grinding or clenching your teeth (bruxism) wears the teeth and tires the jaw. It is mainly treated with a night guard; here is the practice’s advice sheet."}},"es":{"ui":{"skip":"Ir al contenido","lang":"Idioma","nav_accueil":"Inicio","nav_soins":"Tratamientos","nav_clinique":"La clínica","nav_equipe":"El equipo","nav_techno":"Tecnología","nav_enfants":"Niños","nav_conseils":"Consejos","nav_avis":"Opiniones","nav_contact":"Contacto","nav_conseil":"Bonnet Conseil","rdv":"Pedir cita","call":"Llamar a la clínica","close":"Cerrar","back":"Volver","read_more":"Leer más","see_care":"Ver el tratamiento","by":"Realizado por","before":"Antes","after":"Después","real_case":"Caso real de la clínica","cases_note":"Fotos de pacientes de la clínica, publicadas en el sitio actual. Cada boca es diferente: un resultado no se promete, se prepara juntos.","next":"Siguiente","prev":"Anterior","send":"Enviar","open_map":"Abrir el plano","footer_rights":"Drs Bonnet & Associés · Clínica dental especializada · Cannes","mentions":"Aviso legal","proposal":"Propuesta de rediseño realizada por Neovera Studio — maqueta sin valor contractual.","follow":"Seguir a la clínica","specialty":"Especialidad","all_care":"Todos los tratamientos de esta especialidad","related":"Para seguir leyendo","video":"Vídeo","videos_title":"Vídeos de educación funcional","watch":"Ver en YouTube","reviews_note":"Opiniones publicadas en el sitio actual, citadas tal cual (en francés).","illus":"imagen ilustrativa","doctolib":"Reservar en línea (Doctolib)","hours_closed":"Cerrado","menu_aria":"Menú principal","all_n":"Todos los tratamientos"},"days":["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],"home":{"title":"Su sonrisa, examinada de cerca.","lead":"Siete dentistas especialistas, tres quirófanos y tratamientos realizados con lupas o microscopio, en el corazón de Cannes.","spec_line":"Implantología · Estética · Ortodoncia · Periodoncia · Endodoncia · Odontopediatría","cta2":"Ver los tratamientos","hero_note":"2 rond-point Duboys d’Angers, Cannes · de lunes a viernes","loupe_title":"Bajo la lupa","loupe_lead":"Aquí, cada tratamiento se hace con aumento: lupas, microscopio operatorio, cámara de impresión. Pase la lupa sobre la foto para ver el trabajo terminado.","loupe_hint":"Deslice la lupa sobre la foto","loupe_hint_touch":"Toque y arrastre para mover la lupa","loupe_cases":[{"k":"col","t":"Manchas en dos incisivos","by":"Dr Clarisse Bonnet","care":"les-colorations-dentaires"},{"k":"res4","t":"Amalgamas sustituidas por cerámica","by":"Dr Clarisse Bonnet","care":"les-restaurations-esthetiques-directes-et-indirectes"},{"k":"res","t":"Composite en un diente roto","by":"Dr Clarisse Bonnet","care":"les-restaurations-esthetiques-directes-et-indirectes"},{"k":"bl","t":"Blanqueamiento","by":"Dr Clarisse Bonnet","care":"le-blanchiment-des-dents"}],"spec_title":"Cada especialidad tiene su especialista","spec_lead":"Cada profesional tiene formación de posgrado en su especialidad. Su historial pasa de un especialista a otro sin cambiar de dirección.","clinic_title":"Madera clara, paredes celadón y tres quirófanos","clinic_lead":"Un centro totalmente medicalizado y renovado por completo: madera clara, paredes de color celadón, una sala de espera solo para los niños. Y detrás, tres quirófanos dedicados a la cirugía y la microcirugía.","clinic_cta":"Visitar la clínica","team_title":"El equipo que le atiende","team_lead":"Especialistas que trabajan juntos en su plan de tratamiento, acompañados de asistentes cualificadas.","team_cta":"Conocer al equipo","process_title":"Cómo es su atención","process":[{"t":"La primera consulta","p":"Exploración clínica, fotos y radiografías en 2D y 3D, para un diagnóstico a fondo."},{"t":"El plan de tratamiento","p":"Elaborado en equipo, al servicio del paciente. Usted decide en cada etapa."},{"t":"El especialista adecuado","p":"Cada intervención la realiza el especialista o los especialistas correspondientes, en contacto con su dentista habitual si es necesario."},{"t":"El seguimiento","p":"Inmediato y a largo plazo, a cargo de los mismos especialistas."}],"process_note":"Siempre procuramos reducir al máximo el número de sesiones.","lab_title":"Prótesis hechas en Francia","lab_p":"Todas nuestras prótesis se fabrican en Francia, con protésicos especializados en estética y en prótesis sobre implantes, entre ellos el Sr. Jean-Pierre Casu, Meilleur Ouvrier de France.","quote":"Una sonrisa dura solo un instante, pero su recuerdo a veces es eterno.","quote_by":"Raoul Follereau, Le livre d’amour, « Le sourire » (1920)","reviews_title":"Lo que dicen los pacientes","advice_title":"Los consejos de la clínica","advice_lead":"Trece fichas para entender, prevenir y llevar bien un tratamiento.","insta_title":"La clínica en Instagram","insta_lead":"Entre bastidores, casos clínicos y pequeños momentos del equipo, en cuatro cuentas.","tech_line":"Seis equipos al servicio de la precisión","insta_note":"Las publicaciones aparecerán aquí en directo cuando el sitio esté instalado."},"specs":{"implantologie":{"t":"Implantología","p":"Sustituir uno, varios o todos los dientes por raíces de titanio, con dientes provisionales fijos colocados a veces el mismo día.","doc":"Dr Franck Bonnet"},"parodontologie":{"t":"Periodoncia","p":"Cuidar las encías y el hueso que sostienen sus dientes: la periodontitis afecta a casi uno de cada dos franceses, a menudo sin dolor.","doc":"Dr Benjamin Rathelot"},"orthodontie":{"t":"Ortodoncia","p":"Alinear los dientes y guiar el crecimiento, del niño al adulto: brackets metálicos, de cerámica o alineadores transparentes.","doc":"Dr Marie Bonnet"},"esthetique":{"t":"Estética","p":"Manchas, dientes rotos, color, carillas: una odontología que conserva el diente y busca la naturalidad.","doc":"Dr Clarisse Bonnet"},"pedodontie":{"t":"Odontopediatría","p":"Cuidados suaves para los niños, una sala de espera a su medida y un ratoncito que vive en la clínica.","doc":"Dr Héloïse Panaras"},"endodontie":{"t":"Endodoncia","p":"Tratar el interior del diente bajo microscopio para conservarlo, incluso cuando un primer tratamiento ha fracasado.","doc":"Endodoncista exclusivo de la clínica"}},"care":{"pose-dimplants-dentaires":{"s":"implantologie","t":"Colocación de implantes dentales","lead":"La intervención impresiona, pero es bastante rápida y, en la gran mayoría de los casos, la recuperación va muy bien.","b":[["Dónde y cómo","La colocación exige una asepsia rigurosa: se hace en la clínica o en quirófano. Con anestesia local, se abre la encía para acceder al hueso."],["Cierre en dos tiempos","El implante queda totalmente cubierto por la encía, protegido por un tornillo plano de titanio. Pasados de 4 a 6 meses y tras una radiografía de control, se descubre su cabeza, se coloca un tornillo de cicatrización y después el pilar que recibirá la prótesis, cementada o atornillada. Esta elección depende del hueso, de un injerto previo o del tabaco."],["O en un solo tiempo","La cabeza del implante queda visible con un tornillo de cicatrización: no hay segunda cirugía, pero el implante está menos protegido. Se reserva a los casos más favorables. En ambos casos, el hueso integra el implante en 4 a 6 meses."],["Nuestros consejos","Siga bien las indicaciones y mantenga una higiene rigurosa. En casos poco frecuentes, el implante se rechaza: entonces se coloca uno nuevo."]],"cases":["c-impl-avant|c-impl-apres","c-impl-9","c-impl-8","c-impl-5","c-impl-4","c-impl-10","c-impl-11","c-impl-bonnet","c-impl-2"]},"implant-dentaire":{"s":"implantologie","t":"Implante dental","lead":"Una «tercera dentición»: una raíz artificial colocada en el hueso, allí donde se perdió el diente.","b":[["Qué es","Un cilindro médicamente puro, integrado por el hueso, que recibe una corona, un puente o una arcada completa, o que estabiliza una prótesis removible. Se recuperan dientes fijos y naturales."],["Nuestro día a día","La clínica se centra en las rehabilitaciones complejas. En la misma intervención colocamos los implantes y los dientes provisionales fijos: el paciente recupera su sonrisa y la masticación en pocas horas."],["Planificado en 3D","Una reconstrucción 3D de la mandíbula, hecha a partir del escáner, permite simular la intervención. Unas guías quirúrgicas trasladan ese plan a la boca con precisión."],["La prótesis","Utilizamos zirconio, sin metal, para un resultado natural, y trabajamos con el Sr. Jean-Pierre Casu, protésico dental y Meilleur Ouvrier de France."]]},"la-maladie-parodontale":{"s":"parodontologie","t":"La enfermedad periodontal","lead":"La periodontitis (retracción de la encía) destruye poco a poco la inserción del diente, a menudo sin dolor. Cuando se nota, a veces es tarde.","b":[["Por qué","Un doble origen, bacteriano e inmunitario: las bacterias atacan y el organismo se defiende más o menos bien. Es indispensable un diagnóstico preciso y temprano."],["El tratamiento","Primero una limpieza profunda sin cirugía y una reevaluación a las 6 u 8 semanas. Si quedan bolsas, una cirugía de saneamiento en quirófano, a veces con biomateriales de regeneración. Después, el mantenimiento, de por vida."],["Las señales de alerta","Encías que sangran al cepillarse, rojas o inflamadas; mal aliento persistente; pus y mal sabor; dientes que se mueven, se separan o se aflojan; una mordida que cambia."],["Lo que lo agrava","Placa y sarro, tabaco, embarazo y pubertad, estrés, ciertos medicamentos, rechinar de dientes, malnutrición, enfermedades generales que afectan a la inmunidad."],["Nuestro seguimiento","Tratamientos con lupas, estudios radiográficos y «sondajes periodontales»; cada mes, todos los profesionales analizan los estudios."]]},"le-suivi-parodontal":{"s":"parodontologie","t":"El mantenimiento periodontal","lead":"Tan importante como el tratamiento: sin seguimiento, las bolsas se vuelven a infectar y el hueso sigue perdiéndose.","b":[["Por un especialista","Axelsson y Lindhe lo demostraron (1981, 2004): realizado por un especialista, el mantenimiento limita las recaídas, las caries y la pérdida de inserción."],["El protocolo GBT","En la clínica seguimos la Guided Biofilm Therapy, con el AIRFLOW ONE, para eliminar perfectamente la placa y el sarro."],["Una sesión tipo","Radiografías y cuestionario médico actualizados, examen de las encías, consejos personalizados y después detartraje, raspado, pulido e irrigación."],["El ritmo","Depende de su riesgo y de su higiene. Toda recaída se trata de inmediato. La salud de las encías está relacionada con la del corazón, la diabetes, los partos prematuros y la artritis reumatoide."]]},"la-chirurgie-mucco-gingivale-ou-chirurgie-plastique-parodontale":{"s":"parodontologie","t":"El injerto de encía","lead":"Cubrir una raíz expuesta, reforzar una encía demasiado fina o armonizar su contorno.","by":"Dr Benjamin Rathelot","b":[["Por qué cubrir una raíz","Sin esmalte, la raíz se desgasta, puede cariarse y se vuelve sensible al frío. Es posible cubrirla bajo ciertas condiciones, que se valoran en la exploración."],["Menos doloroso que antes","Microcirugía, obtención especial del injerto, férulas de protección: la experiencia ha cambiado. En fumadores, las posibilidades de éxito son escasas: dejar el tabaco es indispensable durante la cicatrización."]],"cases":["c-paro-av1|c-paro-ap1","c-paro-av2|c-paro-ap2","c-paro-av3|c-paro-ap3"]},"les-parodontites-dechaussement-des-dents":{"s":"parodontologie","t":"Las periodontitis (retracción de la encía)","lead":"Casi uno de cada dos franceses la padece. La pérdida de inserción avanza en silencio: mejor detectarla pronto.","b":[["Placa y sarro","La placa se forma con la saliva, las bacterias y los restos de comida. Si no se elimina bien, se mineraliza en sarro, más deprisa en quienes producen mucha saliva."],["El tratamiento","Saneamiento, reevaluación a las 6-8 semanas, cirugía si persisten bolsas y después mantenimiento de por vida. Las cirugías se hacen en quirófano, y todos los cuidados con lupas."],["También en la clínica","Auténticas «cirugías estéticas de las encías» para cubrir o reforzar las zonas frágiles."]]},"cas-cliniques-dorthodontie":{"s":"orthodontie","t":"Casos clínicos de ortodoncia","lead":"Cinco tratamientos, desde un niño de 8 años hasta un adulto.","by":"Dr Marie Bonnet","b":[["Niño","Tratamiento interceptivo a los 8 años con un educador funcional."],["Adolescente","Aparato fijo con brackets."],["Adulto","Brackets; alineadores transparentes; alineadores y después carillas."]],"cases":["c-ortho-e1a|c-ortho-e1b","c-ortho-e2a|c-ortho-e2b","c-ortho-a1a|c-ortho-a1b","c-ortho-a2a|c-ortho-a2b","c-ortho-a3a|c-ortho-a3b"]},"lorthodontie":{"s":"orthodontie","t":"Los tratamientos de ortodoncia","lead":"Cuatro maneras de mover los dientes, elegidas según la edad, el caso y su día a día.","b":[["Preventivo","En el niño, reequilibrar labios, mejillas y lengua para un crecimiento armonioso; corregir los desajustes y los malos hábitos (respiración, deglución, masticación). Aparatos a medida mediante impresión óptica y ejercicios de educación funcional."],["Clásico","Brackets metálicos pegados: el sistema DAMON Q®, autoligable, con arcos de alta tecnología y fuerzas ligeras."],["Discreto","Los mismos brackets en cerámica: el sistema DAMON CLEAR®, resistente y casi invisible."],["Transparente","Alineadores INVISALIGN® a medida, para adultos, adolescentes y algunos niños. Discreto y cómodo, pero requiere buena colaboración."]],"videos":[["nsxbY1URF4c","Presentación"],["wM0ODjt3MrU","Cuidado y uso"],["S_DnJC5nhe8","Ejercicios de respiración"],["UKFd2jAGlPA","Ejercicios musculares"]]},"la-prise-en-charge-en-orthodontie":{"s":"orthodontie","t":"Cómo es la atención en ortodoncia","lead":"Cinco etapas, desde la primera cita hasta la revisión anual.","b":[["Primera consulta","Examen, uno o varios planes de tratamiento, plazos y financiación explicados."],["Estudio","Fotos, radiografías e impresión digital para establecer el diagnóstico."],["Colocación","Se prueban las férulas transparentes o se pegan los brackets: comienza el tratamiento."],["Retirada y retención","Cuando la corrección es óptima, se retira el aparato y un retenedor, sin molestias, consolida el resultado."],["Seguimiento","Visitas al mes, a los 3 y a los 6 meses, y después una vez al año."]]},"la-chirurgie-orale-au-service-de-lorthodontie":{"s":"orthodontie","t":"La cirugía oral al servicio de la ortodoncia","lead":"A veces, un pequeño gesto quirúrgico hace posible el tratamiento, o lo acorta.","b":[["Cuándo","Liberar un diente incluido, colocar minitornillos de anclaje, movilizar un diente, extraer muelas del juicio o dientes supernumerarios, siempre de acuerdo con su dentista de referencia. Los dientes incluidos se localizan en 3D."],["Acelerar","Las corticotomías y la piezocisión flexibilizan el hueso alrededor de los dientes con anestesia local: para ir más rápido en el adulto, mover dientes anquilosados o caninos incluidos, tratar a pesar de una pérdida de hueso."]]},"les-malpositions-dentaires":{"s":"orthodontie","t":"Las malposiciones dentales","lead":"Demasiado o muy poco espacio, y los dientes se colocan como pueden.","b":[["Los riesgos","Molestia estética, masticación desequilibrada, problemas de la articulación de la mandíbula, desgaste y fracturas, dificultades de dicción, mordeduras en las encías, cepillado incompleto."],["Las causas","Dientes y maxilares de tamaños diferentes (hereditario), dientes definitivos tardíos, funciones alteradas: deglución infantil, respiración por la boca."],["Las soluciones","Dejar el dedo y el chupete a tiempo, reeducación (deglución, dicción, respiración nasal), extracción de dientes de leche que molestan, tratamiento adaptado a la edad."]]},"les-colorations-dentaires":{"s":"esthetique","t":"Manchas y desgaste dental","lead":"Tabaco, té, café, vino, ciertos colutorios o el hierro: el esmalte, algo poroso, se tiñe.","by":"Dr Clarisse Bonnet","b":[["Mis dientes están manchados","La higiene diaria, los detartrajes regulares y el pulido suelen bastar. Evite las pastas de dientes demasiado abrasivas. Para pequeños defectos del esmalte: la microabrasión."],["Sin amalgama","Una caries pequeña se repara con composite durante la sesión; una grande, con un inlay u onlay pegado, fabricado a partir de una impresión."],["Un diente desvitalizado que se oscurece","Si no está demasiado deteriorado, un blanqueamiento interno le devuelve su brillo."]],"cases":["c-col-a1|c-col-b1","c-col-a2|c-col-b2"]},"le-blanchiment-des-dents":{"s":"esthetique","t":"El blanqueamiento dental","lead":"Devolver brillo al color natural de los dientes, en casa, bajo el control de la clínica.","by":"Dr Clarisse Bonnet","b":[["Antes de nada","Una consulta para descartar caries, filtraciones o encías inflamadas, y después detartraje y pulido. Las manchas profundas del esmalte se resuelven mejor con carillas."],["Tres sesiones","Impresiones y foto de referencia; entrega de las férulas y del gel; revisión a los 15 días. El gel se lleva 2 horas al día al principio y después por la noche, por lo general 15 días (hasta 6 semanas). El color cambia desde el tercer día."],["Las férulas se conservan","Se pueden volver a usar, por ejemplo después de un detartraje, para dar un empujón al brillo."],["Diente desvitalizado","Un gel colocado dentro del diente, con la raíz protegida, le devuelve el color de los vecinos."]],"cases":["c-bl-a1|c-bl-b1","c-bl-a2|c-bl-b2","c-bl-a3|c-bl-b3"]},"les-restaurations-esthetiques-directes-et-indirectes":{"s":"esthetique","t":"Las restauraciones estéticas","lead":"Reparar el diente conservando el máximo de tejido sano, gracias al pegado.","by":"Dr Clarisse Bonnet","b":[["Directa","Para una caries, una fisura o una fractura limitada: un composite colocado con aislamiento, modelado y pulido, en una sola sesión."],["Indirecta","Para una pérdida mayor: un inlay u onlay de cerámica, hecho en el laboratorio a partir de una impresión y después pegado con aislamiento para un sellado hermético."]],"cases":["c-res-a1|c-res-b1","c-res-a2|c-res-b2","c-res-a3|c-res-b3","c-res-a4|c-res-b4"]},"les-facettes-ceramiques":{"s":"esthetique","t":"Planificación virtual y carillas","lead":"Ver su futura sonrisa antes de cualquier gesto irreversible.","by":"Dr Clarisse Bonnet","b":[["Simular","Tras un estudio fotográfico, una planificación virtual fija los objetivos con usted; una maqueta en la boca hace tangible el proyecto para todo el equipo (ortodoncista, implantólogo, protésico)."],["Las carillas","Láminas muy finas de cerámica pegadas en la cara visible de los dientes: color, pequeñas malposiciones, desgaste. Un resultado natural que conserva el diente."]],"cases":["c-fac-a1|c-fac-b1","c-fac-a2|c-fac-b2"]},"les-couronnes-sur-implants-par-avec-technique-dempreinte-numerique":{"s":"esthetique","t":"Coronas sobre implantes, impresión digital","lead":"Tras colocar el implante, una cámara sustituye la pasta de impresión para fabricar la corona de cerámica.","b":[["Más cómodo","Se acabó el material de impresión en la boca: más agradable y muy preciso."]],"cases":["c-couronne"]},"injection-dacide-hyaluronique":{"s":"esthetique","t":"Inyección de ácido hialurónico","lead":"La sonrisa también son los labios: los odontólogos pueden inyectar alrededor de la boca y en la parte baja del rostro.","b":[["Por qué","Con la edad, los labios pierden volumen y aparecen arrugas y pliegues. La inyección devuelve volumen o rellena las arrugas alrededor de los labios, dentro de un marco terapéutico."],["El producto","Una molécula presente de forma natural en la piel, conocida desde 1934. La que usa la clínica es de origen no animal, biocompatible y reabsorbible."],["Dónde","Surcos nasogenianos, pliegues de amargura, arrugas y líneas finas alrededor de la boca, contorno de los labios, óvalo del rostro."],["Resultado y duración","Visible de inmediato, óptimo a los 10 días, dura de 12 a 18 meses según el producto. En raras ocasiones, un pequeño edema o un enrojecimiento que desaparece pronto. Productos autorizados por la Afssaps."]]},"la-petite-souris":{"s":"pedodontie","t":"El ratoncito de la clínica","lead":"Vive detrás de una estantería de la clínica, con cortinas de lunares y una lámpara hecha con un tapón de pasta de dientes.","b":[["Su misión","Cuando se cae un diente de leche, ella lo recoge y deja una moneda brillante. Recibe montones de cartas y dibujos. Y aquí, no hay gato."],["El kit del «ratoncito»","Una caja con forma de ratón para guardar el diente bajo la almohada, una ficha para seguir tus dientes de leche y una notita firmada con su patita. ¡Pídeselo a tu dentista!"]],"imgs":["souris","pochons","souris2"]},"soins-pour-les-enfants":{"s":"pedodontie","t":"Cuidados para los niños","lead":"La Dra. Héloïse Panaras, odontopediatra, recibe a niños y adolescentes con dulzura.","by":"Dr Héloïse Panaras","b":[["Por qué un odontopediatra","Prevenir las caries, vigilar dientes y mandíbulas, acompañar los primeros dientes definitivos, hacer que los tratamientos resulten familiares."],["En la clínica","Seguimiento personalizado, prevención adaptada, manejo de la ansiedad, un lugar pensado para los más pequeños. Cada etapa se explica tanto al niño como a los padres."]],"imgs":["dr-panaras","salle-enf"]},"salle-attente-dediee-aux-mini-patients":{"s":"pedodontie","t":"La sala de espera de los minipacientes","lead":"Un espacio lleno de color solo para ellos: libros, dibujos para colorear, dibujos animados y la puerta del ratoncito.","b":[["La confianza empieza aquí","Todo está pensado para que la visita sea tranquila, desde la llegada hasta el sillón."]],"imgs":["mxl547","mxl535","mxl539","mxl533","cab4"]},"le-traitement-endodontique":{"s":"endodontie","t":"El tratamiento endodóntico","lead":"Tratar el interior del diente cuando la pulpa está inflamada o infectada, para evitar el dolor y los abscesos.","b":[["Mantener el diente vivo","Si la inflamación es limitada, se retira la caries bajo microscopio y la pulpa se «recubre» con un material que favorece su cicatrización."],["El tratamiento de conductos","Limpieza, conformación, desinfección y después obturación hermética de los conductos, con dique de goma. A continuación, su dentista reconstruye el diente."],["Un especialista","Microscopio, localizador de ápice, ultrasonidos, obturación en caliente, imagen 3D: un equipamiento técnico para los casos complejos. Fuente: Société Française d’Endodontie."]],"imgs":["c-endo1","c-endo2"]},"le-retraitement-endodontique":{"s":"endodontie","t":"El retratamiento endodóntico","lead":"Cuando un diente ya tratado se infecta o no cura, se vuelve a hacer el tratamiento de los conductos.","b":[["Por qué","Conducto no detectado, reconstrucción demasiado tardía, nueva caries, restauración con filtración."],["Las etapas","Retirar las restauraciones, quitar el material anterior, buscar otros conductos, limpiar, desinfectar, obturar y después reconstruir."]],"imgs":["c-retrait","c-etapes"]},"la-chirurgie-endodontique":{"s":"endodontie","t":"La cirugía endodóntica","lead":"Cuando el retratamiento fracasa o no es posible (instrumento fracturado, curvatura, conducto calcificado…).","b":[["El procedimiento","Bajo microscopio, se retira el tejido infectado cortando el extremo de la raíz y después se sella el conducto por la punta con un material biocompatible."]],"imgs":["c-chir-endo"]}},"tech":[{"t":"Cámara de impresión óptica","p":"Se acabó la pasta: sin náuseas ni mal sabor, y con una precisión que evita citas adicionales.","img":"t-rect54"},{"t":"Cirugía guiada y navegación","p":"El ordenador guía la fresa y el implante en 3D durante toda la intervención.","img":"t-rect5"},{"t":"AIRFLOW ONE","p":"Mantenimiento periodontal según la Guided Biofilm Therapy. El periodoncista exclusivo de la clínica se formó en Alemania y Suiza.","img":"fauteuil"},{"t":"Radiografía 3D cone beam","p":"Panorámica y escáner 3D en el propio centro: diagnóstico inmediato, menos radiación y un coste global menor del tratamiento con implantes.","img":"t-radio"},{"t":"Microscopio operatorio","p":"El endodoncista exclusivo trabaja con él. También sirve para localizar fisuras y fracturas de raíz y para las prótesis estéticas.","img":"t-8004122"},{"t":"Piezocirugía","p":"Ultrasonidos para corregir u obtener hueso con precisión micrométrica.","img":"t-piezo"}],"blocs":{"t":"Tres quirófanos","p":"Dedicados a la cirugía y la microcirugía, para operar en condiciones óptimas de ergonomía y asepsia."},"team":{"docs":[["dr-clarisse","Dr Clarisse Bonnet","Odontología restauradora estética"],["dr-marie","Dr Marie Bonnet","Ortodoncia"],["dr-franck","Dr Franck Bonnet","Implantología, rehabilitaciones complejas"],["dr-rathelot","Dr Benjamin Rathelot","Periodoncia"],["dr-panaras","Dr Héloïse Panaras","Odontopediatría"],["dr-guerson","Dr Yaël Guerson","Mantenimiento periodontal"],["dr-manders","Dr Rian Manders","Odontología general y mantenimiento periodontal"]],"staff":[["eq-helene","Hélène","Recepción y secretaría"],["eq-joy","Joy","Asistente dental cualificada"],["eq-dounia","Dounia","Asistente dental cualificada"],["eq-anna","Anna","Asistente dental cualificada"],["eq-vania","Vania","Asistente dental cualificada"],["eq-sabine","Sabine","Técnica de esterilización"],["eq-zorica","Zorica","Asistente de dirección"],["eq-elisa","Elisa","Responsable de comunicación"],["eq-morgane","Morgane","Community manager"]],"motto":"Hacerlo todo para que los pacientes reciban el trato que nos gustaría recibir a nosotros mismos."},"advice":{"la-prevention-votre-meilleur-allie-sante":{"t":"La prevención, su mejor aliada","img":"k-prev","p":["Algunos problemas empiezan en silencio: una visita al año permite verlos a tiempo.","En la cita, el dentista examina dientes, encías, tratamientos previos e higiene; si hace falta, se completa con radiografías.","En el día a día: cepillado al menos dos veces al día, después de las comidas, y menos azúcar, sobre todo entre horas."]},"douleurs-et-si-cetait-vos-gencives":{"t":"Dolor: ¿y si fueran sus encías?","img":"k-douleurs","p":["Encía roja e inflamada: es una gingivitis, provocada por la placa.","Sangrado al cepillarse, mal aliento, sensibilidad al calor o al frío, encía que se retrae: son señales de alerta.","Consulte para evitar que evolucione a periodontitis."]},"zoom-sur-les-causes-des-douleurs-gingivales":{"t":"Las causas del dolor de encías","img":"k-causes","p":["Cepillado insuficiente (prefiera un cepillo suave), gingivitis y después periodontitis.","Heridas, cambios hormonales (embarazo, pubertad, menopausia), rechinar de dientes.","Caries que avanza, brackets o prótesis que irritan, muelas del juicio que salen."]},"votre-suivi-orthodontique-avec-dental-monitoring":{"t":"Su seguimiento ortodóncico con Dental Monitoring","img":"k-dm","p":["La aplicación sigue su tratamiento incluso cuando no está en la clínica.","Recibe un correo electrónico, descarga la aplicación (Apple o Android) y la activamos juntos en la cita de estudio, con un primer escaneo.","Después, el equipo responde a sus preguntas mediante la mensajería de la aplicación."]},"les-dents-de-sagesse":{"t":"Las muelas del juicio","img":"k-sagesse","p":["Suelen salir entre los 17 y los 21 años; el 22 % de las personas no tiene ninguna.","Si no tienen espacio, es mejor extraerlas: molestan a los demás dientes y favorecen las caries.","Tras la extracción: gasa si sangra, hielo si se hincha, alimentos blandos y templados, sin tabaco ni alcohol."]},"eviter-les-maladies-parodontales":{"t":"Evitar las enfermedades de las encías","img":"k-gingivite","p":["La placa se calcifica en sarro en 72 horas y mantiene la inflamación.","Una encía sana es rosada y firme; roja, lisa y con sangrado: hay que consultar.","Cepillo suave dos veces al día, hilo e interdentales, detartraje anual. Una recesión se trata adaptando el cepillado y, a veces, con un injerto."]},"quest-ce-que-lorthodontie-fonctionnelle":{"t":"La ortodoncia funcional","img":"k-ortho","p":["Actuar durante el crecimiento sobre la respiración, la masticación, la deglución y la postura.","Respirar por la boca, chuparse el dedo hasta tarde o mantener una deglución de bebé deforman los maxilares.","Osteópatas, otorrinolaringólogos, logopedas o fisioterapeutas pueden completar el tratamiento."]},"les-bons-reflexes-pour-se-brosser-les-dents-avec-un-appareil-dentaire":{"t":"Cepillarse los dientes con aparato","img":"k-brossage","p":["Dos cepillados al día como mínimo, idealmente tres, y sin picar entre horas.","Dos minutos, pasando por debajo del alambre e insistiendo en el borde de la encía; una encía que sangra necesita más cepillado, no menos.","Un cepillo pequeño y suave o eléctrico, y un cepillo interdental para terminar."]},"tracas-appareil-dentaire":{"t":"Las pequeñas molestias del aparato","img":"k-tracas","p":["Dientes que «tiran» al principio y después de cada ajuste: pasa en 24 a 48 h. Alimentos blandos o fríos, analgésicos si hace falta.","Mejillas o labios irritados: la cera de ortodoncia los protege.","Un alambre que sobresale: vuelva a colocarlo con unas pinzas y escríbanos a contact@drs-bonnet-associes.fr."]},"piercings-buccaux-et-consequences-sur-votre-sante-dentaire":{"t":"Piercings en la boca y salud dental","img":"k-piercing","p":["Un estudio presentado en EuroPerio (Prof. Clemens Walter, Universidad de Greifswald) relaciona los piercings en labios y lengua con recesiones y bolsas más profundas.","Cuanto más tiempo se lleva el piercing, mayor es el riesgo.","Hable de ello con su dentista durante sus visitas."]},"mieux-respirer-un-des-principaux-bienfaits-de-lorthodontie":{"t":"Respirar mejor gracias a la ortodoncia","img":"k-respirer","p":["Boca abierta, labios secos, nariz congestionada, ojeras: puede que un niño respire mal.","Respirar por la nariz filtra y calienta el aire, ayuda al sueño y da forma al rostro.","Un tratamiento precoz, junto con el otorrinolaringólogo y el pediatra, puede restablecer una buena ventilación. Aprender a sonarse y a lavarse la nariz también ayuda."]},"limpact-du-grignotage-sur-la-sante-bucco-dentaire":{"t":"Picar entre horas y sus dientes","img":"k-grignotage","p":["Cada ingesta multiplica los ataques ácidos sobre el esmalte.","Cuatro momentos al día: desayuno, comida, merienda y cena. El agua es la única bebida amiga de los dientes.","Hilo o cepillos interdentales antes del cepillado, 2 minutos, una cantidad de pasta del tamaño de un guisante, cepillo cambiado cada 3 meses y nunca compartido. Fuente: UFSBD."]},"quest-ce-que-le-bruxisme-grincement-serrement-des-dents":{"t":"El bruxismo (rechinar o apretar los dientes)","img":"k-bruxisme","p":["Sobre todo por la noche (80 % de los casos), afecta al 10-15 % de los franceses: desgaste, dolor en las mejillas y en las sienes al despertar.","Se tratan las consecuencias: férula nocturna, control del estrés, restauraciones si hace falta.","En caso de dolores intensos, toxina botulínica; a veces, ortodoncia. Fuente: UFSBD."]}},"reviews":[["Céline Leclercq","18/02/2026","Un grand merci au Dr Marie Bonnet et Joy qui m’ont refait mon sourire et je peux vous dire que je partais de très loin, grâce à elles je peux sourire sans honte. Elles ont été très professionnelles, je recommande sans hésiter."],["Laetitia Wneczak ép. Saladino","20/05/2026","Entièrement satisfaite de la prise en charge en orthodontie pour ma fille de 9 ans. Dr Marie Bonnet et son assistante Joy sont très compétentes et super gentilles ! De plus, le nouveau cabinet est absolument splendide !!"],["thierry vidal rossines","30/01/2026","Accueil parfait, prise en charge de mes problèmes adaptée, mise en place des implants sans aucune douleur… L’ensemble des professionnels sont à l’écoute. À recommander obligatoirement."],["Léonie Taton","04/12/2025","Je suis ravie d’avoir été soignée par le Dr Clarisse Bonnet. Elle est à la fois très professionnelle, douce et à l’écoute. Elle prend le temps d’expliquer chaque étape, ce qui met vraiment en confiance. Les soins ont été réalisés avec beaucoup de sérieux et sans douleur."],["Mathieu FERRAND","01/12/2025","Superbe travail de reconstruction en composite sur incisives fracturées. Excellente praticienne, douce, minutieuse et passionnée. J’éprouve une totale satisfaction sur le plan esthétique comme fonctionnel !"],["Véronique DUBROCARD IMBARD","04/03/2025","Suivie par le Docteur Franck Bonnet depuis plusieurs années, je recommande ce praticien très professionnel et à l’écoute. Travail soigné et le Dr Bonnet est très rassurant et patient avec les phobiques stressées comme moi."],["jc brun","04/02/2025","Un grand merci à Clarisse et Marie pour les bons soins prodigués. Travail de haute qualité et précision pour un beau sourire retrouvé ! Merci à l’équipe !"],["Brooke Gynt","21/07/2024","Le Dr Clarisse Bonnet m’a tout de suite mise à l’aise et a fait un très bon travail en soignant mes caries. Le personnel est accueillant et professionnel, et l’ambiance du cabinet est très agréable."],["Baptiste PHILIBERT","18/04/2024","Super travail, très minutieux et très professionnel, super équipe et tout le monde très sympa ! Au top !"],["Christine HUSS","","Elle m’a donné, avec quelques modifications et sans me limer les dents, un éclat à mon sourire. En plus elle est très douce. Son papa m’a déjà fait un implant et ma paro a été traitée dans le même cabinet. Pour moi « the best » de la région."]],"contact":{"title":"Cómo llegar a la clínica","address":"2 rond-point Duboys d’Angers, 06400 Cannes","parking":"Aparcamiento: parking Palais Stéphanie a 90 m; parking Lamy a 150 m (2 horas gratis, una vez por semana).","hours":[["08h30","18h00"],["08h30","18h00"],["09h00","19h00"],["08h30","18h00"],["08h30","18h00"],null],"phone_label":"Para pedir cita y para cualquier consulta","form_title":"Solicitud de cita","form_lead":"Déjenos sus datos: la secretaría le llamará para fijar la hora. Su solicitud se envía por correo electrónico a la clínica.","f_name":"Nombre y apellidos","f_phone":"Teléfono","f_email":"Correo electrónico","f_spec":"Especialidad que le interesa","f_spec_any":"Todavía no lo sé","f_who":"¿Para quién?","f_who_me":"Para mí","f_who_child":"Para mi hijo o hija","f_msg":"Su mensaje (motivo, disponibilidad)","f_new":"Soy un paciente nuevo","f_ok":"Se abre su correo con la solicitud lista para enviar. Si no se abre nada, escriba a contact@drs-bonnet-associes.fr o llame al 04 93 99 72 81.","f_err":"Indique su nombre y un teléfono o un correo electrónico, por favor.","f_privacy":"Sus datos se utilizan únicamente para volver a contactarle. Derecho de acceso y de supresión: cnil@drs-bonnet-associes.fr","doctolib_note":"La Dra. Marie Bonnet (ortodoncia) también gestiona sus citas en Doctolib.","urgent":"Si tiene dolor, llame directamente a la clínica.","f_bad":"Este campo parece incompleto: revíselo."},"clinic":{"title":"La clínica","lead":"Un centro totalmente medicalizado que trata cada día rehabilitaciones complejas, con un equipo multidisciplinar.","caps":["La recepción","El pasillo de las consultas","La sala de espera","El rincón de los niños","Una consulta de tratamiento","El sillón","Una sala de tratamiento","El Dr. Franck Bonnet en consulta","La Dra. Clarisse Bonnet con una paciente","La Dra. Marie Bonnet en el sillón","El Dr. Benjamin Rathelot en el sillón","La fachada","Un sillón de tratamiento"]},"kids":{"title":"Los niños tienen su dentista, su sala y su ratoncito","lead":"La Dra. Héloïse Panaras, odontopediatra, una sala de espera llena de color y el ratoncito que vive en la clínica."},"insta":[["cabinet.dentaire.cannes","Le cabinet"],["drfranckbonnet","Dr Franck Bonnet"],["drbonnet.ortho","Orthodontie"],["drbonnet.esthetics","Esthétique"]],"legal":{"title":"Aviso legal","p":[["Titularidad del sitio","El sitio drs-bonnet-associes.fr es propiedad del Dr Franck Bonnet, cirujano dentista, RPPS 10003600615."],["Domicilio social","Cabinet dentaire des Drs Bonnet & Associés, 2 rond-point Duboys d’Angers, 06400 Cannes. Tel. 04 93 99 72 81. APE: práctica dental."],["Desarrollo","Sitio actual desarrollado y mantenido por Mediweb, 32 boulevard du Président Poincaré, 67000 Estrasburgo."],["Alojamiento","OVH SAS, 2 rue Kellermann, 59100 Roubaix."],["Director de la publicación","Dr Franck Bonnet."],["Propiedad intelectual","Los textos, imágenes, logotipos y archivos pertenecen al Dr Franck Bonnet; queda prohibida toda reproducción sin autorización."],["Enlaces","Ordre national des chirurgiens-dentistes: www.ordre-chirurgiens-dentistes.fr"],["Datos personales (RGPD)","Derecho de acceso, rectificación, supresión y oposición: cnil@drs-bonnet-associes.fr"],["Cookies","Esta maqueta solo utiliza una medición de audiencia anónima. El futuro sitio le pedirá su consentimiento antes de instalar cualquier cookie no esencial."]],"study":"La clínica también organiza veladas Study Group en Cannes."},"bot":{"name":"Bonnet Conseil","sub":"Asistente virtual de la clínica","help":"Le ayudo a elegir","hello":"Hola, soy Bonnet Conseil, el asistente virtual de la clínica. Le oriento hacia el especialista adecuado y respondo a las preguntas prácticas. No sustituyo una opinión médica.","invite":"¿Una pregunta? Le oriento hacia el especialista adecuado.","ph":"Escriba su pregunta…","chips":["Me falta un diente","Me sangran las encías","Enderezar mis dientes","Dientes más blancos","Para mi hijo o hija","Horarios y cómo llegar"],"a_implant":"Para uno o varios dientes ausentes, lo suyo es la implantología del Dr Franck Bonnet. La clínica suele colocar los implantes y los dientes provisionales fijos en la misma sesión, tras un estudio en 3D.","a_paro":"Unas encías que sangran suelen ser una gingivitis, a veces el comienzo de una periodontitis. Es la especialidad del Dr Benjamin Rathelot (periodoncia). Conviene consultar sin esperar.","a_ortho":"Para alinear los dientes, de niño o de adulto, lo suyo es la ortodoncia de la Dra. Marie Bonnet: brackets metálicos o de cerámica (Damon) o alineadores transparentes Invisalign. También gestiona sus citas en Doctolib.","a_esth":"Manchas, diente roto, blanqueamiento o carillas: es la odontología estética de la Dra. Clarisse Bonnet, con una simulación de su futura sonrisa antes de cualquier intervención.","a_kids":"Para los niños, la Dra. Héloïse Panaras es odontopediatra. Hay una sala de espera solo para ellos, ¡y el ratoncito vive en la clínica!","a_endo":"Un diente con mucho dolor, o ya desvitalizado que duele, suele ser cuestión de endodoncia, realizada con microscopio por el endodoncista de la clínica. Si tiene dolor, llame al 04 93 99 72 81.","a_pain":"Si tiene dolor, lo más rápido es llamar a la clínica al 04 93 99 72 81. No puedo hacer un diagnóstico, pero el equipo le orientará.","a_hours":"La clínica abre lunes, martes, jueves y viernes de 8:30 a 18:00 h, el miércoles de 9:00 a 19:00 h, y cierra el sábado. Dirección: 2 rond-point Duboys d’Angers, Cannes.","a_parking":"Dos aparcamientos muy cerca: Palais Stéphanie, a 90 m, y Lamy, a 150 m (2 horas gratis, una vez por semana).","a_rdv":"Llame al 04 93 99 72 81 o rellene la solicitud de cita: la secretaría le llamará. Para la ortodoncia, también puede usar Doctolib.","a_price":"Las tarifas no se publican en internet: dependen de su valoración. Se le explican en la primera consulta, junto con el plan de tratamiento. La recepción también le atiende en el 04 93 99 72 81.","a_fear":"Es muy frecuente, y puede decirlo al pedir la cita. Varios pacientes escriben en sus opiniones que el equipo les tranquilizó. Para los niños, la Dra. Héloïse Panaras, odontopediatra, se ocupa de la ansiedad.","a_hya":"La clínica realiza inyecciones de ácido hialurónico alrededor de la boca (labios, surcos): resultado visible de inmediato y una duración de 12 a 18 meses.","a_lang":"El equipo habla francés; si necesita otro idioma, indíquelo al pedir cita y la clínica le dirá qué es posible.","a_unknown":"Respondo a preguntas sobre la clínica, sus tratamientos, horarios y acceso, y no tengo esa información. Lo mejor es llamar al 04 93 99 72 81 o escribir a contact@drs-bonnet-associes.fr.","go_care":"Ver la página","go_rdv":"Solicitar una cita","a_urgent":"Una corona que se ha caído, un implante que se mueve, un diente roto o una inflamación: llame a la clínica al 04 93 99 72 81 para que le vean pronto. No puedo hacer un diagnóstico. Con fiebre o mucha inflamación fuera del horario, llame al 15.","a_health":"Embarazo, medicación o un problema de salud: indíquelo al pedir la cita y el dentista adaptará los cuidados. Para una pregunta concreta, lo mejor es llamar al 04 93 99 72 81.","a_hello":"¡Hola! Cuénteme qué le trae (un diente que falta, las encías, ortodoncia, un niño…) y le oriento hacia el especialista adecuado.","a_pay":"Para las formas de pago y la cobertura, la recepción le responde en el 04 93 99 72 81: no tengo esa información.","a_wisdom":"Las muelas del juicio suelen salir entre los 17 y los 21 años; si no hay sitio, a menudo es mejor extraerlas. La clínica tiene una ficha completa, y la extracción se hace con anestesia local.","a_brux":"Rechinar o apretar los dientes (bruxismo) desgasta los dientes y cansa la mandíbula. Se trata sobre todo con una férula nocturna; aquí tiene la ficha de la clínica."}},"de":{"ui":{"skip":"Zum Inhalt springen","lang":"Sprache","nav_accueil":"Start","nav_soins":"Behandlungen","nav_clinique":"Die Praxis","nav_equipe":"Das Team","nav_techno":"Technologien","nav_enfants":"Kinder","nav_conseils":"Ratgeber","nav_avis":"Bewertungen","nav_contact":"Kontakt","nav_conseil":"Bonnet Conseil","rdv":"Termin vereinbaren","call":"Praxis anrufen","close":"Schließen","back":"Zurück","read_more":"Weiterlesen","see_care":"Zur Behandlung","by":"Durchgeführt von","before":"Vorher","after":"Nachher","real_case":"Echter Fall aus der Praxis","cases_note":"Fotos von Patienten der Praxis, veröffentlicht auf der aktuellen Website. Jeder Mund ist anders: Ein Ergebnis wird nicht versprochen, es wird gemeinsam vorbereitet.","next":"Weiter","prev":"Zurück","send":"Senden","open_map":"Plan öffnen","footer_rights":"Drs Bonnet & Associés · Spezialisierte Zahnarztpraxis · Cannes","mentions":"Impressum","proposal":"Vorschlag zur Neugestaltung von Neovera Studio, unverbindlicher Entwurf.","follow":"Der Praxis folgen","specialty":"Fachgebiet","all_care":"Alle Behandlungen dieses Fachgebiets","related":"Als Nächstes lesen","video":"Video","videos_title":"Videos zur funktionellen Erziehung","watch":"Auf YouTube ansehen","reviews_note":"Bewertungen von der aktuellen Website, unverändert zitiert (auf Französisch).","illus":"Illustrationsbild","doctolib":"Online buchen (Doctolib)","hours_closed":"Geschlossen","menu_aria":"Hauptmenü","all_n":"Alle Behandlungen"},"days":["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"],"home":{"title":"Ihr Lächeln, genau untersucht.","lead":"Sieben Fachzahnärzte, drei Operationsräume und Behandlungen unter Lupenbrille oder Mikroskop, im Herzen von Cannes.","spec_line":"Implantologie · Ästhetik · Kieferorthopädie · Parodontologie · Endodontie · Kinderzahnheilkunde","cta2":"Behandlungen ansehen","hero_note":"2 rond-point Duboys d’Angers, Cannes · Montag bis Freitag","loupe_title":"Unter der Lupe","loupe_lead":"Bei uns wird jede Behandlung vergrößert ausgeführt: Lupenbrille, Operationsmikroskop, Abdruckkamera. Fahren Sie mit der Lupe über das Foto, um das fertige Ergebnis zu sehen.","loupe_hint":"Lupe über das Foto schieben","loupe_hint_touch":"Tippen und ziehen, um die Lupe zu bewegen","loupe_cases":[{"k":"col","t":"Flecken auf zwei Schneidezähnen","by":"Dr Clarisse Bonnet","care":"les-colorations-dentaires"},{"k":"res4","t":"Amalgamfüllungen durch Keramik ersetzt","by":"Dr Clarisse Bonnet","care":"les-restaurations-esthetiques-directes-et-indirectes"},{"k":"res","t":"Komposit an einem abgebrochenen Zahn","by":"Dr Clarisse Bonnet","care":"les-restaurations-esthetiques-directes-et-indirectes"},{"k":"bl","t":"Zahnaufhellung","by":"Dr Clarisse Bonnet","care":"le-blanchiment-des-dents"}],"spec_title":"Für jedes Fachgebiet ein Spezialist","spec_lead":"Jeder Behandler hat eine Fachzahnarzt-Weiterbildung in seinem Gebiet abgeschlossen. Ihre Akte geht von Spezialist zu Spezialist, ohne dass Sie die Adresse wechseln.","clinic_title":"Helles Holz, seladongrüne Wände und drei OP-Säle","clinic_lead":"Eine voll ausgestattete medizinische Einrichtung, komplett erneuert: helles Holz, seladongrüne Wände, ein Wartezimmer nur für Kinder. Und dahinter drei Operationsräume für Chirurgie und Mikrochirurgie.","clinic_cta":"Die Praxis besichtigen","team_title":"Das Team, das Sie behandelt","team_lead":"Spezialisten, die gemeinsam an Ihrem Behandlungsplan arbeiten, unterstützt von qualifizierten Assistentinnen.","team_cta":"Das Team kennenlernen","process_title":"So läuft Ihre Behandlung ab","process":[{"t":"Das erste Gespräch","p":"Klinische Untersuchung, Fotos und Röntgenbilder in 2D und 3D für eine gründliche Diagnose."},{"t":"Der Behandlungsplan","p":"Im Team erarbeitet, ganz im Dienst des Patienten. Sie entscheiden bei jedem Schritt mit."},{"t":"Der richtige Spezialist","p":"Jeder Eingriff wird von dem oder den zuständigen Spezialisten durchgeführt, bei Bedarf in Absprache mit Ihrem Hauszahnarzt."},{"t":"Die Nachsorge","p":"Sofort und langfristig, durch dieselben Spezialisten."}],"process_note":"Wir versuchen immer, die Zahl der Sitzungen so gering wie möglich zu halten.","lab_title":"Zahnersatz aus Frankreich","lab_p":"Unser gesamter Zahnersatz wird in Frankreich gefertigt, von Zahntechnikern mit Schwerpunkt Ästhetik und Implantatprothetik, darunter M. Jean-Pierre Casu, Meilleur Ouvrier de France.","quote":"Ein Lächeln dauert nur einen Augenblick, doch die Erinnerung daran währt manchmal ewig.","quote_by":"Raoul Follereau, Le livre d’amour, « Le sourire » (1920)","reviews_title":"Was Patienten sagen","advice_title":"Die Ratschläge der Praxis","advice_lead":"Dreizehn Merkblätter, um eine Behandlung zu verstehen, vorzubeugen und gut durchzustehen.","insta_title":"Die Praxis auf Instagram","insta_lead":"Blick hinter die Kulissen, Behandlungsfälle und kleine Teammomente, auf vier Konten.","tech_line":"Sechs Geräte im Dienst der Präzision","insta_note":"Die Beiträge erscheinen hier live, sobald die Website installiert ist."},"specs":{"implantologie":{"t":"Implantologie","p":"Einen, mehrere oder alle Zähne durch Titanwurzeln ersetzen, mit festen provisorischen Zähnen, die manchmal noch am selben Tag eingesetzt werden.","doc":"Dr Franck Bonnet"},"parodontologie":{"t":"Parodontologie","p":"Zahnfleisch und Knochen behandeln, die Ihre Zähne halten: Fast jeder zweite Franzose hat Parodontitis, oft ohne Schmerzen.","doc":"Dr Benjamin Rathelot"},"orthodontie":{"t":"Kieferorthopädie","p":"Zähne ausrichten und das Wachstum lenken, vom Kind bis zum Erwachsenen: Metall- oder Keramikbrackets oder transparente Aligner.","doc":"Dr Marie Bonnet"},"esthetique":{"t":"Ästhetik","p":"Flecken, abgebrochene Zähne, Farbe, Veneers: eine Zahnmedizin, die den Zahn schont und Natürlichkeit sucht.","doc":"Dr Clarisse Bonnet"},"pedodontie":{"t":"Kinderzahnheilkunde","p":"Sanfte Behandlungen für Kinder, ein Wartezimmer in ihrer Größe und eine kleine Maus, die in der Praxis wohnt.","doc":"Dr Héloïse Panaras"},"endodontie":{"t":"Endodontie","p":"Das Zahninnere unter dem Mikroskop behandeln, um den Zahn zu erhalten, auch wenn eine erste Behandlung gescheitert ist.","doc":"Exklusiver Endodontist der Praxis"}},"care":{"pose-dimplants-dentaires":{"s":"implantologie","t":"Zahnimplantate einsetzen","lead":"Der Eingriff wirkt beeindruckend, ist aber recht schnell erledigt, und die Heilung verläuft in den allermeisten Fällen sehr gut.","b":[["Wo und wie","Das Einsetzen erfordert strenge Keimfreiheit: Es erfolgt in der Praxis oder im Operationsraum. Unter örtlicher Betäubung wird das Zahnfleisch geöffnet, um den Knochen freizulegen."],["In zwei Schritten schließen","Das Implantat wird vollständig vom Zahnfleisch bedeckt und durch eine flache Titanschraube geschützt. Nach 4 bis 6 Monaten und einer Kontrollaufnahme wird der Kopf freigelegt, eine Einheilkappe aufgesetzt und dann der Aufbau, der die Krone trägt, zementiert oder verschraubt. Diese Wahl hängt vom Knochen, von einem vorherigen Knochenaufbau oder vom Rauchen ab."],["Oder in einem Schritt","Der Implantatkopf bleibt mit einer Einheilkappe sichtbar: keine zweite Operation, aber ein weniger geschütztes Implantat. Das ist den günstigsten Fällen vorbehalten. In beiden Fällen verbindet sich der Knochen in 4 bis 6 Monaten mit dem Implantat."],["Unsere Empfehlungen","Befolgen Sie die Verordnungen genau und pflegen Sie Ihre Mundhygiene sorgfältig. In seltenen Fällen wird das Implantat abgestoßen: Dann wird ein neues eingesetzt."]],"cases":["c-impl-avant|c-impl-apres","c-impl-9","c-impl-8","c-impl-5","c-impl-4","c-impl-10","c-impl-11","c-impl-bonnet","c-impl-2"]},"implant-dentaire":{"s":"implantologie","t":"Zahnimplantat","lead":"Eine „dritte Zahnreihe“: eine künstliche Wurzel im Knochen, dort, wo der Zahn verloren ging.","b":[["Was es ist","Ein medizinisch reiner Zylinder, vom Knochen aufgenommen, der eine Krone, eine Brücke oder einen ganzen Zahnbogen trägt oder einen herausnehmbaren Zahnersatz stabilisiert. Sie haben wieder feste, natürlich wirkende Zähne."],["Unser Alltag","Die Praxis ist auf komplexe Rehabilitationen ausgerichtet. In derselben Operation setzen wir die Implantate und die festen Provisorien ein: Der Patient hat sein Lächeln und die Kaufunktion nach wenigen Stunden zurück."],["In 3D geplant","Eine 3D-Rekonstruktion des Kiefers aus dem CT-Scan erlaubt es, den Eingriff zu simulieren. Chirurgische Schablonen übertragen diesen Plan präzise in den Mund."],["Der Zahnersatz","Wir verwenden Zirkonoxid ohne Metall für ein natürliches Aussehen und arbeiten mit M. Jean-Pierre Casu, Zahntechniker und Meilleur Ouvrier de France."]]},"la-maladie-parodontale":{"s":"parodontologie","t":"Parodontitis","lead":"Die Parodontitis („Zahnbettschwund“) zerstört nach und nach den Halt des Zahns, oft ohne Schmerzen. Wenn man sie bemerkt, ist es manchmal schon spät.","b":[["Warum","Eine doppelte Ursache, bakteriell und immunologisch: Die Bakterien greifen an, der Körper wehrt sich mehr oder weniger gut. Eine genaue und frühe Diagnose ist unerlässlich."],["Die Behandlung","Zuerst eine Reinigung ohne Operation, dann eine Kontrolle nach 6 bis 8 Wochen. Bleiben Taschen bestehen, folgt ein chirurgischer Eingriff im Operationsraum, manchmal mit Biomaterialien zur Regeneration. Danach die Erhaltungstherapie, ein Leben lang."],["Warnzeichen","Zahnfleisch, das beim Zähneputzen blutet, rot oder geschwollen ist; anhaltender Mundgeruch; Eiter und schlechter Geschmack; Zähne, die wackeln, auseinanderrücken oder freiliegen; ein veränderter Biss."],["Was die Erkrankung verschlimmert","Plaque und Zahnstein, Rauchen, Schwangerschaft und Pubertät, Stress, bestimmte Medikamente, Zähneknirschen, Mangelernährung, Allgemeinerkrankungen, die das Immunsystem betreffen."],["Unsere Nachsorge","Behandlung unter Lupenbrille, Röntgenbefunde und „Chartings“; die Befunde werden jeden Monat von allen Behandlern gemeinsam ausgewertet."]]},"le-suivi-parodontal":{"s":"parodontologie","t":"Die parodontale Erhaltungstherapie","lead":"Genauso wichtig wie die Behandlung: Ohne Nachsorge infizieren sich die Taschen erneut, und der Knochen geht weiter verloren.","b":[["Durch einen Spezialisten","Axelsson und Lindhe haben es gezeigt (1981, 2004): Wird die Erhaltungstherapie von einem Spezialisten durchgeführt, begrenzt sie Rückfälle, Karies und Attachmentverlust."],["Das GBT-Protokoll","In der Praxis arbeiten wir nach der Guided Biofilm Therapy mit dem AIRFLOW ONE, um Plaque und Zahnstein vollständig zu entfernen."],["Eine typische Sitzung","Aktualisierte Röntgenbilder und Gesundheitsfragebogen, Untersuchung des Zahnfleischs, persönliche Tipps, dann Zahnsteinentfernung, Wurzelglättung, Politur und Spülung."],["Der Rhythmus","Er hängt von Ihrem Risiko und Ihrer Mundhygiene ab. Jeder Rückfall wird sofort behandelt. Gesundes Zahnfleisch hängt mit der Herzgesundheit, mit Diabetes, Frühgeburten und Rheuma zusammen."]]},"la-chirurgie-mucco-gingivale-ou-chirurgie-plastique-parodontale":{"s":"parodontologie","t":"Zahnfleischtransplantation","lead":"Eine freiliegende Wurzel abdecken, zu dünnes Zahnfleisch verstärken oder seinen Verlauf harmonisieren.","by":"Dr Benjamin Rathelot","b":[["Warum eine Wurzel abdecken","Ohne Zahnschmelz nutzt sich die Wurzel ab, kann kariös werden und reagiert empfindlich auf Kälte. Die Abdeckung ist unter bestimmten Bedingungen möglich, die bei der Untersuchung geprüft werden."],["Weniger schmerzhaft als früher","Mikrochirurgie, spezielle Entnahmetechniken, Schutzschienen: Das Empfinden hat sich verändert. Bei Rauchern sind die Erfolgsaussichten gering: Während der Heilung ist der Rauchstopp unerlässlich."]],"cases":["c-paro-av1|c-paro-ap1","c-paro-av2|c-paro-ap2","c-paro-av3|c-paro-ap3"]},"les-parodontites-dechaussement-des-dents":{"s":"parodontologie","t":"Parodontitis (Zahnbettschwund)","lead":"Fast jeder zweite Franzose ist betroffen. Der Attachmentverlust geschieht lautlos: Besser, man erkennt ihn früh.","b":[["Plaque und Zahnstein","Plaque entsteht aus Speichel, Bakterien und Speiseresten. Wird sie schlecht entfernt, verhärtet sie zu Zahnstein, schneller bei Menschen mit viel Speichel."],["Die Behandlung","Reinigung, Kontrolle nach 6 bis 8 Wochen, Operation bei bleibenden Taschen, dann lebenslange Erhaltungs
