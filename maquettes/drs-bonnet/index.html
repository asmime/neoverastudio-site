."},"bot":{"name":"Bonnet Conseil","sub":"Assistente virtuale dello studio","help":"La aiuto a scegliere","hello":"Buongiorno, sono Bonnet Conseil, l’assistente virtuale dello studio. La indirizzo allo specialista giusto e rispondo alle domande pratiche. Non sostituisco un parere medico.","invite":"Una domanda? La indirizzo allo specialista giusto.","ph":"Scriva la sua domanda…","chips":["Mi manca un dente","Le gengive sanguinano","Raddrizzare i denti","Denti più bianchi","Per mio figlio","Orari e come arrivare"],"a_implant":"Per uno o più denti mancanti, serve l’implantologia del Dr Franck Bonnet. Lo studio inserisce spesso impianti e denti provvisori fissi nella stessa seduta, dopo una valutazione in 3D.","a_paro":"Gengive che sanguinano sono spesso una gengivite, a volte l’inizio di una parodontite. È la specialità del Dr Benjamin Rathelot (parodontologia). Meglio consultarlo senza aspettare.","a_ortho":"Per allineare i denti, di bambini e adulti, c’è l’ortodonzia della Dr Marie Bonnet: attacchi in metallo o in ceramica (Damon) oppure allineatori trasparenti Invisalign. Riceve gli appuntamenti anche su Doctolib.","a_esth":"Macchie, dente scheggiato, sbiancamento o faccette: è l’odontoiatria estetica della Dr Clarisse Bonnet, con una simulazione del suo futuro sorriso prima di qualsiasi intervento.","a_kids":"Per i bambini, la Dr Héloïse Panaras è odontoiatra pediatrica. C’è una sala d’attesa riservata a loro, e il topolino abita nello studio!","a_endo":"Un dente molto dolorante o già devitalizzato che fa male riguarda spesso l’endodonzia, eseguita al microscopio dall’endodontista dello studio. In caso di dolore, chiami lo 04 93 99 72 81.","a_pain":"Se ha dolore, la cosa più rapida è chiamare lo studio allo 04 93 99 72 81. Non posso fare diagnosi, ma il team saprà indirizzarla.","a_hours":"Lo studio è aperto lunedì, martedì, giovedì e venerdì dalle 8.30 alle 18, il mercoledì dalle 9 alle 19, chiuso il sabato. Indirizzo: 2 rond-point Duboys d’Angers, Cannes.","a_parking":"Due parcheggi molto vicini: Palais Stéphanie a 90 m e Lamy a 150 m (2 ore gratuite, una volta a settimana).","a_rdv":"Chiami lo 04 93 99 72 81 oppure compili la richiesta di appuntamento: la segreteria la richiama. Per l’ortodonzia è possibile anche Doctolib.","a_price":"Le tariffe non sono pubblicate online: dipendono dalla vostra valutazione. Vi vengono spiegate alla prima visita, insieme al piano di trattamento. La segreteria risponde anche allo 04 93 99 72 81.","a_fear":"È molto frequente, e potete dirlo già al momento della prenotazione. Diversi pazienti scrivono nelle recensioni che il team li ha messi a loro agio. Per i bambini, la Dott.ssa Héloïse Panaras, odontoiatra pediatrica, si occupa dell’ansia.","a_hya":"Lo studio pratica iniezioni di acido ialuronico attorno alla bocca (labbra, solchi): risultato visibile subito, durata da 12 a 18 mesi.","a_lang":"Il team parla francese; per un’altra lingua, lo precisi al momento della prenotazione e lo studio le dirà cosa è possibile.","a_unknown":"Rispondo a domande sullo studio, le cure, gli orari e l’accesso, e non ho questa informazione. Meglio chiamare lo 04 93 99 72 81 o scrivere a contact@drs-bonnet-associes.fr.","go_care":"Vai alla pagina","go_rdv":"Richiedi un appuntamento","a_urgent":"Una corona caduta, un impianto che si muove, un dente rotto o un gonfiore: chiamate lo studio allo 04 93 99 72 81 per essere visti in fretta. Non posso fare diagnosi. Con febbre o gonfiore importante fuori orario, chiamate il 15.","a_health":"Gravidanza, terapia in corso o un problema di salute: segnalatelo allo studio al momento della prenotazione e le cure saranno adattate. Per una domanda precisa, meglio chiamare lo 04 93 99 72 81.","a_hello":"Buongiorno! Ditemi cosa vi porta qui (un dente mancante, le gengive, l’apparecchio, un bambino…) e vi indirizzo allo specialista giusto.","a_pay":"Per le modalità di pagamento e i rimborsi, la segreteria risponde allo 04 93 99 72 81: non ho questa informazione.","a_wisdom":"I denti del giudizio spuntano di solito tra i 17 e i 21 anni; se manca spazio, spesso è meglio toglierli. Lo studio ha una scheda completa, e l’estrazione si fa in anestesia locale.","a_brux":"Digrignare o serrare i denti (bruxismo) consuma i denti e affatica la mandibola. Si tratta soprattutto con un bite notturno; ecco la scheda dello studio."}},"ru":{"ui":{"skip":"Перейти к содержимому","lang":"Язык","nav_accueil":"Главная","nav_soins":"Лечение","nav_clinique":"Клиника","nav_equipe":"Команда","nav_techno":"Технологии","nav_enfants":"Детям","nav_conseils":"Советы","nav_avis":"Отзывы","nav_contact":"Контакты","nav_conseil":"Bonnet Conseil","rdv":"Записаться на приём","call":"Позвонить в клинику","close":"Закрыть","back":"Назад","read_more":"Читать далее","see_care":"Об этом лечении","by":"Выполнил(а)","before":"До","after":"После","real_case":"Реальный случай из клиники","cases_note":"Фотографии пациентов клиники, опубликованные на действующем сайте. У каждого своя улыбка: результат не обещают, его готовят вместе.","next":"Далее","prev":"Назад","send":"Отправить","open_map":"Открыть карту","footer_rights":"Drs Bonnet & Associés · Специализированная стоматологическая клиника · Канны","mentions":"Правовая информация","proposal":"Проект редизайна подготовлен Neovera Studio. Макет не является договорным предложением.","follow":"Следить за клиникой","specialty":"Специализация","all_care":"Все виды лечения этой специализации","related":"Читайте также","video":"Видео","videos_title":"Видео по функциональному обучению","watch":"Смотреть на YouTube","reviews_note":"Отзывы с действующего сайта, приведены без изменений (на французском языке).","illus":"иллюстрация","doctolib":"Записаться онлайн (Doctolib)","hours_closed":"Выходной","menu_aria":"Главное меню","all_n":"Все виды лечения"},"days":["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"],"home":{"title":"Ваша улыбка под пристальным вниманием.","lead":"Семь стоматологов-специалистов, три операционные и лечение под лупами или микроскопом в самом сердце Канн.","spec_line":"Имплантология · Эстетика · Ортодонтия · Пародонтология · Эндодонтия · Детская стоматология","cta2":"Посмотреть лечение","hero_note":"2 rond-point Duboys d’Angers, Канны · с понедельника по пятницу","loupe_title":"Под лупой","loupe_lead":"У нас каждое лечение выполняется под увеличением: лупы, операционный микроскоп, камера для оттисков. Проведите лупой по фото, чтобы увидеть готовый результат.","loupe_hint":"Проведите лупой по фото","loupe_hint_touch":"Коснитесь и проведите, чтобы сдвинуть лупу","loupe_cases":[{"k":"col","t":"Пятна на двух резцах","by":"д-р Clarisse Bonnet","care":"les-colorations-dentaires"},{"k":"res4","t":"Амальгамные пломбы заменены керамикой","by":"д-р Clarisse Bonnet","care":"les-restaurations-esthetiques-directes-et-indirectes"},{"k":"res","t":"Композит на сколотом зубе","by":"д-р Clarisse Bonnet","care":"les-restaurations-esthetiques-directes-et-indirectes"},{"k":"bl","t":"Отбеливание","by":"д-р Clarisse Bonnet","care":"le-blanchiment-des-dents"}],"spec_title":"У каждого направления свой специалист","spec_lead":"Каждый врач имеет послевузовское образование по своей специализации. Ваша карта переходит от одного специалиста к другому, а адрес остаётся прежним.","clinic_title":"Светлый дуб, стены цвета селадон и три операционные","clinic_lead":"Полностью медицинская структура после обновления: светлое дерево, стены цвета селадон, зал ожидания только для детей. А за ним три операционные для хирургии и микрохирургии.","clinic_cta":"Посмотреть клинику","team_title":"Команда, которая вас лечит","team_lead":"Специалисты вместе работают над Вашим планом лечения, рядом с ними квалифицированные ассистенты.","team_cta":"Познакомиться с командой","process_title":"Как проходит лечение","process":[{"t":"Первая консультация","p":"Клинический осмотр, фото и рентген в 2D и 3D для глубокой диагностики."},{"t":"План лечения","p":"Составляется командой в интересах пациента. На каждом этапе выбор остаётся за Вами."},{"t":"Нужный специалист","p":"Каждую процедуру выполняет профильный специалист или несколько, в контакте с Вашим лечащим стоматологом при необходимости."},{"t":"Наблюдение","p":"Сначала сразу после лечения, затем длительное, у тех же специалистов."}],"process_note":"Мы всегда стараемся сократить число визитов до минимума.","lab_title":"Протезы, изготовленные во Франции","lab_p":"Все наши протезы изготавливаются во Франции зубными техниками, которые специализируются на эстетике и протезировании на имплантах. Среди них г-н Jean-Pierre Casu, лучший мастер Франции (Meilleur Ouvrier de France).","quote":"Улыбка длится лишь мгновение, но воспоминание о ней порой остаётся навсегда.","quote_by":"Raoul Follereau, «Le livre d’amour», глава «Улыбка» (1920)","reviews_title":"Что говорят пациенты","advice_title":"Советы клиники","advice_lead":"Тринадцать материалов, чтобы понимать, предупреждать и спокойно проходить лечение.","insta_title":"Клиника в Instagram","insta_lead":"Закулисье, клинические случаи и тёплые моменты из жизни команды, четыре аккаунта.","tech_line":"Шесть технологий на службе точности","insta_note":"Публикации будут отображаться здесь после установки сайта."},"specs":{"implantologie":{"t":"Имплантология","p":"Замена одного, нескольких или всех зубов титановыми корнями. Временные несъёмные зубы порой устанавливаются в тот же день.","doc":"д-р Franck Bonnet"},"parodontologie":{"t":"Пародонтология","p":"Лечение дёсен и кости, на которых держатся зубы. Пародонтитом страдает почти каждый второй француз, часто без боли.","doc":"д-р Benjamin Rathelot"},"orthodontie":{"t":"Ортодонтия","p":"Выравнивание зубов и направление роста от ребёнка до взрослого: металлические или керамические брекеты, прозрачные элайнеры.","doc":"д-р Marie Bonnet"},"esthetique":{"t":"Эстетика","p":"Пятна, сколы, цвет, виниры: стоматология, которая сохраняет зуб и стремится к естественности.","doc":"д-р Clarisse Bonnet"},"pedodontie":{"t":"Детская стоматология","p":"Бережное лечение детей, зал ожидания по их росту и маленькая мышка, которая живёт в клинике.","doc":"д-р Héloïse Panaras"},"endodontie":{"t":"Эндодонтия","p":"Лечение внутренней части зуба под микроскопом, чтобы сохранить его, даже если первое лечение не удалось.","doc":"Эндодонт клиники (работает только у нас)"}},"care":{"pose-dimplants-dentaires":{"s":"implantologie","t":"Установка зубных имплантов","lead":"Вмешательство кажется серьёзным, но проходит довольно быстро, а восстановление в подавляющем большинстве случаев протекает хорошо.","b":[["Где и как","Установка требует строгой асептики: её проводят в клинике или в операционной. Под местной анестезией вскрывается десна, чтобы получить доступ к кости."],["Закрыть в два этапа","Имплант полностью закрывается десной защищается плоским титановым винтом. Через 4–6 месяцев и после контрольного снимка головку импланта открывают, ставят формирователь десны, затем абатмент, на который крепится протез, цементируемый или винтовой. Выбор зависит от кости, предварительной пересадки или курения."],["Или в один этап","Головка импланта остаётся видимой с формирователем десны: второй операции нет, но имплант менее защищён. Это только для самых благоприятных случаев. В обоих вариантах кость срастается с имплантом за 4–6 месяцев."],["Наши советы","Точно выполняйте назначения и тщательно соблюдайте гигиену. В редких случаях имплант не приживается: тогда устанавливается новый."]],"cases":["c-impl-avant|c-impl-apres","c-impl-9","c-impl-8","c-impl-5","c-impl-4","c-impl-10","c-impl-11","c-impl-bonnet","c-impl-2"]},"implant-dentaire":{"s":"implantologie","t":"Зубной имплант","lead":"«Третьи зубы»: искусственный корень, который помещают в кость на месте утраченного зуба.","b":[["Что это","Медицински чистый цилиндр, который срастается с костью и принимает коронку, мост или целую дугу, либо фиксирует съёмный протез. Вы снова получаете несъёмные и естественные зубы."],["Наша повседневность","Клиника специализируется на сложной реабилитации. За одну операцию мы устанавливаем импланты и временные несъёмные зубы: пациент возвращает улыбку и способность жевать за несколько часов."],["Планирование в 3D","3D-реконструкция челюсти по данным томографии позволяет смоделировать операцию. Хирургические шаблоны точно переносят этот план в полость рта."],["Протез","Мы используем цирконий без металла для естественного вида и работаем с г-ном Jean-Pierre Casu, зубным техником, лучшим мастером Франции."]]},"la-maladie-parodontale":{"s":"parodontologie","t":"Пародонтальная болезнь","lead":"Пародонтит («расшатывание зубов») постепенно разрушает крепление зуба, часто без боли. Когда его замечают, бывает уже поздно.","b":[["Почему возникает","Двойная причина, бактериальная и иммунная: бактерии атакуют, организм защищается с разной эффективностью. Необходима точная и ранняя диагностика."],["Лечение","Сначала безоперационная санация, затем повторная оценка через 6–8 недель. Если остаются карманы, проводится санирующая операция в операционной, иногда с регенеративными биоматериалами. Затем поддерживающая терапия на всю жизнь."],["Признаки, которые должны насторожить","Десны кровоточат при чистке, красные или отёкшие; стойкий неприятный запах изо рта; гной и неприятный привкус; зубы шатаются, расходятся или оголяются; изменился прикус."],["Что усугубляет","Налёт и зубной камень, курение, беременность и половое созревание, стресс, некоторые лекарства, скрежет зубами, неправильное питание, общие заболевания, влияющие на иммунитет."],["Наше наблюдение","Лечение под лупами, рентгенологические обследования и «чартинг»; результаты ежемесячно разбирают все врачи клиники вместе."]]},"le-suivi-parodontal":{"s":"parodontologie","t":"Пародонтальная поддержка","lead":"Так же важна, как и само лечение: без наблюдения карманы заражаются снова, а кость продолжает убывать.","b":[["У специалиста","Axelsson и Lindhe показали это (1981, 2004): поддерживающая терапия у специалиста снижает число рецидивов, кариеса и потери прикрепления."],["Протокол GBT","В клинике мы следуем протоколу Guided Biofilm Therapy с AIRFLOW ONE, чтобы идеально удалять налёт и зубной камень."],["Типичный приём","Снимки и обновлённая медицинская анкета, осмотр дёсен, индивидуальные рекомендации, затем снятие камня, обработка корней, полировка и промывание."],["Периодичность","Зависит от Вашего риска и гигиены. Любой рецидив лечится сразу. Здоровье дёсен связано с сердцем, диабетом, преждевременными родами и полиартритом."]]},"la-chirurgie-mucco-gingivale-ou-chirurgie-plastique-parodontale":{"s":"parodontologie","t":"Пересадка десны","lead":"Закрыть оголённый корень, укрепить слишком тонкую десну или выровнять её контур.","by":"д-р Benjamin Rathelot","b":[["Зачем закрывать корень","Без эмали корень стирается, может поражаться кариесом и становится чувствительным к холодному. Закрытие возможно при определённых условиях, которые определяются на осмотре."],["Менее болезненно, чем раньше","Микрохирургия, особые способы забора ткани, защитные каппы: ощущения изменились. У курильщиков шансы на успех невелики: отказ от курения необходим на время заживления."]],"cases":["c-paro-av1|c-paro-ap1","c-paro-av2|c-paro-ap2","c-paro-av3|c-paro-ap3"]},"les-parodontites-dechaussement-des-dents":{"s":"parodontologie","t":"Пародонтиты (расшатывание зубов)","lead":"Затронут почти каждый второй француз. Потеря прикрепления идёт бесшумно: лучше заметить её рано.","b":[["Налёт и зубной камень","Налёт образуется из слюны, бактерий и остатков пищи. Если его плохо удалять, он минерализуется в зубной камень, у тех, кто много слюнит, быстрее."],["Лечение","Санация, повторная оценка через 6–8 недель, операция при сохранении карманов, затем поддерживающая терапия на всю жизнь. Операции проводятся в операционной, всё лечение под лупами."],["Также в клинике","Настоящие «эстетические операции на дёснах», чтобы закрыть или укрепить уязвимые участки."]]},"cas-cliniques-dorthodontie":{"s":"orthodontie","t":"Клинические случаи по ортодонтии","lead":"Пять случаев лечения, от ребёнка 8 лет до взрослого.","by":"д-р Marie Bonnet","b":[["Ребёнок","Интерцептивное лечение в 8 лет с помощью функционального трейнера."],["Подросток","Несъёмная аппаратура с множеством брекетов."],["Взрослый","Брекеты; прозрачные элайнеры; элайнеры, затем виниры."]],"cases":["c-ortho-e1a|c-ortho-e1b","c-ortho-e2a|c-ortho-e2b","c-ortho-a1a|c-ortho-a1b","c-ortho-a2a|c-ortho-a2b","c-ortho-a3a|c-ortho-a3b"]},"lorthodontie":{"s":"orthodontie","t":"Ортодонтическое лечение","lead":"Четыре способа перемещения зубов, выбираемые с учётом возраста, случая и Вашего образа жизни.","b":[["Профилактическое","У ребёнка: сбалансировать губы, щёки и язык для гармоничного роста; исправить несоответствия и вредные привычки (дыхание, глотание, жевание). Индивидуальные аппараты по оптическому оттиску и упражнения функционального обучения."],["Классическое","Металлические брекеты на клею: самолигирующая система DAMON Q® с высокотехнологичными дугами и лёгкими силами."],["Незаметное","Те же брекеты из керамики: система DAMON CLEAR®, прочная и почти невидимая."],["Прозрачное","Индивидуальные элайнеры INVISALIGN® для взрослых, подростков и некоторых детей. Незаметно, удобно, но требует хорошего сотрудничества."]],"videos":[["nsxbY1URF4c","Презентация"],["wM0ODjt3MrU","Уход и ношение"],["S_DnJC5nhe8","Дыхательные упражнения"],["UKFd2jAGlPA","Упражнения для мышц"]]},"la-prise-en-charge-en-orthodontie":{"s":"orthodontie","t":"Ортодонтическое лечение шаг за шагом","lead":"Пять этапов от первого приёма до ежегодного контроля.","b":[["Первая консультация","Осмотр, один или несколько планов лечения, сроки и финансирование объясняются заранее."],["Обследование","Фото, снимки и цифровой оттиск для постановки диагноза."],["Установка","Примерка прозрачных кап или фиксация брекетов: лечение начинается."],["Снятие и ретенция","Когда коррекция оптимальна, аппарат снимают, а незаметный ретейнер закрепляет результат."],["Наблюдение","Визиты через 1, 3 и 6 месяцев, затем раз в год."]]},"la-chirurgie-orale-au-service-de-lorthodontie":{"s":"orthodontie","t":"Хирургия на службе ортодонтии","lead":"Иногда небольшое хирургическое вмешательство делает лечение возможным или более быстрым.","b":[["Когда","Освободить ретинированный зуб, установить анкерные минивинты, переместить зуб, удалить зубы мудрости или сверхкомплектные зубы, всегда по согласованию с Вашим лечащим стоматологом. Ретинированные зубы определяются в 3D."],["Ускорение","Кортикотомия и пьезоцизия делают кость вокруг зубов более податливой под местной анестезией: чтобы идти быстрее у взрослых, перемещать анкилозированные зубы или ретинированные клыки, лечить даже при потере кости."]]},"les-malpositions-dentaires":{"s":"orthodontie","t":"Неправильное положение зубов","lead":"Слишком много или слишком мало места, и зубы выстраиваются как могут.","b":[["Риски","Эстетический дискомфорт, неравномерное жевание, проблемы челюстного сустава, стирание и переломы, нарушения речи, прикусывание дёсен, неполная чистка."],["Причины","Зубы и челюсти разных размеров (наследственность), позднее прорезывание постоянных зубов, нарушенные функции: инфантильное глотание, дыхание ртом."],["Решения","Вовремя отучить от пальца и соски, реабилитация (глотание, речь, носовое дыхание), удаление мешающих молочных зубов, лечение с учётом возраста."]]},"les-colorations-dentaires":{"s":"esthetique","t":"Пятна и стирание зубов","lead":"Табак, чай, кофе, вино, некоторые ополаскиватели или железо: слегка пористая эмаль окрашивается.","by":"д-р Clarisse Bonnet","b":[["Мои зубы в пятнах","Ежедневной гигиены, регулярного снятия камня и полировки часто достаточно. Избегайте слишком абразивных паст. При небольших дефектах эмали: микроабразия."],["Без амальгамы","Небольшой кариес восстанавливается композитом за один визит, крупный: вклейкой инлея или онлея, изготовленной по оттиску."],["Депульпированный зуб темнеет","Если он не слишком повреждён, внутреннее отбеливание возвращает ему сияние."]],"cases":["c-col-a1|c-col-b1","c-col-a2|c-col-b2"]},"le-blanchiment-des-dents":{"s":"esthetique","t":"Отбеливание зубов","lead":"Вернуть блеск естественному цвету зубов дома, под контролем клиники.","by":"д-р Clarisse Bonnet","b":[["Прежде всего","Консультация, чтобы исключить кариес, протечки или воспалённые дёсны, затем снятие камня и полировка. Глубокие окрашивания эмали лучше решаются винирами."],["Три визита","Оттиски и контрольное фото; выдача капп и геля; контроль через 15 дней. Гель носят по 2 часа в день вначале, затем на ночь, обычно 15 дней (до 6 недель). Цвет меняется уже с 3-го дня."],["Каппы остаются у Вас","Ими можно пользоваться снова, например после снятия камня, для освежения."],["Депульпированный зуб","Гель, помещённый внутрь зуба при защищённом корне, возвращает ему цвет соседних зубов."]],"cases":["c-bl-a1|c-bl-b1","c-bl-a2|c-bl-b2","c-bl-a3|c-bl-b3"]},"les-restaurations-esthetiques-directes-et-indirectes":{"s":"esthetique","t":"Эстетическая реставрация","lead":"Восстановить зуб, сохранив как можно больше здоровой ткани, благодаря адгезивной технике.","by":"д-р Clarisse Bonnet","b":[["Прямая","При кариесе, трещине или небольшом сколе: композит накладывается под коффердамом, моделируется и полируется за один визит."],["Непрямая","При более серьёзной потере: керамический инлей или онлей, изготовленный в лаборатории по оттиску и затем вклеенный под коффердамом для герметичного шва."]],"cases":["c-res-a1|c-res-b1","c-res-a2|c-res-b2","c-res-a3|c-res-b3","c-res-a4|c-res-b4"]},"les-facettes-ceramiques":{"s":"esthetique","t":"Виртуальное планирование и виниры","lead":"Увидеть будущую улыбку до любого необратимого шага.","by":"д-р Clarisse Bonnet","b":[["Смоделировать","После фотообследования виртуальное планирование определяет цели вместе с Вами; макет во рту делает проект осязаемым для всей команды (ортодонт, имплантолог, зубной техник)."],["Виниры","Очень тонкие керамические пластинки, приклеенные к видимой поверхности зубов: цвет, небольшие смещения, стирание. Естественный вид при сохранении зуба."]],"cases":["c-fac-a1|c-fac-b1","c-fac-a2|c-fac-b2"]},"les-couronnes-sur-implants-par-avec-technique-dempreinte-numerique":{"s":"esthetique","t":"Коронки на имплантах, цифровой оттиск","lead":"После установки импланта камера заменяет оттискную массу для изготовления керамической коронки.","b":[["Комфортнее","Больше никакой оттискной массы во рту: приятнее и очень точно."]],"cases":["c-couronne"]},"injection-dacide-hyaluronique":{"s":"esthetique","t":"Инъекции гиалуроновой кислоты","lead":"Улыбка это ещё и губы: стоматологи могут делать инъекции вокруг рта и в нижней части лица.","b":[["Зачем","С возрастом губы теряют объём, появляются морщины и складки. Инъекция возвращает объём или заполняет морщины вокруг губ в терапевтических целях."],["Препарат","Молекула, естественно присутствующая в коже, известная с 1934 года. Препарат клиники небелкового происхождения, биосовместимый и рассасывающийся."],["Где","Носогубные складки, марионеточные линии, морщины и морщинки вокруг рта, контур губ, овал лица."],["Результат и срок","Виден сразу, оптимален через 10 дней, держится 12–18 месяцев в зависимости от препарата. Редко возможны небольшой отёк или покраснение, которые быстро проходят. Препараты сертифицированы Afssaps."]]},"la-petite-souris":{"s":"pedodontie","t":"Мышка из нашей клиники","lead":"Она живёт за полкой в клинике, с занавесками в горошек и лампой из колпачка от зубной пасты.","b":[["Её миссия","Когда выпадает молочный зуб, она забирает его и оставляет блестящую монетку. Ей приходит много писем и рисунков. А кота здесь нет."],["Набор «мышка»","Коробочка в форме мышки, чтобы положить зуб под подушку, карточка для учёта молочных зубов и записка с её лапкой. Попроси у своего стоматолога!"]],"imgs":["souris","pochons","souris2"]},"soins-pour-les-enfants":{"s":"pedodontie","t":"Лечение детей","lead":"Д-р Héloïse Panaras, детский стоматолог, бережно принимает детей и подростков.","by":"д-р Héloïse Panaras","b":[["Зачем нужен детский стоматолог","Предупреждать кариес, следить за зубами и челюстями, сопровождать первые постоянные зубы, помочь привыкнуть к лечению."],["В клинике","Индивидуальное наблюдение, подходящая профилактика, работа с тревожностью, пространство, продуманное для самых маленьких. Каждый этап объясняется и ребёнку, и родителям."]],"imgs":["dr-panaras","salle-enf"]},"salle-attente-dediee-aux-mini-patients":{"s":"pedodontie","t":"Зал ожидания для маленьких пациентов","lead":"Яркое пространство только для них: книги, раскраски, мультфильмы и дверца мышки.","b":[["Доверие начинается здесь","Всё продумано так, чтобы визит прошёл спокойно, от прихода до кресла."]],"imgs":["mxl547","mxl535","mxl539","mxl533","cab4"]},"le-traitement-endodontique":{"s":"endodontie","t":"Эндодонтическое лечение","lead":"Лечение внутренней части зуба при воспалении или инфекции пульпы, чтобы избежать боли и абсцесса.","b":[["Сохранить зуб живым","Если воспаление ограничено, кариес удаляется под микроскопом, а пульпа «закрывается» материалом, который помогает ей заживать."],["Лечение корня","Очистка, формирование, дезинфекция и герметичное пломбирование каналов под коффердамом. Затем зуб восстанавливает Ваш лечащий стоматолог."],["Специалист","Микроскоп, апекслокатор, ультразвук, тёплое пломбирование, 3D-визуализация: оснащение для сложных случаев. Источник: Société Française d’Endodontie."]],"imgs":["c-endo1","c-endo2"]},"le-retraitement-endodontique":{"s":"endodontie","t":"Эндодонтическое перелечивание","lead":"Когда уже леченный зуб воспаляется или не заживает, лечение корней проводят заново.","b":[["Почему","Необнаруженный канал, слишком поздняя реставрация, новый кариес, реставрация с подтеканием."],["Этапы","Снять реставрации, удалить прежний материал, найти другие каналы, очистить, дезинфицировать, запломбировать, затем восстановить зуб."]],"imgs":["c-retrait","c-etapes"]},"la-chirurgie-endodontique":{"s":"endodontie","t":"Эндодонтическая хирургия","lead":"Когда перелечивание не удалось или невозможно (сломанный инструмент, изгиб, обызвествлённый канал…).","b":[["Вмешательство","Под микроскопом удаляют инфицированную ткань, срезая верхушку корня, затем запечатывают канал с конца биосовместимым материалом."]],"imgs":["c-chir-endo"]}},"tech":[{"t":"Камера для оптического оттиска","p":"Больше никакой массы: нет рвотного рефлекса и неприятного привкуса, а точность избавляет от лишних визитов.","img":"t-rect54"},{"t":"Управляемая хирургия и навигация","p":"Компьютер ведёт бор и имплант в 3D на протяжении всего вмешательства.","img":"t-rect5"},{"t":"AIRFLOW ONE","p":"Пародонтальная поддержка по протоколу Guided Biofilm Therapy. Наш пародонтолог проходил обучение в Германии и Швейцарии.","img":"fauteuil"},{"t":"3D-рентген cone beam","p":"Панорамный снимок и 3D-томография на месте: мгновенный диагноз, меньше облучения, ниже общая стоимость имплантации.","img":"t-radio"},{"t":"Операционный микроскоп","p":"Здесь работает наш эндодонт. Он также помогает находить трещины и переломы корней и используется для эстетических протезов.","img":"t-8004122"},{"t":"Пьезохирургия","p":"Ультразвук для коррекции или забора кости с микрометрической точностью.","img":"t-piezo"}],"blocs":{"t":"Три операционные","p":"Предназначены для хирургии и микрохирургии: оптимальные условия эргономики и асептики."},"team":{"docs":[["dr-clarisse","д-р Clarisse Bonnet","Эстетическая реставрационная стоматология"],["dr-marie","д-р Marie Bonnet","Ортодонтия"],["dr-franck","д-р Franck Bonnet","Имплантология, сложная реабилитация"],["dr-rathelot","д-р Benjamin Rathelot","Пародонтология"],["dr-panaras","д-р Héloïse Panaras","Детская стоматология"],["dr-guerson","д-р Yaël Guerson","Пародонтальная поддержка"],["dr-manders","д-р Rian Manders","Общая практика и пародонтальная поддержка"]],"staff":[["eq-helene","Hélène","Приём пациентов и секретариат"],["eq-joy","Joy","Квалифицированная стоматологическая ассистентка"],["eq-dounia","Dounia","Квалифицированная стоматологическая ассистентка"],["eq-anna","Anna","Квалифицированная стоматологическая ассистентка"],["eq-vania","Vania","Квалифицированная стоматологическая ассистентка"],["eq-sabine","Sabine","Специалист по стерилизации"],["eq-zorica","Zorica","Ассистент директора"],["eq-elisa","Elisa","Руководитель по коммуникациям"],["eq-morgane","Morgane","Комьюнити-менеджер"]],"motto":"Сделать всё, чтобы пациентов лечили так, как мы сами хотели бы, чтобы лечили нас."},"advice":{"la-prevention-votre-meilleur-allie-sante":{"t":"Профилактика, Ваш лучший союзник","img":"k-prev","p":["Некоторые проблемы начинаются бесшумно: ежегодный визит помогает заметить их вовремя.","На приёме стоматолог осматривает зубы, дёсны, прежнее лечение и гигиену; при необходимости делаются снимки.","Ежедневно: чистка не менее двух раз в день, после еды, и меньше сахара, особенно между приёмами пищи."]},"douleurs-et-si-cetait-vos-gencives":{"t":"Боль: а если это дёсны?","img":"k-douleurs","p":["Красная и отёкшая десна: это гингивит, вызванный налётом.","Кровоточивость при чистке, неприятный запах, чувствительность к горячему или холодному, десна, которая опускается: всё это тревожные сигналы.","Обратитесь к врачу, чтобы гингивит не перешёл в пародонтит."]},"zoom-sur-les-causes-des-douleurs-gingivales":{"t":"Причины болей в дёснах","img":"k-causes","p":["Недостаточная чистка (выбирайте мягкую щётку), гингивит, затем пародонтит.","Травма, гормональные изменения (беременность, половое созревание, менопауза), скрежет зубами.","Прогрессирующий кариес, раздражающие брекеты или протезы, прорезывающиеся зубы мудрости."]},"votre-suivi-orthodontique-avec-dental-monitoring":{"t":"Ортодонтическое наблюдение с Dental Monitoring","img":"k-dm","p":["Приложение следит за лечением, даже когда Вы не в клинике.","Вы получаете письмо, скачиваете приложение (Apple или Android), а мы вместе активируем его на приёме с первым сканированием.","Затем команда отвечает на Ваши вопросы через чат в приложении."]},"les-dents-de-sagesse":{"t":"Зубы мудрости","img":"k-sagesse","p":["Обычно они прорезываются в 17–21 год; у 22 % людей их нет совсем.","Если для них нет места, лучше удалить: они мешают другим зубам и способствуют кариесу.","После удаления: салфетка, если кровит, лёд при отёке, мягкая и тёплая пища, без курения и алкоголя."]},"eviter-les-maladies-parodontales":{"t":"Как избежать болезней дёсен","img":"k-gingivite","p":["Налёт превращается в зубной камень за 72 часа и поддерживает воспаление.","Здоровая десна розовая и плотная; красная, гладкая, кровоточащая требует визита к врачу.","Мягкая щётка дважды в день, нить и ёршики, ежегодное снятие камня. Рецессия лечится корректировкой чистки, иногда пересадкой."]},"quest-ce-que-lorthodontie-fonctionnelle":{"t":"Функциональная ортодонтия","img":"k-ortho","p":["Воздействовать во время роста на дыхание, жевание, глотание и осанку.","Дыхание ртом, долгое сосание пальца или сохранённое младенческое глотание деформируют челюсти.","Остеопаты, ЛОР-врачи, логопеды или кинезитерапевты могут дополнить лечение."]},"les-bons-reflexes-pour-se-brosser-les-dents-avec-un-appareil-dentaire":{"t":"Чистка зубов с брекетами","img":"k-brossage","p":["Чистите зубы минимум два раза в день, лучше три, и без перекусов.","Две минуты, проходя под дугой и уделяя внимание краю десны; кровоточащей десне нужно больше чистки, а не меньше.","Маленькая мягкая или электрическая щётка и ёршик напоследок."]},"tracas-appareil-dentaire":{"t":"Небольшие неудобства от брекетов","img":"k-tracas","p":["Зубы «тянет» в начале и после каждой активации: это проходит за 24–48 часов. Мягкая или холодная пища, обезболивающие при необходимости.","Раздражение щёк или губ: защитит ортодонтический воск.","Если дуга торчит, верните её на место пинцетом и напишите нам на contact@drs-bonnet-associes.fr."]},"piercings-buccaux-et-consequences-sur-votre-sante-dentaire":{"t":"Пирсинг во рту и здоровье зубов","img":"k-piercing","p":["Исследование, представленное на EuroPerio (проф. Clemens Walter, Университет Грайфсвальда), связывает пирсинг губ и языка с рецессией и более глубокими карманами.","Чем дольше носится пирсинг, тем выше риск.","Расскажите об этом своему стоматологу на приёме."]},"mieux-respirer-un-des-principaux-bienfaits-de-lorthodontie":{"t":"Дышать лучше благодаря ортодонтии","img":"k-respirer","p":["Открытый рот, сухие губы, заложенный нос, тёмные круги под глазами: возможно, ребёнок плохо дышит.","Дыхание носом фильтрует и согревает воздух, помогает сну и формирует лицо.","Раннее лечение вместе с ЛОР-врачом и педиатром может восстановить правильную вентиляцию. Полезно также научиться сморкаться и промывать нос."]},"limpact-du-grignotage-sur-la-sante-bucco-dentaire":{"t":"Перекусы и Ваши зубы","img":"k-grignotage","p":["Каждый приём пищи умножает кислотные атаки на эмаль.","Четыре приёма в день: завтрак, обед, полдник, ужин. Вода единственный напиток, дружественный зубам.","Нить или ёршики перед чисткой, 2 минуты, горошина пасты, щётка меняется каждые 3 месяца и никогда не делится с другими. Источник: UFSBD."]},"quest-ce-que-le-bruxisme-grincement-serrement-des-dents":{"t":"Бруксизм (скрежет и сжатие зубов)","img":"k-bruxisme","p":["В основном ночью (80 % случаев), у 10–15 % французов: стирание, боли в щеках и висках по утрам.","Лечат последствия: ночная каппа, управление стрессом, реставрации при необходимости.","При сильных болях ботулотоксин; иногда ортодонтия. Источник: UFSBD."]}},"reviews":[["Céline Leclercq","18/02/2026","Un grand merci au Dr Marie Bonnet et Joy qui m’ont refait mon sourire et je peux vous dire que je partais de très loin, grâce à elles je peux sourire sans honte. Elles ont été très professionnelles, je recommande sans hésiter."],["Laetitia Wneczak ép. Saladino","20/05/2026","Entièrement satisfaite de la prise en charge en orthodontie pour ma fille de 9 ans. Dr Marie Bonnet et son assistante Joy sont très compétentes et super gentilles ! De plus, le nouveau cabinet est absolument splendide !!"],["thierry vidal rossines","30/01/2026","Accueil parfait, prise en charge de mes problèmes adaptée, mise en place des implants sans aucune douleur… L’ensemble des professionnels sont à l’écoute. À recommander obligatoirement."],["Léonie Taton","04/12/2025","Je suis ravie d’avoir été soignée par le Dr Clarisse Bonnet. Elle est à la fois très professionnelle, douce et à l’écoute. Elle prend le temps d’expliquer chaque étape, ce qui met vraiment en confiance. Les soins ont été réalisés avec beaucoup de sérieux et sans douleur."],["Mathieu FERRAND","01/12/2025","Superbe travail de reconstruction en composite sur incisives fracturées. Excellente praticienne, douce, minutieuse et passionnée. J’éprouve une totale satisfaction sur le plan esthétique comme fonctionnel !"],["Véronique DUBROCARD IMBARD","04/03/2025","Suivie par le Docteur Franck Bonnet depuis plusieurs années, je recommande ce praticien très professionnel et à l’écoute. Travail soigné et le Dr Bonnet est très rassurant et patient avec les phobiques stressées comme moi."],["jc brun","04/02/2025","Un grand merci à Clarisse et Marie pour les bons soins prodigués. Travail de haute qualité et précision pour un beau sourire retrouvé ! Merci à l’équipe !"],["Brooke Gynt","21/07/2024","Le Dr Clarisse Bonnet m’a tout de suite mise à l’aise et a fait un très bon travail en soignant mes caries. Le personnel est accueillant et professionnel, et l’ambiance du cabinet est très agréable."],["Baptiste PHILIBERT","18/04/2024","Super travail, très minutieux et très professionnel, super équipe et tout le monde très sympa ! Au top !"],["Christine HUSS","","Elle m’a donné, avec quelques modifications et sans me limer les dents, un éclat à mon sourire. En plus elle est très douce. Son papa m’a déjà fait un implant et ma paro a été traitée dans le même cabinet. Pour moi « the best » de la région."]],"contact":{"title":"Как добраться до клиники","address":"2 rond-point Duboys d’Angers, 06400 Cannes","parking":"Парковка: Palais Stéphanie в 90 м; Lamy в 150 м (2 часа бесплатно, один раз в неделю).","hours":[["08h30","18h00"],["08h30","18h00"],["09h00","19h00"],["0 ические или керамические брекеты (Damon) либо прозрачные элайнеры Invisalign. Она также принимает записи на Doctolib.","a_esth":"Пятна, сколотый зуб, отбеливание или виниры: это эстетическая стоматология д-ра Clarisse Bonnet, с симуляцией Вашей будущей улыбки до любых действий.","a_kids":"Для детей работает д-р Héloïse Panaras, детский стоматолог. Есть зал ожидания только для них, а маленькая мышка живёт в клинике!","a_endo":"Сильная боль в зубе или боль в уже депульпированном зубе чаще всего относится к эндодонтии, её выполняет под микроскопом эндодонт клиники. При боли звоните по телефону 04 93 99 72 81.","a_pain":"Если у Вас болит, быстрее всего позвонить в клинику по телефону 04 93 99 72 81. Я не могу ставить диагноз, но команда подскажет, что делать.","a_hours":"Клиника открыта в понедельник, вторник, четверг и пятницу с 8:30 до 18:00, в среду с 9:00 до 19:00, в субботу выходной. Адрес: 2 rond-point Duboys d’Angers, Канны.","a_parking":"Две парковки совсем рядом: Palais Stéphanie в 90 м и Lamy в 150 м (2 часа бесплатно, один раз в неделю).","a_rdv":"Позвоните по телефону 04 93 99 72 81 или заполните запрос на приём: секретариат Вам перезвонит. Для ортодонтии можно также записаться через Doctolib.","a_price":"Цены не публикуются в интернете: они зависят от обследования. Их объясняют на первой консультации вместе с планом лечения. Секретариат также ответит по телефону 04 93 99 72 81.","a_fear":"Это часто бывает, и об этом можно сказать при записи. Несколько пациентов пишут в отзывах, что команда помогла им успокоиться. Детьми с тревогой занимается детский стоматолог д-р Héloïse Panaras.","a_hya":"В клинике делают инъекции гиалуроновой кислоты вокруг рта (губы, складки): результат виден сразу, держится 12–18 месяцев.","a_lang":"Команда говорит по-французски; если Вам нужен другой язык, уточните это при записи, и клиника скажет, что возможно.","a_unknown":"Я отвечаю на вопросы о клинике, лечении, часах работы и проезде, а этой информации у меня нет. Лучше позвонить по номеру 04 93 99 72 81 или написать на contact@drs-bonnet-associes.fr.","go_care":"Открыть страницу","go_rdv":"Записаться на приём","a_urgent":"Выпала коронка, шатается имплант, сломался зуб или есть отёк: позвоните в клинику по номеру 04 93 99 72 81, чтобы вас приняли быстро. Я не ставлю диагнозы. При температуре или сильном отёке в нерабочее время звоните 15.","a_health":"Беременность, приём лекарств или проблемы со здоровьем: сообщите об этом при записи, и врач адаптирует лечение. С конкретным вопросом лучше позвонить по номеру 04 93 99 72 81.","a_hello":"Здравствуйте! Расскажите, что вас беспокоит (нет зуба, дёсны, брекеты, ребёнок…), и я подскажу нужного специалиста.","a_pay":"О способах оплаты и страховом покрытии вам расскажет секретариат по номеру 04 93 99 72 81: у меня нет этой информации.","a_wisdom":"Зубы мудрости обычно прорезаются между 17 и 21 годами; если им не хватает места, их часто лучше удалить. В клинике есть подробная памятка, удаление проводится под местной анестезией.","a_brux":"Скрежет или сжатие зубов (бруксизм) стирает зубы и утомляет челюсть. Лечат в основном ночной капой; вот памятка клиники."}}};

 if(c.includes('|')){const [a,b]=c.split('|');if(!IMGS.has(a)||!IMGS.has(b))return '';return `<figure><div class="paire"><img loading="lazy" src="${img(a)}" alt="${esc(t('ui.before'))}"><img loading="lazy" src="${img(b)}" alt="${esc(t('ui.after'))}"><span class="a1">${t('ui.before')}</span><span class="a2">${t('ui.after')}</span></div></figure>`}
 if(!IMGS.has(c))return '';return `<figure><img loading="lazy" src="${img(c)}" alt="${esc(t('ui.real_case'))}"></figure>`}

function send(e,p){var b=JSON.stringify({m:m,e:e,s:s,p:p||'',t:Math.round((Date.now()-t0)/1000),l:(document.documentElement.lang||'').slice(0,2)});try{if(navigator.sendBeacon)navigator.sendBeacon(u,new Blob([b],{type:'text/plain'}));else fetch(u,{method:'POST',body:b,keepalive:true})}catch(x){}}
function once(k){k=String(k).toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24);if(!k||seen[k])return;seen[k]=1;send('ev',k)}
send('open');setInterval(function(){if(document.visibilityState==='visible')send('ping')},45000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')send('ping')});

document.addEventListener('click',function(e){var el=e.target.closest('a,button,[data-add],[data-go],[role=button],summary');if(!el)return;var t=((el.getAttribute('aria-label')||'')+' '+(el.textContent||'')+' '+(el.className||'')+' '+(el.id||'')).toLowerCase(),h=el.getAttribute&&el.getAttribute('href')||'';

else if(/réserv|reserv|visite|book/.test(t))once('reservation');
else if(/coffret|gift|cadeau/.test(t))once('coffret')},true);
