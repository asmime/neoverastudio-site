'f.a23':['L’Ardèche est un terrain de jeux : pêche, accrobranche, spéléo, vélo, VTT, canoë-kayak, randonnée à cheval ou à pied, et les villages de caractère. Voir la page Aux alentours.','The Ardèche is a playground: fishing, treetop adventure, caving, cycling, mountain biking, canoeing, horse riding or hiking, and its villages of character. See the Nearby page.','Ardèche es un parque de juegos: pesca, parque de aventura, espeleología, bici, BTT, canoa, rutas a caballo o a pie y pueblos con encanto. Vea la página Alrededores.','Die Ardèche ist ein Spielplatz: Angeln, Kletterwald, Höhlentouren, Rad, Mountainbike, Kanu, Reiten oder Wandern und charaktervolle Dörfer. Siehe Seite Umgebung.','L’Ardèche è un parco giochi: pesca, parco avventura, speleologia, bici, MTB, canoa, equitazione o trekking e borghi di carattere. Vedi la pagina Dintorni.','De Ardèche is één grote speeltuin: vissen, klimpark, grotten, fietsen, mountainbiken, kanoën, paardrijden of wandelen, en karaktervolle dorpjes. Zie de pagina Omgeving.'],
});

const LEGAL={"cgv": "Généralités et contrat\nToute option de réservation (valable 8 jours) devient effective uniquement avec l’accord du camping, après réception de l’acompte de 25%, des frais de dossier et du contrat de réservation (contrat de réservation dûment complété et signé ou réservation en ligne). Dans le cas contraire, celle-ci sera automatiquement annulée sans préavis de notre part.\nPour des questions de législation, de sécurité mais aussi de confort, le camping demande de recevoir au moment de la réservation l’ensemble des noms, prénoms et dates de naissance de tous les participants du séjour, ainsi qu’un numéro de portable et plaque d’immatriculation de leur véhicule. Toutes personnes non déclarées lors de la réservation initiale n’auront pas accès à votre location / emplacement sans accord au préalable de la réception. Le camping se réserve le droit de refuser son accès aux groupes ou familles se présentant avec un nombre de participants (bébé(s) compris) supérieur à la capacité de l’hébergement loué. A réception de votre paiement vous acceptez les termes, les conditions, les prestations et les prix de votre séjour. Vous ne pourrez prétendre vous être trompé car vous avez saisi les informations. Le camping le Grillou ne peut garantir les demandes particulières faites lors d’une réservation (numéro emplacement ou autre).\nLes demandes de prise en charge VACAF après validation du dossier initial resteront fermes et définitives. Les mineurs ne sont pas acceptés seuls dans l’enceinte de l’établissement. \nHoraire d’arrivée tardive : possibilité jusqu’à 21h00.\n Absence de droit de rétractation\nObligation d’information sur le fait que le droit de rétractation ne s’applique pas pour les hébergements d’hôtellerie de plein air, prévu à l’article L. 221-5 qui stipule que : … 5° Lorsque le droit de rétractation ne peut être\nexercé en application de l’article L. 221-28, l’information selon laquelle le consommateur ne bénéficie pas de ce droit ou, le cas échéant, les circonstances dans lesquelles le consommateur perd son droit de rétractation »\n Emplacements \nLe tarif des emplacements est à la nuitée de 14h00 à 12h00. Ils sont prévus pour 6 personnes maximum et ont tous l’électricité 10A (prise française – prévoir une rallonge de 25m). Deux blocs sanitaires sont à votre disposition (sanitaire PMR, cabine familiale). Aire de service pour camping-car.\nNotre prix de base comprend :\n– Un emplacement pour 2 personnes + une place pour une tente ou une caravane ou camping-car + la place d’un stationnement véhicule\nNotre prix de base ne comprend pas :\n– Les personnes supplémentaires + la location de frigo\n Locations\nHeure d’arrivée : 16h00 – Heure de départ : 10h00\nNotre prix de base comprend :\n– Location équipée pour le nombre de personnes prévues en fonction du type d’hébergement + la place d’un stationnement véhicule\nNotre prix de base ne comprend pas :\n– La fourniture de draps + fourniture de kit de serviettes + les produits d’entretien\nToute insatisfaction concernant l’état général doit être notifiée au plus tard 24h après l’arrivée. Passé ce délai, les plaintes ne seront plus recevables. Durant votre séjour, l’entretien de la location vous incombe. Le logement doit être rendu propre – à défaut les frais de remise en état vous seront facturés. Départ du mobil home/chalet avant l’ouverture de la réception : Si vous souhaitez partir avant l’ouverture, nous vous ferons confiance pour faire le ménage – il n’y aura pas « d’état des lieux » fait par le camping, cela se fera sans votre présence. Si le nettoyage n’est pas fait correctement, un forfait ménage vous sera facturé. Une caution de 200,00 € vous sera demandée par empreinte bancaire via notre partenaire sécurisé Swikly. Après votre départ et vérification du logement, votre caution Swikly sera automatiquement libérée sous quelques jours. Toutes les locations sont non-fumeurs. La caution sera conservée en totalité si l’interdiction de fumer n’a pas été respectée. En hors saison, les heures d’arrivée et de départ (location et emplacement) peuvent être adaptées sur demande.\nTarifs et règlement du séjour\nLes tarifs appliqués sont ceux mentionnés sur notre brochure et sur notre site internet www.campinglegrillou.fr. Des promos ponctuelles peuvent être mises en place sur notre site. Le tarif appliqué sera alors celui de la promo en cours en fonction des disponibilités au moment de la demande de réservation. Aucun séjour réservé et payé avant la mise en place de ces promotions\nne fera l’objet d’un remboursement même partiel ou d’une réduction de tarif. Ces prix sont à la date de réservation fermes et définitifs. Le montant de la taxe de séjour n’est pas inclus dans\nle prix (concerne les personnes de 18 ans et plus – elle s’élève à 0.61€/nuit/personne). Chaque réservation de séjour à partir de 3 nuits donne lieu à la perception de frais de dossier de 20,00 €.\nLe solde de réservation sera à régler pour les locations et les emplacements 30 jours avant la date de votre arrivée. En cas de retard de paiement, le camping se réserve le droit d’annuler la réservation et de conserver l’acompte réglé. Pour les réservations effectuées moins de 30 jours avant la date de votre arrivée, le règlement intégral doit être effectué au moment de la réservation par carte bancaire ou virement. Le paiement du solde peut être échelonné en plusieurs versements tous les mois sans frais supplémentaire (Jusqu’à J-30). Différents modes de paiement sont acceptés : ANCV, e-ANCV, chèque bancaire, carte bancaire ou virement bancaire. Aucun remboursement ne sera accordé pour toute arrivée retardée ou tout départ anticipé. Il est impératif et indispensable dans tous les cas de nous prévenir au préalable. Le camping se réserve le droit de proposer à nouveau l’emplacement ou la location à la vente sans remboursement possible. Aucun rendu de monnaie ne sera possible si le montant total des chèques vacances est supérieur au prix total de la réservation. Les ANCV non envoyés en recommandé et non réceptionnés par le Camping le Grillou sont sous la responsabilité du client.\nOccupation des lieux\nLe client pourra consulter notre règlement intérieur sur notre site stipulant le respect d’autrui, la propreté, le respect du calme ou l’enlèvement des ordures ménagères. Tous les clients doivent se conformer aux dispositions du règlement intérieur. Les mineurs non accompagnés par l’un des titulaires de l’autorité parentale ne peuvent déambuler après 23h00. Les animaux sont acceptés* dans la limite de 2 maximum par emplacement. Ils doivent être tatoués ou pucés et leurs carnets de vaccination à jour (*les chiens de première catégorie ne sont pas acceptés).\n Il est STRICTEMENT INTERDIT aux animaux de monter sur les lits : un supplément ménage pourra vous être facturé pour le lavage des couettes. La préfecture de l’Ardèche interdit l’utilisation des barbecues individuels sur le terrain du camping. Un barbecue collectif est à votre disposition. La responsabilité du camping ne saurait être engagée en cas de perte, de vol ou de dégradation d’effets personnels durant le séjour, tant dans les hébergements locatifs, emplacements que dans les parkings ou les locaux communs. La recharge de tout type de véhicule électrique est interdite à l’intérieur du camping, une borne de recharge rapide se trouve en face du camping.\nVisiteurs \nPour la sécurité et le confort de tous, l’accès au camping est réglementé. Nous rappelons que toute personne qui rentre dans le camping doit être signalée à la réception. Les visiteurs n’ont pas accès à notre espace aquatique. Les visiteurs qui dorment au camping doivent s’inscrire obligatoirement auprès de la réception à leur arrivée.\nEspace aquatique \nIl n’est pas permis de réserver des transats avec vos serviettes ou d’autres moyens, si vous ne restez pas à la piscine. Nous nous réservons le droit de retirer des chaises longues les draps de bain non utilisés après un certain temps. S’agissant d’une piscine privée à usage collectif, nous sommes soumis à une réglementation imposée par l’ARS (Agence Régionale de Santé). \nBaignade non surveillée. Les enfants sont sous la responsabilité des parents.\nObligations : Port du slip de bain, prise d’une douche et d’un bain de pieds.\nInterdictions :\n– Port du bermuda/caleçon\n– Huile solaire (crème tolérée)\n– Port de chaussures (les laisser à l’entrée)\n– Parasols dans l’enceinte des piscines (poussettes\nacceptées)\n– Pas de jouet, bateau, ballon, palmes, pelle, seau,\npistolet à eau, etc.\n– Ne pas manger, boire, fumer\nAutorisations : Petites bouées ou brassards pour les enfants qui ne savent pas nager uniquement.\nDroit à l’image\nNous vous informons que des reportages photos et vidéos peuvent être réalisés au sein de notre camping pour des besoins publicitaires. En cas de refus, vous devez le notifier par lettre recommandée avant votre arrivée. Si ce n’est pas le cas, aucune contestation ni revendication ne sera possible quant au droit à l’image des personnes apparaissant sur ces photos et vidéos prises dans l’enceinte du Camping Le Grillou.\nAnnulation\nToute annulation doit être notifiée par lettre recommandée, cachet de la poste faisant foi. Les annulations transmises par téléphone ne pourront pas être prises en compte. Il vous sera retenu les frais de dossier dans tous les cas ainsi qu’un montant proportionnel au montant total de votre séjour suivant le barème ci-dessous :\n1. Plus de 60 jours avant le début du séjour : les sommes versées vous seront remboursées.\n2. De 30 à 60 jours avant le début du séjour : 25% du montant total du séjour sera conservé par le camping.\n3. Moins de 30 jours avant le début du séjour : 100% du montant total du séjour sera conservé par le camping.\nEn cas d’annulation de la part du camping, sauf cas de force majeure, les sommes versées vous seront remboursées.\nLitige & Médiation\nDans le cadre d’un litige avec notre camping, vous avez la possibilité de nous contacter de la manière suivante :\n– Envoi d’un courrier par lettre recommandée avec AR (accusé de réception) à SAS CAMPING LE GRILLOU 590 Route de Joyeuse – 07260 ROSIERES\nSi la réponse ne vous satisfait pas, vous avez la possibilité de saisir le Centre de Médiation CM2C.\nCe dispositif de médiation peut être joint par :\n– Voie électronique : declarer-un-litige@cm2c.net\n– Voie postale : CM2C, 49 Rue de Ponthieu, 75008 PARIS\n– Ou en utilisant le service en ligne sur www.cm2c.net\nBloctel\nLe client dispose d’un droit d’opposition spécifique au démarchage téléphonique en s’inscrivant sur la liste Bloctel : www.bloctel.gouv.fr\nNous vous invitons à souscrire une assurance annulation auprès d’un des organismes indépendants suivants: FFCC , MEETCH ou autres\nEn réservant un séjour, le client atteste avoir lu et approuver les présentes conditions générales de vente ainsi que le règlement intérieur disponible sur notre site internet www.camping-legrillou.fr", "reglement": "RÈGLEMENT INTÉRIEUR DES TERRAINS DE CAMPING OU DE CARAVANAGE AINSI QUE DES PARCS RÉSIDENTIELS DE LOISIRS\nI. – CONDITIONS GENERALES\n1) Conditions d’admission : Pour être admis à pénétrer, à s’installer, et séjourner sur un terrain de camping, il faut y avoir été autorisé par le gestionnaire ou son représentant. Il a pour obligation de veiller à la bonne tenue et au bon ordre du terrain de camping ainsi qu’au respect de l’application du présent règlement intérieur. Le fait de séjourner sur le terrain de camping implique l’acceptation des dispositions du présent règlement et l’engagement de s’y conformer.\n2) Formalités de police : Toute personne devant séjourner au moins une nuit dans le terrain de camping doit au préalable présenter au gestionnaire ou son représentant ses pièces d’identité et remplir les formalités exigées par la police. Les mineurs non accompagnés de leurs parents ne seront admis qu’avec une autorisation écrite de ceux-ci.\n3) Installation : La tente ou la caravane et le matériel y afférent doivent être installés à l’emplacement indiqué conformément aux directives données par le gestionnaire ou son représentant.\n4) Bureau d’accueil : Ouvert de 9h00 à 12h00 et de 14h00 à 17h00. (voir affiche horaires à la réception).\nOn trouvera au bureau d’accueil tous les renseignements sur les services du terrain de camping, les informations sur les possibilités de ravitaillement, les installations sportives, les richesses touristiques des environs et diverses adresses qui peuvent s’avérer utiles.\nUn livre de réclamations ou une boîte spéciale destinée à recevoir les réclamations est tenu à la disposition des usagers. Les réclamations ne seront prises en considération que si elles sont signées, datées, aussi précises que possible et se rapportant à des faits relativement récents.\n5) Redevances : Les redevances sont payées au bureau d’accueil. Leur montant fait l’objet d’un affichage à l’entrée du terrain de camping et au bureau d’accueil. Elles sont dues selon le nombre de nuits passées sur le terrain. Les usagers du terrain de camping sont invités à prévenir le bureau d’accueil de leur départ dès la veille de celui-ci. Les campeurs ayant l’intention de partir avant l’heure d’ouverture du bureau d’accueil doivent effectuer la veille le paiement de leurs redevances.\n6) Bruit et silence : Les usagers du terrain de camping sont instamment priés d’éviter tous bruits et discussions qui pourraient gêner leurs voisins. Les appareils sonores doivent être réglés en conséquence. Les fermetures de portières et de coffres doivent être aussi discrètes que possible. Les chiens et autres animaux ne doivent jamais être laissés en liberté. Ils ne doivent pas être laissés au terrain de camping, même enfermés en l’absence de leurs maîtres qui en sont civilement responsables. Le silence doit être total entre 22h00 et 7h00.\n7) Visiteurs: Après y avoir été autorisés par le gestionnaire ou son représentant, les visiteurs peuvent être admis dans le terrain de camping sous la responsabilité des campeurs qui les reçoivent. Le campeur peut recevoir un ou des visiteurs à l’accueil. Si ces visiteurs sont admis à pénétrer dans le terrain de camping, le campeur qui les reçoit peut être tenu d’acquitter une redevance, dans la mesure où le visiteur a accès aux prestations et/ou installations du terrain de camping. Cette redevance fait l’objet d’un affichage à l’entrée du terrain de camping et au bureau d’accueil. Les voitures des visiteurs sont interdites dans le terrain de camping.\n8) Circulation et stationnement des véhicules : A l’intérieur du terrain de camping, les véhicules doivent rouler à une vitesse limite de 10 km/h. La circulation est interdite entre 22h00 et 7h00. Ne peuvent circuler dans le terrain de camping que les véhicules qui appartiennent aux campeurs y séjournant. Le stationnement, strictement interdit sur les emplacements habituellement occupés par les abris de camping, ne doit pas, en outre, entraver la circulation ni empêcher l’installation de nouveaux arrivants.\n9) Tenue et aspect des installations : Chacun est tenu de s’abstenir de toute action qui pourrait nuire à la propreté, à l’hygiène et à l’aspect du terrain de camping. Il est interdit de jeter des eaux usées sur le sol ou dans les caniveaux. Les « caravaniers » doivent obligatoirement vider leurs eaux usées dans les installations prévues à cet effet. Les ordures ménagères, les déchets de toute nature, les papiers, doivent être déposés dans les poubelles. Chacun est tenu de s’abstenir de toute action qui pourrait nuire à la propreté, à l’hygiène et à l’aspect du terrain de camping et de ses installations, notamment sanitaires. Le lavage est strictement interdit en dehors des bacs prévus à cet usage. Cependant, il est toléré jusqu’à 10 heures à proximité des chalets, à la condition qu’il soit très discret et ne gêne pas les voisins. Il ne devra jamais être fait à partir des arbres. Les plantations et les décorations florales doivent être respectées. Il est interdit au campeur de planter des clous dans les arbres, de couper des branches, de faire des plantations. II n’est pas permis non plus de délimiter l’emplacement d’une installation par des moyens personnels, ni de creuser le sol. Toute dégradation commise à la végétation, aux clôtures, au terrain ou aux installations du terrain de camping sera à la charge de son auteur. L’emplacement qui aura été utilisé durant le séjour devra être maintenu dans l’état dans lequel le campeur l’a trouvé à son entrée dans les lieux.\n10) Sécurité\nIncendie : Les feux ouverts (bois, charbon, etc…) sont rigoureusement interdits. Les réchauds doivent être maintenus en bon état de fonctionnement et ne pas être utilisés dans des conditions dangereuses. En cas d’incendie aviser immédiatement la direction.\nLes extincteurs sont utilisables en cas de nécessité. Une trousse de secours de première urgence se trouve au bureau d’accueil.\nVol : La direction est responsable des objets déposés au bureau et a une obligation générale de surveillance du terrain de camping. Le campeur garde la responsabilité de sa propre installation et doit signaler au responsable la présence de toute personne suspecte. Bien que le gardiennage soit assuré, les usagers du terrain de camping sont invités à prendre les précautions habituelles pour la sauvegarde de leur matériel.\n11) Jeux : Aucun jeu violent, ou gênant, ne peut être organisé à proximité des installations. La salle de réunion ne peut être utilisée pour les jeux mouvementés. Les enfants devront toujours être sous la surveillance de leurs parents.\n12) Garage mort : Il ne pourra être laissé de matériel non occupé sur le terrain, qu’après accord de la direction et seulement à l’emplacement indiqué. Une redevance, dont le montant sera affiché au bureau, sera due pour le « garage mort ».\n13) Affichage: Le présent règlement intérieur est affiché à l’entrée du terrain de camping et au bureau d’accueil. Il est remis au client à sa demande.\n14) Infraction au règlement intérieur : Dans le cas où function calcHTML(){
 return `<div class="calc" id="calcbox"><div>

const S={n:7,a:2,k:2,b:0};
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const iso=d=>d.toISOString().slice(0,10);
const addD=(d,n)=>new Date(d.getTime()+n*864e5);
function weekIdx(d){const x=iso(d);if(x>='2026-06-20'&&x<'2026-06-27')return 0;if(x>='2026-06-27'&&x<'2026-07-04')return 1;if(x>='2026-07-04'&&x<'2026-08-22')return 2;if(x>='2026-08-22'&&x<'2026-08-29')return 3;return -1}
function calc(){
 const box=document.getElementById('ticket');if(!box)return;
 const type=document.getElementById('ct').value;let arr=document.getElementById('ca').value||'2026-07-12';
 const lines=[];let warn=[],lodg=0;const pers=S.a+S.k+S.b;
 let a=D(arr);const open=D('2026-05-01'),close=D('2026-09-13');
 if(a<open||a>=close){warn.push(t('c.closed'));a=a<open?open:addD(close,-1)}
 if(type==='emp'){
  if(S.n<1)S.n=1;
  for(let i=0;i<S.n;i++){const d=iso(addD(a,i));const hi=d>='2026-06-27'&&d<'2026-08-29';const extra=Math.max(0,S.a+S.k-2);lodg+=(hi?40:20)+extra*(hi?7:3.5)}
  if(S.a+S.k>6)warn.push(t('c.cap',{n:6}));
 }else{
  const l=LOCS.find(x=>x.id===type);
  if(pers>l.cap)warn.push(t('c.cap',{n:l.cap}));
  const wi=weekIdx(a);
  if(wi>=0){ // haute saison : à la semaine
   const want=l.day==='sun'?0:6;let dd=a;while(dd.getUTCDay()!==want)dd=addD(dd,-1);
   if(iso(dd)!==iso(a))warn.push(t('c.week',{d:t('c.'+l.day)}));
   a=dd;document.getElementById('ca').value=iso(a);const w=Math.max(1,Math.round(S.n/7));S.n=w*7;
   for(let i=0;i<w;i++){const j=weekIdx(addD(a,i*7));lodg+=j>=0?l.week[j]:LOW[5][1]}
  }else{
   if(!l.low){warn.push(t('c.trianon'))}
   if(S.n<2){S.n=2;warn.push(t('c.min'))}
   const w=Math.floor(S.n/7),r=S.n%7;lodg=w*LOW[5][1]+(r?LOW.find(x=>x[0]===Math.max(2,r))[1]:0);
   if(pers>5&&l.cap<=5){}
  }
 }
 document.getElementById('cnts').textContent=S.n;
 const tax=Math.round(S.a*S.n*0.61*100)/100,fee=20,tot=lodg+tax+fee;
 const end=iso(addD(a,S.n));
 box.innerHTML=`<div class="l"><span>${t('c.lodging')}</span><b>${eur(lodg)}</b></div><div class="l"><span>${t('c.tax')}</span><b>${eur(tax)}</b></div><div class="l"><span>${t('c.fee')}</span><b>${eur(fee)}</b></div>
 <div class="tot"><span>${t('c.total')}</span><b>${eur(Math.round(tot*100)/100)}</b></div>
 <div class="l"><span>${t('c.dep')}</span><b>${eur(Math.round((lodg*.25+fee)*100)/100)}</b></div>
 ${warn.length?`<div class="warn">${warn.join(' ')}</div>`:''}
 <a class="btn btn-tube" href="${resa(`&begin=${iso(a)}&end=${end}&duration=${S.n}&nb_pers=${Math.max(1,pers)}`)}" target="_blank" rel="noopener">${ic.cal}${t('ui.bookfull')}</a>
 <p class="note">${t('c.note')}</p>`;
 document.querySelectorAll('#calcbox .step').forEach(s=>{const k=s.dataset.k;const lim={n:[1,28],a:[1,8],k:[0,7],b:[0,4]}[k];s.querySelector('output').textContent=S[k];s.querySelectorAll('button')[0].disabled=S[k]<=lim[0];s.querySelectorAll('button')[1].disabled=S[k]>=lim[1]});
}
function bindCalc(){
 const box=document.getElementById('calcbox');if(!box)return;
 box.querySelectorAll('.step').forEach(s=>{const k=s.dataset.k,[m,p]=s.querySelectorAll('button');const step=()=>(k==='n'&&document.getElementById('ct').value!=='emp'&&weekIdx(D(document.getElementById('ca').value||'2026-07-12'))>=0)?7:1;
  m.onclick=()=>{S[k]=Math.max({n:1,a:1,k:0,b:0}[k],S[k]-step());calc()};p.onclick=()=>{S[k]=Math.min({n:28,a:8,k:7,b:4}[k],S[k]+step());calc()}});
 document.getElementById('ct').onchange=calc;document.getElementById('ca').onchange=calc;calc();
}

 const svg=d.querySelector('svg.voie'),[fond,trace,eau]=svg.querySelectorAll('path');
 const build=()=>{
  const W=d.clientWidth,H=d.clientHeight,mob=W<760;
  const xR=mob?13:Math.min(W-34,(W+1180)/2+30), amp=mob?7:Math.min(60,(W-1180)/2-10);
