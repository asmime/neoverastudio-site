:root{
 --chaux:#F6F5F2;--blanc:#FFFFFF;--schiste:#3B3237;--schiste-2:#5E535A;--schiste-3:#8C8288;
 --chene:#C3955A;--chene-c:#EEDFC8;--chene-f:#8A6334;--fauteuil:#16735A;--fauteuil-f:#0E5642;--fauteuil-c:#DCEFE8;
 --trait:#E3DFDB;--texte:#2B2428;--texte-2:#5C5358;
 --titre:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;--corps:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;--num:"Azeret Mono",ui-monospace,monospace;
 --r:6px;--ombre:0 10px 30px -12px rgba(59,50,55,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--chaux);color:var(--texte);font:400 17px/1.6 var(--corps);overflow-x:hidden}
:lang(zh) body,body:lang(zh){font-family:var(--corps),"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
img{max-width:100%;display:block}
a[href^="tel:"],.horaires,.statut,.mails{font-family:var(--titre)}
a{color:var(--fauteuil-f);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-color:var(--chene)}
::selection{background:var(--chene-c);color:var(--schiste)}
:focus-visible{outline:2px solid var(--fauteuil);outline-offset:3px;border-radius:3px}
html{scrollbar-color:var(--schiste-3) var(--chaux)}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-thumb{background:var(--schiste-3);border-radius:8px;border:2px solid var(--chaux)}::-webkit-scrollbar-track{background:var(--chaux)}
h1,h2,h3,h4{font-family:var(--titre);color:var(--schiste);font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:clamp(30px,4.2vw,50px);line-height:1.06}
h3{font-size:22px;line-height:1.2}
p{margin:0 0 .9em;max-width:66ch}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:#fff;padding:8px 12px}
/* En-tête */
header.top{position:sticky;top:0;z-index:40;background:rgba(246,245,242,.96);border-bottom:1px solid var(--trait);backdrop-filter:saturate(1.2)}
.bar{display:flex;align-items:center;gap:18px;min-height:66px}
.brand{display:flex;flex-direction:column;line-height:1.05;text-decoration:none;color:var(--schiste);flex:0 0 auto}
.brand b{font:600 18px/1.1 var(--titre);letter-spacing:-.01em}
.brand span{font:500 12px/1.3 var(--titre);color:var(--texte-2);letter-spacing:.02em;white-space:nowrap}
nav.menu{flex:1;min-width:0}
nav.menu ul{display:flex;gap:2px;list-style:none;margin:0;padding:0;justify-content:center}
nav.menu a{display:block;padding:9px 11px;border-radius:4px;text-decoration:none;color:var(--schiste);font:500 15px/1.2 var(--titre);white-space:nowrap}
nav.menu a:hover{background:var(--chene-c)}
nav.menu a[aria-current=page]{color:var(--fauteuil-f);box-shadow:inset 0 -2px 0 var(--fauteuil)}
nav.menu a.adv-link{color:var(--fauteuil-f)}
.tools{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.lang{font:500 14px var(--titre);color:var(--schiste);background:#fff;border:1.5px solid var(--schiste-3);border-radius:4px;padding:7px 30px 7px 10px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--schiste) 50%),linear-gradient(135deg,var(--schiste) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:9px;font:600 15px/1 var(--titre);padding:13px 18px;border-radius:4px;border:1.5px solid transparent;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.btn-main{background:var(--fauteuil);color:#fff}.btn-main:hover{background:var(--fauteuil-f);color:#fff}
.btn-line{border-color:var(--schiste);color:var(--schiste);background:transparent}.btn-line:hover{background:var(--schiste);color:#fff}
.btn-light{background:#fff;color:var(--schiste);border-color:var(--trait)}.btn-light:hover{border-color:var(--schiste)}
.btn:active{transform:translateY(1px)}
.top .btn-main{padding:11px 14px}
/* Pages */
main{min-height:60vh}
.page{display:none}.page.on{display:block;animation:entre .45s ease both}
@keyframes entre{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{padding:clamp(64px,9vw,120px) 0}
.lead{font-size:19px;color:var(--texte-2);max-width:60ch}
/* Héros : la plaque */
.hero{position:relative;padding:0;background:var(--schiste)}
.hero-photo{position:relative;height:min(78vh,720px);min-height:520px;overflow:hidden}
.hero-photo>img{width:100%;height:100%;object-fit:cover;object-position:50% 55%}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(43,36,40,.72) 0%,rgba(43,36,40,.35) 50%,rgba(43,36,40,.05) 100%)}
.hero-in{position:absolute;inset:0;display:flex;align-items:center;z-index:2}
.plaque{--lux:30%;background:linear-gradient(115deg,rgba(255,255,255,0) calc(var(--lux) - 18%),rgba(255,255,255,.32) var(--lux),rgba(255,255,255,0) calc(var(--lux) + 18%)),repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px,rgba(255,255,255,0) 2px 3px),linear-gradient(180deg,#d9d2c4,#bfb5a3 55%,#cbc2b1);color:#3a3128;border-radius:3px;padding:30px 34px 26px;width:min(520px,100%);box-shadow:0 1px 0 #fff inset,0 -1px 0 rgba(0,0,0,.08) inset,0 24px 50px -20px rgba(0,0,0,.55);position:relative}
.plaque::before,.plaque::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b9b2ac 60%,#8d857f);top:12px;left:12px}
.plaque::after{left:auto;right:12px}
.plaque .vis2{position:absolute;bottom:12px;left:12px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b9b2ac 60%,#8d857f)}
.plaque .vis3{position:absolute;bottom:12px;right:12px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b9b2ac 60%,#8d857f)}
.plaque .names{font:600 clamp(19px,2.2vw,24px)/1.25 var(--titre);letter-spacing:.01em;display:block;padding-bottom:10px;border-bottom:1.5px solid var(--schiste)}
.plaque .names{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;border-bottom-color:rgba(58,49,40,.55)!important}.plaque .names span{display:block;text-shadow:0 1px 0 rgba(255,255,255,.55),0 -1px 0 rgba(0,0,0,.25)}.plaque .names em{display:block;font:500 11.5px/1.3 var(--corps);font-style:normal;color:#5d5246;text-shadow:none;margin-top:2px}
.plaque .role{font:600 12.5px/1.3 var(--titre);letter-spacing:.16em;text-transform:uppercase;color:#4b4137;margin:10px 0 4px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.plaque .meta{font:400 13.5px/1.5 var(--corps);color:#4b4137}
.hero-copy{margin-top:22px;color:#fff;max-width:560px}
.hero-copy h1{color:#fff;font-size:clamp(34px,4.6vw,58px);line-height:1.02;font-weight:600}
.hero-copy p{font-size:18.5px;color:rgba(255,255,255,.92);margin-top:14px;text-shadow:0 1px 12px rgba(0,0,0,.3)}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.visages{display:inline-flex;align-items:center;gap:12px;margin-top:20px;color:#fff;text-decoration:none;font:600 15px var(--titre)}.visages .vs{display:flex}.visages img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 18%;border:2px solid rgba(255,255,255,.85);margin-left:-10px}.visages img:first-child{margin-left:0}.visages:hover span:last-child{text-decoration:underline}
.statut{background:var(--blanc);border-bottom:1px solid var(--trait)}
.statut .wrap{display:flex;flex-wrap:wrap;gap:12px 34px;align-items:center;padding:18px 0;font-size:15.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--schiste-3);margin-right:8px;vertical-align:1px}
.dot.ok{background:var(--fauteuil);box-shadow:0 0 0 4px var(--fauteuil-c)}
.statut b{font-family:var(--titre)}.statut .urg{color:#8a2f2a;font-weight:700}
.statut .sep{color:var(--texte-2)}
/* L'arcade (geste signature) */
.arcade{background:var(--blanc)}
.arc-col{display:flex;flex-direction:column;gap:16px}.arc-grid{display:grid;grid-template-columns:minmax(280px,400px) 1fr;gap:clamp(24px,4vw,56px);align-items:start;margin-top:34px}
.sits{display:flex;flex-direction:column;gap:6px}

.sit{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;border:1px solid var(--trait);border-radius:4px;font:500 16px/1.3 var(--titre);color:var(--schiste);display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--chaux);transition:border-color .2s,background .2s}
.sit::after{content:"";width:8px;height:8px;border-right:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(45deg);flex:0 0 auto;opacity:.5}
.sit:hover{border-color:var(--schiste-3);background:#fff}
.sit[aria-pressed=true]{border-color:var(--fauteuil);background:var(--fauteuil-c);color:var(--fauteuil-f)}
.sit:focus-visible{outline:2px solid var(--fauteuil);outline-offset:2px}
.arc-stage{position:relative}
.arc-svg{width:100%;height:auto;display:block;touch-action:manipulation}
.arc-svg .strate{fill:none;stroke-linecap:round;stroke-linejoin:round}
.arc-svg .dent{cursor:pointer;transition:fill .25s,stroke .25s;fill:#fff;stroke:var(--schiste-2);stroke-width:1.5;stroke-linejoin:round}
.arc-svg .dent:hover,.arc-svg .dent:focus{fill:var(--chene-c);outline:none}
.arc-svg .dent.lit{fill:var(--fauteuil-c);stroke:var(--fauteuil)}
.arc-svg .dent.sel{fill:var(--fauteuil);stroke:var(--fauteuil-f)}
.arc-svg .num{font:600 10.5px var(--titre);fill:var(--schiste-3);pointer-events:none;font-variant-numeric:tabular-nums}
.arc-svg .lbl{font:600 12px var(--titre);fill:var(--chene-f);letter-spacing:.14em}
.verdict{background:var(--chaux);padding:18px 20px;border-radius:6px;border-top:1px solid var(--trait)}
.verdict h4{font:600 20px/1.2 var(--titre)}
.verdict .k{font:600 14px var(--titre);color:var(--texte-2);margin:12px 0 6px;display:block}
.verdict p{margin:.4em 0}
.verdict .act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.whos{display:flex;flex-wrap:wrap;gap:8px}
.who{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--trait);border-radius:30px;padding:4px 12px 4px 4px;font:500 14px var(--titre);color:var(--schiste);text-decoration:none}
.who img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 20%}
/* Soins : le registre */
.registre{margin-top:30px;border-top:1.5px solid var(--schiste)}
.reg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) 44px;gap:24px;align-items:center;padding:22px 4px;border-bottom:1px solid var(--trait);text-decoration:none;color:inherit;position:relative;transition:background .25s,padding .25s}
.reg:hover{background:#fff;padding-left:16px}
.reg h3{font-size:clamp(22px,2.4vw,30px)}
.reg small{display:block;font:400 15px var(--corps);color:var(--chene-f);margin-top:4px}
.reg p{margin:0;color:var(--texte-2)}
.reg .fl{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--schiste);display:grid;place-items:center;transition:background .2s}
.reg:hover .fl{background:var(--schiste);color:#fff}
.reg .fl svg{width:16px;height:16px}
/* Équipe : contre le mur */
.mur{background:linear-gradient(rgba(43,36,40,.86),rgba(43,36,40,.92)),url(img/lieu4.jpg) center/cover;color:#efe9ea}
.mur h2,.mur h3{color:#fff}
.mur .lead{color:#d6cdd1}
.praticiens{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px}
.prat{position:relative;border-radius:4px;overflow:hidden;background:#2a2327;text-decoration:none;color:#fff}
.prat img{aspect-ratio:3/4;width:100%;object-fit:cover;object-position:50% 18%;transition:transform .6s ease}
.prat:hover img{transform:scale(1.03)}
.prat .cap{padding:14px 14px 16px}
.prat .cap b{font:600 18px/1.2 var(--titre);display:block}
.prat .cap span{font-size:14px;color:#cfc5c9}.prat a{overflow-wrap:anywhere}
.equipe-s{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
.ass{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:4px;padding:10px}
.ass img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.ass b{font:600 16px var(--titre);color:#fff;display:block}.ass span{font-size:14px;color:#cfc5c9}
.mur .btn-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}.mur .btn-light:hover{background:#fff;color:var(--schiste)}
/* Galerie */
.galerie{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:90px;gap:10px;margin-top:30px}
.galerie figure{margin:0;overflow:hidden;border-radius:3px;background:#ddd}
.galerie img{width:100%;height:100%;object-fit:cover}
.g1{grid-column:span 5;grid-row:span 5}.g2{grid-column:span 7;grid-row:span 3}.g3{grid-column:span 4;grid-row:span 2}.g4{grid-column:span 3;grid-row:span 2}.g5{grid-column:span 6;grid-row:span 4}.g6{grid-column:span 6;grid-row:span 4}.g7{grid-column:span 4;grid-row:span 3}.g8{grid-column:span 4;grid-row:span 3}.g9{grid-column:span 4;grid-row:span 3}.g10{grid-column:span 12;grid-row:span 4}
.bande{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-top:28px}
.bande img{height:300px;width:auto;border-radius:3px;scroll-snap-align:start;flex:0 0 auto}
/* RDV */
.rdv-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,60px);margin-top:30px;align-items:start}
.regle{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--trait)}
.regle .n{width:9px;height:9px;border-radius:50%;background:var(--fauteuil);flex:0 0 auto;margin-top:8px}
.mails{list-style:none;margin:16px 0 0;padding:0}
.mails li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--trait);font-size:15.5px}
.mails b{font-family:var(--titre);font-weight:600}
form.demande{background:#fff;border:1px solid var(--trait);border-radius:6px;padding:24px;box-shadow:var(--ombre)}
form.demande h3{margin-bottom:6px}
form.demande .note{font-size:14px;color:var(--texte-2)}
.champ{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.champ label{font:600 14px var(--titre);color:var(--schiste)}
.champ input,.champ select,.champ textarea{font:inherit;font-size:16px;color:var(--texte);border:1.5px solid #cfc9c4;border-radius:4px;padding:11px 12px;background:#fff;width:100%}
.champ input:focus,.champ select:focus,.champ textarea:focus{border-color:var(--fauteuil);outline:none;box-shadow:0 0 0 3px var(--fauteuil-c)}
.champ textarea{min-height:84px;resize:vertical}
.msg{font-size:14.5px;margin-top:12px;min-height:1.4em}.copie{white-space:pre-wrap;background:var(--chaux);border:1px solid var(--trait);border-radius:4px;padding:10px;font:14px/1.5 var(--corps);color:var(--texte);margin:10px 0}#arcade{scroll-margin-top:80px}.msg.err{color:#a3332e}.msg.ok{color:var(--fauteuil-f)}
/* Contact */
.horaires{width:100%;border-collapse:collapse;margin-top:10px;font-size:16px}
.horaires td{padding:9px 0;border-bottom:1px solid var(--trait)}
.horaires td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.horaires tr.auj td{color:var(--fauteuil-f);font-weight:700}
.cartes{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1.5px solid var(--schiste);margin-top:30px}
.cartes>div{padding:22px 20px 22px 0;border-bottom:1px solid var(--trait)}
.cartes .k{font:500 11.5px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:6px}
.cartes .v{font:600 20px/1.35 var(--titre);color:var(--schiste)}
/* Page soin */
.soin-head{background:var(--blanc);padding:clamp(48px,7vw,90px) 0 40px;border-bottom:1px solid var(--trait)}
.fil{font:500 13px var(--num);color:var(--texte-2);margin-bottom:18px}
.fil a{color:var(--texte-2)}
.soin-head h1{font-size:clamp(38px,5.4vw,68px);line-height:1}
.soin-head .lead{margin-top:16px}
.soin-body{display:grid;grid-template-columns:240px 1fr;gap:clamp(24px,5vw,70px);padding:50px 0 90px}
.sommaire{position:sticky;top:96px;align-self:start}
.sommaire span{font:500 11.5px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);display:block;margin-bottom:10px}
.sommaire a{display:block;padding:7px 0 7px 12px;border-left:1.5px solid var(--trait);color:var(--schiste);text-decoration:none;font:500 15px/1.3 var(--titre)}
.sommaire a:hover{border-color:var(--chene)}
.bloc{padding:0 0 34px;margin-bottom:34px;border-bottom:1px solid var(--trait);scroll-margin-top:100px}
.bloc:last-child{border:0}
.bloc h2{font-size:clamp(26px,3vw,36px)}
.bloc .sub{font:500 17px var(--titre);color:var(--chene-f);margin:6px 0 14px;display:block}
.bloc figure{margin:20px 0 0;background:#fff;border:1px solid var(--trait);border-radius:4px;padding:12px}
.soin-img{margin-top:28px;border-radius:4px;overflow:hidden;background:#fff;border:1px solid var(--trait);max-width:860px}
.soin-img img{width:100%;max-height:340px;object-fit:contain;filter:grayscale(1) sepia(.35) hue-rotate(270deg) saturate(.55) contrast(1.05)}.bloc figure img{filter:grayscale(1) sepia(.35) hue-rotate(270deg) saturate(.55) contrast(1.05)}
.soin-img.photo img{object-fit:cover;max-height:380px;filter:none}
.pour{background:var(--fauteuil-c);border-radius:4px;padding:16px 18px;margin-top:18px;display:flex;gap:14px;align-items:center;max-width:720px}
.pour img{width:58px;height:58px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.note-ajout{font-size:14.5px;color:var(--texte-2);border:1px dashed var(--chene);border-radius:4px;padding:12px 14px;margin-top:18px;max-width:720px;background:#fffaf2}
.suite{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
/* Pied */
footer{background:var(--schiste);color:#d8cfd3;padding:46px 0 96px;font-size:15px}
footer .wrap{display:flex;flex-direction:column;gap:26px}.foot{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;line-height:1.7}.foot b{font-family:var(--titre);color:#fff}.foot small{color:#a99ea4;font-size:13px;line-height:1.4;display:block;margin-top:6px}@media(max-width:820px){.foot{grid-template-columns:1fr}}
footer a{color:#fff}
footer .np{font:500 13px var(--titre);color:#a99ea4;border-top:1px solid rgba(255,255,255,.12);padding-top:16px}
/* Conseiller */
.cons-btn{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:10px;background:var(--schiste);color:#fff;border:0;border-radius:40px;padding:8px 18px 8px 8px;cursor:pointer;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);text-align:left}
.cons-btn .av{width:40px;height:40px;border-radius:50%;background:var(--fauteuil);display:grid;place-items:center;flex:0 0 auto}
.cons-btn .av svg{width:22px;height:22px}
.cons-btn b{font:600 15px/1.1 var(--titre);display:block}.cons-btn small{font-size:12.5px;color:#d9d0d4}
.invite{position:fixed;right:18px;bottom:86px;z-index:60;background:#fff;border:1px solid var(--trait);border-radius:8px;padding:14px 38px 14px 16px;max-width:290px;box-shadow:var(--ombre);font-size:15px;display:none}
.invite.on{display:block;animation:entre .4s ease both}
.invite button{position:absolute;top:6px;right:6px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--texte-2);width:28px;height:28px}
.chat{position:fixed;right:18px;bottom:18px;z-index:70;width:min(390px,calc(100vw - 24px));height:min(600px,calc(100vh - 100px));background:#fff;border-radius:10px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden;border:1px solid var(--trait)}
.chat.on{display:flex;animation:entre .3s ease both}
.chat-h{background:var(--schiste);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chat-h b{font:600 16px var(--titre);display:block}.chat-h small{font-size:12.5px;color:#d9d0d4}
.chat-h button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;width:34px;height:34px}
.chat-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--chaux)}
.bul{max-width:88%;padding:10px 13px;border-radius:10px;font-size:15px;line-height:1.5}
.bul.bot{background:#fff;border:1px solid var(--trait);align-self:flex-start;border-bottom-left-radius:2px}
.bul.moi{background:var(--fauteuil);color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.bul .tag{display:inline-block;font:500 10.5px var(--num);letter-spacing:.1em;text-transform:uppercase;color:var(--fauteuil-f);background:var(--fauteuil-c);padding:2px 6px;border-radius:3px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--trait);background:#fff}
.chips button{font:500 13.5px var(--titre);border:1px solid var(--trait);background:var(--chaux);color:var(--schiste);border-radius:20px;padding:6px 10px;cursor:pointer}
.chips button:hover{border-color:var(--fauteuil);color:var(--fauteuil-f)}
.chat-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--trait);background:#fff}
.chat-f input{flex:1;font:inherit;font-size:16px;border:1.5px solid #cfc9c4;border-radius:4px;padding:9px 10px;min-width:0}
.chat-f button{background:var(--fauteuil);color:#fff;border:0;border-radius:4px;padding:0 14px;font:600 14px var(--titre);cursor:pointer}
/* Mobile d'abord : barre d'appel */
.appel-mob{display:none}
@media (max-width:1100px){
 .bar{flex-wrap:wrap;gap:8px 14px;padding-top:10px}
 nav.menu{order:3;flex:1 0 100%;position:relative;margin:0 -20px;padding:0 20px}
 nav.menu ul{justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
 nav.menu ul::-webkit-scrollbar{display:none}
 .tools{margin-left:auto}
 .praticiens{grid-template-columns:repeat(2,1fr)}
 .equipe-s{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
 .arc-grid,.rdv-grid{grid-template-columns:1fr}
 .sits{flex-direction:row;flex-wrap:wrap}.sits h3{flex:1 0 100%}.sit{flex:1 1 calc(50% - 6px);font-size:14.5px;padding:10px 12px}
 .reg{grid-template-columns:1fr 40px;gap:8px 14px}.reg p{grid-column:1/2;grid-row:2}.reg .fl{grid-row:1/3;grid-column:2}
 .soin-body{grid-template-columns:1fr}.sommaire{position:static;display:none}
 .cartes{grid-template-columns:1fr}
 .galerie{grid-auto-rows:60px}
 .g1,.g2,.g5,.g6,.g10{grid-column:span 12}.g3,.g4,.g7,.g8,.g9{grid-column:span 6}
}
@media (max-width:620px){
 body{font-size:16.5px}
 .wrap{width:calc(100% - 32px)}
 .top .btn-main .t{display:none}.top .btn-main{padding:10px 11px}
 .brand{flex:1 1 0;min-width:0}.tools{gap:6px}.brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{font-size:9.5px}.lang{padding:7px 26px 7px 8px;font-size:13px}
 nav.menu{margin:0 -16px;padding:0 16px}nav.menu a{padding:12px 11px}
 footer{padding-bottom:150px}
 .hero-photo{height:auto;min-height:0}
 .hero-photo>img{position:absolute;inset:0}
 .hero-in{position:relative;padding:28px 0 34px}
 .hero-photo::after{background:linear-gradient(180deg,rgba(43,36,40,.35),rgba(43,36,40,.78))}
 .plaque{padding:24px 22px 20px}
 .hero-cta .btn{flex:1 1 100%;justify-content:center}
 .praticiens{gap:10px}.prat .cap b{font-size:15.5px}.prat .cap span{font-size:13px}
 .equipe-s{grid-template-columns:1fr}
 .praticiens.full{grid-template-columns:1fr}.praticiens.full .prat img{aspect-ratio:4/3}
 .appel-mob{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;border-top:1px solid var(--trait);padding:8px 10px;gap:8px}
 .appel-mob .btn{flex:1;justify-content:center;padding:12px 8px;font-size:14.5px}

 {k:"casse",l:"Une dent cassée ou très abîmée",s:"proth",w:["franco","minard","wicks"],t:"Inlay, onlay, overlay ou couronne : tout dépend de ce qui reste de la dent."},
 {k:"carie",l:"Une carie, une tache, un contrôle",s:"cons",w:["franco","minard","wicks"],t:"Une carie au début ne fait pas mal : un contrôle régulier la repère tôt."},
 {k:"esth",l:"La forme ou la teinte de mes dents de devant",s:"esth",w:["franco","minard","wicks"],t:"Les facettes en céramique corrigent forme et teinte en abîmant le moins possible la dent."}

soins:{
 cons:{n:"Soins conservateurs",s:"Caries et petites pertes de substance",lead:"Soigner une carie tant qu'elle est petite, et surtout l'empêcher d'arriver.",img:"xray",b:[
  {h:"La carie",sub:"Une maladie lente et silencieuse",p:["Les bactéries de la bouche transforment les sucres en acides. Ces acides déminéralisent l'émail et creusent la dent, petit à petit.","Au début, une carie ne fait pas mal : c'est pour cela que les contrôles réguliers comptent. Quand elle devient profonde, elle enflamme le nerf de la dent et la douleur arrive : c'est la pulpite."]},
  {h:"La prévenir",sub:"Hygiène et alimentation, les deux ensemble",p:["L'hygiène : deux brossages de 3 minutes, matin et soir, dents et gencives, avec un dentifrice fluoré. Le soir, des brossettes (ou du fil) entre chaque dent : ces zones sont les premières touchées.","L'alimentation : des repas à heures fixes, rien d'autre que de l'eau entre les repas, peu d'acide et de sucre, pas de grignotage. Chaque prise relance le travail des bactéries : voilà pourquoi on peut avoir des caries malgré un bon brossage."]},
  {h:"Le soin",sub:"Nettoyer, puis combler",p:["Pour une carie légère ou modérée, on la nettoie entièrement, puis on comble avec une résine, un amalgame ou un ciment verre ionomère.","Si la carie est trop importante, la dent demande un soin prothétique. Votre praticien choisit selon la taille de la carie et votre propre risque carieux."]}
 ]},
 endo:{n:"Endodontie",s:"L'intérieur de la dent",lead:"Désinfecter et nettoyer l'intérieur d'une dent contaminée, puis la refermer de façon étanche.",img:"endo",who:"libeau",b:[
  {h:"Traitement endodontique initial",sub:"Dent vivante ou nécrosée",p:["Par une carie profonde ou un choc, les bactéries atteignent la pulpe. Elle s'enflamme et fait très mal : c'est la pulpite, la « rage de dent ».","Pulpe atteinte en profondeur : on retire tout le tissu pulpaire et on désinfecte les canaux, pour supprimer la douleur et éviter une infection.","Atteinte plus légère : on peut garder la dent vivante grâce à des biomatériaux (coiffage direct, pulpotomie partielle ou totale). Le choix se fait à l'examen clinique.","Plus rare : après un choc, la pulpe peut mourir d'elle-même (nécrose) et la dent s'infecter. Seul le traitement endodontique initial est alors possible."]},
  {h:"Retraitement endodontique",sub:"Dent déjà dévitalisée",p:["Avec le temps, l'ancienne restauration peut perdre son étanchéité. Les bactéries de la salive recontaminent alors la dent : risque d'infection, parfois des douleurs.","Si la dent est conservable, on retire l'ancien traitement, on désinfecte, on refait le traitement et on referme les canaux sous une nouvelle restauration."]},
  {h:"Chirurgie endodontique",sub:"Granulome au bout de la racine",p:["Parfois, un granulome à l'apex ne peut pas être traité en passant par la couronne de la dent.","Cette chirurgie peu invasive passe directement par l'apex, par un petit volet dans l'os : on retire le granulome, puis on désinfecte le canal par cet accès."],img:"chir"}
 ]},
 proth:{n:"Soins prothétiques",s:"Les dents très abîmées",lead:"Quand un simple soin ne suffit plus, on restaure la dent par une pièce faite pour elle. Votre praticien vous dit laquelle convient.",img:"xray",b:[
  {h:"Facette",sub:"Sur les dents de devant",p:["De fines pellicules de céramique collées sur une incisive ou une canine. Elles changent la forme ou la teinte de la dent en l'abîmant le moins possible."]},
  {h:"Inlay, onlay, overlay",sub:"Restaurer une partie de la dent",p:["Pour une prémolaire ou une molaire trop abîmée pour un soin : une pièce en céramique, ajustée à la partie manquante, que l'on vient coller.","Inlay pour un défaut modéré, onlay pour un défaut plus important, overlay quand la pièce recouvre une grande partie de la dent, presque comme une couronne."]},
  {h:"Couronne dentaire",sub:"Délabrement important",p:["Dent très abîmée, fêlée ou déjà lourdement restaurée : on restaure toute sa partie visible.","La couronne, une sorte de coiffe (plusieurs matériaux possibles), recouvre ce qui reste de la dent. Elle s'appuie dessus, ou sur une reconstitution faite par le dentiste (résine ou inlay-core)."]}
 ]},
 esth:{n:"Esthétique & éclaircissement",s:"La forme et la teinte du sourire",lead:"Retoucher la forme ou la teinte des dents de devant, en gardant le plus possible la dent naturelle.",img:"lieu2",b:[
  {h:"Facettes en céramique",sub:"Incisives et canines",p:["De fines pellicules de céramique collées sur la dent. Elles changent la forme ou la teinte en l'abîmant le moins possible."]}
 ]},
 impl:{n:"Implantologie",s:"Remplacer une dent perdue",lead:"Une racine artificielle, l'implant, remplace la dent perdue. C'est une vis en titane.",img:"implant",who:"franco",b:[
  {h:"Deux temps",sub:"Poser, attendre, couronner",p:["D'abord, on pose l'implant dans l'os qui portait la dent manquante. L'os cicatrise autour : c'est l'ostéointégration, qui dure 3 à 4 mois.","Ensuite, l'implant intégré, on prend les empreintes et on pose la couronne sur implant, qui remplace la dent."]},
  {h:"Greffe osseuse",sub:"Quand l'os manque",p:["Si l'os n'est pas assez épais, une greffe peut en augmenter le volume pour poser l'implant dans de bonnes conditions.","Il faut alors compter un délai de cicatrisation en plus. Votre praticien vous dit si c'est nécessaire et vous en explique chaque étape."]}
 ]},
 paro:{n:"Parodontologie",s:"Gencives, os et ligament",lead:"Tout ce qui tient la dent : la gencive, l'os qui l'entoure et le ligament qui l'attache.",img:"lieu5",b:[
  {h:"La gingivite",sub:"Le premier stade",p:["La gencive rougit, gonfle et saigne au brossage, ou toute seule.","Elle est en général réversible : un détartrage régulier et un brossage rigoureux, 3 minutes matin et soir, dents et gencives, brossettes le soir."]},
  {h:"La parodontite",sub:"Quand la gingivite s'installe",p:["Brossage insuffisant, tabac, diabète… Le tartre et les bactéries colonisent les racines, la gencive s'enflamme et l'os commence à se détruire.","Elle avance sans grosse douleur. La gencive se rétracte et la racine apparaît : c'est le « déchaussement ». Le froid devient sensible, les dents bougent, et aux stades extrêmes elles tombent ou doivent être retirées."]},
  {h:"La prévention",sub:"Le geste le plus important",p:["Brossage de 3 minutes matin et soir, idéalement avec une brosse électrique sonique, et brossettes entre chaque dent le soir.","Les bains de bouche ne sont pas conseillés sans ordonnance : ils agissent peu sur le tartre déjà installé."]},
  {h:"Le détartrage",sub:"Gingivite ou contrôle régulier",p:["Le premier soin des gencives : il retire le tartre accumulé et empêche la gingivite de devenir parodontite. Il ne remplace pas le brossage.","Selon votre situation : tous les 6 mois, 1 an, 18 mois ou 2 ans. Votre dentiste vous indique le bon rythme."]},
  {h:"Les surfaçages",sub:"Parodontite active",p:["Un détartrage plus profond, avec des instruments très fins, le long des racines. Ce n'est pas une chirurgie, et il se fait parfois même sans anesthésie.","La maladie ne guérit pas totalement : on la stabilise. L'os et la gencive perdus ne reviennent pas, d'où l'intérêt de traiter tôt.","Avant, un bilan parodontal mesure la perte d'os et de gencive, dent par dent. Cette cartographie servira de point de comparaison."]},
  {h:"La maintenance",sub:"Après les surfaçages, à vie",p:["À chaque contrôle, un nouveau bilan parodontal vérifie que la maladie reste stable et montre les zones à surveiller. Votre dentiste vous en donne la fréquence.","Le surfaçage retire les bactéries, mais ne les empêche pas de revenir : seul un brossage efficace évite la récidive."]}
 ]}
},

soins:{
 cons:{n:"Fillings",s:"Cavities and small losses of tooth",lead:"Treat a cavity while it is small, and above all stop it from happening.",img:"xray",b:[
  {h:"The cavity",sub:"A slow, silent disease",p:["Bacteria in the mouth turn sugars into acids. These acids demineralise the enamel and hollow out the tooth, little by little.","At first a cavity doesn't hurt: that is why regular check-ups matter. Once it gets deep, it inflames the nerve and the pain starts: this is pulpitis."]},
  {h:"Preventing it",sub:"Hygiene and diet, together",p:["Hygiene: brush twice a day for 3 minutes, morning and evening, teeth and gums, with fluoride toothpaste. In the evening, use interdental brushes (or floss) between every tooth: these areas are the first to be affected.","Diet: meals at regular times, nothing but water between meals, little acid and sugar, no snacking. Every snack restarts the bacteria's work: that's why you can get cavities despite good brushing."]},
  {h:"The treatment",sub:"Clean, then fill",p:["For a mild or moderate cavity, we clean it out completely, then fill it with resin, amalgam or glass ionomer cement.","If the cavity is too large, the tooth needs prosthetic care. Your dentist decides based on the size of the cavity and your own risk of decay."]}
 ]},
 endo:{n:"Endodontics",s:"Inside the tooth",lead:"Disinfect and clean the inside of an infected tooth, then seal it tight.",img:"endo",who:"libeau",b:[
  {h:"Initial root canal treatment",sub:"Living or necrotic tooth",p:["Through a deep cavity or a knock, bacteria reach the pulp. It becomes inflamed and very painful: this is pulpitis, the classic \"toothache\".","Pulp reached deeply: all the pulp tissue is removed and the canals are disinfected, to stop the pain and prevent infection.","Lighter damage: the tooth can often be kept alive with biomaterials (direct pulp capping, partial or full pulpotomy). The choice is made at the clinical exam.","Rarer: after a knock, the pulp can die on its own (necrosis) and the tooth becomes infected. Only an initial root canal treatment is then possible."]},
  {h:"Root canal retreatment",sub:"Tooth already root-filled",p:["Over time, the old restoration can lose its seal. Bacteria from saliva then re-infect the tooth: risk of infection, sometimes pain.","If the tooth can be saved, the old treatment is removed, the canals are disinfected, the treatment is redone and the canals sealed under a new restoration."]},
  {h:"Endodontic surgery",sub:"Granuloma at the root tip",p:["Sometimes a granuloma at the apex cannot be treated through the crown of the tooth.","This minimally invasive surgery goes straight to the apex through a small window in the bone: the granuloma is removed, then the canal is disinfected from there."],img:"chir"}
 ]},
 proth:{n:"Prosthetic care",s:"Badly damaged teeth",lead:"When a filling is no longer enough, the tooth is restored with a piece made for it. Your dentist tells you which one suits.",img:"xray",b:[
  {h:"Veneer",sub:"On the front teeth",p:["Thin ceramic shells bonded onto an incisor or a canine. They change the shape or shade of the tooth while removing as little of it as possible."]},
  {h:"Inlay, onlay, overlay",sub:"Restoring part of the tooth",p:["For a premolar or molar too damaged for a filling: a ceramic piece, shaped to the missing part, bonded in place.","Inlay for a moderate defect, onlay for a larger one, overlay when the piece covers most of the tooth, almost like a crown."]},
  {h:"Dental crown",sub:"Severe damage",p:["A tooth that is badly broken down, cracked or already heavily restored: the whole visible part is restored.","The crown, a kind of cap (several materials possible), covers what is left of the tooth. It rests on it, or on a core built up by the dentist (resin or cast post-and-core)."]}
 ]},
 esth:{n:"Aesthetics & whitening",s:"The shape and shade of your smile",lead:"Refine the shape or shade of the front teeth while keeping as much natural tooth as possible.",img:"lieu2",b:[
  {h:"Ceramic veneers",sub:"Incisors and canines",p:["Thin ceramic shells bonded onto the tooth. They change its shape or shade while removing as little of it as possible."]}
 ]},
 impl:{n:"Implantology",s:"Replacing a lost tooth",lead:"An artificial root, the implant, replaces the lost tooth. It is a titanium screw.",img:"implant",who:"franco",b:[
  {h:"Two stages",sub:"Place, wait, crown",p:["First, the implant is placed in the bone that held the missing tooth. The bone heals around it: this is osseointegration, which takes 3 to 4 months.","Then, once the implant is integrated, impressions are taken and the implant crown is fitted to replace the tooth."]},
  {h:"Bone graft",sub:"When there isn't enough bone",p:["If the bone is too thin, a graft can increase its volume so the implant can be placed in good conditions.","Extra healing time is then needed. Your dentist tells you whether it is necessary and explains each step."]}
 ]},
 paro:{n:"Periodontics",s:"Gums, bone and ligament",lead:"Everything that holds the tooth: the gum, the bone around it and the ligament that anchors it.",img:"lieu5",b:[
  {h:"Gingivitis",sub:"The first stage",p:["The gum turns red, swells and bleeds when brushing, or on its own.","It is usually reversible: regular scaling and thorough brushing, 3 minutes morning and evening, teeth and gums, interdental brushes in the evening."]},
  {h:"Periodontitis",sub:"When gingivitis settles in",p:["Poor brushing, smoking, diabetes… Tartar and bacteria colonise the roots, the gum becomes more inflamed and the bone starts to break down.","It progresses without much pain. The gum recedes and the root shows: teeth look \"longer\". Cold becomes painful, teeth loosen, and in the most advanced stages they fall out or have to be removed."]},
  {h:"Prevention",sub:"The most important habit",p:["Brush for 3 minutes morning and evening, ideally with a sonic electric toothbrush, and use interdental brushes between every tooth in the evening.","Mouthwashes are not recommended without a prescription: they do little against tartar that is already there."]},
  {h:"Scaling",sub:"Gingivitis or routine check-up",p:["The first gum treatment: it removes built-up tartar and stops gingivitis from turning into periodontitis. It does not replace brushing.","Depending on your situation: every 6 months, 1 year, 18 months or 2 years. Your dentist tells you the right rhythm."]},
  {h:"Root planing",sub:"Active periodontitis",p:["A deeper scaling, with very fine instruments, along the roots. It is not surgery, and it is sometimes even done without anaesthetic.","The disease is never fully cured: it is stabilised. Lost bone and gum do not grow back, which is why early treatment matters.","Beforehand, a periodontal chart measures bone and gum loss, tooth by tooth. This map becomes the point of comparison."]},
  {h:"Maintenance",sub:"After root planing, for life",p:["At each check-up, a new periodontal chart confirms the disease is stable and shows the areas to watch. Your dentist tells you how often.","Root planing removes bacteria but does not stop them coming back: only effective brushing prevents relapse."]}
 ]}
},

soins:{
 cons:{n:"Odontología conservadora",s:"Caries y pequeñas pérdidas de sustancia",lead:"Tratar una caries mientras es pequeña y, sobre todo, evitar que aparezca.",img:"xray",b:[
  {h:"La caries",sub:"Una enfermedad lenta y silenciosa",p:["Las bacterias de la boca transforman los azúcares en ácidos. Estos ácidos desmineralizan el esmalte y van excavando el diente poco a poco.","Al principio la caries no duele: por eso cuentan las revisiones regulares. Cuando es profunda, inflama el nervio del diente y aparece el dolor: es la pulpitis."]},
  {h:"Prevenirla",sub:"Higiene y alimentación, las dos juntas",p:["Higiene: dos cepillados de 3 minutos, mañana y noche, dientes y encías, con pasta fluorada. Por la noche, cepillos interdentales (o hilo) entre cada diente: son las primeras zonas afectadas.","Alimentación: comidas a horas fijas, solo agua entre comidas, poco ácido y poco azúcar, nada de picar. Cada toma reactiva a las bacterias: por eso se pueden tener caries aun cepillándose bien."]},
  {h:"El tratamiento",sub:"Limpiar y rellenar",p:["Para una caries leve o moderada, se limpia por completo y se rellena con resina, amalgama o cemento de ionómero de vidrio.","Si la caries es demasiado grande, el diente necesita un tratamiento protésico. Su dentista decide según el tamaño de la caries y su riesgo de caries."]}
 ]},
 endo:{n:"Endodoncia",s:"El interior del diente",lead:"Desinfectar y limpiar el interior de un diente contaminado y volver a sellarlo de forma hermética.",img:"endo",who:"libeau",b:[
  {h:"Tratamiento de conductos inicial",sub:"Diente vivo o necrótico",p:["Por una caries profunda o un golpe, las bacterias llegan a la pulpa. Se inflama y duele mucho: es la pulpitis, el fuerte dolor de muelas.","Pulpa afectada en profundidad: se retira todo el tejido pulpar y se desinfectan los conductos, para quitar el dolor y evitar una infección.","Afectación más leve: a menudo se puede mantener el diente vivo con biomateriales (recubrimiento directo, pulpotomía parcial o total). Se decide en el examen clínico.","Más raro: tras un golpe, la pulpa puede morir por sí sola (necrosis) y el diente infectarse. Entonces solo es posible el tratamiento de conductos inicial."]},
  {h:"Retratamiento de conductos",sub:"Diente ya endodonciado",p:["Con el tiempo, la antigua restauración puede perder su sellado. Las bacterias de la saliva vuelven a contaminar el diente: riesgo de infección y a veces dolor.","Si el diente se puede conservar, se retira el tratamiento antiguo, se desinfecta, se rehace y se sellan los conductos bajo una nueva restauración."]},
  {h:"Cirugía endodóntica",sub:"Granuloma en la punta de la raíz",p:["A veces un granuloma en el ápice no se puede tratar a través de la corona del diente.","Esta cirugía poco invasiva accede directamente al ápice mediante una pequeña ventana en el hueso: se retira el granuloma y se desinfecta el conducto desde ahí."],img:"chir"}
 ]},
 proth:{n:"Prótesis dental",s:"Dientes muy dañados",lead:"Cuando un empaste ya no basta, el diente se restaura con una pieza hecha a su medida. Su dentista le indica cuál conviene.",img:"xray",b:[
  {h:"Carilla",sub:"En los dientes delanteros",p:["Finas láminas de cerámica adheridas a un incisivo o un canino. Cambian la forma o el color del diente desgastándolo lo mínimo."]},
  {h:"Inlay, onlay, overlay",sub:"Restaurar parte del diente",p:["Para un premolar o un molar demasiado dañado para un empaste: una pieza de cerámica, ajustada a la parte que falta, que se adhiere.","Inlay para un defecto moderado, onlay para uno mayor, overlay cuando la pieza cubre gran parte del diente, casi como una corona."]},
  {h:"Corona dental",sub:"Destrucción importante",p:["Diente muy destruido, fisurado o ya muy restaurado: se restaura toda su parte visible.","La corona, una especie de funda (varios materiales posibles), cubre lo que queda del diente. Se apoya en él, o en una reconstrucción hecha por el dentista (resina o perno-muñón)."]}
 ]},
 esth:{n:"Estética y blanqueamiento",s:"La forma y el color de la sonrisa",lead:"Mejorar la forma o el color de los dientes delanteros conservando al máximo el diente natural.",img:"lieu2",b:[
  {h:"Carillas de cerámica",sub:"Incisivos y caninos",p:["Finas láminas de cerámica adheridas al diente. Cambian su forma o su color desgastándolo lo mínimo."]}
 ]},
 impl:{n:"Implantología",s:"Sustituir un diente perdido",lead:"Una raíz artificial, el implante, sustituye al diente perdido. Es un tornillo de titanio.",img:"implant",who:"franco",b:[
  {h:"Dos tiempos",sub:"Colocar, esperar, coronar",p:["Primero se coloca el implante en el hueso que sostenía el diente. El hueso cicatriza a su alrededor: es la osteointegración, que dura de 3 a 4 meses.","Después, con el implante integrado, se toman impresiones y se coloca la corona sobre implante que sustituye al diente."]},
  {h:"Injerto óseo",sub:"Cuando falta hueso",p:["Si el hueso no es suficiente, un injerto puede aumentar su volumen para colocar el implante en buenas condiciones.","Hay que contar entonces con un tiempo de cicatrización adicional. Su dentista le dice si es necesario y le explica cada paso."]}
 ]},
 paro:{n:"Periodoncia",s:"Encías, hueso y ligamento",lead:"Todo lo que sujeta el diente: la encía, el hueso que lo rodea y el ligamento que lo une.",img:"lieu5",b:[
  {h:"La gingivitis",sub:"La primera fase",p:["La encía se enrojece, se inflama y sangra al cepillarse, o sola.","Suele ser reversible: limpiezas regulares y un cepillado riguroso, 3 minutos mañana y noche, dientes y encías, cepillos interdentales por la noche."]},
  {h:"La periodontitis",sub:"Cuando la gingivitis se instala",p:["Cepillado insuficiente, tabaco, diabetes… El sarro y las bacterias colonizan las raíces, la encía se inflama más y el hueso empieza a destruirse.","Avanza sin apenas dolor. La encía se retrae y la raíz queda a la vista: los dientes «se descarnan». Aparece sensibilidad al frío, los dientes se mueven y, en las fases extremas, se caen o hay que extraerlos."]},
  {h:"La prevención",sub:"El gesto más importante",p:["Cepillado de 3 minutos mañana y noche, idealmente con un cepillo eléctrico sónico, y cepillos interdentales entre cada diente por la noche.","Los colutorios no se aconsejan sin receta: apenas actúan sobre el sarro ya instalado."]},
  {h:"La limpieza dental",sub:"Gingivitis o revisión regular",p:["El primer tratamiento de las encías: retira el sarro acumulado e impide que la gingivitis se convierta en periodontitis. No sustituye al cepillado.","Según su caso: cada 6 meses, 1 año, 18 meses o 2 años. Su dentista le indica el ritmo adecuado."]},
  {h:"Los raspados",sub:"Periodontitis activa",p:["Una limpieza más profunda, con instrumentos muy finos, a lo largo de las raíces. No es una cirugía, y a veces se hace incluso sin anestesia.","La enfermedad no se cura del todo: se estabiliza. El hueso y la encía perdidos no se recuperan; de ahí la importancia de tratarla pronto.","Antes, un periodontograma mide la pérdida de hueso y encía, diente por diente. Ese mapa servirá de punto de comparación."]},
  {h:"El mantenimiento",sub:"Después de los raspados, de por vida",p:["En cada revisión, un nuevo periodontograma comprueba que la enfermedad sigue estable y muestra las zonas que vigilar. Su dentista le indica la frecuencia.","El raspado retira las bacterias, pero no impide que vuelvan: solo un cepillado eficaz evita la recaída."]}
 ]}

soins:{
 cons:{n:"Zahnerhaltung",s:"Karies und kleine Substanzverluste",lead:"Karies behandeln, solange sie klein ist, und vor allem verhindern, dass sie entsteht.",img:"xray",b:[
  {h:"Die Karies",sub:"Eine langsame, stille Krankheit",p:["Bakterien im Mund verwandeln Zucker in Säuren. Diese Säuren entmineralisieren den Zahnschmelz und höhlen den Zahn nach und nach aus.","Anfangs tut Karies nicht weh: Deshalb sind regelmäßige Kontrollen wichtig. Wird sie tief, entzündet sie den Zahnnerv und die Schmerzen beginnen: Das ist die Pulpitis."]},
  {h:"Vorbeugen",sub:"Hygiene und Ernährung, beides zusammen",p:["Hygiene: zweimal täglich 3 Minuten putzen, morgens und abends, Zähne und Zahnfleisch, mit Fluoridzahnpasta. Abends Interdentalbürsten (oder Zahnseide) zwischen allen Zähnen: Diese Stellen sind zuerst betroffen.","Ernährung: feste Essenszeiten, zwischen den Mahlzeiten nur Wasser, wenig Saures und Süßes, kein Naschen. Jede Zwischenmahlzeit setzt die Bakterien wieder in Gang: Darum kann man trotz guten Putzens Karies bekommen."]},
  {h:"Die Behandlung",sub:"Reinigen, dann füllen",p:["Bei leichter oder mittlerer Karies wird sie vollständig entfernt und mit Komposit, Amalgam oder Glasionomerzement gefüllt.","Ist die Karies zu groß, braucht der Zahn eine prothetische Versorgung. Ihr Zahnarzt entscheidet nach Größe der Karies und Ihrem persönlichen Kariesrisiko."]}
 ]},
 endo:{n:"Endodontie",s:"Das Innere des Zahns",lead:"Das Innere eines infizierten Zahns desinfizieren und reinigen, dann dicht verschließen.",img:"endo",who:"libeau",b:[
  {h:"Erste Wurzelbehandlung",sub:"Lebender oder abgestorbener Zahn",p:["Durch tiefe Karies oder einen Unfall gelangen Bakterien in die Pulpa. Sie entzündet sich und schmerzt stark: Das ist die Pulpitis, der klassische Zahnschmerz.","Tief betroffene Pulpa: Das gesamte Pulpagewebe wird entfernt und die Kanäle werden desinfiziert, um den Schmerz zu beenden und eine Infektion zu verhindern.","Leichtere Schädigung: Oft lässt sich der Zahn mit Biomaterialien lebend erhalten (direkte Überkappung, partielle oder vollständige Pulpotomie). Entschieden wird bei der Untersuchung.","Seltener: Nach einem Unfall kann die Pulpa von selbst absterben (Nekrose) und der Zahn sich infizieren. Dann ist nur die erste Wurzelbehandlung möglich."]},
  {h:"Revision der Wurzelbehandlung",sub:"Bereits wurzelbehandelter Zahn",p:["Mit der Zeit kann die alte Füllung undicht werden. Bakterien aus dem Speichel infizieren den Zahn erneut: Infektionsrisiko, manchmal Schmerzen.","Ist der Zahn erhaltungswürdig, wird die alte Behandlung entfernt, desinfiziert, neu behandelt und die Kanäle unter einer neuen Versorgung verschlossen."]},
  {h:"Endodontische Chirurgie",sub:"Granulom an der Wurzelspitze",p:["Manchmal lässt sich ein Granulom an der Wurzelspitze nicht über die Zahnkrone behandeln.","Dieser schonende Eingriff erreicht die Wurzelspitze direkt über ein kleines Knochenfenster: Das Granulom wird entfernt und der Kanal von dort desinfiziert."],img:"chir"}
 ]},
 proth:{n:"Zahnersatz",s:"Stark beschädigte Zähne",lead:"Reicht eine Füllung nicht mehr, wird der Zahn mit einem eigens gefertigten Teil versorgt. Ihr Zahnarzt sagt Ihnen, welches passt.",img:"xray",b:[
  {h:"Veneer",sub:"An den Frontzähnen",p:["Dünne Keramikschalen, auf einen Schneide- oder Eckzahn geklebt. Sie verändern Form oder Farbe des Zahns und schonen ihn so weit wie möglich."]},
  {h:"Inlay, Onlay, Overlay",sub:"Einen Teil des Zahns ersetzen",p:["Für einen Prämolaren oder Molaren, der für eine Füllung zu stark beschädigt ist: ein Keramikteil, passgenau für den fehlenden Teil, das eingeklebt wird.","Inlay bei mittlerem Defekt, Onlay bei größerem, Overlay, wenn das Teil einen Großteil des Zahns bedeckt, fast wie eine Krone."]},
  {h:"Zahnkrone",sub:"Starke Zerstörung",p:["Ein stark zerstörter, angebrochener oder bereits stark versorgter Zahn: Der gesamte sichtbare Teil wird ersetzt.","Die Krone, eine Art Kappe (verschiedene Materialien möglich), umschließt den Restzahn. Sie stützt sich auf ihn oder auf einen Aufbau des Zahnarztes (Komposit oder gegossener Stiftaufbau)."]}
 ]},
 esth:{n:"Ästhetik & Bleaching",s:"Form und Farbe des Lächelns",lead:"Form oder Farbe der Frontzähne verbessern und dabei so viel natürlichen Zahn wie möglich erhalten.",img:"lieu2",b:[
  {h:"Keramik-Veneers",sub:"Schneide- und Eckzähne",p:["Dünne Keramikschalen, auf den Zahn geklebt. Sie verändern Form oder Farbe und schonen den Zahn so weit wie möglich."]}
 ]},
 impl:{n:"Implantologie",s:"Einen verlorenen Zahn ersetzen",lead:"Eine künstliche Wurzel, das Implantat, ersetzt den verlorenen Zahn. Es ist eine Titanschraube.",img:"implant",who:"franco",b:[
  {h:"Zwei Schritte",sub:"Setzen, abwarten, Krone",p:["Zuerst wird das Implantat in den Knochen gesetzt, der den fehlenden Zahn trug. Der Knochen heilt darum herum ein: die Osseointegration, die 3 bis 4 Monate dauert.","Danach, wenn das Implantat eingeheilt ist, werden Abdrücke genommen und die Implantatkrone eingesetzt, die den Zahn ersetzt."]},
  {h:"Knochenaufbau",sub:"Wenn Knochen fehlt",p:["Reicht der Knochen nicht aus, kann ein Aufbau sein Volumen vergrößern, damit das Implantat gut gesetzt werden kann.","Dann kommt eine zusätzliche Heilungszeit hinzu. Ihr Zahnarzt sagt Ihnen, ob das nötig ist, und erklärt jeden Schritt."]}
 ]},
 paro:{n:"Parodontologie",s:"Zahnfleisch, Knochen und Haltefasern",lead:"Alles, was den Zahn hält: das Zahnfleisch, der Knochen darum herum und das Band, das ihn verankert.",img:"lieu5",b:[
  {h:"Die Gingivitis",sub:"Das erste Stadium",p:["Das Zahnfleisch rötet sich, schwillt an und blutet beim Putzen oder von selbst.","Sie ist meist heilbar: regelmäßige Zahnsteinentfernung und gründliches Putzen, 3 Minuten morgens und abends, Zähne und Zahnfleisch, abends Interdentalbürsten."]},
  {h:"Die Parodontitis",sub:"Wenn die Gingivitis bleibt",p:["Zu wenig Putzen, Rauchen, Diabetes… Zahnstein und Bakterien besiedeln die Wurzeln, das Zahnfleisch entzündet sich stärker und der Knochen beginnt sich abzubauen.","Sie verläuft fast ohne Schmerzen. Das Zahnfleisch geht zurück und die Wurzel wird sichtbar. Kälte wird empfindlich, die Zähne lockern sich und fallen im Endstadium aus oder müssen gezogen werden."]},
  {h:"Vorbeugung",sub:"Die wichtigste Gewohnheit",p:["3 Minuten putzen, morgens und abends, am besten mit einer elektrischen Schallzahnbürste, und abends Interdentalbürsten zwischen allen Zähnen.","Mundspülungen sind ohne Verordnung nicht empfohlen: Gegen vorhandenen Zahnstein wirken sie kaum."]},
  {h:"Die Zahnsteinentfernung",sub:"Gingivitis oder regelmäßige Kontrolle",p:["Die erste Behandlung des Zahnfleischs: Sie entfernt Zahnstein und verhindert, dass aus der Gingivitis eine Parodontitis wird. Sie ersetzt das Putzen nicht.","Je nach Situation: alle 6 Monate, 1 Jahr, 18 Monate oder 2 Jahre. Ihr Zahnarzt nennt Ihnen den richtigen Rhythmus."]},
  {h:"Die Wurzelglättung",sub:"Aktive Parodontitis",p:["Eine tiefere Reinigung mit sehr feinen Instrumenten entlang der Wurzeln. Sie ist kein chirurgischer Eingriff und erfolgt manchmal sogar ohne Betäubung.","Die Krankheit heilt nie ganz aus: Sie wird stabilisiert. Verlorener Knochen und verlorenes Zahnfleisch wachsen nicht nach, darum lohnt eine frühe Behandlung.","Vorher misst ein Parodontalstatus den Knochen- und Zahnfleischverlust Zahn für Zahn. Diese Karte dient später als Vergleich."]},
  {h:"Die Nachsorge",sub:"Nach der Wurzelglättung, lebenslang",p:["Bei jeder Kontrolle prüft ein neuer Parodontalstatus, ob die Krankheit stabil bleibt, und zeigt, welche Stellen zu beobachten sind. Ihr Zahnarzt nennt Ihnen die Abstände.","Die Wurzelglättung entfernt die Bakterien, verhindert aber nicht ihre Rückkehr: Nur wirksames Putzen beugt einem Rückfall vor."]}
 ]}
},

 {k:"rage",l:"Un dolore acuto, un forte mal di denti",s:"endo",w:["franco","minard","wicks"],t:"Spesso è una pulpite: la polpa è infiammata. Chiami la segreteria per un appuntamento."},

 {k:"esth",l:"La forma o il colore dei denti davanti",s:"esth",w:["franco","minard","wicks"],t:"Le faccette in ceramica correggono forma e colore intaccando il meno possibile il dente."}
],
soins:{
 cons:{n:"Conservativa",s:"Carie e piccole perdite di sostanza",lead:"Curare una carie finché è piccola e, soprattutto, impedire che arrivi.",img:"xray",b:[
  {h:"La carie",sub:"Una malattia lenta e silenziosa",p:["I batteri della bocca trasformano gli zuccheri in acidi. Questi acidi demineralizzano lo smalto e scavano il dente, poco a poco.","All'inizio la carie non fa male: per questo contano i controlli regolari. Quando diventa profonda, infiamma il nervo del dente e arriva il dolore: è la pulpite."]},
  {h:"Prevenirla",sub:"Igiene e alimentazione, insieme",p:["Igiene: due spazzolamenti di 3 minuti, mattina e sera, denti e gengive, con dentifricio al fluoro. La sera, scovolini (o filo) tra ogni dente: sono le prime zone colpite.","Alimentazione: pasti a orari fissi, solo acqua fuori pasto, poco acido e poco zucchero, niente spuntini. Ogni assunzione riattiva i batteri: ecco perché si possono avere carie anche spazzolando bene."]},
  {h:"La cura",sub:"Pulire, poi otturare",p:["Per una carie lieve o moderata, la si pulisce del tutto e poi si ottura con composito, amalgama o cemento vetroionomerico.","Se la carie è troppo estesa, il dente richiede una cura protesica. Il dentista sceglie in base alla grandezza della carie e al suo rischio di carie."]}
 ]},
 endo:{n:"Endodonzia",s:"L'interno del dente",lead:"Disinfettare e pulire l'interno di un dente contaminato, poi richiuderlo in modo ermetico.",img:"endo",who:"libeau",b:[
  {h:"Trattamento canalare iniziale",sub:"Dente vitale o necrotico",p:["Per una carie profonda o un trauma, i batteri raggiungono la polpa. Si infiamma e fa molto male: è la pulpite, il classico mal di denti.","Polpa colpita in profondità: si rimuove tutto il tessuto pulpare e si disinfettano i canali, per eliminare il dolore ed evitare un'infezione.","Danno più lieve: spesso si può mantenere il dente vitale con biomateriali (incappucciamento diretto, pulpotomia parziale o totale). Si decide alla visita.","Più raro: dopo un trauma, la polpa può morire da sola (necrosi) e il dente infettarsi. Allora è possibile solo il trattamento canalare iniziale."]},
  {h:"Ritrattamento canalare",sub:"Dente già devitalizzato",p:["Col tempo, il vecchio restauro può perdere la sua tenuta. I batteri della saliva ricontaminano il dente: rischio d'infezione, a volte dolore.","Se il dente si può conservare, si rimuove il vecchio trattamento, si disinfetta, lo si rifà e si sigillano i canali sotto un nuovo restauro."]},
  {h:"Chirurgia endodontica",sub:"Granuloma all'apice della radice",p:["A volte un granuloma all'apice non può essere trattato passando dalla corona del dente.","Questa chirurgia poco invasiva raggiunge direttamente l'apice attraverso una piccola finestra nell'osso: si rimuove il granuloma, poi si disinfetta il canale da lì."],img:"chir"}
 ]},
 proth:{n:"Protesi",s:"Denti molto danneggiati",lead:"Quando un'otturazione non basta più, il dente si restaura con un pezzo fatto su misura. Il dentista le dice quale conviene.",img:"xray",b:[
  {h:"Faccetta",sub:"Sui denti anteriori",p:["Sottili lamine di ceramica incollate su un incisivo o un canino. Cambiano forma o colore del dente intaccandolo il meno possibile."]},
  {h:"Inlay, onlay, overlay",sub:"Restaurare una parte del dente",p:["Per un premolare o un molare troppo danneggiato per un'otturazione: un pezzo in ceramica, adattato alla parte mancante, che viene incollato.","Inlay per un difetto moderato, onlay per uno più ampio, overlay quando il pezzo copre gran parte del dente, quasi come una corona."]},
  {h:"Corona dentale",sub:"Distruzione importante",p:["Dente molto distrutto, incrinato o già molto restaurato: si restaura tutta la parte visibile.","La corona, una specie di capsula (diversi materiali possibili), ricopre ciò che resta del dente. Si appoggia su di esso o su una ricostruzione fatta dal dentista (composito o perno moncone)."]}
 ]},
 esth:{n:"Estetica e sbiancamento",s:"La forma e il colore del sorriso",lead:"Migliorare la forma o il colore dei denti anteriori conservando il più possibile il dente naturale.",img:"lieu2",b:[
  {h:"Faccette in ceramica",sub:"Incisivi e canini",p:["Sottili lamine di ceramica incollate sul dente. Ne cambiano forma o colore intaccandolo il meno possibile."]}
 ]},
 impl:{n:"Implantologia",s:"Sostituire un dente perso",lead:"Una radice artificiale, l'impianto, sostituisce il dente perso. È una vite in titanio.",img:"implant",who:"franco",b:[
  {h:"Due tempi",sub:"Inserire, attendere, incoronare",p:["Prima si inserisce l'impianto nell'osso che ospitava il dente mancante. L'osso guarisce intorno: è l'osteointegrazione, che dura da 3 a 4 mesi.","Poi, con l'impianto integrato, si prendono le impronte e si posa la corona su impianto che sostituisce il dente."]},
  {h:"Innesto osseo",sub:"Quando manca osso",p:["Se l'osso non basta, un innesto può aumentarne il volume per inserire l'impianto in buone condizioni.","Serve allora un tempo di guarigione in più. Il dentista le dice se è necessario e le spiega ogni passaggio."]}
 ]},
 paro:{n:"Parodontologia",s:"Gengive, osso e legamento",lead:"Tutto ciò che sostiene il dente: la gengiva, l'osso che lo circonda e il legamento che lo ancora.",img:"lieu5",b:[
  {h:"La gengivite",sub:"Il primo stadio",p:["La gengiva si arrossa, si gonfia e sanguina allo spazzolamento, o da sola.","Di solito è reversibile: detartrasi regolari e uno spazzolamento accurato, 3 minuti mattina e sera, denti e gengive, scovolini la sera."]},
  {h:"La parodontite",sub:"Quando la gengivite si installa",p:["Spazzolamento insufficiente, fumo, diabete… Tartaro e batteri colonizzano le radici, la gengiva si infiamma di più e l'osso comincia a distruggersi.","Avanza quasi senza dolore. La gengiva si ritira e la radice si scopre: i denti «si scalzano». Il freddo dà fastidio, i denti si muovono e, negli stadi estremi, cadono o vanno estratti."]},
  {h:"La prevenzione",sub:"Il gesto più importante",p:["Spazzolamento di 3 minuti mattina e sera, idealmente con uno spazzolino elettrico sonico, e scovolini tra ogni dente la sera.","I colluttori non sono consigliati senza prescrizione: agiscono poco sul tartaro già presente."]},
  {h:"La detartrasi",sub:"Gengivite o controllo regolare",p:["La prima cura delle gengive: rimuove il tartaro accumulato e impedisce alla gengivite di diventare parodontite. Non sostituisce lo spazzolamento.","A seconda del caso: ogni 6 mesi, 1 anno, 18 mesi o 2 anni. Il dentista le indica il ritmo giusto."]},
  {h:"Le levigature radicolari",sub:"Parodontite attiva",p:["Una pulizia più profonda, con strumenti molto fini, lungo le radici. Non è un intervento chirurgico e a volte si fa persino senza anestesia.","La malattia non guarisce del tutto: si stabilizza. Osso e gengiva persi non tornano, da qui l'importanza di curarla presto.","Prima, una cartella parodontale misura la perdita di osso e gengiva, dente per dente. Questa mappa servirà da confronto."]},
  {h:"Il mantenimento",sub:"Dopo le levigature, per sempre",p:["A ogni controllo, una nuova cartella parodontale verifica che la malattia resti stabile e mostra le zone da sorvegliare. Il dentista le indica la frequenza.","La levigatura rimuove i batteri ma non ne impedisce il ritorno: solo uno spazzolamento efficace evita la recidiva."]}
 ]}
},

soins:{
 cons:{n:"牙体保存治疗",s:"龋齿与轻微缺损",lead:"趁龋齿还小时治疗，更重要的是防止它发生。",img:"xray",b:[
  {h:"龋齿",sub:"一种缓慢而无声的疾病",p:["口腔里的细菌把糖分变成酸。这些酸会使牙釉质脱矿，一点点把牙齿蛀空。","早期龋齿不疼：所以定期检查很重要。一旦变深，就会让牙神经发炎，疼痛随之而来：这就是牙髓炎。"]},
  {h:"预防",sub:"卫生和饮食，两者缺一不可",p:["卫生：每天早晚刷牙两次，每次 3 分钟，刷牙齿也刷牙龈，使用含氟牙膏。晚上在每颗牙之间使用牙间刷（或牙线）：这些部位最先受影响。","饮食：按时吃饭，两餐之间只喝水，少吃酸和甜，不吃零食。每次进食都会让细菌重新产酸：这就是为什么即使认真刷牙也可能长龋齿。"]},
  {h:"治疗",sub:"先清理，再充填",p:["轻度或中度龋齿：把龋坏完全清理干净，再用树脂、银汞合金或玻璃离子水门汀充填。","如果龋坏太大，就需要修复治疗。医生会根据龋洞大小和您个人的患龋风险来选择。"]}
 ]},
 endo:{n:"根管治疗",s:"牙齿内部",lead:"对受感染牙齿的内部进行消毒和清理，然后严密封闭。",img:"endo",who:"libeau",b:[
  {h:"初次根管治疗",sub:"活髓牙或坏死牙",p:["由于深龋或外伤，细菌到达牙髓。牙髓发炎，非常疼：这就是牙髓炎，俗称“牙疼得要命”。","牙髓深度受累：去除全部牙髓组织并对根管消毒，以消除疼痛、防止感染。","受累较轻：常可用生物材料保留牙髓活力（直接盖髓、部分或全部牙髓切断术）。在临床检查时决定。","较少见：外伤后牙髓可能自行坏死，牙齿随之感染。此时只能做初次根管治疗。"]},
  {h:"根管再治疗",sub:"已做过根管的牙",p:["随着时间推移，旧的充填可能失去密封性。唾液中的细菌再次感染牙齿：有感染风险，有时会疼。","如果牙齿可以保留，就去除旧的治疗，消毒，重新治疗，并在新的修复体下封闭根管。"]},
  {h:"根尖手术",sub:"根尖肉芽肿",p:["有时根尖的肉芽肿无法从牙冠一侧进行治疗。","这种微创手术通过骨上的一个小窗口直接到达根尖：去除肉芽肿，再从这里对根管消毒。"],img:"chir"}
 ]},
 proth:{n:"修复治疗",s:"严重损坏的牙齿",lead:"当普通补牙已不够时，就用为这颗牙定制的修复体来恢复。医生会告诉您哪种合适。",img:"xray",b:[
  {h:"贴面",sub:"用于前牙",p:["粘贴在切牙或尖牙上的薄陶瓷片。可改变牙齿的形状或颜色，同时尽量少磨牙。"]},
  {h:"嵌体、高嵌体、覆盖体",sub:"修复牙齿的一部分",p:["适用于损坏过大、无法补牙的前磨牙或磨牙：按缺损部分定制的陶瓷件，粘接到位。","缺损中等用嵌体，缺损较大用高嵌体，修复体覆盖牙齿大部分时用覆盖体，接近牙冠。"]},
  {h:"牙冠",sub:"严重缺损",p:["牙齿严重破坏、有裂纹或已有大面积修复：要修复整个可见部分。","牙冠像一顶帽子（可选多种材料），覆盖剩余的牙体。它支撑在剩余牙体上，或支撑在医生制作的核上（树脂或铸造桩核）。"]}
 ]},
 esth:{n:"美学与美白",s:"笑容的形状与颜色",lead:"改善前牙的形状或颜色，同时尽可能保留天然牙。",img:"lieu2",b:[
  {h:"陶瓷贴面",sub:"切牙和尖牙",p:["粘贴在牙齿上的薄陶瓷片。可改变牙齿的形状或颜色，同时尽量少磨牙。"]}
 ]},
 impl:{n:"种植牙",s:"替代缺失的牙齿",lead:"用人工牙根，也就是种植体，来替代缺失的牙齿。它是一颗钛制螺钉。",img:"implant",who:"franco",b:[
  {h:"两个阶段",sub:"植入、等待、戴冠",p:["首先，把种植体植入原来缺失牙所在的骨中。骨在其周围愈合：这就是骨结合，需要 3 到 4 个月。","然后，种植体结合后取模，戴上替代牙齿的种植牙冠。"]},
  {h:"植骨",sub:"骨量不足时",p:["如果骨量不够，可以通过植骨增加骨量，让种植体在良好条件下植入。","这样需要额外的愈合时间。医生会告诉您是否需要，并解释每个步骤。"]}
 ]},
 paro:{n:"牙周病学",s:"牙龈、牙槽骨与牙周膜",lead:"一切支撑牙齿的组织：牙龈、牙齿周围的骨，以及把牙齿固定住的牙周膜。",img:"lieu5",b:[
  {h:"牙龈炎",sub:"第一阶段",p:["牙龈发红、肿胀，刷牙时或自发出血。","通常可以逆转：定期洗牙，认真刷牙，早晚各 3 分钟，牙齿和牙龈都要刷，晚上使用牙间刷。"]},
  {h:"牙周炎",sub:"牙龈炎持续发展",p:["刷牙不够、吸烟、糖尿病……牙石和细菌附着在牙根上，牙龈炎症加重，牙槽骨开始被破坏。","它几乎不痛地进展。牙龈退缩，牙根露出，即所谓“牙齿松动、牙龈萎缩”。牙齿对冷敏感、开始松动，到了晚期会脱落或必须拔除。"]},
  {h:"预防",sub:"最重要的习惯",p:["早晚刷牙各 3 分钟，最好使用声波电动牙刷，晚上在每颗牙之间使用牙间刷。","没有处方不建议使用漱口水：它对已形成的牙石作用很小。"]},
  {h:"洗牙",sub:"牙龈炎或定期检查",p:["牙龈的第一项治疗：去除堆积的牙石，防止牙龈炎发展成牙周炎。它不能代替刷牙。","视情况每 6 个月、1 年、18 个月或 2 年一次。医生会告诉您合适的频率。"]},
  {h:"龈下刮治",sub:"活动期牙周炎",p:["用非常细的器械沿牙根进行更深的清洁。这不是手术，有时甚至无需麻醉。","这种病不能完全治愈，只能使其稳定。失去的骨和牙龈不会再长回来，所以要尽早治疗。","治疗前，牙周检查会逐颗牙测量骨和牙龈的丧失。这张“地图”将作为对比的依据。"]},
  {h:"牙周维护",sub:"刮治之后，终身进行",p:["每次复查都会重新做牙周检查，确认病情稳定，并指出需要留意的部位。医生会告诉您复查频率。","刮治能清除细菌，但不能阻止它们回来：只有有效刷牙才能防止复发。"]}
 ]}

/* ---------- Arcade : les lits de schiste deviennent l'arcade dentaire ---------- */
const TW={1:[22,26],2:[18,24],3:[20,28],4:[21,24],5:[21,24],6:[29,28],7:[27,27],8:[24,25]};
const QUAD={1:{arc:'up',side:-1},2:{arc:'up',side:1},3:{arc:'lo',side:1},4:{arc:'lo',side:-1}};
const SIT_TEETH={rage:[36,46,26,16,37,47],devit:[36,46,16,26],manque:[36,46,15,25],gencive:[31,32,41,42,11,21],casse:[16,26,36,46,15,25,35,45],carie:[17,27,37,47,16,26],esth:[11,12,13,21,22,23]};
const ARC={up:{y0:62,H:148,W:300,dir:1},lo:{y0:458,H:148,W:300,dir:-1}};
function apt(A,u){return [400+u*A.W,A.y0+A.dir*A.H*u*u]}
function anorm(A,u){const dx=A.W,dy=A.dir*2*A.H*u,l=Math.hypot(dx,dy);return [-dy/l*A.dir*-1,dx/l*A.dir*-1]}
function aOut(A,u){/* unit normal pointing outward (away from tongue) */const dx=A.W,dy=A.dir*2*A.H*u,l=Math.hypot(dx,dy);let nx=dy/l,ny=-dx/l;if(A.dir<0){nx=-nx;ny=-ny}return [nx,ny]}
function alen(A){const N=400,L=[0];let p=apt(A,-1);for(let i=1;i<=N;i++){const q=apt(A,-1+2*i/N);L.push(L[i-1]+Math.hypot(q[0]-p[0],q[1]-p[1]));p=q}return L}
function uAt(A,L,d){const N=L.length-1;let i=L.findIndex(v=>v>=d);if(i<=0)return -1;const f=(d-L[i-1])/(L[i]-L[i-1]);return -1+2*(i-1+f)/N}
function teeth(){const out=[];['up','lo'].forEach(k=>{const A=ARC[k],L=alen(A),tot=L[L.length-1];const seq=[8,7,6,5,4,3,2,1,1,2,3,4,5,6,7,8];const gap=3;const raw=seq.reduce((a,i)=>a+TW[i][0]+gap,0);const f=.93*tot/raw;let d=(tot-raw*f)/2;
 seq.forEach((i,j)=>{const w=TW[i][0]*f,hh=TW[i][1]*f*.9;const u=uAt(A,L,d+w/2);d+=w+gap*f;const [x,y]=apt(A,u);const tg=Math.atan2(A.dir*2*A.H*u,A.W)*180/Math.PI;const left=j<8;const q=k==='up'?(left?1:2):(left?4:3);const [nx,ny]=aOut(A,u);out.push({n:q*10+i,i,x,y,ang:tg,nx,ny,q,arc:k,w,hh})})});return out}
const TEETH=teeth();
function toothPath(i,w,h){const a=w/2,b=h/2;
 if(i<=2)return `M${-a} ${-b+5}Q${-a} ${-b} ${-a+5} ${-b}H${a-5}Q${a} ${-b} ${a} ${-b+5}V${b-7}Q${a} ${b} ${a-7} ${b}H${-a+7}Q${-a} ${b} ${-a} ${b-7}Z`;
 if(i===3)return `M0 ${-b}Q${a} ${-b+4} ${a} ${-b+11}V${b-8}Q${a} ${b} ${a-6} ${b}H${-a+6}Q${-a} ${b} ${-a} ${b-8}V${-b+11}Q${-a} ${-b+4} 0 ${-b}Z`;
 if(i<=5)return `M${-a} 0C${-a} ${-b} ${a} ${-b} ${a} 0S${-a} ${b} ${-a} 0Z`.replace(/S.*/,`C${a} ${b} ${-a} ${b} ${-a} 0Z`);
 return `M${-a+6} ${-b}H${a-6}Q${a} ${-b} ${a} ${-b+6}V${b-6}Q${a} ${b} ${a-6} ${b}H${-a+6}Q${-a} ${b} ${-a} ${b-6}V${-b+6}Q${-a} ${-b} ${-a+6} ${-b}Z`}
function strata(){const lines=[];const ys=[70,150,226,300,378,452];ys.forEach((y0,li)=>{const pts=[];for(let j=0;j<=60;j++){const x=40+j*(720/60);const y=y0+Math.sin(j*.55+li*1.7)*4+Math.sin(j*.17+li)*7;pts.push([x,y])}lines.push(pts)});return lines}
function arcTargets(){const offs=[['up',0],['up',38],['up',-36],['lo',-36],['lo',38],['lo',0]];return offs.map(([k,o])=>{const A=ARC[k];const pts=[];for(let j=0;j<=60;j++){const u=-.985+1.97*(j/60);const [x,y]=apt(A,u),[nx,ny]=aOut(A,u);pts.push([x+nx*o,y+ny*o])}return pts})}
const STRA=strata(),TARG=arcTargets();
const COLS=['#C3955A','#5E535A','#8C8288','#8C8288','#5E535A','#C3955A'],SW0=[2.2,1.6,1.4,1.4,1.6,2.2],SW1=[66,1.4,1.2,1.2,1.4,66],OP1=[.2,.55,.45,.45,.55,.2];
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function dPath(p){return 'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')}
function drawArc(t){const svg=document.getElementById('arcSvg');if(!svg)return;const e=ease(t);
 svg.querySelectorAll('.strate').forEach((pth,li)=>{const p=STRA[li].map((s,j)=>{const d=TARG[li][j];return [s[0]+(d[0]-s[0])*e,s[1]+(d[1]-s[1])*e]});pth.setAttribute('d',dPath(p));pth.setAttribute('stroke-width',(SW0[li]+(SW1[li]-SW0[li])*e).toFixed(2));pth.style.opacity=(1+(OP1[li]-1)*e).toFixed(3)});
 svg.querySelectorAll('.dent-g').forEach((g,k)=>{const o=Math.max(0,Math.min(1,(t-.5)*3.2-(Math.abs((k%16)-7.5))*.035));g.style.opacity=o;g.setAttribute('transform',`translate(${g.dataset.x} ${g.dataset.y}) rotate(${g.dataset.a}) scale(${.7+.3*o})`)});
 svg.querySelectorAll('.num,.lbl').forEach(n=>n.style.opacity=Math.max(0,(t-.8)*5))}
function buildArc(){const svg=document.getElementById('arcSvg');if(!svg)return;const u=U();let h='';
 STRA.forEach((p,li)=>{h+=`<path class="strate" d="${dPath(p)}" stroke="${COLS[li]}" stroke-width="${SW0[li]}"/>`});
 h+=`<text class="lbl" x="400" y="170" text-anchor="middle">${esc(u.upper.toUpperCase())}</text><text class="lbl" x="400" y="360" text-anchor="middle">${esc(u.lower.toUpperCase())}</text>`;
 TEETH.forEach(d=>{const w=d.w-2,hh=d.hh;h+=`<g class="dent-g" data-x="${d.x.toFixed(1)}" data-y="${d.y.toFixed(1)}" data-a="${d.ang.toFixed(1)}"><path class="dent" data-n="${d.n}" d="${toothPath(d.i,w,hh)}" tabindex="0" role="button" aria-label="${u.toothWord} ${d.n}"/></g><text class="num" x="${(d.x+d.nx*(d.hh/2+13)).toFixed(1)}" y="${(d.y+d.ny*(d.hh/2+13)+3.5).toFixed(1)}" text-anchor="middle">${d.n}</text>`});
 svg.innerHTML=h;svg.querySelectorAll('.dent').forEach(r=>{const f=()=>pickTooth(+r.dataset.n);r.addEventListener('click',f);r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});
 const red=matchMedia('(prefers-reduced-motion: reduce)').matches;if(red||window.__arcDone){drawArc(1);return}drawArc(0);
 const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){io.disconnect();const t0=performance.now(),D=2400;const step=n=>{const t=Math.min(1,(n-t0)/D);drawArc(t);if(t<1)requestAnimationFrame(step);else window.__arcDone=1};requestAnimationFrame(step)}},{threshold:.35});io.observe(svg)}

 const nn=' '+n.replace(/['’\-?!.,;:]/g,' ');for(const k in K){let s=0;[...new Set(K[k].map(norm))].forEach(x=>{const w=x;if(lang==='zh'||/^[^a-z]/.test(x)?n.includes(x):nn.includes(' '+x))s+=w.length>4?2:1});if(['tarif','urgence','blanch','dispo','weekend','libeau','medical','franco','minard','wicks','secu'].includes(k))s*=1.6;if(k==='medical'||k==='secu')s*=1.5;if(s>sc){sc=s;best=k}}
