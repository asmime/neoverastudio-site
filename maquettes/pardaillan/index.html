<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Le Pardaillan — Proposition Neovera Studio</title>
<meta name="description" content="Le Pardaillan, hôtel*** et restaurant gascon face au plan d'eau de Gondrin (Gers), depuis 1973.">
<link rel="preload" href="fonts/bodoni-moda-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/hero.jpg" as="image">
<style>
@font-face{font-family:"Bodoni Moda";font-weight:400;font-display:swap;src:url(fonts/bodoni-moda-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Bodoni Moda";font-weight:500;font-display:swap;src:url(fonts/bodoni-moda-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Bodoni Moda";font-weight:500;font-display:swap;src:url(fonts/bodoni-moda-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF}
@font-face{font-family:"Bodoni Moda";font-weight:600;font-display:swap;src:url(fonts/bodoni-moda-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:400;font-display:swap;src:url(fonts/work-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:400;font-display:swap;src:url(fonts/work-sans-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF}
@font-face{font-family:"Work Sans";font-weight:500;font-display:swap;src:url(fonts/work-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Work Sans";font-weight:600;font-display:swap;src:url(fonts/work-sans-latin-600-normal.woff2) format("woff2")}
:root{
 --lac:#1D4652;--lac2:#2C6271;--lac-clair:#DCE8EA;--ambre:#B9772A;--ambre-f:#8A5416;--nappe:#F1F4F3;--blanc:#fff;
 --encre:#16191A;--gris:#4A5254;--pierre:#E4DED3;--colombage:#3A2A1F;
 --serif:"Bodoni Moda",Georgia,serif;--sans:"Work Sans",system-ui,sans-serif;
 --r:4px;--ease:cubic-bezier(.16,1,.3,1);--w:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nappe);color:var(--encre);font:400 1.0625rem/1.62 var(--sans);font-variant-numeric:lining-nums}
img{max-width:100%;display:block}
a{color:var(--lac);text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{color:var(--ambre-f)}
::selection{background:var(--lac);color:#fff}
:focus-visible{outline:2px solid var(--ambre);outline-offset:3px;border-radius:2px}
html{scrollbar-color:var(--lac2) var(--pierre)}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-track{background:var(--pierre)}::-webkit-scrollbar-thumb{background:var(--lac2);border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.08;letter-spacing:-.01em;margin:0 0 .5em;text-wrap:balance}
h2{font-size:clamp(2rem,4.2vw,3.4rem)}
h3{font-size:clamp(1.35rem,2vw,1.7rem)}
p{margin:0 0 1em;max-width:66ch;text-wrap:pretty}
.wrap{max-width:var(--w);margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;gap:.55em;font:600 .95rem/1 var(--sans);padding:.95em 1.35em;border-radius:var(--r);border:1px solid var(--lac);background:var(--lac);color:#fff;text-decoration:none;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease)}
.btn:hover{background:var(--lac2);border-color:var(--lac2);color:#fff;transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--lac)}
.btn.ghost:hover{background:var(--lac);color:#fff}
.btn.ambre{background:var(--ambre-f);border-color:var(--ambre-f)}
.btn.ambre:hover{background:var(--colombage);border-color:var(--colombage)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.lien{font-weight:600;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
.lien::after{content:" →"}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* En-tête */
header.top{position:sticky;top:0;z-index:40;background:rgba(241,244,243,.96);border-bottom:1px solid var(--pierre)}
.bar1{display:flex;align-items:center;gap:18px;padding:12px 24px;max-width:1400px;margin:0 auto}
.logo{text-decoration:none;color:var(--encre);display:flex;flex-direction:column;line-height:1}
.logo b{font:500 1.6rem/1 var(--serif);letter-spacing:.01em}
.logo small{font:500 .72rem/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--gris);margin-top:5px}
.bar1 .sp{flex:1}
.tel{font-weight:600;text-decoration:none;color:var(--encre);display:flex;gap:.4em;align-items:center;white-space:nowrap}
.langue{display:flex;align-items:center;gap:6px;border:1px solid var(--lac);border-radius:var(--r);padding:0 4px 0 9px;background:#fff;color:var(--lac)}
.langue select{border:0;background:transparent;font:500 .92rem var(--sans);color:var(--encre);padding:9px 4px;cursor:pointer}
nav.menu{border-top:1px solid var(--pierre);position:relative}
nav.menu ul{list-style:none;margin:0 auto;padding:0 24px;display:flex;gap:4px;max-width:1400px;overflow-x:auto;scrollbar-width:none}
nav.menu ul::-webkit-scrollbar{display:none}
nav.menu a{display:block;padding:12px 12px;white-space:nowrap;text-decoration:none;color:var(--encre);font:500 .95rem var(--sans);border-bottom:2px solid transparent}
nav.menu a:hover{color:var(--lac)}
nav.menu a[aria-current=page]{border-color:var(--ambre);color:var(--lac)}
nav.menu a.conseil{color:var(--ambre-f);font-weight:600}
nav.menu::after{content:"";position:absolute;right:0;top:0;bottom:0;width:42px;background:linear-gradient(90deg,rgba(241,244,243,0),var(--nappe));pointer-events:none}

/* Héros et reflet */
.hero{position:relative;background:var(--lac);color:#fff}
.hero .photo{position:relative;height:min(56vh,560px);min-height:360px;overflow:hidden}
.hero .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 60%}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,25,30,.05) 40%,rgba(10,25,30,.55))}
.hero .titre{position:absolute;left:0;right:0;bottom:0;z-index:2}
.hero h1{font-size:clamp(3rem,11vw,6rem);font-weight:500;margin:0;line-height:.86;letter-spacing:-.02em;padding-bottom:.02em}
.eau{position:relative;overflow:hidden;height:clamp(3rem,9vw,5.6rem);margin-top:-2px}
.reflet{font:500 clamp(3rem,11vw,6rem)/.86 var(--serif);letter-spacing:-.02em;transform:scaleY(-1);transform-origin:50% 50%;margin:0;color:#fff;opacity:.25;filter:url(#onde);white-space:nowrap;-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);mask-image:linear-gradient(180deg,#000 0%,transparent 75%);user-select:none}
.hero .bas{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start;padding:8px 0 56px}
.hero .bas p{font-size:1.2rem;color:#E8F0F1;max-width:34ch}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.hero .btn{background:#fff;color:var(--lac);border-color:#fff}
.hero .btn:hover{background:var(--lac-clair);border-color:var(--lac-clair);color:var(--lac)}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.hero .btn.ghost:hover{background:#fff;color:var(--lac)}
.resa{background:var(--nappe);color:var(--encre);border-radius:6px;padding:22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45)}
.resa h3{font-size:1.3rem;margin-bottom:14px}
.resa .champs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 84px;gap:10px}
label.ch{display:flex;flex-direction:column;gap:5px;font:500 .8rem var(--sans);color:var(--gris);letter-spacing:.02em}
input,select,textarea{min-width:0;font:400 1rem var(--sans);color:var(--encre);border:1px solid #CFC7B9;background:#fff;border-radius:var(--r);padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lac2);outline-offset:0;border-color:var(--lac2)}
input[aria-invalid=true]{border-color:#A3321F}
.err{color:#A3321F;font-size:.86rem;margin:.6em 0 0;min-height:1.2em}
.resa .btn{width:100%;justify-content:center;margin-top:14px;background:var(--lac);color:#fff;border-color:var(--lac)}
.resa .btn:hover{background:var(--lac2);color:#fff}
.hero .resa p.note{font-size:.85rem;color:var(--gris);margin:.8em 0 0;max-width:none}.hero .resa p.err{color:#A3321F;font-size:.86rem;max-width:none}

/* Sections */
section{padding:88px 0}
.portes{display:grid;grid-template-columns:repeat(12,1fr);gap:28px;align-items:start}
.porte{grid-column:span 6}
.porte:nth-child(2){grid-column:8/span 5;padding-top:120px}
.porte figure{margin:0 0 22px;overflow:hidden;border-radius:3px}
.porte img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform 1.2s var(--ease)}
.porte:nth-child(2) img{aspect-ratio:4/5}
.porte:hover img{transform:scale(1.03)}
.ardoise{background:var(--colombage);color:#F3EDE4}
.ardoise .grille{display:grid;grid-template-columns:1fr 1.3fr;gap:56px;align-items:center}
.ardoise h2{color:#fff}
.ardoise p{color:#DDD3C6}
.ardoise .lien{color:#F0C27F}
.plats{list-style:none;margin:0;padding:0}
.plats li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.16)}
.plats b{font:500 1.35rem/1.2 var(--serif);color:#fff}
.plats span.px{font:500 1.2rem var(--serif);color:#F0C27F;font-variant-numeric:tabular-nums}
.plats small{grid-column:1/-1;color:#CFC4B6;font-size:.95rem}
.ardoise .photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.ardoise .photos img{aspect-ratio:1;object-fit:cover;border-radius:3px}
.eaux{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center}
.eaux img{border-radius:3px;aspect-ratio:3/2;object-fit:cover;width:100%}
.labels{border-top:1px solid var(--pierre);border-bottom:1px solid var(--pierre);padding:30px 0}
.labels ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:12px 40px;justify-content:center;align-items:center}
.labels li{font:500 1.05rem var(--serif);color:var(--colombage);display:flex;gap:.5em;align-items:center}
.labels li svg{color:var(--ambre)}
.labels img{height:46px;width:auto}
.servlist{font-size:1rem;line-height:1.9;color:var(--encre)}
.servlist span{white-space:nowrap}
.servlist span+span::before{content:"·";color:var(--ambre);margin:0 .6em}
.mg3{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--lac-clair)}
.duo>div{padding:64px clamp(24px,5vw,72px)}
.duo>div+div{background:#EFE7DA}
.duo img{border-radius:3px;margin-bottom:22px;aspect-ratio:16/9;object-fit:cover;width:100%}
.coord{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.coord div{border-top:2px solid var(--lac);padding-top:16px}
.coord h3{font-size:1.15rem;margin-bottom:.3em}
.coord p{margin:0}

/* Pages */
.tete{padding:64px 0 44px;background:var(--lac);color:#fff}
.tete h1{font-size:clamp(2.6rem,6vw,4.6rem);margin:0;line-height:.86;color:#fff}
.tete .eau{height:clamp(1.8rem,4vw,3rem);margin-bottom:14px}
.tete .reflet{font-size:clamp(2.6rem,6vw,4.6rem)}
.tete p{font-size:1.18rem;color:#DCE7E9}
.tete .btn{background:#fff;color:var(--lac);border-color:#fff}.tete .btn:hover{background:var(--lac-clair);color:var(--lac)}
.tete .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.hero .btn.ambre,.tete .btn.ambre{background:var(--ambre-f);border-color:var(--ambre-f);color:#fff}.hero .btn.ambre:hover,.tete .btn.ambre:hover{background:#6E420F;border-color:#6E420F;color:#fff}
.tete .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.chambres{display:grid;gap:56px}
.chambre{display:grid;grid-template-columns:1.1fr 1fr;gap:44px;align-items:center}
.chambre:nth-child(even) figure{order:2}
.chambre figure{margin:0}
.chambre h2{font-size:clamp(1.6rem,2.4vw,2.2rem)}
.chambre img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:3px}
.prix{font:500 1.5rem var(--serif);color:var(--ambre-f);margin:0 0 .6em}
.prix small{font:400 .9rem var(--sans);color:var(--gris)}
.cap{font:600 .78rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--lac);margin:0 0 .5em}
ul.eq{list-style:none;padding:0;margin:0 0 1.2em;columns:2;column-gap:28px}
ul.eq li{padding:5px 0 5px 22px;position:relative;font-size:.97rem;break-inside:avoid}
ul.eq li::before{content:"";position:absolute;left:2px;top:.95em;width:10px;height:1px;background:var(--ambre)}
table.tarifs{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.tarifs td,table.tarifs th{padding:14px 8px;border-bottom:1px solid var(--pierre);text-align:left;vertical-align:top}
table.tarifs td:last-child,table.tarifs th:last-child{text-align:right;white-space:nowrap;font:500 1.15rem var(--serif);color:var(--ambre-f)}
table.tarifs th{font:600 .8rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.bloc2{display:grid;grid-template-columns:1.3fr 1fr;gap:56px}
.services{display:flex;flex-wrap:wrap;gap:10px}
.services span{border:1px solid var(--pierre);background:#fff;border-radius:999px;padding:8px 14px;font-size:.93rem;display:inline-flex;gap:.45em;align-items:center}
.services svg{color:var(--lac)}
.carte{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.carte h3{border-bottom:2px solid var(--lac);padding-bottom:10px}
.carte ul{list-style:none;margin:0;padding:0}
.carte li{padding:14px 0;border-bottom:1px solid var(--pierre)}
.carte li div{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.carte li b{font:500 1.12rem/1.25 var(--serif)}
.carte li span{font:500 1.05rem var(--serif);color:var(--ambre-f);white-space:nowrap;font-variant-numeric:tabular-nums}
.carte li small{display:block;color:var(--gris);font-size:.92rem;margin-top:4px;line-height:1.45}
.horaires{background:var(--lac);color:#fff;border-radius:6px;padding:28px;align-self:start}
.horaires h3{color:#fff}
.horaires p{color:#E3EDEF}
.horaires a{color:#fff}
.menus{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--pierre);border-radius:4px;background:#fff}
.menus div{padding:22px;border-left:1px solid var(--pierre)}
.menus div:first-child{border-left:0}
.menus b{font:500 1.2rem/1.2 var(--serif);display:block}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:760px}
.form .plein{grid-column:1/-1}
.galerie{columns:3 300px;column-gap:14px}
.galerie button{display:block;width:100%;padding:0;border:0;margin:0 0 14px;cursor:zoom-in;background:none;border-radius:3px;overflow:hidden}
.galerie img{width:100%;transition:transform .8s var(--ease)}
.galerie button:hover img{transform:scale(1.03)}
.visio{position:fixed;inset:0;background:rgba(10,20,24,.92);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
.visio.on{display:flex}
.visio img{max-height:86vh;border-radius:3px}
.visio button{position:absolute;top:16px;right:16px;background:#fff;border:0;border-radius:50%;width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
.lieux{display:grid;grid-template-columns:repeat(2,1fr);gap:48px}
.lieux img{border-radius:3px;aspect-ratio:3/2;object-fit:cover;width:100%;margin-bottom:18px}
ul.puces{padding-left:1.1em;margin:0 0 1em}ul.puces li{margin:.25em 0}
.menugrp{background:#fff;border:1px solid var(--pierre);border-radius:6px;padding:32px}
.menugrp h4{font:600 .8rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--lac);margin:1.4em 0 .5em}
.menugrp p{margin:.2em 0}
.menugrp .ou{color:var(--gris);font-style:normal;font-size:.9rem}
.mentions h3{margin-top:1.4em}

/* Pied */
footer{background:var(--encre);color:#C9CFD0;padding:64px 0 120px;margin-top:40px}
footer a{color:#fff}
footer .g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}
footer h4{font:600 .78rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#fff;margin:0 0 12px}
footer ul{list-style:none;margin:0;padding:0}footer li{margin:6px 0}
footer .logo b{color:#fff}
.reseaux{display:flex;gap:10px;margin-top:16px}
.reseaux a{width:42px;height:42px;border:1px solid #4D5658;border-radius:50%;display:grid;place-items:center;color:#fff}
.reseaux a:hover{background:var(--lac);border-color:var(--lac)}
.signature{border-top:1px solid #2E3436;margin-top:40px;padding-top:20px;font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Barre mobile */
.barre{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(241,244,243,.97);border-top:1px solid var(--pierre)}
.barre .btn{flex:1;justify-content:center;padding:.85em .6em;font-size:.9rem}

/* Conseiller */
.cons-btn{position:fixed;right:20px;top:136px;z-index:50;display:flex;align-items:center;gap:12px;background:var(--lac);color:#fff;border:0;border-radius:999px;padding:10px 20px 10px 10px;cursor:pointer;box-shadow:0 12px 28px -10px rgba(10,30,36,.6);font:inherit;text-align:left}
.cons-btn .av{width:42px;height:42px;border-radius:50%;background:var(--ambre);display:grid;place-items:center;font:600 1.15rem var(--serif);color:#fff}
.cons-btn b{display:block;font:600 .95rem var(--sans)}
.cons-btn small{font-size:.8rem;color:#D6E4E7}
.cons-bulle{position:fixed;right:20px;top:204px;z-index:50;max-width:300px;background:#fff;border:1px solid var(--pierre);border-radius:8px;padding:16px 40px 16px 16px;box-shadow:0 16px 32px -14px rgba(0,0,0,.35);font-size:.93rem;display:none}
.cons-bulle.on{display:block;animation:monte .5s var(--ease)}
.cons-bulle button{position:absolute;top:6px;right:6px;border:0;background:none;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;color:var(--gris)}
@keyframes monte{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cons{position:fixed;right:20px;top:136px;z-index:60;width:min(400px,calc(100vw - 24px));height:min(600px,calc(100vh - 156px));background:var(--nappe);border:1px solid var(--pierre);border-radius:10px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden}
.cons.on{display:flex;animation:monte .45s var(--ease)}
.cons header{background:var(--lac);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.cons header b{display:block;font:500 1.15rem var(--serif)}
.cons header small{color:#D6E4E7;font-size:.8rem}
.cons header button{margin-left:auto;background:none;border:0;color:#fff;cursor:pointer;width:36px;height:36px;display:grid;place-items:center}
.fil{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:10px;font-size:.95rem;line-height:1.5}
.msg.b{background:#fff;border:1px solid var(--pierre);align-self:flex-start}
.msg.u{background:var(--lac);color:#fff;align-self:flex-end}
.msg a{font-weight:600}
.puces-c{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.puces-c button{border:1px solid var(--lac);background:#fff;color:var(--lac);border-radius:999px;padding:7px 12px;font:500 .85rem var(--sans);cursor:pointer}
.puces-c button:hover{background:var(--lac);color:#fff}
.cons form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--pierre);background:#fff}
.cons form input{flex:1}
.cons form button{flex:none;padding:0 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Entrées */
.apparait{opacity:1;transform:none}
.js .apparait{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.js .apparait.vu{opacity:1;transform:none}

@media (max-width:1024px){

const A={
 inconnu:{fr:`Je n'ai pas cette information, et je préfère ne pas vous répondre au hasard. La maison vous renseignera au ${TEL} ou par e-mail : ${MAIL}.`,en:`I don't have that information and would rather not guess. The hotel will help you on ${TEL} or by email: ${MAIL}.`,es:`No tengo esa información y prefiero no responder al azar. La casa le informará en el ${TEL} o por correo: ${MAIL}.`,de:`Diese Information habe ich nicht, und raten möchte ich nicht. Das Haus hilft Ihnen gern unter ${TEL} oder per E-Mail: ${MAIL}.`,it:`Non ho questa informazione e preferisco non rispondere a caso. La casa vi risponderà al ${TEL} o via e-mail: ${MAIL}.`,nl:`Die informatie heb ik niet, en ik gok liever niet. Het hotel helpt u via ${TEL} of per e-mail: ${MAIL}.`},
 pmr:{fr:`Bonne nouvelle : une chambre en rez-de-chaussée est accessible aux personnes à mobilité réduite, et le ${L('hotel','studio PMR de 40 m²')} est de plain-pied, avec douche sans marche et véranda privative (dès 109 € la nuit).`,en:`Good news: a ground-floor room is accessible to guests with reduced mobility, and the ${L('hotel','40 m² accessible studio')} is on one level, with a step-free shower and private veranda (from €109 a night).`,es:`Buena noticia: una habitación en planta baja es accesible para personas con movilidad reducida, y el ${L('hotel','estudio adaptado de 40 m²')} está a ras de suelo, con ducha sin escalón y veranda privada (desde 109 € la noche).`,de:`Gute Nachricht: Ein Zimmer im Erdgeschoss ist barrierefrei, und das ${L('hotel','barrierefreie Studio mit 40 m²')} ist ebenerdig, mit stufenloser Dusche und eigener Veranda (ab 109 € pro Nacht).`,it:`Buona notizia: una camera al piano terra è accessibile alle persone a mobilità ridotta, e lo ${L('hotel','studio accessibile di 40 m²')} è tutto su un livello, con doccia senza gradino e veranda privata (da 109 € a notte).`,nl:`Goed nieuws: een kamer op de begane grond is toegankelijk voor gasten met beperkte mobiliteit, en de ${L('hotel','toegankelijke studio van 40 m²')} is gelijkvloers, met drempelloze douche en eigen serre (vanaf € 109 per nacht).`},
 animal:{fr:`Vos animaux sont les bienvenus, avec un supplément de 9 € par jour. Et la voie verte, juste à côté, fait de belles promenades.`,en:`Your pets are welcome, with a supplement of €9 per day. And the greenway right nearby makes for lovely walks.`,es:`Sus mascotas son bienvenidas, con un suplemento de 9 € por día. Y la vía verde, muy cerca, es ideal para pasear.`,de:`Ihre Tiere sind willkommen, gegen einen Aufpreis von 9 € pro Tag. Und der Grüne Weg gleich nebenan lädt zu schönen Spaziergängen ein.`,it:`I vostri animali sono i benvenuti, con un supplemento di 9 € al giorno. E la via verde, lì accanto, è perfetta per le passeggiate.`,nl:`Uw huisdieren zijn welkom, met een toeslag van € 9 per dag. En de groene route vlakbij is ideaal om te wandelen.`},
 demi:{fr:`Par personne (base 2 personnes), 3 nuits minimum : demi-pension dès 67 € en chambre standard, 75 € en confort vue sur le parc ; pension complète dès 88 € et 95 €. Soirée étape : dès 95 € (standard) ou 105 € (confort). ${L('hotel','Voir tous les tarifs')}`,en:`Per person (2 sharing), 3 nights minimum: half board from €67 in a standard room, €75 in a comfort room with park view; full board from €88 and €95. Overnight package: from €95 (standard) or €105 (comfort). ${L('hotel','See all rates')}`,es:`Por persona (base 2), mínimo 3 noches: media pensión desde 67 € en estándar, 75 € en confort con vistas al parque; pensión completa desde 88 € y 95 €. Noche de etapa: desde 95 € (estándar) o 105 € (confort). ${L('hotel','Ver todas las tarifas')}`,de:`Pro Person (bei 2 Personen), mindestens 3 Nächte: Halbpension ab 67 € im Standardzimmer, 75 € im Komfortzimmer mit Parkblick; Vollpension ab 88 € bzw. 95 €. Etappenabend: ab 95 € (Standard) oder 105 € (Komfort). ${L('hotel','Alle Preise')}`,it:`A persona (base 2), minimo 3 notti: mezza pensione da 67 € in standard, 75 € in comfort vista parco; pensione completa da 88 € e 95 €. Serata tappa: da 95 € (standard) o 105 € (comfort). ${L('hotel','Tutte le tariffe')}`,nl:`Per persoon (op basis van 2), minimaal 3 nachten: halfpension vanaf € 67 in een standaardkamer, € 75 in comfort met parkzicht; volpension vanaf € 88 en € 95. Etappeavond: vanaf € 95 (standaard) of € 105 (comfort). ${L('hotel','Alle tarieven')}`},
 petitdej:{fr:`Le petit-déjeuner est à 13 € par personne. Pour l'heure de service, la maison vous répond au ${TEL}.`,en:`Breakfast is €13 per person. For serving times, the hotel will tell you on ${TEL}.`,es:`El desayuno cuesta 13 € por persona. Para el horario, la casa le informa en el ${TEL}.`,de:`Das Frühstück kostet 13 € pro Person. Die Frühstückszeiten erfahren Sie unter ${TEL}.`,it:`La colazione costa 13 € a persona. Per l'orario, la casa vi risponde al ${TEL}.`,nl:`Het ontbijt kost € 13 per persoon. Voor de tijden kunt u het hotel bellen: ${TEL}.`},
 enfant:{fr:`Pour les plus jeunes, la maison propose « Le Petit Mousquetaire » parmi ses menus ; sa composition du moment se demande au ${TEL}. Juste en face, la base aqualudique a une pataugeoire avec mini-toboggans.`,en:`For younger guests, the restaurant offers “The Little Musketeer” among its menus; ask for today's version on ${TEL}. Right opposite, the water park has a paddling pool with mini slides.`,es:`Para los más pequeños, la casa propone «El Pequeño Mosquetero» entre sus menús; pregunte su composición en el ${TEL}. Justo enfrente, el parque acuático tiene piscina infantil con minitoboganes.`,de:`Für die Kleinen gibt es unter den Menüs „Der Kleine Musketier“; die aktuelle Zusammenstellung erfahren Sie unter ${TEL}. Direkt gegenüber hat der Wasserpark ein Planschbecken mit Minirutschen.`,it:`Per i più piccoli, la casa propone «Il Piccolo Moschettiere» tra i suoi menù; chiedetene la composizione al ${TEL}. Proprio di fronte, il parco acquatico ha una piscina per bambini con mini scivoli.`,nl:`Voor de jongsten staat ‘De Kleine Musketier’ tussen de menu's; vraag de samenstelling via ${TEL}. Recht tegenover heeft het waterpark een peuterbad met mini-glijbanen.`},
 vege:{fr:`Je ne peux pas vous garantir un plat adapté sans en parler en cuisine. À la carte, il y a par exemple la burrata ou le pavé de saumon. Le plus sûr : prévenir la maison en réservant, au ${TEL}.`,en:`I can't promise a suitable dish without checking with the kitchen. On the menu there's the burrata or the salmon, for example. Safest: let the hotel know when booking, on ${TEL}.`,es:`No puedo garantizarle un plato adaptado sin consultar a la cocina. En la carta hay, por ejemplo, burrata o salmón. Lo más seguro: avisar al reservar, en el ${TEL}.`,de:`Ein passendes Gericht kann ich ohne Rücksprache mit der Küche nicht zusagen. Auf der Karte gibt es etwa die Burrata oder den Lachs. Am sichersten: bei der Reservierung Bescheid geben, unter ${TEL}.`,it:`Non posso garantirvi un piatto adatto senza parlarne con la cucina. In carta c'è, per esempio, la burrata o il salmone. La cosa più sicura: avvisare la casa quando prenotate, al ${TEL}.`,nl:`Ik kan geen passend gerecht beloven zonder het aan de keuken te vragen. Op de kaart staan bijvoorbeeld de burrata of de zalm. Het zekerst: meld het bij het reserveren via ${TEL}.`},
 groupe:{fr:`Pour les groupes : menu dès 24,90 € à partir de 25 personnes (apéritif, vin, café et armagnac compris, en semaine le midi). Pour un séminaire : salle modulable jusqu'à 100 personnes. ${L('groupes','Tout voir et demander un devis')}`,en:`For groups: menu from €24.90 for 25 people or more (aperitif, wine, coffee and armagnac included, weekday lunchtimes). For seminars: a flexible room for up to 100. ${L('groupes','See everything and request a quote')}`,es:`Para grupos: menú desde 24,90 € a partir de 25 personas (aperitivo, vino, café y armañac incluidos, a mediodía entre semana). Para seminarios: sala modulable hasta 100 personas. ${L('groupes','Ver todo y pedir presupuesto')}`,de:`Für Gruppen: Menü ab 24,90 € ab 25 Personen (Aperitif, Wein, Kaffee und Armagnac inklusive, werktags mittags). Für Seminare: ein flexibler Saal für bis zu 100 Personen. ${L('groupes','Alles ansehen und Angebot anfragen')}`,it:`Per i gruppi: menù da 24,90 € da 25 persone (aperitivo, vino, caffè e armagnac inclusi, a pranzo nei giorni feriali). Per i seminari: sala modulabile fino a 100 persone. ${L('groupes','Vedi tutto e chiedi un preventivo')}`,nl:`Voor groepen: menu vanaf € 24,90 vanaf 25 personen (aperitief, wijn, koffie en armagnac inbegrepen, doordeweeks 's middags). Voor seminars: een flexibele zaal tot 100 personen. ${L('groupes','Alles bekijken en offerte aanvragen')}`},
 cadeau:{fr:`Les bons cadeaux du Pardaillan se commandent en ligne : <a href="${BONS}" target="_blank" rel="noopener">choisir un bon cadeau</a>.`,en:`Le Pardaillan gift vouchers can be ordered online: <a href="${BONS}" target="_blank" rel="noopener">choose a voucher</a>.`,es:`Los bonos regalo del Pardaillan se piden en línea: <a href="${BONS}" target="_blank" rel="noopener">elegir un bono</a>.`,de:`Gutscheine des Pardaillan bestellen Sie online: <a href="${BONS}" target="_blank" rel="noopener">Gutschein wählen</a>.`,it:`I buoni regalo del Pardaillan si ordinano online: <a href="${BONS}" target="_blank" rel="noopener">scegli un buono</a>.`,nl:`Cadeaubonnen van Le Pardaillan bestelt u online: <a href="${BONS}" target="_blank" rel="noopener">kies een bon</a>.`},
 base:{fr:`La base aqualudique de Gondrin est juste en face : 4 500 m² de baignade en eau filtrée, 4 toboggans, un espace vagues et une pataugeoire. Elle vit surtout l'été. ${L('alentours','Les alentours')}`,en:`Gondrin's water park is right opposite: 4,500 m² of filtered-water swimming, 4 slides, a wave zone and a paddling pool. It comes alive mainly in summer. ${L('alentours','Around us')}`,es:`El parque acuático de Gondrin está justo enfrente: 4 500 m² de baño en agua filtrada, 4 toboganes, zona de olas y piscina infantil. Vive sobre todo en verano. ${L('alentours','Alrededores')}`,de:`Der Wasserpark von Gondrin liegt direkt gegenüber: 4.500 m² Badebereich mit gefiltertem Wasser, 4 Rutschen, Wellenbereich und Planschbecken. Vor allem im Sommer belebt. ${L('alentours','Umgebung')}`,it:`Il parco acquatico di Gondrin è proprio di fronte: 4.500 m² di balneazione in acqua filtrata, 4 scivoli, area onde e piscina per bambini. Vive soprattutto d'estate. ${L('alentours','Dintorni')}`,nl:`Het waterpark van Gondrin ligt recht tegenover: 4.500 m² gefilterd zwemwater, 4 glijbanen, een golfzone en een peuterbad. Vooral 's zomers bruisend. ${L('alentours','Omgeving')}`},
 velo:{fr:`La voie verte de l'Armagnac passe à Gondrin : plus de 20 km sur l'ancienne voie ferrée, réservés aux piétons et aux vélos, avec d'anciennes gares et des aires de pique-nique. ${L('alentours','En savoir plus')}`,en:`The Armagnac greenway passes through Gondrin: over 20 km of old railway for walkers and cyclists only, with old stations and picnic spots. ${L('alentours','Find out more')}`,es:`La vía verde del Armañac pasa por Gondrin: más de 20 km del antiguo ferrocarril, solo para peatones y bicis, con viejas estaciones y áreas de pícnic. ${L('alentours','Saber más')}`,de:`Der Grüne Weg des Armagnac führt durch Gondrin: über 20 km alte Bahntrasse, nur für Fußgänger und Radfahrer, mit alten Bahnhöfen und Picknickplätzen. ${L('alentours','Mehr erfahren')}`,it:`La via verde dell'Armagnac passa da Gondrin: oltre 20 km sull'antica ferrovia, riservati a pedoni e bici, con vecchie stazioni e aree picnic. ${L('alentours','Scopri di più')}`,nl:`De groene route van de Armagnac loopt door Gondrin: ruim 20 km oude spoorlijn, alleen voor wandelaars en fietsers, met oude stations en picknickplekken. ${L('alentours','Meer weten')}`},
 armagnac:{fr:`Vous êtes en terre d'Armagnac : par la voie verte, floc de Gascogne, chais d'armagnac et producteurs vous reçoivent pour une dégustation. À table, la croustade et le crumble sont à l'armagnac, et le menu groupe se termine par l'armagnac du patron.`,en:`You're in Armagnac country: along the greenway, Floc de Gascogne makers, armagnac cellars and producers welcome you for tastings. At table, the croustade and the crumble are made with armagnac, and the group menu ends with the owner's armagnac.`,es:`Está en tierra de Armañac: por la vía verde, productores de floc, bodegas de armañac y artesanos le reciben para una cata. En la mesa, la croustade y el crumble llevan armañac, y el menú de grupo termina con el armañac de la casa.`,de:`Sie sind im Land des Armagnac: Entlang des Grünen Wegs empfangen Sie Floc-Erzeuger, Armagnac-Keller und Produzenten zur Verkostung. Bei Tisch sind Croustade und Crumble mit Armagnac, und das Gruppenmenü endet mit dem Armagnac des Chefs.`,it:`Siete in terra d'Armagnac: lungo la via verde, produttori di floc, cantine d'armagnac e artigiani vi accolgono per una degustazione. A tavola, croustade e crumble sono all'armagnac, e il menù di gruppo si chiude con l'armagnac del padrone.`,nl:`U bent in armagnacland: langs de groene route ontvangen floc-makers, armagnackelders en producenten u voor een proeverij. Aan tafel zitten croustade en crumble vol armagnac, en het groepsmenu eindigt met de armagnac van de baas.`},
 patrimoine:{fr:`À quelques minutes : l'abbaye de Flaran, Larressingle, Fourcès, Montréal et la villa de Séviac. ${L('alentours','Les alentours')}`,en:`A few minutes away: Flaran abbey, Larressingle, Fourcès, Montréal and the Séviac villa. ${L('alentours','Around us')}`,es:`A pocos minutos: la abadía de Flaran, Larressingle, Fourcès, Montréal y la villa de Séviac. ${L('alentours','Alrededores')}`,de:`Nur Minuten entfernt: die Abtei Flaran, Larressingle, Fourcès, Montréal und die Villa Séviac. ${L('alentours','Umgebung')}`,it:`A pochi minuti: l'abbazia di Flaran, Larressingle, Fourcès, Montréal e la villa di Séviac. ${L('alentours','Dintorni')}`,nl:`Op een paar minuten: de abdij van Flaran, Larressingle, Fourcès, Montréal en de villa van Séviac. ${L('alentours','Omgeving')}`},
 horaires:{fr:`Le restaurant est ouvert du lundi au samedi de 12 h à 13 h 30 et de 19 h à 20 h 30, le dimanche de 12 h à 14 h. Réservation au ${TEL}.`,en:`The restaurant is open Monday to Saturday 12:00–13:30 and 19:00–20:30, Sunday 12:00–14:00. Bookings on ${TEL}.`,es:`El restaurante abre de lunes a sábado de 12:00 a 13:30 y de 19:00 a 20:30, el domingo de 12:00 a 14:00. Reservas en el ${TEL}.`,de:`Das Restaurant ist Montag bis Samstag von 12:00–13:30 und 19:00–20:30 Uhr geöffnet, sonntags von 12:00–14:00 Uhr. Reservierung unter ${TEL}.`,it:`Il ristorante è aperto dal lunedì al sabato 12:00–13:30 e 19:00–20:30, la domenica 12:00–14:00. Prenotazioni al ${TEL}.`,nl:`Het restaurant is open van maandag tot zaterdag 12.00–13.30 en 19.00–20.30 uur, op zondag 12.00–14.00 uur. Reserveren via ${TEL}.`},
 table:{fr:`Pour réserver une table : appelez le ${TEL}, ou remplissez la ${L('restaurant','demande de table')} en bas de la page du restaurant.`,en:`To book a table: call ${TEL}, or fill in the ${L('restaurant','table request')} at the bottom of the restaurant page.`,es:`Para reservar mesa: llame al ${TEL} o rellene la ${L('restaurant','solicitud de mesa')} al final de la página del restaurante.`,de:`Tisch reservieren: rufen Sie ${TEL} an oder nutzen Sie die ${L('restaurant','Tischanfrage')} unten auf der Restaurantseite.`,it:`Per prenotare un tavolo: chiamate il ${TEL} o compilate la ${L('restaurant','richiesta di tavolo')} in fondo alla pagina del ristorante.`,nl:`Een tafel reserveren: bel ${TEL} of vul de ${L('restaurant','tafelaanvraag')} onderaan de restaurantpagina in.`},
 carte:{fr:`La carte joue la Gascogne : foie gras au torchon (20 €), magret du Gers (26 €), confit de canard (19 €), et la croustade aux pommes et à l'armagnac (10 €). ${L('restaurant','Voir toute la carte')}`,en:`The menu is pure Gascony: foie gras au torchon (€20), Gers duck breast (€26), duck confit (€19), and apple and armagnac croustade (€10). ${L('restaurant','See the full menu')}`,es:`La carta es pura Gascuña: foie gras al paño (20 €), magret del Gers (26 €), confit de pato (19 €) y croustade de manzana y armañac (10 €). ${L('restaurant','Ver toda la carta')}`,de:`Die Karte ist reine Gascogne: Stopfleber im Tuch (20 €), Entenbrust aus dem Gers (26 €), Entenconfit (19 €) und Croustade mit Apfel und Armagnac (10 €). ${L('restaurant','Ganze Karte ansehen')}`,it:`La carta è pura Guascogna: foie gras al torchon (20 €), magret del Gers (26 €), confit d'anatra (19 €) e croustade di mele e armagnac (10 €). ${L('restaurant','Vedi tutta la carta')}`,nl:`De kaart is puur Gascogne: eendenlever au torchon (€ 20), eendenborst uit de Gers (€ 26), eendenconfit (€ 19) en croustade met appel en armagnac (€ 10). ${L('restaurant','Bekijk de hele kaart')}`},
 wifi:{fr:`Toutes les chambres sont climatisées, avec écran plat et wifi gratuit (le wifi couvre tout l'hôtel).`,en:`Every room is air-conditioned, with a flat-screen TV and free wifi (wifi covers the whole hotel).`,es:`Todas las habitaciones tienen aire acondicionado, televisor plano y wifi gratis (el wifi cubre todo el hotel).`,de:`Alle Zimmer sind klimatisiert, mit Flachbild-TV und kostenlosem WLAN (im ganzen Hotel).`,it:`Tutte le camere sono climatizzate, con TV a schermo piatto e wifi gratuito (il wifi copre tutto l'hotel).`,nl:`Alle kamers hebben airco, een flatscreen en gratis wifi (wifi in het hele hotel).`},
 contact:{fr:`Le Pardaillan, 25 avenue Jean Moulin, 32330 Gondrin. Téléphone ${TEL}, e-mail ${MAIL}.`,en:`Le Pardaillan, 25 avenue Jean Moulin, 32330 Gondrin, France. Phone ${TEL}, email ${MAIL}.`,es:`Le Pardaillan, 25 avenue Jean Moulin, 32330 Gondrin (Francia). Teléfono ${TEL}, correo ${MAIL}.`,de:`Le Pardaillan, 25 avenue Jean Moulin, 32330 Gondrin, Frankreich. Telefon ${TEL}, E-Mail ${MAIL}.`,it:`Le Pardaillan, 25 avenue Jean Moulin, 32330 Gondrin (Francia). Telefono ${TEL}, e-mail ${MAIL}.`,nl:`Le Pardaillan, 25 avenue Jean Moulin, 32330 Gondrin, Frankrijk. Telefoon ${TEL}, e-mail ${MAIL}.`},
 prix:{fr:`Les chambres : Standard dès 83 €, Confort dès 96 €, Confort triple dès 115 €, studio avec véranda dès 109 € la nuit. Petit-déjeuner 13 €, taxe de séjour 1,44 € par personne et par nuit. ${L('hotel','Voir les chambres')}`,en:`Rooms: Standard from €83, Comfort from €96, Comfort triple from €115, studio with veranda from €109 a night. Breakfast €13, tourist tax €1.44 per person per night. ${L('hotel','See the rooms')}`,es:`Habitaciones: Estándar desde 83 €, Confort desde 96 €, Confort triple desde 115 €, estudio con veranda desde 109 € la noche. Desayuno 13 €, tasa turística 1,44 € por persona y noche. ${L('hotel','Ver las habitaciones')}`,de:`Zimmer: Standard ab 83 €, Komfort ab 96 €, Komfort-Dreibett ab 115 €, Studio mit Veranda ab 109 € pro Nacht. Frühstück 13 €, Kurtaxe 1,44 € pro Person und Nacht. ${L('hotel','Zimmer ansehen')}`,it:`Camere: Standard da 83 €, Comfort da 96 €, Comfort tripla da 115 €, studio con veranda da 109 € a notte. Colazione 13 €, tassa di soggiorno 1,44 € a persona a notte. ${L('hotel','Vedi le camere')}`,nl:`Kamers: Standaard vanaf € 83, Comfort vanaf € 96, Comfort driepersoons vanaf € 115, studio met serre vanaf € 109 per nacht. Ontbijt € 13, toeristenbelasting € 1,44 per persoon per nacht. ${L('hotel','Bekijk de kamers')}`},
 chambre3:{fr:`À trois, la Chambre Confort triple (grand lit 160 cm + un lit 90 cm) est faite pour vous, dès 115 €. Autre idée : le studio avec véranda et deux chambres, dès 109 €. <a href="#" data-resa>Voir les disponibilités</a>`,en:`For three, the Comfort Triple Room (160 cm bed + a 90 cm single) is ideal, from €115. Another idea: the studio with veranda and two bedrooms, from €109. <a href="#" data-resa>Check availability</a>`,es:`Para tres, la Habitación Confort triple (cama de 160 cm + una de 90 cm) es ideal, desde 115 €. Otra idea: el estudio con veranda y dos dormitorios, desde 109 €. <a href="#" data-resa>Ver disponibilidad</a>`,de:`Zu dritt passt das Komfort-Dreibettzimmer (160-cm-Bett + 90-cm-Bett), ab 115 €. Oder das Studio mit Veranda und zwei Schlafzimmern, ab 109 €. <a href="#" data-resa>Verfügbarkeit prüfen</a>`,it:`In tre, la Camera Comfort tripla (letto 160 cm + un letto 90 cm) è perfetta, da 115 €. Altra idea: lo studio con veranda e due camere, da 109 €. <a href="#" data-resa>Verifica disponibilità</a>`,nl:`Met z'n drieën is de Comfort driepersoonskamer (bed 160 cm + bed 90 cm) ideaal, vanaf € 115. Andere optie: de studio met serre en twee slaapkamers, vanaf € 109. <a href="#" data-resa>Beschikbaarheid bekijken</a>`},
 chambre4:{fr:`Pour quatre personnes ou plus, je ne veux pas vous promettre une combinaison sans vérifier : le plus simple est d'appeler la maison au ${TEL}, qui vous proposera plusieurs chambres ou un studio.`,en:`For four or more, I'd rather not promise a combination without checking: simplest is to call the hotel on ${TEL}, who can suggest several rooms or a studio.`,es:`Para cuatro o más, prefiero no prometer una combinación sin comprobarlo: lo más sencillo es llamar al ${TEL}, le propondrán varias habitaciones o un estudio.`,de:`Für vier oder mehr Personen möchte ich ohne Prüfung nichts zusagen: Am einfachsten rufen Sie das Haus unter ${TEL} an, das Ihnen mehrere Zimmer oder ein Studio vorschlägt.`,it:`Per quattro o più persone preferisco non promettere una combinazione senza verificare: la cosa più semplice è chiamare la casa al ${TEL}, che vi proporrà più camere o uno studio.`,nl:`Voor vier personen of meer beloof ik liever niets zonder te controleren: bel het hotel via ${TEL}, dan krijgt u een voorstel met meerdere kamers of een studio.`},
 chambre:{fr:`À deux, deux choix : la Chambre Standard (lit 140 cm ou deux lits 90 cm) dès 83 €, ou la Chambre Confort (lit 160 cm, machine Nespresso) dès 96 €. Toutes sont climatisées, avec douche à l'italienne. <a href="#" data-resa>Voir les disponibilités</a>`,en:`For two, two options: the Standard Room (140 cm bed or two singles) from €83, or the Comfort Room (160 cm bed, Nespresso machine) from €96. All are air-conditioned with walk-in showers. <a href="#" data-resa>Check availability</a>`,es:`Para dos, dos opciones: la Habitación Estándar (cama de 140 cm o dos de 90 cm) desde 83 €, o la Habitación Confort (cama de 160 cm, cafetera Nespresso) desde 96 €. Todas climatizadas y con ducha a ras de suelo. <a href="#" data-resa>Ver disponibilidad</a>`,de:`Zu zweit gibt es zwei Möglichkeiten: das Standardzimmer (140-cm-Bett oder zwei Einzelbetten) ab 83 € oder das Komfortzimmer (160-cm-Bett, Nespresso) ab 96 €. Alle klimatisiert, mit ebenerdiger Dusche. <a href="#" data-resa>Verfügbarkeit prüfen</a>`,it:`In due, due scelte: la Camera Standard (letto 140 cm o due letti 90 cm) da 83 €, o la Camera Comfort (letto 160 cm, macchina Nespresso) da 96 €. Tutte climatizzate, con doccia a filo pavimento. <a href="#" data-resa>Verifica disponibilità</a>`,nl:`Met z'n tweeën twee keuzes: de Standaardkamer (bed 140 cm of twee bedden 90 cm) vanaf € 83, of de Comfortkamer (bed 160 cm, Nespresso) vanaf € 96. Allemaal met airco en inloopdouche. <a href="#" data-resa>Beschikbaarheid bekijken</a>`},
 defaut:{fr:`Je ne sais pas répondre précisément à cela. Je peux vous parler des chambres, des tarifs, du restaurant, des groupes ou des alentours. Sinon, la maison vous répond au ${TEL}.`,en:`I can't answer that precisely. I can tell you about rooms, rates, the restaurant, groups or the area. Otherwise, the hotel will answer on ${TEL}.`,es:`No sé responder con precisión a eso. Puedo hablarle de habitaciones, tarifas, restaurante, grupos o alrededores. Si no, la casa le responde en el ${TEL}.`,de:`Darauf kann ich nicht genau antworten. Ich kann Ihnen etwas zu Zimmern, Preisen, Restaurant, Gruppen oder Umgebung sagen. Sonst hilft das Haus unter ${TEL}.`,it:`Non so rispondere con precisione. Posso parlarvi di camere, tariffe, ristorante, gruppi o dintorni. Altrimenti la casa vi risponde al ${TEL}.`,nl:`Daar kan ik geen precies antwoord op geven. Ik vertel u graag over kamers, tarieven, het restaurant, groepen of de omgeving. Anders helpt het hotel via ${TEL}.`}
};
function repondre(q,lang){
 const s=q.toLowerCase();
 const ordre=(/chambre|room|habitaci|zimmer|\bcamera|kamer|dormir|schlafen|slapen|sleep/.test(s)&&/\d|trois|three|tres|drei|\btre\b|drie|quatre|four|cuatro|vier|quattro|famil|enfant|kid|child|ni[ñn]o|kind|bambin|couple|deux|two|dos|zwei|due|twee/.test(s))?[INTENTS.find(x=>x[0]==='chambre')]:[];
 for(const [k,re] of ordre.concat(INTENTS)){ if(re.test(s)){
   if(k==="chambre"){const m=s.match(/(\d+)|\b(trois|three|tres|drei|tre|drie)\b|\b(quatre|four|cuatro|vier|quattro|cinq|five|six)\b/); if(m){const n=m[1]?+m[1]:(m[2]?3:4); if(n>=4)return A.chambre4[lang]; if(n===3)return A.chambre3[lang];} if(/famil|enfant|kid|child|ni[ñn]o|kind|bambin/.test(s))return A.chambre3[lang]; return A.chambre[lang];}
   return A[k][lang];}}
 return A.defaut[lang];
}
