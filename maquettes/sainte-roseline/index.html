:root{--nef:#121733;--nef2:#1b2247;--vitrail:#2d4a9b;--rose:#e9a6a1;--rose-d:#a33a55;--pierre:#e3ddd3;--calc:#f1eee9;--blanc:#fff;--or:#b48e4e;--encre:#1b1b24;--gris:#56555f;--trait:#d6d0c6;--lum:#f3c9c4;--ease:cubic-bezier(.16,1,.3,1);--titre:'Marcellus',Georgia,serif;--texte:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--calc);color:var(--encre);font:400 17px/1.6 var(--texte);overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--rose);color:var(--nef)}
:focus-visible{outline:2px solid var(--rose-d);outline-offset:3px;border-radius:2px}
.sombre :focus-visible{outline-color:var(--rose)}
html{scrollbar-color:var(--vitrail) var(--calc)}
::-webkit-scrollbar{width:10px;height:8px}::-webkit-scrollbar-track{background:var(--calc)}::-webkit-scrollbar-thumb{background:var(--vitrail);border-radius:6px;border:2px solid var(--calc)}
h1,h2,h3,.titre{font-family:var(--titre);font-weight:400;letter-spacing:.02em;line-height:1.08;text-wrap:balance}
h2{font-size:clamp(2rem,4.6vw,3.6rem)}
h3{font-size:clamp(1.35rem,2.2vw,1.7rem)}
p{max-width:64ch;text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
.enveloppe{width:min(1240px,100% - 32px);margin-inline:auto}
.sombre{background:var(--nef);color:#ece8f2}
.sombre .doux{color:#b9b6cb}
.doux{color:var(--gris)}
section{padding:clamp(64px,10vw,128px) 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:48px;padding:.75em 1.5em;border-radius:999px;font-weight:500;letter-spacing:.02em;text-decoration:none;transition:background .25s,color .25s,transform .25s var(--ease),box-shadow .25s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-plein{background:var(--rose-d);color:#fff;box-shadow:0 6px 18px -8px rgba(163,58,85,.7)}
.btn-plein:hover{background:#8d2c47}
.btn-clair{background:var(--rose);color:var(--nef)}
.btn-clair:hover{background:#f3bdb8}
.btn-trait{border:1px solid currentColor}
.btn-trait:hover{background:rgba(127,127,160,.12)}
.lien{font-weight:500;color:var(--rose-d);text-decoration:underline}
.sombre .lien{color:var(--rose)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* en-tête */
.bandeau{background:var(--nef2);color:#d9d5e6;font-size:.82rem;text-align:center;padding:6px 16px}
header.tete{position:sticky;top:0;z-index:50;background:rgba(18,23,51,.96);color:#eee;backdrop-filter:saturate(1.2)}
.tete-l1{display:flex;align-items:center;gap:16px;min-height:64px}
.marque{display:flex;flex-direction:column;text-decoration:none;line-height:1.05;margin-right:auto}
.marque b{font:400 1.32rem/1 var(--titre);letter-spacing:.08em;text-transform:uppercase}
.marque small{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-top:4px}
.langue{position:relative}
.langue select{appearance:none;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:.45em 2em .45em 1em;font:500 .86rem var(--texte);cursor:pointer;min-height:40px}
.langue select option{color:#111}
.langue::after{content:"";position:absolute;right:.85em;top:50%;width:6px;height:6px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.panier-btn{position:relative;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35)}
.panier-btn .pastille{min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:var(--nef);font-size:.75rem;font-weight:600;display:grid;place-items:center;padding:0 5px}
nav.menu{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{flex:none;padding:10px 12px;font-size:.9rem;text-decoration:none;color:#d8d5e4;border-radius:6px;white-space:nowrap}
nav.menu a:hover{color:#fff;background:rgba(255,255,255,.07)}
nav.menu a[aria-current]{color:#fff;box-shadow:inset 0 -2px 0 var(--rose)}
nav.menu a.conseil-lien{color:var(--rose)}
.tete-l1 nav.menu{display:none}.tete-l2{border-top:1px solid rgba(255,255,255,.1)}
@media (min-width:1100px){.tete-l2 nav.menu{justify-content:center;-webkit-mask-image:none;mask-image:none}}
@media (max-width:560px){.marque b{font-size:1.05rem}.marque small{font-size:.6rem;letter-spacing:.14em}.panier-btn .lbl{display:none}.langue select{padding:.4em 1.8em .4em .8em;font-size:.8rem}}

/* l'ogive : geste signature */
.ogive-scene{position:relative;height:210vh;background:var(--nef)}
.ogive-colle{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;place-items:center}
.ogive-fen{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:var(--w,44vw);height:var(--h,70vh);clip-path:url(#ogive);will-change:width,height}
.ogive-fen img{width:100%;height:100%;object-fit:cover;transform:scale(var(--z,1.12));transform-origin:50% 70%}
.ogive-fen::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,23,51,0) 45%,rgba(18,23,51,.78));opacity:var(--o,0)}
.ogive-fen.ouverte{clip-path:none}
.ogive-titre .btn-trait{color:#fff}
.ogive-titre{position:absolute;top:clamp(28px,6vh,64px);left:0;right:0;z-index:2;text-align:center;color:#fff;padding:0 16px;transform:translateY(var(--ty,0));opacity:var(--to,1)}
.ogive-titre h1{font-size:clamp(2.4rem,7vw,5.8rem);text-shadow:0 2px 30px rgba(10,12,30,.55);letter-spacing:.03em}
.ogive-titre p{display:inline-block;margin:18px auto 0;padding:6px 14px;border-radius:999px;background:rgba(18,23,51,.55);font-size:clamp(1rem,1.6vw,1.2rem);color:#eae6f3;text-shadow:0 1px 12px rgba(10,12,30,.7)}
.ogive-offre{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 0 clamp(28px,6vh,56px);opacity:var(--oo,0);transform:translateY(calc((1 - var(--oo,0)) * 24px));pointer-events:none}
.ogive-offre.actif{pointer-events:auto}
.ogive-offre .enveloppe{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;color:#fff}
.ogive-offre h2{font-size:clamp(1.8rem,4vw,3.1rem);max-width:16ch}
.ogive-offre p{color:#e4e0ee;margin-top:10px}
.ogive-offre .actions{display:flex;flex-wrap:wrap;gap:12px}
.ouvert{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:#e6e3ef;margin-top:14px}
.ouvert i{width:8px;height:8px;border-radius:50%;background:#7fd1a0;box-shadow:0 0 0 3px rgba(127,209,160,.25)}
.ouvert.ferme i{background:#e9a6a1;box-shadow:0 0 0 3px rgba(233,166,161,.25)}
.indice{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:3;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#cfcbe0;opacity:var(--to,1)}
@media (max-width:760px){.ogive-fen{--w:80vw;--h:56vh}}
@media (prefers-reduced-motion:reduce){.ogive-scene{height:auto}.ogive-colle{position:relative;height:auto;min-height:100svh}.ogive-fen{width:100%!important;height:100%!important;clip-path:none}.ogive-fen::after{opacity:1}.ogive-titre{display:none}.ogive-offre{position:relative;opacity:1;transform:none;pointer-events:auto;align-self:end}.indice{display:none}}

/* trois robes */
.robes{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(32px,6vw,96px);align-items:center}
.vitrail{position:relative;overflow:hidden;aspect-ratio:3/4.1;max-width:480px;width:100%;margin-inline:auto;clip-path:url(#ogive);background:var(--lumiere,var(--lum));transition:background .8s var(--ease)}
.vitrail::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 30%,rgba(255,255,255,.85),transparent 70%)}
.robes-sec{background:var(--teinte);transition:background .8s var(--ease)}
.vitrail .rayons{position:absolute;inset:-20% -10% 0;background:repeating-conic-gradient(from 200deg at 50% -8%,rgba(255,255,255,.55) 0deg 3deg,transparent 3deg 9deg);mask-image:linear-gradient(180deg,#000,transparent 75%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);animation:rayons 14s linear infinite alternate;opacity:.7}
@keyframes rayons{to{transform:rotate(4deg)}}

.vitrail img{position:absolute;left:50%;bottom:4%;width:78%;transform:translateX(-50%);mix-blend-mode:multiply;transition:opacity .5s}
.robes-choix{display:flex;gap:10px;margin:28px 0 22px;flex-wrap:wrap}
.robes-choix button{display:flex;align-items:center;gap:10px;min-height:48px;padding:.6em 1.2em .6em .7em;border:1px solid var(--trait);border-radius:999px;background:#fff;font-weight:500}
.robes-choix button i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.robes-choix button[aria-pressed=true]{border-color:var(--rose-d);box-shadow:0 0 0 1px var(--rose-d)}
.prix{font:500 1.5rem var(--texte);font-variant-numeric:tabular-nums}
.prix s{font-size:.95rem;color:var(--gris);margin-left:8px;font-weight:400}
.note-cond{font-size:.86rem;color:var(--gris);margin-top:4px}
@media (max-width:860px){.robes{grid-template-columns:1fr}.vitrail{max-width:340px}}

/* frise */
.frise-l{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 18px;scrollbar-width:thin}
.frise-l article{flex:0 0 min(300px,78vw);scroll-snap-align:start;border-top:1px solid rgba(233,166,161,.5);padding-top:18px}
.frise-l b{display:block;font:400 2.1rem var(--titre);color:var(--rose);margin-bottom:8px}
.frise-l p{font-size:.98rem;color:#d6d3e2}
.frise-nav{display:flex;gap:8px;margin-top:8px}
.frise-nav button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center}
.frise-nav button:hover{background:rgba(255,255,255,.08)}

/* grilles éditoriales */
.deux{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,80px);align-items:center}
.deux.inv>:first-child{order:2}
@media (max-width:860px){.deux{grid-template-columns:1fr}.deux.inv>:first-child{order:0}}
.photo{border-radius:4px;overflow:hidden;background:var(--pierre)}
.photo img{width:100%;height:100%;object-fit:cover}
.entete-page{position:relative;min-height:62vh;display:flex;align-items:flex-end;color:#fff;background:var(--nef)}
.entete-page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.entete-page::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,23,51,.15),rgba(18,23,51,.82))}
.entete-page .enveloppe{position:relative;z-index:1;padding:0 0 clamp(36px,7vw,72px)}
.entete-page h1{font-size:clamp(2.4rem,6.4vw,5rem);max-width:14ch}
.entete-page p{margin-top:14px;color:#e8e4f0;font-size:1.08rem}
.fil{font-size:.82rem;color:#d4d0e2;margin-bottom:14px}
.fil a{color:#d4d0e2}
.liste-lignes{display:grid;gap:0;border-top:1px solid var(--trait)}
.liste-lignes>*{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:20px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--trait)}
.liste-lignes h3{font-size:1.35rem}
@media (max-width:760px){.liste-lignes>*{grid-template-columns:1fr;gap:8px}}
.etiq{display:inline-block;font-size:.74rem;font-weight:500;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--pierre);color:var(--encre)}
.etiq.rose{background:#f6dcda;color:#7a2a40}
.etiq.bio{background:#dfe8d6;color:#2f4a22}
.mosaique{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.mosaique .photo{aspect-ratio:4/3}
.m6{grid-column:span 6}.m4{grid-column:span 4}.m8{grid-column:span 8}.m3{grid-column:span 3}
@media (max-width:760px){.m6,.m4,.m8,.m3{grid-column:span 12}}
.chiffres{display:flex;flex-wrap:wrap;gap:12px 36px;margin-top:26px}
.chiffres span{font-size:.98rem}
.chiffres b{font:400 1.5rem var(--titre);display:block;color:var(--rose-d)}
.sombre .chiffres b{color:var(--rose)}

/* boutique */
.filtres{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:28px 0}
.filtres button,.filtres select{min-height:44px;padding:.5em 1.1em;border:1px solid var(--trait);border-radius:999px;background:#fff;font:500 .9rem var(--texte)}
.filtres button[aria-pressed=true]{background:var(--nef);color:#fff;border-color:var(--nef)}
.grille-vins{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.carte-vin{display:flex;flex-direction:column;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 8px 24px -18px rgba(18,23,51,.45);transition:transform .35s var(--ease),box-shadow .35s}
.carte-vin:hover{transform:translateY(-3px);box-shadow:0 16px 32px -20px rgba(18,23,51,.55)}
.carte-vin a.img{display:block;aspect-ratio:1/1;background:#fff;padding:10px}
.carte-vin a.img img{width:100%;height:100%;object-fit:contain}
.carte-vin .corps{padding:14px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1;border-top:1px solid #eee}
.carte-vin h3{font:500 1rem/1.35 var(--texte);letter-spacing:0}
.carte-vin h3 a{text-decoration:none}
.carte-vin .bas{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.carte-vin .prix{font-size:1.1rem}
.ajout{width:44px;height:44px;border-radius:50%;background:var(--nef);color:#fff;display:grid;place-items:center;flex:none}
.ajout:hover{background:var(--rose-d)}
.vide{padding:40px;text-align:center;color:var(--gris);border:1px dashed var(--trait);border-radius:6px}
.fiche{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(28px,5vw,80px);align-items:start}
.fiche .visuel{background:#fff;border-radius:6px;aspect-ratio:1/1;padding:24px;position:sticky;top:130px}
.fiche .visuel img{width:100%;height:100%;object-fit:contain}
.formats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.formats button{min-height:52px;padding:.5em 1em;border:1px solid var(--trait);border-radius:8px;background:#fff;text-align:left;font-size:.9rem}
.formats button b{display:block;font-size:1rem}
.formats button[aria-pressed=true]{border-color:var(--rose-d);box-shadow:0 0 0 1px var(--rose-d)}
.qte{display:inline-flex;align-items:center;border:1px solid var(--trait);border-radius:999px;background:#fff}
.qte button{width:44px;height:44px;font-size:1.2rem}
.qte output{min-width:44px;text-align:center;font-weight:500}
dl.tech{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;margin-top:26px;padding-top:22px;border-top:1px solid var(--trait)}
dl.tech dt{color:var(--gris);font-size:.9rem}
.reassure{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.reassure div{display:flex;gap:10px;font-size:.88rem;color:var(--gris)}
@media (max-width:860px){.fiche{grid-template-columns:1fr}.fiche .visuel{position:relative;top:0;max-width:420px}.reassure{grid-template-columns:1fr}}

/* expériences, lieux, cartes média */
.media-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(20px,3vw,36px)}
.media-l article .photo{aspect-ratio:3/2;margin-bottom:16px}
.media-l h3{margin-bottom:8px}
.media-l .infos{font-size:.92rem;color:var(--gris);margin-top:10px}
.media-l .infos b{color:var(--encre);font-weight:500}
.sombre .media-l .infos{color:#bfbbd0}.sombre .media-l .infos b{color:#fff}
.capa{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.evt{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid var(--trait)}
.evt .photo{aspect-ratio:1/1}
.evt.passe{opacity:.72}
@media (max-width:640px){.evt{grid-template-columns:1fr}.evt .photo{max-width:260px}}

/* formulaires */
form.f{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form.f .plein{grid-column:1/-1}
form.f label{display:grid;gap:6px;font-size:.88rem;font-weight:500}
form.f input,form.f select,form.f textarea{width:100%;min-height:48px;padding:.7em .9em;border:1px solid var(--trait);border-radius:6px;background:#fff;font:400 1rem var(--texte);color:var(--encre)}
form.f textarea{min-height:120px;resize:vertical}
form.f input:focus,form.f select:focus,form.f textarea:focus{outline:2px solid var(--vitrail);outline-offset:0;border-color:transparent}
form.f .err{color:#a32424;font-size:.82rem;font-weight:400;display:none}
form.f .invalide input,form.f .invalide select,form.f .invalide textarea{border-color:#a32424}
form.f .invalide .err{display:block}
form.f .ok{grid-column:1/-1;padding:14px 16px;border-radius:6px;background:#e3eddc;color:#28401c;display:none}
@media (max-width:640px){form.f{grid-template-columns:1fr}}

/* pied */
footer.pied{background:var(--nef);color:#cfcbe0;padding:72px 0 28px;font-size:.94rem}
.pied-g{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}
.pied h4{font:400 1.1rem var(--titre);color:#fff;margin-bottom:14px;letter-spacing:.04em}
.pied a{color:#cfcbe0;text-decoration:none}
.pied a:hover{color:#fff;text-decoration:underline}
.pied ul{list-style:none;display:grid;gap:8px}
.reseaux{display:flex;gap:10px;margin-top:18px}
.reseaux a{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center}
.reseaux a:hover{background:rgba(255,255,255,.1)}
.reseaux svg{width:18px;height:18px;fill:currentColor}
.pied-b{margin-top:48px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;font-size:.82rem;color:#9e9ab4}
.mention-alcool{font-size:.8rem;color:#9e9ab4;margin-top:10px}
@media (max-width:900px){.pied-g{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.pied-g{grid-template-columns:1fr}}

/* panier */
.voile{position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
.voile.on{opacity:1;pointer-events:auto}
aside.tiroir{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--calc);z-index:90;transform:translateX(102%);transition:transform .45s var(--ease);display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.4)}
aside.tiroir.on{transform:none}
.tiroir-t{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--trait)}
.tiroir-c{flex:1;overflow:auto;padding:12px 20px}
.tiroir-b{padding:20px;border-top:1px solid var(--trait);display:grid;gap:10px}
.ligne-p{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--trait);align-items:center}
.ligne-p img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:4px}
.ligne-p .qte button{width:34px;height:34px}.ligne-p .qte output{min-width:30px}
.jauge{font-size:.86rem;color:var(--gris)}
.fermer{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.fermer:hover{background:rgba(0,0,0,.06)}
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);background:var(--nef);color:#fff;padding:12px 20px;border-radius:999px;z-index:95;opacity:0;transition:.35s var(--ease);font-size:.92rem;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* conseiller */
.conseil-btn{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:999px;background:var(--nef);color:#fff;box-shadow:0 12px 30px -12px rgba(18,23,51,.8);border:1px solid rgba(233,166,161,.45);text-align:left}
.conseil-btn .av{width:40px;height:40px;border-radius:50%;background:var(--rose);display:grid;place-items:center;color:var(--nef);flex:none}
.conseil-btn b{display:block;font:400 1rem var(--titre);letter-spacing:.04em}
.conseil-btn small{display:block;font-size:.76rem;color:#d6d2e4}
.invite{position:fixed;right:16px;bottom:84px;z-index:70;width:min(320px,calc(100% - 32px));background:#fff;border-radius:10px;padding:16px 44px 16px 16px;box-shadow:0 16px 36px -16px rgba(0,0,0,.45);font-size:.92rem;display:none}
.invite.on{display:block;animation:monte .5s var(--ease)}
.invite .fermer{position:absolute;top:4px;right:4px}
@keyframes monte{from{opacity:0;transform:translateY(10px)}}
.chat{position:fixed;right:16px;bottom:16px;z-index:96;width:min(400px,calc(100% - 32px));height:min(620px,calc(100svh - 32px));background:var(--calc);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);display:none;flex-direction:column;overflow:hidden}
.chat.on{display:flex}
.chat-t{background:var(--nef);color:#fff;padding:14px 12px 14px 16px;display:flex;align-items:center;gap:12px}
.chat-t b{font:400 1.08rem var(--titre);letter-spacing:.04em;display:block}
.chat-t small{color:#cfcbe0;font-size:.76rem}
.chat-t .fermer{margin-left:auto;color:#fff}
.chat-fil{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bulle{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.94rem;line-height:1.5}
.bulle.c{background:#fff;border-bottom-left-radius:4px;box-shadow:0 2px 8px -4px rgba(0,0,0,.2)}
.bulle.v{align-self:flex-end;background:var(--nef);color:#fff;border-bottom-right-radius:4px}
.bulle .mini{display:flex;gap:10px;align-items:center;margin-top:8px;padding:8px;background:var(--calc);border-radius:8px}
.bulle .mini img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:4px}
.bulle .mini a{font-weight:500;font-size:.88rem}
.puces{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.puces button{font-size:.84rem;padding:7px 12px;border-radius:999px;border:1px solid var(--trait);background:#fff;min-height:36px}
.puces button:hover{border-color:var(--rose-d)}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--trait);background:#fff}
.chat input{flex:1;min-height:44px;border:1px solid var(--trait);border-radius:999px;padding:0 16px;font:400 .95rem var(--texte)}
.chat form button{width:44px;height:44px;border-radius:50%;background:var(--rose-d);color:#fff;display:grid;place-items:center}
@media (max-width:560px){.conseil-btn{right:12px;bottom:12px;padding:8px 14px 8px 8px}.conseil-btn .av{width:34px;height:34px}}

.revele{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.revele.vu{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.revele{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}*{animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.blog-l{columns:2 320px;column-gap:40px}
.blog-l a{display:block;break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--trait);text-decoration:none}
.blog-l a:hover{color:var(--rose-d)}
.faq details{border-bottom:1px solid var(--trait);padding:16px 0}
.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--rose-d)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:10px;color:var(--gris)}
.horaires{display:grid;gap:14px}
.horaires div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;padding-bottom:14px;border-bottom:1px solid var(--trait)}
@media (max-width:560px){.horaires div{grid-template-columns:1fr;gap:4px}}
.prose h3{margin:34px 0 10px}
.prose p{margin-bottom:12px}
</style>

cl_t:"The chapel and the cloister",cl_p:"Built in the 11th century, the chapel has been a listed historic monument since 1980. It holds the body of Saint Roseline, prioress of La Celle-Roubaud from 1300 to 1329. The 12th-century cloister, also listed, blends Gothic and Romanesque arches; an avenue of 200-year-old plane trees leads past it to the private park.",
fa_t:"One family, two sisters",fa_p1:"In 1994 Bernard Teillaud bought the estate from Baron de Rasque de Laval and called on Jean-Michel Wilmotte to preserve its character. In 2007 his daughter Aurélie Bertin took over; in 2011 she and her sister Delphine Meunier became the owners.",fa_p2:"The family lives with contemporary art: every summer for over fifteen years, works by established artists have settled among the vines and gardens.",
vi_t:"110 hectares, eleven grape varieties",vi_p:"Clay-limestone soils, a deep spring that feeds the vines in moderation, and the whole vineyard farmed organically. State-of-the-art sorting and an 800 m² winery with temperature-controlled vats.",vi_r:"Reds: Syrah, Mourvèdre, Cabernet Sauvignon.",vi_ro:"Rosés: Grenache, Syrah, Mourvèdre, Cinsault, Tibouren.",vi_b:"Whites: Rolle, Sémillon.",

r_t:"Una bottiglia, tre colori",r_p:"Nel 1950 la baronessa de Rasque de Laval disegna la Lampe de Méduse: la base di un flacone di profumo di Grasse, il corpo di una bottiglia alsaziana. Scegliete il colore.",rose:"Rosato",blanc:"Bianco",rouge:"Rosso",ajouter:"Aggiungi al carrello",ajouter_n:"Aggiungi {n} bottiglie",voir:"Vedi la scheda",c6:"Venduto in cartoni da 6",c3:"Venduto in cartoni da 3",c1:"Venduto singolarmente",
fr_t:"Mille anni in dieci date",fr_p:"Da un eremita accanto a una sorgente a due sorelle proprietarie: la storia sta in un viale di platani.",
f1:"Un eremita, Roubaud, si stabilisce presso una sorgente. Nasce un'abbazia: la Celle-Roubaud.",f2:"La cappella viene eretta come chiesa abbaziale della Celle-Roubaud.",f3:"Il miracolo delle rose: sorpresa a donare le provviste ai poveri, Roseline apre il grembiule. Ne cadono solo rose.",f4:"La tenuta diventa uno dei primi vigneti della Provenza.",f5:"Roseline è canonizzata. Riposa in un reliquiario di cristallo, nella cappella.",f6:"La baronessa de Rasque de Laval deposita la forma della Lampe de Méduse.",f7:"Il castello ottiene il Cru Classé, tra i primi della Provenza.",f8:"Bernard Teillaud acquista la tenuta e affida il restauro all'architetto Jean-Michel Wilmotte.",f9:"La figlia Aurélie Bertin prende le redini e orienta la tenuta verso la sostenibilità.",f10:"Aurélie Bertin e Delphine Meunier acquistano il castello dal padre.",

d_t:"La tenuta",d_p:"Sito tutelato e Cru Classé insieme: una tenuta rara e uno dei luoghi più visitati della regione.",d_lieu:"Tra Saint-Tropez, Cannes, le gole del Verdon e Aix-en-Provence, il castello è sia sito tutelato sia Cru Classé AOP Côtes de Provence.",
cl_t:"La cappella e il chiostro",cl_p:"Eretta nell'XI secolo, la cappella è monumento storico dal 1980. Custodisce il corpo di santa Roseline, priora della Celle-Roubaud dal 1300 al 1329. Il chiostro del XII secolo, anch'esso tutelato, unisce archi gotici e romanici; un viale di platani bicentenari lo costeggia fino al parco privato.",
fa_t:"Una famiglia, due sorelle",fa_p1:"Nel 1994 Bernard Teillaud acquista la tenuta dal barone de Rasque de Laval e chiama Jean-Michel Wilmotte per preservarne la nobiltà. Nel 2007 la figlia Aurélie Bertin ne prende la guida; nel 2011 lei e la sorella Delphine Meunier ne diventano proprietarie.",fa_p2:"La famiglia vive con l'arte contemporanea: ogni estate da oltre quindici anni, opere di artisti affermati si installano tra vigne e giardini.",
vi_t:"110 ettari, undici vitigni",vi_p:"Suoli argillo-calcarei, una sorgente profonda che nutre la vite con misura e tutto il vigneto in agricoltura biologica. Una cernita all'avanguardia e una cantina di 800 m² con vasche termoregolate.",vi_r:"Rossi: Syrah, Mourvèdre, Cabernet Sauvignon.",vi_ro:"Rosati: Grenache, Syrah, Mourvèdre, Cinsault, Tibouren.",vi_b:"Bianchi: Rolle, Sémillon.",

/* horaires du jour (heure de Paris) */
function parisNow(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return{m:+o.month,d:+o.day,wd:o.weekday,h:+o.hour%24,mi:+o.minute}}
function plages(n){const md=n.m*100+n.d,we=n.wd==='Sat'||n.wd==='Sun';if(md===1225||md===101)return[];if(md>=413&&md<=927)return we?[[10,18]]:[[10,19]];if((md>=928&&md<=1101)||(md>=302&&md<=412))return we?[[10,13],[14,18]]:[[10,13],[14,18.5]];return[[10,13],[14,18]]}
function fh(x){const h=Math.floor(x),m=Math.round((x-h)*60);return L==='fr'?h+' h'+(m?' '+String(m).padStart(2,'0'):''):h+':'+String(m).padStart(2,'0')}
function horairesTxt(){const pl=plages(parisNow());return pl.length?pl.map(p=>fh(p[0])+' – '+fh(p[1])).join(' · '):t('hor_ferme')}
function ouvertHTML(){const n=parisNow(),pl=plages(n),x=n.h+n.mi/60,o=pl.some(p=>x>=p[0]&&x<p[1]);return`<span class="ouvert${pl.length?'':' ferme'}"><i></i>${pl.length?t('ouv'):t('fer')}${pl.length?' · '+horairesTxt():''}</span>`}

function carteVin(v){const p=v.v[0];return`<article class="carte-vin"><a class="img" href="#/vin/${v.id}"><img src="${bimg(v.id)}" alt="${v.n}" loading="lazy" width="420" height="420"></a><div class="corps"><div>${etiqs(v)}</div><h3><a href="#/vin/${v.id}">${v.n}</a></h3><div class="bas"><span class="prix">${eur(p[1])}${p[2]?`<s>${eur(p[2])}</s>`:''}</span><button class="ajout" data-ajout="${v.id}" aria-label="${t('ajouter')} : ${v.n}">${ICO.plus}</button></div><small class="doux">${p[0]==='coffret'||p[0]==='box'?t('coffret'):p[0]+' · '+cond(p[3])}</small></div></article>`}
function cond(s){return s===6?t('c6'):s===3?t('c3'):t('c1')}
function etiqs(v){const c=v.col==='spirit'?t('spirit'):v.col==='mix'?t('mix'):t(v.col);return`<span class="etiq ${v.col==='rose'?'rose':''}">${c}</span> ${v.lab.includes('Bio')?'<span class="etiq bio">Bio</span>':''}${v.v[0][2]?` <span class="etiq">${t('promo')}</span>`:''}`}

/* panier */
function sauver(){store.set('panier',PANIER);$('#nb').textContent=PANIER.reduce((a,l)=>a+l.q,0)}
function ajouter(id,i=0,q){const v=vin(id);if(!v)return;const p=v.v[i];q=q||p[3];const l=PANIER.find(x=>x.id===id&&x.i===i);if(l)l.q+=q;else PANIER.push({id,i,q});sauver();toast(t('pa_ajoute')+' · '+v.n);$('#chat').classList.contains('on')?0:ouvrirPanier()}
function total(){return PANIER.reduce((a,l)=>{const v=vin(l.id);return a+(v?v.v[l.i][1]*l.q:0)},0)}
function tiroir(){const st=total(),liv=st>=120||!st?0:15;$('#tiroir').innerHTML=`<div class="tiroir-t"><h2 style="font-size:1.6rem">${t('pa_t')}</h2><button class="fermer" data-fermer aria-label="Fermer">${ICO.x}</button></div><div class="tiroir-c">${PANIER.length?PANIER.map((l,k)=>{const v=vin(l.id),p=v.v[l.i];return`<div class="ligne-p"><img src="${bimg(v.id)}" alt=""><div><b style="font-weight:500;font-size:.92rem">${v.n}</b><br><small class="doux">${p[0]==='coffret'||p[0]==='box'?t('coffret'):p[0]} · ${eur(p[1])}</small><div class="qte" style="margin-top:6px"><button data-pq="${k}" data-d="-1" aria-label="−">−</button><output class="num">${l.q}</output><button data-pq="${k}" data-d="1" aria-label="+">+</button></div></div><div style="text-align:right"><b class="num" style="font-weight:500">${eur(p[1]*l.q)}</b><br><button class="lien" style="font-size:.8rem" data-pr="${k}">${t('retirer')}</button></div></div>`}).join(''):`<p class="vide" style="margin-top:20px">${t('pa_vide')}</p>`}</div>
${PANIER.length?`<div class="tiroir-b"><div style="display:flex;justify-content:space-between"><span>${t('pa_st')}</span><b class="num" style="font-weight:500">${eur(st)}</b></div><div style="display:flex;justify-content:space-between"><span>${t('pa_liv')}</span><span class="num">${liv?eur(liv):t('pa_off')}</span></div>${st<120?`<p class="jauge">${t('pa_reste',{x:eur(120-st)})}</p>`:''}<button class="btn btn-plein" data-cmd>${t('pa_cmd')} · ${eur(st+liv)}</button><p class="jauge">${t('pa_demo')}</p></div>`:''}`}
function ouvrirPanier(){tiroir();$('#tiroir').classList.add('on');$('#voile').classList.add('on')}
function fermerPanier(){$('#tiroir').classList.remove('on');$('#voile').classList.remove('on')}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}

function bulle(h,c='c'){const f=$('#chat-fil');const d=document.createElement('div');d.className='bulle '+c;d.innerHTML=h;f.appendChild(d);f.scrollTop=f.scrollHeight}
function repondre(q){const s=q.toLowerCase();let r='';const plat=Object.keys(PLATKW).find(k=>PLATKW[k].test(s));const bud=(s.match(/(\d{2,3})\s*(€|eur|euro)/)||[])[1];
if(KW.incon.test(s)&&!/(20(25|24|23|21|16))/.test(s)&&!KW.evt.test(s))r=t('ca_inconnu');
else if(KW.cmp.test(s))r=tx({fr:"La Lampe de Méduse est la cuvée iconique, dans sa bouteille de 1950 ; La Chapelle est la cuvée d'exception, plus rare, à servir à table.",en:"Lampe de Méduse is the iconic cuvée, in its 1950 bottle; La Chapelle is the rarer, exceptional cuvée, for the table.",es:"Lampe de Méduse es la cuvée icónica, en su botella de 1950; La Chapelle es la cuvée excepcional, más rara, para la mesa.",de:"Lampe de Méduse ist die Kult-Cuvée in der Flasche von 1950; La Chapelle ist die seltenere Ausnahme-Cuvée für den Tisch.",it:"Lampe de Méduse è la cuvée iconica, nella bottiglia del 1950; La Chapelle è la cuvée d'eccezione, più rara, da tavola.",nl:"Lampe de Méduse is de iconische cuvée in de fles uit 1950; La Chapelle is de zeldzamere topcuvée, voor aan tafel."})+['lampe-de-meduse-rose-2025','la-chapelle-de-sainte-roseline-rose-2025'].map(mini).join('');
else if(bud&&KW.cadeau.test(s)){const l=VINS.filter(v=>v.fam==='coffrets'&&v.v[0][1]<=+bud);r=(l.length?t('ca_cadeau')+l.map(v=>mini(v.id)).join(''):t('ca_cadeau')+mini('coffret-iconique-lampe-de-meduse-en-3-couleurs'))}
else if(plat){const l=VINS.filter(v=>PLATS[plat].test(v.acc.fr||'')).slice(0,3);r=t('ca_reco')+l.map(v=>mini(v.id)).join('')}
else if(KW.cadeau.test(s))r=t('ca_cadeau')+['coffret-iconique-lampe-de-meduse-en-3-couleurs','coffret-signature-rose-nos-crus-classes-en-rose','box-signature-lampe-de-meduse-3-couleurs'].map(mini).join('');
