y una zona infantil con bañera en el bloque de abajo.", "bot.a.region": "En los alrededores: La Voulte-sur-Rhône (3 km, mercado el viernes), viñedos del Ródano (20 km), Drôme provenzal (39 km), Meseta del Ardèche (60 km), Gargantas del Ardèche (94 km).", "emp.lead": "Parcelas de 80 a 150 m² con electricidad de 6 o 10 A, separadas por árboles y setos, tanto en el terreno de arriba como en el de abajo."}, "de": {"meta.title": "Camping La Garenne — Saint-Laurent-du-Pape, Eyrieux-Tal, Ardèche", "ui.book": "Online buchen", "ui.call": "Anrufen", "ui.more": "Seite ansehen", "ui.close": "Schließen", "ui.lang": "Sprache", "ui.from": "ab", "ui.night": "Nacht", "ui.add": "Zu meinem Aufenthalt hinzufügen", "ui.added": "Hinzugefügt", "ui.mine": "Mein Aufenthalt", "ui.video": "Video vom Campingplatz", "ui.street": "Google Street View", "ui.pdf": "Preise 2027 als PDF", "ui.replay": "Noch einmal fahren", "nav.camping": "Der Campingplatz", "nav.emplacements": "Stellplätze", "nav.mobilhomes": "Mobilheime", "nav.safari": "Safarizelte", "nav.tarifs": "Preise 2027", "nav.sejour": "Aufenthalt berechnen", "nav.bistro": "Le Bistro", "nav.region": "Die Region", "nav.infos": "Gut zu wissen", "nav.plan": "Lageplan", "nav.contact": "Kontakt", "nav.conseil": "Garenne Conseil", "nav.cgv": "Bedingungen & Platzordnung", "nav.conf": "Datenschutz", "top.open": "Geöffnet vom 28. März bis 21. Oktober 2027", "home.h1": "Ein Campingplatz im besten Sinne überschaubar, direkt an der Dolce Via.", "home.lead": "119 Stellplätze am Waldrand, 5 Gehminuten vom Dorf Saint-Laurent-du-Pape entfernt, im Eyrieux-Tal. L-förmiger Pool, Mobilheime, Safarizelte und ein Bistro mit Hausmannskost.", "home.hosts": "Judith Martojo-van der Meer und Nils Martojo heißen Sie willkommen.", "home.track": "Die Dolce Via verläuft direkt am Campingplatz: Die ehemalige Bahnstrecke führt das Eyrieux-Tal hinauf bis Le Cheylard.", "home.cta.calc": "Aufenthalt berechnen", "terr.h": "Zwei Plätze, zwei Atmosphären", "terr.haut.h": "Der obere Platz", "terr.haut": "Rezeption, Laden und Brotausgabe. Ruhige Stellplätze, ganz nah am Weg zum Dorf und zum Wald.", "terr.bas.h": "Der untere Platz", "terr.bas": "In einer kleinen Senke: der L-förmige Pool mit Planschbecken, das Restaurant, die Snackbar und ihre Terrasse mit Blick aufs Wasser. 25 Meter weiter unten.", "heb.h": "Wo Sie schlafen", "emp.short": "80 bis 150 m² · Strom 6 oder 10 A · 2 Personen inklusive", "mh.short": "Mobilheime „Evolution“ · oberer Platz · Hunde erlaubt", "sf.short": "XL-Safarizelte · eigenes Bad · 6 Personen", "calc.h": "Was kostet Ihr Aufenthalt?", "calc.p": "Die Preise stammen aus unseren Preisen 2027, inklusive Steuern und Gebühren.", "calc.heb": "Unterkunft", "calc.period": "Zeitraum", "calc.nights": "Nächte", "calc.adults": "Erwachsene (ab 13 Jahren)", "calc.k13": "Kinder von 1 bis 3 Jahren", "calc.k412": "Kinder von 4 bis 12 Jahren", "calc.pet": "Haustier", "calc.fridge": "Kühlschrank", "calc.total": "Schätzung", "calc.detail": "inklusive Kurtaxe, Umweltbeitrag und Buchungsgebühr", "calc.note": "Unverbindliche Schätzung auf Grundlage der Preise 2027. In der Hauptsaison (10. Juli-25. August) beträgt der Mindestaufenthalt 7 Nächte. Der genaue Preis wird bei der Buchung bestätigt.", "calc.min": "In der Hauptsaison beträgt der Mindestaufenthalt 7 Nächte.", "calc.cap": "Achtung: Diese Unterkunft bietet höchstens {n} Personen Platz.", "calc.e.xxl": "XXL-Stellplatz · 150 m² · 10 A", "calc.e.xl": "XL-Stellplatz · 120-130 m² · 10 A", "calc.e.10": "Stellplatz · 100-110 m² · 10 A", "calc.e.6": "Stellplatz · 100-110 m² · 6 A", "calc.e.velo": "Zeltbereich für Rad- und Wandertouristen (1 Pers.)", "calc.mh": "Mobilheim (max. 5 Pers.)", "calc.sf": "Safarizelt (max. 6 Pers.)", "calc.p.basse": "28. März-2. Juli und 5. September-21. Oktober", "calc.p.moy": "3.-9. Juli und 26. August-4. September", "calc.p.haute": "10. Juli-25. August", "camp.h": "Der Campingplatz", "camp.lead": "Zwei ebene Plätze und einige Terrassen, getrennt durch Bäume, Sträucher und kleine Flusskiesel-Mäuerchen, typisch für die Ardèche.", "camp.items": "Stellplätze von etwa 80 bis 150 m² · Strom von 6 bis 10 A auf jedem Stellplatz · Trinkwasserstellen über das Gelände verteilt · harter, felsiger Boden: bringen Sie spezielle Felsheringe mit (an der Rezeption erhältlich) · zwei moderne Sanitärgebäude, eines davon mit barrierefreiem Sanitärraum und Babybereich · gesicherter Spielplatz · Boulebahnen · Tischtennis unter der überdachten Terrasse der Bar · Kühlschrankverleih (Reservierung empfohlen)", "camp.activ": "Vor und nach der Hauptsaison: Boule-Nachmittage und Weinproben.", "mh.h": "Mobilheime", "mh.lead": "Auf dem oberen Platz, in ruhiger Lage.", "mh.items": "Kapazität: 4 Personen (laut Preisen 2027 höchstens 5) · 5 Kissen und 5 Bettdecken · Bettwäscheverleih möglich · Babybett und Hochstuhl auf Anfrage · Hunde in den Mobilheimen „Evolution“ erlaubt · Nichtraucher · Anreise ab 16 Uhr · Abreise vor 10 Uhr", "mh.check": "Ihre Website nennt auf der Seite Mobilheime „4 Personen“ und im Preis-PDF „höchstens 5 Personen“: bitte bestätigen.", "sf.h": "XL-Safarizelte", "sf.lead": "Für Urlaub unter Zeltdach, mit eigenem Bad, bis zu 6 Personen. Sie sind auf dem Lageplan violett markiert.", "sf.items": "6 Kissen und 6 Bettdecken · Bettwäscheverleih möglich · Babybett und Hochstuhl auf Anfrage · Hunde erlaubt · Nichtraucher · Anreise ab 16 Uhr · Abreise vor 10 Uhr", "tarifs.h": "Preise 2027", "tarifs.lead": "Geöffnet vom 28. März bis 21. Oktober 2027. Preise pro Nacht.", "tarifs.emp": "Stellplätze (2 Personen, 1 Auto, Strom, Warmwasser und Pool inklusive)", "tarifs.sup": "Zuschläge pro Nacht", "tarifs.loc": "Mobilheime und Safarizelte (Preis pro Nacht)", "tarifs.locsup": "Zuschläge Vermietung", "tarifs.s.k13": "Kind von 1 bis 3 Jahren", "tarifs.s.k412": "Kind von 4 bis 12 Jahren", "tarifs.s.p13": "Person ab 13 Jahren", "tarifs.s.tente": "Zusätzliches Zelt: kostenlos", "tarifs.s.frigo": "Kühlschrank", "tarifs.s.pet": "Haustier", "tarifs.s.car": "Zusätzliches Auto (Parkplatz)", "tarifs.l.menage": "Obligatorische Endreinigung: 67 € pro Aufenthalt", "tarifs.l.pet": "Haustier: 5 € pro Nacht", "tarifs.l.car": "Zusätzliches Auto: 6 € pro Nacht", "tarifs.l.lit": "Babybett: 3,50 € pro Nacht · Hochstuhl: 1,50 € pro Nacht", "tarifs.l.linge": "Bettwäsche: 18 € pro Person und Aufenthalt (Bettdecken inklusive)", "tarifs.taxes": "Kurtaxe: 0,61 € pro Erwachsenem und Nacht · Umweltbeitrag: 1,10 € pro Nacht und Stellplatz bzw. Unterkunft · Buchungsgebühr: 17,50 €", "tarifs.rules": "Nur eine Familie pro Stellplatz, höchstens 6 Personen · zusätzliche Autos auf dem Parkplatz · Hauptsaison (10. Juli-25. August): mindestens 7 Nächte, außer im Radfahrerbereich · keine Autos im Radfahrerbereich", "tarifs.cartes": "ACSI-, CKE- (ANWB) und ADAC-Karten werden bis einschließlich 7. Juli und ab 25. August akzeptiert.", "tarifs.col.basse": "28.03.-02.07. und 05.09.-21.10.", "tarifs.col.moy": "03.07.-09.07. und 26.08.-04.09.", "tarifs.col.haute": "10.07.-25.08.", "bistro.h": "Le Bistro", "bistro.lead": "Das Restaurant und die Snackbar, auf der Terrasse mit Blick auf den Pool: kalte und heiße Getränke, hausgemachte Gerichte.", "indo.h": "Mittwochs: indonesischer Abend", "indo.p": "Gemeinsam mit dem Team kocht Nils indonesisch: Nasi Goreng, Rendang, Sambal Goreng Telor, Gado Gado, Ajam Pedis, Saté, dazu Garnelenbeignets, scharfe Ananas und Saté-Sauce. Alles ist hausgemacht.", "bistro.note": "Die Karte des Bistros und seine Öffnungszeiten (Seite „Restaurant“ Ihrer Website, die derzeit einen Fehler anzeigt) werden gemeinsam mit Ihnen übernommen.", "pool.h": "Pool und Planschbecken", "pool.p": "Ein schöner L-förmiger Pool und ein Planschbecken auf dem unteren Platz, während der Öffnungszeiten im Stellplatzpreis inbegriffen. Badebekleidung ist Pflicht: Boxershorts und Bermudas sind nicht erlaubt. Hunde haben im Poolbereich keinen Zutritt.", "reg.h": "Die Region", "reg.lead": "Radfahren, Wandern, Kanu, Bergdörfer: Die Ardèche beginnt am Tor des Campingplatzes.", "reg.velo.h": "Radfahren", "reg.velo": "Die Dolce Via verläuft am Campingplatz entlang und führt das Eyrieux-Tal hinauf bis Le Cheylard, auf einer ehemaligen Bahnstrecke. Die Via Rhôna, flach, folgt der Rhône Richtung Valence, Tournon oder Privas.", "reg.canoe.h": "Kanu & Kajak", "reg.canoe": "Der Unterlauf der Ardèche, ab dem Pont d’Arc, ist spektakulär.", "reg.klim.h": "Klettern", "reg.klim": "Klettern, kraxeln, an der Seilrutsche hinabgleiten: ein Tag voller Herausforderungen, mit einem Parcours ab 2 Jahren.", "reg.voulte": "3 km entfernt: das mittelalterliche Dorf La Voulte-sur-Rhône und sein Markt am Freitagvormittag zu Füßen der Burg.", "reg.sites.h": "Unsere Lieblingsorte", "reg.sites": [["Ardèche-Schluchten und Pont d’Arc", "94 km", "Der Pont d’Arc, ein vom Fluss geformter Felsbogen, öffnet die Schluchten, ein Naturschutzgebiet. Grotte de la Madeleine und Aven de Marzal."], ["Balazuc", "—", "Eines der schönsten Dörfer Frankreichs, an die Felsen über der Ardèche geschmiegt, mit seiner romanischen Kirche."], ["Ardèche-Hochebene", "60 km", "Der Naturpark Monts d’Ardèche: erloschene Vulkane (Mont Mézenc, Gerbier de Jonc, Suc de Sara), Basaltdörfer wie Borée und Antraigues."], ["Wasserfall Ray-Pic", "63 km", "Ein 60 m hoher Wasserfall entlang von Basaltorgeln."], ["Wasserfall der Druise", "65 km", "Ein 60 m hoher Wasserfall, den die Gervanne bildet."], ["Die Drôme", "10 min", "Vom Drôme-Tal bis zu den Schluchten von Omblèze, dazu die Clairette de Die, der Schaumwein der Gegend."], ["Vercors", "66 km", "Kalkfelsen und Fichtenwälder, Combe Laval und Grands Goulets."], ["Provenzalische Drôme und Trois Becs", "39 km", "Hügel, Bergdörfer, Weinreben, Sonnenblumen und Lavendel; das Tricastin und seine Trüffel."], ["Weinberge des Rhône-Tals", "20 km", "Die nördlichen Côtes-du-Rhône: Hermitage, Saint-Joseph, Cornas, Saint-Péray, Condrieu, Côte-Rôtie."]], "reg.note": "Zusammengefasste Texte auf Deutsch nach Ihren Tourismus-Seiten, die in der französischen Version derzeit auf Niederländisch sind.", "infos.h": "Gut zu wissen", "infos.items": [["Frisches Brot und Laden", "Der Bäcker aus Beauchastel liefert täglich Brot und Gebäck: bitte am Vortag bestellen. Kleiner Laden für den Notfall vor Ort, Supermärkte in 3 km."], ["Grill und Feuer", "Verboten (Präfekturverfügung: trockenes Klima, Wald in der Nähe), sowohl mit Holzkohle als auch mit Gas. Garen ohne direkten Kontakt mit der Flamme, wie beim Scottelbraai, ist erlaubt."], ["Strom", "6 A (1 380 W) auf allen Stellplätzen. Blaue wasserdichte CEE-Steckdosen und Neoprenkabel (H07RNF, 07RN oder RN), Verlängerungskabel inbegriffen."], ["Internet", "Kostenloses WLAN, an der Rezeption am besten; Zugangsdaten an der Rezeption. Das Netz deckt noch nicht den gesamten Campingplatz ab."], ["Hunde", "Willkommen! Wald hinter dem Campingplatz, Baden im Eyrieux in 10 Gehminuten möglich. Auf dem Campingplatz an der Leine, im Poolbereich nicht erlaubt."], ["Kühlschränke", "Tischmodelle von etwa 84 × 54 × 53 cm, mit Ablagen, Gemüsefach und Türfächern. Begrenzte Anzahl: bitte reservieren."], ["Barrierefreie Sanitäranlagen", "Toilette, Dusche und Waschbecken im unteren Sanitärgebäude; persönlicher Schlüssel auf Anfrage."], ["Kinder und Babys", "Kinderbereich im unteren Sanitärgebäude: Badewanne, Kinderdusche und Kindertoilette, Wickeltisch, Waschbecken."], ["Pool", "Badebekleidung ist Pflicht: Boxershorts und Bermudas sind nicht erlaubt."]], "contact.h": "Kontakt", "contact.lead": "Antwort in der Regel innerhalb von zwei Tagen. Wir sind nicht der Camping La Garenne in Bédoin am Fuß des Mont Ventoux.", "contact.addr": "383 montée de La Garenne · 07800 Saint-Laurent-du-Pape · Ardèche", "contact.tel.h": "Telefonisch", "contact.tel.open": "Während der Öffnungszeit (1. April-30. September): 8:30-11:30 Uhr und 14:00-18:30 Uhr, bei Notfällen und kurzfristigen Aufenthalten manchmal bis 20 Uhr. Hinterlassen Sie eine Nachricht, wir rufen Sie zurück.", "contact.tel.closed": "Außerhalb der Saison: Montag, Dienstag, Donnerstag und Freitag, 9-11 Uhr und 14-16 Uhr. Am Wochenende und in den Schulferien schreiben Sie uns bitte lieber.", "contact.bureau": "Rezeption: täglich, 8-12 Uhr und 14:30-19 Uhr (je nach Saison).", "contact.langs": "Das ganze Team spricht Englisch, manche Französisch, andere Niederländisch.", "f.nom": "Name", "f.email": "E-Mail", "f.sujet": "Betreff", "f.msg": "Nachricht", "f.send": "Senden", "f.ok": "Vielen Dank! In der Online-Version geht Ihre Nachricht an den Campingplatz. Hier handelt es sich um einen Entwurf: Es wird nichts gesendet.", "f.err": "Bitte geben Sie Ihren Namen, Ihre E-Mail-Adresse und Ihre Nachricht ein.", "f.projet": "Aus „Mein Aufenthalt“:", "mine.h": "Mein Aufenthalt", "mine.empty": "Noch nichts. Fügen Sie auf den Seiten eine Unterkunft oder einen Ausflug hinzu.", "mine.go": "Meine Anfrage senden", "plan.h": "Lageplan des Campingplatzes", "plan.p": "Die Safarizelte sind auf dem Lageplan violett markiert.", "cgv.h": "Allgemeine Geschäftsbedingungen und Platzordnung", "cgv.note": "Offizieller Text auf Französisch, unverändert von Ihrer Website übernommen.", "conf.h": "Datenschutzerklärung", "conf.p": "Die Daten aus dem Formular dienen ausschließlich der Beantwortung Ihrer Anfrage. Der vollständige Text Ihrer aktuellen Datenschutzerklärung wird bei der Installation übernommen.", "legal": "SARL La Garenne au capital de 9 147,50 € · SIRET 350 350 401 00013 · RCS Aubenas B 350 350 401 · TVA FR52 350 350 401", "foot.tag": "Familiencampingplatz mit 119 Stellplätzen im Eyrieux-Tal in der Ardèche.", "foot.maquette": "Vorschlag für einen Relaunch von Neovera Studio — unverbindlicher Entwurf.", "bot.name": "Garenne Conseil", "bot.sub": "Ich helfe Ihnen bei der Wahl", "bot.virtual": "Virtueller Assistent", "bot.hello": "Guten Tag! Ich bin der virtuelle Assistent des Camping La Garenne. Stellplätze, Unterkünfte, Preise, Pool, Hunde, Region: Stellen Sie Ihre Frage.", "bot.invite": "Eine Frage zu Ihrem Aufenthalt in der Ardèche?", "bot.ph": "Schreiben Sie Ihre Frage…", "bot.send": "Senden", "bot.chips": ["Preis eines Stellplatzes im Juli", "Mobilheim oder Safarizelt?", "Sind Hunde erlaubt?", "Ist Grillen erlaubt?", "Indonesischer Abend", "Buchen"], "bot.unknown": "Ich bin nicht sicher, ob ich das richtig beantworten kann. Am einfachsten: Rufen Sie 04 75 62 24 62 an oder schreiben Sie an info@campinglagarenne-ardeche.fr.", "bot.a.prix": "Pro Nacht, 2 Personen inklusive: Stellplatz mit 6 A von 31,10 € bis 48,95 €, mit 10 A von 35,70 € bis 51,80 €, XL von 38,55 € bis 54,55 €, XXL von 42,50 € bis 58,50 €, je nach Zeitraum. Der Rechner ermittelt die Gesamtsumme inklusive Steuern.", "bot.a.loc": "Mobilheim: höchstens 5 Personen, von 57,25 € bis 199,50 € pro Nacht. XL-Safarizelt mit eigenem Bad: 6 Personen, von 75 € bis 228 € pro Nacht. Endreinigung: 67 €.", "bot.a.chien": "Ja! Hunde sind auf den Stellplätzen, in den Mobilheimen „Evolution“ und in den Safarizelten willkommen. Auf dem Campingplatz an der Leine, nicht im Poolbereich. Zuschlag: 3,10 bis 4,10 €/Nacht auf dem Stellplatz, 5 €/Nacht bei Vermietung.", "bot.a.bbq": "Nein: Feuer und Grillen mit Holzkohle oder Gas sind per Präfekturverfügung verboten. Garen ohne direkten Kontakt mit der Flamme, wie beim Scottelbraai, ist erlaubt.", "bot.a.indo": "Jeden Mittwoch kochen Nils und das Team indonesisch: Nasi Goreng, Rendang, Saté, Gado Gado … alles hausgemacht.", "bot.a.resa": "Buchen Sie online über die Schaltfläche „Online buchen“ (Buchungsgebühr: 17,50 €) oder rufen Sie 04 75 62 24 62 an.", "bot.a.dispo": "Ich sehe die Verfügbarkeit nicht in Echtzeit. Am sichersten: die Online-Buchung oder ein Anruf unter 04 75 62 24 62.", "bot.a.dates": "Geöffnet vom 28. März bis 21. Oktober 2027. In der Hauptsaison (10. Juli-25. August) mindestens 7 Nächte. Vermietung: Anreise ab 16 Uhr, Abreise vor 10 Uhr.", "bot.a.piscine": "L-förmiger Pool und Planschbecken auf dem unteren Platz, im Preis inbegriffen. Badebekleidung ist Pflicht.", "bot.a.velo": "Die Dolce Via verläuft am Campingplatz entlang und führt das Eyrieux-Tal hinauf bis Le Cheylard. Es gibt außerdem einen Zeltbereich für Rad- und Wandertouristen, ab 12,50 € pro Nacht.", "bot.a.wifi": "Kostenloses WLAN, an der Rezeption am besten; Zugangsdaten an der Rezeption.", "bot.a.elec": "Strom mit 6 oder 10 A, je nach Stellplatz. Blaue wasserdichte CEE-Steckdosen und Neoprenkabel sind Pflicht.", "bot.a.pain": "Der Bäcker liefert täglich Brot und Gebäck: bitte am Vortag an der Rezeption bestellen. Kleiner Laden für den Notfall vor Ort.", "bot.a.cartes": "ACSI-, CKE- (ANWB) und ADAC-Karten werden bis einschließlich 7. Juli und ab 25. August akzeptiert.", "bot.a.langue": "Das ganze Team spricht Englisch, manche Französisch, andere Niederländisch.", "bot.a.bebe": "Babybett (3,50 €/Nacht) und Hochstuhl (1,50 €/Nacht) auf Anfrage, dazu ein Kinderbereich mit Badewanne im unteren Sanitärgebäude.", "bot.a.region": "In der Umgebung: La Voulte-sur-Rhône (3 km, Markt am Freitag), Weinberge der Rhône (20 km), Provenzalische Drôme (39 km), Ardèche-Hochebene (60 km), Ardèche-Schluchten (94 km).", "emp.lead": "Stellplätze von 80 bis 150 m² mit Strom (6 oder 10 A), durch Bäume und Hecken getrennt, auf dem oberen wie auf dem unteren Gelände."}, "it": {"meta.title": "Camping La Garenne — Saint-Laurent-du-Pape, valle dell'Eyrieux, Ardèche", "ui.book": "Prenota online", "ui.call": "Chiama", "ui.more": "Vai alla pagina", "ui.close": "Chiudi", "ui.lang": "Lingua", "ui.from": "da", "ui.night": "notte", "ui.add": "Aggiungi al mio soggiorno", "ui.added": "Aggiunto", "ui.mine": "Il mio soggiorno", "ui.video": "Video del campeggio", "ui.street": "Google Street View", "ui.pdf": "Tariffe 2027 in PDF", "ui.replay": "Ancora un giro", "nav.camping": "Il campeggio", "nav.emplacements": "Piazzole", "nav.mobilhomes": "Case mobili", "nav.safari": "Tende safari", "nav.tarifs": "Tariffe 2027", "nav.sejour": "Calcola il mio soggiorno", "nav.bistro": "Le Bistro", "nav.region": "La regione", "nav.infos": "Da sapere", "nav.plan": "Mappa", "nav.contact": "Contatti", "nav.conseil": "Garenne Conseil", "nav.cgv": "Condizioni e regolamento", "nav.conf": "Privacy", "top.open": "Aperto dal 28 marzo al 21 ottobre 2027", "home.h1": "Un campeggio a misura d'uomo, sulla Dolce Via.", "home.lead": "119 piazzole al limitare del bosco, a 5 minuti a piedi dal villaggio di Saint-Laurent-du-Pape, nella valle dell'Eyrieux. Piscina a forma di L, case mobili, tende safari e un bistro dove si cucina in casa.", "home.hosts": "Judith Martojo-van der Meer e Nils Martojo Le danno il benvenuto.", "home.track": "La Dolce Via passa accanto al campeggio: l'antica ferrovia risale la valle dell'Eyrieux fino a Le Cheylard.", "home.cta.calc": "Calcola il mio soggiorno", "terr.h": "Due aree, due atmosfere", "terr.haut.h": "L'area alta", "terr.haut": "Reception, negozio e consegna del pane. Piazzole tranquille, vicinissime al sentiero che porta al villaggio e al bosco.", "terr.bas.h": "L'area bassa", "terr.bas": "In una piccola valletta: la piscina a L con vasca per bambini, il ristorante, lo snack-bar e la sua terrazza con vista sull'acqua. 25 metri più in basso.", "heb.h": "Dove dormire", "emp.short": "80-150 m² · elettricità 6 o 10 A · 2 pers. incluse", "mh.short": "Case mobili «Evolution» · area alta · cani ammessi", "sf.short": "Tende safari XL · bagno privato · 6 persone", "calc.h": "Quanto costa il Suo soggiorno?", "calc.p": "I prezzi derivano dalle nostre tariffe 2027, tasse e spese incluse.", "calc.heb": "Alloggio", "calc.period": "Periodo", "calc.nights": "Notti", "calc.adults": "Adulti (13 anni e oltre)", "calc.k13": "Bambini da 1 a 3 anni", "calc.k412": "Bambini da 4 a 12 anni", "calc.pet": "Animale", "calc.fridge": "Frigorifero", "calc.total": "Stima", "calc.detail": "di cui tassa di soggiorno, contributo ambientale e spese di prenotazione", "calc.note": "Stima indicativa basata sulle tariffe 2027. In alta stagione (10 luglio-25 agosto) il soggiorno minimo è di 7 notti. Il prezzo esatto viene confermato al momento della prenotazione.", "calc.min": "In alta stagione il soggiorno minimo è di 7 notti.", "calc.cap": "Attenzione: questo alloggio ospita al massimo {n} persone.", "calc.e.xxl": "Piazzola XXL · 150 m² · 10 A", "calc.e.xl": "Piazzola XL · 120-130 m² · 10 A", "calc.e.10": "Piazzola · 100-110 m² · 10 A", "calc.e.6": "Piazzola · 100-110 m² · 6 A", "calc.e.velo": "Area tende per ciclisti ed escursionisti (1 pers.)", "calc.mh": "Casa mobile (max. 5 pers.)", "calc.sf": "Tenda safari (max. 6 pers.)", "calc.p.basse": "28 marzo-2 luglio e 5 settembre-21 ottobre", "calc.p.moy": "3-9 luglio e 26 agosto-4 settembre", "calc.p.haute": "10 luglio-25 agosto", "camp.h": "Il campeggio", "camp.lead": "Due aree pianeggianti con qualche terrazzamento, separate da alberi, arbusti e muretti di ciottoli di fiume, tipici dell'Ardèche.", "camp.items": "Piazzole di circa 80-150 m² · elettricità da 6 a 10 A su ogni piazzola · punti acqua potabile distribuiti nel campeggio · terreno duro e roccioso: portate picchetti speciali per roccia (in vendita alla reception) · due blocchi servizi moderni, uno con bagno per persone con disabilità e area bebè · area giochi sicura · campi da petanque · ping-pong sotto la terrazza coperta del bar · noleggio frigoriferi (prenotazione consigliata)", "camp.activ": "Prima e dopo l'alta stagione: pomeriggi di petanque e degustazioni di vino.", "mh.h": "Case mobili", "mh.lead": "Nell'area alta, in un angolo tranquillo.", "mh.items": "Capienza: 4 persone (5 al massimo secondo le tariffe 2027) · 5 cuscini e 5 piumoni · noleggio lenzuola possibile · culla e seggiolone su richiesta · cani ammessi nelle case mobili «Evolution» · vietato fumare · arrivo dalle 16 · partenza entro le 10", "mh.check": "Il Suo sito indica «4 persone» nella pagina Case mobili e «5 persone al massimo» nel PDF delle tariffe: da confermare.", "sf.h": "Tende safari XL", "sf.lead": "Per una vacanza sotto tela, con bagno privato, fino a 6 persone. Sulla mappa sono in viola.", "sf.items": "6 cuscini e 6 piumoni · noleggio lenzuola possibile · culla e seggiolone su richiesta · cani ammessi · vietato fumare · arrivo dalle 16 · partenza entro le 10", "tarifs.h": "Tariffe 2027", "tarifs.lead": "Aperto dal 28 marzo al 21 ottobre 2027. Prezzi a notte.", "tarifs.emp": "Piazzole (2 persone, 1 auto, elettricità, acqua calda e piscina inclusi)", "tarifs.sup": "Supplementi a notte", "tarifs.loc": "Case mobili e tende safari (prezzo a notte)", "tarifs.locsup": "Supplementi alloggi", "tarifs.s.k13": "Bambino da 1 a 3 anni", "tarifs.s.k412": "Bambino da 4 a 12 anni", "tarifs.s.p13": "Persona di 13 anni e oltre", "tarifs.s.tente": "Tenda supplementare: gratuita", "tarifs.s.frigo": "Frigorifero", "tarifs.s.pet": "Animale", "tarifs.s.car": "Auto supplementare (parcheggio)", "tarifs.l.menage": "Pulizie finali obbligatorie: 67 € a soggiorno", "tarifs.l.pet": "Animale: 5 € a notte", "tarifs.l.car": "Auto supplementare: 6 € a notte", "tarifs.l.lit": "Culla: 3,50 € a notte · seggiolone: 1,50 € a notte", "tarifs.l.linge": "Biancheria da letto: 18 € a persona a soggiorno (piumoni forniti)", "tarifs.taxes": "Tassa di soggiorno: 0,61 € per adulto a notte · contributo ambientale: 1,10 € a notte per piazzola o alloggio · spese di prenotazione: 17,50 €", "tarifs.rules": "Una sola famiglia per piazzola, al massimo 6 persone · auto supplementari nel parcheggio · alta stagione (10 luglio-25 agosto): minimo 7 notti, tranne l'area ciclisti · nessuna auto nell'area ciclisti", "tarifs.cartes": "Carte ACSI, CKE (ANWB) e ADAC accettate fino al 7 luglio incluso e dal 25 agosto.", "tarifs.col.basse": "28/03-02/07 e 05/09-21/10", "tarifs.col.moy": "03/07-09/07 e 26/08-04/09", "tarifs.col.haute": "10/07-25/08", "bistro.h": "Le Bistro", "bistro.lead": "Il ristorante e lo snack-bar, sulla terrazza che si affaccia sulla piscina: bevande fresche o calde, piatti fatti in casa.", "indo.h": "Il mercoledì, serata indonesiana", "indo.p": "Insieme alla squadra, Nils prepara la cucina indonesiana: nasi goreng, rendang, sambal goreng telor, gado gado, ajam pedis, satay, con frittelle di gamberi, ananas piccante e salsa satay. Tutto fatto in casa.", "bistro.note": "Il menù del Bistro e i suoi orari (pagina «Ristorante» del Suo sito, attualmente in errore) verranno ripresi insieme a Lei.", "pool.h": "Piscina e vasca per bambini", "pool.p": "Una bella piscina a forma di L e una vasca per bambini, nell'area bassa, comprese nel prezzo della piazzola durante il periodo di apertura. Costume da bagno obbligatorio: boxer e bermuda non ammessi. Cani non ammessi nell'area della piscina.", "reg.h": "La regione", "reg.lead": "Bicicletta, escursioni, canoa, villaggi arroccati: l'Ardèche comincia al cancello del campeggio.", "reg.velo.h": "Bicicletta", "reg.velo": "La Dolce Via costeggia il campeggio e risale la valle dell'Eyrieux fino a Le Cheylard, su un'antica ferrovia. La Via Rhôna, pianeggiante, segue il Rodano verso Valence, Tournon o Privas.", "reg.canoe.h": "Canoa e kayak", "reg.canoe": "Il corso inferiore dell'Ardèche, con partenza dal Pont d'Arc, è spettacolare.", "reg.klim.h": "Arrampicata", "reg.klim": "Arrampicarsi, sgambettare, scendere in teleferica: una giornata di sfide, con un percorso già dai 2 anni.", "reg.voulte": "A 3 km, il villaggio medievale di La Voulte-sur-Rhône e il suo mercato del venerdì mattina ai piedi del castello.", "reg.sites.h": "I nostri luoghi del cuore", "reg.sites": [["Gole dell'Ardèche e Pont d'Arc", "94 km", "Il Pont d'Arc, arco naturale scavato dal fiume, apre le gole, riserva naturale protetta. Grotte della Madeleine e Aven de Marzal."], ["Balazuc", "—", "Uno dei più bei villaggi di Francia, aggrappato alle falesie sopra l'Ardèche, con la sua chiesa romanica."], ["Altopiano dell'Ardèche", "60 km", "Il Parco naturale dei Monti d'Ardèche: vulcani spenti (Mont Mézenc, Gerbier de Jonc, Suc de Sara), villaggi di basalto come Borée e Antraigues."], ["Cascata del Ray-Pic", "63 km", "Un salto di 60 m lungo le canne d'organo di basalto."], ["Cascata della Druise", "65 km", "Una cascata di 60 m formata dalla Gervanne."], ["La Drôme", "10 min", "Dalla valle della Drôme alle gole di Omblèze, e la Clairette de Die, spumante locale."], ["Vercors", "66 km", "Falesie calcaree e foreste di abeti rossi, Combe Laval e Grands Goulets."], ["Drôme provenzale e Trois Becs", "39 km", "Colline, villaggi arroccati, vigne, girasoli e lavanda; il Tricastin e i suoi tartufi."], ["Vigneti della valle del Rodano", "20 km", "I côtes-du-rhône settentrionali: Hermitage, Saint-Joseph, Cornas, Saint-Péray, Condrieu, Côte-Rôtie."]], "reg.note": "Testi riassunti in italiano a partire dalle Sue pagine Turismo, attualmente in olandese nella versione francese.", "infos.h": "Da sapere", "infos.items": [["Pane fresco e negozio", "Il panettiere di Beauchastel consegna pane e viennoiserie ogni giorno: ordini il giorno prima. Piccolo emporio in loco, supermercati a 3 km."], ["Barbecue e fuoco", "Vietati (ordinanza prefettizia: clima secco, bosco vicino), sia a carbone sia a gas. Sono ammesse le cotture senza contatto diretto con la fiamma, tipo scottelbraai."], ["Elettricità", "6 A (1 380 W) su tutte le piazzole. Prese CEE blu stagne e cavi in neoprene (H07RNF, 07RN o RN), prolunghe comprese."], ["Internet", "Wifi gratuito, migliore vicino alla reception; credenziali alla reception. La rete non copre ancora tutto il campeggio."], ["Cani", "Benvenuti! Bosco dietro il campeggio, bagno possibile nell'Eyrieux a 10 minuti a piedi. Al guinzaglio nel campeggio, vietati nell'area della piscina."], ["Frigoriferi", "Modelli da tavolo di circa 84 × 54 × 53 cm, con ripiani, cassetto per la verdura e balconcini. Numero limitato: prenoti."], ["Servizi per persone con disabilità", "WC, doccia e lavabo nel blocco in basso; chiave personale su richiesta."], ["Bambini e bebè", "Area bambini nel blocco in basso: vaschetta, doccia e WC per bambini, fasciatoio, lavabo."], ["Piscina", "Costume da bagno obbligatorio: boxer e bermuda non ammessi."]], "contact.h": "Contatti", "contact.lead": "Risposta in genere entro due giorni. Non siamo il camping La Garenne di Bédoin, ai piedi del Mont Ventoux.", "contact.addr": "383 montée de La Garenne · 07800 Saint-Laurent-du-Pape · Ardèche", "contact.tel.h": "Per telefono", "contact.tel.open": "Durante l'apertura (1° aprile-30 settembre): 8.30-11.30 e 14.00-18.30, a volte fino alle 20 per le urgenze e i soggiorni dell'ultimo minuto. Lasci un messaggio, La richiameremo.", "contact.tel.closed": "Fuori stagione: lunedì, martedì, giovedì e venerdì, 9.00-11.00 e 14.00-16.00. Nel fine settimana e durante le vacanze scolastiche, ci scriva piuttosto.", "contact.bureau": "Reception: tutti i giorni, 8.00-12.00 e 14.30-19.00 (secondo la stagione).", "contact.langs": "Tutta la squadra parla inglese, alcuni francese, altri olandese.", "f.nom": "Nome", "f.email": "E-mail", "f.sujet": "Oggetto", "f.msg": "Messaggio", "f.send": "Invia", "f.ok": "Grazie! Nella versione online, il Suo messaggio arriverà al campeggio. Qui si tratta di un prototipo: non viene inviato nulla.", "f.err": "Voglia compilare nome, e-mail e messaggio.", "f.projet": "Da «Il mio soggiorno»:", "mine.h": "Il mio soggiorno", "mine.empty": "Ancora niente. Aggiunga un alloggio o un'uscita dalle pagine del sito.", "mine.go": "Invia la mia richiesta", "plan.h": "Mappa del campeggio", "plan.p": "Le tende safari sono in viola sulla mappa.", "cgv.h": "Condizioni generali e regolamento interno", "cgv.note": "Testo ufficiale in francese, ripreso integralmente dal Suo sito.", "conf.h": "Informativa sulla privacy", "conf.p": "I dati del modulo servono unicamente a rispondere alla Sua richiesta. Il testo completo della Sua attuale informativa verrà ripreso al momento dell'installazione.", "legal": "SARL La Garenne au capital de 9 147,50 € · SIRET 350 350 401 00013 · RCS Aubenas B 350 350 401 · TVA FR52 350 350 401", "foot.tag": "Campeggio familiare di 119 piazzole nella valle dell'Eyrieux, in Ardèche.", "foot.maquette": "Proposta di rifacimento realizzata da Neovera Studio — prototipo non contrattuale.", "bot.name": "Garenne Conseil", "bot.sub": "La aiuto a scegliere", "bot.virtual": "Assistente virtuale", "bot.hello": "Buongiorno! Sono l'assistente virtuale del Camping La Garenne. Piazzole, alloggi, prezzi, piscina, cani, regione: mi faccia pure la Sua domanda.", "bot.invite": "Una domanda sul Suo soggiorno in Ardèche?", "bot.ph": "Scriva la Sua domanda…", "bot.send": "Invia", "bot.chips": ["Prezzo di una piazzola a luglio", "Casa mobile o tenda safari?", "I cani sono ammessi?", "Barbecue consentito?", "Serata indonesiana", "Prenotare"], "bot.unknown": "Non sono sicuro di poterLe rispondere bene. La cosa più semplice: chiami il 04 75 62 24 62 o scriva a info@campinglagarenne-ardeche.fr.", "bot.a.prix": "A notte, 2 persone incluse: piazzola 6 A da 31,10 € a 48,95 €, 10 A da 35,70 € a 51,80 €, XL da 38,55 € a 54,55 €, XXL da 42,50 € a 58,50 € a seconda del periodo. Il calcolatore fa il totale con le tasse.", "bot.a.loc": "Casa mobile: massimo 5 persone, da 57,25 € a 199,50 € a notte. Tenda safari XL con bagno privato: 6 persone, da 75 € a 228 € a notte. Pulizie finali: 67 €.", "bot.a.chien": "Sì! Cani benvenuti nelle piazzole, nelle case mobili «Evolution» e nelle tende safari. Al guinzaglio nel campeggio, non nell'area della piscina. Supplemento: 3,10-4,10 €/notte in piazzola, 5 €/notte negli alloggi.", "bot.a.bbq": "No: fuoco e barbecue a carbone o a gas sono vietati da ordinanza prefettizia. Sono ammesse le cotture senza contatto diretto con la fiamma, tipo scottelbraai.", "bot.a.indo": "Ogni mercoledì Nils e la squadra cucinano indonesiano: nasi goreng, rendang, satay, gado gado… tutto fatto in casa.", "bot.a.resa": "Prenoti online con il pulsante «Prenota online» (spese di prenotazione: 17,50 €), oppure chiami il 04 75 62 24 62.", "bot.a.dispo": "Non vedo le disponibilità in tempo reale. Il modo più sicuro: la prenotazione online, oppure una telefonata al 04 75 62 24 62.", "bot.a.dates": "Aperto dal 28 marzo al 21 ottobre 2027. In alta stagione (10 luglio-25 agosto), minimo 7 notti. Alloggi: arrivo dalle 16, partenza entro le 10.", "bot.a.piscine": "Piscina a L e vasca per bambini nell'area bassa, comprese nel prezzo. Costume da bagno obbligatorio.", "bot.a.velo": "La Dolce Via passa accanto al campeggio e risale la valle dell'Eyrieux fino a Le Cheylard. C'è anche un'area tende per ciclisti ed escursionisti, da 12,50 € a notte.", "bot.a.wifi": "Wifi gratuito, migliore vicino alla reception; credenziali alla reception.", "bot.a.elec": "Elettricità da 6 o 10 A a seconda della piazzola. Prese CEE blu stagne e cavi in neoprene obbligatori.", "bot.a.pain": "Il panettiere consegna pane e viennoiserie ogni giorno: ordini il giorno prima alla reception. Piccolo emporio in loco.", "bot.a.cartes": "Carte ACSI, CKE (ANWB) e ADAC accettate fino al 7 luglio incluso e dal 25 agosto.", "bot.a.langue": "Tutta la squadra parla inglese, alcuni francese, altri olandese.", "bot.a.bebe": "Culla (3,50 €/notte) e seggiolone (1,50 €/notte) su richiesta, e un'area bambini con vaschetta nel blocco in basso.", "bot.a.region": "Nei dintorni: La Voulte-sur-Rhône (3 km, mercato il venerdì), vigneti del Rodano (20 km), Drôme provenzale (39 km), Altopiano dell'Ardèche (60 km), Gole dell'Ardèche (94 km).", "emp.lead": "Piazzole da 80 a 150 m² con elettricità da 6 o 10 A, separate da alberi e siepi, sia sul terreno alto sia su quello basso."}, "nl": {"meta.title": "Camping La Garenne — Saint-Laurent-du-Pape, Eyrieux-vallei, Ardèche", "ui.book": "Online boeken", "ui.call": "Bel ons", "ui.more": "Naar de pagina", "ui.close": "Sluiten", "ui.lang": "Taal", "ui.from": "vanaf", "ui.night": "nacht", "ui.add": "Toevoegen aan mijn verblijf", "ui.added": "Toegevoegd", "ui.mine": "Mijn verblijf", "ui.video": "Video van de camping", "ui.street": "Google Street View", "ui.pdf": "Tarieven 2027 als pdf", "ui.replay": "Nog een rondje", "nav.camping": "De camping", "nav.emplacements": "Kampeerplaatsen", "nav.mobilhomes": "Mobilhomes", "nav.safari": "Safaritenten", "nav.tarifs": "Tarieven 2027", "nav.sejour": "Bereken uw verblijf", "nav.bistro": "Le Bistro", "nav.region": "De omgeving", "nav.infos": "Goed om te weten", "nav.plan": "Plattegrond", "nav.contact": "Contact", "nav.conseil": "Garenne Conseil", "nav.cgv": "Voorwaarden & reglement", "nav.conf": "Privacy", "top.open": "Geopend van 28 maart tot 21 oktober 2027", "home.h1": "Een kleinschalige camping, direct aan de Dolce Via.", "home.lead": "119 kampeerplaatsen aan de rand van het bos, op 5 minuten lopen van het dorp Saint-Laurent-du-Pape, in de Eyrieux-vallei. L-vormig zwembad, mobilhomes, safaritenten en een bistro waar huisgemaakt wordt gekookt.", "home.hosts": "Judith Martojo-van der Meer en Nils Martojo heten u welkom.", "home.track": "De Dolce Via loopt langs de camping: het oude spoortracé volgt de Eyrieux-vallei tot aan Le Cheylard.", "home.cta.calc": "Bereken uw verblijf", "terr.h": "Twee terreinen, twee sferen", "terr.haut.h": "Het boventerrein", "terr.haut": "Receptie, winkeltje en broodafhaalpunt. Rustige plaatsen, vlak bij het pad naar het dorp en het bos.", "terr.bas.h": "Het benedenterrein", "terr.bas": "In een kleine vallei: het L-vormige zwembad met peuterbad, het restaurant, de snackbar en het terras met uitzicht op het water. 25 meter lager.", "heb.h": "Waar slapen", "emp.short": "80 tot 150 m² · elektriciteit 6 of 10 A · 2 pers. inbegrepen", "mh.short": "Mobilhomes “Evolution” · boventerrein · honden toegestaan", "sf.short": "XL-safaritenten · eigen sanitair · 6 personen", "calc.h": "Wat kost uw verblijf?", "calc.p": "De prijzen zijn gebaseerd op onze tarieven 2027, inclusief belastingen en kosten.", "calc.heb": "Accommodatie", "calc.period": "Periode", "calc.nights": "Nachten", "calc.adults": "Volwassenen (vanaf 13 jaar)", "calc.k13": "Kinderen van 1 tot 3 jaar", "calc.k412": "Kinderen van 4 tot 12 jaar", "calc.pet": "Huisdier", "calc.fridge": "Koelkast", "calc.total": "Raming", "calc.detail": "waarvan toeristenbelasting, milieubijdrage en reserveringskosten", "calc.note": "Indicatieve raming op basis van de tarieven 2027. In het hoogseizoen (10 juli-25 augustus) geldt een minimumverblijf van 7 nachten. De exacte prijs wordt bij de reservering bevestigd.", "calc.min": "In het hoogseizoen is het minimumverblijf 7 nachten.", "calc.cap": "Let op: deze accommodatie biedt plaats aan maximaal {n} personen.", "calc.e.xxl": "XXL-plaats · 150 m² · 10 A", "calc.e.xl": "XL-plaats · 120-130 m² · 10 A", "calc.e.10": "Kampeerplaats · 100-110 m² · 10 A", "calc.e.6": "Kampeerplaats · 100-110 m² · 6 A", "calc.e.velo": "Tentenveld voor fietsers en wandelaars (1 pers.)", "calc.mh": "Mobilhome (max. 5 pers.)", "calc.sf": "Safaritent (max. 6 pers.)", "calc.p.basse": "28 maart-2 juli en 5 september-21 oktober", "calc.p.moy": "3-9 juli en 26 augustus-4 september", "calc.p.haute": "10 juli-25 augustus", "camp.h": "De camping", "camp.lead": "Twee vlakke terreinen met een paar terrassen, gescheiden door bomen, struiken en lage muurtjes van rivierkeien, zo typisch voor de Ardèche.", "camp.items": "Kampeerplaatsen van ongeveer 80 tot 150 m² · elektriciteit van 6 tot 10 A op elke plaats · drinkwaterpunten verspreid over het terrein · harde, rotsachtige grond: neem speciale rotsharingen mee (te koop bij de receptie) · twee moderne sanitairgebouwen, waarvan één met gehandicaptentoilet en babyruimte · veilige speeltuin · jeu-de-boulesbanen · tafeltennis onder het overdekte terras van de bar · koelkastverhuur (reserveren aanbevolen)", "camp.activ": "Voor en na het hoogseizoen: jeu-de-boulesmiddagen en wijnproeverijen.", "mh.h": "Mobilhomes", "mh.lead": "Op het boventerrein, in de rust.", "mh.items": "Capaciteit: 4 personen (maximaal 5 volgens de tarieven 2027) · 5 kussens en 5 dekbedden · huur van beddengoed mogelijk · babybed en kinderstoel op aanvraag · honden toegestaan in de mobilhomes “Evolution” · niet roken · aankomst vanaf 16.00 uur · vertrek vóór 10.00 uur", "mh.check": "Uw website vermeldt “4 personen” op de pagina Mobilhomes en “maximaal 5 personen” in de pdf met tarieven: nog te bevestigen.", "sf.h": "XL-safaritenten", "sf.lead": "Voor een vakantie onder canvas, met eigen sanitair, tot 6 personen. Op de plattegrond staan ze in paars.", "sf.items": "6 kussens en 6 dekbedden · huur van beddengoed mogelijk · babybed en kinderstoel op aanvraag · honden toegestaan · niet roken · aankomst vanaf 16.00 uur · vertrek vóór 10.00 uur", "tarifs.h": "Tarieven 2027", "tarifs.lead": "Geopend van 28 maart tot 21 oktober 2027. Prijzen per nacht.", "tarifs.emp": "Kampeerplaatsen (2 personen, 1 auto, elektriciteit, warm water en zwembad inbegrepen)", "tarifs.sup": "Toeslagen per nacht", "tarifs.loc": "Mobilhomes en safaritenten (prijs per nacht)", "tarifs.locsup": "Toeslagen verhuur", "tarifs.s.k13": "Kind van 1 tot 3 jaar", "tarifs.s.k412": "Kind van 4 tot 12 jaar", "tarifs.s.p13": "Persoon vanaf 13 jaar", "tarifs.s.tente": "Extra tent: gratis", "tarifs.s.frigo": "Koelkast", "tarifs.s.pet": "Huisdier", "tarifs.s.car": "Extra auto (parkeerplaats)", "tarifs.l.menage": "Verplichte eindschoonmaak: 67 € per verblijf", "tarifs.l.pet": "Huisdier: 5 € per nacht", "tarifs.l.car": "Extra auto: 6 € per nacht", "tarifs.l.lit": "Babybed: 3,50 € per nacht · kinderstoel: 1,50 € per nacht", "tarifs.l.linge": "Beddengoed: 18 € per persoon per verblijf (dekbedden inbegrepen)", "tarifs.taxes": "Toeristenbelasting: 0,61 € per volwassene per nacht · milieubijdrage: 1,10 € per nacht per kampeerplaats of accommodatie · reserveringskosten: 17,50 €", "tarifs.rules": "Slechts één gezin per kampeerplaats, maximaal 6 personen · extra auto's op de parkeerplaats · hoogseizoen (10 juli-25 augustus): minimaal 7 nachten, behalve op het fietsersveld · geen auto's op het fietsersveld", "tarifs.cartes": "ACSI-, CKE- (ANWB) en ADAC-kaarten worden geaccepteerd t/m 7 juli en vanaf 25 augustus.", "tarifs.col.basse": "28/03-02/07 en 05/09-21/10", "tarifs.col.moy": "03/07-09/07 en 26/08-04/09", "tarifs.col.haute": "10/07-25/08", "bistro.h": "Le Bistro", "bistro.lead": "Het restaurant en de snackbar, op het terras met uitzicht op het zwembad: koude en warme dranken, huisgemaakte gerechten.", "indo.h": "Op woensdag: Indonesische avond", "indo.p": "Samen met het team bereidt Nils de Indonesische keuken: nasi goreng, rendang, sambal goreng telor, gado gado, ajam pedis, saté, met garnalenkoekjes, pittige ananas en satésaus. Alles is huisgemaakt.", "bistro.note": "De menukaart van Le Bistro en de openingstijden (pagina “Restaurant” van uw website, die nu een foutmelding geeft) nemen we samen met u over.", "pool.h": "Zwembad en peuterbad", "pool.p": "Een mooi L-vormig zwembad en een peuterbad op het benedenterrein, tijdens de openingsperiode inbegrepen in de prijs van de kampeerplaats. Zwembroek verplicht: boxershorts en bermuda's zijn niet toegestaan. Honden zijn niet toegestaan bij het zwembad.", "reg.h": "De omgeving", "reg.lead": "Fietsen, wandelen, kanoën, dorpjes op de heuvels: de Ardèche begint bij het hek van de camping.", "reg.velo.h": "Fietsen", "reg.velo": "De Dolce Via loopt langs de camping en volgt de Eyrieux-vallei tot Le Cheylard, over een oud spoortracé. De Via Rhôna, vlak, volgt de Rhône richting Valence, Tournon of Privas.", "reg.canoe.h": "Kano & kajak", "reg.canoe": "De benedenloop van de Ardèche, met start bij de Pont d'Arc, is spectaculair.", "reg.klim.h": "Klimmen", "reg.klim": "Klimmen, klauteren, van een tokkelbaan roetsjen: een dag vol uitdagingen, met een parcours al vanaf 2 jaar.", "reg.voulte": "Op 3 km: het middeleeuwse dorp La Voulte-sur-Rhône met zijn markt op vrijdagochtend aan de voet van het kasteel.", "reg.sites.h": "Onze favorieten", "reg.sites": [["Gorges de l'Ardèche en Pont d'Arc", "94 km", "De Pont d'Arc, een natuurlijke boog die de rivier heeft uitgesleten, vormt de toegang tot de kloof, een beschermd natuurreservaat. Grotten van La Madeleine en Aven de Marzal."], ["Balazuc", "—", "Een van de mooiste dorpen van Frankrijk, tegen de rotswanden boven de Ardèche gebouwd, met een romaanse kerk."], ["Ardèche-plateau", "60 km", "Het natuurpark Monts d'Ardèche: uitgedoofde vulkanen (Mont Mézenc, Gerbier de Jonc, Suc de Sara), basaltdorpjes zoals Borée en Antraigues."], ["Waterval Ray-Pic", "63 km", "Een waterval van 60 m langs basaltorgelpijpen."], ["Waterval La Druise", "65 km", "Een waterval van 60 m, gevoed door de Gervanne."], ["De Drôme", "10 min", "Van de Drôme-vallei tot de kloof van Omblèze, en de Clairette de Die, de mousserende wijn van de streek."], ["Vercors", "66 km", "Kalksteenrotsen en sparrenbossen, Combe Laval en Grands Goulets."], ["Drôme Provençale en Trois Becs", "39 km", "Heuvels, dorpjes op de heuvels, wijngaarden, zonnebloemen en lavendel; de Tricastin en zijn truffels."], ["Wijngaarden van de Rhônevallei", "20 km", "De noordelijke côtes-du-rhône: Hermitage, Saint-Joseph, Cornas, Saint-Péray, Condrieu, Côte-Rôtie."]], "reg.note": "Samengevatte teksten in het Nederlands, gebaseerd op uw pagina's Toerisme, die nu nog in het Nederlands op de Franse versie staan.", "infos.h": "Goed om te weten", "infos.items": [["Vers brood en winkeltje", "De bakker uit Beauchastel levert dagelijks brood en croissants: bestel de dag ervoor. Kleine noodwinkel op de camping, supermarkten op 3 km."], ["Barbecue en open vuur", "Verboden (prefectuurbesluit: droog klimaat, bos vlakbij), zowel op houtskool als op gas. Bereiding zonder direct vlamcontact, zoals met een scottelbraai, is toegestaan."], ["Elektriciteit", "6 A (1.380 W) op alle plaatsen. Blauwe waterdichte CEE-stekkers en neopreenkabels (H07RNF, 07RN of RN), verlengsnoeren inbegrepen."], ["Internet", "Gratis wifi, het best in de buurt van de receptie; inloggegevens bij de receptie. Het netwerk bereikt nog niet de hele camping."], ["Honden", "Welkom! Bos achter de camping, zwemmen in de Eyrieux kan op 10 minuten lopen. Aangelijnd op de camping, niet toegestaan bij het zwembad."], ["Koelkasten", "Tafelmodellen van ongeveer 84 × 54 × 53 cm, met schappen, groentelade en deurvakken. Beperkt aantal: reserveer tijdig."], ["Sanitair voor gehandicapten", "Toilet, douche en wastafel in het onderste gebouw; persoonlijke sleutel op aanvraag."], ["Kinderen en baby's", "Kinderruimte in het onderste gebouw: badje, kinderdouche en -toilet, commode, wastafel."], ["Zwembad", "Zwembroek verplicht: boxershorts en bermuda's zijn niet toegestaan."]], "contact.h": "Contact", "contact.lead": "Meestal antwoord binnen twee dagen. Wij zijn niet camping La Garenne in Bédoin, aan de voet van de Mont Ventoux.", "contact.addr": "383 montée de La Garenne · 07800 Saint-Laurent-du-Pape · Ardèche", "contact.tel.h": "Telefonisch", "contact.tel.open": "Tijdens de openingsperiode (1 april-30 september): 8.30-11.30 en 14.00-18.30 uur, soms tot 20.00 uur voor spoedgevallen en last-minuteverblijven. Spreek een bericht in, dan bellen we u terug.", "contact.tel.closed": "Buiten het seizoen: maandag, dinsdag, donderdag en vrijdag, 9.00-11.00 en 14.00-16.00 uur. In het weekend en tijdens de schoolvakanties kunt u ons beter mailen.", "contact.bureau": "Receptie: dagelijks, 8.00-12.00 en 14.30-19.00 uur (afhankelijk van het seizoen).", "contact.langs": "Het hele team spreekt Engels, sommigen Frans, anderen Nederlands.", "f.nom": "Naam", "f.email": "E-mail", "f.sujet": "Onderwerp", "f.msg": "Bericht", "f.send": "Verzenden", "f.ok": "Dank u wel! In de online versie gaat uw bericht naar de camping. Hier is het een voorbeeldversie: er wordt niets verzonden.", "f.err": "Vul a.u.b. uw naam, e-mailadres en bericht in.", "f.projet": "Vanuit “Mijn verblijf”:", "mine.h": "Mijn verblijf", "mine.empty": "Nog niets. Voeg een accommodatie of uitstapje toe vanaf de pagina's.", "mine.go": "Mijn aanvraag versturen", "plan.h": "Plattegrond van de camping", "plan.p": "De safaritenten staan in paars op de plattegrond.", "cgv.h": "Algemene voorwaarden en huishoudelijk reglement", "cgv.note": "Officiële tekst in het Frans, ongewijzigd overgenomen van uw website.", "conf.h": "Privacybeleid", "conf.p": "De gegevens uit het formulier worden uitsluitend gebruikt om uw aanvraag te beantwoorden. De volledige tekst van uw huidige privacybeleid wordt bij de installatie overgenomen.", "legal": "SARL La Garenne au capital de 9 147,50 € · SIRET 350 350 401 00013 · RCS Aubenas B 350 350 401 · TVA FR52 350 350 401", "foot.tag": "Familiecamping met 119 kampeerplaatsen in de Eyrieux-vallei, in de Ardèche.", "foot.maquette": "Voorstel voor een nieuwe website door Neovera Studio — vrijblijvend ontwerp.", "bot.name": "Garenne Conseil", "bot.sub": "Ik help u kiezen", "bot.virtual": "Virtuele assistent", "bot.hello": "Goedendag! Ik ben de virtuele assistent van Camping La Garenne. Kampeerplaatsen, verhuur, prijzen, zwembad, honden, omgeving: stel gerust uw vraag.", "bot.invite": "Een vraag over uw verblijf in de Ardèche?", "bot.ph": "Typ uw vraag…", "bot.send": "Verzenden", "bot.chips": ["Prijs van een kampeerplaats in juli", "Mobilhome of safaritent?", "Zijn honden toegestaan?", "Barbecue toegestaan?", "Indonesische avond", "Boeken"], "bot.unknown": "Ik weet niet zeker of ik dat goed kan beantwoorden. Het eenvoudigst: bel 04 75 62 24 62 of mail naar info@campinglagarenne-ardeche.fr.", "bot.a.prix": "Per nacht, 2 personen inbegrepen: kampeerplaats 6 A van 31,10 € tot 48,95 €, 10 A van 35,70 € tot 51,80 €, XL van 38,55 € tot 54,55 €, XXL van 42,50 € tot 58,50 €, afhankelijk van de periode. De rekentool maakt het totaal inclusief belastingen.", "bot.a.loc": "Mobilhome: maximaal 5 personen, van 57,25 € tot 199,50 € per nacht. XL-safaritent met eigen sanitair: 6 personen, van 75 € tot 228 € per nacht. Eindschoonmaak: 67 €.", "bot.a.chien": "Ja! Honden zijn welkom op de kampeerplaatsen, in de mobilhomes “Evolution” en de safaritenten. Aangelijnd op de camping, niet bij het zwembad. Toeslag: 3,10 tot 4,10 € per nacht op een kampeerplaats, 5 € per nacht bij verhuur.", "bot.a.bbq": "Nee: open vuur en barbecueën op houtskool of gas zijn bij prefectuurbesluit verboden. Bereiding zonder direct vlamcontact, zoals met een scottelbraai, is toegestaan.", "bot.a.indo": "Elke woensdag koken Nils en het team Indonesisch: nasi goreng, rendang, saté, gado gado… alles huisgemaakt.", "bot.a.resa": "Boek online met de knop “Online boeken” (reserveringskosten: 17,50 €), of bel 04 75 62 24 62.", "bot.a.dispo": "Ik zie de beschikbaarheid niet in real time. Het zekerst is online boeken, of even bellen naar 04 75 62 24 62.", "bot.a.dates": "Geopend van 28 maart tot 21 oktober 2027. In het hoogseizoen (10 juli-25 augustus) minimaal 7 nachten. Verhuur: aankomst vanaf 16.00 uur, vertrek vóór 10.00 uur.", "bot.a.piscine": "L-vormig zwembad en peuterbad op het benedenterrein, inbegrepen in de prijs. Zwembroek verplicht.", "bot.a.velo": "De Dolce Via loopt langs de camping en volgt de Eyrieux-vallei tot Le Cheylard. Er is ook een tentenveld voor fietsers en wandelaars, vanaf 12,50 € per nacht.", "bot.a.wifi": "Gratis wifi, het best in de buurt van de receptie; inloggegevens bij de receptie.", "bot.a.elec": "Elektriciteit van 6 of 10 A, afhankelijk van de kampeerplaats. Blauwe waterdichte CEE-stekkers en neopreenkabels verplicht.", "bot.a.pain": "De bakker levert dagelijks brood en croissants: bestel de dag ervoor bij de receptie. Kleine noodwinkel op de camping.", "bot.a.cartes": "ACSI-, CKE- (ANWB) en ADAC-kaarten worden geaccepteerd t/m 7 juli en vanaf 25 augustus.", "bot.a.langue": "Het hele team spreekt Engels, sommigen Frans, anderen Nederlands.", "bot.a.bebe": "Babybed (3,50 € per nacht) en kinderstoel (1,50 € per nacht) op aanvraag, en een kinderruimte met badje in het onderste sanitairgebouw.", "bot.a.region": "In de buurt: La Voulte-sur-Rhône (3 km, markt op vrijdag), wijngaarden van de Rhône (20 km), Drôme Provençale (39 km), Ardèche-plateau (60 km), Gorges de l'Ardèche (94 km).", "emp.lead": "Kampeerplaatsen van 80 tot 150 m² met 6 of 10 A stroom, gescheiden door bomen en hagen, op zowel het bovenste als het onderste terrein."}}</script>
<script type="application/json" id="cgv">"Conditions générales de réservation\nRèglement\nFrais de dossier €17,50 par réservation (location et emplacement)\nToute réservation doit être accompagnée d’un acompte correspondant à :\n100% pour les séjours de 1 nuit.\n50% pour un de séjour de 2 à 3 nuits.\n30% pour un séjour de plus de 3 nuits.\nL’acompte doit être réglé au plus tard 14 jours après confirmation de la réservation, par chèque ou virement bancaire.\nComptes bancaire de la SARL La Garenne :\nCrédit Agricole La Voulte s/​Rhône, IBAN FR76 1390 6000 0544 5295 3805 037\nEn cas de chèque sans provision, le contrat deviendra nul et sans valeur et le camping la Garenne disposera de nouveau son emplacement ou de son hébergement locatif.\nEn cas de non règlement, nous nous réservons le droit d’annuler la réservation.\nLe solde\nLe solde doit être réglé au plus tard 8 semaines avant l’arrivée au camping.\nRéservation sous 10 semaines\nSi vous réservez 10 semaines avant votre départ, l’intégralité du montant vous sera dû.\nArrivé et départ\nVous pouvez disposer de votre emplacement à partir de 12h00 et de votre hébergement locatif à partir de 16h00. Dans les deux cas, le départ se fait avant 12h00 et pour les hébergements locatifs à partir de 10h00.\nPour tout départ après 12h, une nuitée supplémentaire sera facturée.\nSéjour écourté et non arrivée\nPour toute interruption de séjour avant la date de départ prévue, le nombre total de nuits réservées sera facturé.\nSi toutefois vous aviez un empêchement vous devez prévenir le bureau d’accueil. En cas de non arrivée le jour de votre arrivée prévue et sans nouvelles de votre part, nous gardons votre emplacement jusqu’au lendemain 14h. Au-​delà de ce délai, nous disposerons de l’emplacement sans restitution de payé.\nAnnulation\nNous traitons uniquement des demandes d'annulations écrit.\nSi vous annulez, nous vous facturons les frais suivants, mentionné ci-dessous :\nSi vous annulez jusqu'à 8 semaines avant le début de la période réservé: 25% du montant du séjour\nSi vous annulez entre 8 et 4 semaines avant le début de la période réservé: 75% du montant du séjour\nSi vous annulez 4 semaines avant le début de la période réservé: 90% du montant du séjour\nLes frais de réservations ne sont en aucun cas remboursés.\nAfin d’éviter tout désagrément concernant une annulation de votre séjour, nous vous suggérons de souscrire à une assurance annulation auprès de votre assureur habituel ou auprès de Mondial Assistance.\nAnnulation de séjour par le Camping La Garenne AVANT votre arrivée\nEn cas de force majeure, nous nous réservons (le propriétaire du camping)le droit d’annuler votre séjour pour des raisons de sécurité. Si vous avez d’ores et déjà quitté votre domicile, nous vous proposerons de vous reloger dans un autre hébergement similaire sans supplément. Si aucune de ces offres ne vous satisfaisait, l’intégralité des sommes versées vous serait remboursée; aucun autre indemnité ne pourra être réclamée.\nAcceptation conditions de réservation général\nA partir du moment que vous réglez votre acompte, vous acceptez automatiquement les termes et conditions de réservation du camping La Garenne.\nRèglement intérieur des terrains de camping ou de caravanage ainsi que des parcs résidentiels de loisirs (Arrêté du 17 février 2014)\nConditions d'admission et de séjour\nPour être admis à pénétrer, à s'installer ou séjourner sur un terrain de camping, il faut y avoir été autorisé par le gestionnaire ou son représentant. Ce dernier a pour obligation de veiller à la bonne tenue et au bon ordre du terrain de camping ainsi qu'au respect de l'application du présent règlement intérieur. Le fait de séjourner sur le terrain de camping implique l'acceptation des dispositions du présent règlement et l'engagement de s'y conformer. Nul ne peut y élire domicile.\nFormalités de police\nLes mineurs non accompagnés de leur parents ne seront pas admis.\nEn application de l'article R. 611-35 du code de l'entrée et du séjour des étrangers et du droit d'asile, le gestionnaire est tenu de faire remplir et signer par le client de nationalité étrangère, dès son arrivée, une fiche individuelle de police. Elle doit mentionner notamment :\n1° Le nom et les prénoms ;\n2° La date et le lieu de naissance ;\n3° La nationalité ;\n4° Le domicile habituel.\nLes enfants âgés de moins de 15 ans peuvent figurer sur la fiche de l'un des parents.\nInstallation\nL'hébergement de plein air et le matériel y afférent doivent être installés à l'emplacement indiqué conformément aux directives données par le gestionnaire ou son représentant\nBureau d'accueil\nLes horaires d’ouverture du bureau d’accueil sont affichés sur la porte du bureau d’accueil. Les horaires changent suivant les saisons. On trouvera au bureau d'accueil tous les renseignements sur les services du terrain de camping, les informations sur les possibilités de ravitaillement, les installations sportives, les richesses touristiques des environs et diverses adresses qui peuvent s'avérer utiles. Un système de collecte et de traitement des réclamations est tenu à la disposition des clients.\nAffichage\nLe présent règlement intérieur est affiché à l'entrée du terrain de camping et au bureau d'accueil. Il est remis à chaque client qui le demande.\nPour les terrains de camping classés, la catégorie de classement avec la mention tourisme ou loisirs et le nombre d'emplacements tourisme ou loisirs sont affichés.\nLes prix des différentes prestations sont communiqués aux clients dans les conditions fixées par arrêté du ministre chargé de la consommation et consultables à l'accueil.\nModalités de départ\nLes clients sont invités à prévenir le bureau d'accueil de leur départ dès la veille de celui-ci. Les clients ayant l'intention de partir avant l'heure d'ouverture du bureau d'accueil doivent effectuer la veille le paiement de leur séjour.\nBruit et silence\nLes clients sont priés d'éviter tous bruits et discussions qui pourraient gêner leurs voisins.\nLes appareils sonores doivent être réglés en conséquence. Les fermetures de portières et de coffres doivent être aussi discrètes que possible.\nLes chiens et autres animaux ne doivent jamais être laissés en liberté. Ils ne doivent pas être laissés au terrain de camping, même enfermés, en l'absence de leurs maîtres, qui en sont civilement responsables.\nLe gestionnaire assure la tranquillité de ses clients en fixant des horaires pendant lesquels le silence doit être total.\nVisiteurs\nAprès avoir été autorisés par le gestionnaire ou son représentant, les visiteurs peuvent être admis dans le terrain de camping sous la responsabilité des campeurs qui les reçoivent.\nLe client peut recevoir un ou des visiteurs à l'accueil. Les prestations et installations des terrains de camping sont accessibles aux visiteurs. Toutefois, l'utilisation de ces équipements peut être payante selon un tarif qui doit faire l'objet d'un affichage à l'entrée du terrain de camping et au bureau d'accueil.\nLes voitures des visiteurs sont interdites dans le terrain de camping.\nCirculation et stationnement des véhicules\nA l'intérieur du terrain de camping, les véhicules doivent rouler à une vitesse limitée.\nLa circulation est autorisée de à 7h00 - 22h30.\nNe peuvent circuler dans le terrain de camping que les véhicules qui appartiennent aux campeurs y séjournant. Le stationnement est strictement interdit sur les emplacements habituellement occupés par les hébergements sauf si une place de stationnement à été prévue à cet effet. Le stationnement ne doit pas entraver la circulation ni empêcher l'installation de nouveaux arrivants.\nTenue et aspect des installations\nChacun est tenu de s'abstenir de toute action qui pourrait nuire à la propreté, à l'hygiène et à l'aspect du terrain de camping et de ses installations, notamment sanitaires.\nIl est interdit de jeter des eaux usées sur le sol ou dans les caniveaux.\nLes clients doivent vider les eaux usées dans les installations prévues à cet effet.\nLes ordures ménagères, les déchets de toute nature, les papiers, doivent être déposés dans les poubelles.\nLe lavage est strictement interdit en dehors des bacs prévus à cet usage.\nL'étendage du linge se fera, le cas échéant, au séchoir commun. Cependant, il est toléré jusqu'à 10 heures à proximité des hébergements, à la condition qu'il soit discret et ne gêne pas les voisins. Il ne devra jamais être fait à partir des arbres.\nLes plantations et les décorations florales doivent être respectées. Il est interdit de planter des clous dans les arbres, de couper des branches, de faire des plantations.\nIl n'est pas permis de délimiter l'emplacement d'une installation par des moyens personnels, ni de creuser le sol.\nToute réparation de dégradation commise à la végétation, aux clôtures, au terrain ou aux installations du terrain de camping sera à la charge de son auteur.\nL'emplacement qui aura été utilisé durant le séjour devra être maintenu dans l'état dans lequel le campeur l'a trouvé à son entrée dans les lieux.\nSécurité\na) Incendie.\nLes feux ouverts (bois, charbon, etc.) sont rigoureusement interdits. Les réchauds doivent être maintenus en bon état de fonctionnement et ne pas être utilisés dans des conditions dangereuses.\nEn cas d'incendie, aviser immédiatement la direction. Les extincteurs sont utilisables en cas de nécessité.\nUne trousse de secours de première urgence se trouve au bureau d'accueil.\nb) Vol.\nLa direction est responsable des objets déposés au bureau et a une obligation générale de surveillance du terrain de camping. Le campeur garde la responsabilité de sa propre installation et doit signaler au responsable la présence de toute personne suspecte. Les clients sont invités à prendre les précautions habituelles pour la sauvegarde de leur matériel.\nJeux\nAucun jeu violent ou gênant ne peut être organisé à proximité des installations.\nLa salle de réunion ne peut être utilisée pour les jeux mouvementés.\nLes enfants doivent toujours être sous la surveillance de leurs parents.\nGarage mort\nIl ne pourra être laissé de matériel non occupé sur le terrain, qu'après accord de la direction et seulement à l'emplacement indiqué. Cette prestation peut être payante.\nInfraction au règlement intérieur\nDans le cas où un résidant perturberait le séjour des autres usagers ou ne respecterait pas les dispositions du présent règlement intérieur, le gestionnaire ou son représentant pourra oralement ou par écrit, s'il le juge nécessaire, mettre en demeure ce dernier de cesser les troubles. En cas d'infraction grave ou répétée au règlement intérieur et après mise en demeure par le gestionnaire de s'y conformer, celui-ci pourra résilier le contrat.\nEn cas d'infraction pénale, le gestionnaire pourra faire appel aux forces de l'ordre.\nConditions générales de vente camping\nFormalites\nToute personne séjournant au moins une nuit sur le terrain de camping doit présenter au préalable ses pièces d'identités. Est considérée comme participant toute personne y compris les bébés. Les bébés de moins de deux ans sont gratuits.\nLes mineurs non accompagnés de leurs parents ne seront pas admis.\nBureau d'accueil\nLes réclamations ne seront prises en considération que si elles sont datées, signées, aussi précises que possible et se rapportant à des faits relativement récents.\nAffichage\nLes services et produits proposés à la vente sont payables de suite en espèces, carte bancaire ou chèque.\nSéjour sans réservation\nPaiement\nLe client devra informer le propriétaire de son départ la veille de celui-ci et régler ainsi son séjour.\nTenue et aspect des installations\nCapacité maximale de 6 personnes et superficie d'environ 100m² pour un emplacement.\nLes voitures des clients doivent être garées sur le camping sur l'emplacement loué et non en bordure de celui-ci.\nTous les emplacements disposent d’un branchement électrique de 6 Ampères (1380 Watt). N’utilisez que des prises CEE bleues, étanches en combinaison avec des câbles en néoprène. Ces câbles sont reconnaissables aux inscriptions H07RNF, 07RN ou RN. Pour les rallonges il en va de même.\nLes caravanes et camping-cars double essieux ne sont pas admis.\nLes barbecues de toute nature ne sont pas acceptés.\nAssurance\nToute personne qui séjourne sur le terrain de camping est tenue de s'assurer auprès d'une compagnie d'assurance de son choix, contre les dommages de toute nature, susceptibles d'engager sa responsabilité ainsi que pour une éventuelle annulation de séjour.\nInfraction\nEn cas d'infraction grave ou répétée aux conditions générales de vente et après mise en demeure par le propriétaire de s'y conformer, celui-ci pourra résilier le contrat et/ou demander au client de quitter le camping sur le champ, après avoir réglé son séjour. Tout règlement effectué ne donne lieu à aucun remboursement."</script>
