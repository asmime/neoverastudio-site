:root{
 --noyer:#2A2119;
 --noyer2:#3A2E23;
 --ardoise:#2E3436;
 --papier:#F6F1E7;
 --papier2:#ECE3D2;
 --chene:#4E6B2A;
 --chene-f:#3B5220;
 --soleil:#F2B632;
 --craie:#F4F1EA;
 --encre:#221B14;
 --gris:#5A5047;
 --r:14px;
 --titre:"Gabarito","Commissioner",system-ui,sans-serif;
 --texte:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
 --main:"Caveat","Gabarito",cursive;
 --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scrollbar-color:var(--chene) var(--papier2)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--papier);color:var(--encre);font:400 17px/1.6 var(--texte)}
::selection{background:var(--soleil);color:var(--noyer)}
::-webkit-scrollbar{width:11px;height:8px}::-webkit-scrollbar-track{background:var(--papier2)}::-webkit-scrollbar-thumb{background:var(--chene);border-radius:8px;border:2px solid var(--papier2)}
:focus-visible{outline:3px solid var(--soleil);outline-offset:3px;border-radius:4px}
a{color:inherit;text-decoration-color:var(--chene);text-decoration-thickness:2px;text-underline-offset:4px}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--titre);font-weight:800;letter-spacing:-.02em;line-height:1.04;margin:0;text-wrap:balance;overflow-wrap:break-word}
h1{font-size:clamp(2.4rem,6.6vw,5.4rem);font-weight:850}
h2{font-size:clamp(1.8rem,3.8vw,3rem);margin-bottom:.45em}
h3{font-size:clamp(1.15rem,1.7vw,1.4rem);font-weight:700;line-height:1.15}
@media (max-width:520px){h1,h2,h3{hyphens:auto;-webkit-hyphens:auto}}
p{margin:0 0 1em;max-width:66ch;overflow-wrap:break-word}
.lead{font-size:clamp(1.06rem,1.45vw,1.22rem);line-height:1.55}
.w{width:min(1240px,100% - 2*clamp(16px,4vw,48px));margin-inline:auto}
.sec{padding:clamp(60px,8.5vw,120px) 0}
.sec-s{padding:clamp(40px,6vw,76px) 0}
.sombre{background:var(--noyer);color:var(--craie)}
.sombre p{color:#E3DACB}
.kraft{background:var(--papier2)}
.cache{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:.6em;min-height:48px;padding:.75em 1.3em;border-radius:12px;border:2px solid transparent;font:700 1rem/1.1 var(--texte);text-decoration:none;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease)}
.btn svg{width:16px;height:16px;flex:none}
.btn-s{background:var(--soleil);color:var(--noyer)}
.btn-s:hover{background:#FFC94A;transform:translateY(-1px)}
.btn-c{border-color:currentColor;background:transparent;color:inherit}
.btn-c:hover{background:var(--noyer);color:var(--craie);border-color:var(--noyer)}
.sombre .btn-c:hover,.heros .btn-c:hover,.ardoise .btn-c:hover{background:var(--craie);color:var(--noyer);border-color:var(--craie)}
.lien{font-weight:700;text-decoration:underline;text-decoration-color:var(--soleil);display:inline-flex;gap:.4em;align-items:center}
.lien svg{width:16px;height:16px;flex:none}
.lien:hover{color:var(--chene-f)}
.sombre .lien:hover,.ardoise .lien:hover{color:var(--soleil)}
.ent{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.97);border-bottom:1px solid var(--papier2)}
.ent-l{display:flex;align-items:center;gap:14px;min-height:68px}
.marque{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--encre);margin-right:auto;min-width:0}
.marque svg{width:34px;height:34px;flex:none}
.marque>span:last-child{min-width:0}
.marque b{font-family:var(--titre);font-weight:850;font-size:1.18rem;letter-spacing:-.02em;line-height:1;display:block;white-space:nowrap}
.marque small{display:block;font-size:.76rem;color:var(--gris);white-space:nowrap}
.langue{position:relative}
.langue select{appearance:none;font:700 .92rem var(--texte);color:var(--encre);background:var(--papier);border:2px solid var(--encre);border-radius:12px;min-height:42px;padding:.45em 2.2em .45em .9em;cursor:pointer}
.langue::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--encre);border-bottom:2px solid var(--encre);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ent .btn{min-height:42px;padding:.55em 1em}
.nav{border-top:1px solid var(--papier2);position:relative}
.nav ul{list-style:none;margin:0 auto;padding:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav a{display:block;white-space:nowrap;padding:12px 9px;font-weight:700;font-size:.92rem;text-decoration:none;color:var(--gris);border-bottom:3px solid transparent}
.nav a:hover{color:var(--encre)}
.nav a[aria-current="page"]{color:var(--encre);border-bottom-color:var(--soleil)}
.nav a.cons{color:var(--chene-f)}
.nav::after{content:"";position:absolute;right:0;top:0;bottom:0;width:44px;background:linear-gradient(90deg,rgba(246,241,231,0),var(--papier));pointer-events:none}
@media (max-width:440px){.ent-l{gap:8px}.marque b{font-size:.98rem}.marque small{display:none}.marque svg{width:28px;height:28px}.langue select{max-width:112px;padding:.45em 1.9em .45em .7em;font-size:.86rem}.ent .btn{padding:.5em .8em;font-size:.92rem}}
.heros{position:relative;min-height:min(90vh,860px);display:grid;align-items:end;overflow:hidden;background:var(--noyer)}
.heros>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.heros::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(42,33,25,.9) 0%,rgba(42,33,25,.72) 38%,rgba(42,33,25,.1) 72%),linear-gradient(0deg,rgba(42,33,25,.75),rgba(42,33,25,0) 45%)}
.heros-c{position:relative;z-index:2;color:#fff;padding:72px 0 clamp(28px,5vw,56px)}
.heros h1{max-width:12ch}
.heros .lead{max-width:44ch;margin:.8em 0 1.2em;color:#F1EADC}
.infos-h{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.infos-h li{font-size:.9rem;font-weight:700;padding:6px 12px;border-radius:999px;background:rgba(246,241,231,.14);border:1px solid rgba(246,241,231,.3);color:#fff}
.infos-h li.ouv{background:var(--soleil);color:var(--noyer);border-color:var(--soleil)}
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;background:var(--papier);color:var(--encre);padding:12px;border-radius:16px;max-width:820px;box-shadow:0 14px 36px rgba(0,0,0,.3)}
.dates label{display:grid;gap:4px;font-size:.82rem;font-weight:700;min-width:0}
.dates input,.dates select{min-width:0;width:100%;min-height:46px;padding:.5em .7em;font:400 1rem var(--texte);border:2px solid var(--papier2);border-radius:10px;background:#fff;color:var(--encre)}
@media (max-width:760px){.dates{grid-template-columns:1fr 1fr}.dates label:nth-child(3){grid-column:1/-1}.dates button{grid-column:1/-1;justify-content:center}.heros::before{background:linear-gradient(0deg,rgba(42,33,25,.95) 30%,rgba(42,33,25,.35) 100%)}}
.ardoise{background:var(--ardoise);color:var(--craie);position:relative;overflow:hidden}
.ardoise::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 30%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse at 80% 70%,rgba(255,255,255,.04),transparent 55%);pointer-events:none}
.ardoise h2{font-family:var(--main);font-weight:700;font-size:clamp(2.4rem,5vw,3.8rem);letter-spacing:0;line-height:1}
.ardoise .sous{color:#CFCBC2;max-width:56ch}
.semaine{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:28px;perspective:1200px}
@media (max-width:980px){.semaine{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.semaine{grid-template-columns:repeat(2,minmax(0,1fr))}}
.jour{position:relative;min-height:200px;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit;text-align:left}
.jour .f,.jour .d{position:absolute;inset:0;border-radius:12px;padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .9s var(--ease)}
.jour .f{background:rgba(255,255,255,.05);border:2px dashed rgba(244,241,234,.35);display:flex;flex-direction:column;justify-content:space-between}
.jour .f b{font-family:var(--main);font-size:2.3rem;line-height:1}
.jour .f span{font-size:.85rem;color:#CFCBC2}
.jour .d{background:var(--craie);color:var(--ardoise);transform:rotateY(180deg);display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.jour .d b{font-family:var(--main);font-size:1.7rem;line-height:1;color:var(--chene-f)}
.jour .d span{font-size:.95rem;line-height:1.35}
.jour.vu .f{transform:rotateY(-180deg)}
.jour.vu .d{transform:rotateY(0)}
.jour .auj{position:absolute;top:-10px;right:10px;z-index:3;background:var(--soleil);color:var(--noyer);font:700 .75rem var(--texte);padding:3px 9px;border-radius:999px}
@media (prefers-reduced-motion:reduce){.jour .f{display:none}.jour .d{transform:none;position:relative;min-height:200px}}
.registre{width:100%;border-collapse:separate;border-spacing:0 10px}
.registre th{font-size:.82rem;text-align:left;color:var(--gris);font-weight:700;padding:0 10px}
.registre td{background:#fff;padding:10px;vertical-align:middle}
.registre td:first-child{border-radius:12px 0 0 12px;width:130px}

.registre img{width:110px;height:76px;object-fit:cover;border-radius:8px}
.registre .n{font-family:var(--titre);font-weight:800;font-size:1.05rem;line-height:1.15}
.registre .n a{text-decoration:none}
.registre .n a:hover{text-decoration:underline;text-decoration-color:var(--soleil)}
.registre .pill{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--papier2);margin:4px 4px 0 0}
.registre .pill.non{background:#F6E2B8}
.registre .num{font-variant-numeric:tabular-nums;font-weight:700}
@media (max-width:760px){.registre thead{display:none}.registre tr{display:grid;grid-template-columns:96px 1fr;background:#fff;border-radius:12px;margin-bottom:10px;padding:8px;gap:2px 10px}.registre td{display:block;padding:2px;background:none}.registre td:first-child{grid-row:span 4;width:auto}.registre td:last-child{text-align:left}.registre img{width:96px;height:96px}.registre .col{font-size:.9rem;color:var(--gris)}.registre .col::before{content:attr(data-l) " : ";font-weight:700}}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.filtres button{font:700 .92rem var(--texte);min-height:42px;padding:.5em 1em;border-radius:12px;border:2px solid var(--encre);background:transparent;color:var(--encre);cursor:pointer}
.filtres button[aria-pressed="true"]{background:var(--encre);color:var(--papier)}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:start}
@media (max-width:860px){.deux{grid-template-columns:1fr}}
.photo{border-radius:var(--r);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.pousse{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,64px);align-items:center}

.pousse ol{list-style:none;margin:0;padding:0}

.pousse li svg{width:40px;height:40px}

.avis{columns:3 280px;column-gap:24px}

.villages{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}

.puces{list-style:none;padding:0;margin:0 0 1em}

.encadre{background:#fff;border-radius:var(--r);padding:clamp(20px,3vw,32px);overflow-wrap:break-word}
.tarifs{width:100%;border-collapse:collapse}

@media (max-width:620px){.tarifs td:last-child{white-space:normal;text-align:left}.tarifs th,.tarifs td{display:block;padding:3px 0;border:0}.tarifs tr{display:block;padding:10px 0;border-bottom:1px solid var(--papier2)}}
.mosaique{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:180px;gap:8px}

.suite{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.agenda{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

.agenda h3{font-family:var(--main);font-size:2rem;color:var(--chene-f)}

.fiche{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}

.reseau{display:inline-flex;align-items:center;gap:10px}

avis:[["Excellent accueil, superbe équipe, un bar restaurant délicieux avec un excellent rapport qualité prix. Piscine et pataugeoire séparées, finalement plus agréable avec les enfants.","Laure A.","act"],["Camping bien tenu, propre et très bon accueil, restaurant très bon, et les propriétaires très gentils. La piscine est chaude, le parc de jeu est chouette.","Anita T.","act"],["Les animations familiales et conviviales sont menées par une équipe au top. Les moments en terrasse du bar et le repas périgourdin sont des incontournables.","Sophie A.","act"],["Camping familial et calme, ombragé avec des grands arbres, reposant, avec une piscine pour les enfants en bas âge et une autre pour les adultes.","Dominique R.","pisc"],["Les haies et les arbres offrent un cadre de verdure fort appréciable. Un vrai moment de paix et de détente, pour les amoureux de la nature et du calme.","Jean-Jacques","pisc"],["L'accueil parfait. La mini-ferme est super sympa. Le restaurant est super bon. Je n'ai jamais vu un camping aussi parfait !","Jenpol","pisc"],["Les emplacements permettent de conserver une intimité et liberté. La mini-ferme est très appréciée des enfants et l'écologie est au cœur de ce camping.","Damien B.","empl"],["Un endroit charmant, très beau avec ces grands arbres. Un très bel accueil des propriétaires, belle piscine, le tout avec un entretien au top.","Lokiluc A.","empl"],["Notre groupe de 55 randonneurs a séjourné 3 jours dans ce camping. Camping écoresponsable, irréprochable ! Le chef a su nous régaler avec des produits du terroir.","Geneviève R.","grp"],["Accueil très chaleureux et familial pour notre séjour en groupe. Très beaux équipements, agréable piscine chauffée et cuisine raffinée.","Sébastien F.","grp"]]

avis:[["Excellent welcome, superb team, a delicious bar-restaurant with excellent value for money. Separate pool and paddling pool, which turned out nicer with the children.","Laure A.","act"],["Well-kept, clean campsite with a very good welcome, very good restaurant and very kind owners. The pool is warm, the playground is great.","Anita T.","act"],["The friendly family entertainment is run by a top team. Moments on the bar terrace and the Périgord dinner are a must.","Sophie A.","act"],["A quiet family campsite, shaded by tall trees, restful, with one pool for toddlers and another for adults.","Dominique R.","pisc"],["The hedges and trees offer a very pleasant green setting. A real moment of peace and relaxation, for lovers of nature and calm.","Jean-Jacques","pisc"],["Perfect welcome. The mini-farm is great. The restaurant is really good. I've never seen such a perfect campsite!","Jenpol","pisc"],["The pitches keep your privacy and freedom. Children love the mini-farm and ecology is at the heart of this campsite.","Damien B.","empl"],["A charming place, beautiful with these tall trees. A lovely welcome from the owners, a nice pool, and everything perfectly kept.","Lokiluc A.","empl"],["Our group of 55 hikers stayed 3 days at this campsite. Eco-friendly, faultless! The chef treated us to local produce.","Geneviève R.","grp"],["A very warm, family welcome for our group stay. Great facilities, a pleasant heated pool and refined cooking.","Sébastien F.","grp"]]

activites:{t:"Actividades y restaurante",l:"De día, se juega al aire libre. Por la noche, nos reunimos en el bar de Les Nauves.",
 b:[["El club infantil","De lunes a viernes por la mañana en julio y agosto, hasta los 12 años: manualidades, juegos, descubrimientos. Por la tarde, desde las 16 h, está abierto a todos."],["La minigranja y el huerto","Se da de comer a los animales de lunes a viernes de 9:30 a 10 h (excepto los miércoles) y se recogen las hierbas aromáticas en el huerto."],["Las salidas","Canoa el miércoles: salida a las 9 h, le llevamos en coche y vuelve a su ritmo. El lunes a las 10 h, visita de la depuradora ecológica."],["El deporte","De domingo a viernes por la tarde: torneos, tiro con arco, ping-pong, fútbol, petanca, voleibol, tenis y baloncesto. Sala de juegos y televisión para descansar."]],

 g:[["Reservas y tarifas",[["¿Cómo se reserva?","Directamente en línea en la web, o por teléfono en el +33 5 53 29 12 64."],["¿Qué formas de pago aceptan?","Tarjeta bancaria, transferencia, cheque, cheques vacaciones ANCV y efectivo en el camping."],["¿Se puede pagar a plazos?","Sí, sin gastos. Póngase en contacto con nosotros para conocer las condiciones."],["¿Hay que pagar un anticipo?","Sí, un anticipo confirma la reserva; el resto se paga antes de la llegada. El importe y el plazo se le indican al reservar."],["¿Y si tengo que cancelar?","Puede cancelar en determinadas condiciones. Le aconsejamos el seguro de cancelación (4 % de la estancia)."]]],
 ["Alojamientos y parcelas",[["¿Qué alojamientos ofrecen?","Mobil-homes, un chalé, lodges de lona y parcelas para tiendas, caravanas y autocaravanas."],["¿Los alojamientos tienen aire acondicionado?","El Mobil-home Premium de 33 m² sí. Los demás tienen ventilación y sombra."],["¿Se incluyen sábanas y toallas?","No, pero puede alquilarlas en el camping."],["¿Se puede elegir la parcela?","Hacemos lo posible según sus preferencias (sombra, tranquilidad, cercanía a los aseos) y la disponibilidad."],["¿Cuántas personas por parcela?","6 personas como máximo. Las tiendas adicionales no tienen coste."]]],

 ["Instalaciones y servicios",[["¿El wifi es gratuito?","Sí, en la recepción y en el snack-bar."],["¿Hay tienda?","Sí, una pequeña tienda con productos básicos y productos locales."],["¿El camping es accesible?","Sí: aseos adaptados y acceso a las zonas comunes."],["¿Se permiten las barbacoas?","De gas y eléctricas, sí. De carbón, no, por razones de seguridad."],["¿Alquilan bicicletas?","Sí, para explorar los alrededores."]]],

villages:[["Monpazier","Bastida fundada en 1284 por Eduardo I de Inglaterra, ciudad de artesanos y artistas, a 10 minutos."],["Belvès","La ciudad de los 7 campanarios, encaramada en su espolón: viviendas trogloditas, castillo, iglesia y mercado cubierto."],["La Roque-Gageac","Tejas pardas, jardín exótico, manoir de Tarde y fuerte, a orillas del Dordoña."],["Beynac-et-Cazenac","Callejuelas, plazas empedradas, gabarras y globos aerostáticos."],["Domme","Bastida encaramada a 150 metros sobre el Dordoña."],["Castelnaud-la-Chapelle","Vistas al Dordoña y al Céou, castillo fortificado y castillo de Milandes."],["Limeuil","Ciudad medieval en la confluencia de los ríos, antiguo puerto, capilla de Saint-Martin."],["Saint-Amand-de-Coly","Su iglesia abacial del siglo XII, la más bella iglesia fortificada del Périgord."],["Saint-Léon-sur-Vézère","Callejuelas estrechas junto al río, artesanía y gastronomía."],["Saint-Jean-de-Côle","Muros ocres y tejados de teja, en el corazón del Périgord Vert."]],

avis:[["Excelente acogida, un equipo estupendo, un bar restaurante delicioso con una excelente relación calidad-precio. Piscina y piscina infantil separadas, al final más agradable con niños.","Laure A.","act"],["Camping cuidado, limpio y con muy buena acogida, restaurante muy bueno y propietarios muy amables. El agua de la piscina está caliente y el parque infantil es genial.","Anita T.","act"],["Las animaciones familiares y entrañables las dirige un equipo extraordinario. Los ratos en la terraza del bar y la cena del Périgord son imprescindibles.","Sophie A.","act"],["Camping familiar y tranquilo, a la sombra de grandes árboles, relajante, con una piscina para los más pequeños y otra para los adultos.","Dominique R.","pisc"],["Los setos y los árboles ofrecen un entorno verde muy agradable. Un verdadero momento de paz y descanso, para los amantes de la naturaleza y la tranquilidad.","Jean-Jacques","pisc"],["La acogida, perfecta. La minigranja es muy simpática. El restaurante está buenísimo. ¡Nunca había visto un camping tan perfecto!","Jenpol","pisc"],["Las parcelas permiten conservar la intimidad y la libertad. A los niños les encanta la minigranja y la ecología está en el corazón de este camping.","Damien B.","empl"],["Un lugar encantador, muy bonito con estos grandes árboles. Una acogida preciosa de los propietarios, una bonita piscina, y todo con un mantenimiento excelente.","Lokiluc A.","empl"],["Nuestro grupo de 55 senderistas pasó 3 días en este camping. ¡Un camping ecorresponsable, impecable! El chef nos deleitó con productos de la tierra.","Geneviève R.","grp"],["Acogida muy cálida y familiar para nuestra estancia en grupo. Instalaciones muy bonitas, una agradable piscina climatizada y cocina refinada.","Sébastien F.","grp"]]

faq:{t:"Ihre Fragen",l:"Die Antworten auf die häufigsten Fragen.",
 g:[["Buchung und Preise",[["Wie buche ich?","Direkt online auf der Website oder telefonisch unter +33 5 53 29 12 64."],["Welche Zahlungsarten akzeptieren Sie?","Bankkarte, Überweisung, Scheck, ANCV-Urlaubsschecks und Bargeld vor Ort."],["Kann man in Raten zahlen?","Ja, ohne Gebühren. Kontaktieren Sie uns für die Bedingungen."],["Muss ich eine Anzahlung leisten?","Ja, eine Anzahlung bestätigt die Buchung; der Restbetrag wird vor der Anreise beglichen. Betrag und Fälligkeit teilen wir Ihnen bei der Buchung mit."],["Was, wenn ich stornieren muss?","Unter bestimmten Bedingungen können Sie stornieren. Wir empfehlen die Reiserücktrittsversicherung (4 % des Aufenthaltspreises)."]]],
 ["Unterkünfte und Stellplätze",[["Welche Unterkünfte bieten Sie an?","Mobilheime, ein Chalet, Zeltlodges und Stellplätze für Zelte, Wohnwagen und Wohnmobile."],["Sind die Mietunterkünfte klimatisiert?","Das Mobilheim Premium mit 33 m² ist klimatisiert. Die anderen sind belüftet und liegen im Schatten."],["Sind Bettwäsche und Handtücher inklusive?","Nein, Sie können sie aber vor Ort mieten."],["Kann man seinen Stellplatz aussuchen?","Wir tun unser Bestes entsprechend Ihren Wünschen (Schatten, Ruhe, Nähe zu den Sanitäranlagen) und der Verfügbarkeit."],["Wie viele Personen pro Stellplatz?","Höchstens 6 Personen. Zusätzliche Zelte sind kostenlos."]]],
 ["An- und Abreise",[["Um welche Uhrzeit kann man anreisen?","Mietunterkünfte: Anreise ab 15 Uhr, Abreise bis 10 Uhr. Stellplätze: Anreise ab 14 Uhr, Abreise bis 12 Uhr."],["Ich komme spät an, was tun?","Informieren Sie uns vorab: Wir organisieren Ihre Ankunft."]]],
 ["Ausstattung und Services",[["Ist das WLAN kostenlos?","Ja, an der Rezeption und in der Snackbar."],["Gibt es einen Laden?","Ja, einen kleinen Laden mit Grundnahrungsmitteln und regionalen Produkten."],["Ist der Campingplatz barrierefrei?","Ja: behindertengerechte Sanitäranlagen und Zugang zu den Gemeinschaftsbereichen."],["Sind Grills erlaubt?","Gas- und Elektrogrills ja. Holzkohle nein, aus Sicherheitsgründen."],["Vermieten Sie Fahrräder?","Ja, um die Umgebung zu erkunden."]]],
 ["Haustiere und Regeln",[["Sind Haustiere erlaubt?","Ja, an der Leine und mit aktuellem Impfpass, außer Hunde der Kategorien 1 und 2."],["Ist der Campingplatz nachts ruhig?","Ja, ab 23 Uhr wird um Ruhe gebeten."],["Darf man Besuch empfangen?","Ja, Besucher melden sich an der Rezeption; für Pool und Animation kann ein Aufpreis verlangt werden."]]],

villages:[["Monpazier","Bastide, 1284 von Eduard I. von England gegründet, Stadt des Kunsthandwerks, 10 Minuten entfernt."],["Belvès","Die Stadt der 7 Glockentürme auf ihrem Felssporn: Höhlenwohnungen, Schloss, Kirche und Markthalle."],["La Roque-Gageac","Braune Dachziegel, exotischer Garten, Manoir de Tarde und Festung, direkt an der Dordogne."],["Beynac-et-Cazenac","Gassen, gepflasterte Plätze, Lastkähne (Gabarres) und Heißluftballons."],["Domme","Bastide auf einem Felsen, 150 Meter über der Dordogne."],["Castelnaud-la-Chapelle","Blick auf die Dordogne und den Céou, Burg und Schloss Milandes."],["Limeuil","Mittelalterliche Stadt am Zusammenfluss, alter Hafen, Kapelle Saint-Martin."],["Saint-Amand-de-Coly","Seine Abteikirche aus dem 12. Jahrhundert, die schönste Wehrkirche des Périgord."],["Saint-Léon-sur-Vézère","Enge Gassen am Fluss, Kunsthandwerk und Gastronomie."],["Saint-Jean-de-Côle","Ockerfarbene Mauern und Ziegeldächer, im Herzen des Périgord Vert."]],

avis:[["Ausgezeichneter Empfang, tolles Team, ein köstliches Bar-Restaurant mit hervorragendem Preis-Leistungs-Verhältnis. Pool und Planschbecken getrennt, mit Kindern letztlich angenehmer.","Laure A.","act"],["Gepflegter, sauberer Campingplatz mit sehr gutem Empfang, sehr gutes Restaurant und sehr freundliche Besitzer. Der Pool ist warm, der Spielplatz ist toll.","Anita T.","act"],["Das gesellige Familienprogramm wird von einem Spitzenteam geleitet. Die Stunden auf der Terrasse der Bar und das Essen aus dem Périgord sind ein Muss.","Sophie A.","act"],["Ruhiger Familiencampingplatz, schattig mit großen Bäumen, erholsam, mit einem Pool für Kleinkinder und einem weiteren für Erwachsene.","Dominique R.","pisc"],["Die Hecken und Bäume bieten eine sehr angenehme grüne Umgebung. Ein echter Moment von Frieden und Entspannung, für alle, die Natur und Ruhe lieben.","Jean-Jacques","pisc"],["Der Empfang war perfekt. Der Mini-Bauernhof ist wirklich nett. Das Restaurant ist richtig gut. Einen so perfekten Campingplatz habe ich noch nie gesehen!","Jenpol","pisc"],["Die Stellplätze lassen Privatsphäre und Freiheit. Die Kinder lieben den Mini-Bauernhof, und Ökologie steht im Mittelpunkt dieses Campingplatzes.","Damien B.","empl"],["Ein reizender, sehr schöner Ort mit diesen großen Bäumen. Ein herzlicher Empfang durch die Besitzer, ein schöner Pool, alles bestens gepflegt.","Lokiluc A.","empl"],["Unsere Gruppe von 55 Wanderern hat 3 Tage auf diesem Campingplatz verbracht. Ein umweltbewusster, tadelloser Campingplatz! Der Koch hat uns mit regionalen Produkten verwöhnt.","Geneviève R.","grp"],["Sehr herzlicher, familiärer Empfang bei unserem Gruppenaufenthalt. Sehr schöne Einrichtungen, ein angenehmer beheizter Pool und feine Küche.","Sébastien F.","grp"]]

avis:[["Accoglienza eccellente, squadra splendida, un delizioso bar ristorante con un ottimo rapporto qualità-prezzo. Piscina e vasca per bambini separate, alla fine più piacevole con i bambini.","Laure A.","act"],["Campeggio ben tenuto, pulito e con un'ottima accoglienza, ristorante molto buono e proprietari gentilissimi. La piscina è calda, il parco giochi è bello.","Anita T.","act"],["Le animazioni per famiglie, conviviali, sono guidate da una squadra al top. I momenti sulla terrazza del bar e la cena del Périgord sono imperdibili.","Sophie A.","act"],["Campeggio familiare e tranquillo, ombreggiato da grandi alberi, rilassante, con una piscina per i più piccoli e un'altra per gli adulti.","Dominique R.","pisc"],["Le siepi e gli alberi offrono una cornice verde molto piacevole. Un vero momento di pace e relax, per gli amanti della natura e della tranquillità.","Jean-Jacques","pisc"],["Accoglienza perfetta. La mini-fattoria è davvero simpatica. Il ristorante è buonissimo. Non ho mai visto un campeggio così perfetto!","Jenpol","pisc"],["Le piazzole permettono di mantenere intimità e libertà. La mini-fattoria è molto apprezzata dai bambini e l'ecologia è al centro di questo campeggio.","Damien B.","empl"],["Un posto incantevole, bellissimo con questi grandi alberi. Un'accoglienza splendida dei proprietari, una bella piscina, il tutto con una manutenzione al top.","Lokiluc A.","empl"],["Il nostro gruppo di 55 escursionisti ha soggiornato 3 giorni in questo campeggio. Campeggio eco-responsabile, impeccabile! Lo chef ci ha deliziati con prodotti del territorio.","Geneviève R.","grp"],["Accoglienza molto calorosa e familiare per il nostro soggiorno di gruppo. Strutture bellissime, una piacevole piscina riscaldata e una cucina raffinata.","Sébastien F.","grp"]]
