<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AMF Menuiserie — Proposition Neovera Studio</title>
<meta name="description" content="Portes et portails en bois sur mesure, dessinés, fabriqués en France et posés par AMF Menuiserie, Paris 12e.">
<link rel="icon" href="img/logo.png">
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:400;font-display:swap;src:url(fonts/bricolage-grotesque-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:400;font-display:swap;src:url(fonts/bricolage-grotesque-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20C0}
@font-face{font-family:"Bricolage Grotesque";font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20C0}
@font-face{font-family:"Bricolage Grotesque";font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20C0}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-ext-800-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20C0}
@font-face{font-family:"Fragment Mono";font-weight:400;font-display:swap;src:url(fonts/fragment-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Fragment Mono";font-weight:400;font-display:swap;src:url(fonts/fragment-mono-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF}
:root{
--vert:#0F4A44;--vert2:#14605A;--vert3:#0A3632;--amf:#33A08F;--platre:#EEF1EF;--platre2:#E2E8E5;--graphite:#172120;--gris:#4F5D5A;--chene:#B57C4A;--chene2:#86552A;--trait:rgba(238,241,239,.5);
--t:"Bricolage Grotesque",ui-sans-serif,sans-serif;--m:"Fragment Mono",ui-monospace,monospace;
--r:2px;--max:1240px;--g:clamp(16px,4vw,48px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--platre);color:var(--graphite);font:400 17px/1.6 var(--t);font-optical-sizing:auto}
::selection{background:var(--chene);color:#fff}
::-webkit-scrollbar{width:11px;height:8px}::-webkit-scrollbar-track{background:var(--platre2)}::-webkit-scrollbar-thumb{background:var(--vert2);border:3px solid var(--platre2);border-radius:8px}
html{scrollbar-color:var(--vert2) var(--platre2)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration-color:var(--chene);text-underline-offset:.2em;text-decoration-thickness:1.5px}
:focus-visible{outline:2px solid var(--chene);outline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--g)}
.mono{font-family:var(--m);font-size:.78rem;letter-spacing:.02em}
h1,h2,h3{font-family:var(--t);font-weight:800;letter-spacing:-.025em;line-height:1.04;margin:0;text-wrap:balance}
h2{font-size:clamp(2rem,4.6vw,3.6rem)}
h3{font-size:1.3rem;letter-spacing:-.01em;line-height:1.2}
p{margin:0;text-wrap:pretty}
.lead{font-size:clamp(1.08rem,1.6vw,1.25rem);max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:.6em;min-height:48px;padding:.75em 1.3em;border-radius:var(--r);border:1.5px solid currentColor;font-weight:700;text-decoration:none;cursor:pointer;transition:background .25s,color .25s,transform .25s;background:transparent}
.btn-chene{background:var(--chene);border-color:var(--chene);color:var(--graphite)}
.btn-chene:hover{background:#d39d66}
.btn-vert{background:var(--vert);border-color:var(--vert);color:var(--platre)}
.btn-vert:hover{background:var(--vert2)}
.btn-ligne:hover{background:var(--graphite);color:var(--platre)}
.fleche{display:inline-block;transition:transform .3s}
a:hover .fleche,button:hover .fleche{transform:translateX(4px)}
/* en-tête */
.tete{position:sticky;top:0;z-index:40;background:rgba(238,241,239,.96);backdrop-filter:saturate(1.2);border-bottom:1px solid rgba(23,33,32,.12)}
.tete .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;min-height:72px}
.logo img{height:44px;width:auto}
.nav{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap}
.nav a{padding:.5em .75em;text-decoration:none;font-weight:500;font-size:.95rem;border-radius:var(--r);white-space:nowrap}
.nav a[aria-current=page]{background:var(--vert);color:var(--platre)}
.nav a:hover:not([aria-current=page]){background:var(--platre2)}
.nav a.nav-devis{color:var(--chene2);font-weight:700}
.outils{display:flex;align-items:center;gap:10px}
.langue{display:flex;align-items:center;gap:6px;border:1.5px solid var(--graphite);border-radius:var(--r);padding:0 6px 0 10px;min-height:40px}
.langue svg{flex:none}
.langue select{border:0;background:transparent;font-weight:500;font-size:.92rem;padding:.4em .2em;cursor:pointer}
.tel{display:inline-flex;align-items:center;gap:.45em;min-height:40px;padding:0 .9em;border-radius:var(--r);background:var(--vert);color:var(--platre);text-decoration:none;font-weight:700;font-size:.92rem;white-space:nowrap}
@media (max-width:1120px){
 .tete .wrap{grid-template-columns:auto 1fr;row-gap:0;padding-top:8px}
 .outils{justify-self:end}
 .nav{grid-column:1/-1;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--g));padding:6px var(--g) 8px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
 .nav::-webkit-scrollbar{display:none}
}
@media (max-width:1120px){.nav a.nav-devis{order:-1}.nav a:first-child{order:-2}}
@media (max-width:620px){.logo img{height:36px}.tel .tel-num{display:none}.langue select{max-width:104px}}
/* héros */
.heros{background:var(--vert);color:var(--platre);overflow:hidden}
.heros .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,72px);align-items:center;padding-top:clamp(36px,6vw,80px);padding-bottom:clamp(44px,6vw,88px)}
.heros h1{font-size:clamp(2.7rem,7.4vw,6.2rem);letter-spacing:-.04em;line-height:.95}
.heros .lead{margin-top:22px;color:rgba(238,241,239,.86)}
.heros .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.heros .btn-ligne{color:var(--platre)}
.heros .btn-ligne:hover{background:var(--platre);color:var(--vert)}
.preuves{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:30px;padding-top:18px;border-top:1px solid var(--trait);color:rgba(238,241,239,.8)}
.preuves span::before{content:"";display:inline-block;width:7px;height:7px;background:var(--chene);margin-right:9px;transform:translateY(-2px) rotate(45deg)}
/* la porte et ses cotes (geste signature) */
.plan{position:relative;margin:0;padding:0 0 46px 54px;justify-self:center;width:min(100%,440px)}
.baie{position:relative;aspect-ratio:3/4;border-radius:50% 50% 0 0/24% 24% 0 0;overflow:hidden;perspective:1300px;background:var(--vert3);box-shadow:0 0 0 1px var(--trait),0 30px 60px -30px rgba(0,0,0,.6)}
.baie>img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.vantail{position:absolute;inset:0;transform-origin:0 50%;background:linear-gradient(100deg,#16645d,#11554f 60%,#0f4b45);transition:transform 1.7s cubic-bezier(.62,.04,.18,1);will-change:transform;display:grid;grid-template-rows:1.15fr 1fr;gap:9%;padding:24% 15% 11%;box-shadow:inset -1px 0 0 rgba(255,255,255,.12)}
.vantail i{display:block;border:1.5px solid rgba(238,241,239,.38);box-shadow:inset 0 0 0 7px rgba(10,54,50,.35),inset 0 0 0 8.5px rgba(238,241,239,.22)}
.vantail i:first-child{border-radius:50% 50% 0 0/18% 18% 0 0}
.vantail b{position:absolute;right:11%;top:56%;width:13px;height:13px;border-radius:50%;background:var(--chene);box-shadow:0 2px 0 var(--chene2)}
.plan.ouvert .vantail{transform:rotateY(-84deg)}
.cote{position:absolute;color:rgba(238,241,239,.82)}
.cote-h{left:14px;top:0;bottom:46px;width:1px;background:currentColor;transform-origin:50% 100%}
.cote-l{left:54px;right:0;bottom:16px;height:1px;background:currentColor;transform-origin:0 50%}
.cote::before,.cote::after{content:"";position:absolute;background:currentColor}
.cote-h::before,.cote-h::after{left:-7px;width:15px;height:1px}.cote-h::before{top:0}.cote-h::after{bottom:0}
.cote-l::before,.cote-l::after{top:-7px;height:15px;width:1px}.cote-l::before{left:0}.cote-l::after{right:0}
.cote span{position:absolute;font:400 .74rem/1 var(--m);white-space:nowrap;background:var(--vert);padding:3px 6px;color:var(--platre)}
.cote-h span{left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.cote-l span{left:50%;top:50%;transform:translate(-50%,-50%)}
.plan .rappel{position:absolute;right:0;top:-6px;font:400 .72rem/1 var(--m);color:rgba(238,241,239,.6)}
.js .plan .cote-h{transform:scaleY(0)}.js .plan .cote-l{transform:scaleX(0)}.js .plan .cote span{opacity:0}
.plan.trace .cote-h{transform:scaleY(1);transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.plan.trace .cote-l{transform:scaleX(1);transition:transform .9s .2s cubic-bezier(.3,.7,.2,1)}
.plan.trace .cote span{opacity:1;transition:opacity .5s .8s}
.plan .baie{cursor:pointer}
/* sections */
section{position:relative}
.bloc{padding:clamp(64px,9vw,128px) 0}
.intro{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(28px,6vw,96px);align-items:end}
.intro .lead{color:var(--gris)}
.lien{display:inline-flex;align-items:center;gap:.5em;margin-top:22px;font-weight:700;text-decoration:underline}
.index{list-style:none;margin:44px 0 0;padding:0;border-top:1px solid rgba(23,33,32,.2)}
.index li{border-bottom:1px solid rgba(23,33,32,.2)}
.index a{position:relative;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:20px;padding:22px 4px;text-decoration:none}
.index h3{font-size:clamp(1.5rem,3.6vw,2.7rem);letter-spacing:-.03em;transition:transform .35s,color .35s}
.index .mono{color:var(--gris);text-align:right}
.index .fl{width:44px;height:44px;border:1.5px solid var(--graphite);border-radius:50%;display:grid;place-items:center;transition:background .3s,color .3s}
.index a:hover h3{transform:translateX(10px);color:var(--vert)}
.index a:hover .fl{background:var(--vert);color:var(--platre);border-color:var(--vert)}
.index .apercu{position:absolute;right:120px;top:50%;width:200px;aspect-ratio:4/5;object-fit:cover;transform:translateY(-50%) rotate(-3deg) scale(.9);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s;z-index:2;box-shadow:0 20px 40px -18px rgba(0,0,0,.5)}
.index a:hover .apercu{opacity:1;transform:translateY(-50%) rotate(-3deg) scale(1)}
.index .vign{display:none}
@media (max-width:760px){.index a{grid-template-columns:64px 1fr auto;gap:14px;padding:14px 0}.index .vign{display:block;width:64px;height:64px;object-fit:cover}.index .mono{display:none}.index .apercu{display:none}.index .fl{width:38px;height:38px}}
/* étapes */
.etapes{background:var(--platre2)}
.chaine{display:grid;grid-template-columns:repeat(3,1fr);margin-top:56px;position:relative}
.chaine::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--graphite)}
.chaine>div{position:relative;padding:30px 28px 0 0;border-left:1px solid var(--graphite)}
.chaine>div:first-child{border-left:0}
.chaine>div::before{content:"";position:absolute;left:-1px;top:-8px;height:16px;width:1px;background:var(--graphite)}
.chaine>div:not(:first-child){padding-left:28px}
.chaine h3{font-size:1.6rem}
.chaine p{margin-top:10px;color:var(--gris);max-width:34ch}
.chaine .mono{display:block;margin-top:-46px;margin-bottom:30px;color:var(--chene2);background:var(--platre2);width:max-content;padding-right:8px}
.etapes .fin{margin-top:48px;font-size:1.15rem;max-width:56ch}
@media (max-width:760px){.chaine{grid-template-columns:1fr;gap:34px}.chaine::before{display:none}.chaine>div,.chaine>div:not(:first-child){border-left:0;border-top:1px solid var(--graphite);padding:22px 0 0}.chaine>div::before{display:none}.chaine .mono{margin-top:0;margin-bottom:8px}}
/* cartouche */
.cartouche{margin-top:44px;border:1.5px solid var(--graphite);display:grid;grid-template-columns:repeat(3,1fr)}
.cartouche .tetec{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1.5px solid var(--graphite);background:var(--graphite);color:var(--platre)}
.cartouche div.c{padding:22px 18px;border-right:1px solid rgba(23,33,32,.35);border-bottom:1px solid rgba(23,33,32,.35);font-weight:700;font-size:1.12rem;line-height:1.3;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.cartouche div.c:nth-child(3n+1){border-right:0}
.cartouche div.c .mono{font-weight:400;color:var(--chene2)}
@media (max-width:760px){.cartouche{grid-template-columns:1fr 1fr}.cartouche div.c{border-right:1px solid rgba(23,33,32,.35)!important;min-height:92px;font-size:1rem}.cartouche div.c:nth-child(2n+1){border-right:0!important}}
/* avis */
.avis{background:var(--graphite);color:var(--platre)}
.avis-grille{display:grid;grid-template-columns:1fr 1fr;gap:28px 64px;margin-top:48px}
.avis-grille blockquote{margin:0;padding-top:20px;border-top:1px solid rgba(238,241,239,.25)}
.avis-grille blockquote:nth-child(even){transform:translateY(48px)}
.avis-grille p{font-size:clamp(1.15rem,2vw,1.45rem);line-height:1.4;font-weight:500}
.avis-grille cite{display:block;margin-top:14px;font-style:normal;font-family:var(--m);font-size:.8rem;color:var(--chene)}
.avis .lien{margin-top:88px;color:var(--platre)}
.note-trad{margin-top:18px;color:rgba(238,241,239,.55)}
@media (max-width:760px){.avis-grille{grid-template-columns:1fr}.avis-grille blockquote:nth-child(even){transform:none}.avis .lien{margin-top:36px}}
/* bois */
.bois{color:var(--platre);background:var(--vert3) url(img/planches.jpg) center/cover;isolation:isolate}
.bois::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,54,50,.96),rgba(10,54,50,.86));z-index:-1}
.bois .lead{margin-top:18px;color:rgba(238,241,239,.85)}
.essences{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:48px;border-top:1px solid var(--trait)}
.essences div{padding:22px 22px 0 0}
.essences div+div{padding-left:22px;border-left:1px solid var(--trait)}
.essences h3{font-size:1.35rem;color:var(--chene)}
.essences p{margin-top:8px;font-size:.98rem;color:rgba(238,241,239,.85)}
@media (max-width:900px){.essences{grid-template-columns:1fr 1fr}.essences div:nth-child(3){padding-left:0;border-left:0}.essences div{padding-bottom:22px}}
@media (max-width:520px){.essences{grid-template-columns:1fr}.essences div,.essences div+div{padding:18px 0;border-left:0;border-bottom:1px solid var(--trait)}}
/* galerie */
.mosaique{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:240px 240px;gap:10px;margin-top:40px}
.mosaique img{width:100%;height:100%;object-fit:cover}
.mosaique img:first-child{grid-row:1/3}
.entete-sec{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
@media (max-width:760px){.mosaique{grid-template-columns:1fr 1fr;grid-template-rows:200px 140px 140px}.mosaique img:first-child{grid-column:1/-1;grid-row:auto}.mosaique img:nth-child(n+6){display:none}}
/* appel */
.appel{background:var(--chene);color:var(--graphite)}
.appel .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center}
.appel .lead{margin-top:14px}
.appel .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.appel .actions .mono{flex-basis:100%}
.appel .mono{display:block}
.appel .btn-ligne:hover{background:var(--graphite);color:var(--chene)}
@media (max-width:760px){.appel .wrap{grid-template-columns:1fr}}
/* pied */
.pied{background:var(--graphite);color:rgba(238,241,239,.86);padding:64px 0 28px;font-size:.95rem}
.pied .grille{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:36px}
.pied h3{font-size:.9rem;font-family:var(--m);font-weight:400;color:var(--chene);margin-bottom:14px;letter-spacing:.02em}
.pied ul{list-style:none;margin:0;padding:0}
.pied li{margin:.3em 0}
.pied a{text-decoration:none}.pied a:hover{text-decoration:underline}
.pied .reseau{columns:2;column-gap:20px;font-size:.84rem;margin-top:12px}.pied summary{cursor:pointer;font-weight:500;min-height:32px}.pied summary:hover{color:var(--platre)}
.pied .bas{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:48px;padding-top:20px;border-top:1px solid rgba(238,241,239,.18);font-size:.85rem}
.pied .logo-b{background:var(--platre);display:inline-block;padding:8px 10px;border-radius:var(--r);margin-bottom:16px}
.pied .logo-b img{height:34px}
@media (max-width:900px){.pied .grille{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.pied .grille{grid-template-columns:1fr}.pied .reseau{columns:1}}
/* pages */
.page-tete{background:var(--vert);color:var(--platre)}
.page-tete .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,64px);align-items:center;padding-top:clamp(36px,6vw,72px);padding-bottom:clamp(36px,6vw,72px)}
.page-tete h1{font-size:clamp(2.4rem,6vw,4.8rem);letter-spacing:-.035em}
.page-tete .c{margin-top:14px;font-family:var(--m);font-size:.86rem;color:var(--chene)}
.page-tete .lead{margin-top:20px;color:rgba(238,241,239,.86)}
.page-tete .actions{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}
.page-tete .btn-ligne{color:var(--platre)}.page-tete .btn-ligne:hover{background:var(--platre);color:var(--vert)}
.page-tete figure{margin:0;position:relative}
.page-tete figure img{width:100%;aspect-ratio:4/4.4;object-fit:cover;border-radius:46% 46% 0 0/22% 22% 0 0}
.page-tete.simple .wrap{grid-template-columns:1fr}
@media (max-width:760px){.page-tete .wrap{grid-template-columns:1fr}.page-tete figure img{aspect-ratio:4/3;border-radius:0}}
.modeles{margin-top:40px;border-top:1px solid rgba(23,33,32,.25)}
.modele{display:grid;grid-template-columns:150px 1fr 1.3fr;gap:28px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(23,33,32,.25)}
.modele.photo{grid-template-columns:160px 1fr 1.3fr}
.modele img{width:160px;height:160px;object-fit:cover}
.modele h3{font-size:1.55rem}
.modele p{color:var(--gris)}
@media (max-width:760px){.modele,.modele.photo{grid-template-columns:84px 1fr;gap:6px 16px}.modele img{width:84px;height:84px}.modele>p{grid-column:2}.modele>.schema,.modele>img{grid-row:span 2}}
.schema{width:150px;height:150px;color:var(--vert)}
@media (max-width:760px){.schema{width:84px;height:84px}}
.schema .mur{stroke:var(--graphite);stroke-width:3}
.schema .arc{stroke:var(--chene);stroke-width:1;stroke-dasharray:3 3;fill:none}
.schema .vt{stroke:var(--vert);stroke-width:5;stroke-linecap:round}
.schema .vt{transition:transform 1.1s cubic-bezier(.6,.05,.2,1)}
.modele:hover .schema .vt,.schema.joue .vt{transform:var(--fin)}
.specs{margin-top:36px;border:1.5px solid var(--graphite)}
.specs div{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid rgba(23,33,32,.3)}
.specs div:last-child{border-bottom:0}
.specs dt{padding:16px 18px;font-weight:700;border-right:1px solid rgba(23,33,32,.3);background:var(--platre2)}

specs:[["Fermeture","Battante, coulissante, pivotante ou pliante."],["Bois","Traditionnel ou exotique."],["Finitions","Rendu du bois, fermeture automatisée, pose de miroirs…"]],
reno:"Vos portes intérieures existantes méritent une seconde vie ? Parlez-nous-en : nous étudions leur rénovation."},
"haussmann":{t:"Porte haussmannienne en bois",c:"Moulures et tableaux, à l'ancienne",why:"Vous habitez un appartement haussmannien, ou vous rêvez d'un air parisien chez vous ? Reconnaissable à ses moulures et à ses deux ou trois tableaux, la porte haussmannienne apporte élégance et raffinement. Nous en réalisons et en rénovons de tout type.",

specs:[["Sur mesure","Dimensions selon vos indications ; taille et nombre de tableaux au choix."],["Intégrations","Charnières invisibles, serrures, vitres."],["Style traditionnel","Patine, vernis, cire, huile naturelle, peinture ; accessoires de style ancien en fer, laiton ou porcelaine."],["Style contemporain","Céruse, wengé, naturel, blanchi, inox, chromé ou satiné."],["Bois","Noyer, tilleul, châtaignier, chêne, merisier, tous issus de forêts gérées durablement (FSC ou PEFC)."],["Moulures","Moulures de style d'époque, réalisées selon des techniques traditionnelles."]],
reno:"Nous rénovons aussi les portes haussmanniennes d'origine, moulures comprises."},
"porte-fenetre":{t:"Porte-fenêtre en bois",c:"À la française ou coulissante",why:"Pour vos balcons, terrasses et jardins : une grande ouverture qui laisse entrer pleinement la lumière, avec un air méditerranéen. Nos artisans confirmés la réalisent ou la rénovent avec précision.",
types:[["Entièrement vitrée","Une baie vitrée pour laisser entrer toute la lumière."],["Avec soubassement","La beauté du bois en partie basse."],["À la française ou coulissante","Ouverture battante traditionnelle, ou coulissante et à galandage pour ne pas occuper la pièce."]],
specs:[["Vantaux","Un ou deux, choix des portes et du type de poignée."],["Sur mesure","Chaque habitat a ses particularités : votre porte-fenêtre est adaptée à la vôtre, pour allier esthétique, solidité et isolation."],["Matériaux","Choisis selon votre demande, en tenant compte de votre budget."]],
reno:"Nous rénovons aussi votre porte-fenêtre pour la rendre comme neuve."}

"porte-entree":{t:"Wooden front door",c:"Solid, half-glazed or glazed",why:"Wood is still the first choice for a front door: warm, strong, insulating and easy to personalise. We draw it to suit your home so it fits in perfectly. It can be combined with glass, metal or PVC, and an inner steel frame adds security.",
types:[["Solid","Maximum security and insulation, with a solid look."],["Half-glazed","The right balance: elegance, security and weather protection."],["Glazed","Elegant and light, it brings daylight into your hallway."]],
specs:[["Oak","Strong and hard-wearing, it does not warp and needs little care or treatment."],["Fir or solid pine","Light: perfect for a chalet or cabin door."],["Exotic woods","Ayous, sapele, sipo, iroko… very dense, low-maintenance, a wide choice of shades and textures."],["Origin","FSC or PEFC certified woods from sustainably managed forests."]],
reno:"AMF Menuiserie also restores wooden front doors. Show us yours: we will transform it the way you want."},
"placard":{t:"Wooden cupboard doors",c:"Hinged, folding or sliding",why:"Storage with unusual dimensions, a clear idea of how your doors should look? We build the cupboard doors that match, for a warm interior.",

specs:[["Opening","Hinged, folding or sliding; number of doors and leaves to suit."],["Wood","Fir for lightness, or exotic woods: red cedar, teak, iroko, kosipo…"],["Handle","Knob, vertical or horizontal handle, or built into the door."],["Finish","Raw, varnished, painted, built-in mirror and more."]],
reno:"A damaged wooden cupboard door? We repair it with care so it looks as good as on day one."},
"portail":{t:"Wooden gate",c:"Swing or sliding, can be motorised",why:"Your gate is the first thing people see when they arrive. In wood and made to measure, it gives a warm, traditional welcome, with endless ways to personalise it.",
types:[["Swing","For a traditional opening."],["Sliding","For an original, modern look."]],
specs:[["Infill","Open-work, solid base, semi-solid or solid."],["Shape","Straight, curved, \"gendarme's hat\", or custom."],["Motorisation","Possible, with or without reinforcement."],["Wood","Traditional (oak, beech, fir, birch) or exotic and others (teak, mahogany, spruce)."],["Finish","Raw, paint, varnish, texture…"]],
reno:"We restore every kind of wooden gate to make it like new."},
"interieure":{t:"Wooden interior door",c:"Hinged, sliding, pivot, folding",why:"Doors are seen every day. Made to measure, they match the room, even with unusual dimensions, right down to flush doors that blend into the wall.",

reno:"Do your existing interior doors deserve a second life? Tell us about them: we will look at restoring them."},
"haussmann":{t:"Wooden Haussmann door",c:"Mouldings and panels, the traditional way",why:"Do you live in a Haussmann apartment, or dream of a Parisian feel at home? Recognisable by its mouldings and two or three panels, the Haussmann door brings elegance and refinement. We make and restore every type.",
types:[["Straight","The classic shape, to the size of your opening."],["Arched or round-headed","To follow a curved opening."],["Sliding","The Haussmann door also comes as a sliding version."]],
specs:[["Made to measure","Dimensions as you specify; panel size and number to suit."],["Fittings","Concealed hinges, locks, glass."],["Traditional style","Patina, varnish, wax, natural oil, paint; period-style fittings in iron, brass or porcelain."],["Contemporary style","Limed, wenge, natural, bleached, stainless, chrome or satin."],["Wood","Walnut, lime, chestnut, oak, cherry, all from sustainably managed forests (FSC or PEFC)."],["Mouldings","Period-style mouldings made with traditional techniques."]],
reno:"We also restore original Haussmann doors, mouldings included."},

types:[["Fully glazed","A wide glazed opening to let all the light in."],["With a wooden base panel","The beauty of wood on the lower part."],["Casement or sliding","Traditional French opening, or sliding and pocket so it takes no room."]],
specs:[["Leaves","One or two, choice of doors and handle."],["Made to measure","Every home has its own features: your French window is adapted to yours, combining looks, strength and insulation."],["Materials","Chosen for your request, with your budget in mind."]],
reno:"We also restore your French window to make it like new."}

"porte-entree":{t:"Puerta de entrada de madera",c:"Maciza, semiacristalada o acristalada",why:"La madera sigue siendo la primera opción para una puerta de entrada: cálida, sólida, aislante y fácil de personalizar. La diseñamos según su casa para que encaje perfectamente. Puede combinarse con vidrio, metal o PVC, y una estructura interna de acero refuerza la seguridad.",
types:[["Maciza","El máximo de seguridad y aislamiento, con aspecto robusto."],["Semiacristalada","El buen término medio: elegancia, seguridad y protección contra la intemperie."],["Acristalada","Elegante y ligera, deja entrar la luz en su entrada."]],
specs:[["Roble","Sólido y resistente, no se deforma con el tiempo y necesita poco mantenimiento o tratamiento."],["Abeto o pino macizo","Ligero: perfecto para la puerta de un chalé o una caseta."],["Maderas exóticas","Ayous, sapelli, sipo, iroko… muy densas, poco mantenimiento, gran variedad de tonos y texturas."],["Origen","Maderas con sello FSC o PEFC, de bosques gestionados de forma sostenible."]],
reno:"AMF Menuiserie también renueva puertas de entrada de madera. Muéstrenos la suya: la transformamos como usted desee."},
"placard":{t:"Puerta de armario de madera",c:"Batiente, plegable o corredera",why:"¿Un armario de medidas especiales, una idea clara del aspecto de sus puertas? Fabricamos la puerta de armario que le corresponde, para una decoración cálida.",
types:[["Batientes","Si tiene espacio: una apertura sencilla y tradicional, y todo el interior de un vistazo."],["Plegables «acordeón»","Ocupan menos espacio y son muy prácticas. Usted elige el número de hojas y el estilo."],["Correderas o empotradas","Una apertura original que no ocupa la habitación, con múltiples configuraciones."]],
specs:[["Apertura","Batiente, plegable o corredera; número de puertas y hojas a elegir."],["Madera","Abeto por su ligereza, o maderas exóticas: cedro rojo, teca, iroko, kosipo…"],["Tirador","Pomo, tirador vertical u horizontal, o integrado en la puerta."],["Acabado","En bruto, barnizado, pintado, con espejo integrado y más."]],
reno:"¿Una puerta de armario de madera dañada? La reparamos con cuidado para que recupere el aspecto del primer día."},
"portail":{t:"Portón de madera",c:"Batiente o corredero, motorizable",why:"El portón es lo primero que se ve al llegar a su casa. De madera y a medida, ofrece una bienvenida cálida y tradicional, con infinitas posibilidades de personalización.",
types:[["Batiente","Para una apertura tradicional."],["Corredero","Para un aspecto original y moderno."]],
specs:[["Relleno","Calado, parte baja maciza, semimacizo o macizo."],["Forma","Recta, abombada, «sombrero de gendarme» o personalizada."],["Motorización","Posible, con o sin refuerzo."],["Madera","Tradicionales (roble, haya, abeto, abedul) o exóticas y otras (teca, caoba, pícea)."],["Acabado","En bruto, pintura, barniz, textura…"]],
reno:"Renovamos todo tipo de portones de madera para dejarlos como nuevos."},
"interieure":{t:"Puerta interior de madera",c:"Batiente, corredera, pivotante, plegable",why:"Las puertas se ven cada día. A medida, combinan con la habitación, incluso con medidas especiales, hasta las puertas enrasadas que se funden con la pared.",
types:[["Batiente","La puerta clásica, que gira sobre un eje vertical. Paso total; prevea al menos un metro libre. Un aspecto tradicional y familiar."],["Corredera o empotrada","Una o dos hojas se deslizan por un riel, dentro del tabique o sobre la pared. Sin barrido: discreta, moderna y adaptada a personas con movilidad reducida."],["Pivotante","Gira sobre pivotes, hasta 360°, y puede quedar enrasada, casi invisible. Se abre con una simple presión; paneles luminosos, espejos, apertura automática o antiatrapamiento posibles."],["Plegable «acordeón»","Hojas que se pliegan sobre sí mismas, con riel arriba o abajo, para modular el espacio."]],
specs:[["Cierre","Batiente, corredera, pivotante o plegable."],["Madera","Tradicional o exótica."],["Acabados","Aspecto de la madera, cierre automático, espejos…"]],
reno:"¿Sus puertas interiores merecen una segunda vida? Cuéntenos: estudiamos su renovación."},
"haussmann":{t:"Puerta haussmanniana de madera",c:"Molduras y cuarterones, a la antigua",why:"¿Vive en un piso haussmanniano o sueña con un aire parisino en casa? Reconocible por sus molduras y sus dos o tres cuarterones, la puerta haussmanniana aporta elegancia y refinamiento. Fabricamos y renovamos todo tipo.",
types:[["Recta","La forma clásica, a la medida de su hueco."],["Arqueada o de medio punto","Para adaptarse a un hueco curvo."],["Corredera","La puerta haussmanniana también existe en versión corredera."]],
specs:[["A medida","Dimensiones según sus indicaciones; tamaño y número de cuarterones a elegir."],["Integraciones","Bisagras ocultas, cerraduras, vidrios."],["Estilo tradicional","Pátina, barniz, cera, aceite natural, pintura; herrajes de estilo antiguo en hierro, latón o porcelana."],["Estilo contemporáneo","Decapado, wengué, natural, blanqueado, inox, cromado o satinado."],["Madera","Nogal, tilo, castaño, roble, cerezo, de bosques gestionados de forma sostenible (FSC o PEFC)."],["Molduras","Molduras de época, realizadas con técnicas tradicionales."]],
reno:"También renovamos puertas haussmannianas originales, molduras incluidas."},
"porte-fenetre":{t:"Puertaventana de madera",c:"Batiente o corredera",why:"Para balcones, terrazas y jardines: una gran abertura que deja entrar toda la luz, con aire mediterráneo. Nuestros carpinteros la fabrican o renuevan con precisión.",
types:[["Totalmente acristalada","Un gran ventanal para dejar entrar toda la luz."],["Con zócalo","La belleza de la madera en la parte baja."],["Batiente o corredera","Apertura tradicional a la francesa, o corredera y empotrada para no ocupar la habitación."]],
specs:[["Hojas","Una o dos; elección de puertas y tirador."],["A medida","Cada vivienda tiene sus particularidades: su puertaventana se adapta a la suya, uniendo estética, solidez y aislamiento."],["Materiales","Elegidos según su solicitud y teniendo en cuenta su presupuesto."]],
reno:"También renovamos su puertaventana para dejarla como nueva."}
},

P:{
"porte-entree":{t:"Haustür aus Holz",c:"Voll, teilverglast oder verglast",why:"Holz ist bei Haustüren nach wie vor die erste Wahl: warm, robust, dämmend und leicht zu gestalten. Wir zeichnen sie passend zu Ihrem Haus, damit sie sich perfekt einfügt. Glas, Metall oder PVC lassen sich kombinieren, und ein innerer Stahlrahmen erhöht die Sicherheit.",
types:[["Voll","Maximale Sicherheit und Dämmung, mit massiver Optik."],["Teilverglast","Der gute Kompromiss: Eleganz, Sicherheit und Wetterschutz."],["Verglast","Elegant und leicht, bringt Licht in Ihren Eingang."]],
specs:[["Eiche","Robust und widerstandsfähig, verzieht sich nicht und braucht wenig Pflege oder Behandlung."],["Tanne oder Kiefer massiv","Leicht: ideal für die Tür eines Chalets oder Gartenhauses."],["Tropenhölzer","Ayous, Sapelli, Sipo, Iroko … sehr dicht, pflegeleicht, große Auswahl an Farbtönen und Strukturen."],["Herkunft","FSC- oder PEFC-zertifizierte Hölzer aus nachhaltig bewirtschafteten Wäldern."]],
reno:"AMF Menuiserie renoviert auch Haustüren aus Holz. Zeigen Sie uns Ihre Tür – wir verwandeln sie nach Ihren Wünschen."},
"placard":{t:"Schranktüren aus Holz",c:"Dreh-, Falt- oder Schiebetüren",why:"Ein Stauraum mit besonderen Maßen, eine klare Vorstellung vom Aussehen Ihrer Türen? Wir fertigen die passenden Schranktüren für ein warmes Wohngefühl.",
types:[["Drehtüren","Wenn Sie Platz haben: einfache, traditionelle Öffnung, alles auf einen Blick."],["Falttüren","Sie brauchen weniger Platz und sind sehr praktisch. Anzahl der Flügel und Stil nach Wahl."],["Schiebe- oder Taschentüren","Eine originelle Öffnung, die keinen Raum beansprucht, in vielen Varianten."]],
specs:[["Öffnung","Dreh-, Falt- oder Schiebetür; Anzahl der Türen und Flügel nach Wahl."],["Holz","Tanne wegen ihrer Leichtigkeit oder Tropenhölzer: Rotzeder, Teak, Iroko, Kosipo …"],["Griff","Knauf, senkrechter oder waagerechter Griff oder in die Tür integriert."],["Oberfläche","Roh, lackiert, gestrichen, mit Spiegel und mehr."]],
reno:"Eine beschädigte Schranktür aus Holz? Wir reparieren sie sorgfältig, damit sie wieder wie neu aussieht."},
"portail":{t:"Holztor",c:"Dreh- oder Schiebetor, mit Antrieb möglich",why:"Das Tor sieht man als Erstes, wenn man bei Ihnen ankommt. Aus Holz und nach Maß sorgt es für einen warmen, traditionellen Empfang, mit grenzenlosen Gestaltungsmöglichkeiten.",
types:[["Drehtor","Für eine traditionelle Öffnung."],["Schiebetor","Für einen originellen, modernen Look."]],
specs:[["Füllung","Offen, unten geschlossen, halb geschlossen oder geschlossen."],["Form","Gerade, gewölbt, „Gendarmenhut“ oder individuell."],["Antrieb","Möglich, mit oder ohne Verstärkung."],["Holz","Heimisch (Eiche, Buche, Tanne, Birke) oder exotisch und andere (Teak, Mahagoni, Fichte)."],["Oberfläche","Roh, Farbe, Lack, Struktur …"]],
reno:"Wir renovieren Holztore jeder Art, damit sie wie neu werden."},
"interieure":{t:"Innentür aus Holz",c:"Dreh-, Schiebe-, Pivot-, Falttür",why:"Türen sieht man jeden Tag. Nach Maß passen sie zum Raum, auch bei besonderen Maßen – bis hin zu flächenbündigen Türen, die mit der Wand verschmelzen.",
types:[["Drehtür","Die klassische Tür mit senkrechter Drehachse. Voller Durchgang; mindestens einen Meter Platz einplanen. Traditionell und wohnlich."],["Schiebe- oder Taschentür","Ein oder zwei Flügel gleiten auf einer Schiene, in der Wand oder davor. Kein Schwenkbereich: dezent, modern und für Menschen mit eingeschränkter Mobilität geeignet."],["Pivottür","Sie dreht sich auf Zapfen, bis zu 360°, und kann flächenbündig, fast unsichtbar sein. Öffnet mit leichtem Druck; Leuchtpaneele, Spiegel, automatische Öffnung oder Fingerklemmschutz möglich."],["Falttür","Flügel, die sich zusammenfalten, auf einer oberen oder unteren Schiene, um den Raum flexibel zu nutzen."]],
specs:[["Schließart","Dreh-, Schiebe-, Pivot- oder Falttür."],["Holz","Heimisch oder exotisch."],["Ausführung","Holzoptik, automatisches Schließen, Spiegel …"]],
reno:"Ihre vorhandenen Innentüren verdienen ein zweites Leben? Sprechen Sie uns an: Wir prüfen die Renovierung."},
"haussmann":{t:"Haussmann-Tür aus Holz",c:"Profile und Füllungen, nach alter Art",why:"Sie wohnen in einer Haussmann-Wohnung oder wünschen sich Pariser Flair? Erkennbar an ihren Zierprofilen und zwei oder drei Füllungen, bringt die Haussmann-Tür Eleganz und Raffinesse. Wir fertigen und renovieren alle Arten.",
types:[["Gerade","Die klassische Form, passend zu Ihrer Öffnung."],["Bogen oder Rundbogen","Für eine gewölbte Öffnung."],["Schiebetür","Die Haussmann-Tür gibt es auch als Schiebetür."]],

P:{
"porte-entree":{t:"Porta d'ingresso in legno",c:"Piena, semivetrata o vetrata",why:"Il legno resta la prima scelta per una porta d'ingresso: caldo, solido, isolante e facile da personalizzare. La disegniamo secondo la vostra casa perché si integri alla perfezione. Si può abbinare a vetro, metallo o PVC, e una struttura interna in acciaio rafforza la sicurezza.",
types:[["Piena","Il massimo di sicurezza e isolamento, con un aspetto massiccio."],["Semivetrata","Il giusto compromesso: eleganza, sicurezza e protezione dalle intemperie."],["Vetrata","Elegante e leggera, porta luce nel vostro ingresso."]],
specs:[["Rovere","Solido e resistente, non si deforma col tempo e richiede poca manutenzione o trattamento."],["Abete o pino massello","Leggero: perfetto per la porta di uno chalet o di una casetta."],["Legni esotici","Ayous, sapelli, sipo, iroko… molto densi, poca manutenzione, ampia scelta di tonalità e venature."],["Origine","Legni certificati FSC o PEFC, da foreste gestite in modo sostenibile."]],
reno:"AMF Menuiserie restaura anche porte d'ingresso in legno. Mostrateci la vostra: la trasformiamo come desiderate."},
"placard":{t:"Ante per armadi in legno",c:"A battente, pieghevoli o scorrevoli",why:"Un vano dalle misure particolari, un'idea precisa dell'aspetto delle ante? Realizziamo le ante che fanno per voi, per un arredo caldo.",
types:[["A battente","Se avete spazio: un'apertura semplice e tradizionale, e tutto l'interno con un colpo d'occhio."],["Pieghevoli «a soffietto»","Occupano meno spazio e sono pratiche. Scegliete il numero di ante e lo stile."],["Scorrevoli o a scomparsa","Un'apertura originale che non occupa la stanza, con molte configurazioni."]],
specs:[["Apertura","A battente, pieghevole o scorrevole; numero di ante a scelta."],["Legno","Abete per la leggerezza, o legni esotici: cedro rosso, teak, iroko, kosipo…"],["Maniglia","Pomolo, maniglia verticale o orizzontale, o integrata nell'anta."],["Finitura","Grezza, verniciata, laccata, con specchio integrato e altro."]],
reno:"Un'anta in legno rovinata? La ripariamo con cura perché torni come il primo giorno."},
"portail":{t:"Cancello in legno",c:"A battente o scorrevole, motorizzabile",why:"Il cancello è la prima cosa che si vede arrivando da voi. In legno e su misura, offre un'accoglienza calda e tradizionale, con infinite possibilità di personalizzazione.",
types:[["A battente","Per un'apertura tradizionale."],["Scorrevole","Per un aspetto originale e moderno."]],
specs:[["Tamponamento","Traforato, basso pieno, semipieno o pieno."],["Forma","Dritta, bombata, «cappello da gendarme» o personalizzata."],["Motorizzazione","Possibile, con o senza rinforzo."],["Legno","Tradizionali (rovere, faggio, abete, betulla) o esotici e altri (teak, mogano, peccio)."],["Finitura","Grezza, pittura, vernice, texture…"]],
reno:"Restauriamo ogni tipo di cancello in legno per rimetterlo a nuovo."},
"interieure":{t:"Porta interna in legno",c:"A battente, scorrevole, pivotante, pieghevole",why:"Le porte si vedono ogni giorno. Su misura, si accordano alla stanza anche con misure particolari, fino alle porte filo muro che si confondono con la parete.",
types:[["A battente","La porta classica, che ruota su un asse verticale. Passaggio totale; prevedere almeno un metro di spazio. Un aspetto tradizionale e familiare."],["Scorrevole o a scomparsa","Una o due ante scorrono su un binario, nella parete o esterno muro. Nessun ingombro di apertura: discreta, moderna e adatta a persone con mobilità ridotta."],["Pivotante","Ruota su perni, fino a 360°, e può essere filo muro, quasi invisibile. Si apre con una leggera pressione; pannelli luminosi, specchi, apertura automatica o salvadita possibili."],["Pieghevole «a soffietto»","Ante che si ripiegano su sé stesse, su binario alto o basso, per modulare lo spazio."]],
specs:[["Chiusura","A battente, scorrevole, pivotante o pieghevole."],["Legno","Tradizionale o esotico."],["Finiture","Resa del legno, chiusura automatica, specchi…"]],
reno:"Le vostre porte interne meritano una seconda vita? Parlatecene: ne studiamo il restauro."},
"haussmann":{t:"Porta haussmanniana in legno",c:"Modanature e specchiature, all'antica",why:"Abitate in un appartamento haussmanniano o sognate un tocco parigino? Riconoscibile per le modanature e le due o tre specchiature, la porta haussmanniana porta eleganza e raffinatezza. Ne realizziamo e restauriamo di ogni tipo.",
types:[["Dritta","La forma classica, sulle misure del vano."],["Ad arco o a tutto sesto","Per seguire un'apertura curva."],["Scorrevole","La porta haussmanniana esiste anche in versione scorrevole."]],
specs:[["Su misura","Dimensioni secondo le vostre indicazioni; dimensioni e numero di specchiature a scelta."],["Integrazioni","Cerniere a scomparsa, serrature, vetri."],["Stile tradizionale","Patina, vernice, cera, olio naturale, pittura; accessori in stile antico in ferro, ottone o porcellana."],["Stile contemporaneo","Decapato, wengé, naturale, sbiancato, inox, cromato o satinato."],["Legno","Noce, tiglio, castagno, rovere, ciliegio, tutti da foreste gestite in modo sostenibile (FSC o PEFC)."],["Modanature","Modanature d'epoca, realizzate con tecniche tradizionali."]],
reno:"Restauriamo anche porte haussmanniane originali, modanature comprese."},
"porte-fenetre":{t:"Portafinestra in legno",c:"A battente o scorrevole",why:"Per balconi, terrazze e giardini: una grande apertura che lascia entrare tutta la luce, con un'aria mediterranea. I nostri falegnami esperti la realizzano o restaurano con precisione.",
types:[["Interamente vetrata","Una grande vetrata per far entrare tutta la luce."],["Con zoccolo","La bellezza del legno nella parte bassa."],["A battente o scorrevole","Apertura tradizionale alla francese, o scorrevole e a scomparsa per non occupare la stanza."]],
specs:[["Ante","Una o due; scelta delle ante e della maniglia."],["Su misura","Ogni casa ha le sue particolarità: la vostra portafinestra si adatta alla vostra, unendo estetica, solidità e isolamento."],["Materiali","Scelti secondo la richiesta, tenendo conto del budget."]],
reno:"Restauriamo anche la vostra portafinestra per renderla come nuova."}

/* gabarit de plan pour le devis */
const DIM={'porte-entree':[215,90,1,'arc'],placard:[250,180,3,'pl'],portail:[160,350,2,'ajour'],interieure:[204,83,1,'pl'],haussmann:[250,90,1,'tab'],'porte-fenetre':[215,140,2,'vit']};
function planDevis(type,h,w){
 const d=DIM[type]||DIM['porte-entree'];const H=h>0?h:d[0],W=w>0?w:d[1];
 const maxW=210,maxH=270;let s=Math.min(maxW/W,maxH/H);const pw=W*s,ph=H*s;const x0=60+(maxW-pw)/2,y0=20+(maxH-ph);
 const st='stroke="#EEF1EF" fill="none"';let g='';
 if(d[3]==='arc'){const r=pw/2;g+='<path d="M'+x0+' '+(y0+ph)+'V'+(y0+r*.8)+'A'+r+' '+(r*.8)+' 0 0 1 '+(x0+pw)+' '+(y0+r*.8)+'V'+(y0+ph)+'Z" '+st+' stroke-width="2"/>';g+='<rect x="'+(x0+pw*.16)+'" y="'+(y0+ph*.52)+'" width="'+(pw*.68)+'" height="'+(ph*.36)+'" '+st+' stroke-width="1" opacity=".7"/>'}
 else{g+='<rect x="'+x0+'" y="'+y0+'" width="'+pw+'" height="'+ph+'" '+st+' stroke-width="2"/>';const n=d[2];for(let i=1;i<n;i++){const xx=x0+pw*i/n;g+='<line x1="'+xx+'" y1="'+y0+'" x2="'+xx+'" y2="'+(y0+ph)+'" stroke="#EEF1EF" stroke-width="1.5"/>'}
  for(let i=0;i<n;i++){const lx=x0+pw*i/n,lw=pw/n;
   if(d[3]==='tab'){g+='<rect x="'+(lx+lw*.16)+'" y="'+(y0+ph*.08)+'" width="'+(lw*.68)+'" height="'+(ph*.42)+'" '+st+' opacity=".75"/><rect x="'+(lx+lw*.16)+'" y="'+(y0+ph*.56)+'" width="'+(lw*.68)+'" height="'+(ph*.36)+'" '+st+' opacity=".75"/>'}
   else if(d[3]==='vit'){g+='<rect x="'+(lx+lw*.12)+'" y="'+(y0+ph*.06)+'" width="'+(lw*.76)+'" height="'+(ph*.6)+'" fill="rgba(51,160,143,.35)" stroke="#EEF1EF" stroke-width="1"/>'}
   else if(d[3]==='ajour'){for(let k=1;k<6;k++){const yy=y0+ph*k/6;g+='<line x1="'+(lx+4)+'" y1="'+yy+'" x2="'+(lx+lw-4)+'" y2="'+yy+'" stroke="#EEF1EF" stroke-width=".8" opacity=".6"/>'}}
   else{g+='<rect x="'+(lx+lw*.18)+'" y="'+(y0+ph*.1)+'" width="'+(lw*.64)+'" height="'+(ph*.8)+'" '+st+' opacity=".45"/>'}}}
 const lab=(v,k)=>v>0?(k+' '+v+' cm'):(k+' · '+U('planVide'));
 const cx=36,cy=y0+ph+22,c='#C08B55';
 g+='<g stroke="'+c+'" stroke-width="1"><line x1="'+cx+'" y1="'+y0+'" x2="'+cx+'" y2="'+(y0+ph)+'"/><line x1="'+(cx-6)+'" y1="'+y0+'" x2="'+(cx+6)+'" y2="'+y0+'"/><line x1="'+(cx-6)+'" y1="'+(y0+ph)+'" x2="'+(cx+6)+'" y2="'+(y0+ph)+'"/><line x1="'+x0+'" y1="'+cy+'" x2="'+(x0+pw)+'" y2="'+cy+'"/><line x1="'+x0+'" y1="'+(cy-6)+'" x2="'+x0+'" y2="'+(cy+6)+'"/><line x1="'+(x0+pw)+'" y1="'+(cy-6)+'" x2="'+(x0+pw)+'" y2="'+(cy+6)+'"/></g>';
 g+='<text x="'+(cx-8)+'" y="'+(y0+ph/2)+'" transform="rotate(-90 '+(cx-8)+' '+(y0+ph/2)+')" text-anchor="middle" fill="#EEF1EF" font-family="Fragment Mono,monospace" font-size="11">'+esc(lab(h,U('heroH')))+'</text>';
 g+='<text x="'+(x0+pw/2)+'" y="'+(cy+18)+'" text-anchor="middle" fill="#EEF1EF" font-family="Fragment Mono,monospace" font-size="11">'+esc(lab(w,U('heroL')))+'</text>';
 return '<svg viewBox="0 0 290 340" role="img" aria-label="'+esc(U('planTitre'))+'">'+g+'</svg>';
}
