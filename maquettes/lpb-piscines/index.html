rticulières actuelles, le tout avec le sourire. Je recommande sans hésiter !"],['Nicolas Tillier','',"Merci à toute l'équipe de LPB... Un super travail et une super piscine..... Au top, respect des délais promis au début.... Et du super matos.... Le tout, dans une bonne ambiance et du professionnalisme...... Vivement la prochaine..... Il y a encore des gens sérieux et ça fait plaisir.... Je recommande vivement à ceux qui hésite encore... Nicolas T."],['Pierrick Duperron','5 mai 2020',"Une super Équipe de professionnels qui a eu la maîtrise d'œuvre de la conception à livraison finale de la piscine, qui a su s'adapter lorsqu'elle a rencontré des situations inattendues pour un produit final à la hauteur de mes espérances. Je recommande sans réserve"],['Bernard Cotton','24 janvier 2020',"Un personnel très pro , un résultat plus que magnifique, je recommande vivement cette société, merci Famille Cotton"],['Jean-Philippe Bustin','18 avril 2019',"Une équipe dynamique et professionnelle, un travail précis et de qualité, des délais respectés et un résultat parfaitement à la hauteur de nos attentes. Très satisfait de notre choix et confiance donnés à Lpb. N'hésitez pas à faire appel à eux pour vos projets ! Je recommande"],['Rene Still','15 octobre 2017',"Une super équipe. Des pros au top. Respect des délais. Qualité des finitions. Travail soigné. Et une équipe hyper sympa. Bravo"],['Sebastien Mifsud','',"Personnel à l'écoute et prix compétitifs"],['Arnaud Manifacier','',"Très bonne piscine et surtout très beau résultat final.."]];

/* ---------- interactions des pages ---------- */
function terrain(k){document.querySelectorAll('[data-terrain]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.terrain===k));const link={pente:'piscine-bois',restanque:'piscine-bois',roche:'piscine-bois',petit:'piscine-alu',plat:'piscines'}[k];const r=document.getElementById('tres');if(r)r.innerHTML=`<h3>${t('terrain.'+k)}</h3><p>${t('terrain.r.'+k)}</p><div class="btns" style="margin-top:14px"><a class="btn" href="#/${link}">${t('ui.more')} ${ICON.arrow}</a>${addBtn('terrain.'+k)}</div>`}
function liner(k){document.querySelectorAll('[data-liner]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.liner===k));const el=document.getElementById('linerBig');if(el)el.innerHTML=`<div style="display:flex;gap:18px;align-items:center;margin-top:20px"><img src="${img('liner-'+k)}" alt="" style="width:120px;height:120px;object-fit:cover;border-radius:4px"><div><h3>${t('liner.'+k)}</h3>${addBtn('liner.'+k)}</div></div>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-terrain]');if(a)terrain(a.dataset.terrain);const b=e.target.closest('[data-liner]');if(b)liner(b.dataset.liner)});
function bindForm(){const f=document.getElementById('devis');if(!f)return;const dep=document.getElementById('fdep');const route=()=>{const v=dep.value;document.getElementById('route').textContent=(v==='13'||v==='84')?t('f.route13'):t('f.route83')};dep.addEventListener('change',route);route();
 f.addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('fnom').value.trim(),m=document.getElementById('fmail').value.trim(),p=document.getElementById('ftel').value.trim();const r=document.getElementById('fres');if(!n||(!m&&!p)){r.innerHTML=`<p class="msg err">${t('f.err')}</p>`;return}const ag=(dep.value==='13'||dep.value==='84')?t('agence.aubagne'):t('agence.stmax');r.innerHTML=`<p class="msg">${t('f.ok').replace('{agence}',ag)}</p>`})}

/* ---------- routeur ---------- */
function route(){
  const h=location.hash.replace(/^#\/?/,'');const [path,qs]=h.split('?');const [r,arg]=path.split('/');const q=new URLSearchParams(qs||'');
  const key=PAGES[r]?r:'';
  document.documentElement.lang=L;document.title=key?t(LBL[key]||'meta.title')+' — LPB Piscines':t('meta.title');
  drawNav(key);
  document.getElementById('main').innerHTML=PAGES[key](arg,q);
  document.querySelectorAll('[data-t]').forEach(el=>{const v=t(el.dataset.t);if(typeof v==='string')el.textContent=v});
  document.getElementById('botIn').placeholder=t('bot.ph');
  if(!key){terrain('pente');liner('sable');const s=document.getElementById('stack');requestAnimationFrame(()=>s&&s.classList.add('go'))}
  bindForm();saveMine();
  document.getElementById('mbCall').innerHTML=ICON.tel+t('ui.call');document.getElementById('mbDevis').textContent=t('ui.devis');
  const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('go');io.unobserve(e.target)}}),{threshold:.3}):null;
  document.querySelectorAll('.coupe').forEach(c=>io?io.observe(c):c.classList.add('go'));
  if(!arg||key!=='guides')window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
const sel=document.getElementById('langSel');sel.value=L;sel.addEventListener('change',()=>{L=sel.value;try{localStorage.setItem('lpb-lang',L)}catch(e){}route();resetBot()});

function answer(q){say(q,'u');const n=q.normalize('NFD').replace(/[̀-ͯ]/g,'');const fq=faqHit(n,3);const hit=fq?null:INTENTS.find(([k,re])=>re.test(q)||re.test(n));setTimeout(()=>{if(!hit){const f=fq||faqHit(n,2);if(f){say(f[1]+' — '+f[2],'a','#/faq');return}say(t('bot.unknown'),'a','#/contact');return}if(/prix|price|precio|preis|prezzo|prijs|co[uû]t|cost|kost/i.test(n)&&hit[0]==='devis'){say(t('bot.a.prix'),'a','#/contact');return}say(t(MAP[hit[0]]),'a',hit[2])},280)}
function faqHit(q,min){const w=q.toLowerCase().split(/[^a-z0-9\u00c0-\u024f]+/).filter(x=>x.length>3);let best=null,bs=0;for(const it of t('faq.items')){const txt=(it[1]+' '+it[2]).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const sc=w.filter(x=>txt.includes(x)).length;if(sc>bs){bs=sc;best=it}}return bs>=min?best:null}
