Zauberschwamm, Gel)."], ["eau", "Rotbraune Flecken auf dem Liner", "Mineral- oder Metallpartikel, Kalk: pH testen, Metallbinder."], ["eau", "Weiße Flecken auf dem Liner", "Zu viele Chlorprodukte: Der Liner ist beschädigt, das ist nicht umkehrbar."], ["mat", "Mein Roboter verfärbt sich", "Zu lange im Wasser oder in der Sonne: Chemikalien und UV schädigen das Material."], ["mat", "Mein Roboter MX9 fährt nicht mehr", "Saugkraft an der Saugdüse prüfen (Filter reinigen), Zustand von Schläuchen und Ketten, Verschleißteile."], ["mat", "Das Filtermanometer steht im roten Bereich", "Der Sand ist verdichtet: zu seltenes Rück- und Nachspülen."], ["mat", "Sand im Pool", "Wind, verschlissene Düsen, zu viel oder zu wenig Sand, verklebter Kalk oder Algen, zu starke Pumpe. Flockungsmittel hilft, den Sand zurückzuhalten."], ["mat", "Leichte Stromschläge im Wasser", "Elektrolyseur und pH-Regler erzeugen einen schwachen Strom: Einen Potentialausgleich (Erdung) installieren."], ["mat", "Meine Leiter rostet", "Edelstahl von schlechter Qualität oder Salzelektrolyseur ohne Ableitung der Ströme zur Erde."], ["mat", "In meinem Scheinwerfer steht Wasser", "Man stützt sich oft darauf und er verschiebt sich; selten ein Werksfehler. Lassen Sie ihn prüfen."], ["mat", "Schwacher Düsenstrahl", "Filter rückspülen und nachspülen; ein sehr großer Pool kann zu wenige Düsen haben."], ["mat", "Mein Liner wirft Falten", "Zu viel Chlor, pH zu sauer oder Wasser zu warm: Der Liner wird porös und gibt nach."]], "contact.h": "Sprechen wir über Ihren Pool", "contact.lead": "Ein paar Angaben, und Ihre Anfrage geht direkt an die richtige Agentur. Ein Berater ruft Sie zurück.", "f.type": "Welcher Pool?", "f.type.ns": "Weiß ich noch nicht", "f.pose": "Welche Bauweise?", "f.pose.hs": "Oberirdisch", "f.pose.se": "Halb eingelassen", "f.pose.en": "Eingegraben", "f.terrain": "Ihr Grundstück", "f.dim": "Gewünschte Maße (optional)", "f.dim.ph": "zum Beispiel 8 × 4 m", "f.nom": "Name", "f.email": "E-Mail", "f.tel": "Telefon", "f.dep": "Département", "f.ville": "Ort", "f.connu": "Wie haben Sie von uns erfahren?", "f.connu.o": ["Mundpropaganda", "Messe", "Soziale Netzwerke", "Anzeige", "Gelbe Seiten", "Werbeschild", "Sonstiges"], "f.msg": "Ihre Nachricht", "f.send": "Anfrage senden", "f.route83": "Ihre Anfrage geht an die Agentur Saint-Maximin.", "f.route13": "Ihre Anfrage geht an die Agentur Aubagne.", "f.ok": "Danke! In der Online-Version geht Ihre Anfrage an {agence}. Hier ist es ein Entwurf: Es wird nichts gesendet.", "f.err": "Es fehlen Ihr Name und eine E-Mail-Adresse oder Telefonnummer für den Rückruf.", "f.projet": "Hinzugefügt aus „Mein Projekt“:", "mine.h": "Mein Projekt", "mine.empty": "Noch nichts. Fügen Sie von den Seiten aus einen Pool, eine Option oder eine Gestaltung hinzu.", "mine.add": "Zu meinem Projekt hinzufügen", "mine.added": "Hinzugefügt", "mine.go": "Angebot für dieses Projekt anfragen", "mentions.h": "Impressum", "mentions.p": "LA PISCINE BOIS / LPB PISCINES, Hersteller und Installateur von Holzpools. LPB La Piscine Bois, RCS Draguignan 752 316 687. Sitz: Parc d'activité d'Aix, 340 avenue de la Maximinoise, 83470 Saint-Maximin-la-Sainte-Baume. Geschäftsführer: Florent Fondère. Die Inhalte der Website sind Eigentum von LA PISCINE BOIS; jede Vervielfältigung ohne Zustimmung ist untersagt (Art. L122-4 des französischen Code de la propriété intellectuelle). Der vollständige Text des Impressums und der Datenschutzerklärung Ihrer aktuellen Website wird bei der Installation übernommen.", "conf.h": "Datenschutzerklärung", "conf.p": "Die im Formular eingegebenen Daten dienen nur zur Beantwortung Ihrer Anfrage und werden nie weiterverkauft. Der vollständige Text Ihrer aktuellen Erklärung wird bei der Installation übernommen.", "foot.tag": "Hersteller und Installateur von Holz-, Alu-, Schalen- und Betonpools, seit über 20 Jahren.", "foot.maquette": "Redesign-Vorschlag von Neovera Studio – unverbindlicher Entwurf.", "bot.name": "LPB Conseil", "bot.sub": "Ich helfe Ihnen bei der Wahl", "bot.virtual": "Virtueller Assistent", "bot.hello": "Guten Tag! Ich bin der virtuelle Assistent von LPB Piscines. Grundstück, Poolart, Pflege, Agenturen: Stellen Sie Ihre Frage.", "bot.invite": "Eine Frage zu Ihrem Grundstück oder Ihrem künftigen Pool?", "bot.ph": "Schreiben Sie Ihre Frage …", "bot.send": "Senden", "bot.chips": ["Mein Grundstück liegt am Hang", "Holz, Alu, Schale oder Beton?", "Für wen ist der Bausatz?", "Grünes Wasser", "Öffnungszeiten der Agenturen", "Angebot anfragen"], "bot.unknown": "Ich bin nicht sicher, ob ich das richtig beantworten kann. Am einfachsten: Rufen Sie Saint-Maximin unter 04 89 67 80 90 oder Aubagne unter 04 42 36 71 36 an, oder hinterlassen Sie Ihre Anfrage im Formular.", "bot.a.pente": "Auf einem Hanggrundstück oder mit Terrassenhängen bauen wir oft einen halb eingelassenen Holzpool: weniger Erdarbeiten, eine patentierte Holz-Stahl-Konstruktion, die dem Druck der Erde standhält.", "bot.a.choix": "Holz: unser patentiertes Verfahren, nach Maß, auf jedem Gelände. Alu: dasselbe Konzept, sehr langlebig. Schale: schnell gesetzt, 10 Jahre Garantie. Beton: die Tradition, bis zum Überlaufbecken. Der Bausatz: zum Selbstaufbau.", "bot.a.kit": "Der Bausatz ist unser patentierter Holzpool, in unserer Werkstatt gefertigt, für Heimwerker: wenige Teile, Video-Tutorials, auf einer Betonplatte zu montieren. Bestellung auf lapiscinekit.com.", "bot.a.vert": "Grünes Wasser: meist Algen. Wasser testen, Schockchlorung, dann Algizid und Flockungsmittel. Ist es grün und klar, prüfen Sie zuerst die Alkalinität.", "bot.a.horaires": "Saint-Maximin: Montag bis Samstag, 9.30–12.30 und 13.30–17.30 Uhr. Aubagne: Dienstag bis Freitag 13–17 Uhr, Samstag 10–12 und 13–18 Uhr.", "bot.a.devis": "Das Angebotsformular stellt Ihnen ein paar Fragen (Pool, Bauweise, Grundstück) und sendet Ihre Anfrage an die richtige Agentur.", "bot.a.prix": "Wir veröffentlichen keine Preise: Jeder Pool wird nach Maß gebaut. Ein kostenloses Angebot ist in zwei Minuten angefragt.", "bot.a.coque": "Drei Cosmos-Schalen: Mercure (4,30 × 2,27 m), Vénus (3 m breit, 5 bis 7 m lang) und Saturne (4 m breit, 7 bis 9 m lang). Farben Weiß, Sand, Hellgrau, Hellblau.", "bot.a.hiver": "Überwintern Sie, wenn das Wasser unter 12 °C bleibt (15 °C bei Salz). Wir empfehlen die aktive Überwinterung: Filterung nachts zwischen 4 und 6 Uhr.", "bot.a.securite": "Das Gesetz verlangt eine genormte Sicherung: Zaun, Alarm, Abdeckung oder Überdachung. Wir bauen Zäune, Alarme, Stabplanen und Rollläden ein.", "bot.a.spa": "Unser Spa ist aus kesseldruckimprägniertem Holz Klasse IV, mit Sitzbank, Düsen, Scheinwerfer, armierter Folie Marmor weiß, Java-Stein oder Bali-Optik und Beckenrand aus IPE.", "bot.a.zone": "Wir sind in der ganzen Region PACA tätig, mit zwei Agenturen: Saint-Maximin (Var) und Aubagne (Bouches-du-Rhône).", "bot.a.terrasse": "Terrassen aus IPE oder Kiefer kesseldruckimprägniert Klasse 4, nach Maß, auf verstellbaren Fußplatten: Sie passen zu jedem Pool.", "bot.a.mairie": "Bis 10 m²: keine Formalitäten. Darüber: Anmeldung bei der Gemeinde. Baugenehmigung über 100 m².", "bot.a.pac": "Die reversible Wärmepumpe heizt oder kühlt das Wasser; Titanwärmetauscher mit 5 Jahren Garantie, salzwasserfest. Wir bauen sie ein.", "bot.a.liner": "Französische Liner nach Maß: Weiß, Frankreichblau, Hellblau, Graphit, Hellgrau, Dunkelgrau, Granitschwarz, Sand, Karibikgrün, Olivgrün und armiertes PVC.", "trust.avis": "16 veröffentlichte Google-Bewertungen", "bot.a.garantie": "Cosmos-Schalen haben 10 Jahre Garantie (MATIP-Norm). Der Titan-Wärmetauscher unserer Wärmepumpen hat 5 Jahre Garantie gegen Korrosion. Alles Weitere erläutern unsere Filialen im Angebot.", "bot.a.duree": "Unsere Kiefer ist bis in den Kern kesseldruckimprägniert (Klasse 4), viel haltbarer als oberflächlich behandeltes Holz; Aluminium hält Jahrzehnte. Die genaue Lebensdauer hängt von der Pflege ab: Unsere Filialen beraten Sie.", "bot.a.livraison": "Wir bauen in der ganzen Region PACA. Ob ein Bausatz weiter weg geliefert werden kann, klären unsere Filialen: Am einfachsten hinterlassen Sie eine Anfrage."}, "it": {"meta.title": "LPB Piscines – piscine in legno, alluminio, vetroresina e cemento nel Var e nelle Bouches-du-Rhône", "ui.skip": "Vai al contenuto", "ui.lang": "Lingua", "ui.devis": "Richiedi un preventivo", "ui.esquisse": "Schizza il mio progetto", "ui.call": "Chiama", "ui.back": "Indietro", "ui.more": "Vai alla pagina", "ui.all": "Tutto", "ui.close": "Chiudi", "ui.watch": "Guarda il video", "ui.video_soon": "Video visibile sul Suo sito attuale, da riprendere all'installazione.", "ui.dl": "Versione PDF disponibile in agenzia", "ui.see_all_real": "Vedi tutte le 72 realizzazioni", "ui.next": "Avanti", "ui.mine": "Il mio progetto", "nav.piscines": "Piscine", "nav.bois": "Piscina in legno", "nav.kit": "Piscina in kit", "nav.alu": "Piscina in alluminio", "nav.coque": "Piscina in vetroresina", "nav.beton": "Piscina in cemento", "nav.amenagement": "Allestimenti", "nav.amenagement_ext": "Sistemazioni esterne", "nav.terrasse": "Terrazze e pavimenti", "nav.spa": "Spa", "nav.entretien": "Manutenzione", "nav.traitement": "Trattamento", "nav.guides": "Guide", "nav.accessoires": "Accessori", "nav.securite": "Sicurezza", "nav.realisations": "Realizzazioni", "nav.apropos": "Chi siamo", "nav.contact": "Contatti", "nav.tutos": "Video tutorial", "nav.faq": "FAQ", "nav.presse": "Stampa", "nav.kitshop": "Ordini kit", "nav.mentions": "Note legali", "nav.confidentialite": "Privacy", "nav.conseil": "LPB Conseil", "top.agences": "Saint-Maximin 04 89 67 80 90 · Aubagne 04 42 36 71 36", "home.h1": "La piscina in legno che tiene su ogni terreno.", "home.lead": "Pendio, terrazzamenti, roccia, argilla: la nostra struttura in legno e acciaio, brevettata nel 2016, si installa dove gli altri rinunciano. Costruita e posata dai nostri team, nel Var e nelle Bouches-du-Rhône, da oltre 20 anni.", "home.facts": "6 dipartimenti coperti · 2 agenzie · 1.284 piscine e terrazze realizzate", "home.stamp": "Brevetto 2016 · legno + acciaio", "home.belt": "Cintura in acciaio UPN 220 mm, invisibile una volta posata", "brevet.h": "Perché le nostre piscine in legno non si muovono", "brevet.p1": "Nella maggior parte delle piscine in legno, dei puntoni sostengono le pareti. Con la spinta dell'acqua e della terra, finiscono per cedere.", "brevet.p2": "Florent Fondère ha disegnato qualcosa di diverso: una struttura in travi di pino, sostenuta in basso da una trave e cerchiata in alto da una cintura d'acciaio. La vasca è solida per tutta la sua altezza.", "brevet.l1": "Travi in pino scandinavo, impregnato in autoclave classe 4, spessore 4,5 cm", "brevet.l2": "Trave perimetrale lamellare 16 × 14 cm alla base", "brevet.l3": "Cintura UPN da 220 mm in acciaio, invisibile", "brevet.l4": "Bordi in pino larghi 30 cm, o in legno esotico", "brevet.no": "Puntoni: la soluzione che abbiamo abbandonato", "brevet.cta": "Scopra la piscina in legno", "mat.h": "Cinque modi di costruire la Sua piscina", "mat.bois": "Il nostro sistema brevettato, su misura, fuori terra, semi-interrato o interrato.", "mat.kit": "Lo stesso concetto, prodotto nei nostri laboratori, da montare da soli.", "mat.alu": "Il concetto in alluminio: grezzo o RAL 8008, leggero e duraturo.", "mat.coque": "Vasche in poliestere Cosmos prodotte in Francia, garantite 10 anni.", "mat.beton": "La tradizione in blocchi cassero, fino allo sfioro.", "terrain.h": "Pendenza, terrazzamenti, roccia: sappiamo come fare", "terrain.p": "Scelga la Sua situazione. Le diciamo che cosa posiamo di solito in quel caso.", "terrain.pente": "In pendenza", "terrain.restanque": "A terrazzamenti", "terrain.roche": "Roccioso o argilloso", "terrain.petit": "Poco spazio, cortile, terrazza sul tetto", "terrain.plat": "Terreno piano e libero", "terrain.r.pente": "Una piscina in legno semi-interrata: una parte nel terreno, una parte visibile, e meno scavi. Un vantaggio: l'acqua resta pulita più a lungo grazie alla parte rialzata.", "terrain.r.restanque": "Il nostro sistema si adatta ai terrazzamenti e agli accessi difficili: la struttura viene consegnata in pezzi e montata sul posto.", "terrain.r.roche": "Il legno e l'acciaio assorbono le sollecitazioni del terreno. Studiamo l'ubicazione (suolo, esposizione, vicinato) prima di scegliere fuori terra o semi-interrata.", "terrain.r.petit": "Una piscina in legno o alluminio fuori terra, senza grandi scavi, valorizzata da una terrazza.", "terrain.r.plat": "Tutto è possibile: legno o alluminio interrati, vasca in poliestere posata in pochi giorni, o cemento tradizionale.", "liner.h": "Il liner dà il colore all'acqua", "liner.p": "Liner di produzione francese, realizzati sulle dimensioni esatte della Sua vasca. Tinta unita, stampati o in PVC armato.", "liner.blanc": "Bianco", "liner.bleu-france": "Blu Francia", "liner.bleu-pale": "Azzurro", "liner.graphite-melange-gris-noir": "Grafite", "liner.gris-clair": "Grigio chiaro", "liner.gris-fonce": "Grigio scuro", "liner.noir-granite": "Nero granito", "liner.sable": "Sabbia", "liner.vert-antille": "Verde Antille", "liner.vert-olive": "Verde oliva", "real.h": "Piscine posate dai Suoi vicini", "real.p": "Saint-Maximin, Aubagne, La Ciotat, Fréjus, Meyreuil, Bouc-Bel-Air… 72 cantieri in foto.", "amen.h": "Intorno alla vasca", "amen.p": "Terrazze in IPE o pino, locale tecnico, cucina d'estate, tettoia per l'auto: i nostri team lavorano il legno fino in fondo al giardino.", "spa.teaser": "Una spa in legno, fatta come le nostre piscine.", "avis.h": "Cosa dicono i nostri clienti", "avis.src": "Recensioni Google pubblicate sul Suo sito attuale", "after.h": "Dopo la posa, restiamo al Suo fianco", "after.p": "Guide alla manutenzione, video tutorial, FAQ e negozio nelle nostre due agenzie.", "agences.h": "Due agenzie, un solo interlocutore", "agence.stmax": "Agenzia di Saint-Maximin", "agence.stmax.addr": "Parc d'activité d'Aix, 340 avenue de la Maximinoise, 83470 Saint-Maximin-la-Sainte-Baume", "agence.stmax.h": "Dal lunedì al sabato, 9.30-12.30 e 13.30-17.30", "agence.aubagne": "Agenzia di Aubagne", "agence.aubagne.addr": "195, chemin de Ceinture, 13400 Aubagne", "agence.aubagne.h": "Dal martedì al venerdì, 13-17; il sabato, 10-12 e 13-18", "agence.boutique": "Angolo negozio in entrambe le agenzie.", "presse.h": "Visti in televisione", "presse.p": "Servizio a 66 Minutes (M6) il 23 aprile 2023, dopo il Salon Piscine, Spa & Jardin, al minuto 10:30 del video.", "piscines.h": "Le nostre piscine", "piscines.p1": "Ha un progetto? Partiamo dal Suo terreno, dal Suo ambiente, dai vincoli di ogni tipo di piscina e dal Suo budget.", "piscines.p2": "Specialisti della piscina in legno, con un sistema brevettato unico sul mercato, posiamo anche alluminio, vetroresina e cemento. Venga a trovarci a Saint-Maximin-la-Sainte-Baume (Var) o ad Aubagne (Bouches-du-Rhône).", "bois.h": "Piscina in legno su misura", "bois.lead": "Fuori terra, semi-interrata o interrata, interna o esterna, rettangolare o a forma libera: il nostro modello brevettato si adatta a tutto.", "bois.p1": "Da oltre vent'anni vendiamo e installiamo piscine in legno su misura nel Var e in Provenza-Alpi-Costa Azzurra.", "bois.p2": "La struttura in legno e acciaio sostiene la vasca in basso come in alto. Risolve il problema delle piscine in legno con puntoni: la spinta della terra e dell'acqua sulle pareti.", "bois.inclus": "La piscina comprende la struttura, il liner, il proiettore, la filtrazione completa, i pezzi da inglobare e il quadro elettrico.", "bois.implant": "L'ubicazione è una scelta chiave: natura del suolo, esposizione, superficie, vicinato. La aiutiamo a trovare la dimensione e il posto giusti.", "bois.bois.h": "Legno di qualità, senza trattamenti da fare", "bois.bois.p": "Lo lasci ingrigire naturalmente (un lavaggio con acqua all'anno) oppure passi un impregnante una o due volte l'anno per mantenerne il colore.", "bois.pin": "Pino scandinavo: proveniente da regioni dal clima rigido, trattato a cuore in autoclave (classe 4), stabile e duraturo a contatto con l'acqua.", "bois.ipe": "Ipé: legno esotico sudamericano, molto denso, naturalmente imputrescibile, resistente a muffe e termiti.", "bois.liner": "Liner di produzione francese, sulle dimensioni esatte della vasca: tinte unite, stampate o PVC armato, per bei contrasti di giorno e di notte.", "bois.hs.h": "Fuori terra", "bois.hs.p": "Poco spazio, cortile, terrazza sul tetto, niente grandi scavi: si installa in fretta e si valorizza con una terrazza.", "bois.se.h": "Semi-interrata", "bois.se.p": "Terreno in pendenza, terrazzamento, o semplice gusto per il suo aspetto: una parte nel terreno, una parte visibile. La parte rialzata mantiene l'acqua pulita più a lungo.", "bois.en.h": "Interrata", "bois.en.p": "Valorizza la proprietà e si fonde con il giardino. La struttura è invisibile; intorno, tutto è possibile: legno, pietra, terrazza, prato naturale o sintetico.", "kit.h": "Piscina in kit", "kit.lead": "Le piace il fai da te? La nostra piscina in legno brevettata esiste in kit completo, prodotto nei nostri laboratori, pronto da posare.", "kit.p1": "Su misura: sceglie dimensione e altezza, quadrata o rettangolare, fuori terra, semi-interrata o interrata. Si installa su una platea in cemento armato.", "kit.p2": "Pochi pezzi, ma molto robusti: montaggio semplice, massima resistenza, linee pulite.", "kit.mat.h": "I materiali", "kit.mat.1": "Pareti in travi di pino in autoclave classe 4, spessore 4,5 cm", "kit.mat.2": "Trave perimetrale lamellare 16 × 14 cm, autoclave classe 4", "kit.mat.3": "Cintura UPN in acciaio da 220 mm, invisibile", "kit.mat.4": "Bordi in pino (legno esotico opzionale), 4 m × 30 cm, in due pezzi", "kit.liner": "5 colori di liner: bianco, azzurro, blu Francia, grigio chiaro, sabbia. Produzione francese, sulle dimensioni esatte.", "kit.compo.h": "Cosa contiene il kit", "kit.compo.1": "Struttura: legno, acciaio, viti inox, feltro, liner, bordi in pino", "kit.compo.2": "Filtrazione e dotazione: piastra di filtrazione, 1 bocchetta di mandata, 1 skimmer, 1 scaletta inox, 1 kit di manutenzione, 1 kit PVC (rotolo da 12 m di tubo flessibile Ø 50, barra da 2 m Ø 50, colla)", "kit.securite": "Sicurezza e trattamento: allarme, teli di sicurezza o barriere; cloro, sale, ossigeno attivo o bromo.", "kit.options": "Opzioni: 2ª bocchetta di mandata, presa di aspirazione, quadro elettrico con proiettore LED bianco o colorato, forniture per panca o spiaggia sotto il liner, consegna (fattibilità da verificare con le nostre agenzie).", "kit.shop": "Ordina su lapiscinekit.com", "alu.h": "Piscina in alluminio su misura", "alu.lead": "Il nostro concetto in legno ha avuto tanto successo che Florent Fondère l'ha declinato in alluminio.", "alu.p1": "I pezzi sono prodotti su misura per noi. Le travi di rivestimento sono in alluminio grezzo o verniciate RAL 8008, oppure impreziosite da una venatura effetto legno.", "alu.p2": "Un materiale che dura decenni: leggero, facile da trasportare, flessibile, meccanicamente più resistente del legno. Angolari in acciaio zincato.", "alu.inclus": "La piscina comprende la struttura, il liner, il proiettore, la filtrazione completa, i pezzi da inglobare e il quadro elettrico.", "coque.h": "Piscina in vetroresina", "coque.lead": "Vasche Cosmos Piscines progettate e prodotte in Francia, garantite 10 anni, conformi alla norma MATIP.", "coque.p1": "Stampata in fabbrica, la vasca viene consegnata nel Suo giardino a scavo ultimato: niente grandi lavori di muratura. Il gelcoat liscio si pulisce facilmente.", "coque.p2": "Pareti quasi verticali per più volume, panca per tutta la larghezza e discesa graduale. Compatibile con tutti i trattamenti, con un ottimo rapporto qualità-prezzo.", "coque.mercure": "Mercure – la più piccola: 4,30 × 2,27 m, profondità 1,39 m, 3 gradini sul lato corto.", "coque.venus": "Vénus – dimensione intermedia: 3 m di larghezza, 5, 6 o 7 m di lunghezza, altezza 1,48 m.", "coque.saturne": "Saturne – vasca grande: 4 m di larghezza, 7, 8 o 9 m di lunghezza, profondità 1,50 m. Ideale per nuotare.", "coque.coloris": "Colori: bianco, sabbia, grigio chiaro, azzurro.", "coque.eq.h": "Dotazioni", "coque.eq": "Skimmer classico o filtrante secondo il modello · presa di aspirazione smontabile · proiettore LED · scarico di sicurezza · bocchette di mandata orientabili · formula kit", "coque.ent.h": "Materiale di manutenzione", "coque.ent": "Scopa aspirante e tubo galleggiante · manico telescopico · retino di superficie · spazzola per pareti · kit di analisi · kit PVC", "coque.fil.h": "Filtrazione", "coque.fil": "1 filtro a sabbia con valvola a 6 vie · 1 pompa di filtrazione · 1 quadro elettrico", "beton.h": "Piscina in cemento tradizionale", "beton.lead": "La piscina in blocchi cassero: solida, impermeabile, duratura e personalizzabile all'infinito.", "beton.formes": "Fuori terra, semi-interrata, interrata o a sfioro. Lunghezza, larghezza, profondità e forma si decidono con Lei, in base al terreno.", "beton.p1": "Spiaggia, scale, scaletta, pompa di calore, nuoto controcorrente; cloro o elettrolizzatore a sale; bordi in legno, travertino o pietra ricostruita, terrazza.", "beton.p2": "Dallo scavo alle finiture, facciamo tutto noi. Nessun altro operatore nei nostri cantieri: un solo interlocutore, un cantiere rapido e pulito.", "beton.opt.h": "Opzioni", "beton.opt": "Tapparella · telo · allarme · pompa di calore · elettrolizzatore a sale + pompa pH · barriere e parapetti · nuoto controcorrente · robot", "beton.eq.h": "In dotazione con ogni piscina", "beton.eq": "Skimmer a specchio (linea d'acqua al massimo livello) · liner di produzione francese, vari colori · bocchetta di mandata · presa di aspirazione · proiettore LED · filtro a sabbia Hayward · pompa Espa Silver · quadro elettrico · kit di manutenzione (termometro, kit di analisi, manico telescopico, spazzola)", "beton.proc.h": "Come la costruiamo", "beton.proc.0": "Se necessario, lavoriamo con uno studio di ingegneria specializzato in cemento.", "beton.proc.1": "La platea: un radier da 20 cm con 2 reti elettrosaldate a maglia di 10 cm, cinturato da un cordolo.", "beton.proc.2": "Il cassero: blocchi cassero da 25 cm, a norma, riempiti con la pompa del cemento e rinforzati con ferri da 8. Circa 20 giorni di asciugatura.", "beton.proc.3": "Le finiture: un intonaco sulle pareti.", "beton.proc.4": "Il liner: alta gamma, produzione francese, su misura, trattato contro il calore e le macchie. Tinta unita, stampato o PVC armato.", "amen.page.h": "Allestimenti per la piscina", "amen.page.p": "Terrazza con parapetto o frangivista, locale tecnico per la filtrazione, tettoia per l'auto, cucina d'estate, chalet: soluzioni pratiche e belle per i Suoi spazi esterni.", "amen.list": "Terrazza in legno · locale tecnico · parapetti e corrimano · chalet e tettoia · frangivista · pergolati · pavimento scorrevole · cucina d'estate", "amen.marg.h": "Bordi", "amen.marg.bois": "In legno: il pino per un tocco contemporaneo e rustico, l'ipé per l'eleganza dell'esotico.", "amen.marg.pierre": "In pietra ricostruita: prodotta con aggregati di pietre naturali.", "amen.marg.trav": "In travertino: roccia naturale sedimentaria calcarea.", "terr.h": "Terrazze e pavimenti in legno", "terr.lead": "La Sua spiaggia al sole, o la sera, una palma illuminata: prolunghiamo la terrazza fino all'acqua.", "terr.p1": "In IPE o in pino autoclave classe 4, i nostri pavimenti sono pensati per le piscine: poca manutenzione, e resistono a sole, intemperie e acqua trattata.", "terr.p2": "Su misura, per tutti i terreni e tutte le piscine (poliestere, lamiera, legno…). Struttura da 15 cm su piastre regolabili ogni metro quadrato; il pavimento può essere sospeso a qualsiasi altezza.", "terr.ipe": "L'IPE: legno esotico sudamericano, il più denso che esista (ben oltre teak, cumaru o massaranduba). Fibra dritta, senza nodi, naturalmente imputrescibile. Nessun trattamento necessario.", "terr.pin": "Il pino autoclave classe 4: resistente alla siccità e al grande freddo, solido quanto l'IPE, un po' più nodoso e più chiaro. Perfetto in un giardino alberato.", "terr.ent": "Manutenzione: lasciare ingrigire (un lavaggio con acqua all'anno) oppure un impregnante una o due volte l'anno.", "terr.vivant": "Il legno è un materiale vivo: nodi, crepe naturali e ingrigimento dovuto ai raggi UV non ne alterano le qualità.", "spa.h": "La spa in legno LPB", "spa.lead": "Relax e benessere, nello stesso legno delle nostre piscine.", "spa.p1": "Realizziamo la Sua spa in legno trattato in autoclave classe IV: panca conviviale, più bocchette, skimmer, proiettore per godersela la sera.", "spa.p2": "All'interno, una membrana armata (PVC armato 3D) a scelta: Marmo bianco, Pietra di Java o Effetto Bali. Bordi in IPE.", "ent.h": "Manutenzione della piscina", "ent.lead": "Una routine semplice basta per mantenere l'acqua limpida e sana.", "ent.day.h": "Ogni giorno", "ent.day": ["Tolga foglie e insetti con il retino", "Svuoti il cestello dello skimmer", "Analizzi l'acqua e corregga se serve: pH, alcalinità (TAC), durezza (TH), cloro"], "ent.week.h": "Ogni settimana", "ent.week": ["Livello dell'acqua ai 2/3 dello skimmer (troppo basso: entra aria e la pompa si rovina; troppo alto: le impurità vengono aspirate male)", "Controlli il flusso delle bocchette: un flusso debole può indicare un filtro o una pompa intasati", "Retino, fondo con scopa aspirante o robot, linea d'acqua con spugna magica o gel", "Svuoti il cestello dello skimmer e analizzi l'acqua", "Controlavaggio del filtro, poi risciacquo (1-2 min) e riavvio della filtrazione"], "ent.astuce": "Consiglio: durante il controlavaggio, metta un dito dietro la spia di lavaggio (il tubicino sotto la valvola a 6 vie). Appena rivede il dito e l'acqua è limpida, si fermi.", "trait.h": "Trattamento della piscina", "trait.lead": "Disinfettare, equilibrare: le famiglie di prodotti che mantengono l'acqua pulita.", "trait.chlore": "Il cloro: semplice ed economico, ma può irritare le pelli sensibili e il suo odore dà fastidio. In pastiglie o pasticche: lunga durata, shock (in caso di alghe) o multifunzione (disinfezione, flocculazione, stabilizzante).", "trait.sel": "Il sale: l'elettrolizzatore produce cloro naturale non stabilizzato, senza odore né irritazioni. Si degrada in fretta con i raggi UV: è un trattamento di fondo, da integrare con un cloro shock se serve.", "trait.oxy": "L'ossigeno attivo: disinfettante, ossidante e antialghe, inodore e delicato. Più caro, sensibile a temperatura e pH, agisce per poco tempo. Spesso liquido.", "trait.brome": "Il bromo: in pastiglie, a lunga durata o shock. Inodore, non irritante, triplice azione. Più costoso; per una diffusione continua serve un brominatore.", "trait.equil": "I prodotti equilibranti completano la disinfezione: correttori di pH, alcalinità e durezza, da dosare dopo l'analisi dell'acqua.", "guides.h": "Guide all'uso", "guides.lead": "I gesti che mantengono l'acqua sana e le attrezzature in forma, passo dopo passo.", "g.chlore.h": "Manutenzione di una piscina al cloro", "g.chlore.i": "Il cloro elimina batteri, funghi e alghe. In polvere o granuli da sciogliere, o in pastiglie nello skimmer per un'azione lenta.", "g.chlore.s": ["Occorrente: strisce reattive, tester elettronico o regolatore automatico di cloro", "Ogni settimana, livello dell'acqua tra la metà e i 3/4 dello skimmer", "Retino, linea d'acqua, fondo (scopa o robot), cestello dello skimmer", "Cestello della pompa da svuotare se serve; manometro alto = filtro saturo: controlavaggio e poi risciacquo", "pH ideale 7,2-7,4: sopra 7,6, pH Meno; sotto 7, pH Più", "Cloro tra 1 e 3 mg/l: troppo alto, neutralizzi o lasci evaporare; troppo basso, aggiunga cloro", "Regoli il pH prima di misurare il cloro: un pH alto rende il cloro inefficace", "TAC sopra 10 °f; troppo basso, correttore a base di bicarbonato di sodio"], "g.sel.h": "Manutenzione di una piscina al sale", "g.sel.i": "L'elettrolizzatore trasforma il sale in cloro attivo naturale: disinfezione continua, senza odore. Da rispettare: analisi, pH e tasso di sale.", "g.sel.s": ["Occorrente: strisce reattive, sale per piscina, elettrolizzatore, pompa dosatrice pH", "Livello dell'acqua, retino, linea d'acqua, fondo e skimmer ogni settimana", "Elettrodi: autopulenti, e pulizia manuale ogni 6 mesi se l'acqua è dura; elettrolizzatore spento in inverno", "Pompa dosatrice pH: sonda da tarare a ogni inizio stagione", "Tasso di sale tra 3 e 7 g/l secondo il volume e l'apparecchio", "pH tra 7,2 e 7,4; TAC sopra 10 °f"], "g.filtre.h": "Manutenzione del filtro a sabbia", "g.filtre.i": "Il filtro trattiene le impurità. In piena stagione, lo pulisca ogni 1-2 settimane. Non tocchi mai la valvola a 6 vie con la pompa in funzione.", "g.filtre.s": ["Prefiltro: pompa ferma, valvole dello skimmer e della presa di aspirazione chiuse, coperchio svitato, cestello svuotato e risciacquato, poi rimetta tutto a posto", "Controlavaggio: valvola su «lavaggio», pompa in funzione fino ad acqua limpida, poi stop", "Risciacquo: valvola su «risciacquo», 1-2 minuti, poi stop", "Valvola su «filtrazione», riavvio", "Disincrostazione una volta l'anno (due se l'acqua è molto calcarea)"], "g.ph.h": "Taratura di una sonda pH", "g.ph.i": "A ogni inizio stagione e dopo ogni cambio di sonda. Servono le soluzioni tampone pH 7 e pH 10, in vendita nelle nostre agenzie di Saint-Maximin e Aubagne.", "g.ph.s": ["Sviti la sonda, chiuda il foro con il tappo in dotazione", "Apparecchio con tasto CAL: 3 s su CAL, sonda nel pH 7, CAL; il LED 7.0 si blocca a operazione conclusa. LED LOW acceso: sonda usurata", "Apparecchio con menu: 3 s su V, codice CA, sonda nel pH 7, 2 min, V; attenda «Oh»", "Risciacqui senza asciugare, sonda nel pH 10, 2 min, V; attenda «Oh»", "«Er» visualizzato: la sonda è a fine vita, da sostituire", "Tolga il tappo e rimetta la sonda al suo posto"], "g.hivchlore.h": "Svernamento di una piscina al cloro", "g.hivchlore.i": "Consigliamo lo svernamento attivo: filtrazione da 1 a 3 ore al giorno tra le 4 e le 6 del mattino, quando gela. L'acqua circola, le attrezzature non gelano.", "g.hivchlore.s": ["Pulisca vasca, linea d'acqua e filtro (controlavaggio, risciacquo, disincrostazione)", "Attenda che l'acqua resti stabilmente sotto i 15 °C", "pH tra 7,2 e 7,4; trattamento shock se serve e 24 ore di filtrazione", "Prodotto di svernamento, 4 ore di filtrazione", "Tempo di filtrazione = temperatura dell'acqua ÷ 3", "Copertura facoltativa; controlli l'acqua di tanto in tanto", "Inverno molto rigido: spenga e svuoti filtro e pompa", "Rimessa in funzione verso marzo-aprile, quando l'acqua torna sopra i 12 °C"], "g.hivsel.h": "Svernamento di una piscina al sale", "g.hivsel.i": "Stesso principio attivo, con qualche accorgimento per proteggere l'elettrolizzatore e la sonda pH.", "g.hivsel.s": ["Pulisca vasca, linea d'acqua e filtro (controlavaggio, risciacquo, disincrostazione)", "Solo sotto i 15 °C, fermi l'elettrolisi (altrimenti le piastre si consumano) lasciando la filtrazione", "Prodotto di svernamento 2-3 ore; pH tra 7,2 e 7,4", "Sonda pH al riparo dal gelo in acqua di rubinetto, tappo sulla tubazione", "Risciacqui il tubo della pompa peristaltica; tanica d'acqua al posto del correttore, funzione «MA»", "Filtrazione di notte tra le 4 e le 6; telo o tapparella; pH controllato una volta al mese", "Grande freddo annunciato: spegnere tutto, svuotare pompa e filtro, bottiglia Guizmo nello skimmer", "Rimessa in funzione quando l'acqua torna sopra i 15 °C"], "acc.h": "Accessori per piscina", "acc.lead": "Trattamento (cloro, sale, bromo), teli, tapparelle: sceglie le Sue opzioni con i nostri consulenti, e trova tutto nelle nostre agenzie.", "acc.mx9": "Robot idraulico Zodiac MX9: collegato alla presa di aspirazione, usa la pompa per avanzare. Spazzolatura ciclonica, turbo-aspirazione, navigazione X-Drive, cingoli dentati.", "acc.dolphin": "Robot elettrico Dolphin S300: per le vasche grandi. Ciclo completo in 2 ore o rapido in 1 ora; fondo, pareti e linea d'acqua; spazzola attiva e filtrazione multistrato.", "acc.pac": "Pompa di calore reversibile: il modo più efficace ed economico per riscaldare, o raffreddare. Scambiatore in titanio garantito 5 anni, compatibile con il sale. Posa a cura nostra, preventivo gratuito.", "acc.electro": "Elettrolizzatore a sale: trasforma il sale in cloro naturale, senza odore, più delicato. Da completare con una regolazione del pH.", "acc.ph": "Pompa dosatrice pH: sonda in continuo, pH mantenuto tra 7,2 e 7,4. Sonda da tarare a ogni inizio stagione.", "acc.nage": "Nuoto controcorrente: nuotare sul posto, anche in una vasca piccola, e godersi i massaggi. Compatibile con le nostre piscine in legno e in cemento.", "acc.bache": "Telo invernale francese: PVC 550 g rinforzato, anti-UV e antibatterico, doppi occhielli, scarico dell'acqua piovana. 5 colori.", "acc.bulle": "Telo a bolle su misura: 400 micron, anti-UV, bordato sui 4 lati. Qualche grado guadagnato, meno detriti.", "acc.fontaine": "Fontana inox.", "sec.h": "Sicurezza della piscina", "sec.lead": "Dal 1° gennaio 2004 ogni nuova piscina privata deve avere un dispositivo di sicurezza; le piscine esistenti dal 1° gennaio 2006 (legge del 3 gennaio 2003).", "sec.barriere": "Barriera di protezione, NF P90-306: oltre 110 cm, cancelletto con doppia chiusura. La nostra: rete trasparente anti-UV da 1,22 m, sezioni da 1 a 6 m, 5 colori.", "sec.alarme": "Allarme, NF P90-307-1: immerso (rileva una caduta, sirena integrata) o perimetrale (4 colonnine a infrarossi).", "sec.bache": "Copertura, NF P90-308: il telo a barre, anti-UV e fungicida, mette in sicurezza tutto l'anno e trattiene il calore.", "sec.volet": "Tapparella fuori terra o immersa: sicurezza, meno evaporazione, meno perdite di calore e di prodotti. Posa a cura nostra.", "sec.abri": "Riparo, NF P90-309: piatto, scorrevole o rimovibile, copre l'intera vasca.", "realp.h": "Le nostre realizzazioni", "realp.lead": "Legno, alluminio, vetroresina, cemento, allestimenti: 72 cantieri nel Var, nelle Bouches-du-Rhône e in tutta la regione.", "realp.f.bois": "Piscina in legno", "realp.f.alu": "Piscina in alluminio", "realp.f.coque": "Piscina in vetroresina", "realp.f.beton": "Piscina in cemento", "realp.f.amen": "Allestimenti", "about.h": "Chi siamo", "about.lead": "Florent Fondère lavora nel mondo delle piscine da quando aveva 18 anni. Ha scelto il legno per la sua naturalezza e la sua eleganza.", "about.p1": "Nel 2016 deposita un brevetto: conservare la bellezza del legno senza rinunciare nulla alla tecnica. Così nascono le nostre piscine su misura, e il kit prodotto nel nostro stabilimento per gli appassionati di fai da te.", "about.p2": "Struttura in pino autoclave classe IV, impregnato in tutto l'alburno: più duraturo di un legno trattato a spruzzo o per immersione. Rivestimenti in ipé o padouk. Poi una versione in alluminio, grezzo, RAL 8008 o venato effetto legno.", "about.p3": "Il successo ci ha permesso di aprire una seconda agenzia ad Aubagne, per le Bouches-du-Rhône. Ciascuna ha il suo angolo negozio.", "about.p4": "Quattro concetti: vetroresina, legno su misura, alluminio su misura, cemento tradizionale. Il nostro team fa tutto: scavo, platea, struttura, liner, filtrazione, e Le spiega il funzionamento al riempimento.", "about.equip": "Pompe di calore, elettrolizzatori, pompe pH, allarmi, barriere, coperture, tapparelle, robot, prodotti di manutenzione per la piscina e la terrazza.", "about.social": "Segua i nostri cantieri su Facebook e Instagram.", "tutos.h": "Video tutorial", "tutos.lead": "Montaggio del kit, telo, timer, pompa di calore, elettrolizzatore, sonda pH, robot: i nostri video passo dopo passo.", "tutos.alu": "Kit alluminio premium", "tutos.kit": "Kit legno", "tutos.util": "Utilizzo", "tuto.alu1": "N. 1 – Posizionamento degli angolari", "tuto.alu2": "N. 2 – Montaggio degli UPN", "tuto.alu3": "N. 3 – Fissaggio del tubo in alluminio", "tuto.alu4": "N. 4 – Incastro delle travi", "tuto.alu5": "N. 5 – Posizionamento dello skimmer", "tuto.alu6": "N. 6 – Installazione della guida", "tuto.alu7": "N. 7 – Installazione dei travetti in alluminio", "tuto.alu8": "N. 8 – Montaggio della panca sotto il liner", "tuto.alu9": "N. 9 – Montaggio della panca con gradini", "tuto.kit1": "N. 1 – Installazione dello skimmer", "tuto.kit2": "N. 2 – Bocchetta di mandata e presa di aspirazione", "tuto.kit3": "N. 3 – Opzione proiettore", "tuto.kit4": "N. 4 – Preparare l'installazione del liner", "tuto.kit5": "N. 5 – Posa del liner", "tuto.kit6": "N. 6 – Panca o spiaggia sotto il liner", "tuto.u1": "Srotolare un telo a barre", "tuto.u2": "Arrotolare un telo a barre", "tuto.u3": "Funzionamento del timer", "tuto.u4": "Accendere e spegnere una pompa di calore", "tuto.u5": "Avviamento dell'elettrolizzatore a sale", "tuto.u6": "Taratura della sonda pH", "tuto.u7": "Controlavaggio del filtro", "tuto.u8": "Usare il robot idraulico MX9", "faq.h": "Domande frequenti", "faq.legal": "Pratiche", "faq.hiver": "Svernamento", "faq.eau": "Problemi dell'acqua", "faq.mat": "Accessori e attrezzature", "faq.items": [["legal", "Serve un permesso di costruire?", "Solo per una piscina di oltre 100 m²."], ["legal", "La mia piscina è tassabile?", "Conta come pertinenza: imposta sull'abitazione. L'imposta fondiaria si applica alle piscine interrate (cemento, legno, vetroresina); solo le fuori terra smontabili ne sono esenti."], ["legal", "Bisogna avvisare il Comune?", "Fino a 10 m², nessuna dichiarazione. Oltre, una dichiarazione all'ufficio urbanistica."], ["legal", "Preparate voi i progetti per il permesso?", "No. Il Suo Comune può fornirLe un elenco di architetti (prestazione a pagamento)."], ["hiver", "Perché svernare?", "Per evitare i danni del gelo a pareti e filtrazione."], ["hiver", "Quando svernare?", "Quando l'acqua resta sotto i 12 °C (15 °C per una piscina al sale)."], ["hiver", "Svernamento attivo o passivo?", "Attivo nelle regioni dagli inverni miti: filtrazione ridotta, trattamento mantenuto. Passivo nelle regioni fredde: tutto è fermo."], ["eau", "Acqua verde e trasparente", "Spesso un TAC troppo basso e alghe: regoli il pH, aggiunga TAC+, clori e usi un alghicida."], ["eau", "Acqua verde e torbida", "Alghe (acqua calda, cloro insufficiente, pH squilibrato, TH alto, TAC basso): testare, clorazione shock, alghicida, flocculante."], ["eau", "Acqua verde spinacio", "Le alghe proliferano: clorazione shock, alghicida, flocculante."], ["eau", "Acqua verde o gialla", "Acqua troppo acida, pH troppo basso: aggiunga pH+."], ["eau", "Acqua blu-verde", "Rame decomposto (prodotti ramati o idrato di ferro, da evitare): aggiunga acqua nuova e riequilibri."], ["eau", "Acqua gialla o marrone scuro", "Vegetali in decomposizione (clorazione shock, flocculante) o metalli come ferro e manganese (sequestrante di metalli)."], ["eau", "Acqua torbida, pareti ruvide", "Troppo calcare: trattamento anticalcare."], ["eau", "Acqua lattiginosa", "Calcare, variazione di pH, alghe morte… Testare, trattamento shock, flocculante se serve."], ["eau", "Acqua biancastra", "Sali calcarei in decomposizione: flocculante."], ["eau", "Deposito biancastro sul fondo", "Del tartaro: verifichi e corregga la durezza dell'acqua."], ["eau", "Fondo e pareti scivolosi", "Inizio di alghe: equilibrio dell'acqua, abbassare il pH se serve, clorazione, alghicida."], ["eau", "Residui grassi in superficie", "Creme e oli solari: panni assorbenti da mettere nello skimmer."], ["eau", "Bordo nero sul liner", "Sporco accumulato sulla linea d'acqua: detergente per linea d'acqua (spugna magica, gel)."], ["eau", "Macchie rosso-brune sul liner", "Particelle minerali o metalliche, calcare: testi il pH, sequestrante di metalli."], ["eau", "Macchie bianche sul liner", "Troppi prodotti clorati: il liner è danneggiato, è irreversibile."], ["mat", "Il mio robot si scolorisce", "Rimasto troppo a lungo in acqua o al sole: prodotti e raggi UV alterano il materiale."], ["mat", "Il mio robot MX9 non avanza più", "Verifichi l'aspirazione della presa di aspirazione (filtro da lavare), lo stato dei tubi e dei cingoli, parti soggette a usura."], ["mat", "Il manometro del filtro è nel rosso", "La sabbia è compattata: controlavaggi e risciacqui non abbastanza frequenti."], ["mat", "Sabbia nella piscina", "Vento, strainer usurati, troppa o troppo poca sabbia, calcare o alghe incollati, pompa troppo potente. Il flocculante aiuta a trattenere la sabbia."], ["mat", "Piccole scariche nell'acqua", "Elettrolizzatore e regolatore pH producono una debole corrente: installi un dispositivo di messa a terra dell'acqua."], ["mat", "La mia scaletta si arrugginisce", "Inox di cattiva qualità, o elettrolizzatore a sale senza scarico delle correnti a terra."], ["mat", "Il mio proiettore prende acqua", "Spesso ci si appoggia e si sposta; raramente, un difetto d'origine. Lo faccia controllare."], ["mat", "Flusso delle bocchette debole", "Lavi e risciacqui il filtro; una piscina molto grande può avere poche bocchette."], ["mat", "Il mio liner fa le pieghe", "Cloro troppo alto, pH troppo acido o acqua troppo calda: il liner diventa poroso e si allenta."]], "contact.h": "Parliamo della Sua piscina", "contact.lead": "Qualche risposta, e la Sua richiesta arriva direttamente all'agenzia giusta. Un consulente La richiama.", "f.type": "Quale piscina?", "f.type.ns": "Non lo so ancora", "f.pose": "Quale posa?", "f.pose.hs": "Fuori terra", "f.pose.se": "Semi-interrata", "f.pose.en": "Interrata", "f.terrain": "Il Suo terreno", "f.dim": "Dimensioni desiderate (facoltativo)", "f.dim.ph": "ad esempio 8 × 4 m", "f.nom": "Nome", "f.email": "E-mail", "f.tel": "Telefono", "f.dep": "Dipartimento", "f.ville": "Città", "f.connu": "Come ci ha conosciuti?", "f.connu.o": ["Passaparola", "Fiera o salone", "Social network", "Inserzione pubblicitaria", "Pagine Gialle", "Cartellone pubblicitario", "Altro"], "f.msg": "Il Suo messaggio", "f.send": "Invia la mia richiesta", "f.route83": "La Sua richiesta andrà all'agenzia di Saint-Maximin.", "f.route13": "La Sua richiesta andrà all'agenzia di Aubagne.", "f.ok": "Grazie! Nella versione online, la Sua richiesta partirà verso {agence}. Qui è un prototipo: non viene inviato nulla.", "f.err": "Mancano il Suo nome e un'e-mail o un telefono per richiamarLa.", "f.projet": "Aggiunto da «Il mio progetto»:", "mine.h": "Il mio progetto", "mine.empty": "Ancora niente. Aggiunga una piscina, un'opzione o un allestimento dalle pagine.", "mine.add": "Aggiungi al mio progetto", "mine.added": "Aggiunto", "mine.go": "Richiedi un preventivo con questo progetto", "mentions.h": "Note legali", "mentions.p": "LA PISCINE BOIS / LPB PISCINES, produttore e installatore di piscine in legno. LPB La Piscine Bois, RCS Draguignan 752 316 687. Sede: Parc d'activité d'Aix, 340 avenue de la Maximinoise, 83470 Saint-Maximin-la-Sainte-Baume. Gerente: Florent Fondère. I contenuti del sito sono di proprietà di LA PISCINE BOIS; ogni riproduzione senza consenso è vietata (art. L122-4 del Code de la propriété intellectuelle francese). Il testo completo delle note legali e dell'informativa sulla privacy del Suo sito attuale sarà ripreso all'installazione.", "conf.h": "Informativa sulla privacy", "conf.p": "I dati inseriti nel modulo servono unicamente a rispondere alla Sua richiesta e non vengono mai rivenduti. Il testo completo della Sua informativa attuale sarà ripreso all'installazione.", "foot.tag": "Produttore e installatore di piscine in legno, alluminio, vetroresina e cemento, da oltre 20 anni.", "foot.maquette": "Proposta di restyling realizzata da Neovera Studio – prototipo non contrattuale.", "bot.name": "LPB Conseil", "bot.sub": "La aiuto a scegliere", "bot.virtual": "Assistente virtuale", "bot.hello": "Buongiorno! Sono l'assistente virtuale di LPB Piscines. Terreno, tipo di piscina, manutenzione, agenzie: mi faccia la Sua domanda.", "bot.invite": "Una domanda sul Suo terreno o sulla Sua futura piscina?", "bot.ph": "Scriva la Sua domanda…", "bot.send": "Invia", "bot.chips": ["Il mio terreno è in pendenza", "Legno, alluminio, vetroresina o cemento?", "Il kit, per chi è?", "Acqua verde", "Orari delle agenzie", "Richiedi un preventivo"], "bot.unknown": "Non sono sicuro di rispondere bene a questo. Il più semplice: chiami Saint-Maximin allo 04 89 67 80 90 o Aubagne allo 04 42 36 71 36, oppure lasci la Sua richiesta nel modulo.", "bot.a.pente": "Su un terreno in pendenza o a terrazzamenti, posiamo spesso una piscina in legno semi-interrata: meno scavi, una struttura in legno e acciaio brevettata che regge la spinta della terra.", "bot.a.choix": "Legno: il nostro sistema brevettato, su misura, su tutti i terreni. Alluminio: stesso concetto, molto duraturo. Vetroresina: posata in fretta, garantita 10 anni. Cemento: la tradizione, fino allo sfioro. Il kit: da posare da soli.", "bot.a.kit": "Il kit è la nostra piscina in legno brevettata, prodotta nei nostri laboratori, per chi ama il fai da te: pochi pezzi, video tutorial, da posare su una platea in cemento. Ordini su lapiscinekit.com.", "bot.a.vert": "Acqua verde: spesso alghe. Testi l'acqua, faccia una clorazione shock, poi alghicida e flocculante. Se è verde e trasparente, controlli prima il TAC.", "bot.a.horaires": "Saint-Maximin: dal lunedì al sabato, 9.30-12.30 e 13.30-17.30. Aubagne: dal martedì al venerdì 13-17, il sabato 10-12 e 13-18.", "bot.a.devis": "Il modulo per il preventivo Le pone qualche domanda (piscina, posa, terreno) e invia la Sua richiesta all'agenzia giusta.", "bot.a.prix": "Non pubblichiamo prezzi: ogni piscina è fatta su misura. Un preventivo gratuito si richiede in due minuti.", "bot.a.coque": "Tre vasche Cosmos: Mercure (4,30 × 2,27 m), Vénus (3 m di larghezza, da 5 a 7 m) e Saturne (4 m di larghezza, da 7 a 9 m). Colori bianco, sabbia, grigio chiaro, azzurro.", "bot.a.hiver": "Sverni quando l'acqua resta sotto i 12 °C (15 °C con il sale). Consigliamo lo svernamento attivo: filtrazione di notte tra le 4 e le 6.", "bot.a.securite": "La legge impone un dispositivo a norma: barriera, allarme, copertura o riparo. Posiamo barriere, allarmi, teli a barre e tapparelle.", "bot.a.spa": "La nostra spa è in legno autoclave classe IV, con panca, bocchette, proiettore, membrana armata Marmo bianco, Pietra di Java o Effetto Bali, e bordi in IPE.", "bot.a.zone": "Operiamo in tutta la regione PACA, con due agenzie: Saint-Maximin (Var) e Aubagne (Bouches-du-Rhône).", "bot.a.terrasse": "Terrazze in IPE o in pino autoclave classe 4, su misura, su piastre regolabili: si adattano a tutte le piscine.", "bot.a.mairie": "Fino a 10 m²: nessuna pratica. Oltre: dichiarazione in Comune. Permesso di costruire oltre i 100 m².", "bot.a.pac": "La pompa di calore reversibile riscalda o raffredda l'acqua; scambiatore in titanio garantito 5 anni, compatibile con il sale. La posiamo noi.", "bot.a.liner": "Liner francesi su misura: bianco, blu Francia, azzurro, grafite, grigio chiaro, grigio scuro, nero granito, sabbia, verde Antille, verde oliva, e PVC armato.", "trust.avis": "16 recensioni Google pubblicate", "bot.a.garantie": "Le scocche Cosmos sono garantite 10 anni (norma MATIP). Lo scambiatore in titanio delle nostre pompe di calore è garantito 5 anni contro la corrosione. Per il resto, le nostre agenzie le illustrano le garanzie nel preventivo.", "bot.a.duree": "Il nostro pino è impregnato in autoclave fino al cuore (classe 4), molto più durevole di un legno trattato in superficie; l'alluminio dura decenni. La durata precisa dipende dalla manutenzione: le nostre agenzie gliela indicheranno.", "bot.a.livraison": "Installiamo in tutta la regione PACA. Per un kit consegnato più lontano, la fattibilità si valuta con le nostre agenzie: la cosa più semplice è lasciare la sua richiesta."}, "nl": {"meta.title": "LPB Piscines — houten, aluminium, polyester en betonnen zwembaden in de Var en de Bouches-du-Rhône", "ui.skip": "Naar de inhoud", "ui.lang": "Taal", "ui.devis": "Offerte aanvragen", "ui.esquisse": "Mijn project schetsen", "ui.call": "Bellen", "ui.back": "Terug", "ui.more": "Bekijk de pagina", "ui.all": "Alles", "ui.close": "Sluiten", "ui.watch": "Bekijk de video", "ui.video_soon": "Video zichtbaar op uw huidige website, wordt bij de installatie overgenomen.", "ui.dl": "PDF-versie beschikbaar in de showroom", "ui.see_all_real": "Bekijk alle 72 realisaties", "ui.next": "Volgende", "ui.mine": "Mijn project", "nav.piscines": "Zwembaden", "nav.bois": "Houten zwembad", "nav.kit": "Zwembad als bouwpakket", "nav.alu": "Aluminium zwembad", "nav.coque": "Polyester zwembad", "nav.beton": "Betonnen zwembad", "nav.amenagement": "Inrichting", "nav.amenagement_ext": "Buitenaanleg", "nav.terrasse": "Terrassen en houten vlonders", "nav.spa": "Spa", "nav.entretien": "Onderhoud", "nav.traitement": "Waterbehandeling", "nav.guides": "Gidsen", "nav.accessoires": "Accessoires", "nav.securite": "Veiligheid", "nav.realisations": "Realisaties", "nav.apropos": "Het bedrijf", "nav.contact": "Contact", "nav.tutos": "Videohandleidingen", "nav.faq": "Veelgestelde vragen", "nav.presse": "Pers", "nav.kitshop": "Bouwpakket bestellen", "nav.mentions": "Wettelijke vermeldingen", "nav.confidentialite": "Privacy", "nav.conseil": "LPB Conseil", "top.agences": "Saint-Maximin 04 89 67 80 90 · Aubagne 04 42 36 71 36", "home.h1": "Het houten zwembad dat op elk terrein past.", "home.lead": "Helling, terrassen, rots, klei: onze structuur van hout en staal, gepatenteerd in 2016, wordt geplaatst waar anderen afhaken. Door onze eigen teams gebouwd en geplaatst, in de Var en de Bouches-du-Rhône, al meer dan 20 jaar.", "home.facts": "6 departementen bediend · 2 vestigingen · 1 284 zwembaden en terrassen gerealiseerd", "home.stamp": "Patent 2016 · hout + staal", "home.belt": "Stalen gordel UPN 220 mm, onzichtbaar na plaatsing", "brevet.h": "Waarom onze houten zwembaden niet bewegen", "brevet.p1": "Bij de meeste houten zwembaden houden schoren de wanden op hun plaats. Onder de druk van water en aarde gaan ze na verloop van tijd werken.", "brevet.p2": "Florent Fondère ontwierp iets anders: een structuur van dennenhouten balken, onderaan gedragen door een ligger en bovenaan omsloten door een stalen gordel. Het bassin is over de hele hoogte stevig.", "brevet.l1": "Balken van Scandinavisch grenen, geïmpregneerd in autoclaaf klasse 4, 4,5 cm dik", "brevet.l2": "Verlijmde omlopende ligger van 16 × 14 cm onderaan", "brevet.l3": "Stalen UPN-gordel van 220 mm, onzichtbaar", "brevet.l4": "Boordstenen van grenen, 30 cm breed, of van tropisch hout", "brevet.no": "Schoren: de oplossing die wij hebben laten varen", "brevet.cta": "Ontdek het houten zwembad", "mat.h": "Vijf manieren om uw zwembad te bouwen", "mat.bois": "Ons gepatenteerde systeem, op maat, opbouw, half verzonken of verzonken.", "mat.kit": "Hetzelfde concept, bij ons gefabriceerd, om zelf te monteren.", "mat.alu": "Het concept in aluminium: blank of RAL 8008, licht en duurzaam.", "mat.coque": "Polyester schalen van Cosmos, in Frankrijk gemaakt, 10 jaar garantie.", "mat.beton": "De traditionele bouw met bekistingsblokken, tot en met overloopbad.", "terrain.h": "Helling, terrassen, rots: wij weten hoe", "terrain.p": "Kies uw situatie. Wij vertellen u wat wij in dat geval meestal plaatsen.", "terrain.pente": "Op een helling", "terrain.restanque": "Op terrassen (stapelmuren)", "terrain.roche": "Rotsachtig of kleiig", "terrain.petit": "Weinig ruimte, binnenplaats, dakterras", "terrain.plat": "Vlak en open terrein", "terrain.r.pente": "Een half verzonken houten zwembad: deels in de grond, deels zichtbaar, en minder grondwerk. Bijkomend voordeel: het water blijft langer schoon dankzij het verhoogde deel.", "terrain.r.restanque": "Ons systeem past zich aan op terrassen (stapelmuren) en moeilijke toegangen: de structuur wordt in delen geleverd en ter plaatse gemonteerd.", "terrain.r.roche": "Hout en staal vangen de krachten van het terrein op. Wij bestuderen de plaatsing (bodem, ligging, buren) voordat we kiezen voor opbouw of half verzonken.", "terrain.r.petit": "Een houten of aluminium opbouwzwembad, zonder zwaar grondwerk, mooi aangekleed met een terras.", "terrain.r.plat": "Alles is mogelijk: verzonken hout of aluminium, een polyester schaal in enkele dagen geplaatst, of traditioneel beton.", "liner.h": "De liner geeft het water zijn kleur", "liner.p": "Liners van Franse makelij, op de exacte maat van uw bassin. Effen, bedrukt of uit gewapend PVC.", "liner.blanc": "Wit", "liner.bleu-france": "Franse blauw", "liner.bleu-pale": "Lichtblauw", "liner.graphite-melange-gris-noir": "Grafiet", "liner.gris-clair": "Lichtgrijs", "liner.gris-fonce": "Donkergrijs", "liner.noir-granite": "Gespikkeld zwart", "liner.sable": "Zand", "liner.vert-antille": "Antillengroen", "liner.vert-olive": "Olijfgroen", "real.h": "Zwembaden bij uw buren", "real.p": "Saint-Maximin, Aubagne, La Ciotat, Fréjus, Meyreuil, Bouc-Bel-Air… 72 projecten in beeld.", "amen.h": "Rond het bassin", "amen.p": "Terrassen van IPE of grenen, technische ruimte, zomerkeuken, carport: onze teams werken het hout door tot in de uithoeken van uw tuin.", "spa.teaser": "Een houten spa, gemaakt zoals onze zwembaden.", "avis.h": "Wat onze klanten zeggen", "avis.src": "Google-beoordelingen, gepubliceerd op uw huidige website", "after.h": "Na de plaatsing blijven wij er voor u", "after.p": "Onderhoudsgidsen, videohandleidingen, veelgestelde vragen en een winkelhoek in onze twee vestigingen.", "agences.h": "Twee vestigingen, één aanspreekpunt", "agence.stmax": "Vestiging Saint-Maximin", "agence.stmax.addr": "Parc d'activité d'Aix, 340 avenue de la Maximinoise, 83470 Saint-Maximin-la-Sainte-Baume", "agence.stmax.h": "Maandag t/m zaterdag, 9.30-12.30 en 13.30-17.30 uur", "agence.aubagne": "Vestiging Aubagne", "agence.aubagne.addr": "195, chemin de Ceinture, 13400 Aubagne", "agence.aubagne.h": "Dinsdag t/m vrijdag, 13.00-17.00 uur; zaterdag, 10.00-12.00 en 13.00-18.00 uur", "agence.boutique": "Winkelhoek in beide vestigingen.", "presse.h": "Gezien op televisie", "presse.p": "Te zien in 66 Minutes (M6) op 23 april 2023, na de beurs Salon Piscine, Spa & Jardin, op 10 min 30 van de video.", "piscines.h": "Onze zwembaden", "piscines.p1": "Heeft u een project? Wij gaan uit van uw terrein, uw omgeving, de eisen van elk type zwembad en uw budget.", "piscines.p2": "Wij zijn specialist in houten zwembaden, met een uniek gepatenteerd systeem, en plaatsen ook aluminium, polyester en beton. Kom langs in Saint-Maximin-la-Sainte-Baume (Var) of in Aubagne (Bouches-du-Rhône).", "bois.h": "Houten zwembad op maat", "bois.lead": "Opbouw, half verzonken of verzonken, binnen of buiten, rechthoekig of vrije vorm: ons gepatenteerde model past overal.", "bois.p1": "Al ruim twintig jaar verkopen en plaatsen wij houten zwembaden op maat in de Var en in Provence-Alpes-Côte d'Azur.", "bois.p2": "De structuur van hout en staal houdt het bassin onderaan en bovenaan op zijn plaats. Zo lossen we het probleem van houten zwembaden met schoren op: de druk van aarde en water op de wanden.", "bois.inclus": "Het zwembad omvat de structuur, de liner, de onderwaterlamp, de complete filtratie, de inbouwonderdelen en de elektrische kast.", "bois.implant": "De plaatsing is een sleutelkeuze: bodem, ligging, oppervlak, buren. Wij helpen u de juiste maat en de juiste plek te vinden.", "bois.bois.h": "Hout van kwaliteit, zonder behandeling", "bois.bois.p": "Laat het vanzelf vergrijzen (één keer per jaar schoonspoelen met water) of breng één à twee keer per jaar een saturator aan om de kleur te behouden.", "bois.pin": "Scandinavisch grenen: afkomstig uit streken met een stevig klimaat, tot in de kern geïmpregneerd in autoclaaf (klasse 4), stabiel en duurzaam in contact met water.", "bois.ipe": "Ipé: tropisch hout uit Zuid-Amerika, zeer dicht, van nature rotvrij, bestand tegen schimmels en termieten.", "bois.liner": "Liners van Franse makelij, op de exacte maat van het bassin: effen, bedrukt of gewapend PVC, voor mooie contrasten bij dag en bij nacht.", "bois.hs.h": "Opbouw", "bois.hs.p": "Weinig ruimte, binnenplaats, dakterras, geen zwaar grondwerk: snel geplaatst en mooi aangekleed met een terras.", "bois.se.h": "Half verzonken", "bois.se.p": "Hellend terrein, terrassen (stapelmuren), of gewoon om de look: deels in de grond, deels zichtbaar. Het verhoogde deel houdt het water langer schoon.", "bois.en.h": "Verzonken", "bois.en.p": "Het verhoogt de waarde van uw woning en gaat op in de tuin. De structuur is onzichtbaar; eromheen is alles mogelijk: hout, steen, terras, natuurlijk of kunstgras.", "kit.h": "Zwembad als bouwpakket", "kit.lead": "Bent u handig? Ons gepatenteerde houten zwembad bestaat als compleet bouwpakket, bij ons gefabriceerd en klaar om te plaatsen.", "kit.p1": "Op maat: u kiest afmeting en hoogte, vierkant of rechthoekig, opbouw, half verzonken of verzonken. Het komt op een gewapende betonplaat.", "kit.p2": "Weinig onderdelen, maar zeer robuust: eenvoudige montage, maximale sterkte, strakke lijnen.", "kit.mat.h": "De materialen", "kit.mat.1": "Wanden van grenen balken, autoclaaf klasse 4, 4,5 cm dik", "kit.mat.2": "Verlijmde omlopende ligger 16 × 14 cm, autoclaaf klasse 4", "kit.mat.3": "Stalen UPN-gordel van 220 mm, onzichtbaar", "kit.mat.4": "Boordstenen van grenen (tropisch hout optioneel), 4 m × 30 cm, in twee delen", "kit.liner": "5 kleuren liner: wit, lichtblauw, Franse blauw, lichtgrijs, zand. Franse makelij, op de exacte maat.", "kit.compo.h": "Wat het bouwpakket bevat", "kit.compo.1": "Structuur: hout, staal, roestvrijstalen schroeven, vilt, liner, boordstenen van grenen", "kit.compo.2": "Filtratie en uitrusting: filtratieplaat, 1 inlaatstuk, 1 skimmer, 1 roestvrijstalen ladder, 1 onderhoudsset, 1 PVC-set (rol van 12 m flexibele slang Ø 50, staaf van 2 m Ø 50, lijm)", "kit.securite": "Veiligheid en waterbehandeling: alarm, veiligheidszeilen of hekken; chloor, zout, actieve zuurstof of broom.", "kit.options": "Opties: 2e inlaatstuk, stofzuigeraansluiting, elektrische kast met witte of gekleurde LED-lamp, materiaal voor een zitbank of strand onder de liner, levering (haalbaarheid te bespreken met onze vestigingen).", "kit.shop": "Bestellen op lapiscinekit.com", "alu.h": "Aluminium zwembad op maat", "alu.lead": "Ons houtconcept was zo'n succes dat Florent Fondère het ook in aluminium heeft uitgewerkt.", "alu.p1": "De onderdelen worden speciaal voor ons op maat gemaakt. De bekledingsbalken zijn van blank aluminium of RAL 8008 gelakt, of verfraaid met een houtnerf.", "alu.p2": "Een materiaal dat tientallen jaren meegaat: licht, makkelijk te vervoeren, soepel, mechanisch sterker dan hout. Hoekprofielen van gegalvaniseerd staal.", "alu.inclus": "Het zwembad omvat de structuur, de liner, de onderwaterlamp, de complete filtratie, de inbouwonderdelen en de elektrische kast.", "coque.h": "Polyester zwembad", "coque.lead": "Schalen van Cosmos Piscines, in Frankrijk ontworpen en gemaakt, 10 jaar garantie, conform de MATIP-norm.", "coque.p1": "De schaal is in de fabriek gevormd en wordt in uw tuin geleverd zodra het grondwerk klaar is: geen zwaar metselwerk. De gladde gelcoat is makkelijk te onderhouden.", "coque.p2": "Bijna verticale wanden voor meer volume, een zitbank over de volle breedte en een geleidelijke afdaling. Geschikt voor alle waterbehandelingen, met een zeer goede prijs-kwaliteitverhouding.", "coque.mercure": "Mercure — de kleinste: 4,30 × 2,27 m, diepte 1,39 m, 3 treden over de breedte.", "coque.venus": "Vénus — middelgroot: 3 m breed, 5, 6 of 7 m lang, hoogte 1,48 m.", "coque.saturne": "Saturne — groot bassin: 4 m breed, 7, 8 of 9 m lang, diepte 1,50 m. Ideaal om te zwemmen.", "coque.coloris": "Kleuren: wit, zand, lichtgrijs, lichtblauw.", "coque.eq.h": "Uitrusting", "coque.eq": "Gewone of filterende skimmer afhankelijk van het model · afneembare stofzuigeraansluiting · LED-lamp · veiligheidsafvoer · richtbare inlaatstukken · bouwpakketformule", "coque.ent.h": "Onderhoudsmateriaal", "coque.ent": "Bodemzuiger en drijvende slang · telescoopsteel · schepnet · wandborstel · testset · PVC-set", "coque.fil.h": "Filtratie", "coque.fil": "1 zandfilter met 6-wegklep · 1 filterpomp · 1 elektrische kast", "beton.h": "Traditioneel betonnen zwembad", "beton.lead": "Het zwembad van bekistingsblokken: stevig, waterdicht, duurzaam en eindeloos aan te passen.", "beton.formes": "Opbouw, half verzonken, verzonken of overloopbad. Lengte, breedte, diepte en vorm bepalen we samen met u, afhankelijk van het terrein.", "beton.p1": "Strand, trappen, ladder, warmtepomp, tegenstroomzwemmen; chloor of zoutelektrolyse; boordstenen van hout, travertijn of reconstructiesteen, terras.", "beton.p2": "Van grondwerk tot afwerking doen wij alles zelf. Geen andere partijen op onze bouwplaats: één aanspreekpunt, een snelle en nette bouw.", "beton.opt.h": "Opties", "beton.opt": "Rolluik · zwembadzeil · alarm · warmtepomp · zoutelektrolyse + pH-pomp · hekken en leuningen · tegenstroomzwemmen · robots", "beton.eq.h": "Bij elk zwembad geleverd", "beton.eq": "Spiegelskimmer (waterlijn zo hoog mogelijk) · liner van Franse makelij, meerdere kleuren · inlaatstuk · stofzuigeraansluiting · LED-lamp · Hayward-zandfilter · Espa Silver-pomp · elektrische kast · onderhoudsset (thermometer, testset, telescoopsteel, borstel)", "beton.proc.h": "Hoe wij het bouwen", "beton.proc.0": "Indien nodig werken wij samen met een ingenieursbureau gespecialiseerd in beton.", "beton.proc.1": "De vloer: een funderingsplaat van 20 cm met 2 betonstaalmatten op 10 cm afstand, omsloten door een ringbalk.", "beton.proc.2": "De bekisting: bekistingsblokken van 25 cm, conform de norm, met een betonpomp gevuld en versterkt met staven van 8. Ongeveer 20 dagen uitharding.", "beton.proc.3": "De afwerking: een pleisterlaag op de wanden.", "beton.proc.4": "De liner: topkwaliteit, Franse makelij, op maat, behandeld tegen hitte en vlekken. Effen, bedrukt of gewapend PVC.", "amen.page.h": "Inrichting rond het zwembad", "amen.page.p": "Terras met leuning of windscherm, technische ruimte voor de filtratie, carport, zomerkeuken, tuinhuis: praktische en mooie oplossingen voor uw buitenruimte.", "amen.list": "Houten terras · technische ruimte · leuning en handrail · tuinhuis en overkapping · windscherm · pergola's · schuifvlonder · zomerkeuken", "amen.marg.h": "Boordstenen", "amen.marg.bois": "Van hout: grenen voor een eigentijdse en rustieke touch, ipé voor de elegantie van tropisch hout.", "amen.marg.pierre": "Van reconstructiesteen: gemaakt van granulaat van natuursteen.", "amen.marg.trav": "Van travertijn: natuurlijke kalkachtige sedimentaire steen.", "terr.h": "Terrassen en vlonders van hout", "terr.lead": "Uw strand in de zon, of 's avonds een verlichte palmboom: wij trekken het terras door tot aan het water.", "terr.p1": "In IPE of in grenen autoclaaf klasse 4: onze vlonders zijn ontworpen voor zwembaden. Weinig onderhoud en bestand tegen zon, weer en behandeld water.", "terr.p2": "Op maat, voor alle terreinen en alle zwembaden (polyester, plaatstaal, hout…). Structuur van 15 cm op verstelbare platines per vierkante meter; de vlonder kan op elke hoogte worden gehangen.", "terr.ipe": "IPE: tropisch hout uit Zuid-Amerika, het dichtste dat er bestaat (ruim boven teak, cumaru of massaranduba). Rechte vezel, zonder noesten, van nature rotvrij. Geen behandeling nodig.", "terr.pin": "Grenen autoclaaf klasse 4: bestand tegen droogte en strenge kou, even stevig als IPE, iets noestiger en lichter van kleur. Perfect in een tuin met bomen.", "terr.ent": "Onderhoud: laat het vergrijzen (één keer per jaar schoonspoelen met water) of breng één à twee keer per jaar een saturator aan.", "terr.vivant": "Hout is een levend materiaal: noesten, natuurlijke scheuren en vergrijzing door UV tasten de kwaliteit op geen enkele manier aan.", "spa.h": "De houten LPB-spa", "spa.lead": "Ontspanning en rust, in hetzelfde hout als onze zwembaden.", "spa.p1": "Wij maken uw spa van hout geïmpregneerd in autoclaaf klasse IV: gezellige zitbank, meerdere jets, skimmer en een lamp om 's avonds te genieten.", "spa.p2": "Binnenin een gewapend membraan (3D-gewapend PVC) naar keuze: Marbré blanc, Pierre de Java of Effet Bali. Boordstenen van IPE.", "ent.h": "Zwembadonderhoud", "ent.lead": "Een eenvoudige routine volstaat voor helder en gezond water.", "ent.day.h": "Elke dag", "ent.day": ["Verwijder bladeren en insecten met het schepnet", "Maak het skimmermandje leeg", "Test het water en corrigeer indien nodig: pH, TA (alkaliniteit), TH, chloor"], "ent.week.h": "Elke week", "ent.week": ["Waterpeil op 2/3 van de skimmer (te laag: lucht wordt aangezogen en de pomp raakt beschadigd; te hoog: vuil wordt slecht opgezogen)", "Let op de waterstroom uit de inlaatstukken: een zwakke stroom kan wijzen op een vervuild filter of een vervuilde pomp", "Schepnet, bodem met de bodemzuiger of robot, waterlijn met magic sponge of gel", "Maak het skimmermandje leeg en test het water", "Filter terugspoelen en naspoelen (1 tot 2 min), daarna de filtratie weer opstarten"], "ent.astuce": "Tip: houd tijdens het terugspoelen een vinger achter het kijkglas (het buisje onder de 6-wegklep). Zodra u uw vinger weer ziet en het water helder is, stopt u.", "trait.h": "Waterbehandeling", "trait.lead": "Ontsmetten en in balans brengen: de productgroepen die het water schoon houden.", "trait.chlore": "Chloor: eenvoudig en voordelig, maar het kan een gevoelige huid irriteren en de geur kan hinderen. Als tabletten of pastilles: langwerkend, shock (bij algen) of multifunctioneel (ontsmetting, vlokking, stabilisator).", "trait.sel": "Zout: de elektrolyse maakt natuurlijk, niet-gestabiliseerd chloor, zonder geur of irritatie. Het breekt snel af onder UV: een basisbehandeling, aan te vullen met een chloorshock indien nodig.", "trait.oxy": "Actieve zuurstof: ontsmettend, oxiderend en algendodend, geurloos en zacht. Duurder, gevoelig voor temperatuur en pH, en werkt maar kort. Vaak vloeibaar.", "trait.brome": "Broom: als pastilles, langwerkend of shock. Geurloos, niet irriterend, drievoudige werking. Duurder; voor continue verspreiding is een broomdoseerder nodig.", "trait.equil": "Balansproducten vullen de ontsmetting aan: correctoren voor pH, TA (alkaliniteit) en hardheid, te doseren na een watertest.", "guides.h": "Gebruiksgidsen", "guides.lead": "De handelingen die het water gezond en het materiaal in orde houden, stap voor stap.", "g.chlore.h": "Onderhoud van een zwembad met chloor", "g.chlore.i": "Chloor doodt bacteriën, schimmels en algen. Als poeder of korrels om op te lossen, of als tabletten in de skimmer voor een langzame werking.", "g.chlore.s": ["Materiaal: teststrips, elektronische tester of automatische chloorregelaar", "Elke week: waterpeil tussen de helft en 3/4 van de skimmer", "Schepnet, waterlijn, bodem (zuiger of robot), skimmermandje", "Pompmandje zo nodig leegmaken; hoge manometer = verzadigd filter: terugspoelen en naspoelen", "Ideale pH 7,2 tot 7,4: boven 7,6 pH-min; onder 7 pH-plus", "Chloor tussen 1 en 3 mg/l: te hoog, neutraliseer of laat verdampen; te laag, voeg chloor toe", "Stel eerst de pH bij en meet daarna het chloor: een hoge pH maakt chloor onwerkzaam", "TA (alkaliniteit) boven 10 °f; te laag, corrigeer met zuiveringszout (natriumbicarbonaat)"], "g.sel.h": "Onderhoud van een zoutwaterzwembad", "g.sel.i": "De elektrolyse zet zout om in actief natuurlijk chloor: continue ontsmetting, zonder geur. Let op: watertests, pH en zoutgehalte.", "g.sel.s": ["Materiaal: teststrips, zwembadzout, elektrolyse-eenheid, pH-doseerpomp", "Elke week: waterpeil, schepnet, waterlijn, bodem en skimmer", "Elektroden: reinigen zichzelf, en handmatig schoonmaken om de 6 maanden bij hard water; elektrolyse 's winters uitzetten", "pH-doseerpomp: sonde aan het begin van elk seizoen kalibreren", "Zoutgehalte tussen 3 en 7 g/l, afhankelijk van volume en apparaat", "pH tussen 7,2 en 7,4; TA (alkaliniteit) boven 10 °f"], "g.filtre.h": "Onderhoud van het zandfilter", "g.filtre.i": "Het filter houdt vuil tegen. Reinig het in het hoogseizoen elke 1 tot 2 weken. Raak de 6-wegklep nooit aan als de pomp draait.", "g.filtre.s": ["Voorfilter: pomp uit, skimmerkleppen en stofzuigeraansluiting dicht, deksel losdraaien, mandje leegmaken en spoelen, alles terugplaatsen", "Terugspoelen: klep op „terugspoelen”, pomp aan tot het water helder is, dan uit", "Naspoelen: klep op „naspoelen”, 1 tot 2 minuten, dan uit", "Klep op „filtratie”, pomp weer aan", "Ontkalken één keer per jaar (twee keer bij zeer kalkrijk water)"], "g.ph.h": "Een pH-sonde kalibreren", "g.ph.i": "Aan het begin van elk seizoen en na elke vervanging van de sonde. U hebt de ijkvloeistoffen pH 7 en pH 10 nodig, te koop in onze vestigingen in Saint-Maximin en Aubagne.", "g.ph.s": ["Draai de sonde los en sluit de opening af met de meegeleverde dop", "Apparaat met CAL-toets: 3 s op CAL, sonde in pH 7, CAL; het lampje 7.0 blijft branden als het klaar is. Lampje LOW brandt: sonde versleten", "Apparaat met menu: 3 s op V, code CA, sonde in pH 7, 2 min, V; wacht op „Oh”", "Spoel af zonder af te drogen, sonde in pH 10, 2 min, V; wacht op „Oh”", "„Er” in beeld: de sonde is aan het einde van zijn levensduur, vervangen", "Haal de dop eraf en plaats de sonde terug"], "g.hivchlore.h": "Overwinteren van een zwembad met chloor", "g.hivchlore.i": "Wij raden actieve overwintering aan: 1 tot 3 uur filtratie per dag tussen 4 en 6 uur 's ochtends, als het vriest. Het water circuleert en de apparatuur bevriest niet.", "g.hivchlore.s": ["Reinig bassin, waterlijn en filter (terugspoelen, naspoelen, ontkalken)", "Wacht tot het water langdurig onder 15 °C blijft", "pH tussen 7,2 en 7,4; zo nodig een shockbehandeling en 24 uur filtratie", "Overwinteringsproduct, 4 uur filtratie", "Filtratietijd = watertemperatuur ÷ 3", "Afdekking is niet verplicht; controleer het water af en toe", "Zeer strenge winter: stop en tap filter en pomp af", "Weer opstarten rond maart-april, als het water weer boven 12 °C komt"], "g.hivsel.h": "Overwinteren van een zoutwaterzwembad", "g.hivsel.i": "Hetzelfde actieve principe, met enkele handelingen om de elektrolyse-eenheid en de pH-sonde te beschermen.", "g.hivsel.s": ["Reinig bassin, waterlijn en filter (terugspoelen, naspoelen, ontkalken)", "Pas onder 15 °C de elektrolyse uitzetten (anders slijten de platen) en de filtratie laten draaien", "Overwinteringsproduct 2 tot 3 uur; pH tussen 7,2 en 7,4", "pH-sonde vorstvrij in leidingwater, dop op de leiding", "Spoel de slang van de peristaltische pomp door; jerrycan water in plaats van de corrector, functie „MA”", "Filtratie 's nachts tussen 4 en 6 uur; zeil of rolluik; pH één keer per maand controleren", "Strenge vorst voorspeld: alles uitzetten, pomp en filter leegtappen, Guizmo-fles in de skimmer", "Weer opstarten als het water weer boven 15 °C komt"], "acc.h": "Zwembadaccessoires", "acc.lead": "Waterbehandeling (chloor, zout, broom), zeilen, rolluiken: u kiest uw opties samen met onze adviseurs en alles is verkrijgbaar in onze vestigingen.", "acc.mx9": "Hydraulische robot Zodiac MX9: aangesloten op de stofzuigeraansluiting gebruikt hij de pomp om te rijden. Cyclonische borstels, turbozuigkracht, X-Drive-navigatie, getande rupsbanden.", "acc.dolphin": "Elektrische robot Dolphin S300: voor grote bassins. Volledige cyclus in 2 uur of snel in 1 uur; bodem, wanden en waterlijn; actieve borstel en meerlaagse filtratie.", "acc.pac": "Omkeerbare warmtepomp: de meest efficiënte en voordelige manier om te verwarmen, of te koelen. Titanium warmtewisselaar met 5 jaar garantie, geschikt voor zout. Door ons geplaatst, gratis offerte.", "acc.electro": "Zoutelektrolyse: zet zout om in natuurlijk chloor, geurloos en zachter. Aan te vullen met pH-regeling.", "acc.ph": "pH-doseerpomp: continue meting, pH gehouden tussen 7,2 en 7,4. Sonde aan het begin van elk seizoen kalibreren.", "acc.nage": "Tegenstroomzwemmen: zwemmen op de plaats, ook in een klein bassin, en genieten van massages. Geschikt voor onze houten en betonnen zwembaden.", "acc.bache": "Franse winterzeil: versterkt PVC van 550 g, anti-UV en antibacterieel, dubbele oogjes, afvoer van regenwater. 5 kleuren.", "acc.bulle": "Noppenfolie op maat: 400 micron, anti-UV, aan 4 zijden afgezet. Een paar graden warmer, minder vuil.", "acc.fontaine": "Roestvrijstalen fontein.", "sec.h": "Zwembadveiligheid", "sec.lead": "Sinds 1 januari 2004 moet elk nieuw privézwembad een beveiliging hebben; bestaande zwembaden sinds 1 januari 2006 (wet van 3 januari 2003).", "sec.barriere": "Beveiligingshek, NF P90-306: meer dan 110 cm, poortje met dubbele vergrendeling. Het onze: transparant anti-UV-net van 1,22 m, secties van 1 tot 6 m, 5 kleuren.", "sec.alarme": "Alarm, NF P90-307-1: onderwater (detecteert een val, ingebouwde sirene) of rondom (4 infraroodpalen).", "sec.bache": "Afdekking, NF P90-308: het balkenzeil, anti-UV en schimmelwerend, beveiligt het hele jaar en houdt de warmte vast.", "sec.volet": "Rolluik opbouw of onderwater: veiligheid, minder verdamping, minder warmte- en productverlies. Door ons geplaatst.", "sec.abri": "Overkapping, NF P90-309: plat, schuifbaar of verwijderbaar, dekt het hele bassin.", "realp.h": "Onze realisaties", "realp.lead": "Hout, aluminium, polyester, beton, inrichting: 72 projecten in de Var, de Bouches-du-Rhône en de hele regio.", "realp.f.bois": "Houten zwembad", "realp.f.alu": "Aluminium zwembad", "realp.f.coque": "Polyester zwembad", "realp.f.beton": "Betonnen zwembad", "realp.f.amen": "Inrichting", "about.h": "Het bedrijf", "about.lead": "Florent Fondère werkt sinds zijn 18e in de zwembadwereld. Hij koos hout om zijn natuurlijkheid en elegantie.", "about.p1": "In 2016 neemt hij een patent: de schoonheid van hout behouden zonder concessies aan de techniek. Zo ontstaan onze zwembaden op maat, en het bouwpakket uit onze fabriek voor de doe-het-zelver.", "about.p2": "Structuur van grenen autoclaaf klasse IV, tot in het spinthout geïmpregneerd: duurzamer dan hout dat is besproeid of gedompeld. Bekleding in ipé of padouk. Daarna een aluminium versie, blank, RAL 8008 of met houtnerf.", "about.p3": "Het succes maakte een tweede vestiging in Aubagne mogelijk, voor de Bouches-du-Rhône. Elke vestiging heeft zijn eigen winkelhoek.", "about.p4": "Vier concepten: polyester schaal, hout op maat, aluminium op maat, traditioneel beton. Ons team doet alles: grondwerk, vloer, structuur, liner, filtratie, en legt u bij het vullen uit hoe alles werkt.", "about.equip": "Warmtepompen, zoutelektrolyse, pH-pompen, alarmen, hekken, afdekkingen, rolluiken, robots, onderhoudsproducten voor zwembad en terras.", "about.social": "Volg onze projecten op Facebook en Instagram.", "tutos.h": "Videohandleidingen", "tutos.lead": "Montage van het bouwpakket, zeil, tijdschakelaar, warmtepomp, zoutelektrolyse, pH-sonde, robot: onze video's stap voor stap.", "tutos.alu": "Aluminium premium-bouwpakket", "tutos.kit": "Houten bouwpakket", "tutos.util": "Gebruik", "tuto.alu1": "Nr. 1 — Plaatsing van de hoekprofielen", "tuto.alu2": "Nr. 2 — Montage van de UPN-profielen", "tuto.alu3": "Nr. 3 — Bevestiging van de aluminium buis", "tuto.alu4": "Nr. 4 — Inklikken van de balken", "tuto.alu5": "Nr. 5 — Plaatsing van de skimmer", "tuto.alu6": "Nr. 6 — Installatie van de rail", "tuto.alu7": "Nr. 7 — Installatie van de aluminium liggers", "tuto.alu8": "Nr. 8 — Montage van de zitbank onder de liner", "tuto.alu9": "Nr. 9 — Montage van de zitbank met treden", "tuto.kit1": "Nr. 1 — Installatie van de skimmer", "tuto.kit2": "Nr. 2 — Inlaatstuk en stofzuigeraansluiting", "tuto.kit3": "Nr. 3 — Optie onderwaterlamp", "tuto.kit4": "Nr. 4 — De installatie van de liner voorbereiden", "tuto.kit5": "Nr. 5 — Plaatsing van de liner", "tuto.kit6": "Nr. 6 — Zitbank of strand onder de liner", "tuto.u1": "Een balkenzeil uitrollen", "tuto.u2": "Een balkenzeil oprollen", "tuto.u3": "Werking van de tijdschakelaar", "tuto.u4": "Een warmtepomp aan- en uitzetten", "tuto.u5": "De zoutelektrolyse in gebruik nemen", "tuto.u6": "Kalibreren van de pH-sonde", "tuto.u7": "Het filter terugspoelen", "tuto.u8": "De hydraulische robot MX9 gebruiken", "faq.h": "Veelgestelde vragen", "faq.legal": "Formaliteiten", "faq.hiver": "Overwintering", "faq.eau": "Waterproblemen", "faq.mat": "Accessoires en materiaal", "faq.items": [["legal", "Is een bouwvergunning nodig?", "Alleen voor een zwembad van meer dan 100 m²."], ["legal", "Wordt mijn zwembad belast?", "Het telt als bijgebouw: gemeentelijke woonbelasting. De grondbelasting geldt voor verzonken zwembaden (beton, hout, polyester); alleen demonteerbare opbouwzwembaden zijn vrijgesteld."], ["legal", "Moet ik de gemeente inlichten?", "Tot 10 m² is geen aangifte nodig. Daarboven doet u aangifte bij de dienst stedenbouw."], ["legal", "Maken jullie de plannen voor de vergunning?", "Nee. Uw gemeente kan u een lijst van architecten geven (betaalde dienst)."], ["hiver", "Waarom overwinteren?", "Om vorstschade aan wanden en filtratie te voorkomen."], ["hiver", "Wanneer overwinteren?", "Als het water onder 12 °C blijft (15 °C voor een zoutwaterzwembad)."], ["hiver", "Actief of passief overwinteren?", "Actief in streken met zachte winters: beperkte filtratie, behandeling blijft. Passief in koude streken: alles staat stil."], ["eau", "Groen en helder water", "Vaak een te lage TA (alkaliniteit) en algen: pH bijstellen, TA-plus toevoegen, chloren en een algendoder gebruiken."], ["eau", "Groen en troebel water", "Algen (warm water, te weinig chloor, pH uit balans, hoge TH, lage TA): testen, shockchlorering, algendoder, vlokmiddel."], ["eau", "Spinaziegroen water", "De algen woekeren: shockchlorering, algendoder, vlokmiddel."], ["eau", "Groen of geel water", "Water te zuur, pH te laag: pH-plus toevoegen."], ["eau", "Blauwgroen water", "Ontbonden koper (koperproducten of ijzerhydraat, te vermijden): vers water toevoegen en opnieuw in balans brengen."], ["eau", "Geel of donkerbruin water", "Rottende planten (shockchlorering, vlokmiddel) of metalen zoals ijzer en mangaan (metaalbinder)."], ["eau", "Troebel water, ruwe wanden", "Te veel kalk: kalkverwijderaar gebruiken."], ["eau", "Melkachtig water", "Kalk, pH-schommelingen, dode algen… Testen, shockbehandeling, zo nodig vlokmiddel."], ["eau", "Witachtig water", "Ontbindende kalkzouten: vlokmiddel."], ["eau", "Witachtig bezinksel op de bodem", "Kalkaanslag: controleer en corrigeer de waterhardheid."], ["eau", "Gladde bodem en wanden", "Beginnende algen: waterbalans, zo nodig pH verlagen, chloreren, algendoder."], ["eau", "Vettige resten aan het oppervlak", "Zonnecrèmes en oliën: absorberende doekjes in de skimmer leggen."], ["eau", "Zwarte rand op de liner", "Opgehoopt vuil op de waterlijn: waterlijnreiniger (magic sponge, gel)."], ["eau", "Roodbruine vlekken op de liner", "Mineraal- of metaaldeeltjes, kalk: pH testen, metaalbinder."], ["eau", "Witte vlekken op de liner", "Te veel chloorproducten: de liner is beschadigd, dit is onomkeerbaar."], ["mat", "Mijn robot verkleurt", "Te lang in het water of in de zon gebleven: producten en UV tasten het materiaal aan."], ["mat", "Mijn MX9-robot rijdt niet meer", "Controleer de zuigkracht van de stofzuigeraansluiting (filter reinigen), de staat van slangen en rupsbanden, slijtdelen."], ["mat", "De manometer van het filter staat in het rood", "Het zand is samengeperst: te weinig terug- en naspoelen."], ["mat", "Zand in het zwembad", "Wind, versleten filterbuisjes, te veel of te weinig zand, vastgekoekte kalk of algen, te krachtige pomp. Vlokmiddel helpt het zand tegen te houden."], ["mat", "Kleine schokjes in het water", "Elektrolyse en pH-regelaar wekken een zwakke stroom op: plaats een aardingsstaaf (aarding)."], ["mat", "Mijn ladder roest", "Roestvrij staal van slechte kwaliteit, of zoutelektrolyse zonder afvoer van de stromen naar de aarde."], ["mat", "Mijn onderwaterlamp lekt", "Men steunt er vaak op en dan beweegt hij; zelden een fabrieksfout. Laat hem nakijken."], ["mat", "Zwakke waterstroom uit het inlaatstuk", "Filter terug- en naspoelen; een zeer groot zwembad kan te weinig inlaatstukken hebben."], ["mat", "Mijn liner vormt plooien", "Te veel chloor, te zure pH of te warm water: de liner wordt poreus en ontspant."]], "contact.h": "Laten we praten over uw zwembad", "contact.lead": "Een paar antwoorden en uw aanvraag
