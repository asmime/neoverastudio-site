town hall can give you a list of architects (paid service)."], ["hiver", "Why winterise?", "To avoid frost damage to the walls and the filtration."], ["hiver", "When to winterise?", "When the water stays below 12 °C (15 °C for a salt pool)."], ["hiver", "Active or passive winterising?", "Active in regions with mild winters: reduced filtration, treatment maintained. Passive in cold regions: everything is shut down."], ["eau", "Green and clear water", "Often a total alkalinity (TA) that is too low, plus algae: adjust the pH, add TA+, chlorinate and use an algaecide."], ["eau", "Green and cloudy water", "Algae (warm water, insufficient chlorine, unbalanced pH, high TH, low TA): test, shock chlorination, algaecide, flocculant."], ["eau", "Spinach-green water", "Algae are thriving: shock chlorination, algaecide, flocculant."], ["eau", "Green or yellow water", "Water too acidic, pH too low: add pH+."], ["eau", "Blue-green water", "Decomposed copper (copper-based products or iron hydrate, to be avoided): add fresh water and rebalance."], ["eau", "Yellow or dark brown water", "Decomposing plant matter (shock chlorination, flocculant) or metals such as iron and manganese (metal sequestrant)."], ["eau", "Cloudy water, rough walls", "Too much limescale: anti-scale treatment."], ["eau", "Milky water", "Limescale, pH variation, dead algae… Test, shock treatment, flocculant if needed."], ["eau", "Whitish water", "Decomposing limescale salts: flocculant."], ["eau", "Whitish deposit on the bottom", "Scale: check and correct the water hardness."], ["eau", "Slippery floor and walls", "Early algae: balance the water, lower the pH if needed, chlorination, algaecide."], ["eau", "Greasy residue on the surface", "Sun creams and oils: place absorbent pads in the skimmer."], ["eau", "Black edge on the liner", "Dirt built up at the waterline: waterline cleaner (magic sponge, gel)."], ["eau", "Red-brown stains on the liner", "Mineral or metal particles, limescale: test the pH, metal sequestrant."], ["eau", "White stains on the liner", "Too many chlorinated products: the liner is damaged, and it is irreversible."], ["mat", "My robot is fading", "Left too long in the water or in the sun: products and UV damage the equipment."], ["mat", "My MX9 robot no longer moves", "Check the suction at the vacuum point (filter to wash), the condition of the hoses and tracks, wear parts."], ["mat", "The filter pressure gauge is in the red", "The sand is compacted: backwashes and rinses not frequent enough."], ["mat", "Sand in the pool", "Wind, worn strainers, too much or too little sand, limescale or algae stuck on, pump too powerful. Flocculant helps retain the sand."], ["mat", "Small shocks in the water", "The electrolyser and pH controller produce a weak current: install a grounding rod (earthing)."], ["mat", "My ladder is rusting", "Poor-quality stainless steel, or a salt electrolyser without grounding of the currents."], ["mat", "My light is taking on water", "People often lean on it and it shifts; rarely, a factory defect. Have it checked."], ["mat", "Weak jet flow", "Backwash and rinse the filter; a very large pool may lack jets."], ["mat", "My liner is wrinkling", "Chlorine too high, pH too acidic or water too warm: the liner becomes porous and slackens."]], "contact.h": "Let's talk about your pool", "contact.lead": "A few answers, and your request goes straight to the right showroom. A sales advisor will call you back.", "f.type": "Which pool?", "f.type.ns": "I don't know yet", "f.pose": "Which installation?", "f.pose.hs": "Above-ground", "f.pose.se": "Semi-buried", "f.pose.en": "Buried", "f.terrain": "Your land", "f.dim": "Desired dimensions (optional)", "f.dim.ph": "for example 8 × 4 m", "f.nom": "Name", "f.email": "Email", "f.tel": "Phone", "f.dep": "Département", "f.ville": "Town", "f.connu": "How did you hear about us?", "f.connu.o": ["Word of mouth", "Fair or trade show", "Social media", "Print advertisement", "Yellow Pages", "Billboard", "Other"], "f.msg": "Your message", "f.send": "Send my request", "f.route83": "Your request will go to the Saint-Maximin showroom.", "f.route13": "Your request will go to the Aubagne showroom.", "f.ok": "Thank you! In the live version, your request will go to {agence}. This is a mock-up: nothing is sent.", "f.err": "We need your name and an email or phone number to call you back.", "f.projet": "Added from “My project”:", "mine.h": "My project", "mine.empty": "Nothing yet. Add a pool, an option or a landscaping feature from the pages.", "mine.add": "Add to my project", "mine.added": "Added", "mine.go": "Request a quote with this project", "mentions.h": "Legal notice", "mentions.p": "LA PISCINE BOIS / LPB PISCINES, manufacturer and installer of wooden pools. LPB La Piscine Bois, RCS Draguignan 752 316 687. Registered office: Parc d'activité d'Aix, 340 avenue de la Maximinoise, 83470 Saint-Maximin-la-Sainte-Baume. Manager: Florent Fondère. The site's content is the property of LA PISCINE BOIS; any reproduction without permission is prohibited (art. L122-4 of the French Intellectual Property Code). The full text of the legal notice and privacy policy of your current site will be carried over at installation.", "conf.h": "Privacy policy", "conf.p": "The data entered in the form is used only to answer your request and is never resold. The full text of your current policy will be carried over at installation.", "foot.tag": "Manufacturer and installer of wood, aluminium, shell and concrete pools, for over 20 years.", "foot.maquette": "Redesign proposal by Neovera Studio — non-contractual mock-up.", "bot.name": "LPB Conseil", "bot.sub": "I help you choose", "bot.virtual": "Virtual assistant", "bot.hello": "Hello! I'm the virtual assistant of LPB Piscines. Land, type of pool, maintenance, showrooms: ask your question.", "bot.invite": "A question about your land or your future pool?", "bot.ph": "Type your question…", "bot.send": "Send", "bot.chips": ["My land is sloping", "Wood, aluminium, shell or concrete?", "Who is the kit for?", "Green water", "Showroom opening hours", "Request a quote"], "bot.unknown": "I'm not sure I can answer that well. The easiest way: call Saint-Maximin on 04 89 67 80 90 or Aubagne on 04 42 36 71 36, or leave your request in the form.", "bot.a.pente": "On sloping or terraced land, we often install a semi-buried wooden pool: less excavation, and a patented wood and steel structure that holds back the pressure of the soil.", "bot.a.choix": "Wood: our patented process, made to measure, for any terrain. Aluminium: the same concept, very durable. Shell: installed fast, 10-year warranty. Concrete: tradition, up to the infinity edge. The kit: for installing yourself.", "bot.a.kit": "The kit is our patented wooden pool, made in our workshop, for DIYers: few parts, video tutorials, to be placed on a concrete slab. Orders on lapiscinekit.com.", "bot.a.vert": "Green water: often algae. Test the water, do a shock chlorination, then algaecide and flocculant. If it is green and clear, check the total alkalinity (TA) first.", "bot.a.horaires": "Saint-Maximin: Monday to Saturday, 9:30 am-12:30 pm and 1:30-5:30 pm. Aubagne: Tuesday to Friday 1-5 pm, Saturday 10 am-12 pm and 1-6 pm.", "bot.a.devis": "The quote form asks you a few questions (pool, installation, land) and sends your request to the right showroom.", "bot.a.prix": "We don't publish prices: every pool is made to measure. A free quote takes two minutes to request.", "bot.a.coque": "Three Cosmos shells: Mercure (4.30 × 2.27 m), Vénus (3 m wide, 5 to 7 m long) and Saturne (4 m wide, 7 to 9 m long). Colours: white, sand, light grey, pale blue.", "bot.a.hiver": "Winterise when the water stays below 12 °C (15 °C for salt). We recommend active winterising: filtration at night between 4 and 6 am.", "bot.a.securite": "The law requires a certified safety device: fence, alarm, cover or enclosure. We install fences, alarms, bar covers and shutters.", "bot.a.spa": "Our spa is in class IV pressure-treated wood, with a bench, jets, a light, reinforced membrane in White Marble, Java Stone or Bali Effect, and IPE coping.", "bot.a.zone": "We work across the whole PACA region, with two showrooms: Saint-Maximin (Var) and Aubagne (Bouches-du-Rhône).", "bot.a.terrasse": "IPE or class 4 pressure-treated pine decks, made to measure, on adjustable bases: they suit every pool.", "bot.a.mairie": "Up to 10 m²: no paperwork. Beyond that: declaration at the town hall. Building permit above 100 m².", "bot.a.pac": "The reversible heat pump heats or cools the water; titanium exchanger with a 5-year warranty, salt compatible. We install it.", "bot.a.liner": "Made-to-measure French liners: white, French blue, pale blue, graphite, light grey, dark grey, granite black, sand, Caribbean green, olive green, and reinforced PVC.", "trust.avis": "16 published Google reviews", "bot.a.garantie": "Cosmos shells carry a 10-year guarantee (MATIP standard). The titanium exchanger of our heat pumps is guaranteed 5 years against corrosion. For everything else, our showrooms detail the guarantees in your quote.", "bot.a.duree": "Our pine is pressure-treated right through (class 4), far more durable than surface-treated wood; aluminium lasts several decades. An exact lifespan depends on maintenance: our showrooms will tell you more.", "bot.a.livraison": "We install throughout the PACA region. For a kit delivered further away, check feasibility with our showrooms: the easiest way is to leave a request."}, "es": {"meta.title": "LPB Piscines — piscinas de madera, aluminio, poliéster y hormigón en el Var y Bouches-du-Rhône", "ui.skip": "Ir al contenido", "ui.lang": "Idioma", "ui.devis": "Solicitar presupuesto", "ui.esquisse": "Esbozar mi proyecto", "ui.call": "Llamar", "ui.back": "Volver", "ui.more": "Ver la página", "ui.all": "Todo", "ui.close": "Cerrar", "ui.watch": "Ver el vídeo", "ui.video_soon": "Vídeo visible en su sitio actual, que se recuperará en la instalación.", "ui.dl": "Versión en PDF disponible en nuestras agencias", "ui.see_all_real": "Ver las 72 realizaciones", "ui.next": "Siguiente", "ui.mine": "Mi proyecto", "nav.piscines": "Piscinas", "nav.bois": "Piscina de madera", "nav.kit": "Piscina en kit", "nav.alu": "Piscina de aluminio", "nav.coque": "Piscina de poliéster", "nav.beton": "Piscina de hormigón", "nav.amenagement": "Exteriores", "nav.amenagement_ext": "Instalaciones exteriores", "nav.terrasse": "Terrazas y tarimas", "nav.spa": "Spa", "nav.entretien": "Mantenimiento", "nav.traitement": "Tratamiento", "nav.guides": "Guías", "nav.accessoires": "Accesorios", "nav.securite": "Seguridad", "nav.realisations": "Realizaciones", "nav.apropos": "Quiénes somos", "nav.contact": "Contacto", "nav.tutos": "Tutoriales en vídeo", "nav.faq": "Preguntas frecuentes", "nav.presse": "Prensa", "nav.kitshop": "Pedidos de kits", "nav.mentions": "Aviso legal", "nav.confidentialite": "Privacidad", "nav.conseil": "LPB Conseil", "top.agences": "Saint-Maximin 04 89 67 80 90 · Aubagne 04 42 36 71 36", "home.h1": "La piscina de madera que resiste en cualquier terreno.", "home.lead": "Pendiente, terrazas de piedra, roca, arcilla: nuestra estructura de madera y acero, patentada en 2016, se instala donde otros renuncian. Fabricada e instalada por nuestros equipos, en el Var y Bouches-du-Rhône, desde hace más de 20 años.", "home.facts": "6 departamentos cubiertos · 2 agencias · 1.284 piscinas y terrazas realizadas", "home.stamp": "Patente 2016 · madera + acero", "home.belt": "Cinturón de acero UPN de 220 mm, invisible una vez instalada", "brevet.h": "Por qué nuestras piscinas de madera no se mueven", "brevet.p1": "En la mayoría de las piscinas de madera, unos puntales sujetan las paredes. Con el empuje del agua y de la tierra, acaban cediendo.", "brevet.p2": "Florent Fondère diseñó algo distinto: una estructura de tablones de pino, sujeta abajo por una viga y rodeada arriba por un cinturón de acero. El vaso es sólido en toda su altura.", "brevet.l1": "Tablones de pino escandinavo, autoclave clase 4, 4,5 cm de grosor", "brevet.l2": "Viga perimetral laminada de 16 × 14 cm en la base", "brevet.l3": "Cinturón UPN de acero de 220 mm, invisible", "brevet.l4": "Albardillas de pino de 30 cm de ancho, o de madera exótica", "brevet.no": "Puntales: la solución que hemos abandonado", "brevet.cta": "Descubrir la piscina de madera", "mat.h": "Cinco formas de construir su piscina", "mat.bois": "Nuestro procedimiento patentado, a medida, sobre el suelo, semienterrada o enterrada.", "mat.kit": "El mismo concepto, fabricado en nuestro taller, para montar usted mismo.", "mat.alu": "El concepto en aluminio: bruto o RAL 8008, ligero y duradero.", "mat.coque": "Vasos de poliéster Cosmos fabricados en Francia, con 10 años de garantía.", "mat.beton": "La tradición en bloques de hormigón, hasta el desbordamiento.", "terrain.h": "Pendiente, bancales, roca: sabemos hacerlo", "terrain.p": "Elija su situación. Le decimos qué solemos instalar en ese caso.", "terrain.pente": "En pendiente", "terrain.restanque": "En terrazas de piedra (restanques)", "terrain.roche": "Rocoso o arcilloso", "terrain.petit": "Poco espacio, patio, azotea", "terrain.plat": "Terreno llano y despejado", "terrain.r.pente": "Una piscina de madera semienterrada: una parte en el suelo, otra visible, y menos movimiento de tierras. Ventaja: el agua se mantiene limpia más tiempo gracias a la parte elevada.", "terrain.r.restanque": "Nuestro procedimiento se adapta a las terrazas de piedra y a los accesos difíciles: la estructura se entrega en piezas y se monta en el lugar.", "terrain.r.roche": "La madera y el acero absorben las tensiones del terreno. Estudiamos la ubicación (suelo, orientación, vecindad) antes de elegir entre sobre el suelo o semienterrada.", "terrain.r.petit": "Una piscina de madera o aluminio sobre el suelo, sin grandes obras de excavación, realzada con una terraza.", "terrain.r.plat": "Todo es posible: madera o aluminio enterrados, vaso de poliéster instalado en pocos días u hormigón tradicional.", "liner.h": "El liner da su color al agua", "liner.p": "Liners de fabricación francesa, hechos a las medidas exactas de su piscina. Lisos, estampados o de PVC armado.", "liner.blanc": "Blanco", "liner.bleu-france": "Azul Francia", "liner.bleu-pale": "Azul pálido", "liner.graphite-melange-gris-noir": "Grafito", "liner.gris-clair": "Gris claro", "liner.gris-fonce": "Gris oscuro", "liner.noir-granite": "Negro granito", "liner.sable": "Arena", "liner.vert-antille": "Verde Antillas", "liner.vert-olive": "Verde oliva", "real.h": "Piscinas instaladas junto a usted", "real.p": "Saint-Maximin, Aubagne, La Ciotat, Fréjus, Meyreuil, Bouc-Bel-Air… 72 obras en fotos.", "amen.h": "Alrededor de la piscina", "amen.p": "Terrazas de IPE o de pino, cuarto técnico, cocina de verano, cochera: nuestros equipos trabajan la madera hasta el fondo del jardín.", "spa.teaser": "Un spa de madera, hecho como nuestras piscinas.", "avis.h": "Lo que dicen nuestros clientes", "avis.src": "Opiniones de Google publicadas en su sitio actual", "after.h": "Después de la instalación, seguimos a su lado", "after.p": "Guías de mantenimiento, tutoriales en vídeo, preguntas frecuentes y tienda en nuestras dos agencias.", "agences.h": "Dos agencias, un solo interlocutor", "agence.stmax": "Agencia de Saint-Maximin", "agence.stmax.addr": "Parc d'activité d'Aix, 340 avenue de la Maximinoise, 83470 Saint-Maximin-la-Sainte-Baume", "agence.stmax.h": "De lunes a sábado, de 9:30 a 12:30 y de 13:30 a 17:30", "agence.aubagne": "Agencia de Aubagne", "agence.aubagne.addr": "195, chemin de Ceinture, 13400 Aubagne", "agence.aubagne.h": "De martes a viernes, de 13:00 a 17:00; sábados, de 10:00 a 12:00 y de 13:00 a 18:00", "agence.boutique": "Rincón de tienda en las dos agencias.", "presse.h": "Visto en televisión", "presse.p": "Aparición en 66 Minutes (M6) el 23 de abril de 2023, tras el Salon Piscine, Spa & Jardin, en el minuto 10:30 del vídeo.", "piscines.h": "Nuestras piscinas", "piscines.p1": "¿Tiene un proyecto? Partimos de su terreno, de su entorno, de las limitaciones de cada tipo de piscina y de su presupuesto.", "piscines.p2": "Especialistas en piscinas de madera, con un sistema patentado único en el mercado, también instalamos aluminio, poliéster y hormigón. Venga a vernos a Saint-Maximin-la-Sainte-Baume (Var) o a Aubagne (Bouches-du-Rhône).", "bois.h": "Piscina de madera a medida", "bois.lead": "Sobre el suelo, semienterrada o enterrada, interior o exterior, rectangular o de forma libre: nuestro modelo patentado se adapta a todo.", "bois.p1": "Desde hace más de veinte años vendemos e instalamos piscinas de madera a medida en el Var y en Provence-Alpes-Côte d'Azur.", "bois.p2": "Su estructura de madera y acero sujeta el vaso por abajo y por arriba. Resuelve el problema de las piscinas de madera con puntales: el empuje de la tierra y del agua sobre las paredes.", "bois.inclus": "La piscina incluye la estructura, el liner, el foco, la filtración completa, las piezas a sellar y el cuadro eléctrico.", "bois.implant": "La ubicación es una decisión clave: tipo de suelo, orientación, superficie, vecindad. Le ayudamos a encontrar el tamaño y el lugar adecuados.", "bois.bois.h": "Madera de calidad, sin tratamientos que aplicar", "bois.bois.p": "Déjela agrisar de forma natural (una limpieza con agua al año) o aplique un saturador una o dos veces al año para conservar su tono.", "bois.pin": "Pino escandinavo: procedente de regiones de clima duro, tratado en profundidad en autoclave (clase 4), estable y duradero en contacto con el agua.", "bois.ipe": "Ipé: madera exótica de Sudamérica, muy densa, naturalmente imputrescible, resistente al moho y a las termitas.", "bois.liner": "Liners de fabricación francesa, a las medidas exactas del vaso: tonos lisos, estampados o de PVC armado, para hermosos contrastes de día y de noche.", "bois.hs.h": "Sobre el suelo", "bois.hs.p": "Poco espacio, patio, azotea, sin grandes movimientos de tierra: se instala rápido y se realza con una terraza.", "bois.se.h": "Semienterrada", "bois.se.p": "Terreno en pendiente, terrazas de piedra, o simplemente por su aspecto: una parte en el suelo, otra visible. Su parte elevada mantiene el agua limpia más tiempo.", "bois.en.h": "Enterrada", "bois.en.p": "Da valor a la propiedad y se funde con el jardín. La estructura es invisible; alrededor, todo es posible: madera, piedra, terraza, césped natural o artificial.", "kit.h": "Piscina en kit", "kit.lead": "¿Le gusta el bricolaje? Nuestra piscina de madera patentada existe en kit completo, fabricado en nuestro taller y listo para montar.", "kit.p1": "A medida: usted elige tamaño y altura, cuadrada o rectangular, sobre el suelo, semienterrada o enterrada. Se instala sobre una losa de hormigón armado.", "kit.p2": "Pocas piezas, pero muy robustas: un montaje sencillo, máxima resistencia, líneas depuradas.", "kit.mat.h": "Los materiales", "kit.mat.1": "Paredes de tablones de pino en autoclave clase 4, de 4,5 cm de grosor", "kit.mat.2": "Viga perimetral laminada de 16 × 14 cm, autoclave clase 4", "kit.mat.3": "Cinturón UPN de acero de 220 mm, invisible", "kit.mat.4": "Albardillas de pino (madera exótica opcional), 4 m × 30 cm, en dos piezas", "kit.liner": "5 colores de liner: blanco, azul pálido, azul Francia, gris claro, arena. Fabricación francesa, a las medidas exactas.", "kit.compo.h": "Qué contiene el kit", "kit.compo.1": "Estructura: madera, acero, tornillos de inox, fieltro, liner, albardillas de pino", "kit.compo.2": "Filtración y equipamiento: plataforma de filtración, 1 boquilla de impulsión, 1 skimmer, 1 escalera de inox, 1 kit de mantenimiento, 1 kit de PVC (rollo de 12 m de tubo flexible Ø 50, barra de 2 m Ø 50, cola)", "kit.securite": "Seguridad y tratamiento: alarma, cubiertas de seguridad o vallas; cloro, sal, oxígeno activo o bromo.", "kit.options": "Opciones: 2.ª boquilla de impulsión, toma de barredera, cuadro eléctrico con foco LED blanco o de color, material para banco o playa bajo el liner, entrega (viabilidad a consultar con nuestras agencias).", "kit.shop": "Pedir en lapiscinekit.com", "alu.h": "Piscina de aluminio a medida", "alu.lead": "Nuestro concepto de madera tuvo tanto éxito que Florent Fondère lo adaptó al aluminio.", "alu.p1": "Las piezas se fabrican a medida para nosotros. Los tablones de revestimiento son de aluminio bruto o pintados en RAL 8008, o realzados con un veteado de madera.", "alu.p2": "Un material que dura decenas de años: ligero, fácil de transportar, flexible, mecánicamente más resistente que la madera. Ángulos de acero galvanizado.", "alu.inclus": "La piscina incluye la estructura, el liner, el foco, la filtración completa, las piezas a sellar y el cuadro eléctrico.", "coque.h": "Piscina de poliéster", "coque.lead": "Vasos Cosmos Piscines diseñados y fabricados en Francia, con 10 años de garantía, conformes a la norma MATIP.", "coque.p1": "Moldeado en fábrica, el vaso se entrega en su jardín una vez hecha la excavación: sin grandes obras de albañilería. Su gel-coat liso se limpia con facilidad.", "coque.p2": "Paredes casi verticales para más volumen, banco en todo el ancho y descenso gradual. Compatible con todos los tratamientos, con una excelente relación calidad-precio.", "coque.mercure": "Mercure — la más pequeña: 4,30 × 2,27 m, profundidad 1,39 m, 3 escalones a lo ancho.", "coque.venus": "Vénus — tamaño intermedio: 3 m de ancho, 5, 6 o 7 m de largo, altura 1,48 m.", "coque.saturne": "Saturne — vaso grande: 4 m de ancho, 7, 8 o 9 m de largo, profundidad 1,50 m. Ideal para nadar.", "coque.coloris": "Colores: blanco, arena, gris claro, azul pálido.", "coque.eq.h": "Equipamiento", "coque.eq": "Skimmer clásico o filtrante según el modelo · toma de barredera desmontable · foco LED · sumidero de seguridad · boquillas de impulsión orientables · fórmula kit", "coque.ent.h": "Material de mantenimiento", "coque.ent": "Barredera y manguera flotante · pértiga telescópica · recogehojas de superficie · cepillo de paredes · maletín de análisis · kit de PVC", "coque.fil.h": "Filtración", "coque.fil": "1 filtro de arena con válvula de 6 vías · 1 bomba de filtración · 1 cuadro eléctrico", "beton.h": "Piscina de hormigón tradicional", "beton.lead": "La piscina de bloques de hormigón: sólida, estanca, duradera y personalizable hasta el infinito.", "beton.formes": "Sobre el suelo, semienterrada, enterrada o de desbordamiento. Longitud, anchura, profundidad y forma se deciden con usted, según el terreno.", "beton.p1": "Playa, escaleras, escalera de mano, bomba de calor, nado a contracorriente; cloro o electrolizador de sal; albardillas de madera, travertino o piedra reconstituida, terraza.", "beton.p2": "De la excavación a los acabados, lo hacemos todo. Ningún otro profesional en nuestras obras: un solo interlocutor, una obra rápida y limpia.", "beton.opt.h": "Opciones", "beton.opt": "Persiana enrollable · cubierta · alarma · bomba de calor · electrolizador de sal + bomba de pH · vallas y barandillas · nado a contracorriente · robots", "beton.eq.h": "Incluido con cada piscina", "beton.eq": "Skimmer espejo (línea de agua lo más alta posible) · liner de fabricación francesa, varios colores · boquilla de impulsión · toma de barredera · foco LED · filtro de arena Hayward · bomba Espa Silver · cuadro eléctrico · kit de mantenimiento (termómetro, maletín de análisis, pértiga telescópica, cepillo)", "beton.proc.h": "Cómo la construimos", "beton.proc.0": "Trabajamos con una oficina técnica especializada en hormigón cuando es necesario.", "beton.proc.1": "La losa: una cimentación de 20 cm con 2 mallas electrosoldadas separadas 10 cm, rodeada por una viga de atado.", "beton.proc.2": "El encofrado: bloques de hormigón de 25 cm, conformes a la norma, rellenos con bomba de hormigón y reforzados con barras de 8. Unos 20 días de secado.", "beton.proc.3": "Los acabados: un enlucido en las paredes.", "beton.proc.4": "El liner: gama alta, fabricación francesa, a medida, tratado contra el calor y las manchas. Liso, estampado o de PVC armado.", "amen.page.h": "Instalaciones para la piscina", "amen.page.p": "Terraza con barandilla o celosía, cuarto técnico para la filtración, cochera, cocina de verano, chalet: soluciones prácticas y bellas para sus exteriores.", "amen.list": "Terraza de madera · cuarto técnico · barandillas y pasamanos · chalet y cobertizo · celosías · pérgolas · tarima corredera · cocina de verano", "amen.marg.h": "Albardillas", "amen.marg.bois": "De madera: el pino para un toque contemporáneo y rústico, el ipé para la elegancia de lo exótico.", "amen.marg.pierre": "De piedra reconstituida: fabricada con áridos de piedras naturales.", "amen.marg.trav": "De travertino: roca natural sedimentaria caliza.", "terr.h": "Terrazas y tarimas de madera", "terr.lead": "Su playa al sol o, por la noche, una palmera iluminada: prolongamos la terraza hasta el agua.", "terr.p1": "En IPE o en pino autoclave clase 4, nuestras tarimas están pensadas para piscinas: poco mantenimiento, y resisten el sol, la intemperie y el agua tratada.", "terr.p2": "A medida, para todos los terrenos y todas las piscinas (poliéster, chapa, madera…). Estructura de 15 cm sobre soportes regulables cada metro cuadrado; la tarima puede suspenderse a cualquier altura.", "terr.ipe": "El IPE: madera exótica de Sudamérica, la más densa que existe (muy por encima de la teca, el cumaru o el massaranduba). Fibra recta, sin nudos, naturalmente imputrescible. No necesita ningún tratamiento.", "terr.pin": "El pino autoclave clase 4: resiste la sequía y el frío intenso, tan sólido como el IPE, algo más nudoso y más claro. Perfecto en un jardín arbolado.", "terr.ent": "Mantenimiento: déjela agrisar (una limpieza con agua al año) o aplique un saturador una o dos veces al año.", "terr.vivant": "La madera es un material vivo: nudos, grietas naturales y el agrisado por los rayos UV no alteran en nada sus cualidades.", "spa.h": "El spa de madera LPB", "spa.lead": "Relax y bienestar, en la misma madera que nuestras piscinas.", "spa.p1": "Fabricamos su spa en madera tratada en autoclave clase IV: banco acogedor, varias boquillas, skimmer y foco para disfrutarlo por la noche.", "spa.p2": "En el interior, una membrana armada (PVC armado 3D) a su elección: Mármol blanco, Piedra de Java o Efecto Bali. Albardillas de IPE.", "ent.h": "Mantenimiento de la piscina", "ent.lead": "Una rutina sencilla basta para mantener el agua clara y sana.", "ent.day.h": "Cada día", "ent.day": ["Retire hojas e insectos con el recogehojas", "Vacíe la cesta del skimmer", "Analice el agua y corrija si es necesario: pH, alcalinidad (TAC), TH, cloro"], "ent.week.h": "Cada semana", "ent.week": ["Nivel de agua a 2/3 del skimmer (demasiado bajo: entra aire y se daña la bomba; demasiado alto: las impurezas se aspiran mal)", "Vigile el caudal de las boquillas: un caudal débil puede indicar un filtro o una bomba obstruidos", "Recogehojas, fondo con la barredera o el robot, línea de agua con esponja mágica o gel", "Vacíe la cesta del skimmer y analice el agua", "Lavado del filtro y después enjuague (1 a 2 min), y reinicio de la filtración"], "ent.astuce": "Consejo: durante el lavado, ponga un dedo detrás del visor de lavado (el tubito bajo la válvula de 6 vías). En cuanto vuelva a ver su dedo y el agua esté clara, pare.", "trait.h": "Tratamiento de la piscina", "trait.lead": "Desinfectar, equilibrar: las familias de productos que mantienen el agua limpia.", "trait.chlore": "El cloro: sencillo y económico, pero puede irritar las pieles sensibles y su olor molesta. En pastillas o tabletas: de larga duración, choque (en caso de algas) o multifunción (desinfección, floculación, estabilizante).", "trait.sel": "La sal: el electrolizador produce un cloro natural no estabilizado, sin olor ni irritación. Se degrada rápido con los UV: es un tratamiento de base, que se completa con cloro choque si hace falta.", "trait.oxy": "El oxígeno activo: desinfectante, oxidante y antialgas, inodoro y suave. Más caro, sensible a la temperatura y al pH, actúa poco tiempo. A menudo líquido.", "trait.brome": "El bromo: en pastillas, de larga duración o choque. Inodoro, no irritante, triple acción. Más costoso; requiere un brominador para una difusión continua.", "trait.equil": "Los productos equilibrantes completan la desinfección: correctores de pH, alcalinidad (TAC) y dureza, que se dosifican tras analizar el agua.", "guides.h": "Guías de uso", "guides.lead": "Los gestos que mantienen el agua sana y el equipo en forma, paso a paso.", "g.chlore.h": "Mantenimiento de una piscina de cloro", "g.chlore.i": "El cloro elimina bacterias, hongos y algas. En polvo o gránulos para disolver, o en tabletas en el skimmer para una acción lenta.", "g.chlore.s": ["Material: tiras reactivas, medidor electrónico o regulador automático de cloro", "Cada semana, nivel de agua entre la mitad y los 3/4 del skimmer", "Recogehojas, línea de agua, fondo (barredera o robot), cesta del skimmer", "Cesta de la bomba que vaciar si hace falta; manómetro alto = filtro saturado: lavado y después enjuague", "pH ideal de 7,2 a 7,4: por encima de 7,6, pH Menos; por debajo de 7, pH Más", "Cloro entre 1 y 3 mg/l: si es demasiado alto, neutralice o deje evaporar; si es demasiado bajo, añada cloro", "Ajuste el pH antes de medir el cloro: un pH alto vuelve ineficaz el cloro", "Alcalinidad (TAC) por encima de 10 °f; si es demasiado baja, corrector de bicarbonato de sodio"], "g.sel.h": "Mantenimiento de una piscina de sal", "g.sel.i": "El electrolizador transforma la sal en cloro activo natural: desinfección continua, sin olor. Hay que cuidar los análisis, el pH y el nivel de sal.", "g.sel.s": ["Material: tiras reactivas, sal para piscina, electrolizador, bomba dosificadora de pH", "Nivel de agua, recogehojas, línea de agua, fondo y skimmer cada semana", "Electrodos: autolimpieza, y limpieza manual cada 6 meses si el agua es dura; apague el electrolizador en invierno", "Bomba dosificadora de pH: calibre la sonda al comienzo de cada temporada", "Nivel de sal entre 3 y 7 g/l según el volumen y el aparato", "pH entre 7,2 y 7,4; alcalinidad (TAC) por encima de 10 °f"], "g.filtre.h": "Mantenimiento del filtro de arena", "g.filtre.i": "El filtro retiene las impurezas. En plena temporada, límpielo cada 1 o 2 semanas. No toque nunca la válvula de 6 vías con la bomba en marcha.", "g.filtre.s": ["Prefiltro: bomba parada, válvulas del skimmer y de la toma de barredera cerradas, tapa desenroscada, cesta vaciada y enjuagada, y todo en su sitio", "Lavado: válvula en «lavado», bomba en marcha hasta que el agua salga clara, y parada", "Enjuague: válvula en «enjuague», 1 a 2 minutos, y parada", "Válvula en «filtración», puesta en marcha", "Desincrustación una vez al año (dos si el agua es muy calcárea)"], "g.ph.h": "Calibración de una sonda de pH", "g.ph.i": "Al comienzo de cada temporada y tras cualquier cambio de sonda. Necesita las soluciones patrón de pH 7 y pH 10, a la venta en nuestras agencias de Saint-Maximin y Aubagne.", "g.ph.s": ["Desenrosque la sonda y tape el orificio con el tapón suministrado", "Aparato con tecla CAL: 3 s en CAL, sonda en el pH 7, CAL; el piloto 7.0 se queda fijo al terminar. Piloto LOW encendido: sonda gastada", "Aparato con menú: 3 s en V, código CA, sonda en el pH 7, 2 min, V; espere «Oh»", "Enjuague sin secar, sonda en el pH 10, 2 min, V; espere «Oh»", "«Er» en pantalla: la sonda está al final de su vida útil, hay que sustituirla", "Retire el tapón y vuelva a colocar la sonda"], "g.hivchlore.h": "Invernada de una piscina de cloro", "g.hivchlore.i": "Aconsejamos la invernada activa: filtración de 1 a 3 h al día entre las 4 y las 6 de la mañana, cuando hiela. El agua circula y los equipos no se congelan.", "g.hivchlore.s": ["Limpie vaso, línea de agua y filtro (lavado, enjuague, desincrustación)", "Espere a que el agua esté de forma duradera por debajo de 15 °C", "pH entre 7,2 y 7,4; tratamiento choque si hace falta y 24 h de filtración", "Producto de invernada, 4 h de filtración", "Tiempo de filtración = temperatura del agua ÷ 3", "Cubierta opcional; controle el agua de vez en cuando", "Invierno muy duro: pare y purgue filtro y bomba", "Puesta en marcha hacia marzo-abril, cuando el agua vuelva a superar los 12 °C"], "g.hivsel.h": "Invernada de una piscina de sal", "g.hivsel.i": "El mismo principio activo, con algunos gestos para proteger el electrolizador y la sonda de pH.", "g.hivsel.s": ["Limpie vaso, línea de agua y filtro (lavado, enjuague, desincrustación)", "Solo por debajo de 15 °C, pare la electrólisis (si no, las placas se desgastan) dejando la filtración", "Producto de invernada de 2 a 3 h; pH entre 7,2 y 7,4", "Sonda de pH resguardada de la helada en agua del grifo, tapón en la tubería", "Enjuague el tubo de la bomba peristáltica; bidón de agua en lugar del corrector, función «MA»", "Filtración por la noche entre las 4 y las 6; cubierta o persiana; pH controlado una vez al mes", "Si se anuncia mucho frío: apague todo, vacíe bomba y filtro, botella Guizmo en el skimmer", "Puesta en marcha cuando el agua vuelva a superar los 15 °C"], "acc.h": "Accesorios para piscina", "acc.lead": "Tratamiento (cloro, sal, bromo), cubiertas, persianas: usted elige sus opciones con nuestros comerciales, y todo está en nuestras agencias.", "acc.mx9": "Robot hidráulico Zodiac MX9: conectado a la toma de barredera, usa la bomba para avanzar. Cepillado ciclónico, turboaspiración, navegación X-Drive, orugas dentadas.", "acc.dolphin": "Robot eléctrico Dolphin S300: para vasos grandes. Ciclo completo en 2 h o rápido en 1 h; fondo, paredes y línea de agua; cepillo activo y filtración multicapa.", "acc.pac": "Bomba de calor reversible: la forma más eficaz y económica de calentar o de enfriar. Intercambiador de titanio con 5 años de garantía, compatible con sal. Instalación por nuestros equipos, presupuesto gratuito.", "acc.electro": "Electrolizador de sal: transforma la sal en cloro natural, sin olor y más suave. Debe completarse con una regulación de pH.", "acc.ph": "Bomba dosificadora de pH: sonda en continuo, pH mantenido entre 7,2 y 7,4. Sonda que calibrar al comienzo de cada temporada.", "acc.nage": "Nado a contracorriente: nade sin moverse del sitio, incluso en un vaso pequeño, y disfrute de masajes. Compatible con nuestras piscinas de madera y de hormigón.", "acc.bache": "Cubierta de invierno francesa: PVC de 550 g reforzado, antiUV y antibacteriana, ojales dobles, evacuación del agua de lluvia. 5 colores.", "acc.bulle": "Cubierta de burbujas a medida: 400 micras, antiUV, con ribete en los 4 lados. Unos grados más y menos residuos.", "acc.fontaine": "Fuente de inox.", "sec.h": "Seguridad de la piscina", "sec.lead": "Desde el 1 de enero de 2004, toda piscina privada nueva debe tener un dispositivo de seguridad; las ya existentes, desde el 1 de enero de 2006 (ley del 3 de enero de 2003).", "sec.barriere": "Valla de protección, NF P90-306: más de 110 cm, puerta con doble cierre. La nuestra: malla transparente antiUV de 1,22 m, tramos de 1 a 6 m, 5 colores.", "sec.alarme": "Alarma, NF P90-307-1: sumergida (detecta una caída, sirena integrada) o perimetral (4 postes infrarrojos).", "sec.bache": "Cubierta, NF P90-308: la cubierta de barras, antiUV y fungicida, protege todo el año y conserva el calor.", "sec.volet": "Persiana enrollable sobre el suelo o sumergida: seguridad, menos evaporación, menos pérdidas de calor y de productos. Instalación por nuestros equipos.", "sec.abri": "Cubierta alta, NF P90-309: plana, corredera o desmontable, cubre todo el vaso.", "realp.h": "Nuestras realizaciones", "realp.lead": "Madera, aluminio, poliéster, hormigón, instalaciones exteriores: 72 obras en el Var, Bouches-du-Rhône y toda la región.", "realp.f.bois": "Piscina de madera", "realp.f.alu": "Piscina de aluminio", "realp.f.coque": "Piscina de poliéster", "realp.f.beton": "Piscina de hormigón", "realp.f.amen": "Instalaciones exteriores", "about.h": "Quiénes somos", "about.lead": "Florent Fondère trabaja en el mundo de la piscina desde los 18 años. Eligió la madera por su naturalidad y su elegancia.", "about.p1": "En 2016 registra una patente: conservar la belleza de la madera sin ceder en nada en la técnica. Así nacen nuestras piscinas a medida, y el kit fabricado en nuestro taller para los aficionados al bricolaje.", "about.p2": "Estructura de pino autoclave clase IV, impregnado en toda su albura: más duradero que una madera tratada por aspersión o inmersión. Revestimientos de ipé o padouk. Y después una versión de aluminio, bruto, RAL 8008 o con veteado de madera.", "about.p3": "El éxito permitió abrir una segunda agencia en Aubagne, para Bouches-du-Rhône. Cada una tiene su rincón de tienda.", "about.p4": "Cuatro conceptos: poliéster, madera a medida, aluminio a medida, hormigón tradicional. Nuestro equipo lo hace todo: excavación, losa, estructura, liner, filtración, y le explica el funcionamiento cuando se llena la piscina.", "about.equip": "Bombas de calor, electrolizadores, bombas de pH, alarmas, vallas, cubiertas, persianas, robots, productos de mantenimiento para la piscina y la terraza.", "about.social": "Siga nuestras obras en Facebook e Instagram.", "tutos.h": "Tutoriales en vídeo", "tutos.lead": "Montaje del kit, cubierta, reloj, bomba de calor, electrolizador, sonda de pH, robot: nuestros vídeos paso a paso.", "tutos.alu": "Kit de aluminio premium", "tutos.kit": "Kit de madera", "tutos.util": "Uso", "tuto.alu1": "N.º 1 — Colocación de los ángulos", "tuto.alu2": "N.º 2 — Montaje de los UPN", "tuto.alu3": "N.º 3 — Fijación del tubo de aluminio", "tuto.alu4": "N.º 4 — Encaje de los tablones", "tuto.alu5": "N.º 5 — Colocación del skimmer", "tuto.alu6": "N.º 6 — Instalación del raíl", "tuto.alu7": "N.º 7 — Instalación de las viguetas de aluminio", "tuto.alu8": "N.º 8 — Montaje del banco bajo el liner", "tuto.alu9": "N.º 9 — Montaje del banco con escalones", "tuto.kit1": "N.º 1 — Instalación del skimmer", "tuto.kit2": "N.º 2 — Boquilla de impulsión y toma de barredera", "tuto.kit3": "N.º 3 — Opción de foco", "tuto.kit4": "N.º 4 — Preparar la instalación del liner", "tuto.kit5": "N.º 5 — Colocación del liner", "tuto.kit6": "N.º 6 — Banco o playa bajo el liner", "tuto.u1": "Desenrollar una cubierta de barras", "tuto.u2": "Enrollar una cubierta de barras", "tuto.u3": "Funcionamiento del reloj", "tuto.u4": "Encender y apagar una bomba de calor", "tuto.u5": "Puesta en marcha del electrolizador de sal", "tuto.u6": "Calibración de la sonda de pH", "tuto.u7": "Lavado del filtro", "tuto.u8": "Utilizar el robot hidráulico MX9", "faq.h": "Preguntas frecuentes", "faq.legal": "Trámites", "faq.hiver": "Invernada", "faq.eau": "Problemas del agua", "faq.mat": "Accesorios y material", "faq.items": [["legal", "¿Hace falta un permiso de obra?", "Solo para una piscina de más de 100 m²."], ["legal", "¿Mi piscina tributa?", "Cuenta como una dependencia: taxe d'habitation. La taxe foncière se aplica a las piscinas enterradas (hormigón, madera, poliéster); solo las desmontables sobre el suelo están exentas."], ["legal", "¿Hay que avisar al ayuntamiento?", "Hasta 10 m², ninguna declaración. Por encima, una declaración al servicio de urbanismo."], ["legal", "¿Hacen los planos del permiso?", "No. Su ayuntamiento puede facilitarle una lista de arquitectos (servicio de pago)."], ["hiver", "¿Por qué invernar?", "Para evitar los daños de la helada en las paredes y en la filtración."], ["hiver", "¿Cuándo invernar?", "Cuando el agua se mantiene por debajo de 12 °C (15 °C en una piscina de sal)."], ["hiver", "¿Invernada activa o pasiva?", "Activa en las regiones de inviernos suaves: filtración reducida, tratamiento mantenido. Pasiva en las regiones frías: todo se para."], ["eau", "Agua verde y transparente", "A menudo una alcalinidad (TAC) demasiado baja y algas: ajuste el pH, añada TAC+, clore y use un alguicida."], ["eau", "Agua verde y turbia", "Algas (agua caliente, cloro insuficiente, pH desequilibrado, TH alto, TAC bajo): analice, cloración choque, alguicida, floculante."], ["eau", "Agua verde espinaca", "Las algas proliferan: cloración choque, alguicida, floculante."], ["eau", "Agua verde o amarilla", "Agua demasiado ácida, pH demasiado bajo: añada pH+."], ["eau", "Agua azul verdosa", "Cobre descompuesto (productos cúpricos o hidrato de hierro, que conviene evitar): añada agua nueva y reequilibre."], ["eau", "Agua amarilla o marrón oscuro", "Vegetales en descomposición (cloración choque, floculante) o metales como hierro y manganeso (secuestrante de metales)."], ["eau", "Agua turbia, paredes rugosas", "Demasiada cal: tratamiento anticalcáreo."], ["eau", "Agua lechosa", "Cal, variación de pH, algas muertas… Analice, tratamiento choque, floculante si hace falta."], ["eau", "Agua blanquecina", "Sales calcáreas en descomposición: floculante."], ["eau", "Depósito blanquecino en el fondo", "Sarro: compruebe y corrija la dureza del agua."], ["eau", "Fondo y paredes resbaladizos", "Principio de algas: equilibre el agua, baje el pH si hace falta, cloración, alguicida."], ["eau", "Residuos grasos en la superficie", "Cremas y aceites solares: coloque paños absorbentes en el skimmer."], ["eau", "Borde negro en el liner", "Suciedad acumulada en la línea de agua: limpiador de línea de agua (esponja mágica, gel)."], ["eau", "Manchas rojizo-marrones en el liner", "Partículas minerales o metálicas, cal: compruebe el pH, secuestrante de metales."], ["eau", "Manchas blancas en el liner", "Demasiados productos clorados: el liner está dañado, es irreversible."], ["mat", "Mi robot se decolora", "Estuvo demasiado tiempo en el agua o al sol: los productos y los UV deterioran el equipo."], ["mat", "Mi robot MX9 ya no avanza", "Compruebe la aspiración de la toma de barredera (filtro que lavar), el estado de las mangueras y de las orugas, piezas de desgaste."], ["mat", "El manómetro del filtro está en rojo", "La arena está compactada: lavados y enjuagues poco frecuentes."], ["mat", "Arena en la piscina", "Viento, colectores gastados, demasiada o muy poca arena, cal o algas adheridas, bomba demasiado potente. El floculante ayuda a retener la arena."], ["mat", "Pequeñas descargas en el agua", "El electrolizador y el regulador de pH producen una corriente débil: instale una toma de tierra para la piscina (puesta a tierra)."], ["mat", "Mi escalera se oxida", "Inox de mala calidad, o electrolizador de sal sin evacuación de las corrientes a tierra."], ["mat", "Mi foco se llena de agua", "A menudo nos apoyamos en él y se mueve; rara vez, un defecto de origen. Hágalo revisar."], ["mat", "Caudal de boquilla débil", "Lave y enjuague el filtro; una piscina muy grande puede carecer de boquillas."], ["mat", "Mi liner hace arrugas", "Cloro demasiado alto, pH demasiado ácido o agua demasiado caliente: el liner se vuelve poroso y se afloja."]], "contact.h": "Hablemos de su piscina", "contact.lead": "Unas pocas respuestas, y su solicitud llega directamente a la agencia adecuada. Un comercial le devolverá la llamada.", "f.type": "¿Qué piscina?", "f.type.ns": "Aún no lo sé", "f.pose": "¿Qué instalación?", "f.pose.hs": "Sobre el suelo", "f.pose.se": "Semienterrada", "f.pose.en": "Enterrada", "f.terrain": "Su terreno", "f.dim": "Dimensiones deseadas (opcional)", "f.dim.ph": "por ejemplo 8 × 4 m", "f.nom": "Nombre", "f.email": "Correo electrónico", "f.tel": "Teléfono", "f.dep": "Departamento", "f.ville": "Ciudad", "f.connu": "¿Cómo nos conoció?", "f.connu.o": ["Boca a boca", "Feria o salón", "Redes sociales", "Anuncio en prensa", "Páginas Amarillas", "Cartel publicitario", "Otro"], "f.msg": "Su mensaje", "f.send": "Enviar mi solicitud", "f.route83": "Su solicitud irá a la agencia de Saint-Maximin.", "f.route13": "Su solicitud irá a la agencia de Aubagne.", "f.ok": "¡Gracias! En la versión en línea, su solicitud se enviará a {agence}. Aquí es una maqueta: no se envía nada.", "f.err": "Faltan su nombre y un correo electrónico o un teléfono para poder llamarle.", "f.projet": "Añadido desde «Mi proyecto»:", "mine.h": "Mi proyecto", "mine.empty": "Todavía nada. Añada una piscina, una opción o una instalación desde las páginas.", "mine.add": "Añadir a mi proyecto", "mine.added": "Añadido", "mine.go": "Solicitar presupuesto con este proyecto", "mentions.h": "Aviso legal", "mentions.p": "LA PISCINE BOIS / LPB PISCINES, fabricante e instalador de piscinas de madera. LPB La Piscine Bois, RCS Draguignan 752 316 687. Sede: Parc d'activité d'Aix, 340 avenue de la Maximinoise, 83470 Saint-Maximin-la-Sainte-Baume. Gerente: Florent Fondère. Los contenidos del sitio son propiedad de LA PISCINE BOIS; toda reproducción sin autorización está prohibida (art. L122-4 del Código francés de la propiedad intelectual). El texto completo del aviso legal y de la política de privacidad de su sitio actual se recuperará en la instalación.", "conf.h": "Política de privacidad", "conf.p": "Los datos introducidos en el formulario sirven únicamente para responder a su solicitud y nunca se revenden. El texto completo de su política actual se recuperará en la instalación.", "foot.tag": "Fabricante e instalador de piscinas de madera, aluminio, poliéster y hormigón, desde hace más de 20 años.", "foot.maquette": "Propuesta de rediseño realizada por Neovera Studio — maqueta sin valor contractual.", "bot.name": "LPB Conseil", "bot.sub": "Le ayudo a elegir", "bot.virtual": "Asistente virtual", "bot.hello": "¡Hola! Soy el asistente virtual de LPB Piscines. Terreno, tipo de piscina, mantenimiento, agencias: haga su pregunta.", "bot.invite": "¿Una pregunta sobre su terreno o su futura piscina?", "bot.ph": "Escriba su pregunta…", "bot.send": "Enviar", "bot.chips": ["Mi terreno está en pendiente", "¿Madera, aluminio, poliéster u hormigón?", "¿Para quién es el kit?", "Agua verde", "Horarios de las agencias", "Solicitar presupuesto"], "bot.unknown": "No estoy seguro de poder responder bien a eso. Lo más sencillo: llame a Saint-Maximin al 04 89 67 80 90 o a Aubagne al 04 42 36 71 36, o deje su solicitud en el formulario.", "bot.a.pente": "En un terreno en pendiente o con terrazas de piedra, solemos instalar una piscina de madera semienterrada: menos excavación y una estructura de madera y acero patentada que soporta el empuje de la tierra.", "bot.a.choix": "Madera: nuestro procedimiento patentado, a medida, en todos los terrenos. Aluminio: el mismo concepto, muy duradero. Poliéster: instalación rápida, 10 años de garantía. Hormigón: la tradición, hasta el desbordamiento. El kit: para instalar usted mismo.", "bot.a.kit": "El kit es nuestra piscina de madera patentada, fabricada en nuestro taller, para los aficionados al bricolaje: pocas piezas, tutoriales en vídeo, para instalar sobre una losa de hormigón. Pedidos en lapiscinekit.com.", "bot.a.vert": "Agua verde: a menudo son algas. Analice el agua, haga una cloración choque y después alguicida y floculante. Si es verde y transparente, compruebe primero la alcalinidad (TAC).", "bot.a.horaires": "Saint-Maximin: de lunes a sábado, de 9:30 a 12:30 y de 13:30 a 17:30. Aubagne: de martes a viernes de 13:00 a 17:00, sábados de 10:00 a 12:00 y de 13:00 a 18:00.", "bot.a.devis": "El formulario de presupuesto le hace unas preguntas (piscina, instalación, terreno) y envía su solicitud a la agencia adecuada.", "bot.a.prix": "No publicamos precios: cada piscina se hace a medida. Un presupuesto gratuito se solicita en dos minutos.", "bot.a.coque": "Tres vasos Cosmos: Mercure (4,30 × 2,27 m), Vénus (3 m de ancho, de 5 a 7 m) y Saturne (4 m de ancho, de 7 a 9 m). Colores blanco, arena, gris claro, azul pálido.", "bot.a.hiver": "Inverne cuando el agua se mantenga por debajo de 12 °C (15 °C con sal). Aconsejamos la invernada activa: filtración por la noche entre las 4 y las 6.", "bot.a.securite": "La ley exige un dispositivo homologado: valla, alarma, cubierta o cubierta alta. Instalamos vallas, alarmas, cubiertas de barras y persianas.", "bot.a.spa": "Nuestro spa es de madera en autoclave clase IV, con banco, boquillas, foco, membrana armada Mármol blanco, Piedra de Java o Efecto Bali, y albardillas de IPE.", "bot.a.zone": "Trabajamos en toda la región PACA, con dos agencias: Saint-Maximin (Var) y Aubagne (Bouches-du-Rhône).", "bot.a.terrasse": "Terrazas de IPE o de pino autoclave clase 4, a medida, sobre soportes regulables: se adaptan a todas las piscinas.", "bot.a.mairie": "Hasta 10 m²: ningún trámite. Por encima: declaración en el ayuntamiento. Permiso de obra a partir de 100 m².", "bot.a.pac": "La bomba de calor reversible calienta o enfría el agua; intercambiador de titanio con 5 años de garantía, compatible con sal. La instalamos nosotros.", "bot.a.liner": "Liners franceses a medida: blanco, azul Francia, azul pálido, grafito, gris claro, gris oscuro, negro granito, arena, verde Antillas, verde oliva y PVC armado.", "trust.avis": "16 reseñas de Google publicadas", "bot.a.garantie": "Los vasos Cosmos tienen 10 años de garantía (norma MATIP). El intercambiador de titanio de nuestras bombas de calor tiene 5 años de garantía contra la corrosión. Para lo demás, nuestras agencias le detallan las garantías en el presupuesto.", "bot.a.duree": "Nuestro pino está tratado en autoclave hasta el corazón (clase 4), mucho más duradero que una madera tratada en superficie; el aluminio dura varias décadas. La duración exacta depende del mantenimiento: nuestras agencias se lo precisarán.", "bot.a.livraison": "Instalamos en toda la región PACA. Para un kit entregado más lejos, la viabilidad se consulta con nuestras agencias: lo más sencillo es dejar su solicitud."}, "de": {"meta.title": "LPB Piscines – Holz-, Alu-, Schalen- und Betonpools im Var und in den Bouches-du-Rhône", "ui.skip": "Zum Inhalt springen", "ui.lang": "Sprache", "ui.devis": "Angebot anfragen", "ui.esquisse": "Projekt skizzieren", "ui.call": "Anrufen", "ui.back": "Zurück", "ui.more": "Zur Seite", "ui.all": "Alle", "ui.close": "Schließen", "ui.watch": "Video ansehen", "ui.video_soon": "Video auf Ihrer aktuellen Website sichtbar, wird bei der Installation übernommen.", "ui.dl": "PDF-Version in der Agentur erhältlich", "ui.see_all_real": "Alle 72 Projekte ansehen", "ui.next": "Weiter", "ui.mine": "Mein Projekt", "nav.piscines": "Pools", "nav.bois": "Holzpool", "nav.kit": "Pool-Bausatz", "nav.alu": "Alupool", "nav.coque": "Schalenpool", "nav.beton": "Betonpool", "nav.amenagement": "Gestaltung", "nav.amenagement_ext": "Außenanlagen", "nav.terrasse": "Terrassen und Dielen", "nav.spa": "Spa", "nav.entretien": "Pflege", "nav.traitement": "Wasserpflege", "nav.guides": "Ratgeber", "nav.accessoires": "Zubehör", "nav.securite": "Sicherheit", "nav.realisations": "Projekte", "nav.apropos": "Über uns", "nav.contact": "Kontakt", "nav.tutos": "Video-Tutorials", "nav.faq": "FAQ", "nav.presse": "Presse", "nav.kitshop": "Bausatz bestellen", "nav.mentions": "Impressum", "nav.confidentialite": "Datenschutz", "nav.conseil": "LPB Conseil", "top.agences": "Saint-Maximin 04 89 67 80 90 · Aubagne 04 42 36 71 36", "home.h1": "Der Holzpool, der auf jedem Gelände steht.", "home.lead": "Hang, Terrassenhänge, Fels, Lehm: Unsere Holz-Stahl-Konstruktion, 2016 patentiert, steht dort, wo andere aufgeben. Von unseren Teams gebaut und montiert, im Var und in den Bouches-du-Rhône, seit über 20 Jahren.", "home.facts": "6 Departements · 2 Filialen · 1.284 Pools und Terrassen gebaut", "home.stamp": "Patent 2016 · Holz + Stahl", "home.belt": "Stahlgurt UPN 220 mm, nach dem Einbau unsichtbar", "brevet.h": "Warum sich unsere Holzpools nicht bewegen", "brevet.p1": "Bei den meisten Holzpools halten Stützstreben die Wände. Unter dem Druck von Wasser und Erde geben sie mit der Zeit nach.", "brevet.p2": "Florent Fondère hat etwas anderes entworfen: eine Konstruktion aus Kiefernbohlen, unten von einem Balken getragen und oben von einem Stahlgurt umfasst. Das Becken ist auf ganzer Höhe stabil.", "brevet.l1": "Bohlen aus skandinavischer Kiefer, kesseldruckimprägniert Klasse 4, 4,5 cm stark", "brevet.l2": "Umlaufender Brettschichtholzbalken 16 × 14 cm an der Basis", "brevet.l3": "Stahlgurt UPN 220 mm, unsichtbar", "brevet.l4": "Beckenrandsteine aus Kiefer, 30 cm breit, oder aus Tropenholz", "brevet.no": "Stützstreben: die Lösung, die wir hinter uns gelassen haben", "brevet.cta": "Den Holzpool entdecken", "mat.h": "Fünf Wege zu Ihrem Pool", "mat.bois": "Unser patentiertes Verfahren, nach Maß, oberirdisch, halb eingelassen oder eingegraben.", "mat.kit": "Dasselbe Konzept, in unserer Werkstatt gefertigt, zum Selbstaufbau.", "mat.alu": "Das Konzept in Aluminium: roh oder RAL 8008, leicht und langlebig.", "mat.coque": "Cosmos-Polyesterschalen aus Frankreich, 10 Jahre Garantie.", "mat.beton": "Die Tradition mit Schalungssteinen, bis zum Überlaufbecken.", "terrain.h": "Hang, Terrassen, Fels: wir können das", "terrain.p": "Wählen Sie Ihre Situation. Wir sagen Ihnen, was wir hier üblicherweise bauen.", "terrain.pente": "Am Hang", "terrain.restanque": "Mit Terrassenhängen", "terrain.roche": "Felsig oder lehmig", "terrain.petit": "Wenig Platz, Hof, Dachterrasse", "terrain.plat": "Flach und frei", "terrain.r.pente": "Ein halb eingelassener Holzpool: ein Teil im Boden, ein Teil sichtbar, weniger Erdarbeiten. Bonus: Das Wasser bleibt dank des erhöhten Teils länger sauber.", "terrain.r.restanque": "Unser Verfahren passt sich Terrassenhängen und schwierigen Zufahrten an: Die Konstruktion wird in Teilen geliefert und vor Ort montiert.", "terrain.r.roche": "Holz und Stahl nehmen die Spannungen des Geländes auf. Wir prüfen den Standort (Boden, Sonne, Nachbarschaft), bevor wir oberirdisch oder halb eingelassen wählen.", "terrain.r.petit": "Ein oberirdischer Holz- oder Alupool, ohne große Erdarbeiten, mit einer Terrasse schön in Szene gesetzt.", "terrain.r.plat": "Alles ist möglich: Holz- oder Alupool eingegraben, Polyesterschale in wenigen Tagen gesetzt oder klassischer Beton.", "liner.h": "Die Poolfolie gibt dem Wasser seine Farbe", "liner.p": "Liner aus französischer Fertigung, auf die Maße Ihres Beckens zugeschnitten. Einfarbig, bedruckt oder aus armiertem PVC.", "liner.blanc": "Weiß", "liner.bleu-france": "Frankreichblau", "liner.bleu-pale": "Hellblau", "liner.graphite-melange-gris-noir": "Graphit", "liner.gris-clair": "Hellgrau", "liner.gris-fonce": "Dunkelgrau", "liner.noir-granite": "Granitschwarz", "liner.sable": "Sand", "liner.vert-antille": "Karibikgrün", "liner.vert-olive": "Olivgrün", "real.h": "Pools bei Ihren Nachbarn", "real.p": "Saint-Maximin, Aubagne, La Ciotat, Fréjus, Meyreuil, Bouc-Bel-Air … 72 Baustellen in Bildern.", "amen.h": "Rund ums Becken", "amen.p": "Terrassen aus IPE oder Kiefer, Technikraum, Sommerküche, Carport: Unsere Teams verarbeiten Holz bis ans Ende des Gartens.", "spa.teaser": "Ein Holz-Spa, gebaut wie unsere Pools.", "avis.h": "Das sagen unsere Kunden", "avis.src": "Google-Bewertungen von Ihrer aktuellen Website", "after.h": "Nach dem Bau sind wir weiter da", "after.p": "Pflegeratgeber, Video-Tutorials, FAQ und Shop in unseren beiden Agenturen.", "agences.h": "Zwei Agenturen, ein Ansprechpartner", "agence.stmax": "Agentur Saint-Maximin", "agence.stmax.addr": "Parc d'activité d'Aix, 340 avenue de la Maximinoise, 83470 Saint-Maximin-la-Sainte-Baume", "agence.stmax.h": "Montag bis Samstag, 9.30–12.30 und 13.30–17.30 Uhr", "agence.aubagne": "Agentur Aubagne", "agence.aubagne.addr": "195, chemin de Ceinture, 13400 Aubagne", "agence.aubagne.h": "Dienstag bis Freitag, 13–17 Uhr; Samstag, 10–12 und 13–18 Uhr", "agence.boutique": "Shop-Ecke in beiden Agenturen.", "presse.h": "Im Fernsehen", "presse.p": "Beitrag in 66 Minutes (M6) am 23. April 2023, nach dem Salon Piscine, Spa & Jardin, bei Minute 10:30 des Videos.", "piscines.h": "Unsere Pools", "piscines.p1": "Sie planen ein Projekt? Wir gehen von Ihrem Grundstück, Ihrer Umgebung, den Anforderungen der jeweiligen Poolart und Ihrem Budget aus.", "piscines.p2": "Wir sind Spezialisten für Holzpools mit einem einzigartigen, patentierten System und bauen auch Alu-, Polyesterschalen- und Betonpools. Besuchen Sie uns in Saint-Maximin-la-Sainte-Baume (Var) oder in Aubagne (Bouches-du-Rhône).", "bois.h": "Holzpool nach Maß", "bois.lead": "Oberirdisch, halb eingelassen oder eingegraben, innen oder außen, rechteckig oder frei geformt: Unser patentiertes Modell passt sich allem an.", "bois.p1": "Seit über zwanzig Jahren verkaufen und bauen wir Holzpools nach Maß im Var und in der Provence-Alpes-Côte d'Azur.", "bois.p2": "Die Holz-Stahl-Konstruktion hält das Becken unten wie oben. Sie löst das Problem der Holzpools mit Stützstreben: den Druck von Erde und Wasser auf die Wände.", "bois.inclus": "Im Pool enthalten: Konstruktion, Liner, Scheinwerfer, komplette Filteranlage, Einbauteile und Schaltschrank.", "bois.implant": "Der Standort ist eine Schlüsselentscheidung: Boden, Sonne, Fläche, Nachbarschaft. Wir helfen Ihnen, die richtige Größe und den richtigen Platz zu finden.", "bois.bois.h": "Hochwertiges Holz, ohne Behandlungsaufwand", "bois.bois.p": "Lassen Sie es natürlich vergrauen (einmal im Jahr mit Wasser reinigen) oder tragen Sie ein- bis zweimal jährlich ein Pflegeöl auf, um den Farbton zu erhalten.", "bois.pin": "Skandinavische Kiefer: aus Regionen mit rauem Klima, im Kern kesseldruckimprägniert (Klasse 4), formstabil und im Wasser langlebig.", "bois.ipe": "Ipé: südamerikanisches Tropenholz, sehr dicht, von Natur aus witterungsfest, resistent gegen Schimmel und Termiten.", "bois.liner": "Liner aus französischer Fertigung, passgenau zum Becken: einfarbig, bedruckt oder aus armiertem PVC, für schöne Kontraste bei Tag und bei Nacht.", "bois.hs.h": "Oberirdisch", "bois.hs.p": "Wenig Platz, Hof, Dachterrasse, keine großen Erdarbeiten: schnell aufgebaut und mit einer Terrasse schön in Szene gesetzt.", "bois.se.h": "Halb eingelassen", "bois.se.p": "Hanglage, Terrassenhang oder einfach wegen der Optik: ein Teil im Boden, ein Teil sichtbar. Der erhöhte Teil hält das Wasser länger sauber.", "bois.en.h": "Eingegraben", "bois.en.p": "Sie wertet das Anwesen auf und fügt sich in den Garten ein. Die Konstruktion bleibt unsichtbar; drumherum ist alles möglich: Holz, Stein, Terrasse, Naturrasen oder Kunstrasen.", "kit.h": "Pool-Bausatz", "kit.lead": "Sie sind handwerklich begabt? Unseren patentierten Holzpool gibt es als Komplettbausatz, in unserer Werkstatt gefertigt, bereit zum Aufbau.", "kit.p1": "Nach Maß: Sie wählen Größe und Höhe, quadratisch oder rechteckig, oberirdisch, halb eingelassen oder eingegraben. Er steht auf einer Stahlbetonplatte.", "kit.p2": "Wenige Teile, aber sehr robust: einfacher Aufbau, maximale Stabilität, klare Linien.", "kit.mat.h": "Die Materialien", "kit.mat.1": "Wände aus Kiefernbohlen, kesseldruckimprägniert Klasse 4, 4,5 cm stark", "kit.mat.2": "Umlaufender Brettschichtholzbalken 16 × 14 cm, kesseldruckimprägniert Klasse 4", "kit.mat.3": "Stahlgurt UPN 220 mm, unsichtbar", "kit.mat.4": "Beckenrandsteine aus Kiefer (Tropenholz optional), 4 m × 30 cm, zweiteilig", "kit.liner": "5 Linerfarben: Weiß, Hellblau, Frankreichblau, Hellgrau, Sand. Französische Fertigung, passgenau.", "kit.compo.h": "Das ist im Bausatz enthalten", "kit.compo.1": "Konstruktion: Holz, Stahl, Edelstahlschrauben, Filz, Liner, Beckenrandsteine aus Kiefer", "kit.compo.2": "Filtration und Ausstattung: Filterplatte, 1 Einlaufdüse, 1 Skimmer, 1 Edelstahlleiter, 1 Pflegeset, 1 PVC-Set (12-m-Ring flexibler Schlauch Ø 50, 2-m-Stange Ø 50, Kleber)", "kit.securite": "Sicherheit und Wasserpflege: Alarm, Sicherheitsabdeckungen oder Zäune; Chlor, Salz, Aktivsauerstoff oder Brom.", "kit.options": "Optionen: 2. Einlaufdüse, Saugdüse, Schaltkasten mit LED-Scheinwerfer weiß oder farbig, Material für Sitzbank oder Strand unter dem Liner, Lieferung (Machbarkeit klären wir mit unseren Agenturen).", "kit.shop": "Bestellen auf lapiscinekit.com", "alu.h": "Aluminiumpool nach Maß", "alu.lead": "Unser Holzkonzept war so erfolgreich, dass Florent Fondère es auch in Aluminium umgesetzt hat.", "alu.p1": "Die Teile werden eigens für uns nach Maß gefertigt. Die Verkleidungsbohlen sind aus rohem Aluminium, in RAL 8008 lackiert oder mit Holzmaserung veredelt.", "alu.p2": "Ein Material für Jahrzehnte: leicht, einfach zu transportieren, flexibel und mechanisch belastbarer als Holz. Winkelprofile aus verzinktem Stahl.", "alu.inclus": "Im Pool enthalten: Konstruktion, Liner, Scheinwerfer, komplette Filteranlage, Einbauteile und Schaltkasten.", "coque.h": "Polyester-Schalenpool", "coque.lead": "Cosmos-Piscines-Schalen, in Frankreich entwickelt und gefertigt, 10 Jahre Garantie, konform zur Norm MATIP.", "coque.p1": "Im Werk geformt, wird die Schale nach den Erdarbeiten in Ihren Garten geliefert: keine großen Maurerarbeiten. Das glatte Gelcoat lässt sich leicht pflegen.", "coque.p2": "Fast senkrechte Wände für mehr Volumen, Sitzbank über die ganze Breite und sanfter Einstieg. Mit allen Wasserpflegesystemen kompatibel, sehr gutes Preis-Leistungs-Verhältnis.", "coque.mercure": "Mercure – die kleinste: 4,30 × 2,27 m, Tiefe 1,39 m, 3 Stufen an der Breitseite.", "coque.venus": "Vénus – mittlere Größe: 3 m breit, 5, 6 oder 7 m lang, Höhe 1,48 m.", "coque.saturne": "Saturne – großes Becken: 4 m breit, 7, 8 oder 9 m lang, Tiefe 1,50 m. Ideal zum Schwimmen.", "coque.coloris": "Farben: Weiß, Sand, Hellgrau, Hellblau.", "coque.eq.h": "Ausstattung", "coque.eq": "Klassischer oder filternder Skimmer je nach Modell · abnehmbare Saugdüse · LED-Scheinwerfer · Sicherheitsablauf · schwenkbare Einlaufdüsen · Bausatzvariante", "coque.ent.h": "Pflegezubehör", "coque.ent": "Bodensauger und Schwimmschlauch · Teleskopstange · Oberflächenkescher · Wandbürste · Analyse-Set · PVC-Set", "coque.fil.h": "Filtration", "coque.fil": "1 Sandfilter mit 6-Wege-Ventil · 1 Filterpumpe · 1 Schaltkasten", "beton.h": "Klassischer Betonpool", "beton.lead": "Der Pool aus Schalungssteinen: solide, dicht, langlebig und unendlich individuell.", "beton.formes": "Oberirdisch, halb eingelassen, eingegraben oder als Überlaufbecken. Länge, Breite, Tiefe und Form legen wir gemeinsam mit Ihnen fest, passend zum Gelände.", "beton.p1": "Strand, Treppen, Leiter, Wärmepumpe, Gegenstromanlage; Chlor oder Salzelektrolyse; Beckenrand aus Holz, Travertin oder Kunststein, Terrasse.", "beton.p2": "Von den Erdarbeiten bis zum Finish machen wir alles selbst. Kein anderer Handwerker auf unseren Baustellen: ein Ansprechpartner, eine schnelle und saubere Baustelle.", "beton.opt.h": "Optionen", "beton.opt": "Rollladenabdeckung · Plane · Alarm · Wärmepumpe · Salzelektrolyse + pH-Dosierpumpe · Zäune und Geländer · Gegenstromanlage · Poolroboter", "beton.eq.h": "Bei jedem Pool dabei", "beton.eq": "Spiegel-Skimmer (Wasserlinie ganz oben) · Liner aus französischer Fertigung, mehrere Farben · Einlaufdüse · Saugdüse · LED-Scheinwerfer · Hayward-Sandfilter · Espa-Silver-Pumpe · Schaltkasten · Pflegeset (Thermometer, Analyse-Set, Teleskopstange, Bürste)", "beton.proc.h": "So bauen wir ihn", "beton.proc.0": "Bei Bedarf arbeiten wir mit einem auf Beton spezialisierten Ingenieurbüro.", "beton.proc.1": "Die Bodenplatte: 20 cm stark, mit 2 Baustahlmatten im Abstand von 10 cm, umfasst von einem Ringanker.", "beton.proc.2": "Die Schalung: Schalungssteine 25 cm, normgerecht, mit der Betonpumpe verfüllt und mit Stahlstäben 8 verstärkt. Etwa 20 Tage Trocknung.", "beton.proc.3": "Das Finish: ein Putz auf den Wänden.", "beton.proc.4": "Der Liner: Premiumqualität, französische Fertigung, nach Maß, gegen Hitze und Flecken behandelt. Einfarbig, bedruckt oder aus armiertem PVC.", "amen.page.h": "Poolgestaltung", "amen.page.p": "Terrasse mit Geländer oder Sichtschutz, Technikraum für die Filteranlage, Carport, Sommerküche, Gartenhaus: praktische und schöne Lösungen für Ihre Außenbereiche.", "amen.list": "Holzterrasse · Technikraum · Geländer und Handlauf · Gartenhaus und Unterstand · Sichtschutz · Pergolen · Schiebeboden · Sommerküche", "amen.marg.h": "Beckenrandsteine", "amen.marg.bois": "Aus Holz: Kiefer für einen modernen, rustikalen Touch, Ipé für die Eleganz des Exotischen.", "amen.marg.pierre": "Aus Kunststein: aus Zuschlägen natürlicher Steine gefertigt.", "amen.marg.trav": "Aus Travertin: natürliches Sedimentgestein aus Kalk.", "terr.h": "Terrassen und Dielen aus Holz", "terr.lead": "Ihr Strand in der Sonne, am Abend eine beleuchtete Palme: Wir führen die Terrasse bis ans Wasser.", "terr.p1": "Aus IPE oder Kiefer kesseldruckimprägniert Klasse 4: Unsere Dielen sind für Pools gemacht, pflegeleicht und beständig gegen Sonne, Wetter und behandeltes Wasser.", "terr.p2": "Nach Maß, für jedes Gelände und jeden Pool (Polyester, Stahlblech, Holz …). Unterkonstruktion 15 cm auf verstellbaren Fußplatten, alle Quadratmeter; der Boden kann in beliebiger Höhe schweben.", "terr.ipe": "IPE: südamerikanisches Tropenholz, das dichteste überhaupt (weit über Teak, Cumaru oder Massaranduba). Gerade Faser, astfrei, von Natur aus witterungsfest. Keine Behandlung nötig.", "terr.pin": "Kiefer kesseldruckimprägniert Klasse 4: trocken- und kältebeständig, so robust wie IPE, etwas astiger und heller. Perfekt in einem Garten mit Bäumen.", "terr.ent": "Pflege: vergrauen lassen (einmal im Jahr mit Wasser reinigen) oder ein- bis zweimal jährlich ein Pflegeöl auftragen.", "terr.vivant": "Holz ist ein lebendiges Material: Äste, natürliche Risse und UV-bedingtes Vergrauen mindern seine Qualität in keiner Weise.", "spa.h": "Das LPB-Holz-Spa", "spa.lead": "Entspannung und Erholung, im selben Holz wie unsere Pools.", "spa.p1": "Wir bauen Ihr Spa aus kesseldruckimprägniertem Holz Klasse IV: gesellige Sitzbank, mehrere Düsen, Skimmer, Scheinwerfer für den Abend.", "spa.p2": "Innen eine armierte Folie (3D-armiertes PVC) nach Wahl: Marmor weiß, Java-Stein oder Bali-Optik. Beckenrand aus IPE.", "ent.h": "Poolpflege", "ent.lead": "Eine einfache Routine genügt für klares, gesundes Wasser.", "ent.day.h": "Jeden Tag", "ent.day": ["Blätter und Insekten mit dem Kescher entfernen", "Skimmerkorb leeren", "Wasser testen und bei Bedarf korrigieren: pH, Alkalinität (TA), Härte (TH), Chlor"], "ent.week.h": "Jede Woche", "ent.week": ["Wasserstand auf 2/3 der Skimmerhöhe (zu niedrig: Luft wird angesaugt, die Pumpe nimmt Schaden; zu hoch: Schmutz wird schlecht abgesaugt)", "Düsenstrahl beobachten: ein schwacher Strahl kann auf einen verschmutzten Filter oder eine verschmutzte Pumpe hinweisen", "Kescher, Boden mit Bodensauger oder Roboter, Wasserlinie mit Zauberschwamm oder Gel", "Skimmerkorb leeren und Wasser testen", "Filter rückspülen, dann nachspülen (1 bis 2 Min.) und die Filterung wieder starten"], "ent.astuce": "Tipp: Halten Sie beim Rückspülen einen Finger hinter das Schauglas (das kleine Rohr unter dem 6-Wege-Ventil). Sobald Sie Ihren Finger wieder sehen und das Wasser klar ist, stoppen Sie.", "trait.h": "Wasserpflege", "trait.lead": "Desinfizieren, ausgleichen: die Produktfamilien, die das Wasser sauber halten.", "trait.chlore": "Chlor: einfach und günstig, kann aber empfindliche Haut reizen, und der Geruch stört. Als Tabs oder Pastillen: langsam lösend, Schock (bei Algen) oder Multifunktion (Desinfektion, Flockung, Stabilisator).", "trait.sel": "Salz: Der Elektrolyseur erzeugt natürliches, nicht stabilisiertes Chlor, ohne Geruch und Reizung. Es baut sich unter UV schnell ab: eine Grundbehandlung, bei Bedarf mit Chlorschock zu ergänzen.", "trait.oxy": "Aktivsauerstoff: desinfiziert, oxidiert und wirkt gegen Algen, geruchlos und mild. Teurer, empfindlich gegen Temperatur und pH, wirkt nur kurz. Meist flüssig.", "trait.brome": "Brom: als Pastillen, langsam lösend oder Schock. Geruchlos, nicht reizend, dreifach wirksam. Teurer; für eine kontinuierliche Abgabe braucht es einen Bromdosierer.", "trait.equil": "Ausgleichsprodukte ergänzen die Desinfektion: Korrekturmittel für pH, Alkalinität und Härte, nach der Wasseranalyse zu dosieren.", "guides.h": "Anwendungsratgeber", "guides.lead": "Die Handgriffe für gesundes Wasser und fitte Technik, Schritt für Schritt.", "g.chlore.h": "Pflege eines Chlorpools", "g.chlore.i": "Chlor beseitigt Bakterien, Pilze und Algen. Als Pulver oder Granulat zum Auflösen, oder als Tabs im Skimmer für langsame Wirkung.", "g.chlore.s": ["Material: Teststreifen, elektronisches Testgerät oder automatische Chlorregelung", "Jede Woche: Wasserstand zwischen der Hälfte und 3/4 des Skimmers", "Kescher, Wasserlinie, Boden (Sauger oder Roboter), Skimmerkorb", "Pumpenkorb bei Bedarf leeren; Manometer hoch = Filter gesättigt: rückspülen, dann nachspülen", "Ideal-pH 7,2 bis 7,4: über 7,6 pH-Minus; unter 7 pH-Plus", "Chlor zwischen 1 und 3 mg/l: zu hoch, neutralisieren oder verdunsten lassen; zu niedrig, Chlor zugeben", "Erst den pH einstellen, dann das Chlor messen: ein hoher pH macht Chlor unwirksam", "Alkalinität über 10 °f; zu niedrig, Korrekturmittel mit Natriumbicarbonat"], "g.sel.h": "Pflege eines Salzwasserpools", "g.sel.i": "Der Elektrolyseur verwandelt Salz in aktives, natürliches Chlor: dauerhafte Desinfektion, ohne Geruch. Wichtig: Analysen, pH und Salzgehalt.", "g.sel.s": ["Material: Teststreifen, Poolsalz, Elektrolyseur, pH-Dosierpumpe", "Wasserstand, Kescher, Wasserlinie, Boden und Skimmer jede Woche", "Elektroden: Selbstreinigung, bei hartem Wasser zusätzlich alle 6 Monate von Hand; im Winter Elektrolyseur abschalten", "pH-Dosierpumpe: Sonde zu Saisonbeginn kalibrieren", "Salzgehalt zwischen 3 und 7 g/l, je nach Volumen und Gerät", "pH zwischen 7,2 und 7,4; Alkalinität über 10 °f"], "g.filtre.h": "Pflege des Sandfilters", "g.filtre.i": "Der Filter hält Schmutz zurück. In der Hochsaison alle 1 bis 2 Wochen reinigen. Das 6-Wege-Ventil nie bei laufender Pumpe verstellen.", "g.filtre.s": ["Vorfilter: Pumpe aus, Skimmer- und Saugdüsenventile geschlossen, Deckel abgeschraubt, Korb geleert und gespült, dann alles wieder einsetzen", "Rückspülen: Ventil auf „Rückspülen“, Pumpe läuft bis das Wasser klar ist, dann aus", "Nachspülen: Ventil auf „Nachspülen“, 1 bis 2 Minuten, dann aus", "Ventil auf „Filtern“, Pumpe wieder starten", "Entkalken einmal im Jahr (zweimal bei sehr kalkhaltigem Wasser)"], "g.ph.h": "pH-Sonde kalibrieren", "g.ph.i": "Zu Saisonbeginn und nach jedem Sondenwechsel. Sie brauchen die Kalibrierlösungen pH 7 und pH 10, erhältlich in unseren Agenturen in Saint-Maximin und Aubagne.", "g.ph.s": ["Sonde abschrauben, Öffnung mit dem mitgelieferten Stopfen verschließen", "Gerät mit CAL-Taste: 3 s auf CAL, Sonde in pH 7, CAL; die Diode 7.0 bleibt stehen, wenn es fertig ist. LOW leuchtet: Sonde verbraucht", "Gerät mit Menü: 3 s auf V, Code CA, Sonde in pH 7, 2 Min., V; auf „Oh“ warten", "Abspülen, nicht abtrocknen, Sonde in pH 10, 2 Min., V; auf „Oh“ warten", "„Er“ angezeigt: Sonde am Ende der Lebensdauer, austauschen", "Stopfen entfernen und Sonde wieder einsetzen"], "g.hivchlore.h": "Überwinterung eines Chlorpools", "g.hivchlore.i": "Wir empfehlen die aktive Überwinterung: 1 bis 3 Std. Filterung täglich zwischen 4 und 6 Uhr morgens, wenn es friert. Das Wasser zirkuliert, die Technik friert nicht ein.", "g.hivchlore.s": ["Becken, Wasserlinie und Filter reinigen (rückspülen, nachspülen, entkalken)", "Warten, bis das Wasser dauerhaft unter 15 °C liegt", "pH zwischen 7,2 und 7,4; bei Bedarf Schockchlorung und 24 Std. Filterung", "Überwinterungsmittel, 4 Std. Filterung", "Filterzeit = Wassertemperatur ÷ 3", "Abdeckung optional; das Wasser ab und zu kontrollieren", "Sehr strenger Winter: abschalten, Filter und Pumpe entleeren", "Wieder in Betrieb nehmen im März/April, wenn das Wasser über 12 °C steigt"], "g.hivsel.h": "Überwinterung eines Salzwasserpools", "g.hivsel.i": "Dasselbe aktive Prinzip, mit ein paar Handgriffen zum Schutz von Elektrolyseur und pH-Sonde.", "g.hivsel.s": ["Becken, Wasserlinie und Filter reinigen (rückspülen, nachspülen, entkalken)", "Erst unter 15 °C die Elektrolyse abschalten (sonst verschleißen die Platten), die Filterung läuft weiter", "Überwinterungsmittel 2 bis 3 Std.; pH zwischen 7,2 und 7,4", "pH-Sonde frostfrei in Leitungswasser lagern, Stopfen auf die Leitung", "Schlauch der Schlauchpumpe spülen; Wasserkanister statt Korrekturmittel, Funktion „MA“", "Filterung nachts zwischen 4 und 6 Uhr; Plane oder Rollladen; pH einmal im Monat prüfen", "Strenger Frost angekündigt: alles ausschalten, Pumpe und Filter entleeren, Guizmo-Flasche in den Skimmer", "Wieder in Betrieb nehmen, wenn das Wasser über 15 °C steigt"], "acc.h": "Pool-Zubehör", "acc.lead": "Wasserpflege (Chlor, Salz, Brom), Abdeckplanen, Rollläden: Sie wählen Ihre Optionen mit unseren Beratern, und alles gibt es in unseren Agenturen.", "acc.mx9": "Hydraulischer Roboter Zodiac MX9: an die Saugdüse angeschlossen, fährt er mit der Kraft der Pumpe. Zyklonbürstung, Turbosaugung, X-Drive-Navigation, gezahnte Ketten.", "acc.dolphin": "Elektrischer Roboter Dolphin S300: für große Becken. Kompletter Zyklus in 2 Std. oder schnell in 1 Std.; Boden, Wände und Wasserlinie; aktive Bürste und Mehrschichtfilter.", "acc.pac": "Reversible Wärmepumpe: der effizienteste und sparsamste Weg zum Heizen oder Kühlen. Titanwärmetauscher mit 5 Jahren Garantie, salzwasserfest. Einbau durch uns, Angebot kostenlos.", "acc.electro": "Salzelektrolyseur: verwandelt Salz in natürliches, geruchloses, sanfteres Chlor. Mit einer pH-Regelung zu ergänzen.", "acc.ph": "pH-Dosierpumpe: Sonde misst laufend, pH bleibt zwischen 7,2 und 7,4. Sonde zu Saisonbeginn kalibrieren.", "acc.nage": "Gegenstromanlage: auf der Stelle schwimmen, auch in einem kleinen Becken, und Massagen genießen. Mit unseren Holz- und Betonpools kompatibel.", "acc.bache": "Französische Winterabdeckung: verstärktes PVC 550 g, UV-beständig und antibakteriell, doppelte Ösen, Regenwasserablauf. 5 Farben.", "acc.bulle": "Solarfolie nach Maß: 400 Mikron, UV-beständig, an 4 Seiten eingefasst. Ein paar Grad gewonnen, weniger Schmutz.", "acc.fontaine": "Edelstahlbrunnen.", "sec.h": "Poolsicherheit", "sec.lead": "Seit dem 1. Januar 2004 muss jeder neue Privatpool eine Sicherheitsvorrichtung haben; bestehende Pools seit dem 1. Januar 2006 (Gesetz vom 3. Januar 2003).", "sec.barriere": "Schutzzaun, NF P90-306: über 110 cm, Tür mit doppelter Verriegelung. Unserer: transparentes UV-beständiges Netz, 1,22 m hoch, Abschnitte von 1 bis 6 m, 5 Farben.", "sec.alarme": "Alarm, NF P90-307-1: unter Wasser (erkennt einen Sturz, Sirene integriert) oder als Umfeldüberwachung (4 Infrarotsäulen).", "sec.bache": "Abdeckung, NF P90-308: die Stabplane, UV- und pilzbeständig, sichert das ganze Jahr und hält die Wärme.", "sec.volet": "Rollladenabdeckung oberirdisch oder unter Wasser: Sicherheit, weniger Verdunstung, Wärme- und Produktverlust. Einbau durch uns.", "sec.abri": "Überdachung, NF P90-309: flach, verschiebbar oder abnehmbar, sie deckt das ganze Becken ab.", "realp.h": "Unsere Projekte", "realp.lead": "Holz, Alu, Schale, Beton, Gestaltung: 72 Baustellen im Var, in den Bouches-du-Rhône und in der ganzen Region.", "realp.f.bois": "Holzpool", "realp.f.alu": "Alupool", "realp.f.coque": "Schalenpool", "realp.f.beton": "Betonpool", "realp.f.amen": "Gestaltung", "about.h": "Über uns", "about.lead": "Florent Fondère arbeitet seit seinem 18. Lebensjahr mit Pools. Er wählte Holz wegen seiner Natürlichkeit und Eleganz.", "about.p1": "2016 meldet er ein Patent an: die Schönheit des Holzes bewahren, ohne bei der Technik Abstriche zu machen. So entstehen unsere Pools nach Maß und der Bausatz aus unserer Werkstatt für Heimwerker.", "about.p2": "Konstruktion aus Kiefer kesseldruckimprägniert Klasse IV, im gesamten Splintholz getränkt: langlebiger als Holz, das gesprüht oder getaucht wurde. Verkleidungen aus Ipé oder Padouk. Dazu eine Aluminiumversion, roh, RAL 8008 oder mit Holzmaserung.", "about.p3": "Dank des Erfolgs konnten wir eine zweite Agentur in Aubagne eröffnen, für die Bouches-du-Rhône. Jede hat ihre Shop-Ecke.", "about.p4": "Vier Konzepte: Polyesterschale, Holz nach Maß, Aluminium nach Maß, klassischer Beton. Unser Team macht alles: Erdarbeiten, Bodenplatte, Konstruktion, Liner, Filtration, und erklärt Ihnen beim Befüllen die Funktionsweise.", "about.equip": "Wärmepumpen, Elektrolyseure, pH-Pumpen, Alarme, Zäune, Abdeckungen, Rollläden, Roboter, Pflegeprodukte für Pool und Terrasse.", "about.social": "Folgen Sie unseren Baustellen auf Facebook und Instagram.", "tutos.h": "Video-Tutorials", "tutos.lead": "Bausatzmontage, Abdeckung, Zeitschaltuhr, Wärmepumpe, Elektrolyseur, pH-Sonde, Roboter: unsere Videos Schritt für Schritt.", "tutos.alu": "Aluminium-Premiumbausatz", "tutos.kit": "Holzbausatz", "tutos.util": "Anwendung", "tuto.alu1": "Nr. 1 – Winkelprofile setzen", "tuto.alu2": "Nr. 2 – UPN-Profile montieren", "tuto.alu3": "Nr. 3 – Aluminiumrohr befestigen", "tuto.alu4": "Nr. 4 – Bohlen einstecken", "tuto.alu5": "Nr. 5 – Skimmer einsetzen", "tuto.alu6": "Nr. 6 – Schiene installieren", "tuto.alu7": "Nr. 7 – Aluminium-Träger installieren", "tuto.alu8": "Nr. 8 – Sitzbank unter dem Liner montieren", "tuto.alu9": "Nr. 9 – Sitzbank mit Stufen montieren", "tuto.kit1": "Nr. 1 – Skimmer installieren", "tuto.kit2": "Nr. 2 – Einlaufdüse und Saugdüse", "tuto.kit3": "Nr. 3 – Option Scheinwerfer", "tuto.kit4": "Nr. 4 – Linereinbau vorbereiten", "tuto.kit5": "Nr. 5 – Liner einsetzen", "tuto.kit6": "Nr. 6 – Sitzbank oder Strand unter dem Liner", "tuto.u1": "Stabplane ausrollen", "tuto.u2": "Stabplane aufrollen", "tuto.u3": "So funktioniert die Zeitschaltuhr", "tuto.u4": "Wärmepumpe ein- und ausschalten", "tuto.u5": "Salzelektrolyseur in Betrieb nehmen", "tuto.u6": "pH-Sonde kalibrieren", "tuto.u7": "Filter rückspülen", "tuto.u8": "Den hydraulischen Roboter MX9 benutzen", "faq.h": "Häufige Fragen", "faq.legal": "Formalitäten", "faq.hiver": "Überwinterung", "faq.eau": "Wasserprobleme", "faq.mat": "Zubehör und Technik", "faq.items": [["legal", "Brauche ich eine Baugenehmigung?", "Nur für einen Pool über 100 m²."], ["legal", "Wird mein Pool besteuert?", "Er zählt als Nebengebäude: Wohnsteuer. Die Grundsteuer gilt für eingegrabene Pools (Beton, Holz, Schale); nur demontierbare oberirdische Pools sind davon befreit."], ["legal", "Muss ich die Gemeinde informieren?", "Bis 10 m² keine Meldung. Darüber eine Anmeldung beim Bauamt."], ["legal", "Erstellen Sie die Pläne für die Genehmigung?", "Nein. Ihre Gemeinde kann Ihnen eine Liste von Architekten geben (kostenpflichtig)."], ["hiver", "Warum überwintern?", "Um Frostschäden an Wänden und Filteranlage zu vermeiden."], ["hiver", "Wann überwintern?", "Wenn das Wasser unter 12 °C bleibt (15 °C bei einem Salzwasserpool)."], ["hiver", "Aktive oder passive Überwinterung?", "Aktiv in Regionen mit milden Wintern: reduzierte Filterung, Wasserpflege bleibt. Passiv in kalten Regionen: alles steht still."], ["eau", "Grünes, klares Wasser", "Oft eine zu niedrige Alkalinität und Algen: pH einstellen, TA-Plus zugeben, chloren und ein Algizid verwenden."], ["eau", "Grünes, trübes Wasser", "Algen (warmes Wasser, zu wenig Chlor, pH aus dem Gleichgewicht, hohe Härte, niedrige Alkalinität): testen, Schockchlorung, Algizid, Flockungsmittel."], ["eau", "Spinatgrünes Wasser", "Die Algen wuchern: Schockchlorung, Algizid, Flockungsmittel."], ["eau", "Grünes oder gelbes Wasser", "Wasser zu sauer, pH zu niedrig: pH-Plus zugeben."], ["eau", "Blaugrünes Wasser", "Zersetztes Kupfer (kupferhaltige Produkte oder Eisenhydrat, zu vermeiden): Frischwasser zugeben und neu ausgleichen."], ["eau", "Gelbes oder dunkelbraunes Wasser", "Zersetzende Pflanzenteile (Schockchlorung, Flockungsmittel) oder Metalle wie Eisen und Mangan (Metallbinder)."], ["eau", "Trübes Wasser, raue Wände", "Zu viel Kalk: Kalkschutzmittel verwenden."], ["eau", "Milchiges Wasser", "Kalk, pH-Schwankung, abgestorbene Algen … Testen, Schockbehandlung, bei Bedarf Flockungsmittel."], ["eau", "Weißliches Wasser", "Zerfallende Kalksalze: Flockungsmittel."], ["eau", "Weißliche Ablagerung am Boden", "Kalkstein: Wasserhärte prüfen und korrigieren."], ["eau", "Glitschiger Boden und Wände", "Beginnender Algenbefall: Wasser ausgleichen, ggf. pH senken, chloren, Algizid."], ["eau", "Fettrückstände an der Oberfläche", "Sonnencreme und -öl: saugfähige Tücher in den Skimmer legen."], ["eau", "Schwarzer Rand am Liner", "Schmutz an der Wasserlinie: Wasserlinienreiniger (
